<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>Halogenoalkanes – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA June 2018 · AS Paper 2", "q": "How many structural isomers with an unbranched carbon chain have the molecular formula C<sub>4<\/sub>H<sub>8<\/sub>Br<sub>2<\/sub>?", "o": ["4", "5", "6", "7"], "a": 2, "e": "On a straight four-carbon chain the Br atoms can be at 1,1; 1,2; 1,3; 1,4; 2,2 and 2,3: <b>six<\/b> isomers.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 2", "q": "How many structural isomers are there with the molecular formula C<sub>3<\/sub>H<sub>6<\/sub>BrCl?", "o": ["4", "5", "6", "7"], "a": 1, "e": "1-bromo-1-chloro, 1-bromo-2-chloro, 1-bromo-3-chloro, 2-bromo-1-chloro and 2-bromo-2-chloropropane: <b>five<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 2", "q": "Which species could act as a nucleophile?", "o": ["BH<sub>3<\/sub>", "NH<sub>4<\/sub><sup>+<\/sup>", "PH<sub>3<\/sub>", "SiH<sub>4<\/sub>"], "a": 2, "e": "A nucleophile is an electron-pair donor. PH<sub>3<\/sub> has a lone pair on phosphorus. BH<sub>3<\/sub> (empty orbital), NH<sub>4<\/sub><sup>+<\/sup> and SiH<sub>4<\/sub> have no lone pair to donate.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 2", "q": "Which species can act as a nucleophile?", "o": ["NH<sub>4<\/sub><sup>+<\/sup>", "CH<sub>3<\/sub>OH", "CH<sub>4<\/sub>", "H<sup>+<\/sup>"], "a": 1, "e": "The oxygen in CH<sub>3<\/sub>OH has two lone pairs it can donate. NH<sub>4<\/sub><sup>+<\/sup>, CH<sub>4<\/sub> and H<sup>+<\/sup> have no lone pairs.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 2", "q": "Which compound can react with ammonia to produce propylamine?", "o": ["CH<sub>3<\/sub>CH=CH<sub>2<\/sub>", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>OH", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>Br", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CH<sub>3<\/sub>"], "a": 2, "e": "Ammonia is a nucleophile and substitutes the Br in 1-bromopropane: CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>Br + 2NH<sub>3<\/sub> → CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub> + NH<sub>4<\/sub>Br.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "Which compound is formed from bromoethane in a nucleophilic substitution reaction?", "o": ["CH<sub>3<\/sub>CN", "CH<sub>3<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub>", "CH<sub>2<\/sub>=CH<sub>2<\/sub>", "CH<sub>3<\/sub>CH<sub>2<\/sub>OSO<sub>2<\/sub>OH"], "a": 1, "e": "NH<sub>3<\/sub> replaces Br to give ethylamine. Ethene would form by elimination; CN<sup>−<\/sup> would give CH<sub>3<\/sub>CH<sub>2<\/sub>CN (propanenitrile), not CH<sub>3<\/sub>CN.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "A two-step preparation of propylamine is: bromoethane → X → propylamine. What is X?", "o": ["CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub>", "CH<sub>3<\/sub>CH<sub>2<\/sub>CN", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>Br", "CH<sub>3<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub>"], "a": 1, "e": "Reacting bromoethane with KCN adds a carbon atom, forming propanenitrile CH<sub>3<\/sub>CH<sub>2<\/sub>CN. This is then reduced to propylamine CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub>.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 2", "q": "Which compound has the fastest rate of reaction with potassium cyanide to form pentanenitrile?", "o": ["1-bromobutane", "1-chlorobutane", "1-fluorobutane", "1-iodobutane"], "a": 3, "e": "The C–I bond has the lowest bond enthalpy, so it is broken most easily. Bond enthalpy, not bond polarity, determines the rate of substitution.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Separate samples of 1-chlorobutane, 1-bromobutane and 1-iodobutane are warmed with aqueous silver nitrate in ethanol. Which forms a precipitate first, and what colour is it?", "o": ["1-iodobutane; white", "1-bromobutane; cream", "1-chlorobutane; white", "1-iodobutane; yellow"], "a": 3, "e": "Water hydrolyses the C–X bond, releasing X<sup>−<\/sup> which precipitates as AgX. C–I is weakest, so iodide is released fastest and yellow AgI forms first.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 2", "q": "Which reaction does <b>not<\/b> result in a change in the shape around a carbon atom?", "o": ["chloromethane with aqueous sodium hydroxide", "ethene with bromine", "propane with excess oxygen", "propan-1-ol with acidified potassium dichromate(VI)"], "a": 0, "e": "CH<sub>3<\/sub>Cl → CH<sub>3<\/sub>OH: carbon stays tetrahedral (one substituent swapped for another). Ethene → dibromoethane (planar → tetrahedral), combustion forms linear CO<sub>2<\/sub>, and oxidation forms trigonal planar C=O.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 2", "q": "When 2-bromobutane is warmed with potassium hydroxide solution, substitution and elimination both occur. Which of these compounds is <b>not<\/b> produced?", "o": ["butan-1-ol", "butan-2-ol", "but-1-ene", "E-but-2-ene"], "a": 0, "e": "Substitution puts OH where Br was, on carbon 2 → butan-2-ol. Elimination can remove H from C1 or C3, giving but-1-ene and E/Z-but-2-ene. Butan-1-ol would need OH on carbon 1.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 2", "q": "2-Bromobutane is warmed with potassium hydroxide. What is the role of the hydroxide ions in the elimination reaction?", "o": ["base", "catalyst", "electrophile", "nucleophile"], "a": 0, "e": "In elimination OH<sup>−<\/sup> acts as a <b>base<\/b>, removing H<sup>+<\/sup> from the carbon next to C–Br. In substitution it acts as a nucleophile attacking the δ+ carbon.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 2", "q": "A halogenoalkane reacts with ethanolic KOH to form 2-ethylpent-1-ene, E- and Z-3-methylhex-2-ene, and E- and Z-3-methylhex-3-ene. Which halogenoalkane is it?", "o": ["1-bromo-2-ethylpentane", "2-bromo-3-methylhexane", "3-bromo-3-methylhexane", "3-bromo-4-methylhexane"], "a": 2, "e": "In 3-bromo-3-methylhexane the C–Br carbon has three different neighbouring carbons with H atoms (CH<sub>3<\/sub>, C2 and C4). Removing H from each gives the C=CH<sub>2<\/sub> alkene, the hex-2-enes and the hex-3-enes.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Each conversion uses KOH as a reactant. In which conversion does KOH <b>not<\/b> act as a base?", "o": ["(CH<sub>3<\/sub>)<sub>2<\/sub>NH<sub>2<\/sub><sup>+<\/sup>Br<sup>−<\/sup> to (CH<sub>3<\/sub>)<sub>2<\/sub>NH", "CH<sub>3<\/sub>COOH to CH<sub>3<\/sub>COO<sup>−<\/sup>K<sup>+<\/sup>", "CH<sub>3<\/sub>CH<sub>2<\/sub>Br to H<sub>2<\/sub>C=CH<sub>2<\/sub>", "CH<sub>3<\/sub>Br to CH<sub>3<\/sub>OH"], "a": 3, "e": "CH<sub>3<\/sub>Br → CH<sub>3<\/sub>OH is nucleophilic substitution: OH<sup>−<\/sup> acts as a nucleophile. In the other three it removes H<sup>+<\/sup>, acting as a base (including in elimination).", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which conditions favour elimination rather than substitution when bromoethane reacts with hydroxide ions?", "o": ["Warm, aqueous NaOH", "Cold, dilute aqueous NaOH", "Aqueous silver nitrate", "Hot, ethanolic KOH"], "a": 3, "e": "Ethanol as solvent and a high temperature favour elimination (forming ethene). Aqueous conditions favour substitution (forming ethanol).", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why are halogenoalkanes attacked by nucleophiles?", "o": ["The C–X bond is non-polar", "The C–X bond is polar, so the carbon atom is δ+", "The halogen atom has a lone pair", "Halogenoalkanes contain a C=C double bond"], "a": 1, "e": "Halogens are more electronegative than carbon, so the carbon bonded to the halogen is electron-deficient (δ+) and attracts electron-pair donors.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why is an excess of ammonia used when preparing ethylamine from bromoethane?", "o": ["To act as a catalyst", "To dissolve the bromoethane", "To prevent elimination forming ethene", "To reduce further substitution forming secondary and tertiary amines"], "a": 3, "e": "Ethylamine is itself a nucleophile and can react with more bromoethane. A large excess of NH<sub>3<\/sub> makes it far more likely that bromoethane reacts with ammonia than with the amine.", "t": null}, {"k": "practice", "s": "Practice question", "q": "1-Bromopropane is heated under reflux with KCN in aqueous ethanol. What is the organic product?", "o": ["propan-1-ol", "propene", "butanenitrile", "propanenitrile"], "a": 2, "e": "CN<sup>−<\/sup> substitutes for Br, adding one carbon atom: CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>Br + KCN → CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CN + KBr. The product has four carbons, including the nitrile carbon.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which halogenoalkane is tertiary?", "o": ["2-bromo-2-methylpropane", "1-bromo-2-methylpropane", "2-bromobutane", "1-bromobutane"], "a": 0, "e": "In a tertiary halogenoalkane the C–X carbon is bonded to three other carbon atoms. In 2-bromo-2-methylpropane, (CH<sub>3<\/sub>)<sub>3<\/sub>CBr, that is the case.", "t": null}, {"k": "past", "s": "AQA June 2023 · AS Paper 2", "q": "What is the atom economy for the formation of ethylamine in this reaction? &nbsp; CH<sub>3<\/sub>CH<sub>2<\/sub>Br + 2NH<sub>3<\/sub> → CH<sub>3<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub> + NH<sub>4<\/sub>Br", "o": ["31.5%", "35.7%", "36.1%", "41.3%"], "a": 0, "e": "Atom economy = M<sub>r<\/sub>(desired product) ÷ total M<sub>r<\/sub> of reactants × 100 = 45.0 ÷ (108.9 + 2 × 17.0) × 100 = <b>31.5%<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 2", "q": "CH<sub>2<\/sub>BrCH<sub>2<\/sub>Br + 2KCN → NCCH<sub>2<\/sub>CH<sub>2<\/sub>CN + 2KBr<br>M<sub>r<\/sub>: CH<sub>2<\/sub>BrCH<sub>2<\/sub>Br 187.8; KCN 65.1; NCCH<sub>2<\/sub>CH<sub>2<\/sub>CN 80.0; KBr 119.0. What is the percentage atom economy for butanedinitrile?", "o": ["100%", "40.2%", "31.6%", "25.2%"], "a": 3, "e": "Atom economy = 80.0 ÷ (187.8 + 2 × 65.1) × 100 = 80.0 ÷ 318.0 × 100 = <b>25.2%<\/b>. Remember the 2 in front of KCN.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 2", "q": "Which statement is <b>not<\/b> correct about ozone?", "o": ["It absorbs harmful ultraviolet radiation in the upper atmosphere.", "It decomposes to form oxygen.", "Its decomposition is catalysed by chlorine molecules.", "Ozone holes are regions of the upper atmosphere where there is a reduced concentration of ozone."], "a": 2, "e": "Ozone decomposition is catalysed by chlorine <b>radicals<\/b> (Cl•), formed when UV breaks C–Cl bonds in CFCs – not by Cl<sub>2<\/sub> molecules.", "t": null}, {"k": "past", "s": "AQA June 2023 · AS Paper 2", "q": "Most scientists believe that ozone in the upper atmosphere should not be allowed to become depleted. Which is a valid reason?", "o": ["Ozone absorbs ultraviolet radiation.", "Ozone helps to prevent global warming.", "Ozone helps to remove pollutants such as chloroalkanes.", "Ozone is an efficient disinfectant."], "a": 0, "e": "The ozone layer absorbs harmful UV radiation, which would otherwise increase the risk of skin cancer and cataracts.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 2", "q": "Which equation shows a step in the decomposition of ozone by free radicals formed from CFCs in the upper atmosphere?", "o": ["Cl• + O<sub>3<\/sub> → O<sub>2<\/sub> + ClO•", "Cl• + O<sub>3<\/sub> → ClO<sub>2<\/sub> + O•", "Cl• + O<sub>2<\/sub> → ClO• + O•", "ClO• + O<sub>3<\/sub> → ClO<sub>2<\/sub> + O<sub>2<\/sub>"], "a": 0, "e": "The two steps are Cl• + O<sub>3<\/sub> → ClO• + O<sub>2<\/sub> and ClO• + O<sub>3<\/sub> → 2O<sub>2<\/sub> + Cl•. The Cl• radical is regenerated, so it acts as a catalyst.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the overall equation for the decomposition of ozone catalysed by chlorine radicals?", "o": ["2O<sub>3<\/sub> + 2Cl• → 3O<sub>2<\/sub> + Cl<sub>2<\/sub>", "2O<sub>3<\/sub> → 3O<sub>2<\/sub>", "O<sub>3<\/sub> → O<sub>2<\/sub> + O", "O<sub>3<\/sub> + Cl• → ClO• + O<sub>2<\/sub>"], "a": 1, "e": "Adding the two propagation steps and cancelling the Cl• and ClO• that appear on both sides gives 2O<sub>3<\/sub> → 3O<sub>2<\/sub>. Chlorine radicals are regenerated, so one radical destroys thousands of ozone molecules.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
