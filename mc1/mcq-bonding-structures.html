<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonding and Crystal Structures – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which is the correct crystal structure for the substance named?", "o": ["Iodine – simple molecular", "Diamond – ionic", "Sodium chloride – giant covalent", "Graphite – metallic"], "a": 0, "e": "Iodine is a simple molecular (molecular crystal) lattice of I<sub>2<\/sub> molecules. Diamond and graphite are giant covalent (macromolecular); sodium chloride is giant ionic.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "Which statement about inorganic ionic compounds is always correct?", "o": ["They dissolve in water to give neutral solutions.", "They release energy when they melt.", "They contain metal cations.", "They form giant structures."], "a": 3, "e": "All ionic compounds form giant lattices of oppositely charged ions. Some are insoluble or give acidic/alkaline solutions; melting is endothermic; NH<sub>4<\/sub>Cl has no metal cation.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "In which substance do covalent bonds break when it melts?", "o": ["hexane", "ice", "iodine", "silicon dioxide"], "a": 3, "e": "SiO<sub>2<\/sub> is giant covalent (macromolecular), so melting means breaking strong Si–O covalent bonds. In hexane, ice and iodine only the forces <i>between<\/i> molecules are overcome.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "Which substance contains delocalised electrons?", "o": ["cyclohexane", "graphite", "iodine", "sodium chloride"], "a": 1, "e": "In graphite each carbon forms three covalent bonds; the fourth outer electron is delocalised between the layers, which is why graphite conducts electricity.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "Which substance has no delocalised electrons?", "o": ["graphite", "methylbenzene", "poly(propene)", "sodium"], "a": 2, "e": "Poly(propene) is a saturated polymer with only single C–C and C–H bonds. Graphite, the benzene ring in methylbenzene and metallic sodium all have delocalised electrons.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "Which substance has significant electron delocalisation?", "o": ["graphite", "iodine", "sodium chloride", "tetrachloromethane"], "a": 0, "e": "Graphite has one delocalised electron per carbon atom spread across each layer. The others have electrons localised in covalent bonds or on ions.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "Which is <b>not<\/b> responsible for conduction of electricity?", "o": ["The sodium ions in molten sodium chloride", "The electrons between layers of carbon atoms in graphite", "The bonding electrons in a metal", "The lone pair electrons on water molecules"], "a": 3, "e": "Conduction needs mobile charged particles. Ions move in molten NaCl; delocalised electrons move in graphite and metals. Lone pairs on water molecules are not free to move – pure water is a very poor conductor.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2018 · AS Paper 1", "q": "Which types of bonding are present in solid ammonium chloride, NH<sub>4<\/sub>Cl?", "o": ["Covalent and dative covalent only", "Covalent and ionic only", "Covalent, dative covalent and ionic", "Dative covalent and ionic only"], "a": 2, "e": "NH<sub>4<\/sub><sup>+<\/sup> contains three covalent N–H bonds and one dative N→H bond (from the lone pair on NH<sub>3<\/sub> to H<sup>+<\/sup>). The NH<sub>4<\/sub><sup>+<\/sup> and Cl<sup>−<\/sup> ions are held by ionic bonding.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Which involves the formation of a dative covalent bond?", "o": ["PCl<sub>3<\/sub> + Cl<sub>2<\/sub> → PCl<sub>5<\/sub>", "Na<sup>+<\/sup> + H<sup>−<\/sup> → NaH", "Mg + Cl<sub>2<\/sub> → MgCl<sub>2<\/sub>", "BH<sub>3<\/sub> + H<sup>−<\/sup> → BH<sub>4<\/sub><sup>−<\/sup>"], "a": 3, "e": "H<sup>−<\/sup> donates its lone pair into the empty orbital on boron (BH<sub>3<\/sub> has only 6 outer electrons). B and C form ionic compounds; in A each new P–Cl bond has one electron from each atom.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which compound contains a co-ordinate bond?", "o": ["HF", "NH<sub>3<\/sub>", "CHCl<sub>3<\/sub>", "NH<sub>4<\/sub>Cl"], "a": 3, "e": "In NH<sub>4<\/sub><sup>+<\/sup>, nitrogen's lone pair is donated to H<sup>+<\/sup> to form a co-ordinate (dative) bond. The other molecules only have ordinary covalent bonds.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which molecule is <b>not<\/b> able to form a co-ordinate bond with another species?", "o": ["BH<sub>3<\/sub>", "CH<sub>4<\/sub>", "NH<sub>3<\/sub>", "H<sub>2<\/sub>O"], "a": 1, "e": "To form a co-ordinate bond a species needs either a lone pair to donate (NH<sub>3<\/sub>, H<sub>2<\/sub>O) or an empty orbital to accept one (BH<sub>3<\/sub>). CH<sub>4<\/sub> has neither.", "t": null}, {"k": "past", "s": "AQA June 2023 · AS Paper 1", "q": "Which molecule can accept an electron pair during the formation of a co-ordinate bond?", "o": ["NH<sub>3<\/sub>", "AlCl<sub>3<\/sub>", "SiH<sub>4<\/sub>", "PCl<sub>3<\/sub>"], "a": 1, "e": "Aluminium in AlCl<sub>3<\/sub> has only six outer electrons, so it has an empty orbital to accept a lone pair (e.g. forming Al<sub>2<\/sub>Cl<sub>6<\/sub> or AlCl<sub>4<\/sub><sup>−<\/sup>). NH<sub>3<\/sub> and PCl<sub>3<\/sub> are donors; SiH<sub>4<\/sub> has a full octet.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "AsH<sub>3<\/sub> + H<sup>+<\/sup> → AsH<sub>4<\/sub><sup>+<\/sup> &nbsp; What type of interaction forms in this reaction?", "o": ["Co-ordinate bond", "Dipole–dipole force", "Hydrogen bond", "Ionic bond"], "a": 0, "e": "Arsenic (Group 5, like N) has a lone pair, which it donates to H<sup>+<\/sup>, forming a co-ordinate bond – just like NH<sub>3<\/sub> + H<sup>+<\/sup> → NH<sub>4<\/sub><sup>+<\/sup>.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which represents the correct order of <b>increasing<\/b> radius of the ions?", "o": ["F<sup>−<\/sup> &lt; O<sup>2−<\/sup> &lt; Li<sup>+<\/sup> &lt; Be<sup>2+<\/sup>", "Li<sup>+<\/sup> &lt; Be<sup>2+<\/sup> &lt; O<sup>2−<\/sup> &lt; F<sup>−<\/sup>", "Be<sup>2+<\/sup> &lt; Li<sup>+<\/sup> &lt; F<sup>−<\/sup> &lt; O<sup>2−<\/sup>", "O<sup>2−<\/sup> &lt; F<sup>−<\/sup> &lt; Li<sup>+<\/sup> &lt; Be<sup>2+<\/sup>"], "a": 2, "e": "Li<sup>+<\/sup> and Be<sup>2+<\/sup> have only the 1s shell; Be<sup>2+<\/sup> has more protons so is smaller. F<sup>−<\/sup> and O<sup>2−<\/sup> are isoelectronic (10 electrons); O<sup>2−<\/sup> has fewer protons pulling on them, so it is the largest.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which ion has the largest radius?", "o": ["F<sup>−<\/sup>", "Mg<sup>2+<\/sup>", "Na<sup>+<\/sup>", "O<sup>2−<\/sup>"], "a": 3, "e": "All four ions have 10 electrons (1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup>). O<sup>2−<\/sup> has the fewest protons (8), so the electrons are held least tightly and the ion is largest.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · AS Paper 1", "q": "Why is the melting point of magnesium higher than that of sodium?", "o": ["Mg<sup>2+<\/sup> ions have a higher charge and there are more delocalised electrons, so the metallic bonding is stronger", "Magnesium atoms are larger than sodium atoms", "Magnesium has stronger van der Waals forces between its atoms", "Magnesium forms covalent bonds between its atoms"], "a": 0, "e": "Metallic bonding is the attraction between positive ions and delocalised electrons. Mg<sup>2+<\/sup> is smaller and more highly charged than Na<sup>+<\/sup>, and each atom contributes 2 delocalised electrons, so the attraction is stronger.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2021 · AS Paper 1", "q": "Why does magnesium chloride have a high melting point?", "o": ["It has strong hydrogen bonds between its molecules", "Its molecules have permanent dipoles", "It has a giant ionic lattice with strong electrostatic attraction between oppositely charged ions", "It has strong covalent bonds between Mg and Cl atoms"], "a": 2, "e": "MgCl<sub>2<\/sub> is giant ionic: a great deal of energy is needed to overcome the many strong attractions between Mg<sup>2+<\/sup> and Cl<sup>−<\/sup> ions throughout the lattice. It is not made of molecules.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · AS Paper 1", "q": "Which describes the structure and bonding in magnesium?", "o": ["A giant covalent structure of Mg atoms", "A lattice of Mg<sup>2+<\/sup> ions surrounded by delocalised electrons", "A lattice of Mg atoms held by van der Waals forces", "Mg<sup>2+<\/sup> and Mg<sup>2−<\/sup> ions held by ionic bonds"], "a": 1, "e": "Magnesium is metallic: a regular lattice of positive ions (Mg<sup>2+<\/sup>) in a \"sea\" of delocalised electrons, held by the electrostatic attraction between them.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why does graphite conduct electricity but diamond does not?", "o": ["Each carbon in graphite forms three covalent bonds, leaving one delocalised electron per atom", "Graphite contains ions that are free to move", "Graphite has weak van der Waals forces between layers", "Diamond has no electrons in its outer shell"], "a": 0, "e": "In diamond all four outer electrons are used in covalent bonds. In graphite only three are, and the fourth is delocalised along the layers, so it can carry a current.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why is graphite soft and slippery?", "o": ["It contains delocalised electrons", "Each carbon atom forms four covalent bonds", "Weak forces between the layers allow them to slide over each other", "The covalent bonds within each layer are weak"], "a": 2, "e": "The layers in graphite are held together only by weak van der Waals forces, so they slide easily. The C–C covalent bonds within each layer are very strong, which is why graphite has a very high melting point.", "t": null}, {"k": "practice", "s": "Practice question", "q": "When iodine is heated it turns into a purple vapour at a low temperature. What happens to the iodine?", "o": ["Metallic bonds break", "Weak van der Waals forces between I<sub>2<\/sub> molecules are overcome", "Covalent bonds between iodine atoms break", "Ionic bonds between iodine ions break"], "a": 1, "e": "Iodine is simple molecular. Only the weak van der Waals forces between I<sub>2<\/sub> molecules are overcome; the strong I–I covalent bond in each molecule stays intact.", "t": null}, {"k": "practice", "s": "Practice question", "q": "When does sodium chloride conduct electricity?", "o": ["Only when molten or dissolved in water, because the ions are then free to move", "When solid, because it contains ions", "When solid, because it contains delocalised electrons", "Never, because it is ionic"], "a": 0, "e": "In solid NaCl the ions are fixed in the lattice. When molten or in solution, the ions are free to move and carry charge. Ionic compounds have no delocalised electrons.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why is ice less dense than liquid water?", "o": ["Ice contains air bubbles", "Van der Waals forces are weaker in ice", "Hydrogen bonds hold the molecules in an open lattice, further apart than in the liquid", "Covalent bonds in ice are longer"], "a": 2, "e": "In ice each H<sub>2<\/sub>O molecule forms hydrogen bonds to four others in a rigid, open tetrahedral lattice, holding them further apart than in liquid water.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why are metals malleable?", "o": ["Metals contain ions that are free to move", "Layers of positive ions can slide over each other while still held by the delocalised electrons", "The metallic bonds are weak", "Metal atoms are held by van der Waals forces"], "a": 1, "e": "When a force is applied, layers of ions slide past one another but the delocalised electrons keep holding them together, so the metal changes shape without breaking.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which substance has a giant covalent (macromolecular) structure?", "o": ["Silicon dioxide", "Sodium chloride", "Carbon dioxide", "Magnesium"], "a": 0, "e": "SiO<sub>2<\/sub> is a giant lattice of Si and O atoms joined by covalent bonds. NaCl is giant ionic, Mg is metallic and CO<sub>2<\/sub> is simple molecular.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
