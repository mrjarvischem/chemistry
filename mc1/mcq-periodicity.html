<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Periodicity – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

melting point.", "Sulfur is the most electronegative.", "Chlorine has the highest first ionisation energy."], "a": 3, "e": "Across the period the nuclear charge increases with similar shielding, so IE increases and radius decreases. Chlorine has the highest IE and electronegativity and the smallest radius; silicon has the highest melting point.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Which statement about trends from left to right across Period 3 is correct?", "o": ["Atomic radius increases from Na to Si and then decreases", "Atomic radius decreases", "First ionisation energy decreases", "Electronegativity decreases"], "a": 1, "e": "More protons with electrons added to the same shell (similar shielding) pull the outer electrons closer, so atomic radius decreases. IE and electronegativity generally increase.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Which row correctly shows general trends in properties across Period 3?", "o": ["Atomic radius decreases; first ionisation energy increases", "Atomic radius decreases; first ionisation energy decreases", "Atomic radius increases; first ionisation energy increases", "Atomic radius increases; first ionisation energy decreases"], "a": 0, "e": "Nuclear charge increases across the period while shielding stays about the same, so electrons are pulled closer (smaller radius) and are harder to remove (higher IE).", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Which statement about ionisation energies in Period 3 is <b>not<\/b> correct?", "o": ["The first ionisation energy of Mg is greater than that of Na", "The first ionisation energy of Al is less than that of Mg", "The first ionisation energy of P is less than that of S", "Ar has the highest first ionisation energy in the period."], "a": 2, "e": "P (3p<sup>3<\/sup>) has a <b>higher<\/b> first IE than S (3p<sup>4<\/sup>). In S the electron is removed from a 3p orbital containing a pair, and repulsion between the paired electrons makes it easier to remove.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "Which element has the highest first ionisation energy?", "o": ["Aluminium", "Phosphorus", "Silicon", "Sulfur"], "a": 1, "e": "IE rises across the period, but sulfur dips below phosphorus because of paired-electron repulsion in a 3p orbital. So phosphorus is highest of these four.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which of these has the highest first ionisation energy?", "o": ["Na", "Al", "Si", "Cl"], "a": 3, "e": "Chlorine has the greatest nuclear charge of these, with outer electrons in the same shell and similar shielding, so its outer electron is held most strongly.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which element has a first ionisation energy lower than that of sulfur?", "o": ["Chlorine", "Oxygen", "Phosphorus", "Selenium"], "a": 3, "e": "Selenium is below sulfur in Group 6: its outer electron is in a higher shell, further from the nucleus and more shielded, so it is easier to remove. Cl and P are higher than S; O is above S in the group.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Which element is in the p block in the Periodic Table?", "o": ["Radium", "Radon", "Rhenium", "Roentgenium"], "a": 1, "e": "Radon is a noble gas (Group 0), whose outer electrons are in p orbitals. Radium is s block; rhenium and roentgenium are d block.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "Which block in the Periodic Table contains the element samarium (Sm)?", "o": ["d block", "f block", "p block", "s block"], "a": 1, "e": "Samarium (Z = 62) is a lanthanide, so its highest-energy electrons are in 4f orbitals: f block.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which element is classified as a d block element?", "o": ["Antimony", "Molybdenum", "Strontium", "Uranium"], "a": 1, "e": "Molybdenum is in the second transition series. Antimony is p block, strontium s block and uranium f block.", "t": null}, {"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Which element forms an ionic oxide that reacts with strong alkalis?", "o": ["Aluminium", "Magnesium", "Sodium", "Sulfur"], "a": 0, "e": "Al<sub>2<\/sub>O<sub>3<\/sub> is ionic but <b>amphoteric<\/b>: it reacts with acids and with strong alkalis (Al<sub>2<\/sub>O<sub>3<\/sub> + 2NaOH + 3H<sub>2<\/sub>O → 2NaAl(OH)<sub>4<\/sub>). Na<sub>2<\/sub>O and MgO are basic; sulfur oxides are covalent.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "In which oxide is the named element in its highest oxidation state?", "o": ["chlorine in ClO<sub>2<\/sub>", "magnesium in MgO", "nitrogen in N<sub>2<\/sub>O<sub>4<\/sub>", "sulfur in SO<sub>2<\/sub>"], "a": 1, "e": "Mg is +2 in MgO, its maximum (Group 2). Cl is +4 (maximum +7), N is +4 (maximum +5) and S is +4 (maximum +6).", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "0.100 mol of each oxide is added to separate 1.00 dm<sup>3<\/sup> samples of water. Which oxide produces the solution with the lowest pH?", "o": ["MgO", "Al<sub>2<\/sub>O<sub>3<\/sub>", "SO<sub>2<\/sub>", "SO<sub>3<\/sub>"], "a": 3, "e": "SO<sub>3<\/sub> + H<sub>2<\/sub>O → H<sub>2<\/sub>SO<sub>4<\/sub>, a strong acid (pH about 0–1). SO<sub>2<\/sub> gives the weak acid H<sub>2<\/sub>SO<sub>3<\/sub>; MgO gives a weakly alkaline solution; Al<sub>2<\/sub>O<sub>3<\/sub> is insoluble.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Equal amounts of three Period 3 elements are added to separate 100 cm<sup>3<\/sup> samples of water. Which list shows the solutions in order of <b>decreasing<\/b> pH?", "o": ["chlorine &gt; magnesium &gt; sodium", "chlorine &gt; sodium &gt; magnesium", "magnesium &gt; sodium &gt; chlorine", "sodium &gt; magnesium &gt; chlorine"], "a": 3, "e": "Sodium forms soluble NaOH (pH about 14). Magnesium forms sparingly soluble Mg(OH)<sub>2<\/sub> (pH about 10). Chlorine forms HCl and HClO (acidic).", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · Paper 3", "q": "Which correctly classifies the structures of the Period 3 oxides?", "o": ["Giant ionic: Na<sub>2<\/sub>O, MgO, Al<sub>2<\/sub>O<sub>3<\/sub>; giant covalent: SiO<sub>2<\/sub>; simple molecular: P<sub>4<\/sub>O<sub>10<\/sub>, SO<sub>3<\/sub>", "Giant ionic: Na<sub>2<\/sub>O, MgO; giant covalent: Al<sub>2<\/sub>O<sub>3<\/sub>, SiO<sub>2<\/sub>; simple molecular: P<sub>4<\/sub>O<sub>10<\/sub>, SO<sub>3<\/sub>", "Giant ionic: Na<sub>2<\/sub>O, MgO, Al<sub>2<\/sub>O<sub>3<\/sub>; giant covalent: SiO<sub>2<\/sub>, P<sub>4<\/sub>O<sub>10<\/sub>; simple molecular: SO<sub>3<\/sub>", "Giant ionic: Na<sub>2<\/sub>O; giant covalent: MgO, Al<sub>2<\/sub>O<sub>3<\/sub>, SiO<sub>2<\/sub>; simple molecular: P<sub>4<\/sub>O<sub>10<\/sub>, SO<sub>3<\/sub>"], "a": 0, "e": "Metal oxides (Na, Mg, Al) are ionic with high melting points; SiO<sub>2<\/sub> is macromolecular; P<sub>4<\/sub>O<sub>10<\/sub> and SO<sub>3<\/sub> are simple molecules with low melting points.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which equation shows the reaction of phosphorus(V) oxide with water?", "o": ["P<sub>4<\/sub>O<sub>10<\/sub> + 6H<sub>2<\/sub>O → 4H<sub>3<\/sub>PO<sub>3<\/sub> + 2O<sub>2<\/sub>", "P<sub>4<\/sub>O<sub>10<\/sub> + 10H<sub>2<\/sub>O → 4P(OH)<sub>5<\/sub>", "P<sub>4<\/sub>O<sub>10<\/sub> + 6H<sub>2<\/sub>O → 4H<sub>3<\/sub>PO<sub>4<\/sub>", "P<sub>4<\/sub>O<sub>10<\/sub> + 2H<sub>2<\/sub>O → 4HPO<sub>3<\/sub> + H<sub>2<\/sub>"], "a": 2, "e": "P<sub>4<\/sub>O<sub>10<\/sub> is an acidic oxide. It reacts vigorously with water to form phosphoric(V) acid, H<sub>3<\/sub>PO<sub>4<\/sub>.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Magnesium oxide is added to water. What is the approximate pH of the solution formed?", "o": ["1", "7", "9", "14"], "a": 2, "e": "MgO + H<sub>2<\/sub>O → Mg(OH)<sub>2<\/sub>, which is only sparingly soluble, so the solution is only weakly alkaline (about pH 9–10). Na<sub>2<\/sub>O gives pH 14 because NaOH is very soluble.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Silicon dioxide does not react with water. Which reaction shows that it is an acidic oxide?", "o": ["SiO<sub>2<\/sub> + 2NaOH → Na<sub>2<\/sub>SiO<sub>3<\/sub> + H<sub>2<\/sub>O", "SiO<sub>2<\/sub> + 4HCl → SiCl<sub>4<\/sub> + 2H<sub>2<\/sub>O", "SiO<sub>2<\/sub> + H<sub>2<\/sub>O → H<sub>2<\/sub>SiO<sub>3<\/sub>", "SiO<sub>2<\/sub> + 2H<sub>2<\/sub> → Si + 2H<sub>2<\/sub>O"], "a": 0, "e": "SiO<sub>2<\/sub> is insoluble in water, but it reacts with hot concentrated NaOH to form sodium silicate – showing it is acidic. It does not react with HCl.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which statement about aluminium oxide is correct?", "o": ["It reacts with both hydrochloric acid and sodium hydroxide", "It reacts with water to form an alkaline solution", "It is a simple molecular substance", "It reacts only with acids"], "a": 0, "e": "Al<sub>2<\/sub>O<sub>3<\/sub> is amphoteric. With acid: Al<sub>2<\/sub>O<sub>3<\/sub> + 6HCl → 2AlCl<sub>3<\/sub> + 3H<sub>2<\/sub>O. With alkali: Al<sub>2<\/sub>O<sub>3<\/sub> + 2NaOH + 3H<sub>2<\/sub>O → 2NaAl(OH)<sub>4<\/sub>. It is insoluble in water.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why does P<sub>4<\/sub>O<sub>10<\/sub> have a much lower melting point than SiO<sub>2<\/sub>?", "o": ["P–O bonds are much weaker than Si–O bonds", "P<sub>4<\/sub>O<sub>10<\/sub> is ionic", "SiO<sub>2<\/sub> has hydrogen bonds between its molecules", "P<sub>4<\/sub>O<sub>10<\/sub> is simple molecular, so only weak forces between molecules are overcome; SiO<sub>2<\/sub> is giant covalent"], "a": 3, "e": "Melting P<sub>4<\/sub>O<sub>10<\/sub> only needs van der Waals and dipole–dipole forces between molecules to be overcome. Melting SiO<sub>2<\/sub> requires breaking strong covalent bonds throughout the giant lattice.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why does atomic radius decrease across Period 3 from sodium to chlorine?", "o": ["Shielding increases across the period", "The atoms gain more neutrons", "Nuclear charge increases while shielding stays about the same, so the outer electrons are pulled closer", "More electron shells are added across the period"], "a": 2, "e": "Across Period 3 each element has one more proton, but the extra electron goes into the same (third) shell, so shielding barely changes. The greater nuclear attraction pulls the outer electrons in.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
