<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group 2 – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Which products are formed when magnesium reacts with steam?", "o": ["Magnesium hydroxide and hydrogen", "Magnesium hydroxide and oxygen", "Magnesium oxide and hydrogen", "Magnesium oxide and oxygen"], "a": 2, "e": "Mg(s) + H<sub>2<\/sub>O(g) → MgO(s) + H<sub>2<\/sub>(g). With steam, magnesium forms the oxide; with cold water it reacts very slowly to form Mg(OH)<sub>2<\/sub>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · AS Paper 1", "q": "Which observations are made when magnesium is heated in steam?", "o": ["Effervescence and a colourless solution forms", "An orange flame and a grey solid forms", "A white precipitate and effervescence", "A bright white light and a white solid forms"], "a": 3, "e": "Magnesium burns with a <b>bright white light<\/b> in steam, producing white magnesium oxide powder: Mg(s) + H<sub>2<\/sub>O(g) → MgO(s) + H<sub>2<\/sub>(g).", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "What is the correct observation when barium metal is added to an excess of water?", "o": ["Forms a colourless solution only", "Forms a colourless solution and effervesces", "Forms a white precipitate only", "Forms a white precipitate and effervesces"], "a": 1, "e": "Ba + 2H<sub>2<\/sub>O → Ba(OH)<sub>2<\/sub> + H<sub>2<\/sub>. Hydrogen causes effervescence, and Ba(OH)<sub>2<\/sub> is the most soluble Group 2 hydroxide, so it dissolves in excess water to give a colourless solution.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "A piece of strontium is added to an excess of water. Which observation is correct and complete?", "o": ["Colourless solution", "Colourless solution and effervescence", "Dense white precipitate", "Dense white precipitate and effervescence"], "a": 1, "e": "Sr + 2H<sub>2<\/sub>O → Sr(OH)<sub>2<\/sub> + H<sub>2<\/sub>. Hydrogen gas fizzes, and Sr(OH)<sub>2<\/sub> is soluble enough to dissolve in an excess of water.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Which property of the Group 2 elements increases with increasing atomic number?", "o": ["Atomic radius", "Electronegativity", "First ionisation energy", "Melting point"], "a": 0, "e": "Down the group each element has an extra shell of electrons, so atomic radius increases. Electronegativity, first ionisation energy and (generally) melting point all decrease.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "Which statement is <b>not<\/b> correct?", "o": ["Strontium has a lower first ionisation energy than calcium.", "Strontium has a larger ionic radius than calcium.", "Strontium reacts less vigorously with water than calcium.", "Strontium hydroxide is more soluble in water than calcium hydroxide."], "a": 2, "e": "Reactivity with water <b>increases<\/b> down Group 2 because the outer electrons are lost more easily. The other three statements follow the normal trends.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "Which property would you expect the element radium, Ra, to possess?", "o": ["It forms a soluble sulfate.", "It does not react with water.", "It is a good conductor of electricity.", "It forms a covalent fluoride."], "a": 2, "e": "Radium is a metal (metallic bonding with delocalised electrons), so it conducts. Following the trends, RaSO<sub>4<\/sub> is insoluble, Ra reacts vigorously with water and RaF<sub>2<\/sub> is ionic.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "Which statement about barium sulfate is correct?", "o": ["It is soluble in water at a temperature of 100 °C.", "It is used in medicine because it does not dissolve in body fluids.", "It is a pale yellow solid.", "It reacts with acidified barium chloride solution."], "a": 1, "e": "BaSO<sub>4<\/sub> is a white, insoluble solid. Because it is insoluble, the toxic Ba<sup>2+<\/sup> ions are not absorbed, so it can be swallowed as a \"barium meal\" for X-rays.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "What is a use for barium sulfate?", "o": ["In agriculture to act as a fertiliser", "In agriculture to neutralise acidic soil", "In medicine to produce an X-ray image", "In medicine as an antacid to treat indigestion"], "a": 2, "e": "BaSO<sub>4<\/sub> absorbs X-rays and is insoluble, so it outlines the gut in X-ray images. Ca(OH)<sub>2<\/sub> neutralises soil; Mg(OH)<sub>2<\/sub> is the antacid.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "Which compound is used to treat the symptoms of indigestion?", "o": ["MgO", "Mg(OH)<sub>2<\/sub>", "CaO", "Ca(OH)<sub>2<\/sub>"], "a": 1, "e": "Magnesium hydroxide (\"milk of magnesia\") neutralises excess stomach acid: Mg(OH)<sub>2<\/sub> + 2HCl → MgCl<sub>2<\/sub> + 2H<sub>2<\/sub>O.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · Paper 1", "q": "Why is magnesium hydroxide safer than sodium hydroxide as a treatment for indigestion?", "o": ["Mg(OH)<sub>2<\/sub> does not react with hydrochloric acid", "Mg<sup>2+<\/sup> ions are less toxic than Na<sup>+<\/sup> ions", "Mg(OH)<sub>2<\/sub> is a stronger base than NaOH", "Mg(OH)<sub>2<\/sub> is only sparingly soluble, so the concentration of OH<sup>−<\/sup> ions is low"], "a": 3, "e": "NaOH is very soluble and gives a high [OH<sup>−<\/sup>], which is corrosive. Mg(OH)<sub>2<\/sub> is sparingly soluble, so it neutralises acid gradually with only a low [OH<sup>−<\/sup>] in solution.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 1", "q": "Which is <b>not<\/b> a correct statement about magnesium hydroxide?", "o": ["It has the empirical formula H<sub>2<\/sub>MgO<sub>2<\/sub>", "It is sparingly soluble in water", "It is used to neutralise stomach acid", "It forms a solution with pH = 14 at 25 °C"], "a": 3, "e": "Mg(OH)<sub>2<\/sub> is only sparingly soluble, so its saturated solution has a low [OH<sup>−<\/sup>] and a pH of about 10 – nowhere near 14.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2017 · Paper 1", "q": "Saturated calcium hydroxide solution at 10 °C contains 0.0131 mol dm<sup>−3<\/sup> Ca(OH)<sub>2<\/sub>. A student adds 0.0131 mol of Mg(OH)<sub>2<\/sub> to 1.00 dm<sup>3<\/sup> of water at 10 °C and stirs until no more dissolves. How does the pH compare?", "o": ["Mg(OH)<sub>2<\/sub> solution has a higher pH, because Mg(OH)<sub>2<\/sub> is more soluble", "The pH values are the same, because the same number of moles were added", "Mg(OH)<sub>2<\/sub> solution has a higher pH, because Mg is higher in the group", "Mg(OH)<sub>2<\/sub> solution has a lower pH, because Mg(OH)<sub>2<\/sub> is less soluble"], "a": 3, "e": "Group 2 hydroxide solubility increases down the group. Most of the Mg(OH)<sub>2<\/sub> stays undissolved, so [OH<sup>−<\/sup>] is much lower and the pH is lower.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "Which substance is used to reduce titanium(IV) chloride in the extraction of titanium metal?", "o": ["Magnesium", "Manganese", "Vanadium", "Zinc"], "a": 0, "e": "TiCl<sub>4<\/sub> + 2Mg → Ti + 2MgCl<sub>2<\/sub>. Magnesium is the reducing agent.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · AS Paper 1", "q": "In the extraction of titanium, TiCl<sub>4<\/sub> + 2Mg → Ti + 2MgCl<sub>2<\/sub>. Why is magnesium described as the reducing agent?", "o": ["Its oxidation state decreases from +2 to 0, so it gains electrons", "It removes oxygen from titanium", "It is a catalyst for the reaction", "Its oxidation state increases from 0 to +2, so it loses electrons"], "a": 3, "e": "A reducing agent donates electrons and is itself oxidised. Mg goes from 0 to +2 in MgCl<sub>2<\/sub>, while titanium goes from +4 to 0 (reduced). There is no oxygen in this reaction.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · Paper 1", "q": "Which calcium compounds are used to (i) decrease the acidity of soil and (ii) remove SO<sub>2<\/sub> from power station flue gases?", "o": ["(i) Ca(OH)<sub>2<\/sub> &nbsp; (ii) CaO or CaCO<sub>3<\/sub>", "(i) CaSO<sub>4<\/sub> &nbsp; (ii) Ca(OH)<sub>2<\/sub>", "(i) CaCl<sub>2<\/sub> &nbsp; (ii) CaO or CaCO<sub>3<\/sub>", "(i) CaO &nbsp; (ii) CaSO<sub>4<\/sub>"], "a": 0, "e": "Slaked lime, Ca(OH)<sub>2<\/sub>, neutralises acid in soil. CaO or CaCO<sub>3<\/sub> reacts with acidic SO<sub>2<\/sub> in flue gas desulfurisation, e.g. CaO + SO<sub>2<\/sub> → CaSO<sub>3<\/sub>.", "t": null}, {"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Some 1.0 mol dm<sup>−3<\/sup> solutions were mixed using equal volumes of each. Which pair gives the greatest mass of solid?", "o": ["Ba(OH)<sub>2<\/sub> and MgCl<sub>2<\/sub>", "Ba(OH)<sub>2<\/sub> and MgSO<sub>4<\/sub>", "Ba(OH)<sub>2<\/sub> and NaCl", "Ba(OH)<sub>2<\/sub> and Na<sub>2<\/sub>SO<sub>4<\/sub>"], "a": 1, "e": "Ba(OH)<sub>2<\/sub> + MgSO<sub>4<\/sub> gives <b>two<\/b> precipitates: BaSO<sub>4<\/sub> (insoluble) and Mg(OH)<sub>2<\/sub> (sparingly soluble). A gives only Mg(OH)<sub>2<\/sub>, D only BaSO<sub>4<\/sub>, and C gives none.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "An aqueous solution of a salt gives a white precipitate when mixed with aqueous silver nitrate <b>and<\/b> when mixed with dilute sulfuric acid. Which could be the salt?", "o": ["BaCl<sub>2<\/sub>", "(NH<sub>4<\/sub>)<sub>2<\/sub>SO<sub>4<\/sub>", "KCl", "Sr(NO<sub>3<\/sub>)<sub>2<\/sub>"], "a": 0, "e": "White precipitate with AgNO<sub>3<\/sub> → Cl<sup>−<\/sup> (AgCl). White precipitate with H<sub>2<\/sub>SO<sub>4<\/sub> → Ba<sup>2+<\/sup> (BaSO<sub>4<\/sub>). Only BaCl<sub>2<\/sub> has both.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "What is the most suitable reagent for detecting carbonate ions in the presence of an excess of sulfate ions?", "o": ["dilute NaOH(aq)", "dilute H<sub>2<\/sub>SO<sub>4<\/sub>(aq)", "BaCl<sub>2<\/sub>(aq)", "NaCl(aq)"], "a": 1, "e": "Acid reacts with carbonate to give CO<sub>2<\/sub> effervescence; sulfate does not react. BaCl<sub>2<\/sub> would precipitate both BaCO<sub>3<\/sub> and BaSO<sub>4<\/sub>, so it cannot tell them apart.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2017 · AS Paper 1", "q": "Solution Y contains one Group 2 metal ion and one negative ion. It gives a white precipitate with dilute sulfuric acid and also a white precipitate with magnesium nitrate solution. Which compound could be in solution Y?", "o": ["Ca(NO<sub>3<\/sub>)<sub>2<\/sub>", "SrCl<sub>2<\/sub>", "BaCl<sub>2<\/sub>", "Ba(OH)<sub>2<\/sub>"], "a": 3, "e": "The precipitate with H<sub>2<\/sub>SO<sub>4<\/sub> suggests Ba<sup>2+<\/sup> (BaSO<sub>4<\/sub>). A precipitate with Mg<sup>2+<\/sup> means the anion forms an insoluble Mg compound: OH<sup>−<\/sup> gives Mg(OH)<sub>2<\/sub>. So Y is Ba(OH)<sub>2<\/sub>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · AS Paper 1", "q": "Dilute aqueous sodium hydroxide is added to separate solutions of magnesium chloride and barium chloride. What is observed?", "o": ["MgCl<sub>2<\/sub>: no visible change; BaCl<sub>2<\/sub>: white precipitate", "Both: white precipitate", "Both: no visible change", "MgCl<sub>2<\/sub>: white precipitate; BaCl<sub>2<\/sub>: no visible change"], "a": 3, "e": "Mg(OH)<sub>2<\/sub> is sparingly soluble, so it precipitates. Ba(OH)<sub>2<\/sub> is the most soluble Group 2 hydroxide, so no precipitate forms with dilute NaOH.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · AS Paper 1", "q": "A solution gives: a white precipitate with dilute H<sub>2<\/sub>SO<sub>4<\/sub>; a cream precipitate with HNO<sub>3<\/sub> then AgNO<sub>3<\/sub>; no visible change with NaOH(aq); an orange solution with Cl<sub>2<\/sub>(aq). What is the compound?", "o": ["BaBr<sub>2<\/sub>", "MgCl<sub>2<\/sub>", "BaCl<sub>2<\/sub>", "MgBr<sub>2<\/sub>"], "a": 0, "e": "White precipitate with sulfate and none with NaOH → Ba<sup>2+<\/sup>. Cream AgX and orange Br<sub>2<\/sub> released by chlorine → Br<sup>−<\/sup>. So BaBr<sub>2<\/sub>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · AS Paper 1", "q": "A solution gives: no visible change with dilute H<sub>2<\/sub>SO<sub>4<\/sub>; a white precipitate with HNO<sub>3<\/sub> then AgNO<sub>3<\/sub>; a white precipitate with NaOH(aq); no visible change with Cl<sub>2<\/sub>(aq). What is the compound?", "o": ["BaCl<sub>2<\/sub>", "MgBr<sub>2<\/sub>", "BaBr<sub>2<\/sub>", "MgCl<sub>2<\/sub>"], "a": 3, "e": "No sulfate precipitate but a hydroxide precipitate → Mg<sup>2+<\/sup>. White AgCl, and chlorine has nothing to displace → Cl<sup>−<\/sup>. So MgCl<sub>2<\/sub>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · AS Paper 1", "q": "M is a Group 2 metal. 0.320 g of M(NO<sub>3<\/sub>)<sub>2<\/sub> decomposes completely: 2M(NO<sub>3<\/sub>)<sub>2<\/sub> → 2MO + 4NO<sub>2<\/sub> + O<sub>2<\/sub>. The gases occupy 225 cm<sup>3<\/sup> at 450 °C and 101 000 Pa. What is M? (R = 8.31 J K<sup>−1<\/sup> mol<sup>−1<\/sup>)", "o": ["Mg", "Ca", "Sr", "Ba"], "a": 2, "e": "n(gas) = pV/RT = (101 000 × 225 × 10<sup>−6<\/sup>) ÷ (8.31 × 723) = 3.78 × 10<sup>−3<\/sup> mol. 5 mol gas comes from 2 mol nitrate, so n(M(NO<sub>3<\/sub>)<sub>2<\/sub>) = 1.51 × 10<sup>−3<\/sup> mol. M<sub>r<\/sub> = 0.320 ÷ 1.51 × 10<sup>−3<\/sup> = 212 → Sr(NO<sub>3<\/sub>)<sub>2<\/sub> (211.6).", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · AS Paper 1", "q": "A 3200 mg mixture of MgO and Mg(OH)<sub>2<\/sub> reacts with CO<sub>2<\/sub>: Mg(OH)<sub>2<\/sub> + CO<sub>2<\/sub> → MgCO<sub>3<\/sub> + H<sub>2<\/sub>O and MgO + CO<sub>2<\/sub> → MgCO<sub>3<\/sub>. 210 mg of water is produced. What is the percentage by mass of MgO in the mixture?", "o": ["6.56%", "21.3%", "78.7%", "93.4%"], "a": 2, "e": "n(H<sub>2<\/sub>O) = 210 ÷ 18.0 = 11.7 mmol = n(Mg(OH)<sub>2<\/sub>). Mass of Mg(OH)<sub>2<\/sub> = 11.7 × 58.3 = 680 mg. MgO = 3200 − 680 = 2520 mg = <b>78.7%<\/b>.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
