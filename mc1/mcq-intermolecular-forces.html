<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermolecular Forces – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← Mr Jarvis' Chemistry Page</a><span>AQA A-level Chemistry</span></div>
  <header>
    <h1>Intermolecular Forces</h1>
    <p>Electronegativity, polar molecules, van der Waals forces, dipole–dipole forces and hydrogen bonding</p>

</div>
<script>
const QS = [{"k": "past", "s": "AQA June 2017 · Paper 3", "q": "Which compound has the highest boiling point?", "o": ["CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>OH", "CH<sub>3<\/sub>CH<sub>2<\/sub>CHO", "CH<sub>3<\/sub>COCH<sub>3<\/sub>", "CH<sub>3<\/sub>COOCH<sub>3<\/sub>"], "a": 0, "e": "Propan-1-ol has an O–H group, so it forms hydrogen bonds between molecules – the strongest intermolecular force here. The aldehyde, ketone and ester only have permanent dipole–dipole forces and van der Waals forces.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 2", "q": "Which compound has the highest boiling point?", "o": ["butanal", "butan-2-ol", "but-2-ene", "1-fluorobutane"], "a": 1, "e": "Butan-2-ol can hydrogen bond via its O–H group. A C–F bond does not give hydrogen bonding because the H is attached to carbon, not fluorine.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 2", "q": "Which compound has the highest boiling point?", "o": ["CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>Br", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>F", "CH<sub>3<\/sub>CH<sub>2<\/sub>CHO", "CH<sub>3<\/sub>CH<sub>2<\/sub>COOH"], "a": 3, "e": "Propanoic acid has both C=O and O–H, forming strong hydrogen bonds (carboxylic acids even form dimers). The others have only dipole–dipole and van der Waals forces.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 2", "q": "Which compound has the highest boiling point?", "o": ["CH<sub>3<\/sub>COCH<sub>2<\/sub>CH<sub>3<\/sub>", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>OH", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CHO", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>CH<sub>3<\/sub>"], "a": 1, "e": "Butan-1-ol hydrogen bonds. All four have similar numbers of electrons, so van der Waals forces are similar, and hydrogen bonding makes the difference.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 2", "q": "Which of these alkanes has the highest boiling point?", "o": ["decane", "hexane", "2,3-dimethyloctane", "2,3-dimethylbutane"], "a": 0, "e": "Decane and 2,3-dimethyloctane are both C<sub>10<\/sub>H<sub>22<\/sub>, but the straight chain of decane has a larger surface area of contact between molecules, so stronger van der Waals forces than the branched isomer.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "Which compound forms the greatest number of hydrogen bonds per molecule in the liquid state?", "o": ["CH<sub>3<\/sub>CH<sub>2<\/sub>COOH", "CH<sub>3<\/sub>CH<sub>2<\/sub>OCH<sub>3<\/sub>", "CH<sub>3<\/sub>CH<sub>2<\/sub>CHO", "CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>OH"], "a": 0, "e": "Propanoic acid has a δ+ H on O–H and lone pairs on <b>two<\/b> oxygen atoms, so it forms more hydrogen bonds per molecule than propan-1-ol. The ether and aldehyde have no O–H, so cannot donate a hydrogen bond.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which compound has hydrogen bonding?", "o": ["NaH", "NH<sub>3<\/sub>", "HI", "SiH<sub>4<\/sub>"], "a": 1, "e": "Hydrogen bonding needs H bonded to N, O or F, plus a lone pair on N, O or F of another molecule. NH<sub>3<\/sub> has both. NaH is ionic; I and Si are not electronegative enough.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which bond has the most unsymmetrical electron distribution?", "o": ["H–O", "H–S", "H–N", "H–P"], "a": 0, "e": "The most polar bond has the biggest electronegativity difference. Oxygen is the most electronegative of O, S, N and P.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which species contains bonds that have different polarities?", "o": ["NH<sub>4<\/sub><sup>+<\/sup>", "CCl<sub>4<\/sub>", "CH<sub>3<\/sub>Cl", "H<sub>3<\/sub>O<sup>+<\/sup>"], "a": 2, "e": "CH<sub>3<\/sub>Cl has three C–H bonds and one much more polar C–Cl bond. The other species each contain only one type of bond.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "Which molecule has a permanent dipole?", "o": ["BF<sub>3<\/sub>", "NH<sub>3<\/sub>", "SiCl<sub>4<\/sub>", "SO<sub>3<\/sub>"], "a": 1, "e": "NH<sub>3<\/sub> is pyramidal, so its polar N–H bond dipoles do not cancel. BF<sub>3<\/sub> and SO<sub>3<\/sub> are trigonal planar and SiCl<sub>4<\/sub> is tetrahedral – symmetrical shapes in which the dipoles cancel.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "Which molecule does <b>not<\/b> have a permanent dipole?", "o": ["NH<sub>3<\/sub>", "PCl<sub>3<\/sub>", "SCl<sub>2<\/sub>", "SiCl<sub>4<\/sub>"], "a": 3, "e": "SiCl<sub>4<\/sub> is tetrahedral and symmetrical, so the four Si–Cl dipoles cancel. NH<sub>3<\/sub> and PCl<sub>3<\/sub> are pyramidal and SCl<sub>2<\/sub> is bent, so their dipoles do not cancel.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 2", "q": "Which molecule does <b>not<\/b> have a permanent dipole?", "o": ["CH<sub>3<\/sub>Br", "CH<sub>2<\/sub>Br<sub>2<\/sub>", "CHBr<sub>3<\/sub>", "CBr<sub>4<\/sub>"], "a": 3, "e": "All four are tetrahedral, but only in CBr<sub>4<\/sub> are all four bonds identical, so the dipoles cancel exactly. The others have a mixture of C–H and C–Br bonds.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which molecule has a permanent dipole?", "o": ["CF<sub>4<\/sub>", "PCl<sub>5<\/sub>", "CO<sub>2<\/sub>", "Cl<sub>2<\/sub>O"], "a": 3, "e": "Cl<sub>2<\/sub>O is bent (two lone pairs on O), so the Cl–O dipoles do not cancel. CF<sub>4<\/sub> (tetrahedral), PCl<sub>5<\/sub> (trigonal bipyramidal) and CO<sub>2<\/sub> (linear) are symmetrical.", "t": null}, {"k": "past", "s": "AQA June 2023 · AS Paper 1", "q": "Which molecule has a permanent dipole?", "o": ["NCl<sub>3<\/sub>", "CCl<sub>4<\/sub>", "PF<sub>5<\/sub>", "SF<sub>6<\/sub>"], "a": 0, "e": "NCl<sub>3<\/sub> is pyramidal because of the lone pair on N, so it is polar. CCl<sub>4<\/sub>, PF<sub>5<\/sub> and SF<sub>6<\/sub> are symmetrical and non-polar.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 1", "q": "Which of these molecules is polar?", "o": ["BF<sub>3<\/sub>", "CO<sub>2<\/sub>", "CCl<sub>4<\/sub>", "SCl<sub>2<\/sub>"], "a": 3, "e": "SCl<sub>2<\/sub> has two bonding pairs and two lone pairs on S, so it is bent and polar. The other three molecules are symmetrical.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "Which change occurs when water is vaporised?", "o": ["An exothermic change occurs.", "Covalent bonds are broken.", "Intermolecular forces are overcome.", "The total energy of the molecules decreases."], "a": 2, "e": "Boiling separates whole H<sub>2<\/sub>O molecules by overcoming hydrogen bonds (and van der Waals forces). The O–H covalent bonds stay intact, and energy is absorbed.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2021 · AS Paper 1", "q": "Chlorine has a low boiling point because the forces between its molecules are weak. How do these forces arise?", "o": ["Hydrogen bonds form between Cl atoms", "Cl<sup>+<\/sup> and Cl<sup>−<\/sup> ions attract each other", "Uneven electron distribution creates a temporary dipole, which induces a dipole in a neighbouring molecule", "Cl<sub>2<\/sub> has a permanent dipole because chlorine is electronegative"], "a": 2, "e": "Cl<sub>2<\/sub> is non-polar, so the only forces are van der Waals (induced dipole–dipole) forces: at any instant the electron cloud may be uneven, creating a temporary dipole that induces a dipole in a neighbour.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · AS Paper 1", "q": "The boiling points of F<sub>2<\/sub>, Cl<sub>2<\/sub> and Br<sub>2<\/sub> are −188 °C, −35 °C and 59 °C. Why do they increase down the group?", "o": ["The molecules become more polar", "Hydrogen bonding increases", "The molecules get larger with more electrons, so van der Waals forces get stronger", "The bonds within the molecules get stronger"], "a": 2, "e": "Halogen molecules are non-polar. Down the group they have more electrons, so bigger temporary and induced dipoles form, giving stronger van der Waals forces that need more energy to overcome.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why does HF have a much higher boiling point than HCl?", "o": ["The H–F bond is stronger than the H–Cl bond", "HCl is ionic", "HF molecules form hydrogen bonds", "HF has more electrons than HCl"], "a": 2, "e": "F is small and very electronegative, so HF forms hydrogen bonds between molecules. HCl has only dipole–dipole and van der Waals forces. Breaking the H–F covalent bond is not involved in boiling.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which is the correct description of a hydrogen bond between two water molecules?", "o": ["An attraction between two lone pairs", "An attraction between a lone pair on O of one molecule and a δ+ H on another molecule", "A covalent bond between O and H in the same molecule", "An attraction between two δ+ H atoms"], "a": 1, "e": "A hydrogen bond forms between a lone pair on a very electronegative atom (N, O or F) and a δ+ hydrogen bonded to N, O or F on another molecule. The O–H···O arrangement is linear.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which type of intermolecular force exists between CH<sub>3<\/sub>Cl molecules but not between CH<sub>4<\/sub> molecules?", "o": ["Permanent dipole–dipole forces", "Van der Waals forces", "Hydrogen bonds", "Ionic bonds"], "a": 0, "e": "CH<sub>3<\/sub>Cl has a polar C–Cl bond and its shape does not cancel it, so it has a permanent dipole. All molecules (including CH<sub>4<\/sub>) have van der Waals forces. Neither forms hydrogen bonds.", "t": null}, {"k": "practice", "s": "Practice question", "q": "CO<sub>2<\/sub> contains polar C=O bonds. Why is CO<sub>2<\/sub> a non-polar molecule?", "o": ["Carbon and oxygen have the same electronegativity", "It has no lone pairs", "The double bonds are non-polar", "It is linear, so the two bond dipoles cancel out"], "a": 3, "e": "The C=O bonds are polar, but CO<sub>2<\/sub> is linear (180°), so the two dipoles point in opposite directions and cancel, giving no overall dipole.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which molecule has the highest boiling point?", "o": ["H<sub>2<\/sub>Se", "CH<sub>4<\/sub>", "H<sub>2<\/sub>O", "H<sub>2<\/sub>S"], "a": 2, "e": "Water forms extensive hydrogen bonds (two lone pairs and two δ+ H atoms per molecule). H<sub>2<\/sub>S and H<sub>2<\/sub>Se have more electrons but cannot hydrogen bond, so their boiling points are much lower.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is meant by electronegativity?", "o": ["The charge on an ion", "The power of an atom to attract the pair of electrons in a covalent bond", "The energy needed to remove an electron from an atom", "The energy released when an atom gains an electron"], "a": 1, "e": "Electronegativity is the power of an atom to attract the electron density in a covalent bond towards itself. It increases across a period and decreases down a group; fluorine is the most electronegative element.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Pentane and 2,2-dimethylpropane both have the formula C<sub>5<\/sub>H<sub>12<\/sub>. Why does pentane have the higher boiling point?", "o": ["Pentane molecules have a larger surface area of contact, so stronger van der Waals forces", "Pentane has more electrons", "Pentane forms hydrogen bonds", "Pentane has stronger C–C bonds"], "a": 0, "e": "Both have the same number of electrons, but the unbranched pentane molecules can pack closer together with more contact, so the van der Waals forces between them are stronger.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
