<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acids and Bases – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA June 2017 · Paper 3", "q": "2,4,6-Trichlorophenol is a weak monoprotic acid, K<sub>a<\/sub> = 2.51 × 10<sup>−8<\/sup> mol dm<sup>−3<\/sup> at 298 K. What is [H<sup>+<\/sup>], in mol dm<sup>−3<\/sup>, in a 2.00 × 10<sup>−3<\/sup> mol dm<sup>−3<\/sup> solution?", "o": ["5.02 × 10<sup>−11<\/sup>", "7.09 × 10<sup>−6<\/sup>", "1.26 × 10<sup>−5<\/sup>", "3.54 × 10<sup>−3<\/sup>"], "a": 1, "e": "[H<sup>+<\/sup>] = √(K<sub>a<\/sub> × [HA]) = √(2.51 × 10<sup>−8<\/sup> × 2.00 × 10<sup>−3<\/sup>) = <b>7.09 × 10<sup>−6<\/sup> mol dm<sup>−3<\/sup><\/b>.", "t": null}, {"k": "past", "s": "AQA June 2017 · Paper 3", "q": "What is the pH of a 0.46 mol dm<sup>−3<\/sup> solution of potassium hydroxide at 298 K? (K<sub>w<\/sub> = 1.0 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>)", "o": ["0.34", "13.66", "13.96", "14.34"], "a": 1, "e": "[H<sup>+<\/sup>] = K<sub>w<\/sub> ÷ [OH<sup>−<\/sup>] = 1.0 × 10<sup>−14<\/sup> ÷ 0.46 = 2.17 × 10<sup>−14<\/sup>, so pH = <b>13.66<\/b>. (0.34 is the pOH.)", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "Which statement about pH is correct?", "o": ["The pH of a weak base is independent of temperature.", "At temperatures above 298 K, the pH of pure water is less than 7.", "The pH of 2.0 mol dm<sup>−3<\/sup> nitric acid is approximately 0.30", "The pH of 0.10 mol dm<sup>−3<\/sup> sulfuric acid is greater than that of 0.10 mol dm<sup>−3<\/sup> hydrochloric acid."], "a": 1, "e": "Water's dissociation is endothermic, so K<sub>w<\/sub> rises with temperature: [H<sup>+<\/sup>] increases and pH falls below 7 (water is still neutral). 2.0 mol dm<sup>−3<\/sup> HNO<sub>3<\/sub> has pH −0.30; diprotic H<sub>2<\/sub>SO<sub>4<\/sub> has the <i>lower<\/i> pH.", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "What is the concentration of NaOH(aq), in mol dm<sup>−3<\/sup>, that has pH = 14.30? (K<sub>w<\/sub> = 1.00 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>)", "o": ["−1.16", "5.01 × 10<sup>−15<\/sup>", "2.00 × 10<sup>14<\/sup>", "2.00"], "a": 3, "e": "[H<sup>+<\/sup>] = 10<sup>−14.30<\/sup> = 5.01 × 10<sup>−15<\/sup>; [OH<sup>−<\/sup>] = K<sub>w<\/sub> ÷ [H<sup>+<\/sup>] = <b>2.00 mol dm<sup>−3<\/sup><\/b>. pH values above 14 are possible for concentrated alkalis.", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "What is the pH of 0.015 mol dm<sup>−3<\/sup> sulfuric acid?", "o": ["−1.82", "−1.52", "1.52", "1.82"], "a": 2, "e": "H<sub>2<\/sub>SO<sub>4<\/sub> is diprotic and treated as fully dissociated: [H<sup>+<\/sup>] = 2 × 0.015 = 0.030, pH = −log 0.030 = <b>1.52<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "Which can <b>not<\/b> function as a Brønsted–Lowry acid?", "o": ["CH<sub>3<\/sub>COO<sup>−<\/sup>", "HCO<sub>3<\/sub><sup>−<\/sup>", "H<sub>3<\/sub>O<sup>+<\/sup>", "NH<sub>4<\/sub><sup>+<\/sup>"], "a": 0, "e": "A Brønsted–Lowry acid is a proton donor. CH<sub>3<\/sub>COO<sup>−<\/sup> has no acidic H to donate – it is a base (proton acceptor). HCO<sub>3<\/sub><sup>−<\/sup>, H<sub>3<\/sub>O<sup>+<\/sup> and NH<sub>4<\/sub><sup>+<\/sup> can all donate H<sup>+<\/sup>.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "A strong acid H<sub>2<\/sub>X dissociates completely: H<sub>2<\/sub>X(aq) → 2H<sup>+<\/sup>(aq) + X<sup>2−<\/sup>(aq). What is the pH of a 0.020 mol dm<sup>−3<\/sup> solution?", "o": ["1.00", "1.40", "1.70", "2.00"], "a": 1, "e": "[H<sup>+<\/sup>] = 2 × 0.020 = 0.040 mol dm<sup>−3<\/sup>; pH = −log 0.040 = <b>1.40<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "HF(aq) ⇌ H<sup>+<\/sup>(aq) + F<sup>−<\/sup>(aq). At equilibrium at 298 K, [HF] = 7.70 × 10<sup>−3<\/sup> and [F<sup>−<\/sup>] = 2.30 × 10<sup>−3<\/sup> mol dm<sup>−3<\/sup>. What is the equilibrium constant, in mol dm<sup>−3<\/sup>?", "o": ["1.45 × 10<sup>3<\/sup>", "3.35", "2.99 × 10<sup>−1<\/sup>", "6.87 × 10<sup>−4<\/sup>"], "a": 3, "e": "In pure HF solution [H<sup>+<\/sup>] = [F<sup>−<\/sup>], so K<sub>a<\/sub> = (2.30 × 10<sup>−3<\/sup>)<sup>2<\/sup> ÷ 7.70 × 10<sup>−3<\/sup> = <b>6.87 × 10<sup>−4<\/sup> mol dm<sup>−3<\/sup><\/b>.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "Which species can behave as a Brønsted–Lowry acid in aqueous solution?", "o": ["SO<sub>4<\/sub><sup>2−<\/sup>", "HCO<sub>3<\/sub><sup>−<\/sup>", "BF<sub>3<\/sub>", "NH<sub>3<\/sub>"], "a": 1, "e": "HCO<sub>3<\/sub><sup>−<\/sup> can donate H<sup>+<\/sup> to form CO<sub>3<\/sub><sup>2−<\/sup>. BF<sub>3<\/sub> is a Lewis acid (electron-pair acceptor), not a proton donor; NH<sub>3<\/sub> is a base in water.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "Which change causes the pH of 10 cm<sup>3<\/sup> of 1.0 mol dm<sup>−3<\/sup> NaOH to be halved at 298 K? (K<sub>w<\/sub> = 1.0 × 10<sup>−14<\/sup>)", "o": ["adding 10 cm<sup>3<\/sup> of water", "adding 10 dm<sup>3<\/sup> of water", "adding 5 cm<sup>3<\/sup> of 1.0 mol dm<sup>−3<\/sup> HCl", "adding 10 cm<sup>3<\/sup> of 1.0 mol dm<sup>−3<\/sup> HCl"], "a": 3, "e": "1.0 mol dm<sup>−3<\/sup> NaOH has pH 14, so halving means pH 7. That needs exact neutralisation: 0.010 mol NaOH + 0.010 mol HCl. Diluting an alkali with water can never take its pH below 7.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "A 0.100 mol dm<sup>−3<\/sup> solution of a weak acid has pH = 2.50. What is K<sub>a<\/sub>, in mol dm<sup>−3<\/sup>?", "o": ["3.16 × 10<sup>−2<\/sup>", "3.16 × 10<sup>−3<\/sup>", "1.00 × 10<sup>−4<\/sup>", "1.00 × 10<sup>−5<\/sup>"], "a": 2, "e": "[H<sup>+<\/sup>] = 10<sup>−2.50<\/sup> = 3.16 × 10<sup>−3<\/sup>. K<sub>a<\/sub> = [H<sup>+<\/sup>]<sup>2<\/sup> ÷ [HA] = (3.16 × 10<sup>−3<\/sup>)<sup>2<\/sup> ÷ 0.100 = <b>1.00 × 10<sup>−4<\/sup> mol dm<sup>−3<\/sup><\/b>.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "K<sub>w<\/sub> = 6.40 × 10<sup>−15<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup> at 18 °C and 1.00 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup> at 25 °C. Which statement is correct?", "o": ["The concentration of hydroxide ions in water at 18 °C is 8.00 × 10<sup>−8<\/sup> mol dm<sup>−3<\/sup>", "The dissociation of water into ions is an exothermic process.", "The pH of water is the same at 25 °C and at 18 °C", "Water becomes less acidic as the temperature is raised."], "a": 0, "e": "In pure water [OH<sup>−<\/sup>] = [H<sup>+<\/sup>] = √K<sub>w<\/sub> = √(6.40 × 10<sup>−15<\/sup>) = <b>8.00 × 10<sup>−8<\/sup><\/b>. K<sub>w<\/sub> rises with temperature, so dissociation is endothermic and pH changes – but water is always neutral.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 1", "q": "What is the pH of a 0.150 mol dm<sup>−3<\/sup> solution of ethanoic acid at 25 °C? (K<sub>a<\/sub> = 1.74 × 10<sup>−5<\/sup> mol dm<sup>−3<\/sup>)", "o": ["5.58", "4.76", "2.79", "0.82"], "a": 2, "e": "[H<sup>+<\/sup>] = √(1.74 × 10<sup>−5<\/sup> × 0.150) = 1.62 × 10<sup>−3<\/sup>; pH = <b>2.79<\/b>. 0.82 treats it as a strong acid; 4.76 is the pK<sub>a<\/sub>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 1", "q": "What is the pH of 0.0100 mol dm<sup>−3<\/sup> strontium hydroxide, Sr(OH)<sub>2<\/sub>, at 10 °C? Assume complete dissociation. (K<sub>w<\/sub> = 2.93 × 10<sup>−15<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup> at 10 °C)", "o": ["12.83", "12.53", "12.30", "1.70"], "a": 0, "e": "Each Sr(OH)<sub>2<\/sub> gives 2OH<sup>−<\/sup>: [OH<sup>−<\/sup>] = 0.0200. [H<sup>+<\/sup>] = 2.93 × 10<sup>−15<\/sup> ÷ 0.0200 = 1.47 × 10<sup>−13<\/sup>; pH = <b>12.83<\/b>. 12.30 uses K<sub>w<\/sub> at 25 °C.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 1", "q": "The pH of a barium hydroxide solution is lower at 50 °C than at 10 °C. At 50 °C, 25 cm<sup>3<\/sup> of the solution is neutralised by 22.45 cm<sup>3<\/sup> of hydrochloric acid. What volume of the same acid neutralises 25 cm<sup>3<\/sup> of the solution at 10 °C?", "o": ["Exactly 22.45 cm<sup>3<\/sup>", "Less than 22.45 cm<sup>3<\/sup>", "It depends on K<sub>w<\/sub>, so cannot be predicted", "More than 22.45 cm<sup>3<\/sup>"], "a": 0, "e": "The number of moles of OH<sup>−<\/sup> in 25 cm<sup>3<\/sup> is the same at both temperatures. The pH changes only because K<sub>w<\/sub> changes with temperature, not because the amount of alkali changes.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2021 · Paper 1", "q": "K<sub>w<\/sub> = 5.48 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup> at 50 °C. What is the pH of pure water at 50 °C?", "o": ["6.63", "7.00", "7.37", "13.26"], "a": 0, "e": "[H<sup>+<\/sup>] = √(5.48 × 10<sup>−14<\/sup>) = 2.34 × 10<sup>−7<\/sup>; pH = <b>6.63<\/b>. 13.26 is pK<sub>w<\/sub> – remember to square-root first.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2021 · Paper 1", "q": "H<sub>2<\/sub>O(l) ⇌ H<sup>+<\/sup>(aq) + OH<sup>−<\/sup>(aq) &nbsp; ΔH = +57 kJ mol<sup>−1<\/sup><br>Why does K<sub>w<\/sub> increase as temperature increases?", "o": ["More collisions occur, so the rate of the forward reaction increases", "[H<sub>2<\/sub>O] decreases as water evaporates", "The forward reaction is endothermic, so the equilibrium shifts to the right", "The forward reaction is exothermic, so the equilibrium shifts to the right"], "a": 2, "e": "Increasing temperature shifts an equilibrium in the endothermic direction. Here that is dissociation, so [H<sup>+<\/sup>] and [OH<sup>−<\/sup>] both increase and K<sub>w<\/sub> increases.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · Paper 1", "q": "For pure water at 40 °C, pH = 6.67. What is K<sub>w<\/sub> at this temperature?", "o": ["2.14 × 10<sup>−7<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>", "1.00 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>", "2.14 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>", "4.57 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>"], "a": 3, "e": "[H<sup>+<\/sup>] = [OH<sup>−<\/sup>] = 10<sup>−6.67<\/sup> = 2.14 × 10<sup>−7<\/sup>. K<sub>w<\/sub> = (2.14 × 10<sup>−7<\/sup>)<sup>2<\/sup> = <b>4.57 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup><\/b>. The water is still neutral, not acidic.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · Paper 1", "q": "What is the pH of a 0.100 mol dm<sup>−3<\/sup> propanoic acid solution? (pK<sub>a<\/sub> = 4.87)", "o": ["4.87", "3.87", "2.94", "1.00"], "a": 2, "e": "K<sub>a<\/sub> = 10<sup>−4.87<\/sup> = 1.35 × 10<sup>−5<\/sup>. [H<sup>+<\/sup>] = √(1.35 × 10<sup>−5<\/sup> × 0.100) = 1.16 × 10<sup>−3<\/sup>; pH = <b>2.94<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2018 · Paper 1", "q": "10.35 cm<sup>3<\/sup> of 0.100 mol dm<sup>−3<\/sup> HCl are added to 25.0 cm<sup>3<\/sup> of 0.150 mol dm<sup>−3<\/sup> Ba(OH)<sub>2<\/sub>. What is the pH of the solution at 30 °C? (K<sub>w<\/sub> = 1.47 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup>)", "o": ["0.74", "12.72", "13.09", "13.26"], "a": 2, "e": "OH<sup>−<\/sup> = 2 × 0.025 × 0.150 = 7.50 × 10<sup>−3<\/sup> mol; HCl = 1.035 × 10<sup>−3<\/sup> mol; excess OH<sup>−<\/sup> = 6.465 × 10<sup>−3<\/sup> mol in 35.35 cm<sup>3<\/sup> → 0.183 mol dm<sup>−3<\/sup>. [H<sup>+<\/sup>] = 1.47 × 10<sup>−14<\/sup> ÷ 0.183 = 8.04 × 10<sup>−14<\/sup>; pH = <b>13.09<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · Paper 1", "q": "25.0 cm<sup>3<\/sup> of 0.500 mol dm<sup>−3<\/sup> propanoic acid is diluted with water to 100.0 cm<sup>3<\/sup>. What is the pH of the diluted solution? (K<sub>a<\/sub> = 1.35 × 10<sup>−5<\/sup> mol dm<sup>−3<\/sup>)", "o": ["0.90", "2.59", "2.89", "3.19"], "a": 2, "e": "New concentration = 0.500 × 25/100 = 0.125 mol dm<sup>−3<\/sup>. [H<sup>+<\/sup>] = √(1.35 × 10<sup>−5<\/sup> × 0.125) = 1.30 × 10<sup>−3<\/sup>; pH = <b>2.89<\/b>. For a weak acid, a 4× dilution raises pH by only ½ log 4 = 0.30.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · Paper 1", "q": "The pH of pure water at 40 °C is 6.77. Which statement is correct?", "o": ["The water is neutral because [H<sup>+<\/sup>] = [OH<sup>−<\/sup>]", "The water is alkaline because K<sub>w<\/sub> has increased", "The water is neutral because the pH of neutral water is always 7", "The water is acidic because its pH is below 7"], "a": 0, "e": "Neutral means <b>[H<sup>+<\/sup>] = [OH<sup>−<\/sup>]<\/b>. Both increase with temperature, so neutral water has a pH below 7 at 40 °C.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · Paper 1", "q": "35.0 cm<sup>3<\/sup> of 0.150 mol dm<sup>−3<\/sup> NaOH are mixed with 20.0 cm<sup>3<\/sup> of 0.100 mol dm<sup>−3<\/sup> HCl at 40 °C. What is the pH? (K<sub>w<\/sub> = 2.92 × 10<sup>−14<\/sup> mol<sup>2<\/sup> dm<sup>−6<\/sup> at 40 °C)", "o": ["12.77", "12.50", "12.31", "1.23"], "a": 2, "e": "Excess OH<sup>−<\/sup> = 5.25 × 10<sup>−3<\/sup> − 2.00 × 10<sup>−3<\/sup> = 3.25 × 10<sup>−3<\/sup> mol in 55.0 cm<sup>3<\/sup> → 0.0591 mol dm<sup>−3<\/sup>. [H<sup>+<\/sup>] = 2.92 × 10<sup>−14<\/sup> ÷ 0.0591 = 4.94 × 10<sup>−13<\/sup>; pH = <b>12.31<\/b>. Use the total volume and K<sub>w<\/sub> at 40 °C.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · Paper 1", "q": "Nitric acid is a strong acid. What is the pH of 0.150 mol dm<sup>−3<\/sup> nitric acid?", "o": ["0.15", "0.82", "1.64", "13.18"], "a": 1, "e": "Strong monoprotic acid: [H<sup>+<\/sup>] = 0.150; pH = −log 0.150 = <b>0.82<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · Paper 1", "q": "What is the concentration of a propanoic acid solution with pH = 2.89 at 25 °C? (K<sub>a<\/sub> = 1.35 × 10<sup>−5<\/sup> mol dm<sup>−3<\/sup>)", "o": ["1.29 × 10<sup>−3<\/sup> mol dm<sup>−3<\/sup>", "1.05 × 10<sup>−2<\/sup> mol dm<sup>−3<\/sup>", "0.123 mol dm<sup>−3<\/sup>", "95.4 mol dm<sup>−3<\/sup>"], "a": 2, "e": "[H<sup>+<\/sup>] = 10<sup>−2.89<\/sup> = 1.29 × 10<sup>−3<\/sup>. [HA] = [H<sup>+<\/sup>]<sup>2<\/sup> ÷ K<sub>a<\/sub> = (1.29 × 10<sup>−3<\/sup>)<sup>2<\/sup> ÷ 1.35 × 10<sup>−5<\/sup> = <b>0.123 mol dm<sup>−3<\/sup><\/b>.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
