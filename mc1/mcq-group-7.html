<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group 7 – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which property increases down Group 7?", "o": ["ability to oxidise a given reducing agent", "boiling point", "electronegativity", "first ionisation energy"], "a": 1, "e": "Larger molecules with more electrons have stronger van der Waals forces, so boiling point increases. Oxidising ability, electronegativity and ionisation energy all decrease.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "Which is a correct trend down Group 7 from fluorine to iodine?", "o": ["The boiling point of the element decreases.", "The oxidising ability of the element decreases.", "The electronegativity of the atom increases.", "The first ionisation energy of the atom increases."], "a": 1, "e": "Atoms get larger with more shielding, so they attract an extra electron less strongly: oxidising ability decreases. Boiling point increases; electronegativity and IE decrease.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which statement about astatine is correct?", "o": ["Astatine has a greater electronegativity than bromine", "Astatine is a better oxidising agent than bromine", "Astatine has a greater boiling point than bromine", "Astatine has a greater first ionisation energy than bromine"], "a": 2, "e": "Astatine is below bromine, so it has stronger van der Waals forces and a higher boiling point. The other properties decrease down the group.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "What is the best oxidising agent?", "o": ["F<sub>2<\/sub>", "F<sup>−<\/sup>", "I<sub>2<\/sub>", "I<sup>−<\/sup>"], "a": 0, "e": "Halogens are oxidising agents (they gain electrons); halide ions are reducing agents. Oxidising ability decreases down the group, so F<sub>2<\/sub> is the strongest.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which pair of solutions, when mixed, reacts to form a dark brown solution?", "o": ["NaF(aq) + Cl<sub>2<\/sub>(aq)", "NaCl(aq) + Br<sub>2<\/sub>(aq)", "NaBr(aq) + Cl<sub>2<\/sub>(aq)", "NaI(aq) + Br<sub>2<\/sub>(aq)"], "a": 3, "e": "Br<sub>2<\/sub> + 2I<sup>−<\/sup> → 2Br<sup>−<\/sup> + I<sub>2<\/sub>; iodine in solution is brown. C does react, but it gives orange bromine; A and B do not react.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · AS Paper 1", "q": "Bromine water is added to a potassium halide solution and a brown solution forms. Which ionic equation is correct?", "o": ["Br<sub>2<\/sub> + 2Cl<sup>−<\/sup> → 2Br<sup>−<\/sup> + Cl<sub>2<\/sub>", "I<sub>2<\/sub> + 2Br<sup>−<\/sup> → 2I<sup>−<\/sup> + Br<sub>2<\/sub>", "Br<sub>2<\/sub> + 2Br<sup>−<\/sup> → 2Br<sup>−<\/sup> + Br<sub>2<\/sub>", "Br<sub>2<\/sub> + 2I<sup>−<\/sup> → 2Br<sup>−<\/sup> + I<sub>2<\/sub>"], "a": 3, "e": "Bromine is a stronger oxidising agent than iodine, so it oxidises I<sup>−<\/sup> to brown I<sub>2<\/sub>. Bromine cannot oxidise Cl<sup>−<\/sup>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · AS Paper 1", "q": "Bromine water is added to separate solutions of potassium chloride and potassium bromide. Both stay orange. Why can't this distinguish them?", "o": ["Bromine oxidises both Cl<sup>−<\/sup> and Br<sup>−<\/sup>", "Both solutions form a cream precipitate", "Chloride and bromide ions are both oxidising agents", "Bromine is not a strong enough oxidising agent to oxidise Cl<sup>−<\/sup>, and there is no reaction with Br<sup>−<\/sup>"], "a": 3, "e": "Br<sub>2<\/sub> can only oxidise halide ions below it (I<sup>−<\/sup>). With Cl<sup>−<\/sup> and with Br<sup>−<\/sup> no reaction occurs, so both mixtures just show the orange colour of bromine water.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "Which statement is correct about the reaction between concentrated sulfuric acid and solid sodium bromide?", "o": ["Bromide ions are reduced.", "Hydrogen bromide and sulfur are formed.", "Sulfuric acid acts as an oxidising agent.", "Bromine and hydrogen sulfide are formed."], "a": 2, "e": "Br<sup>−<\/sup> is oxidised to Br<sub>2<\/sub> while H<sub>2<\/sub>SO<sub>4<\/sub> is reduced to SO<sub>2<\/sub>, so sulfuric acid is the oxidising agent. Bromide is not strong enough to reduce sulfur to S or H<sub>2<\/sub>S – that needs iodide.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Some solid sodium halides are reacted with concentrated sulfuric acid. Which does <b>not<\/b> produce a sulfur-containing gas?", "o": ["NaCl", "NaBr", "NaI", "NaAt"], "a": 0, "e": "Cl<sup>−<\/sup> is too weak a reducing agent to reduce H<sub>2<\/sub>SO<sub>4<\/sub>; only an acid–base reaction occurs: NaCl + H<sub>2<\/sub>SO<sub>4<\/sub> → NaHSO<sub>4<\/sub> + HCl. Br<sup>−<\/sup> gives SO<sub>2<\/sub>; I<sup>−<\/sup> gives SO<sub>2<\/sub>, S and H<sub>2<\/sub>S.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · Paper 1", "q": "Solid sodium chloride reacts with concentrated sulfuric acid: NaCl + H<sub>2<\/sub>SO<sub>4<\/sub> → NaHSO<sub>4<\/sub> + HCl. What is the role of the sulfuric acid?", "o": ["Catalyst", "Oxidising agent", "Reducing agent", "Acid (proton donor)"], "a": 3, "e": "No oxidation states change – sulfuric acid simply donates H<sup>+<\/sup> to Cl<sup>−<\/sup>, forming HCl. It only acts as an oxidising agent with bromide and iodide.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which species is <b>not<\/b> produced by a redox reaction between solid sodium iodide and concentrated sulfuric acid?", "o": ["Na<sub>2<\/sub>SO<sub>4<\/sub>", "H<sub>2<\/sub>S", "S", "SO<sub>2<\/sub>"], "a": 0, "e": "SO<sub>2<\/sub> (+4), S (0) and H<sub>2<\/sub>S (−2) are reduction products of sulfuric acid (+6). Sodium sulfate/hydrogensulfate forms in the acid–base step, not in a redox reaction.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · AS Paper 1", "q": "When iodide ions are oxidised by concentrated sulfuric acid, a yellow solid and a foul-smelling gas form along with SO<sub>2<\/sub>. What are they?", "o": ["Yellow solid: I<sub>2<\/sub>; gas: SO<sub>3<\/sub>", "Yellow solid: AgI; gas: HI", "Yellow solid: S; gas: HI", "Yellow solid: S; gas: H<sub>2<\/sub>S"], "a": 3, "e": "Iodide is a strong reducing agent. It reduces sulfur from +6 to 0 (yellow sulfur) and to −2 (hydrogen sulfide, bad-egg smell): 6I<sup>−<\/sup> + 7H<sup>+<\/sup> + SO<sub>4<\/sub><sup>2−<\/sup> → 3I<sub>2<\/sub> + S + 4H<sub>2<\/sub>O.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "Which statement is correct about reactions involving halide ions?", "o": ["Sodium chloride forms chlorine when added to concentrated sulfuric acid.", "Sodium chloride forms chlorine when added to bromine.", "Sodium bromide forms bromine when added to concentrated sulfuric acid.", "Sodium bromide forms bromine when added to iodine."], "a": 2, "e": "Bromide is oxidised by concentrated H<sub>2<\/sub>SO<sub>4<\/sub> to Br<sub>2<\/sub> (orange fumes). Chloride is not oxidised by H<sub>2<\/sub>SO<sub>4<\/sub> or by bromine, and iodine cannot oxidise bromide.", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "In the test for a halide ion, dilute nitric acid is added before silver nitrate solution. Why is nitric acid added?", "o": ["It increases the concentration of nitrate ions.", "It prevents the precipitation of silver compounds other than halides.", "It prevents the silver nitrate being precipitated.", "It provides the acidic solution required for precipitation."], "a": 1, "e": "HNO<sub>3<\/sub> removes ions such as CO<sub>3<\/sub><sup>2−<\/sup> and OH<sup>−<\/sup> that would also form silver precipitates. HCl or H<sub>2<\/sub>SO<sub>4<\/sub> can't be used because they add chloride or sulfate.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 1", "q": "Which silver halide(s) react(s) with concentrated ammonia solution to form a colourless solution?", "o": ["silver chloride only", "silver chloride and silver bromide", "silver bromide and silver iodide", "silver iodide only"], "a": 1, "e": "AgCl dissolves in dilute and concentrated NH<sub>3<\/sub>; AgBr dissolves only in concentrated NH<sub>3<\/sub>; AgI does not dissolve in either.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "20.0 cm<sup>3<\/sup> of a 0.400 mol dm<sup>−3<\/sup> solution of a metal bromide, MBr<sub>n<\/sub>, reacts exactly with 160 cm<sup>3<\/sup> of 0.100 mol dm<sup>−3<\/sup> aqueous silver nitrate. What is the formula of the metal bromide?", "o": ["MBr", "MBr<sub>2<\/sub>", "MBr<sub>3<\/sub>", "MBr<sub>4<\/sub>"], "a": 1, "e": "n(MBr<sub>n<\/sub>) = 0.0200 × 0.400 = 8.00 × 10<sup>−3<\/sup> mol. n(Ag<sup>+<\/sup>) = n(Br<sup>−<\/sup>) = 0.160 × 0.100 = 1.60 × 10<sup>−2<\/sup> mol. Ratio Br<sup>−<\/sup> : MBr<sub>n<\/sub> = 2 : 1, so MBr<sub>2<\/sub>.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "Which statement correctly describes a trend down Group 7 from Cl to I? (X represents Cl, Br or I)", "o": ["The boiling point of HX increases.", "The bond dissociation energy of H–X increases.", "The standard electrode potential for X<sub>2<\/sub>(aq) + 2e<sup>−<\/sup> → 2X<sup>−<\/sup>(aq) becomes more positive.", "The solubility of AgX in ammonia increases."], "a": 0, "e": "HX molecules get bigger with more electrons, so van der Waals forces and boiling points increase (HF is the exception due to hydrogen bonding). H–X bonds get weaker, E<sup>⦵<\/sup> becomes less positive and AgX becomes less soluble in ammonia.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "Which statement is <b>not<\/b> correct about the trends in properties of the hydrogen halides from HCl to HI?", "o": ["The boiling points decrease.", "The bond dissociation energy of H−X decreases.", "The polarity of the H−X bond decreases.", "They are more easily oxidised in aqueous solutions."], "a": 0, "e": "Boiling points <b>increase<\/b> from HCl to HI because van der Waals forces get stronger. The bond gets longer and weaker, less polar, and the halide is more easily oxidised.", "t": null}, {"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Chlorine reacts with cold, dilute, aqueous sodium hydroxide. Which is a complete list of the products?", "o": ["Sodium chloride, sodium chlorate(I) and water", "Sodium chlorate(I) and water", "Sodium chloride, sodium chlorate(V) and water", "Sodium chloride and sodium chlorate(I)"], "a": 0, "e": "Cl<sub>2<\/sub> + 2NaOH → NaCl + NaClO + H<sub>2<\/sub>O. This mixture is bleach. Chlorate(V) forms with <i>hot<\/i> NaOH.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · Paper 1", "q": "Chlorine reacts with hot aqueous sodium hydroxide: 3Cl<sub>2<\/sub> + 6NaOH → NaClO<sub>3<\/sub> + 5NaCl + 3H<sub>2<\/sub>O. What are the oxidation states of chlorine in NaClO<sub>3<\/sub> and NaCl, and what happens to the chlorine?", "o": ["+6 and −1; chlorine is both oxidised and reduced (disproportionation)", "+5 and +1; chlorine is only oxidised", "+3 and −1; chlorine is only reduced", "+5 and −1; chlorine is both oxidised and reduced (disproportionation)"], "a": 3, "e": "In ClO<sub>3<\/sub><sup>−<\/sup>: x + 3(−2) = −1, so x = +5. In NaCl chlorine is −1. Starting from 0, some chlorine is oxidised and some reduced – disproportionation.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which compound contains chlorine in an oxidation state of +1?", "o": ["Cl<sub>2<\/sub>O", "KClO<sub>3<\/sub>", "ClF<sub>3<\/sub>", "CCl<sub>4<\/sub>"], "a": 0, "e": "In Cl<sub>2<\/sub>O: 2x + (−2) = 0, so x = +1. KClO<sub>3<\/sub> is +5; in ClF<sub>3<\/sub> fluorine is −1, so Cl is +3; in CCl<sub>4<\/sub> chlorine is −1.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which compound contains a chlorine atom with an oxidation state of +4?", "o": ["KClO<sub>4<\/sub>", "CCl<sub>4<\/sub>", "ClO<sub>2<\/sub>", "ClO<sub>2<\/sub>F"], "a": 2, "e": "In ClO<sub>2<\/sub>: x + 2(−2) = 0, x = +4. KClO<sub>4<\/sub> is +7; CCl<sub>4<\/sub> is −1; ClO<sub>2<\/sub>F is +5.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Which species is never formed during the reactions of chlorine with water?", "o": ["Chloride ions", "Chlorate(I) ions", "Hydrogen", "Oxygen"], "a": 2, "e": "In the dark: Cl<sub>2<\/sub> + H<sub>2<\/sub>O ⇌ HCl + HClO (Cl<sup>−<\/sup> and ClO<sup>−<\/sup>). In sunlight: 2Cl<sub>2<\/sub> + 2H<sub>2<\/sub>O → 4HCl + O<sub>2<\/sub>. Hydrogen is never formed.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2025 · AS Paper 1", "q": "Which equation shows the reaction of chlorine with water in bright sunlight?", "o": ["Cl<sub>2<\/sub> + H<sub>2<\/sub>O → HCl + HClO", "Cl<sub>2<\/sub> + H<sub>2<\/sub>O → 2HCl + ½O<sub>2<\/sub> + H<sub>2<\/sub>", "Cl<sub>2<\/sub> + 2H<sub>2<\/sub>O → 2HClO + H<sub>2<\/sub>", "2Cl<sub>2<\/sub> + 2H<sub>2<\/sub>O → 4HCl + O<sub>2<\/sub>"], "a": 3, "e": "In sunlight chlorine decomposes water, releasing oxygen: 2Cl<sub>2<\/sub> + 2H<sub>2<\/sub>O → 4HCl + O<sub>2<\/sub>. Cl<sub>2<\/sub> + H<sub>2<\/sub>O → HCl + HClO is the reaction in the dark (used to treat water).", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2018 · AS Paper 1", "q": "ClO<sup>−<\/sup> + 2I<sup>−<\/sup> + 2H<sup>+<\/sup> → I<sub>2<\/sub> + Cl<sup>−<\/sup> + H<sub>2<\/sub>O<br>A 20.0 cm<sup>3<\/sup> portion of bleach contains ClO<sup>−<\/sup> at 0.0109 mol dm<sup>−3<\/sup>. What mass of potassium iodide (M<sub>r<\/sub> = 166.0) is needed to react with all the ClO<sup>−<\/sup>?", "o": ["36.2 mg", "72.4 mg", "145 mg", "724 mg"], "a": 1, "e": "n(ClO<sup>−<\/sup>) = 0.0200 × 0.0109 = 2.18 × 10<sup>−4<\/sup> mol. n(KI) = 2 × 2.18 × 10<sup>−4<\/sup> = 4.36 × 10<sup>−4<\/sup> mol. Mass = 4.36 × 10<sup>−4<\/sup> × 166.0 = 0.0724 g = <b>72.4 mg<\/b>.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
