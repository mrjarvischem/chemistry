<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Equations – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>

<script>
const QS = [{"k": "past", "s": "AQA November 2020 · Paper 3", "q": "What are the units of the rate constant for a third order reaction?", "o": ["mol dm<sup>−3<\/sup> s<sup>−1<\/sup>", "mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "mol<sup>2<\/sup> dm<sup>−6<\/sup> s<sup>−1<\/sup>", "mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>"], "a": 3, "e": "k = rate ÷ [ ]<sup>3<\/sup> = (mol dm<sup>−3<\/sup> s<sup>−1<\/sup>) ÷ (mol<sup>3<\/sup> dm<sup>−9<\/sup>) = <b>mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup><\/b>.", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "The rate expression for the reaction between X and Y is rate = k[X]<sup>2<\/sup>[Y]. Which statement is correct?", "o": ["The rate constant has units mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "The rate of the reaction is halved if the concentration of X is halved and the concentration of Y is doubled.", "The rate increases by a factor of 16 if the concentration of X is tripled and the concentration of Y is doubled.", "The rate constant is independent of temperature."], "a": 1, "e": "Halving [X] multiplies the rate by (½)<sup>2<\/sup> = ¼; doubling [Y] multiplies by 2. Overall ¼ × 2 = ½. (C would be 3<sup>2<\/sup> × 2 = 18; third order units are mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>; k increases with temperature.)", "t": null}, {"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Solutions of W and X react in the presence of a soluble catalyst, Y: 2W + X → Z<br>When the concentrations of W, X and Y are all doubled, the rate increases by a factor of four. Which is a possible rate equation?", "o": ["rate = k[W]<sup>2<\/sup>[X]", "rate = k[W]<sup>2<\/sup>[Y]", "rate = k[X][Y]", "rate = k[X][Z]"], "a": 2, "e": "A factor of 4 when everything doubles means the overall order is 2. A and B are third order; D includes the product Z, which is not present at the start. Catalysts can appear in rate equations.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "The rate equation is rate = k[P][Q]<sup>2<\/sup>. What is the initial concentration of Q, in mol dm<sup>−3<\/sup>, in experiment 2?", "o": ["0.167", "0.333", "0.408", "0.612"], "a": 2, "e": "From experiment 1: k = 0.400 ÷ (0.200 × 0.500<sup>2<\/sup>) = 8.00. In experiment 2: [Q]<sup>2<\/sup> = 0.800 ÷ (8.00 × 0.600) = 0.1667, so [Q] = <b>0.408 mol dm<sup>−3<\/sup><\/b>.", "t": [["Experiment", "Initial [P] / mol dm<sup>−3<\/sup>", "Initial [Q] / mol dm<sup>−3<\/sup>", "Initial rate / mol dm<sup>−3<\/sup> s<sup>−1<\/sup>"], ["1", "0.200", "0.500", "0.400"], ["2", "0.600", "to be calculated", "0.800"]]}, {"k": "past", "s": "AQA June 2017 · Paper 3", "q": "For the acid-catalysed reaction of iodine with propanone, rate = k[H<sup>+<\/sup>][C<sub>3<\/sub>H<sub>6<\/sub>O]. A mixture at pH 0.70 was used. In a second mixture only the acid concentration was changed and the rate became a quarter of the original. What was the pH of the second mixture?", "o": ["1.00", "1.30", "1.40", "2.80"], "a": 1, "e": "Rate is first order in H<sup>+<\/sup>, so [H<sup>+<\/sup>] must fall to one quarter. pH increases by log 4 = 0.60, giving 0.70 + 0.60 = <b>1.30<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2018 · Paper 3", "q": "Only the concentration of reactant X is changed in a series of experiments. Which graph of initial rate (y-axis) against [X] (x-axis) shows the reaction is <b>second order<\/b> with respect to X?", "o": ["A curve through the origin with an increasing gradient", "A horizontal straight line", "A straight line through the origin", "A straight line with a negative gradient"], "a": 0, "e": "Second order: rate ∝ [X]<sup>2<\/sup>, so the graph is a parabola-shaped curve through the origin. A horizontal line is zero order; a straight line through the origin is first order.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2017 · Paper 2", "q": "For the reaction rate = k[A]<sup>2<\/sup>[B], the experiment was repeated with the same [B] but a different [A]. The new initial rate was 1.7 times greater. By what factor was [A] increased?", "o": ["0.85", "1.30", "1.70", "2.89"], "a": 1, "e": "Rate ∝ [A]<sup>2<\/sup>, so the factor for [A] is √1.7 = <b>1.30<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2017 · Paper 2", "q": "rate = k[C][D]. At 25 °C the initial rate is 3.1 × 10<sup>−3<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup> when [C] = 0.48 mol dm<sup>−3<\/sup> and [D] = 0.23 mol dm<sup>−3<\/sup>. What is the rate constant?", "o": ["2.8 × 10<sup>−2<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "2.8 × 10<sup>−2<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup>", "3.4 × 10<sup>−4<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "36 mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>"], "a": 0, "e": "k = 3.1 × 10<sup>−3<\/sup> ÷ (0.48 × 0.23) = <b>2.8 × 10<sup>−2<\/sup><\/b>. Second order overall, so units are mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2017 · Paper 2", "q": "ln k = −E<sub>a<\/sub>/RT + ln A. For a reaction at 25 °C, k = 2.81 × 10<sup>−2<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup> and ln A = 16.9. What is the activation energy? (R = 8.31 J K<sup>−1<\/sup> mol<sup>−1<\/sup>)", "o": ["4.25 kJ mol<sup>−1<\/sup>", "33.0 kJ mol<sup>−1<\/sup>", "50.7 kJ mol<sup>−1<\/sup>", "5.07 × 10<sup>4<\/sup> kJ mol<sup>−1<\/sup>"], "a": 2, "e": "ln k = −3.572. E<sub>a<\/sub> = (ln A − ln k) × RT = (16.9 + 3.572) × 8.31 × 298 = 50 700 J mol<sup>−1<\/sup> = <b>50.7 kJ mol<sup>−1<\/sup><\/b>. Use T in kelvin.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · Paper 2", "q": "A reaction is second order with respect to R and second order with respect to S. The initial rate is 1.20 × 10<sup>−3<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup> when [R] = 1.00 × 10<sup>−2<\/sup> and [S] = 2.45 × 10<sup>−2<\/sup> mol dm<sup>−3<\/sup>. What is k?", "o": ["2.00 × 10<sup>4<\/sup> mol<sup>−3<\/sup> dm<sup>9<\/sup> s<sup>−1<\/sup>", "2.00 × 10<sup>4<\/sup> mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>", "4.90 mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "5.00 × 10<sup>−5<\/sup> mol<sup>−3<\/sup> dm<sup>9<\/sup> s<sup>−1<\/sup>"], "a": 0, "e": "k = 1.20 × 10<sup>−3<\/sup> ÷ [(1.00 × 10<sup>−2<\/sup>)<sup>2<\/sup> × (2.45 × 10<sup>−2<\/sup>)<sup>2<\/sup>] = <b>2.00 × 10<sup>4<\/sup><\/b>. Fourth order overall, so units are mol<sup>−3<\/sup> dm<sup>9<\/sup> s<sup>−1<\/sup>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2019 · Paper 2", "q": "k = Ae<sup>−Ea/RT<\/sup>. At 25 °C, k = 3.46 × 10<sup>−8<\/sup> s<sup>−1<\/sup> and E<sub>a<\/sub> = 96.2 kJ mol<sup>−1<\/sup>. What is the Arrhenius constant, A? (R = 8.31 J K<sup>−1<\/sup> mol<sup>−1<\/sup>)", "o": ["4.66 × 10<sup>−25<\/sup> s<sup>−1<\/sup>", "2.57 × 10<sup>9<\/sup> s<sup>−1<\/sup>", "2.57 × 10<sup>9<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup>", "3.46 × 10<sup>−8<\/sup> s<sup>−1<\/sup>"], "a": 1, "e": "A = k ÷ e<sup>−Ea/RT<\/sup> = 3.46 × 10<sup>−8<\/sup> × e<sup>96200/(8.31 × 298)<\/sup> = <b>2.57 × 10<sup>9<\/sup> s<sup>−1<\/sup><\/b>. A has the same units as k.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 2", "q": "rate = k[CH<sub>3<\/sub>CH<sub>2<\/sub>COCH<sub>3<\/sub>][H<sup>+<\/sup>]. Initial concentrations: butanone 4.35, I<sub>2<\/sub> 0.00500, H<sup>+<\/sup> 0.825 mol dm<sup>−3<\/sup>. The initial rate is 1.45 × 10<sup>−4<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup>. What is k?", "o": ["2.48 × 10<sup>4<\/sup> mol dm<sup>−3<\/sup> s", "5.20 × 10<sup>−4<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "8.08 × 10<sup>−3<\/sup> mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>", "4.04 × 10<sup>−5<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>"], "a": 3, "e": "Iodine is not in the rate equation (zero order), so ignore it. k = 1.45 × 10<sup>−4<\/sup> ÷ (4.35 × 0.825) = <b>4.04 × 10<sup>−5<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup><\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2022 · Paper 2", "q": "Butanone reacts with iodine in acid: rate = k[CH<sub>3<\/sub>CH<sub>2<\/sub>COCH<sub>3<\/sub>][H<sup>+<\/sup>]. In one experiment the initial rate was 1.45 × 10<sup>−4<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup>. What is the initial rate when the concentrations of butanone, iodine and H<sup>+<\/sup> are <b>all<\/b> halved?", "o": ["1.45 × 10<sup>−4<\/sup>", "1.81 × 10<sup>−5<\/sup>", "3.63 × 10<sup>−5<\/sup>", "7.25 × 10<sup>−5<\/sup>"], "a": 2, "e": "Each first-order reactant halves the rate; iodine has no effect. ½ × ½ = ¼, so 1.45 × 10<sup>−4<\/sup> ÷ 4 = <b>3.63 × 10<sup>−5<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup><\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · Paper 2", "q": "rate = k[L][M]<sup>2<\/sup>. What is the effect on the rate when the concentrations of both L and M are halved?", "o": ["The rate decreases to one eighth", "The rate decreases to one sixteenth", "The rate is halved", "The rate decreases to one quarter"], "a": 0, "e": "½ (from L) × (½)<sup>2<\/sup> (from M) = <b>⅛<\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA November 2020 · Paper 2", "q": "rate = k[L][M]<sup>2<\/sup>. The rate is 0.0250 mol dm<sup>−3<\/sup> s<sup>−1<\/sup> when [L] = 0.0155 mol dm<sup>−3<\/sup> and k = 21.3 mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>. What is [M]?", "o": ["0.00757 mol dm<sup>−3<\/sup>", "0.0757 mol dm<sup>−3<\/sup>", "0.275 mol dm<sup>−3<\/sup>", "3.63 mol dm<sup>−3<\/sup>"], "a": 2, "e": "[M]<sup>2<\/sup> = 0.0250 ÷ (21.3 × 0.0155) = 0.0757, so [M] = √0.0757 = <b>0.275 mol dm<sup>−3<\/sup><\/b>. Don't forget the square root.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · Paper 2", "q": "A(aq) + 2B(aq) → C(aq) + D(aq) &nbsp; rate = k[B]<sup>2<\/sup>[H<sup>+<\/sup>]<br>Step 1: B + H<sup>+<\/sup> → BH<sup>+<\/sup><br>Step 2: BH<sup>+<\/sup> + B → B<sub>2<\/sub>H<sup>+<\/sup><br>Step 3: B<sub>2<\/sub>H<sup>+<\/sup> + A → C + D<br>Which is the rate-determining step?", "o": ["Step 3", "It cannot be deduced from the rate equation", "Step 1", "Step 2"], "a": 3, "e": "The rate-determining step (and steps before it) must involve exactly the species in the rate equation: 2 × B and 1 × H<sup>+<\/sup>. Steps 1 + 2 together use 2B and H<sup>+<\/sup>; A only reacts in step 3, which is after the slow step, so A is zero order.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2023 · Paper 2", "q": "rate = k[B]<sup>2<\/sup>[H<sup>+<\/sup>]. In experiment 1, [A] = 0.40, [B] = 0.20, [H<sup>+<\/sup>] = 0.10 mol dm<sup>−3<\/sup> and the relative rate is 1.00. In experiment 2 only [A] is changed, to 0.50 mol dm<sup>−3<\/sup>. What is the relative rate in experiment 2?", "o": ["0.80", "1.00", "1.25", "1.56"], "a": 1, "e": "A does not appear in the rate equation – it is <b>zero order<\/b>, so changing [A] has no effect. The relative rate stays 1.00.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · Paper 2", "q": "CH<sub>3<\/sub>COCH<sub>3<\/sub> + Br<sub>2<\/sub> + OH<sup>−<\/sup> → CH<sub>3<\/sub>COCH<sub>2<\/sub>Br + Br<sup>−<\/sup> + H<sub>2<\/sub>O &nbsp; rate = k[CH<sub>3<\/sub>COCH<sub>3<\/sub>][OH<sup>−<\/sup>]<br>Initial rate = 2.75 × 10<sup>−11<\/sup> mol dm<sup>−3<\/sup> s<sup>−1<\/sup> when [CH<sub>3<\/sub>COCH<sub>3<\/sub>] = 1.50 × 10<sup>−2<\/sup>, [Br<sub>2<\/sub>] = 2.50 × 10<sup>−2<\/sup> and [OH<sup>−<\/sup>] = 2.50 × 10<sup>−2<\/sup> mol dm<sup>−3<\/sup>. What is k?", "o": ["7.33 × 10<sup>−8<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "2.93 × 10<sup>−6<\/sup> mol<sup>−2<\/sup> dm<sup>6<\/sup> s<sup>−1<\/sup>", "1.10 × 10<sup>−9<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>", "1.36 × 10<sup>7<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup>"], "a": 0, "e": "Bromine is zero order, so k = 2.75 × 10<sup>−11<\/sup> ÷ (1.50 × 10<sup>−2<\/sup> × 2.50 × 10<sup>−2<\/sup>) = <b>7.33 × 10<sup>−8<\/sup> mol<sup>−1<\/sup> dm<sup>3<\/sup> s<sup>−1<\/sup><\/b>.", "t": null}, {"k": "adapted", "s": "Adapted from AQA June 2024 · Paper 2", "q": "Propanone reacts with bromine in alkali: rate = k[CH<sub>3<\/sub>COCH<sub>3<\/sub>][OH<sup>−<\/sup>]. Propanone and OH<sup>−<\/sup> are in large excess. Which describes a graph of [Br<sub>2<\/sub>] against time?", "o": ["A curve with a decreasing gradient and constant half-life", "A horizontal straight line", "A curve with an increasing gradient", "A straight line with a constant negative gradient"], "a": 3, "e": "Bromine is <b>zero order<\/b>: its concentration does not affect the rate, so it is used up at a constant rate – a straight line sloping down. A constant half-life would mean first order.", "t": null}, {"k": "practice", "s": "Practice question", "q": "A graph of ln k (y-axis) against 1/T (x-axis) is a straight line. What is the gradient?", "o": ["−E<sub>a<\/sub>/R", "E<sub>a<\/sub>/R", "−E<sub>a<\/sub>/RT", "ln A"], "a": 0, "e": "ln k = −(E<sub>a<\/sub>/R)(1/T) + ln A, which is y = mx + c. The gradient is <b>−E<sub>a<\/sub>/R<\/b> and the y-intercept is ln A.", "t": null}, {"k": "practice", "s": "Practice question", "q": "The gradient of a plot of ln k against 1/T is −6.00 × 10<sup>3<\/sup> K. What is the activation energy? (R = 8.31 J K<sup>−1<\/sup> mol<sup>−1<\/sup>)", "o": ["0.722 kJ mol<sup>−1<\/sup>", "6.00 kJ mol<sup>−1<\/sup>", "49.9 kJ mol<sup>−1<\/sup>", "722 kJ mol<sup>−1<\/sup>"], "a": 2, "e": "Gradient = −E<sub>a<\/sub>/R, so E<sub>a<\/sub> = 6.00 × 10<sup>3<\/sup> × 8.31 = 49 860 J mol<sup>−1<\/sup> = <b>49.9 kJ mol<sup>−1<\/sup><\/b>.", "t": null}, {"k": "practice", "s": "Practice question", "q": "NO<sub>2<\/sub>(g) + CO(g) → NO(g) + CO<sub>2<\/sub>(g) has rate = k[NO<sub>2<\/sub>]<sup>2<\/sup>. Which could be the rate-determining step?", "o": ["NO<sub>3<\/sub> + CO → NO<sub>2<\/sub> + CO<sub>2<\/sub>", "NO<sub>2<\/sub> + 2CO → NO + CO<sub>2<\/sub> + CO", "NO<sub>2<\/sub> + CO → NO + CO<sub>2<\/sub>", "2NO<sub>2<\/sub> → NO<sub>3<\/sub> + NO"], "a": 3, "e": "The slow step must contain the species in the rate equation in the right numbers: two NO<sub>2<\/sub> and no CO. Only 2NO<sub>2<\/sub> → NO<sub>3<\/sub> + NO fits. CO reacts in a fast step afterwards.", "t": null}, {"k": "practice", "s": "Practice question", "q": "The temperature of a reaction is increased. Which statement is correct?", "o": ["The rate constant increases and the orders stay the same", "The rate constant stays the same but the orders increase", "The rate constant decreases because E<sub>a<\/sub> increases", "The rate constant and the orders both stay the same"], "a": 0, "e": "k depends on temperature (Arrhenius equation): a higher T means a larger fraction of collisions have E ≥ E<sub>a<\/sub>, so k increases. The orders depend on the mechanism, which is unchanged.", "t": null}, {"k": "practice", "s": "Practice question", "q": "A concentration–time graph for reactant P shows a constant half-life. What is the order with respect to P?", "o": ["Second", "Third", "Zero", "First"], "a": 3, "e": "A constant half-life (the time to halve the concentration is the same whatever the starting concentration) is characteristic of a <b>first order<\/b> reaction.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Use the initial-rate data to deduce the rate equation.", "o": ["rate = k[A][B]", "rate = k[A]<sup>2<\/sup>[B]", "rate = k[A][B]<sup>2<\/sup>", "rate = k[A]<sup>2<\/sup>"], "a": 1, "e": "Exp 1 → 2: [A] doubles, rate × 4, so second order in A. Exp 1 → 3: [B] triples, rate × 3, so first order in B. rate = k[A]<sup>2<\/sup>[B].", "t": [["Exp", "[A] / mol dm<sup>−3<\/sup>", "[B] / mol dm<sup>−3<\/sup>", "Initial rate / mol dm<sup>−3<\/sup> s<sup>−1<\/sup>"], ["1", "0.10", "0.10", "2.0 × 10<sup>−4<\/sup>"], ["2", "0.20", "0.10", "8.0 × 10<sup>−4<\/sup>"], ["3", "0.10", "0.30", "6.0 × 10<sup>−4<\/sup>"]]}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
