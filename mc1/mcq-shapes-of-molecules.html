<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapes of Molecules – MCQ Revision Quiz</title>
<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← Mr Jarvis' Chemistry Page</a><span>AQA A-level Chemistry</span></div>
  <header>
    <h1>Shapes of Molecules</h1>
    <p>Electron-pair repulsion, shapes and bond angles of molecules and ions</p>
  </header>
  <main id="app"></main>
  <footer>Past-paper questions © AQA, reproduced for revision. Adapted and practice questions written in AQA style.</footer>
</div>
<script>
const QS = [{"k": "past", "s": "AQA June 2018 · Paper 3", "q": "Which species has a shape that is influenced by the presence of one or more lone pairs of electrons around the central atom?", "o": ["AlCl<sub>3<\/sub>", "ClF<sub>3<\/sub>", "IF<sub>6<\/sub><sup>+<\/sup>", "PCl<sub>6<\/sub><sup>−<\/sup>"], "a": 1, "e": "Cl has 7 outer electrons: 3 bond to F, leaving 2 lone pairs, so ClF<sub>3<\/sub> is T-shaped. AlCl<sub>3<\/sub> (3 bonding pairs), IF<sub>6<\/sub><sup>+<\/sup> and PCl<sub>6<\/sub><sup>−<\/sup> (6 bonding pairs each) have no lone pairs on the central atom.", "t": null}, {"k": "past", "s": "AQA November 2020 · Paper 3", "q": "Which has a bond angle of 109.5°?", "o": ["C (diamond)", "C (graphite)", "NH<sub>2<\/sub><sup>−<\/sup>", "NH<sub>3<\/sub>"], "a": 0, "e": "In diamond each C has four bonding pairs arranged tetrahedrally (109.5°). Graphite has 120°; NH<sub>3<\/sub> (107°) and NH<sub>2<\/sub><sup>−<\/sup> (104.5°) are squeezed by lone pairs.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "Which species has a lone pair of electrons on the central atom?", "o": ["CO<sub>2<\/sub>", "SO<sub>2<\/sub>", "PCl<sub>6<\/sub><sup>−<\/sup>", "SO<sub>4<\/sub><sup>2−<\/sup>"], "a": 1, "e": "In SO<sub>2<\/sub>, sulfur uses 4 of its 6 outer electrons in two S=O double bonds, leaving one lone pair, so SO<sub>2<\/sub> is bent. In CO<sub>2<\/sub>, PCl<sub>6<\/sub><sup>−<\/sup> and SO<sub>4<\/sub><sup>2−<\/sup> all outer electrons on the central atom are used in bonding.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "In which molecule are all the atoms in the same plane?", "o": ["CH<sub>3<\/sub>CHO", "CH<sub>3<\/sub>NH<sub>2<\/sub>", "C<sub>6<\/sub>H<sub>5<\/sub>Cl", "C<sub>6<\/sub>H<sub>5<\/sub>CH<sub>3<\/sub>"], "a": 2, "e": "The benzene ring is planar and the Cl lies in that plane. The others contain a CH<sub>3<\/sub> group, whose tetrahedral carbon has H atoms out of the plane.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "Which substance does <b>not<\/b> have any bond angles of 120°?", "o": ["benzene", "boron trifluoride", "cyclohexane", "graphite"], "a": 2, "e": "Cyclohexane has tetrahedral carbons (109.5°) – its ring is not flat. Benzene, BF<sub>3<\/sub> and graphite all have trigonal planar arrangements (120°).", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "Which species has a tetrahedral shape?", "o": ["SF<sub>4<\/sub>", "FeCl<sub>4<\/sub><sup>−<\/sup>", "XeF<sub>4<\/sub>", "ICl<sub>4<\/sub><sup>−<\/sup>"], "a": 1, "e": "FeCl<sub>4<\/sub><sup>−<\/sup> has four bonding pairs and no lone pairs around Fe: tetrahedral. SF<sub>4<\/sub> has 4 bonding + 1 lone pair; XeF<sub>4<\/sub> and ICl<sub>4<\/sub><sup>−<\/sup> have 4 bonding + 2 lone pairs (square planar).", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "P<sub>4<\/sub>O<sub>10<\/sub> reacts with water to form H<sub>3<\/sub>PO<sub>4<\/sub>, and SO<sub>2<\/sub> reacts with water to form H<sub>2<\/sub>SO<sub>3<\/sub>. Which row gives the correct shape around the central atom?", "o": ["H<sub>3<\/sub>PO<sub>4<\/sub>: pyramidal; H<sub>2<\/sub>SO<sub>3<\/sub>: pyramidal", "H<sub>3<\/sub>PO<sub>4<\/sub>: pyramidal; H<sub>2<\/sub>SO<sub>3<\/sub>: tetrahedral", "H<sub>3<\/sub>PO<sub>4<\/sub>: tetrahedral; H<sub>2<\/sub>SO<sub>3<\/sub>: pyramidal", "H<sub>3<\/sub>PO<sub>4<\/sub>: tetrahedral; H<sub>2<\/sub>SO<sub>3<\/sub>: tetrahedral"], "a": 2, "e": "In H<sub>3<\/sub>PO<sub>4<\/sub>, P is bonded to four O atoms with no lone pair: tetrahedral. In H<sub>2<\/sub>SO<sub>3<\/sub> (OS(OH)<sub>2<\/sub>), S is bonded to three O atoms and has one lone pair: pyramidal.", "t": null}, {"k": "past", "s": "AQA June 2019 · AS Paper 1", "q": "Which species is <b>not<\/b> pyramidal in shape?", "o": ["PF<sub>3<\/sub>", "H<sub>3<\/sub>O<sup>+<\/sup>", "CH<sub>3<\/sub><sup>−<\/sup>", "BF<sub>3<\/sub>"], "a": 3, "e": "BF<sub>3<\/sub> has three bonding pairs and no lone pair, so it is trigonal planar. PF<sub>3<\/sub>, H<sub>3<\/sub>O<sup>+<\/sup> and CH<sub>3<\/sub><sup>−<\/sup> each have three bonding pairs and one lone pair: pyramidal.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "Which species has a square planar shape?", "o": ["NH<sub>4<\/sub><sup>+<\/sup>", "SF<sub>4<\/sub>", "XeF<sub>4<\/sub>", "PCl<sub>4<\/sub><sup>+<\/sup>"], "a": 2, "e": "Xe has 8 outer electrons: 4 bond to F, leaving 2 lone pairs. Six electron pairs are octahedral, and the lone pairs sit opposite each other, leaving a square planar shape. NH<sub>4<\/sub><sup>+<\/sup> and PCl<sub>4<\/sub><sup>+<\/sup> are tetrahedral.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which species has one or more bond angle(s) of 90°?", "o": ["CH<sub>4<\/sub>", "NH<sub>4<\/sub><sup>+<\/sup>", "ClF<sub>4<\/sub><sup>−<\/sup>", "AlCl<sub>4<\/sub><sup>−<\/sup>"], "a": 2, "e": "ClF<sub>4<\/sub><sup>−<\/sup> has 4 bonding pairs and 2 lone pairs on Cl: square planar with 90° bond angles. The other three are tetrahedral (109.5°).", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 2", "q": "Which is the most likely bond angle around the oxygen atom in ethanol?", "o": ["104.5°", "109.5°", "120°", "180°"], "a": 0, "e": "The O in C–O–H has two bonding pairs and two lone pairs. Lone pairs repel more than bonding pairs, so the angle is reduced from 109.5° to about 104.5°, as in water.", "t": null}, {"k": "past", "s": "AQA June 2023 · Paper 3", "q": "Which statement about the shapes of ions is <b>not<\/b> correct?", "o": ["[CoCl<sub>4<\/sub>]<sup>2−<\/sup> is square planar.", "NH<sub>4<\/sub><sup>+<\/sup> is tetrahedral.", "[Co(H<sub>2<\/sub>NCH<sub>2<\/sub>CH<sub>2<\/sub>NH<sub>2<\/sub>)<sub>3<\/sub>]<sup>2+<\/sup> is octahedral.", "[Co(H<sub>2<\/sub>O)<sub>6<\/sub>]<sup>2+<\/sup> is octahedral."], "a": 0, "e": "[CoCl<sub>4<\/sub>]<sup>2−<\/sup> is <b>tetrahedral<\/b>: large Cl<sup>−<\/sup> ligands mean only four fit around Co. Square planar complexes are mainly Pt (e.g. cisplatin) and Ni.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of a PCl<sub>5<\/sub> molecule and what bond angles does it contain?", "o": ["Octahedral; 90°", "Square pyramidal; 90°", "Trigonal planar; 120°", "Trigonal bipyramidal; 90° and 120°"], "a": 3, "e": "P has five bonding pairs and no lone pairs. Five electron pairs adopt a trigonal bipyramidal arrangement: three in a plane at 120° and two above and below at 90°.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the bond angle in an ammonia molecule?", "o": ["104.5°", "107°", "109.5°", "120°"], "a": 1, "e": "NH<sub>3<\/sub> has three bonding pairs and one lone pair. The lone pair repels more strongly than bonding pairs, closing the angle from 109.5° to <b>107°<\/b>.", "t": null}, {"k": "practice", "s": "Practice question", "q": "Why is the bond angle in H<sub>2<\/sub>O (104.5°) smaller than in NH<sub>3<\/sub> (107°)?", "o": ["Oxygen is more electronegative than nitrogen", "H<sub>2<\/sub>O has fewer electron pairs around the central atom", "The O–H bond is shorter than the N–H bond", "H<sub>2<\/sub>O has two lone pairs, and lone pairs repel more strongly than bonding pairs"], "a": 3, "e": "Both have four electron pairs. H<sub>2<\/sub>O has two lone pairs to NH<sub>3<\/sub>'s one; the order of repulsion is lone pair–lone pair &gt; lone pair–bonding pair &gt; bonding pair–bonding pair, so the H–O–H angle is squeezed more.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of an SF<sub>6<\/sub> molecule?", "o": ["Octahedral", "Trigonal bipyramidal", "Hexagonal planar", "Square planar"], "a": 0, "e": "S has six bonding pairs and no lone pairs. Six electron pairs repel to an octahedral arrangement with all bond angles 90°.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of the NH<sub>2<\/sub><sup>−<\/sup> ion?", "o": ["Linear, 180°", "Pyramidal, 107°", "Trigonal planar, 120°", "Bent (non-linear), about 104.5°"], "a": 3, "e": "N has 5 outer electrons + 1 for the charge = 6; two are used in N–H bonds, leaving two lone pairs. Two bonding pairs and two lone pairs give a bent shape, like water.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of the PCl<sub>4<\/sub><sup>+<\/sup> ion?", "o": ["Tetrahedral, 109.5°", "Square planar, 90°", "Pyramidal, 107°", "Trigonal bipyramidal"], "a": 0, "e": "P has 5 outer electrons − 1 for the positive charge = 4, all used in four P–Cl bonds. Four bonding pairs and no lone pairs: tetrahedral.", "t": null}, {"k": "practice", "s": "Practice question", "q": "BF<sub>3<\/sub> reacts with F<sup>−<\/sup> to form BF<sub>4<\/sub><sup>−<\/sup>. How does the F–B–F bond angle change?", "o": ["From 109.5° to 120°", "From 120° to 90°", "It does not change", "From 120° to 109.5°"], "a": 3, "e": "BF<sub>3<\/sub> is trigonal planar (3 bonding pairs, 120°). F<sup>−<\/sup> donates a lone pair, forming a fourth bonding pair, so BF<sub>4<\/sub><sup>−<\/sup> is tetrahedral (109.5°).", "t": null}, {"k": "practice", "s": "Practice question", "q": "Which is the correct order of strength of repulsion between electron pairs?", "o": ["All pairs repel equally", "lone pair–lone pair &gt; lone pair–bonding pair &gt; bonding pair–bonding pair", "bonding pair–bonding pair &gt; lone pair–bonding pair &gt; lone pair–lone pair", "lone pair–bonding pair &gt; lone pair–lone pair &gt; bonding pair–bonding pair"], "a": 1, "e": "Lone pairs are held closer to the central atom and spread out more, so they repel most strongly. That is why lone pairs reduce bond angles.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of the H<sub>3<\/sub>O<sup>+<\/sup> ion?", "o": ["Pyramidal", "Trigonal planar", "Tetrahedral", "Bent"], "a": 0, "e": "O has three bonding pairs (three O–H bonds, one of them the dative bond to H<sup>+<\/sup>) and one lone pair, so H<sub>3<\/sub>O<sup>+<\/sup> is pyramidal with a bond angle of about 107°, like NH<sub>3<\/sub>.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of a CO<sub>2<\/sub> molecule?", "o": ["Bent, 104.5°", "Trigonal planar, 120°", "Tetrahedral, 109.5°", "Linear, 180°"], "a": 3, "e": "C forms two C=O double bonds and has no lone pairs. Each double bond counts as one region of electron density, so the two regions repel to 180°.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of the ICl<sub>4<\/sub><sup>−<\/sup> ion?", "o": ["See-saw", "Octahedral", "Square planar", "Tetrahedral"], "a": 2, "e": "I has 7 outer electrons + 1 for the charge = 8: four bonding pairs and two lone pairs. Six pairs give an octahedral arrangement, with the two lone pairs opposite each other, leaving a square planar shape.", "t": null}, {"k": "practice", "s": "Practice question", "q": "How many lone pairs are there on the central atom in XeF<sub>4<\/sub>?", "o": ["4", "2", "1", "0"], "a": 1, "e": "Xe has 8 outer electrons. Four are used in bonds to F, leaving 4 electrons = <b>2 lone pairs<\/b>. This is why XeF<sub>4<\/sub> is square planar rather than tetrahedral.", "t": null}, {"k": "practice", "s": "Practice question", "q": "What is the shape of an SO<sub>2<\/sub> molecule?", "o": ["Bent, slightly less than 120°", "Linear, 180°", "Trigonal planar, 120°", "Pyramidal, 107°"], "a": 0, "e": "S has two double bonds (two regions of electron density) and one lone pair: three regions in total. The lone pair pushes the two S=O bonds closer together, giving a bent shape just under 120°.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');
let order = [], pos = 0, score = 0, answered = false, log = [], shuffle = false;

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){
  if(!t) return '';
  let h='<div class="tbl"><table class="data"><thead><tr>'+t[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
  t.slice(1).forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>';});
  return h+'</tbody></table></div>';
}

function start(){
  const c = counts();
  app.innerHTML = `<section class="card">
    <p style="margin:0">${QS.length} multiple-choice questions. Choose an answer to see whether you are right and why. Your score is shown at the end, with a review of anything you got wrong.</p>
    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
