<style>
:root{
  --bg:#f5eedf; --panel:#fffaf1; --ink:#33240f; --muted:#7d6a52; --line:#e3d4b9;
  --brown:#7a4a21; --brown-dk:#5c3615; --tan:#efe2c8;
  --ok:#2e7a4b; --ok-bg:#e4f2e8; --bad:#a2392a; --bad-bg:#f8e3de;
  --past:#7a4a21; --adapted:#9a6a1c; --practice:#5f6b46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--brown)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:14px}
.top a{text-decoration:none}
.top a:hover{text-decoration:underline}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 6px;color:var(--brown-dk)}
header p{margin:0;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px;box-shadow:0 1px 0 rgba(90,60,20,.06)}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 20px;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;background:var(--brown);color:#fff}
.btn:hover{background:var(--brown-dk)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #d9a441;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
.btn.ghost:hover{background:var(--tan)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 20px}
.stat{background:var(--tan);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-family:Georgia,serif;color:var(--brown-dk)}
.stat span{font-size:13px;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;cursor:pointer;margin:0 0 18px}
label.chk input{width:18px;height:18px;accent-color:var(--brown)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brown);width:0;transition:width .25s}
.chip{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:4px 10px;border-radius:99px;color:#fff;margin:16px 0 10px}
.chip.past{background:var(--past)} .chip.adapted{background:var(--adapted)} .chip.practice{background:var(--practice)}
.stem{font-size:18px;margin:0 0 14px}
table.data{border-collapse:collapse;margin:0 0 16px;font-size:15px;max-width:100%}
.tbl{overflow-x:auto}
table.data th,table.data td{border:1px solid var(--line);padding:6px 12px;text-align:left}
table.data th{background:var(--tan)}
table.data td:not(:first-child),table.data th:not(:first-child){text-align:center}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt .L{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tan);color:var(--brown-dk);font-weight:700;display:grid;place-items:center;font-size:15px}
.opt .T{padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)} .opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)} .opt.wrong .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border-left:5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)} .fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb p{margin:0}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.big{font-family:Georgia,serif;font-size:56px;color:var(--brown-dk);margin:4px 0 0;line-height:1}
.msg{color:var(--muted);margin:6px 0 18px}
.rev{margin-top:22px}
.rev h2{font-family:Georgia,serif;font-size:22px;color:var(--brown-dk);margin:0 0 10px}
.ri{border-top:1px solid var(--line);padding:14px 0}
.ri .src{font-size:13px;color:var(--muted)}
.ri .ans{margin:6px 0;font-weight:600;color:var(--ok)}
.ri .yours{color:var(--bad);font-size:15px}
.key{font-size:13px;color:var(--muted);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
sub,sup{font-size:.72em;line-height:0}
.iso{display:inline-flex;flex-direction:column;align-items:flex-end;vertical-align:.5em;line-height:1;font-size:.68em;margin-right:1px}
.iso sup,.iso sub{font-size:1em;line-height:1;position:static;vertical-align:baseline}
footer{margin-top:28px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:520px){
  body{font-size:16px}
  .card{padding:16px}
  .stem{font-size:17px}
  .stats{gap:6px} .stat b{font-size:22px}
  .opt{padding:10px 12px}
}
</style>

<script>
const QS = [{"k": "past", "s": "AQA June 2018 · Paper 3", "q": "In the early twentieth century, He<sup>2+<\/sup> particles were fired at a thin sheet of gold foil. Most of the particles passed straight through and were detected directly behind the foil. What conclusion can be drawn from this?", "o": ["Gold atoms contain electrons.", "Gold atoms contain protons.", "Gold atoms contain neutrons.", "Gold atoms are mainly empty space."], "a": 3, "e": "If most of the positively charged particles pass straight through without being deflected, most of the volume of each atom must be <b>empty space<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2018 · Paper 3", "q": "When He<sup>2+<\/sup> particles were fired at a thin sheet of gold, about 1 in 8000 of the particles were deflected back towards the source. What conclusion can be drawn from this?", "o": ["Gold atoms have a small, positive nucleus.", "Gold atoms have electrons in orbitals.", "Gold consists of ions in a sea of delocalised electrons.", "Gold atoms have more protons than He<sup>2+<\/sup> particles."], "a": 0, "e": "A very small fraction bouncing back means the positive charge (and mass) is concentrated in a tiny region: a small, dense, <b>positive nucleus<\/b> that repels the He<sup>2+<\/sup> particles.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 1", "q": "Which shows the correct order of discovery, from earliest to latest?", "o": ["electron → neutron → nucleus", "electron → nucleus → neutron", "nucleus → electron → neutron", "nucleus → neutron → electron"], "a": 1, "e": "Thomson discovered the electron (1897), Rutherford's gold-foil experiment showed the nucleus (1911) and Chadwick discovered the neutron (1932).", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which atom has the smallest number of neutrons?", "o": ["<span class=\"iso\"><sup>3<\/sup><sub>1<\/sub><\/span>H", "<span class=\"iso\"><sup>4<\/sup><sub>2<\/sub><\/span>He", "<span class=\"iso\"><sup>5<\/sup><sub>2<\/sub><\/span>He", "<span class=\"iso\"><sup>4<\/sup><sub>3<\/sub><\/span>Li"], "a": 3, "e": "Neutrons = mass number − atomic number: <sup>3<\/sup>H = 2, <sup>4<\/sup>He = 2, <sup>5<\/sup>He = 3, <sup>4<\/sup>Li = 4 − 3 = <b>1<\/b>.", "t": null}, {"k": "past", "s": "AQA June 2023 · AS Paper 1", "q": "Which atom contains the most neutrons?", "o": ["<span class=\"iso\"><sup>54<\/sup><sub>24<\/sub><\/span>Cr", "<span class=\"iso\"><sup>55<\/sup><sub>25<\/sub><\/span>Mn", "<span class=\"iso\"><sup>57<\/sup><sub>26<\/sub><\/span>Fe", "<span class=\"iso\"><sup>58<\/sup><sub>28<\/sub><\/span>Ni"], "a": 2, "e": "Neutrons = A − Z: Cr 54 − 24 = 30; Mn 55 − 25 = 30; Fe 57 − 26 = <b>31<\/b>; Ni 58 − 28 = 30.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "Which atom has two more protons and two more neutrons than <span class=\"iso\"><sup>52<\/sup><sub>24<\/sub><\/span>Cr?", "o": ["<span class=\"iso\"><sup>54<\/sup><sub>26<\/sub><\/span>Cr", "<span class=\"iso\"><sup>56<\/sup><sub>26<\/sub><\/span>Cr", "<span class=\"iso\"><sup>54<\/sup><sub>26<\/sub><\/span>Fe", "<span class=\"iso\"><sup>56<\/sup><sub>26<\/sub><\/span>Fe"], "a": 3, "e": "Two more protons: Z = 26, which is iron (an element is defined by its proton number). Mass number increases by 2 + 2 = 4, giving 56. So <sup>56<\/sup>Fe.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Which isotope has 2 more protons and 3 more neutrons than an atom of <span class=\"iso\"><sup>112<\/sup><sub>48<\/sub><\/span>Cd?", "o": ["<span class=\"iso\"><sup>115<\/sup><sub>48<\/sub><\/span>Cd", "<span class=\"iso\"><sup>115<\/sup><sub>50<\/sub><\/span>Sn", "<span class=\"iso\"><sup>117<\/sup><sub>50<\/sub><\/span>Sn", "<span class=\"iso\"><sup>117<\/sup><sub>51<\/sub><\/span>Sb"], "a": 2, "e": "Z = 48 + 2 = 50 (tin). Mass number = 112 + 2 + 3 = 117. So <sup>117<\/sup>Sn.", "t": null}, {"k": "past", "s": "AQA June 2018 · AS Paper 1", "q": "How many protons are there in 6.0 g of nitrogen gas? (L = 6.022 × 10<sup>23<\/sup> mol<sup>−1<\/sup>)", "o": ["1.3 × 10<sup>23<\/sup>", "9.0 × 10<sup>23<\/sup>", "1.8 × 10<sup>24<\/sup>", "3.6 × 10<sup>24<\/sup>"], "a": 2, "e": "n(N<sub>2<\/sub>) = 6.0 ÷ 28.0 = 0.214 mol. Each N<sub>2<\/sub> has 14 protons: 0.214 × 14 = 3.0 mol of protons × 6.022 × 10<sup>23<\/sup> = <b>1.8 × 10<sup>24<\/sup><\/b>.", "t": null}, {"k": "past", "s": "AQA November 2021 · Paper 3", "q": "Which has the electron configuration of a noble gas?", "o": ["H<sup>+<\/sup>", "O<sup>−<\/sup>", "Se<sup>2−<\/sup>", "Zn<sup>2+<\/sup>"], "a": 2, "e": "Se (Group 6) gains two electrons to reach the configuration of krypton. H<sup>+<\/sup> has no electrons, O<sup>−<\/sup> has one electron too few for neon, and Zn<sup>2+<\/sup> is [Ar]3d<sup>10<\/sup>.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "Which atom in the ground state contains at least one unpaired p electron?", "o": ["Na", "Ne", "O", "Sc"], "a": 2, "e": "O is 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>4<\/sup>: one 2p orbital is paired and two contain single electrons. Na has an unpaired s electron, Ne has full p orbitals, Sc has an unpaired d electron.", "t": null}, {"k": "past", "s": "AQA November 2020 · AS Paper 1", "q": "Which is the electron configuration of an atom with only two unpaired electrons?", "o": ["1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>3<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>4<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>5<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 4s<sup>1<\/sup> 3d<sup>5<\/sup>"], "a": 1, "e": "Fill each orbital singly before pairing (Hund's rule). p<sup>3<\/sup> has 3 unpaired; p<sup>4<\/sup> has one pair and <b>2 unpaired<\/b>; p<sup>5<\/sup> has 1; Cr (4s<sup>1<\/sup>3d<sup>5<\/sup>) has 6.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Which atom has the greatest number of unpaired electrons?", "o": ["P", "V", "Fe", "Cu"], "a": 2, "e": "P (3p<sup>3<\/sup>) 3; V (3d<sup>3<\/sup>4s<sup>2<\/sup>) 3; Fe (3d<sup>6<\/sup>4s<sup>2<\/sup>) has one paired d orbital and <b>4<\/b> unpaired; Cu (3d<sup>10<\/sup>4s<sup>1<\/sup>) 1.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 1", "q": "Which element has atoms that contain only two unpaired electrons?", "o": ["cobalt", "magnesium", "nickel", "phosphorus"], "a": 2, "e": "Ni is [Ar]3d<sup>8<\/sup>4s<sup>2<\/sup>: five d orbitals hold 8 electrons, so three are paired and <b>two<\/b> are unpaired. Co (3d<sup>7<\/sup>) has 3, Mg has 0, P has 3.", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "What is the electron configuration of V<sup>2+<\/sup> in the ground state?", "o": ["1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 3d<sup>3<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 3d<sup>1<\/sup> 4s<sup>2<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 3d<sup>3<\/sup> 4s<sup>2<\/sup>", "1s<sup>2<\/sup> 2s<sup>2<\/sup> 2p<sup>6<\/sup> 3s<sup>2<\/sup> 3p<sup>6<\/sup> 3d<sup>5<\/sup> 4s<sup>2<\/sup>"], "a": 0, "e": "V is [Ar]3d<sup>3<\/sup>4s<sup>2<\/sup>. Transition metals lose their <b>4s electrons first<\/b> when forming ions, so V<sup>2+<\/sup> is [Ar]3d<sup>3<\/sup>.", "t": null}, {"k": "past", "s": "AQA June 2019 · Paper 3", "q": "Which atom has the greatest first ionisation energy?", "o": ["H", "He", "Li", "Ne"], "a": 1, "e": "He has the highest first IE of any element: its electrons are in the 1s orbital, very close to a nucleus with charge 2+, with no shielding.", "t": null}, {"k": "past", "s": "AQA June 2022 · Paper 3", "q": "Which ionisation needs less energy than this process? &nbsp; Mg(g) → Mg<sup>+<\/sup>(g) + e<sup>−<\/sup>", "o": ["Al(g) → Al<sup>+<\/sup>(g) + e<sup>−<\/sup>", "Ar(g) → Ar<sup>+<\/sup>(g) + e<sup>−<\/sup>", "Be(g) → Be<sup>+<\/sup>(g) + e<sup>−<\/sup>", "Mg<sup>+<\/sup>(g) → Mg<sup>2+<\/sup>(g) + e<sup>−<\/sup>"], "a": 0, "e": "Aluminium's outer electron is in a 3p orbital, which is higher in energy than Mg's 3s and slightly shielded by it, so it is easier to remove. Be is smaller, Ar has a greater nuclear charge, and the second IE is always larger.", "t": null}, {"k": "past", "s": "AQA June 2024 · Paper 3", "q": "Which element has the highest third ionisation energy?", "o": ["Li", "Be", "K", "Ca"], "a": 1, "e": "Be is 1s<sup>2<\/sup>2s<sup>2<\/sup>. After two electrons are removed, the third comes from the <b>1s<\/b> orbital, very close to the nucleus – a huge value. Li's third electron is also 1s but its nuclear charge is only 3+; K and Ca remove electrons from much further out.", "t": null}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "The first six ionisation energies of an element, in kJ mol<sup>−1<\/sup>, are: 1090, 2350, 4610, 6220, 37 800, 47 000. What is the element?", "o": ["Boron", "Carbon", "Nitrogen", "Oxygen"], "a": 1, "e": "The big jump is between the 4th and 5th ionisation energies, so there are <b>4<\/b> outer electrons (Group 4). The 5th electron comes from the 1s shell. Of the options, that is carbon.", "t": null}, {"k": "past", "s": "AQA June 2025 · AS Paper 1", "q": "Which Period 3 element has these successive ionisation energies?", "o": ["Al", "Si", "P", "S"], "a": 1, "e": "The large jump is between the 4th and 5th IE, so the element has 4 outer electrons: Group 4, silicon.", "t": [["", "1st", "2nd", "3rd", "4th", "5th", "6th"], ["IE / kJ mol<sup>−1<\/sup>", "786", "1580", "3230", "4360", "16 000", "20 000"]]}, {"k": "past", "s": "AQA June 2022 · AS Paper 1", "q": "In which pair is the first ionisation energy of atom Y greater than that of atom X?", "o": ["X: 1s<sup>2<\/sup>2s<sup>2<\/sup> &nbsp; Y: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>1<\/sup>", "X: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>3<\/sup> &nbsp; Y: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>4<\/sup>", "X: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>5<\/sup> &nbsp; Y: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup>", "X: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup> &nbsp; Y: 1s<sup>2<\/sup>2s<sup>2<\/sup>2p<sup>6<\/sup>3s<sup>1<\/sup>"], "a": 2, "e": "F → Ne: the IE rises across the period. The other pairs are the exceptions or a new shell: B < Be (2p higher in energy), O < N (paired-electron repulsion in 2p) and Na < Ne (new shell).", "t": null}, {"k": "past", "s": "AQA November 2021 · AS Paper 1", "q": "In a time of flight mass spectrometer, molecule X is ionised using electrospray ionisation. What is the equation for this ionisation?", "o": ["X(l) + e<sup>−<\/sup> → X<sup>+<\/sup>(g) + 2e<sup>−<\/sup>", "X(g) + e<sup>−<\/sup> → X<sup>+<\/sup>(g) + 2e<sup>−<\/sup>", "X(l) + H<sup>+<\/sup> → XH<sup>+<\/sup>(g)", "X(g) + H<sup>+<\/sup> → XH<sup>+<\/sup>(g)"], "a": 3, "e": "In electrospray ionisation the sample (dissolved in a volatile solvent) <b>gains a proton<\/b>, forming XH<sup>+<\/sup>. Electron impact (high-energy electrons knocking out an electron) is shown in B. AQA writes the equation with gaseous species.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Which statement about time of flight mass spectrometry is correct?", "o": ["The current in the detector is proportional to the ion abundance", "Sample particles gain electrons to form positive ions", "Particles are detected in the order of their kinetic energies", "Ions are accelerated by a magnetic field"], "a": 0, "e": "Each ion hitting the detector gains an electron, creating a current, so more ions means a bigger current. Ions are accelerated by an <i>electric<\/i> field to the same kinetic energy, and arrive in order of m/z.", "t": null}, {"k": "past", "s": "AQA June 2024 · AS Paper 1", "q": "Four samples are analysed by time of flight mass spectrometry. Each forms 1+ ions which are accelerated to the same kinetic energy. Which gives ions with the shortest time of flight?", "o": ["<sup>45<\/sup>Sc ionised by electron impact", "C<sub>3<\/sub>H<sub>8<\/sub> ionised by electrospray", "CH<sub>3<\/sub>CH<sub>2<\/sub>OH ionised by electrospray", "CO<sub>2<\/sub> ionised by electron impact"], "a": 3, "e": "Same KE, so lighter ions travel faster. Ion masses: Sc<sup>+<\/sup> 45; C<sub>3<\/sub>H<sub>9<\/sub><sup>+<\/sup> 45 (electrospray adds H<sup>+<\/sup>); C<sub>2<\/sub>H<sub>5<\/sub>OH<sub>2<\/sub><sup>+<\/sup> 47; CO<sub>2<\/sub><sup>+<\/sup> <b>44<\/b> – the lightest and fastest.", "t": null}, {"k": "past", "s": "AQA June 2017 · AS Paper 1", "q": "Chlorine exists as two isotopes, <sup>35<\/sup>Cl and <sup>37<\/sup>Cl, in the ratio 3 : 1. Which statement about peaks in the mass spectrum of Cl<sub>2<\/sub> is correct?", "o": ["Peaks at m/z = 70 and 74 in the ratio 3 : 1", "Peaks at m/z = 70, 72 and 74 in the ratio 9 : 6 : 1", "Peaks at m/z = 70, 72 and 74 in the ratio 9 : 3 : 1", "Peaks at m/z = 70 and 72 in the ratio 3 : 1"], "a": 1, "e": "<sup>35<\/sup>Cl<sup>35<\/sup>Cl: ¾ × ¾ = 9/16; <sup>35<\/sup>Cl<sup>37<\/sup>Cl (two ways): 2 × ¾ × ¼ = 6/16; <sup>37<\/sup>Cl<sup>37<\/sup>Cl: ¼ × ¼ = 1/16. So 70 : 72 : 74 = 9 : 6 : 1.", "t": null}, {"k": "past", "s": "AQA June 2025 · Paper 3", "q": "A sample of UF<sub>6<\/sub> contains <sup>19<\/sup>F with either <sup>235<\/sup>U or <sup>238<\/sup>U. The relative molecular mass of the sample is 351.43. What is the percentage abundance of <sup>235<\/sup>UF<sub>6<\/sub>?", "o": ["19", "33", "50", "81"], "a": 0, "e": "<sup>235<\/sup>UF<sub>6<\/sub> = 349 and <sup>238<\/sup>UF<sub>6<\/sub> = 352. 349x + 352(1 − x) = 351.43 → 3x = 0.57 → x = 0.19, so <b>19%<\/b>.", "t": null}];
const LET = ['A','B','C','D'];
const KIND = {past:'Past paper', adapted:'Adapted', practice:'Practice'};
const app = document.getElementById('app');

function counts(){ const c={past:0,adapted:0,practice:0}; QS.forEach(q=>c[q.k]++); return c; }
function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function table(t){

function start(){

  app.innerHTML = `<section class="card">

    <div class="stats">
      <div class="stat"><b>${c.past}</b><span>AQA past paper</span></div>
      <div class="stat"><b>${c.adapted}</b><span>Adapted from AQA</span></div>
      <div class="stat"><b>${c.practice}</b><span>Practice</span></div>
    </div>
    <label class="chk"><input type="checkbox" id="shuf" ${shuffle?'checked':''}> Shuffle the question order</label>
    <div class="row"><button class="btn" id="go">Start quiz</button></div>
    <p class="key">Keyboard: press A–D (or 1–4) to answer and Enter for the next question.</p>
  </section>`;
  document.getElementById('go').onclick = () => {
    shuffle = document.getElementById('shuf').checked;
    begin([...QS.keys()]);
  };
  document.getElementById('go').focus();
}

function begin(idx){
  order = shuffle ? shuffled(idx) : idx; pos = 0; score = 0; log = [];
  show();
}

function show(){
  answered = false;
  const q = QS[order[pos]];
  app.innerHTML = `<section class="card">
    <div class="prog"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <div class="bar"><i style="width:${pos/order.length*100}%"></i></div>
    <span class="chip ${q.k}">${q.s}</span>
    <p class="stem">${q.q}</p>
    ${table(q.t)}
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="L">${LET[i]}</span><span class="T">${o}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = QS[order[pos]], ok = i === q.a;
  if(ok) score++;
  log.push({qi:order[pos], pick:i, ok});
  app.querySelectorAll('.opt').forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const last = pos === order.length-1;
  document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}" role="status">
      <h3>${ok?'Correct!':'Not quite – the answer is '+LET[q.a]}</h3><p>${q.e}</p></div>
    <div class="next"><button class="btn" id="nx">${last?'See my score':'Next question →'}</button></div>`;
  app.querySelector('.prog span:last-child').textContent = 'Score: '+score;
  const nx = document.getElementById('nx');
  nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function next(){ if(pos < order.length-1){ pos++; show(); } else results(); }

function results(){
  const n = order.length, pct = Math.round(score/n*100);
  const msg = pct===100?'Perfect score – excellent!':pct>=80?'Great work. Check the review below for anything you missed.':pct>=60?'Good effort. Go through the review below, then retry the ones you got wrong.':'Keep going – read the explanations below carefully, then retry the questions you got wrong.';
  const wrong = log.filter(l=>!l.ok);
  let rev = '';
  if(wrong.length){
    rev = '<div class="rev"><h2>Review</h2>' + wrong.map(l=>{
      const q = QS[l.qi];
      return `<div class="ri"><div class="src">${q.s}</div><p style="margin:4px 0">${q.q}</p>${table(q.t)}
        <div class="yours">Your answer: ${LET[l.pick]} – ${q.o[l.pick]}</div>
        <div class="ans">Correct answer: ${LET[q.a]} – ${q.o[q.a]}</div><p style="margin:0">${q.e}</p></div>`;
    }).join('') + '</div>';
  }
  app.innerHTML = `<section class="card" style="text-align:center">
      <div class="big">${score} / ${n}</div>
      <p class="msg">${pct}% · ${msg}</p>
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="rw">Retry the '+wrong.length+' I got wrong</button>':''}
        <button class="btn ghost" id="ra">Start again</button>
      </div>
    </section>
    ${wrong.length?'<section class="card">'+rev+'</section>':''}`;
  if(wrong.length) document.getElementById('rw').onclick = () => begin(wrong.map(l=>l.qi));
  document.getElementById('ra').onclick = start;
  window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k = e.key.toUpperCase();
  const btns = app.querySelectorAll('.opt');
  if(btns.length && !answered){
    let i = LET.indexOf(k); if(i<0 && '1234'.includes(k)) i = +k-1;
    if(i>=0 && i<btns.length){ e.preventDefault(); choose(i); }
  }
});

start();
</script>
</body>
</html>
