<style>
/* Layout idea: four tabs, each one a single animated process diagram with a particle key above it,
   teacher controls below it and numbered stage cards that spotlight one part of the plant. Single light theme for projectors. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --ink:#131c2b; --muted:#56637a; --line:#d3dae6;
  --accent:#2a4fc9; --accent-soft:#e3e9fb;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
header a{color:var(--accent);font-size:.9rem;text-decoration:none;flex-basis:100%}
header a:hover{text-decoration:underline}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;min-width:150px}
.tabs button b{font-size:1rem}
.tabs button span{font-size:.82rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[aria-selected="true"] span{color:#fff;opacity:.85}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-bottom:8px}
.head h2{margin:0;font-size:1.3rem;text-wrap:balance}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px}

.seg .lab{font-weight:600;margin-right:4px}
.controls button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 13px;min-height:38px}

.controls button.primary{font-weight:650;min-width:92px}

.stages button{text-align:left;width:100%;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px}
.stages button:hover{border-color:var(--accent)}

<div class="wrap">

  </header>

<script>
(function(){
"use strict";
var W=1200,H=540,cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var C={water:"#3d8fd9",solid:"#8a5a2b",micro:"#3aa83a",salt:"#f2a13a",vap:"#a9cdf0",big:"#6f6258",grit:"#3b3632",org:"#9a6a34",
       chem:"#d6339a",gas:"#f5c33b",dig:"#4a3524",wall:"#56637a",pipe:"#d9e8f4",pipeEdge:"#6b7890",ink:"#131c2b",muted:"#56637a",tank:"#dcedf9"};
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ---------- paths: points are [x,y,halfWidthX,halfWidthY] ---------- */
function mk(pts){
  var P=pts.map(function(a){var wx=a[2]==null?4:a[2];return {x:a[0],y:a[1],wx:wx,wy:a[3]==null?wx:a[3]};}),L=[0],i;
  for(i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
  return {P:P,L:L,total:L[L.length-1]};
}
function at(p,s){
  var L=p.L,P=p.P,i=1;s=clamp(s,0,p.total);
  while(i<L.length-1&&s>L[i])i++;
  var a=P[i-1],b=P[i],t=(L[i]-L[i-1])?(s-L[i-1])/(L[i]-L[i-1]):0;
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,wx:a.wx+(b.wx-a.wx)*t,wy:a.wy+(b.wy-a.wy)*t};
}
function part(kind,path,v,o){
  var p={kind:kind,path:path,s:0,v:v*R(.85,1.15),ox:R(-1,1),oy:R(-1,1),a:1,ph:R(0,6.28),x:0,y:0};
  if(o)for(var k in o)p[k]=o[k];
  return p;
}
function stepParts(sc,dt){
  var ps=sc.ps,i,p,c;
  for(i=0;i<ps.length;i++){
    p=ps[i];
    if(p.fade){p.a-=dt*(p.fadeRate||1.1);if(p.a<=0)p.dead=true;}
    if(p.stuck)continue;
    c=at(p.path,p.s);
    p.s+=p.v*dt*clamp(9/Math.max(c.wx,c.wy),.2,1);
    if(p.on)p.on(p,sc);
    if(p.s>=p.path.total){if(p.end)p.end(p,sc);else p.dead=true;}
    c=at(p.path,p.s);
    p.x=c.x+p.ox*c.wx+Math.sin(sc.t*2.2+p.ph)*1.2;p.y=c.y+p.oy*c.wy+Math.cos(sc.t*1.9+p.ph)*1.2;
  }
  sc.ps=ps.filter(function(q){return !q.dead;});
}
function drawPart(p,t){
  var x=p.x,y=p.y,k=p.kind;
  ctx.globalAlpha=clamp(p.a,0,1);
  ctx.fillStyle=C[k];
  if(k==="water"||k==="vap"){ctx.beginPath();ctx.arc(x,y,3.2,0,6.3);ctx.fill();}
  else if(k==="micro"){ctx.save();ctx.translate(x,y);ctx.rotate(p.ph+Math.sin(t*4+p.ph)*.5);ctx.beginPath();ctx.ellipse(0,0,5.5,3,0,0,6.3);ctx.fill();ctx.restore();}
  else if(k==="salt"||k==="solid"||k==="big"||k==="chem"){
    var r=k==="big"?6:k==="solid"?4.2:3.6;ctx.save();ctx.translate(x,y);ctx.rotate(k==="chem"?.785:p.ph);
    ctx.fillRect(-r,-r*(k==="big"?.65:1),2*r,2*r*(k==="big"?.65:1));
    if(k==="salt"){ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.strokeRect(-r,-r,2*r,2*r);}
    ctx.restore();}
  else if(k==="gas"){ctx.beginPath();ctx.arc(x,y,4,0,6.3);ctx.fill();ctx.strokeStyle="#b98600";ctx.lineWidth=1;ctx.stroke();}
  else{ctx.beginPath();ctx.arc(x,y,k==="grit"?2.6:3.8,0,6.3);ctx.fill();}
  ctx.globalAlpha=1;
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function pipe(pts,w,col){
  w=w||12;ctx.lineJoin="round";ctx.lineCap="butt";
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=C.pipeEdge;ctx.lineWidth=w+4;ctx.stroke();ctx.strokeStyle=col||C.pipe;ctx.lineWidth=w;ctx.stroke();
}
function tank(x,y,w,h,fill,level){
  ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h);
  ctx.fillStyle=fill||C.tank;ctx.fillRect(x,y+(level||10),w,h-(level||10));
  ctx.strokeStyle=C.wall;ctx.lineWidth=5;ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w,y-6);ctx.stroke();
}
function txt(s,x,y,o){
  o=o||{};ctx.font=(o.b?"700 ":"500 ")+(o.size||15)+"px "+getComputedStyle(document.body).fontFamily;
  ctx.textAlign=o.al||"center";ctx.textBaseline="alphabetic";ctx.fillStyle=o.col||C.ink;
  String(s).split("\n").forEach(function(l,i){
    if(o.halo){ctx.strokeStyle=o.halo;ctx.lineWidth=5;ctx.lineJoin="round";ctx.strokeText(l,x,y+i*(o.size||15)*1.2);}
    ctx.fillText(l,x,y+i*(o.size||15)*1.2);});
}
function pin(n,x,y){ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(x,y,14,0,6.3);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();txt(n,x,y+5.5,{b:1,size:15,col:"#fff"});}
function arrow(x1,y1,x2,y2,col,w){
  var a=Math.atan2(y2-y1,x2-x1),h=9;ctx.strokeStyle=col;ctx.lineWidth=w||3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5));ctx.lineTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5));ctx.stroke();
}
function ground(y,col){ctx.fillStyle=col||"#dfe6dc";ctx.fillRect(0,y,W,H-y);}
function waves(x0,x1,y,t,col){
  ctx.strokeStyle=col||"#ffffff";ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();
  for(var x=x0;x<=x1;x+=6){var yy=y+Math.sin(x*.05+t*1.5)*2.5;if(x===x0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();ctx.globalAlpha=1;
}
function flame(x,y,h,t,ph){
  var k=1+Math.sin(t*9+ph)*.15;
  ctx.fillStyle="#ff8a2e";ctx.beginPath();ctx.moveTo(x-h*.3,y);ctx.quadraticCurveTo(x-h*.35,y-h*.5*k,x,y-h*k);ctx.quadraticCurveTo(x+h*.35,y-h*.5*k,x+h*.3,y);ctx.fill();
  ctx.fillStyle="#ffd27a";ctx.beginPath();ctx.moveTo(x-h*.15,y);ctx.quadraticCurveTo(x-h*.16,y-h*.3*k,x,y-h*.55*k);ctx.quadraticCurveTo(x+h*.16,y-h*.3*k,x+h*.15,y);ctx.fill();
}
function cloud(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,16*s,0,6.3);ctx.arc(x+20*s,y-8*s,20*s,0,6.3);ctx.arc(x+44*s,y,16*s,0,6.3);ctx.fill();rr(x-6*s,y-2*s,56*s,18*s,9*s);ctx.fill();}
function capStuck(sc,kind,max){
  var st=sc.ps.filter(function(q){return q.stuck&&q.kind===kind&&!q.fade;});
  for(var i=0;i<st.length-max;i++)st[i].fade=true;
}

/* =====================================================================
   1. FRESH WATER
   ===================================================================== */
var S1=(function(){
  var P=mk([[120,333,75,14],[222,322,8,5],[262,322],[262,240],[338,240],[445,250,95,12],[445,302,95,10],[445,360,95,10],[445,408,95,8],[552,408],[655,408],[760,335,92,62],[862,300],[950,300],[1002,300],[1012,318,3],[1012,452,3,1]]);
  var sandS=P.L[5]+14,sterA=P.L[10]+30,sterB=P.L[11];
  var speck=[],i;
  for(i=0;i<260;i++)speck.push([R(340,550),R(272,334),R(.8,1.6)]);
  var peb=[];for(i=0;i<70;i++)peb.push([R(344,546),R(342,384),R(4,7.5)]);
  var sc={
    id:"fresh-water",tab:"Fresh water",tabsub:"filter, then sterilise",
    title:"Potable water from fresh water",sub:"The method used in the UK",
    key:[["water","Water"],["solid","Insoluble solids","sq"],["micro","Microbes"]],
    hint:"Choose the sterilising agent. All three kill microbes; none of them removes dissolved salts.",
    stages:[
      {title:"Choose a source",tx:"Rain has low levels of dissolved substances. It collects in the ground and in lakes and rivers.",box:[14,60,260,400],pin:[40,285]},
      {title:"Filter beds",tx:"The water passes through beds of sand and gravel. Insoluble solids are trapped.",box:[300,165,290,290],pin:[320,195]},
      {title:"Sterilise",tx:"Microbes are killed using chlorine, ozone or ultraviolet light.",box:[625,165,275,290],pin:[645,195]},
      {title:"Potable water",tx:"Safe to drink. It is not pure: it still has low levels of dissolved salts and microbes.",box:[925,220,205,270],pin:[950,250]}
    ],
    agent:"chlorine",ps:[],t:0,acc:0,
    spawn:function(dt){
      this.acc+=dt;
      while(this.acc>.085){this.acc-=.085;
        var r=Math.random();
        if(r<.72)this.ps.push(part("water",P,95));
        else if(r<.87)this.ps.push(part("solid",P,95,{stop:sandS+R(0,10),on:function(p,sc){if(p.s>=p.stop){p.stuck=true;p.y=R(266,274);capStuck(sc,"solid",34);}}}));
        else this.ps.push(part("micro",P,95,{stop:R(sterA,sterB+40),on:function(p){if(p.s>=p.stop){p.fade=true;p.fadeRate=.9;}}}));
      }
    },
    draw:function(t){
      /* sky, hills, rain */
      var g=ctx.createLinearGradient(0,0,0,470);g.addColorStop(0,"#dcecf8");g.addColorStop(1,"#f7f9fc");ctx.fillStyle=g;ctx.fillRect(0,0,W,470);
      ground(470);
      ctx.fillStyle="#a9cc98";ctx.beginPath();ctx.moveTo(0,470);ctx.lineTo(0,300);ctx.quadraticCurveTo(60,230,130,300);ctx.quadraticCurveTo(200,250,262,318);ctx.quadraticCurveTo(300,380,330,470);ctx.fill();
      ctx.fillStyle="#8fbb7f";ctx.beginPath();ctx.moveTo(0,470);ctx.lineTo(0,360);ctx.quadraticCurveTo(140,395,270,345);ctx.quadraticCurveTo(300,400,330,470);ctx.fill();
      cloud(70,118,1.25,"#9aa3b0");cloud(150,100,1,"#aab2bd");
      ctx.strokeStyle="#4f93cf";ctx.lineWidth=2;ctx.lineCap="round";
      for(var i=0;i<16;i++){var rx=62+i*10,ry=142+((t*120+i*37)%120);ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-4,ry+13);ctx.stroke();}
      ctx.globalAlpha=1;
      ctx.fillStyle="#5aa6e0";ctx.beginPath();ctx.ellipse(125,334,102,26,0,0,6.3);ctx.fill();waves(50,200,330,t);
      txt("Reservoir, lake or river",130,400,{b:1,size:15});txt("or groundwater",130,420,{size:14,col:C.muted});
      /* pipes */
      pipe([[222,322],[262,322],[262,240],[338,240]]);pipe([[552,408],[655,408]]);pipe([[862,300],[1004,300]]);
      /* filter bed */
      tank(335,215,220,210,C.tank,14);
      ctx.fillStyle="#e8d39a";ctx.fillRect(338,270,214,66);
      ctx.fillStyle="#c9ae6a";speck.forEach(function(s){ctx.fillRect(s[0],s[1],s[2],s[2]);});
      ctx.fillStyle="#cfd6dd";ctx.fillRect(338,336,214,52);
      peb.forEach(function(s,k){ctx.fillStyle=k%2?"#8d98a5":"#a7b0bb";ctx.beginPath();ctx.ellipse(s[0],s[1],s[2],s[2]*.75,0,0,6.3);ctx.fill();});
      txt("Filter bed",445,200,{b:1,size:16});
      txt("sand",572,308,{al:"left",size:14,col:C.muted});txt("gravel",572,368,{al:"left",size:14,col:C.muted});
      /* sterilisation tank */
      tank(655,240,210,185,this.agent==="chlorine"?"#e3f1d9":C.tank,12);
      txt("Sterilisation",760,200,{b:1,size:16});
      if(this.agent==="uv"){
        ctx.fillStyle="rgba(140,90,255,.16)";rr(672,300,176,70,35);ctx.fill();ctx.fillStyle="rgba(140,90,255,.22)";rr(684,316,152,38,19);ctx.fill();
        ctx.fillStyle="#b9a2ff";rr(690,328,140,14,7);ctx.fill();ctx.strokeStyle="#6b46e0";ctx.lineWidth=2;ctx.stroke();
        txt("UV lamp",760,395,{size:14,col:"#5a3fc0",b:1});
      }else{
        var col=this.agent==="chlorine"?"#b5c916":"#ffffff",n=this.agent==="chlorine"?26:22;
        for(i=0;i<n;i++){
          var bx=672+((i*61)%176),by=this.agent==="chlorine"?262+((i*47+t*22)%150):415-((i*53+t*45)%160);
          ctx.beginPath();ctx.arc(bx+Math.sin(t*2+i)*3,by,this.agent==="chlorine"?3:4.5,0,6.3);
          if(this.agent==="chlorine"){ctx.fillStyle=col;ctx.fill();}else{ctx.fillStyle="rgba(255,255,255,.8)";ctx.fill();ctx.strokeStyle="#7fb5dd";ctx.lineWidth=1.3;ctx.stroke();}
        }
        if(this.agent==="chlorine"){pipe([[760,218],[760,246]],6,"#d7e36a");txt("chlorine added",774,232,{al:"left",size:14,col:"#66750a",b:1});ctx.textAlign="center";}
        else txt("ozone bubbled through",760,446,{size:14,col:"#2f6f9f",b:1});
      }
      /* tap and glass */
      ctx.fillStyle=C.wall;rr(996,286,30,26,5);ctx.fill();rr(1004,270,14,18,3);ctx.fill();rr(992,264,38,9,4);ctx.fill();
      ctx.strokeStyle="#8fa3b8";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(982,392);ctx.lineTo(988,462);ctx.lineTo(1036,462);ctx.lineTo(1042,392);ctx.stroke();
      ctx.fillStyle="rgba(61,143,217,.35)";ctx.beginPath();ctx.moveTo(985,418);ctx.lineTo(989,460);ctx.lineTo(1035,460);ctx.lineTo(1039,418);ctx.fill();
      txt("Potable water",1085,340,{b:1,size:16});txt("safe to drink,\nnot pure",1085,362,{size:14,col:C.muted});
    }
  };
  return sc;
})();

/* =====================================================================
   2. DISTILLATION
   ===================================================================== */
var S2=(function(){
  var PW=mk([[70,480,50,14],[150,462],[150,378],[262,378],[390,378,110,34],[390,326,110,3],[390,270,100,30],[390,214,18,6],[390,150,5],[640,150,5],[770,225,5],[900,300,5],[985,300,4],[1030,322,3],[1030,445,62,8]]);
  var sSurf=PW.L[5],sCond=PW.L[10];
  var PS=mk([[70,480,50,14],[150,462],[150,378],[262,378],[390,372,105,30],[450,395,50,14],[340,400,60,12],[290,414,16,4],[258,414],[205,414],[205,468],[130,492,40,10]]);
  return {
    id:"distillation",tab:"Distillation",tabsub:"desalination by heating",
    title:"Desalination by distillation",sub:"Used where fresh water is limited and sea water is the source",
    key:[["water","Water (liquid)"],["vap","Water vapour"],["salt","Dissolved salts","sq"]],
    hint:"Watch the salt: it never leaves the boiler as vapour.",
    stages:[
      {title:"Sea water in",tx:"Sea water contains a lot of dissolved salts, so it is not potable.",box:[8,350,238,180],pin:[30,440]},
      {title:"Heat",tx:"The water is heated and evaporates. The salts are left behind.",box:[240,185,300,300],pin:[262,206]},
      {title:"Condense",tx:"The water vapour is cooled and condenses back into liquid water.",box:[590,105,360,235],pin:[612,126]},

    id:"reverse-osmosis",tab:"Reverse osmosis",tabsub:"desalination by membrane",

      for(i=0;i<22;i++)this.ws.push(mol(R(MB+10,X1-10),R(Y0+10,Y1-10),"R"));
      for(i=0;i<22;i++){var m=mol(R(270,MA-20),R(Y0+16,Y1-16),"L");m.ion=i%2?"cl":"na";m.r=i%2?11:9.5;m.vx*=.6;m.vy*=.6;this.ions.push(m);}

          nl++;

          if(m.x>MA-5){if(Math.random()<.03+.5*P*P){m.tr=1;m.y=poreY(m.y);}else{m.x=MA-5;m.vx=-Math.abs(m.vx);}}

      txt(P>.6?"High pressure":P>.3?"Medium pressure":"Low pressure",95,352,{b:1,size:15,col:"#c0392b"});

      ctx.strokeStyle=C.wall;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(727,428);ctx.lineTo(727,385);ctx.bezierCurveTo(727,325,893,325,893,385);ctx.lineTo(893,466);ctx.moveTo(893,490);ctx.lineTo(893,495);ctx.lineTo(727,495);ctx.lineTo(727,452);ctx.stroke();
      txt("Anaerobic digestion",810,520,{b:1,size:15});
      /* biogas use and fertiliser */
      ctx.fillStyle=C.wall;rr(958,336,54,34,6);ctx.fill();flame(985,336,26,t,1);
      txt("biogas (methane)\nburned for energy",985,392,{size:14,col:C.muted});
      ctx.fillStyle="#c9a66b";rr(975,456,56,46,8);ctx.fill();ctx.strokeStyle="#8a6a34";ctx.lineWidth=2.5;ctx.stroke();
      txt("fertiliser",1003,524,{size:14,col:C.muted});
    },
    fg:function(){
      txt("effluent",590,322,{size:14,col:"#1f5580",b:1,halo:"#dcedf9"});
      txt("sewage sludge",530,368,{size:14,col:"#fff",b:1,halo:"#8a6a44"});
      txt("sealed: no oxygen",810,416,{size:14,col:"#4a3a1c",b:1,halo:"#d9c7a8"});
    }
  };
})();

/* ---------- shell ---------- */
var SC=[S1,S2,S3,S4],cur=0,playing=!matchMedia("(prefers-reduced-motion: reduce)").matches,speed=1,hl=-1,last=0;
var el=function(id){return document.getElementById(id);};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
var KEYCOL={na:"#7d5bd6",cl:"#1a9e6f"};
function stepScene(sc,dt){sc.t+=dt;if(sc.step)sc.step(dt);else{sc.spawn(dt);stepParts(sc,dt);}}
function render(){
  var sc=SC[cur];
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  sc.draw(sc.t);
  if(sc.ps)sc.ps.forEach(function(p){drawPart(p,sc.t);});
  if(sc.fg)sc.fg(sc.t);
  if(hl>=0){
    var b=sc.stages[hl].box;
    ctx.fillStyle="rgba(238,241,246,.8)";ctx.beginPath();ctx.rect(0,0,W,H);ctx.rect(b[0],b[1],b[2],b[3]);ctx.fill("evenodd");
    ctx.strokeStyle="#2a4fc9";ctx.lineWidth=3;rr(b[0],b[1],b[2],b[3],10);ctx.stroke();
  }
  sc.stages.forEach(function(s,i){if(hl<0||hl===i)pin(i+1,s.pin[0],s.pin[1]);});
}
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(playing){stepScene(SC[cur],dt*speed);}
  render();requestAnimationFrame(frame);
}
function show(i){
  cur=i;hl=-1;var sc=SC[i];
  el("title").textContent=sc.title;el("sub").textContent=sc.sub;el("hint").textContent=sc.hint;
  el("key").innerHTML=sc.key.map(function(k){return '<li><i class="'+(k[2]||"")+'" style="background:'+(C[k[0]]||KEYCOL[k[0]])+'"></i>'+esc(k[1])+'</li>';}).join("");
  el("stages").innerHTML=sc.stages.map(function(s,n){return '<li><button type="button" data-n="'+n+'" aria-pressed="false"><span class="hd"><span class="num">'+(n+1)+'</span>'+esc(s.title)+'</span><span class="tx">'+esc(s.tx)+'</span></button></li>';}).join("");
  el("agent").hidden=i!==0;el("press").hidden=i!==2;
  [].forEach.call(el("tabs").children,function(b,n){b.setAttribute("aria-selected",n===i?"true":"false");});
  render();
}
el("tabs").innerHTML=SC.map(function(s,i){return '<button type="button" role="tab" data-i="'+i+'"><b>'+(i+1)+'. '+esc(s.tab)+'</b><span>'+esc(s.tabsub)+'</span></button>';}).join("");
el("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i;try{history.replaceState(null,"","#"+SC[i].id);}catch(_){location.hash=SC[i].id;}show(i);});
el("stages").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var n=+b.dataset.n;hl=hl===n?-1:n;
  [].forEach.call(el("stages").querySelectorAll("button"),function(x,k){x.setAttribute("aria-pressed",k===hl?"true":"false");});render();});
el("play").addEventListener("click",function(){playing=!playing;el("play").textContent=playing?"Pause":"Play";});
function segs(id,fn){el(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(el(id).querySelectorAll("button"),function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});fn(b.dataset.v);});}
segs("speed",function(v){speed=+v;});
segs("agent",function(v){S1.agent=v;render();});
el("pr").addEventListener("input",function(){S3.P=this.value/100;render();});
function fromHash(){var h=location.hash.replace("#",""),i=SC.findIndex(function(s){return s.id===h;});show(i<0?0:i);}
addEventListener("hashchange",fromHash);

/* run each scene forward so the page is complete at rest */
S3.init();
SC.forEach(function(sc){for(var k=0;k<(sc.step?150:900);k++)stepScene(sc,.04);});
S3.count=0;
el("play").textContent=playing?"Pause":"Play";
function size(){var d=Math.min(2,window.devicePixelRatio||1),w=Math.max(760,cv.clientWidth||1200);cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);render();}
addEventListener("resize",size);
fromHash();size();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
