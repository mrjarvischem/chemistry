<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: stained-slide. Big specimen stage on the left, a reading panel on the right, structure chips under the stage.
     Palette borrows from H&E histology stain: eosin pink cytoplasm, haematoxylin violet nucleus. */
  --bg:#f4f0f6; --panel:#ffffff; --soft:#f1ebf4; --ink:#2b1b3f; --muted:#6c5d7e; --line:#dfd5e6;
  --accent:#c4317c; --good:#23825f; --bad:#b3392f;
  --c-cyto:#fbe6ee; --c-cyto2:#f5d0de; --c-mem:#a8407e;
  --c-nuc:#5a48b0; --c-nucfill:#d9d2f3; --c-chrom:#4a3a9c; --c-nucleolus:#2e2372;
  --c-rer:#3f6fc4; --c-rerl:#cfe0fa; --c-ser:#1f9a94; --c-serl:#c9eeea;
  --c-golgi:#d98a1f; --c-golgil:#fbe3b8; --c-ves:#d98a1f; --c-vesl:#fdeccb;
  --c-mito:#d24a3f; --c-mitof:#f6c3b8; --c-mitom:#fdebe5;
  --c-wall:#8a7a3c; --c-chl:#2f8f3e; --c-chlf:#cfeeba; --c-gran:#1f6b2e; --c-vac:#4f8fc9; --c-vacf:#dcecf8;
  --c-lys:#6f9a2a; --c-lysl:#d8eaae; --c-cent:#2f6f5e; --c-cyt:#a797bd; --c-ribo:#3a2859;
  --display:"Gabarito","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#130e1d; --panel:#1c152a; --soft:#251b37; --ink:#f0e9f8; --muted:#ab9bbf; --line:#372a4e;
  --accent:#ff6fb1; --good:#5fd3a3; --bad:#ff8a7d;
  --c-cyto:#2a1d3f; --c-cyto2:#211631; --c-mem:#ff7fbd;
  --c-nuc:#9f8cff; --c-nucfill:#2f2560; --c-chrom:#b9a9ff; --c-nucleolus:#d9d0ff;
  --c-rer:#6ea2ff; --c-rerl:#1d2f57; --c-ser:#3fd6cc; --c-serl:#12403d;
  --c-golgi:#ffb347; --c-golgil:#4a3212; --c-ves:#ffb347; --c-vesl:#4a3212;
  --c-mito:#ff7a6b; --c-mitof:#5a231d; --c-mitom:#3a1815;
  --c-wall:#c9b76a; --c-chl:#6fdc7a; --c-chlf:#183a1c; --c-gran:#9af0a0; --c-vac:#7fb6ee; --c-vacf:#14263a;
  --c-lys:#a9d94f; --c-lysl:#30401a; --c-cent:#62d0b4; --c-cyt:#6f5f8c; --c-ribo:#e6dcf5;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#130e1d; --panel:#1c152a; --soft:#251b37; --ink:#f0e9f8; --muted:#ab9bbf; --line:#372a4e;
  --accent:#ff6fb1; --good:#5fd3a3; --bad:#ff8a7d;
  --c-cyto:#2a1d3f; --c-cyto2:#211631; --c-mem:#ff7fbd;
  --c-nuc:#9f8cff; --c-nucfill:#2f2560; --c-chrom:#b9a9ff; --c-nucleolus:#d9d0ff;
  --c-rer:#6ea2ff; --c-rerl:#1d2f57; --c-ser:#3fd6cc; --c-serl:#12403d;
  --c-golgi:#ffb347; --c-golgil:#4a3212; --c-ves:#ffb347; --c-vesl:#4a3212;
  --c-mito:#ff7a6b; --c-mitof:#5a231d; --c-mitom:#3a1815;
  --c-wall:#c9b76a; --c-chl:#6fdc7a; --c-chlf:#183a1c; --c-gran:#9af0a0; --c-vac:#7fb6ee; --c-vacf:#14263a;
  --c-lys:#a9d94f; --c-lysl:#30401a; --c-cent:#62d0b4; --c-cyt:#6f5f8c; --c-ribo:#e6dcf5;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 22px 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:14px;font-weight:500}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);gap:16px;padding:0 22px 18px}
.stagecol{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
#cell{width:100%;height:100%;display:block;font-family:var(--body);touch-action:manipulation}
.hint{position:absolute;left:14px;bottom:10px;font-size:13px;color:var(--muted);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px 5px 9px;font-size:14px;font-weight:500;white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.org{cursor:pointer;transition:opacity .25s}
.org.dim{opacity:.32}
.org.sel{filter:drop-shadow(0 0 7px var(--accent))}
.org.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.lab{cursor:pointer}
.lab text{font-size:19px;font-weight:600;fill:var(--ink)}
.lab line{stroke:var(--muted);stroke-width:1.3}
.lab circle{fill:var(--ink)}
.lab.sel text{fill:var(--accent)}
.lab.sel line{stroke:var(--accent);stroke-width:2}
.lab.sel circle{fill:var(--accent)}
.nolabels .lab{display:none}
#route{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;pointer-events:none}
#rdot{transition:transform .7s cubic-bezier(.4,0,.2,1);pointer-events:none}
#rdot circle{fill:var(--accent);stroke:var(--panel);stroke-width:3}
.scale line{stroke:var(--ink);stroke-width:3}
.scale text{font-size:17px;font-weight:600;fill:var(--ink)}

.panel{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.modebox{background:var(--soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.modebox .k{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.modebox p{margin:0;font-size:17px;font-weight:500;text-wrap:pretty}
.modebox .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#130e1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#130e1d}}
.btn:disabled{opacity:.4;cursor:default}
.fb{font-weight:600;font-size:15px}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head i{width:16px;height:16px;border-radius:50%;flex:none}
.head h2{font-family:var(--display);font-size:27px;line-height:1.1;margin:0;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.tag.spec{background:none;border:1px solid var(--accent);color:var(--accent)}
figure{margin:0;background:var(--soft);border-radius:12px;overflow:hidden}
#anim{display:block;width:100%;aspect-ratio:16/9}
figcaption{display:flex;gap:10px;align-items:flex-start;padding:8px 12px 10px;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line)}
figcaption .btn{flex:none;min-width:74px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols h3{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.cols ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.tip{margin:0;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:15px}
.tip b{color:var(--accent)}
.over h2{font-family:var(--display);font-size:27px;margin:0 0 6px}
.over p{margin:0 0 10px;max-width:60ch}
.over ul{margin:0 0 10px;padding-left:18px}
.over .small{font-size:14px;color:var(--muted)}

@media (max-width:900px){
  html,body{height:auto}
  body{display:block}
  .top{padding:12px 16px 8px;gap:8px}
  .brand{width:100%}
  .brand h1{font-size:22px}
  main{display:block;padding:0 16px 20px}
  .stage{flex:none}
  #cell{height:auto}
  .hint{position:static;padding:0 12px 8px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:10px 0}
  .panel{overflow:visible}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Cell Explorer</h1><span>A-level Biology · eukaryotic cell ultrastructure</span></div>
  <div class="seg" id="cellseg" role="group" aria-label="Cell type">
    <button type="button" data-cell="animal">Animal</button>
    <button type="button" data-cell="plant">Plant</button>
  </div>
  <div class="seg" id="modeseg" role="group" aria-label="Mode">
    <button type="button" id="m-explore" data-mode="explore">Explore</button>
    <button type="button" id="m-route" data-mode="route">Protein route</button>
    <button type="button" id="m-test" data-mode="test">Test me</button>
  </div>
  <button type="button" class="tog" id="lab-btn" aria-pressed="true">Labels</button>
  <button type="button" class="icon" id="theme-btn" aria-label="Switch between light and dark" title="Light or dark">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
  </button>
</header>

<main>
  <div class="stagecol">
    <div class="stage">
      <svg id="cell" viewBox="-70 0 1340 800" role="img" aria-label="Diagram of a cell. Select a structure to see its function."></svg>
      <div class="hint" id="hint">Click any structure in the cell</div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Structures"></div>
  </div>

  <aside class="panel" aria-live="polite">
    <div class="modebox" id="modebox" hidden></div>
    <div class="over" id="over"></div>
    <div id="info" hidden>
      <div class="head"><i id="p-sw"></i><h2 id="p-name"></h2></div>
      <div class="tags" id="p-tags" style="margin-top:8px"></div>
      <figure style="margin-top:14px">
        <canvas id="anim" aria-label="Animation of the selected structure at work"></canvas>
        <figcaption><button type="button" class="btn" id="play">Pause</button><span id="p-cap"></span></figcaption>
      </figure>
      <div class="cols" style="margin-top:14px">
        <section><h3>Structure</h3><ul id="p-s"></ul></section>
        <section><h3>Function</h3><ul id="p-f"></ul></section>
      </div>
      <p class="tip" id="p-tip" style="margin-top:14px"></p>
    </div>
  </aside>
</main>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const AQA='AQA 3.2.1.1', EXT='Beyond the AQA spec';

/* ---------------- content ---------------- */
const O=[
{id:'mem',name:'Cell-surface membrane',col:'--c-mem',spec:AQA,size:'about 7 nm thick',
 s:['Phospholipid bilayer with proteins, cholesterol, glycoproteins and glycolipids (fluid mosaic model)','Partially permeable'],
 f:['Controls which substances enter and leave the cell','Receptors and antigens allow cell signalling and cell recognition'],
 cap:'Small non-polar molecules diffuse straight through the bilayer. Ions and polar molecules need a channel or carrier protein.',
 clue:'Controls which substances enter and leave the cell.',
 tip:'Call it the cell-surface membrane, not just the cell membrane: organelles have membranes too.'},
{id:'nuc',name:'Nucleus',col:'--c-nuc',spec:AQA,size:'about 5 to 10 µm',
 s:['Usually the largest organelle','Contains chromosomes (protein-bound, linear DNA) and one or more nucleoli','Surrounded by the nuclear envelope'],
 f:['Holds the genetic code for making polypeptides','Site of DNA replication and transcription','Controls the activities of the cell'],
 cap:'Transcription: RNA polymerase copies a gene into mRNA, which then leaves through a nuclear pore.',
 clue:'Site of DNA replication and transcription.',
 tip:'Mature red blood cells have no nucleus, leaving more room for haemoglobin.'},
{id:'env',name:'Nuclear envelope and pores',col:'--c-nuc',spec:AQA,size:'pores about 100 nm across',
 s:['Double membrane around the nucleus','Outer membrane is continuous with the rough ER','Perforated by thousands of nuclear pores'],
 f:['Separates the DNA from reactions in the cytoplasm','Pores let mRNA and ribosomal subunits out, and nucleotides and enzymes in'],
 cap:'mRNA leaves through the pore while nucleotides and enzymes enter. Ribosomes sit on the outer membrane.',
 clue:'Lets mRNA leave the nucleus.',
 tip:'DNA is too large to leave through a pore. Only the mRNA copy leaves.'},
{id:'nucleolus',name:'Nucleolus',col:'--c-nucleolus',spec:AQA,size:'about 1 to 2 µm',
 s:['Dense, dark-staining region inside the nucleus','Not surrounded by a membrane'],
 f:['Makes ribosomal RNA (rRNA)','Assembles rRNA with proteins into ribosomal subunits'],
 cap:'rRNA and proteins are assembled into ribosomal subunits, which leave the nucleus through a pore.',
 clue:'Makes rRNA and assembles ribosomal subunits.',
 tip:'Cells that make a lot of protein often have large or several nucleoli.'},
{id:'chrom',name:'Chromatin',col:'--c-chrom',spec:AQA,size:'DNA helix is 2 nm wide',
 s:['Linear DNA wound around histone proteins','Loosely packed between divisions, so genes can be read'],
 f:['Carries the genes: the base sequences that code for polypeptides','Condenses into visible chromosomes before the cell divides'],
 cap:'DNA wraps around histone proteins. Before division the chromatin coils tightly into a chromosome.',
 clue:'DNA wound around histone proteins.',
 tip:'Eukaryotic DNA is linear and protein-bound. Prokaryotic DNA is circular and not associated with histones.'},
{id:'ribo',name:'Ribosomes',col:'--c-ribo',spec:AQA,size:'about 25 nm',
 s:['80S ribosomes: a large and a small subunit','Made of rRNA and protein, with no membrane','Free in the cytoplasm or attached to the rough ER'],
 f:['Site of translation: amino acids are joined into a polypeptide in the order set by the mRNA'],
 cap:'The ribosome moves along the mRNA. Each tRNA brings a specific amino acid, and the polypeptide grows.',
 clue:'Site of translation in protein synthesis.',
 tip:'80S in eukaryotic cytoplasm. Smaller 70S ribosomes are found in prokaryotes, mitochondria and chloroplasts.'},
{id:'rer',name:'Rough endoplasmic reticulum',col:'--c-rer',spec:AQA,size:'cisternae 20 to 30 nm wide',
 s:['Flattened membrane sacs called cisternae','Continuous with the nuclear envelope','Ribosomes on the outer surface'],
 f:['Large surface area for protein synthesis','Folds polypeptides and transports them through the cell','Packages proteins into vesicles bound for the Golgi apparatus'],
 cap:'Ribosomes feed new polypeptides into the lumen, where they fold. Vesicles then carry them to the Golgi.',
 clue:'Membrane sacs covered in ribosomes that fold and transport proteins.',
 tip:'Extensive in cells that secrete protein, such as plasma cells making antibodies.'},
{id:'ser',name:'Smooth endoplasmic reticulum',col:'--c-ser',spec:AQA,size:'tubules 30 to 60 nm wide',
 s:['Network of membrane tubules','No ribosomes on the surface'],
 f:['Synthesises, stores and transports lipids','Synthesises, stores and transports carbohydrates'],
 cap:'Enzymes in the SER join glycerol to three fatty acids, making a triglyceride that is transported onwards.',
 clue:'Synthesises, stores and transports lipids and carbohydrates.',
 tip:'Abundant in liver cells and in cells that make steroid hormones.'},
{id:'golgi',name:'Golgi apparatus',col:'--c-golgi',spec:AQA,size:'stack about 1 µm across',
 s:['Stack of flattened, curved membrane sacs (cisternae)','Vesicles arrive at one face and bud from the other'],
 f:['Modifies proteins, for example adding carbohydrate to make glycoproteins','Sorts and packages molecules into Golgi vesicles','Forms lysosomes and processes lipids'],
 cap:'A protein from the RER passes through the stack, has carbohydrate added, and leaves in a Golgi vesicle.',
 clue:'Modifies proteins and packages them into vesicles.',
 tip:'Well developed in secretory cells, such as the epithelial cells lining the small intestine.'},
{id:'ves',name:'Golgi vesicles',col:'--c-ves',spec:AQA,size:'about 50 to 100 nm',
 s:['Small sacs surrounded by a single membrane','Pinched off from the edges of the Golgi cisternae'],
 f:['Store and transport the molecules made by the Golgi','Fuse with the cell-surface membrane to release contents by exocytosis'],
 cap:'The vesicle moves to the cell-surface membrane, fuses with it and releases its contents outside the cell.',
 clue:'Carry modified proteins to the cell-surface membrane for exocytosis.',
 tip:'When a vesicle fuses, its membrane becomes part of the cell-surface membrane.'},
{id:'lys',cells:'animal',name:'Lysosomes',col:'--c-lys',spec:AQA,size:'about 0.1 to 1 µm',
 s:['A type of Golgi vesicle with a single membrane','Contains hydrolytic enzymes (lysozymes), kept apart from the cytoplasm'],
 f:['Hydrolyse material taken in by phagocytosis','Break down worn-out organelles so their parts can be reused','Release enzymes outside the cell or digest the whole cell after it dies'],
 cap:'A lysosome fuses with a phagosome. Its hydrolytic enzymes digest the bacterium and the products are absorbed.',
 clue:'Contain hydrolytic enzymes that digest pathogens and worn-out organelles.',
 tip:'The AQA specification describes a lysosome as a type of Golgi vesicle that releases lysozymes.'},
{id:'mito',name:'Mitochondria',col:'--c-mito',spec:AQA,size:'1 to 10 µm long',
 s:['Double membrane: the inner one is folded into cristae','Matrix contains enzymes, 70S ribosomes and circular DNA'],
 f:['Site of aerobic respiration','Produce ATP, the cell’s immediate energy source','Cristae give a large surface area for the enzymes of oxidative phosphorylation'],
 cap:'On the cristae, ATP synthase joins ADP and Pi to make ATP. Oxygen is used and carbon dioxide released.',
 clue:'Site of aerobic respiration, producing ATP.',
 tip:'Cells with a high ATP demand, such as muscle cells, have many mitochondria with densely packed cristae.'},
{id:'cent',cells:'animal',name:'Centrioles',col:'--c-cent',spec:EXT,size:'about 0.5 µm long',
 s:['A pair of short cylinders at right angles to each other','Each is a ring of nine triplets of microtubules'],
 f:['Organise the spindle fibres during cell division','Spindle fibres attach to chromosomes and pull chromatids to opposite poles'],
 cap:'Centrioles at each pole organise the spindle. In anaphase the fibres shorten and pull the chromatids apart.',
 clue:'Organise the spindle fibres during cell division.',
 tip:'AQA only needs spindle fibres, but centrioles are named in other specifications and often appear in diagrams.'},
{id:'cyt',cells:'animal',name:'Cytoskeleton',col:'--c-cyt',spec:EXT,size:'microtubules 25 nm wide',
 s:['Network of protein fibres throughout the cytoplasm','Microtubules (tubulin), microfilaments (actin) and intermediate filaments'],
 f:['Supports the cell and maintains its shape','Tracks for motor proteins that move vesicles and organelles','Forms the spindle in cell division'],
 cap:'A motor protein walks along a microtubule carrying a vesicle. Each step uses ATP.',
 clue:'Network of protein fibres that supports the cell and moves organelles.',
 tip:'Explains how Golgi vesicles reach the cell-surface membrane: they are carried, they do not drift.'},
{id:'wall',cells:'plant',name:'Cell wall',col:'--c-wall',spec:AQA,size:'0.1 to several µm thick',
 s:['Cellulose microfibrils embedded in a matrix of other polysaccharides','Fully permeable','A middle lamella cements it to neighbouring cells'],
 f:['Gives mechanical strength and supports the plant','Stops the cell bursting when water enters by osmosis'],
 cap:'Chains of β-glucose are held together by hydrogen bonds to form strong microfibrils. The wall resists turgor pressure.',
 clue:'Made of cellulose. Stops the cell bursting when water enters by osmosis.',
 tip:'Plant and algal cell walls are cellulose. Fungal walls are chitin and bacterial walls are murein.'},
{id:'chl',cells:'plant',name:'Chloroplasts',col:'--c-chl',spec:AQA,size:'2 to 10 µm long',
 s:['Double membrane called the chloroplast envelope','Thylakoids stacked into grana, linked by lamellae','Stroma contains enzymes, starch grains, 70S ribosomes and circular DNA'],
 f:['Site of photosynthesis','Light-dependent reaction on the thylakoid membranes','Light-independent reaction in the stroma'],
 cap:'Light is absorbed by chlorophyll in the grana and oxygen is released. In the stroma, carbon dioxide is built into sugars.',
 clue:'Site of photosynthesis.',
 tip:'Not every plant cell has chloroplasts. Root cells, for example, have none.'},
{id:'vac',cells:'plant',name:'Cell vacuole',col:'--c-vac',spec:AQA,size:'up to 90% of the cell volume',
 s:['Large, permanent, fluid-filled sac','Surrounded by a single membrane called the tonoplast','Cell sap: a solution of mineral salts, sugars, amino acids, wastes and sometimes pigments'],
 f:['Keeps the cell turgid, which supports the plant','Temporary store of sugars and amino acids','Pigments may colour petals to attract pollinators'],
 cap:'Water moves in and out by osmosis. A full vacuole presses the cytoplasm against the wall and the cell is turgid.',
 clue:'Fluid-filled sac surrounded by the tonoplast. Keeps the cell turgid.',
 tip:'Animal cells may have small temporary vacuoles, but never a large permanent one.'},
{id:'pd',cells:'plant',name:'Plasmodesmata',col:'--c-mem',spec:EXT,size:'about 50 nm across',
 s:['Narrow channels through the cell walls of neighbouring cells','Lined by the cell-surface membrane, so the cytoplasm is continuous'],
 f:['Let substances pass directly from the cytoplasm of one cell to the next','Allow communication between cells'],
 cap:'Dissolved substances move from cell to cell through the channel without crossing a membrane or the wall.',
 clue:'Channels through the cell wall that link the cytoplasm of neighbouring cells.',
 tip:'Movement through plasmodesmata is the symplast pathway, used when water crosses the root.'},
{id:'cyto',name:'Cytoplasm',col:'--c-cyto2',spec:'General',size:'mostly water',
 s:['Cytosol: a solution of ions, sugars, amino acids and enzymes','Fills the cell and surrounds the organelles'],
 f:['Site of many metabolic reactions, including glycolysis','Substances move through it between organelles'],
 cap:'Glycolysis: enzymes in the cytoplasm split glucose (6C) into two pyruvate (3C), with a net gain of 2 ATP.',
 clue:'Where glycolysis takes place.',
 tip:'Glycolysis happens here in every living cell, with or without oxygen.'}

  txt('matrix',66,162,P.mito,12.5,'left',1);txt('ATP synthase on the cristae',240,22,P.accent,12.5,'center',1);
  for(let i=0;i<3;i++){const p=fr(t*.12+i/3),x0=140+i*80;
    if(p<.5){const k=ez(p*2);pill('ADP + Pi',x0,lerp(196,165,k),P.cyt,P.panel)}else{const k=ez((p-.5)*2);alpha(1.3-k,()=>pill('ATP',x0,lerp(165,36,k),P.accent,P.panel))}}
  const q=fr(t*.1);alpha(1-q,()=>pill('O₂',lerp(8,84,q),236,P.good,P.panel));alpha(q*2,()=>pill('CO₂',lerp(400,468,q),236,P.muted,P.panel));
},
cent(t){
  c.beginPath();c.ellipse(240,132,224,112,0,0,6.2832);c.strokeStyle=P.mem;c.lineWidth=4;c.stroke();
  const k=pp(t*.06),sep=ez(sg(k,.3,.85));
  for(const px of[62,418]){const s=px<240?-1:1;
    for(let i=0;i<4;i++){const y=72+i*40;line([[px,132],[240+s*(5+sep*105),y]],P.cyt,1.6)}
    line([[px,132],[240,40]],P.cyt,1);line([[px,132],[240,224]],P.cyt,1);
    rr(px-14,128,18,8,2,P.cent);rr(px+4,116,8,18,2,P.cent)}

  txt(sep<.03?'Metaphase: chromosomes line up on the equator':'Anaphase: chromatids pulled to opposite poles',240,264,P.ink,12.5,'center',1);
},
cyt(t){
  for(let r=0;r<2;r++)for(let x=-6+r*6.5;x<486;x+=13)circ(x,178+r*12,6.5,(Math.round(x/13)+r)%2?P.cyt:P.golgiL,P.soft,1);
  txt('microtubule',14,222,P.muted,12.5,'left');
  const X=40+(t*26)%420,ph=t*3.6,fa=X+11*Math.cos(ph),fb=X-11*Math.cos(ph);
  line([[fa,166-Math.max(0,Math.sin(ph))*5],[X,138],[fb,166-Math.max(0,-Math.sin(ph))*5]],P.accent,3.5);

  line([[X,138],[X,112]],P.accent,3.5);circ(X,80,32,P.vesL,P.ves,5);txt('vesicle',X,84,P.ink,12.5,'center',1);
  txt('motor protein',X+22,140,P.accent,12.5,'left',1);txt('ATP → ADP + Pi for every step',468,250,P.muted,12.5,'right');
},
wall(t){
  txt('Cellulose microfibril',14,24,P.wall,13,'left',1);txt('cell wall',340,24,P.wall,12.5,'center',1);txt('inside the cell',468,24,P.muted,12.5,'right');
  const pulse=.45+.4*Math.sin(t*2.5);
  for(let r=0;r<3;r++){const y=78+r*52;for(let i=0;i<8;i++){const x=30+i*32;if(i)line([[x-21,y],[x-11,y]],P.wall,2.5);
      c.beginPath();for(let k=0;k<6;k++){const an=k*Math.PI/3;c.lineTo(x+11*Math.cos(an),y+11*Math.sin(an))}c.closePath();c.fillStyle=P.golgiL;c.fill();c.strokeStyle=P.wall;c.lineWidth=2.2;c.stroke();
      if(r<2&&i%2==r%2)alpha(pulse,()=>{c.setLineDash([3,4]);line([[x,y+13],[x,y+39]],P.accent,2);c.setLineDash([])})}}
  txt('hydrogen bonds between chains of β-glucose',14,228,P.accent,12.5,'left',1);
  rr(318,38,44,222,4,P.golgiL,P.wall,2);c.save();c.beginPath();c.rect(319,39,42,220);c.clip();
  for(let y=-20;y<280;y+=14){line([[316,y],[364,y+40]],P.wall,2);line([[364,y],[316,y+40]],P.wall,2)}c.restore();
  line([[372,38],[372,260]],P.mem,4);
  const k=.5+.5*Math.sin(t*1.6);for(const y of[90,150,210]){const x=410-k*14;line([[x+36,y],[x,y]],P.vac,3);line([[x+9,y-7],[x,y],[x+9,y+7]],P.vac,3)}
  txt('turgor',468,244,P.vac,12.5,'right',1);txt('pressure',468,258,P.vac,12.5,'right',1);
  for(let i=0;i<3;i++){const p=fr(t*.14+i/3);alpha(Math.min(1,p*6,(1-p)*6),()=>circ(lerp(280,400,p),62+i*60,4,P.vac))}
},
chl(t){
  c.beginPath();c.ellipse(240,142,222,98,0,0,6.2832);c.fillStyle=P.chlF;c.fill();c.strokeStyle=P.chl;c.lineWidth=7;c.stroke();c.strokeStyle=P.chlF;c.lineWidth=2;c.stroke();
  const gx=[105,195,285,375];
  for(let i=0;i<3;i++)for(const y of[124,152])line([[gx[i]+24,y+i*4],[gx[i+1]-24,y-i*3]],P.gran,2);
  for(const x of gx)for(let k=0;k<5;k++)rr(x-23,108+k*12,46,8.5,4,P.gran);
  for(const x of[105,375])for(const o of[-12,12])wavy(x+o,-4,x+o,98,4,12,P.golgi,2.6,-t*6);
  txt('light',240,26,P.golgi,12.5,'center',1);
  const p=fr(t*.11);alpha(1.2-p,()=>pill('O₂',lerp(150,150,p),lerp(100,14,p),P.accent,P.panel));alpha(1.2-fr(p+.5),()=>pill('O₂',330,lerp(100,14,fr(p+.5)),P.accent,P.panel));
  const q=fr(t*.09);if(q<.5)pill('CO₂',lerp(-20,200,ez(q*2)),208,P.muted,P.panel);else alpha(2.4-q*2,()=>pill('sugar',lerp(240,440,ez((q-.5)*2)),208,P.golgi,P.panel));
  txt('grana',32,146,P.gran,12.5,'left',1);txt('stroma',240,232,P.chl,12.5,'center',1);
},
vac(t){
  const ph=fr(t*.055),k=ez(pp(t*.055)),inn=ph<.5,i2=lerp(22,6,k),w=lerp(150,254,k),h=lerp(84,170,k);
  rr(90,22,300,210,16,P.cyto,P.wall,10);rr(90+i2,22+i2,300-2*i2,210-2*i2,12,P.cyto,P.mem,3.5);
  rr(240-w/2,127-h/2,w,h,34,P.vacF,P.vac,4.5);txt('cell sap',240,131,P.vac,13,'center',1);
  for(let i=0;i<8;i++){const an=i*.785+.4,q=fr(t*.45+i/8),r=inn?lerp(175,70,q):lerp(70,175,q);alpha(Math.min(1,q*5,(1-q)*5),()=>circ(240+Math.cos(an)*r*1.25,127+Math.sin(an)*r*.72,4,P.vac))}
  txt('tonoplast',240,127-h/2+20,P.vac,11.5,'center');
  txt(inn?'Water enters by osmosis: the cell becomes turgid':'Water leaves by osmosis: the cell becomes flaccid',240,258,P.ink,12.5,'center',1);
},
pd(t){
  rr(0,0,198,270,0,P.cyto);rr(282,0,198,270,0,P.cyto);rr(198,0,84,270,0,P.wall);rr(196,120,88,30,0,P.cyto);
  for(const[a,b]of[[4,44],[68,116],[154,162],[186,222],[244,266]])line([[240,a],[240,b]],P.panel,1.5);
  line([[197,2],[197,120],[283,120],[283,2]],P.mem,4.5);line([[197,268],[197,150],[283,150],[283,268]],P.mem,4.5);
  txt('Cell A',14,24,P.ink,13,'left',1);txt('Cell B',466,24,P.ink,13,'right',1);txt('cell wall',240,60,P.panel,12.5,'center',1);txt('plasmodesma',240,178,P.panel,12.5,'center',1);
  txt('middle lamella',240,236,P.panel,11.5,'center');
  for(let i=0;i<9;i++){const p=fr(t*.1+i/9),x=lerp(30,450,p),m=sg(Math.abs(x-240),40,120),o=((i*53)%100-50)*1.9;circ(x,135+o*m*m+Math.sin(t*2+i)*3,4.5,i%3?P.good:P.accent)}
  txt('cytoplasm is continuous',14,258);
},
cyto(t){
  txt('Glycolysis',14,24,P.ink,13,'left',1);
  for(let i=0;i<16;i++)alpha(.3,()=>circ(240+Math.sin(t*.3+i*1.7)*220,135+Math.cos(t*.23+i*2.3)*110,3,P.muted));
  for(const x of[150,240,330]){c.save();c.globalAlpha=.85;circ(x,135,24,P.nuc);c.restore()}
  txt('enzymes',240,186,P.nuc,12.5,'center',1);
  const p=fr(t*.08),g=sg(p,0,.5),s=ez(sg(p,.5,1));
  if(p<.5){const x=lerp(30,240,g);c.beginPath();for(let k=0;k<6;k++){const an=k*Math.PI/3;c.lineTo(x+16*Math.cos(an),135+16*Math.sin(an))}c.closePath();c.fillStyle=P.golgi;c.fill();
    txt('6C',x,139,P.panel,11.5,'center',1);txt('glucose',x,108,P.golgi,12.5,'center',1)}
  else{for(const d of[-1,1]){const x=lerp(240,430,s),y=135+d*42*s;circ(x,y,12,P.golgi);txt('3C',x,y+4,P.panel,11,'center',1)}
    txt('2 pyruvate',468,139,P.golgi,12.5,'right',1);
    alpha(s*2,()=>{pill('ATP',lerp(300,290,s),lerp(110,44,s),P.accent,P.panel);pill('ATP',lerp(340,345,s),lerp(110,52,s),P.accent,P.panel)});}
}
};

/* ---------------- state and rendering ---------------- */
const S={cell:'animal',mode:'explore',sel:null,labels:true,playing:!matchMedia('(prefers-reduced-motion:reduce)').matches,step:0,
         quiz:{order:[],i:0,score:0,tries:0,answered:false,msg:'',ok:false,done:false}};
const narrow=matchMedia('(max-width:900px)');
if(narrow.matches)S.labels=false;
let T=0,last=0,raf=0;

function sizeCanvas(){const w=cv.clientWidth,h=cv.clientHeight,d=Math.min(2.5,devicePixelRatio||1);if(!w)return;
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
  c.setTransform(cv.width/480,0,0,cv.height/270,0,0)}
function drawAnim(){if(!S.sel||$('info').hidden)return;sizeCanvas();c.clearRect(0,0,480,270);c.setLineDash([]);c.globalAlpha=1;A[S.sel](T)}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(S.playing&&S.sel&&!$('info').hidden){T+=dt;drawAnim();raf=requestAnimationFrame(loop)}else raf=0}
function kick(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}

const chips=$('chips'),has=o=>!o.cells||o.cells===S.cell;
const buildChips=()=>chips.innerHTML=O.filter(has).map(o=>`<button type="button" class="chip" data-id="${o.id}" aria-pressed="false"><i style="background:var(${o.col})"></i>${SHORT[o.id]||o.name}</button>`).join('');

function render(){
  const showLabels=S.labels&&S.mode!=='test';
  svg.classList.toggle('nolabels',!showLabels);
  svg.setAttribute('viewBox',showLabels?'-70 0 1340 800':'165 30 870 740');
  svg.querySelector('.scale').style.display=showLabels?'':'none';
  $('lab-btn').setAttribute('aria-pressed',S.labels);$('lab-btn').disabled=S.mode==='test';
  document.querySelectorAll('#modeseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('#cellseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cell===S.cell));
  chips.hidden=S.mode==='test';
  const hideInfo=S.mode==='test'&&!S.quiz.answered, sel=hideInfo?null:S.sel;
  svg.querySelectorAll('.org').forEach(g=>{const id=g.dataset.id;g.classList.toggle('sel',id===sel);
    g.classList.toggle('dim',!!sel&&id!==sel&&PARENT[id]!==sel&&id!=='cyto')});
  svg.querySelectorAll('.lab').forEach(g=>g.classList.toggle('sel',g.dataset.id===sel));
  chips.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===sel));
  $('routeg').hidden=S.mode!=='route';
  if(S.mode==='route'){const p=rpts[S.step];$('rdot').style.transform=`translate(${p[0]}px,${p[1]}px)`}
  $('hint').textContent=S.mode==='test'?'Click the structure that matches the clue':S.mode==='route'?'Follow the dot from gene to secreted protein':'Click any structure in the cell';
  renderMode();
  const o=sel&&BY[sel];$('info').hidden=!o;$('over').hidden=!!o||S.mode!=='explore';
  if(o){$('p-sw').style.background=`var(${o.col})`;$('p-name').textContent=o.name;
    $('p-tags').innerHTML=`<span class="tag spec">${o.spec}</span><span class="tag">${o.size}</span>`;
    $('p-cap').textContent=o.cap;$('p-s').innerHTML=o.s.map(x=>`<li>${x}</li>`).join('');$('p-f').innerHTML=o.f.map(x=>`<li>${x}</li>`).join('');
    $('p-tip').innerHTML=`<b>Exam point.</b> ${o.tip}`;$('play').textContent=S.playing?'Pause':'Play';
    drawAnim();if(S.playing)kick();}
}
function renderMode(){const m=$('modebox'),q=S.quiz;m.hidden=S.mode==='explore';
  if(S.mode==='route'){const st=ROUTE[S.step];
    m.innerHTML=`<span class="k">Protein secretion · step ${S.step+1} of ${ROUTE.length}</span><p>${st[1]}</p>
     <div class="row"><button type="button" class="btn" id="r-prev" ${S.step?'':'disabled'}>Back</button><button type="button" class="btn pri" id="r-next" ${S.step<ROUTE.length-1?'':'disabled'}>Next step</button></div>`;
    $('r-prev').onclick=()=>goStep(S.step-1);$('r-next').onclick=()=>goStep(S.step+1);}
  else if(S.mode==='test'){
    if(q.done){m.innerHTML=`<span class="k">Finished</span><p>You identified ${q.score} of ${q.order.length} structures at the first attempt.</p><div class="row"><button type="button" class="btn pri" id="q-again">Start again</button></div>`;$('q-again').onclick=startQuiz;return}
    const o=BY[q.order[q.i]];
    m.innerHTML=`<span class="k">Question ${q.i+1} of ${q.order.length} · score ${q.score}</span><p>${o.clue}</p>
     <div class="row">${q.msg?`<span class="fb ${q.ok?'ok':'no'}">${q.msg}</span>`:'<span class="fb" style="color:var(--muted)">Click the structure in the cell.</span>'}
     ${q.answered?'<button type="button" class="btn pri" id="q-next">Next question</button>':'<button type="button" class="btn" id="q-show">Show me</button>'}</div>`;
    if(q.answered)$('q-next').onclick=()=>{q.i++;q.tries=0;q.answered=false;q.msg='';if(q.i>=q.order.length)q.done=true;S.sel=null;render()};
    else $('q-show').onclick=()=>{q.tries++;q.answered=true;q.ok=false;q.msg='This is the '+lc(o.name)+'.';S.sel=o.id;render()};}
}
const lc=s=>s==='Golgi apparatus'||s==='Golgi vesicles'?s:s[0].toLowerCase()+s.slice(1);
function goStep(i){S.step=Math.max(0,Math.min(ROUTE.length-1,i));S.sel=ROUTE[S.step][0];T=0;render()}
function startQuiz(){const q=S.quiz;q.order=O.filter(has).map(o=>o.id).sort(()=>Math.random()-.5);q.i=0;q.score=0;q.tries=0;q.answered=false;q.msg='';q.done=false;S.sel=null;render()}
function pick(id){
  if(S.mode==='test'){const q=S.quiz;if(q.done)return;
    if(q.answered){return}
    if(!id)return;const target=q.order[q.i];
    if(id===target||(target==='ribo'&&false)){if(!q.tries)q.score++;q.answered=true;q.ok=true;q.msg=q.tries?'Correct.':'Correct, first time.';S.sel=id;T=0}
    else{q.tries++;q.ok=false;q.msg='That is '+(/s$/.test(BY[id].name)&&id!=='nucleolus'&&id!=='cyt'&&id!=='env'?'':'the ')+lc(BY[id].name)+'. Try again.';
      const g=svg.querySelector(`.org[data-id="${id}"]`);g.classList.remove('wrong');void g.getBBox();g.classList.add('wrong')}
    return render()}
  if(S.mode==='route'){const k=ROUTE.findIndex(r=>r[0]===id);if(k>=0)return goStep(k);if(!id)return}
  if(id!==S.sel)T=0;S.sel=id;render();
  if(id&&narrow.matches)$('info').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function setMode(m){S.mode=m;S.sel=null;if(m==='route')return goStep(0);if(m==='test')return startQuiz();render()}

svg.addEventListener('click',e=>{const g=e.target.closest('[data-id]');pick(g?g.dataset.id:null)});
chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)pick(b.dataset.id===S.sel?null:b.dataset.id)});
document.querySelectorAll('#modeseg button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
function setCell(k){S.cell=k;svg.innerHTML=CELLS[k].html;rpts=CELLS[k].rpts;$('over').innerHTML=OVER[k];buildChips();setMode(S.mode)}
document.querySelectorAll('#cellseg button').forEach(b=>b.onclick=()=>setCell(b.dataset.cell));
$('lab-btn').onclick=()=>{S.labels=!S.labels;render()};
$('play').onclick=()=>{S.playing=!S.playing;$('play').textContent=S.playing?'Pause':'Play';if(S.playing)kick()};
$('theme-btn').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme=dark?'light':'dark'};
new MutationObserver(readPalette).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readPalette);
new ResizeObserver(drawAnim).observe(cv);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawAnim);
readPalette();setCell('animal');
})();
</script>
