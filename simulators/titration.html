<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titration Simulator</title>
<style>
/* Layout idea: lab bench on the left (apparatus, stopwatch, run buttons), lab book on the right (set-up, results table, graph), teacher notes underneath.
   Three experiments on tabs. Single light theme for projectors. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --ink:#131c2b; --muted:#56637a; --line:#d3dae6;
  --accent:#2a4fc9; --accent-soft:#e3e9fb; --warn:#b4530a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
header a{color:var(--accent);font-size:.9rem;text-decoration:none;flex-basis:100%}
header a:hover{text-decoration:underline}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;min-width:170px}
.tabs button b{font-size:1rem}
.tabs button span{font-size:.82rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[aria-selected="true"] span{color:#fff;opacity:.85}
main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){main{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{margin:0 0 2px;font-size:1.3rem;text-wrap:balance}
h3{margin:0 0 8px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0 0 10px;color:var(--muted)}
canvas{display:block;width:100%;height:auto;border-radius:10px}
#bench{background:#f7f9fc;aspect-ratio:640/500}
#graph{aspect-ratio:600/370}
.run{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
.clock{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.6em;line-height:1}
.clock small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:4px}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650;padding:9px 18px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .lab{font-weight:600;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row + .row{margin-top:10px}
.status{margin:10px 0 0;padding:8px 12px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;min-height:2.6em}
.vars{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--muted)}
.vars b{color:var(--ink)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.98rem}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.84rem;color:var(--muted);font-weight:600;vertical-align:bottom}
th i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
td.now{background:var(--accent-soft);font-weight:700}
.empty{color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 6px;padding:0;list-style:none;font-size:.9rem}
.gopt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:8px}
.gopt label{display:flex;align-items:center;gap:6px}
.gopt input[type=range]{width:170px;accent-color:var(--accent)}
.gopt input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
#tanOut{font-weight:650;font-variant-numeric:tabular-nums}
details{border-bottom:1px solid var(--line);padding:9px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 2px;padding:8px 12px;background:var(--accent-soft);border-radius:8px}
.heads{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.heads h3{margin:0}

.step{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.ans{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step input{font:inherit;width:8.5em;padding:7px 9px;border:1px solid #b9c1cc;border-radius:8px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.fb{font-weight:650}.fb.ok{color:#0f7a4f}.fb.no{color:#b3261e}
#conc details{border:0;padding:10px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html">&larr; Simulators</a>
    <h1>Titration</h1>
    <p>AQA GCSE Chemistry required practical (chemistry only) &middot; find the concentration of an alkali</p>
  </header>
  <main>
    <div class="col">
      <section class="card">
        <h2>Acid into alkali</h2><p class="sub" id="sub"></p>
        <canvas id="bench" width="640" height="500" role="img" aria-label="Burette, conical flask and a zoomed view of the burette scale"></canvas>
        <div class="run">
          <button type="button" class="btn" id="fast" aria-pressed="false">Run in fast</button>
          <button type="button" class="btn" id="slow" aria-pressed="false">Run in slowly</button>
          <button type="button" class="btn primary" id="drop">Add one drop</button>
          <button type="button" class="btn" id="close">Close tap</button>
        </div>
        <div class="run">
          <button type="button" class="btn" id="reveal" aria-pressed="false">Show burette reading</button>
          <button type="button" class="btn primary" id="record">Record this titration</button>
          <button type="button" class="btn" id="next">Set up next titration</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
      <section class="card">
        <h3>Questions for the class</h3>
        <div id="notes"></div>
      </section>
    </div>
    <div class="col">
      <section class="card">
        <h3>Set-up</h3>
        <div id="setup"></div>
        <ul class="vars" id="vars"></ul>
      </section>
      <section class="card">
        <div class="heads"><h3>Results</h3><button type="button" class="btn" id="clear">Clear results</button></div>
        <div class="tscroll" id="table"></div>
        <div id="conc"></div>
      </section>
      <section class="card">
        <h3>Calculation (higher tier)</h3>
        <p class="sub" id="eq"></p>
        <div id="calc"></div>
      </section>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
var el=function(id){return document.getElementById(id);};
var COL=["#2a78d6","#eb6834","#1baf7a","#6250d6"],INK="#131c2b",MUTED="#56637a",WALL="#56637a";
var FONT=getComputedStyle(document.body).fontFamily;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* ---------- canvas helpers ---------- */
var bc=el("bench"),bx=bc.getContext("2d"),c;
function txt(s,x,y,o){o=o||{};c.font=(o.b?"700 ":"500 ")+(o.size||15)+"px "+FONT;c.textAlign=o.al||"center";c.textBaseline="alphabetic";c.fillStyle=o.col||INK;String(s).split("\n").forEach(function(l,i){c.fillText(l,x,y+i*(o.size||15)*1.2);});}
function rr(x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function line(a){c.beginPath();c.moveTo(a[0],a[1]);for(var i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.stroke();}
function flaskPath(cx,by,w,h){var n=w*.15;c.beginPath();c.moveTo(cx-n,by-h);c.lineTo(cx-n,by-h*.62);c.lineTo(cx-w/2,by-10);c.quadraticCurveTo(cx-w/2-2,by,cx-w/2+10,by);c.lineTo(cx+w/2-10,by);c.quadraticCurveTo(cx+w/2+2,by,cx+w/2,by-10);c.lineTo(cx+n,by-h*.62);c.lineTo(cx+n,by-h);}
function flask(cx,by,w,h,liq,level,inside){
  c.save();flaskPath(cx,by,w,h);c.closePath();c.fillStyle="rgba(255,255,255,.75)";c.fill();c.clip();
  c.fillStyle=liq;c.fillRect(cx-w,by-level,2*w,level);if(inside)inside();c.restore();
  c.strokeStyle=WALL;c.lineWidth=4;c.lineJoin="round";c.lineCap="round";flaskPath(cx,by,w,h);c.stroke();
  c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=3;line([cx-w/2+14,by-20,cx-w*.2,by-h*.52]);
}
function bubbles(list,dt,rate,cx,by,w,level){
  if(Math.random()<rate*dt)list.push({x:cx+R(-w*.36,w*.36),y:by-6,r:R(2,4.5),v:R(40,70)});
  for(var i=list.length-1;i>=0;i--){var b=list[i];b.y-=b.v*dt;b.x+=(cx-b.x)*dt*.5;if(b.y<by-level+4)list.splice(i,1);}
}
function drawBubbles(list){c.strokeStyle="#fff";c.fillStyle="rgba(255,255,255,.55)";c.lineWidth=1.5;list.forEach(function(b){c.beginPath();c.arc(b.x,b.y,b.r,0,6.3);c.fill();c.stroke();});}
function bench(){c.fillStyle="#f7f9fc";c.fillRect(0,0,640,440);c.fillStyle="#d9c7a8";c.fillRect(0,400,640,40);c.fillStyle="#c4b08c";c.fillRect(0,400,640,5);}

/* ---------- model ---------- */
var SAMP={A:.0894,B:.1112,C:.0744};
var ACID={hcl:{name:"hydrochloric acid",f:"HCl",c:.100,ratio:1,eq:"HCl + NaOH → NaCl + H₂O"},h2so4:{name:"sulfuric acid",f:"H₂SO₄",c:.0500,ratio:2,eq:"H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O"}};
var IND={ph:{name:"Phenolphthalein",a:[240,106,168],b:[236,244,250],from:"pink",to:"colourless"},mo:{name:"Methyl orange",a:[242,209,58],b:[243,150,46],c:[226,84,58],from:"yellow",to:"orange (red if too much acid is added)"}};
var cfg={ind:"ph",acid:"hcl",samp:"A"};
var st={V:0,V0:0,Ve:0,flow:0,drops:[],flash:0,runs:[],recorded:false,reveal:false,t:0,first:true,meanTyped:false};
function r05(v){return Math.round(v*20)/20;}
function trueTitre(){var a=ACID[cfg.acid];return SAMP[cfg.samp]*25/(a.c*a.ratio);}
function added(){return st.V-st.V0;}
function changed(){return added()>=st.Ve-1e-6;}
function newRun(){
  if(st.first||50-st.V<trueTitre()+4){st.V=r05(R(0,2.4));}
  st.first=false;st.V0=st.V;st.Ve=trueTitre()+R(-.04,.04);st.flow=0;st.drops=[];st.flash=0;st.recorded=false;
}
function resetAll(){st.runs=[];st.first=true;st.meanTyped=false;newRun();}
function addVol(v){
  if(st.recorded)return;
  var was=changed();st.V=Math.min(50,st.V+v);
  if(!was&&st.Ve-added()<2.5)st.flash=Math.max(st.flash,clamp(1-(st.Ve-added())/2.5,.25,1));
  if(st.V>=50)st.flow=0;
}
function closeTap(){if(st.flow){st.flow=0;st.V=Math.min(50,Math.ceil(st.V*20-1e-6)/20);}}
function mix(a,b,f){return "rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*f);}).join(",")+")";}
function liquidCol(){
  var I=IND[cfg.ind];if(!changed())return mix(I.a,I.a,0);
  if(cfg.ind==="mo")return mix(I.b,I.c,clamp((added()-st.Ve-.06)/.25,0,1));
  return mix(I.b,I.b,0);
}
function endCol(){var I=IND[cfg.ind];return mix(I.b,I.b,0);}
function concordant(){
  var t=st.runs.slice(1).map(function(r){return r.titre;}).sort(function(a,b){return a-b;}),best=[];
  for(var i=0;i<t.length;i++)for(var j=i+1;j<t.length;j++)if(t[j]-t[i]<=.1001&&j-i+1>best.length)best=t.slice(i,j+1);
  return best;
}

/* ---------- drawing ---------- */
function draw(){
  c=bx;bx.setTransform(bc.width/640,0,0,bc.height/500,0,0);
  var i,BX=230,Y0=44,PX=5.3,yv=Y0+st.V*PX,tapY=Y0+50*PX+26,by=468;
  c.fillStyle="#f7f9fc";c.fillRect(0,0,640,500);c.fillStyle="#d9c7a8";c.fillRect(0,468,640,32);c.fillStyle="#c4b08c";c.fillRect(0,468,640,5);
  /* stand */
  c.fillStyle="#8d98a5";c.fillRect(96,20,9,448);c.fillRect(50,460,150,9);c.fillRect(100,150,118,8);c.fillRect(100,300,118,8);
  /* white tile */
  c.fillStyle="#fff";c.strokeStyle="#c9d1dd";c.lineWidth=1.5;rr(140,462,180,10,3);c.fill();c.stroke();
  /* burette */
  c.fillStyle="rgba(255,255,255,.9)";c.fillRect(BX-9,20,18,tapY-20);
  c.fillStyle="#dcedf9";c.fillRect(BX-7,yv,14,tapY-yv);
  c.strokeStyle=WALL;c.lineWidth=3;line([BX-9,20,BX-9,tapY,BX-4,tapY+12,BX-4,tapY+40]);line([BX+9,20,BX+9,tapY,BX+4,tapY+12,BX+4,tapY+40]);
  for(i=0;i<=50;i++){var ty=Y0+i*PX;c.strokeStyle=INK;c.lineWidth=i%5?1:1.6;line([BX-9,ty,BX-9+(i%10===0?13:i%5===0?9:5),ty]);if(i%10===0)txt(i,BX+16,ty+4.5,{al:"left",size:12.5,col:MUTED});}
  c.fillStyle="#2a4fc9";rr(BX-20,tapY+12,40,9,4);c.fill();c.fillStyle="#1f3a94";c.save();c.translate(BX,tapY+16);c.rotate(st.flow?1.5708:0);rr(-4,-13,8,26,3);c.fill();c.restore();
  txt(ACID[cfg.acid].name,BX+42,30,{al:"left",size:13.5,col:MUTED});txt(ACID[cfg.acid].c.toFixed(cfg.acid==="hcl"?3:4)+" mol/dm³",BX+42,48,{al:"left",size:13.5,col:MUTED});
  /* drops */
  c.fillStyle="#9cc8ee";st.drops.forEach(function(d){c.beginPath();c.arc(BX,d,3.2,0,6.3);c.fill();});
  /* flask */
  var lc=liquidCol(),wob=Math.sin(st.t*7)*(st.flow?1.2:0);
  flask(BX,by-6,150,104,lc,36+wob,function(){
    if(st.flash>0&&!changed()){c.globalAlpha=st.flash*.9;c.fillStyle=endCol();c.beginPath();c.ellipse(BX,by-34,30+st.flash*14,13,0,0,6.3);c.fill();c.globalAlpha=1;}
  });
  txt("25.0 cm³ sodium hydroxide",BX+92,by-40,{al:"left",size:13.5,col:MUTED});txt("+ "+IND[cfg.ind].name.toLowerCase(),BX+92,by-22,{al:"left",size:13.5,col:MUTED});
  /* zoom */
  var zx=420,zy=40,zw=180,zh=250,cy=zy+zh/2,S=92,tx0=zx+50,tx1=zx+120;
  txt("Burette scale, magnified",zx+zw/2,26,{b:1,size:15});
  c.fillStyle="#fff";rr(zx,zy,zw,zh,12);c.fill();
  c.save();rr(zx,zy,zw,zh,12);c.clip();
  c.fillStyle="#dcedf9";c.beginPath();c.moveTo(tx0,cy-9);c.quadraticCurveTo((tx0+tx1)/2,cy+9,tx1,cy-9);c.lineTo(tx1,zy+zh);c.lineTo(tx0,zy+zh);c.closePath();c.fill();
  c.strokeStyle="#7fa8cf";c.lineWidth=2.5;c.beginPath();c.moveTo(tx0,cy-9);c.quadraticCurveTo((tx0+tx1)/2,cy+9,tx1,cy-9);c.stroke();
  c.strokeStyle=WALL;c.lineWidth=4;line([tx0,zy,tx0,zy+zh]);line([tx1,zy,tx1,zy+zh]);
  var lo=Math.ceil((st.V-1.7)*10),hi=Math.floor((st.V+1.7)*10);
  for(i=lo;i<=hi;i++){if(i<0||i>500)continue;var y=cy+(i/10-st.V)*S,L=i%10===0?34:i%5===0?24:14;c.strokeStyle=INK;c.lineWidth=i%10===0?2.2:1.4;line([tx0,y,tx0+L,y]);if(i%10===0)txt(i/10,tx1+14,y+6,{al:"left",b:1,size:17});}
  c.restore();
  c.strokeStyle=WALL;c.lineWidth=3;rr(zx,zy,zw,zh,12);c.stroke();
  c.strokeStyle="#eb6834";c.lineWidth=2;c.setLineDash([5,5]);line([zx+8,cy,tx0-6,cy]);c.setLineDash([]);
  txt("Read the bottom of the meniscus",zx+zw/2,zy+zh+22,{size:13.5,col:MUTED});
  c.fillStyle="#131c2b";rr(zx,zy+zh+34,zw,62,10);c.fill();
  txt("Burette reading",zx+zw/2,zy+zh+56,{size:13,col:"#aab6cc"});
  txt(st.reveal?r05(st.V).toFixed(2)+" cm³":"hidden",zx+zw/2,zy+zh+84,{b:1,size:st.reveal?24:18,col:st.reveal?"#8ff0c4":"#6f7d96"});
}

/* ---------- lab book ---------- */
function setup(){
  function seg(label,key,opts){return '<div class="row"><div class="seg"><span class="lab">'+label+'</span>'+opts.map(function(o){return '<button type="button" class="btn" data-set="'+key+'" data-v="'+o[0]+'" aria-pressed="'+(cfg[key]===o[0])+'">'+o[1]+'</button>';}).join("")+'</div></div>';}
  el("setup").innerHTML=seg("Indicator","ind",[["ph","Phenolphthalein"],["mo","Methyl orange"]])+seg("Acid in burette","acid",[["hcl","Hydrochloric acid, 0.100 mol/dm³"],["h2so4","Sulfuric acid, 0.0500 mol/dm³"]])+seg("Alkali sample","samp",[["A","A"],["B","B"],["C","C"]]);
  var I=IND[cfg.ind];
  el("vars").innerHTML="<li><b>In the flask:</b> 25.0 cm³ of sodium hydroxide solution of unknown concentration, measured with a pipette</li><li><b>End point:</b> "+I.name.toLowerCase()+" changes from "+I.from+" to "+I.to+"</li><li>Changing the set-up clears the results.</li>";
  el("sub").textContent="Run "+ACID[cfg.acid].name+" from the burette into the alkali until the indicator just changes colour";
  el("eq").textContent=ACID[cfg.acid].eq;
}
function table(){
  var r=st.runs;
  if(!r.length){el("table").innerHTML='<p class="empty">No results yet. Do a rough titration first, then repeat until two titres are concordant.</p>';el("conc").innerHTML="";return;}
  var h="<table><tr><th></th>"+r.map(function(x,i){return "<th>"+(i?i:"Rough")+"</th>";}).join("")+"</tr>";
  [["Final reading in cm³","fin"],["Initial reading in cm³","init"],["Titre in cm³","titre"]].forEach(function(row){h+="<tr><td>"+row[0]+"</td>"+r.map(function(x){return "<td"+(row[1]==="titre"?' style="font-weight:700"':"")+">"+x[row[1]].toFixed(2)+"</td>";}).join("")+"</tr>";});
  el("table").innerHTML=h+"</table>";
  var cz=concordant(),msg=cz.length?"Concordant titres (within 0.10 cm³ of each other): "+cz.map(function(v){return v.toFixed(2);}).join(", ")+". Mean = "+(cz.reduce(function(a,b){return a+b;},0)/cz.length).toFixed(2)+" cm³. The rough titre is not used.":"No two accurate titres are within 0.10 cm³ of each other yet. Keep going. The rough titre does not count.";
  el("conc").innerHTML="<details><summary>Which titres are concordant, and what is the mean?</summary><p>"+msg+"</p></details>";
  if(cz.length&&!st.meanTyped){var m=el("mean");if(m){m.value=(cz.reduce(function(a,b){return a+b;},0)/cz.length).toFixed(2);checkAll();}}
}
var STEPS;
function calc(){
  var a=ACID[cfg.acid];
  STEPS=[
    {q:"Convert the mean titre to dm³ (divide by 1000).",u:"dm³",f:function(m){return m/1000;},hint:"mean titre ÷ 1000"},
    {q:"Moles of "+a.name+" = concentration × volume in dm³.",u:"mol",f:function(m){return a.c*m/1000;},hint:a.c+" × volume in dm³"},
    {q:"Use the coefficients (big numbers) in the equation: "+(a.ratio===1?"1 mole of HCl reacts with 1 mole of NaOH.":"1 mole of H₂SO₄ reacts with 2 moles of NaOH.")+" Moles of sodium hydroxide =",u:"mol",f:function(m){return a.c*m/1000*a.ratio;},hint:"moles of acid × "+a.ratio},
    {q:"Concentration of sodium hydroxide = moles ÷ volume in dm³. The volume is 25.0 cm³ = 0.0250 dm³.",u:"mol/dm³",f:function(m){return a.c*m/1000*a.ratio/.025;},hint:"moles of NaOH ÷ 0.0250"},
    {q:"Concentration in g/dm³ = concentration in mol/dm³ × relative formula mass. Mᵣ of NaOH = 40.",u:"g/dm³",f:function(m){return a.c*m/1000*a.ratio/.025*40;},hint:"mol/dm³ × 40"}
  ];
  el("calc").innerHTML='<div class="step"><label for="mean">Mean titre from the concordant results</label><span class="ans"><input id="mean" inputmode="decimal" autocomplete="off"> cm³</span></div>'+
    STEPS.map(function(s,i){return '<div class="step"><label for="c'+i+'"><b>Step '+(i+1)+'.</b> '+s.q+'</label><span class="ans"><input id="c'+i+'" inputmode="decimal" autocomplete="off"> '+s.u+' <button type="button" class="btn" data-show="'+i+'">Show</button><span class="fb" id="f'+i+'"></span></span></div>';}).join("");
}
function meanVal(){var v=parseFloat(el("mean").value);return isFinite(v)&&v>0?v:null;}
function checkOne(i){
  var m=meanVal(),inp=el("c"+i),fb=el("f"+i),v=parseFloat(inp.value);
  if(inp.value.trim()===""){fb.textContent="";fb.className="fb";return;}
  if(m===null){fb.textContent="Enter the mean titre first";fb.className="fb no";return;}
  var ok=isFinite(v)&&Math.abs(v-STEPS[i].f(m))<=Math.abs(STEPS[i].f(m))*.012;
  fb.textContent=ok?"✓ Correct":"✗ Try: "+STEPS[i].hint;fb.className="fb "+(ok?"ok":"no");
}
function checkAll(){if(STEPS)STEPS.forEach(function(s,i){checkOne(i);});}
function status(){
  var s;
  if(st.recorded)s="Recorded. Set up the next titration. Repeat until two titres are within 0.10 cm³.";
  else if(st.V>=50&&!changed())s="The burette is empty. Set up the titration again.";
  else if(changed())s="The indicator has changed colour. Close the tap, read the burette and record the titration.";
  else if(added()<.01)s=(st.runs.length?"":"Rough titration first. ")+"Note the initial burette reading, then open the tap. Swirl the flask as the acid runs in.";
  else s="Adding acid. Slow down and add one drop at a time when the colour starts to flash near the end point.";
  el("status").textContent=s;
  el("record").disabled=st.recorded||!changed()||st.flow>0;el("next").disabled=!st.recorded&&added()<.01;
  ["fast","slow","drop"].forEach(function(id){el(id).disabled=st.recorded||st.V>=50;});
  el("fast").setAttribute("aria-pressed",st.flow>1?"true":"false");el("slow").setAttribute("aria-pressed",st.flow>0&&st.flow<=1?"true":"false");
  el("reveal").setAttribute("aria-pressed",st.reveal?"true":"false");el("reveal").textContent=st.reveal?"Hide burette reading":"Show burette reading";
}

/* ---------- events ---------- */
var NOTES=[
  ["Why is the flask placed on a white tile?","So the colour change of the indicator is easier to see."],
  ["Why is a pipette used for the alkali, not a measuring cylinder?","A pipette measures a fixed volume (25.0 cm³) much more accurately than a measuring cylinder."],
  ["Why is the flask swirled while the acid is added?","To mix the solutions so all of the acid reacts and the colour change is seen as soon as the end point is reached."],
  ["Why is a rough titration done first?","To find the approximate end point. In the accurate titrations the acid can then be run in quickly until just before that volume, and added drop by drop after that."],
  ["Why is the acid added one drop at a time near the end point?","So the titration can be stopped at the exact drop that makes the indicator change colour. Adding too much gives a titre that is too high."],
  ["What does concordant mean, and why are only concordant titres used?","Concordant titres are within 0.10 cm³ of each other. Using them for the mean leaves out anomalous results, so the mean is more accurate."],
  ["How should the burette be read?","With your eye level with the liquid, reading the bottom of the meniscus, to the nearest 0.05 cm³."],
  ["Why is universal indicator not suitable for a titration?","It changes colour gradually through several colours, so there is no sharp end point. A single indicator such as phenolphthalein or methyl orange gives one sudden colour change."],
  ["Why is the titre the final reading minus the initial reading?","The burette scale starts at zero at the top, so the difference between the two readings is the volume of acid that has been run out."]
];
el("notes").innerHTML=NOTES.map(function(n){return "<details><summary>"+esc(n[0])+"</summary><p>"+esc(n[1])+"</p></details>";}).join("");
el("fast").addEventListener("click",function(){if(st.flow>1)closeTap();else st.flow=3;status();});
el("slow").addEventListener("click",function(){if(st.flow>0&&st.flow<=1)closeTap();else st.flow=.45;status();});
el("close").addEventListener("click",function(){closeTap();status();});
el("drop").addEventListener("click",function(){closeTap();addVol(.05);st.V=r05(st.V);st.drops.push(360);status();});
el("reveal").addEventListener("click",function(){st.reveal=!st.reveal;status();});
el("record").addEventListener("click",function(){
  if(st.recorded||!changed())return;closeTap();st.recorded=true;
  st.runs.push({init:r05(st.V0),fin:r05(st.V),titre:r05(st.V)-r05(st.V0)});if(st.runs.length>6)st.runs.splice(1,1);
  table();status();
});
el("next").addEventListener("click",function(){newRun();status();});
el("clear").addEventListener("click",function(){resetAll();el("mean").value="";["0","1","2","3","4"].forEach(function(i){el("c"+i).value="";});checkAll();table();status();});
el("setup").addEventListener("click",function(ev){var b=ev.target.closest("[data-set]");if(!b)return;cfg[b.dataset.set]=b.dataset.v;resetAll();setup();calc();table();status();});
el("calc").addEventListener("input",function(ev){if(ev.target.id==="mean"){st.meanTyped=true;checkAll();}else if(ev.target.id)checkOne(+ev.target.id.slice(1));});
el("calc").addEventListener("click",function(ev){var b=ev.target.closest("[data-show]");if(!b)return;var i=+b.dataset.show,m=meanVal();if(m===null){el("f"+i).textContent="Enter the mean titre first";el("f"+i).className="fb no";return;}el("c"+i).value=+STEPS[i].f(m).toPrecision(3);checkOne(i);});
var last=0,prevCh=false;
function frame(ts){
  var dt=Math.min(.1,(ts-last)/1000||0);last=ts;st.t+=dt;
  if(st.flow>0){addVol(st.flow*dt);if(Math.random()<dt*(st.flow>1?40:9))st.drops.push(360);}
  for(var i=st.drops.length-1;i>=0;i--){st.drops[i]+=dt*260;if(st.drops[i]>426)st.drops.splice(i,1);}
  st.flash=Math.max(0,st.flash-dt*1.4);
  var ch=changed();if(ch!==prevCh||st.flow>0){prevCh=ch;status();}
  draw();requestAnimationFrame(frame);
}
function size(){var d=Math.min(2,window.devicePixelRatio||1),w=Math.max(320,bc.clientWidth||640);bc.width=Math.round(w*d);bc.height=Math.round(w*d*500/640);}
addEventListener("resize",size);
resetAll();setup();calc();table();status();size();
requestAnimationFrame(frame);
})();

</script>
</body>
</html>
