<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonding Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: instrument bench, matching Atom Viewer. Four numbered steps across the top,
     a wide stage on the left, a choose-and-read rail on the right. */
  --bg:#EDF0F5; --surface:#FFFFFF; --soft:#E6EAF2; --ink:#0D1424; --muted:#566076; --line:#D7DDE8;
  --accent:#2348F5; --accent-ink:#FFFFFF;
  --stage:#FAFBFE; --stage2:#E3E8F2; --stage-line:#93A0B8;
  --dot:#E23B2E; --cross:#2348F5; --warn:#B45309;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080C15; --surface:#111828; --soft:#1A2337; --ink:#EDF1FA; --muted:#98A3BA; --line:#242E46;
    --accent:#8198FF; --accent-ink:#0A0F1C;
    --stage:#0E1527; --stage2:#05080F; --stage-line:#5A6884;
    --dot:#FF6A5C; --cross:#7FB2FF; --warn:#FFB04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080C15; --surface:#111828; --soft:#1A2337; --ink:#EDF1FA; --muted:#98A3BA; --line:#242E46;
  --accent:#8198FF; --accent-ink:#0A0F1C;
  --stage:#0E1527; --stage2:#05080F; --stage-line:#5A6884;
  --dot:#FF6A5C; --cross:#7FB2FF; --warn:#FFB04A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:12px;padding:12px 18px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.18)}
.seg.strong button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:999px;display:grid;place-items:center;padding:0}
.icon svg{width:17px;height:17px}

.timeline{display:flex;gap:6px;padding:4px 18px 12px;overflow-x:auto;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.timeline button{flex:1 0 auto;min-width:128px;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px}
.timeline .yr{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.timeline .nm{font-family:var(--font-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.15}
.timeline button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.timeline button[aria-pressed="true"] .yr{color:inherit;opacity:.7}

.bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;padding:0 18px 16px}
.stagewrap{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stagebox{position:relative;flex:1;min-height:320px;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--stage-line) 22%,transparent) 1px,transparent 1.5px) 0 0/22px 22px,
             radial-gradient(ellipse at 50% 45%,var(--stage),var(--stage2))}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
#stage.drag{touch-action:none;cursor:grab}
#stage.pick{cursor:pointer}
.ov{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov.tl{top:12px;left:12px;right:12px}.ov.bl{bottom:12px;left:12px;right:12px}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov .seg{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.ov .seg button{padding:5px 12px;font-size:13px}
.ov .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.pill{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sq{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 78%,transparent)}
.heat{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);font-size:13px;font-weight:600}
.heat input{width:170px;accent-color:var(--dot)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:600;padding:6px 12px;border-radius:12px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{font-style:normal;font-weight:700;font-size:15px;line-height:1}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid color-mix(in srgb,var(--ink) 45%,transparent)}
.ln{width:22px;height:0;border-top:3px solid var(--ink);display:inline-block}
.ln.dash{border-top:2px dashed var(--muted)}
.caption{padding:10px 14px;font-size:14.5px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center}
.caption #caption{flex:1;min-height:42px}
.caption b{font-weight:600}
.nav{display:flex;gap:6px;flex:none}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.nav #next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.rail{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;padding-right:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 2px;font-weight:700;font-size:14.5px;position:relative;line-height:1.2}
.chips button:hover{border-color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips button.al::after{content:"A";position:absolute;top:2px;right:4px;font-size:9px;font-weight:700;color:var(--muted)}
.chips button.al[aria-pressed="true"]::after{color:inherit}
.sub{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin-top:12px}
.ident{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.fbox{flex:none;background:var(--soft);border-radius:12px;padding:8px 14px;min-width:96px;text-align:center;
  font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-.02em;line-height:1.15}
.ident .nm{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1.1}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
dt{color:var(--muted)}dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
.note b{color:var(--ink);font-weight:600}
.rows{display:grid;gap:4px}
.orow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:8px;border:1px solid transparent;background:var(--soft);
  border-radius:10px;padding:6px 10px;text-align:left;width:100%}
.orow[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.orow .s{font-weight:700;font-size:15px}
.orow .c{font-size:13.5px;color:var(--muted)}
.orow .n{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.irow{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.irow small{display:block;font-weight:500;color:var(--muted);font-size:13px}

@media (max-width:900px){
  html,body{height:auto}
  body{display:block}
  .top{padding:12px 16px 8px}
  .brand h1{font-size:21px}
  .timeline{padding:4px 16px 10px}
  .timeline button{min-width:118px}
  .bench{display:block;padding:0 16px 20px}
  .stagebox{height:min(100vw,64vh);flex:none}
  .rail{margin-top:12px;overflow:visible}
  .caption{flex-direction:column;align-items:stretch}
  .nav button{flex:1}
  .heat input{width:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11.5" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><circle cx="20.5" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/><circle cx="16" cy="12.6" r="2.3" fill="var(--dot)"/><path d="M13.8 17.2l4.4 4.4m0-4.4l-4.4 4.4" stroke="var(--cross)" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Bonding Simulator</h1>
  </div>
  <div class="seg strong" role="group" aria-label="Level">
    <button id="lvl-gcse" type="button">GCSE</button>
    <button id="lvl-alevel" type="button">A-level</button>
  </div>
  <button class="icon" id="theme-btn" type="button" aria-label="Switch between light and dark" title="Light or dark">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
  </button>
</header>

<nav class="timeline" id="steps" aria-label="Steps"></nav>

<main class="bench">
  <section class="stagewrap" aria-label="Diagram">
    <div class="stagebox">
      <canvas id="stage" aria-label="Bonding diagram"></canvas>
      <div class="ov tl">
        <div class="grp" id="g-ionic">
          <div class="seg" role="group" aria-label="Shells shown">
            <button id="sh-outer" type="button">Outer shell</button>
            <button id="sh-all" type="button">All shells</button>
          </div>
          <button class="pill" id="scale-btn" type="button">Sizes to scale</button>
        </div>
        <div class="grp" id="g-lat">
          <div class="seg" role="group" aria-label="Model">
            <button id="v-stick" type="button">Ball and stick</button>
            <button id="v-fill" type="button">Space filling</button>
          </div>
          <button class="pill" id="unit-btn" type="button">Show one formula unit</button>
          <button class="pill" id="spin-btn" type="button">Spin</button>
          <button class="pill sq" id="n-dn" type="button" aria-label="Smaller piece of lattice">−</button>
          <span class="hint" id="n-lbl">Size</span>
          <button class="pill sq" id="n-up" type="button" aria-label="Bigger piece of lattice">+</button>
        </div>
        <div class="grp" id="g-many">
          <label class="heat" for="heat">Cold<input id="heat" type="range" min="0" max="100" value="8">Hot</label>
          <span class="hint" id="state-lbl"></span>
        </div>
        <span class="hint" id="g-hint"></span>
      </div>
      <div class="ov bl"><div class="legend" id="legend"></div></div>
    </div>
    <div class="caption">
      <div id="caption" aria-live="polite"></div>
      <div class="nav">
        <button id="prev" type="button">Back</button>
        <button id="next" type="button">Next step</button>
      </div>
    </div>
  </section>

  <aside class="rail">
    <section class="card">
      <h2>Choose a substance</h2>
      <div class="seg" role="group" aria-label="Type of bonding">
        <button id="m-ionic" type="button">Ionic</button>
        <button id="m-cov" type="button">Covalent</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="sub" id="chips2-h" hidden>A-LEVEL: DATIVE BONDS AND OCTET EXCEPTIONS</div>
      <div class="chips" id="chips2" hidden></div>
    </section>
    <section class="card">
      <h2>This substance</h2>
      <div class="ident">
        <div class="fbox" id="f-box"></div>
        <div><div class="nm" id="f-name"></div><div class="tags" id="f-tags"></div></div>
      </div>
      <dl id="f-dl"></dl>
      <p class="note" id="f-note"></p>
    </section>
    <section class="card">
      <h2 id="d-h"></h2>
      <div class="rows" id="d-rows"></div>
      <p class="note" id="d-note"></p>
    </section>
  </aside>
</main>

<script>

/* ---------- ionic dot and cross ---------- */

  const tr=[];for(let g=0;g<def.nm*q;g++)tr.push({mi:Math.floor(g/q),slot:g%q,xi:def.nm+Math.floor(g/p),xslot:v+g%p});

  const outer=(at,t)=>{const n=at.e.cfg.length;return at.metal?lerp(rad(at,n-1,t),rad(at,n-2,t),t):rad(at,n-1,t);};
  let maxR=0;for(const at of sc.atoms)maxR=Math.max(maxR,rad(at,at.e.cfg.length-1,0),outer(at,1));

/* ---------- covalent molecules ---------- */
const molCache={};
function placeItems(bondAngs,n){
  if(!n)return [];

  const gaps=A.map((s,i)=>({s,w:A.length===1?TAU:(i<A.length-1?A[i+1]-s:A[0]+TAU-s),c:0}));
  const cd=(a,b)=>{const d=Math.abs(a-b)%TAU;return Math.min(d,TAU-d);};
  for(let k=0;k<n;k++){let best=null,bs=-1,bf=-1;const used=gaps.filter(g=>g.c);
    for(const g of gaps){const sc=g.w/(g.c+1),far=used.length?Math.min(...used.map(u=>cd(u.s+u.w/2,g.s+g.w/2))):0;
      if(sc>bs+1e-6||(Math.abs(sc-bs)<=1e-6&&far>bf)){best=g;bs=sc;bf=far;}}
    best.c++;}
  const out=[];for(const g of gaps)for(let m=0;m<g.c;m++)out.push(g.s+g.w*(m+1)/(g.c+1));return out;
}

    a.R=a.el==='H'?30:n>=6?80:n===5?66:(n===4&&heavy)?52:44;a.sym=a.par===undefined?0:1-at[a.par].sym;}

      P[i]=[P[a.par][0]+Math.cos(a.ang)*d,P[a.par][1]+Math.sin(a.ang)*d];}

let sim=null;
function initSim(def){
  const M=mol(def),A=area(),sp=2*M.mrad+30,cols=Math.max(2,Math.floor(A.w/sp)),rows=Math.max(2,Math.floor(A.h/(sp*.9)));
  const c=Math.min(cols,8),r=Math.min(rows,5),ms=[];
  for(let j=0;j<r;j++)for(let i=0;i<c;i++){const hx=A.cx+(i-(c-1)/2+(j%2?.25:-.25))*sp,hy=A.cy+(j-(r-1)/2)*sp*.9;
    ms.push({hx,hy,x:hx,y:hy,vx:0,vy:0,a:Math.random()*TAU,w:0});}
  sim={id:def.id,ms,sp,M};
}
function stepSim(){
  const T=S.heat,A=area(),ms=sim.ms,sp=sim.sp,kh=.05*Math.pow(1-T,2.5),kick=.05+T*.9,damp=lerp(.86,.992,T);
  const x0=A.cx-A.w/2+sim.M.mrad,x1=A.cx+A.w/2-sim.M.mrad,y0=A.cy-A.h/2+sim.M.mrad-10,y1=A.cy+A.h/2-sim.M.mrad+20;
  for(let i=0;i<ms.length;i++){const m=ms[i];
    m.vx+=(m.hx-m.x)*kh+(Math.random()-.5)*kick;m.vy+=(m.hy-m.y)*kh+(Math.random()-.5)*kick;
    for(let j=i+1;j<ms.length;j++){const o=ms[j],dx=o.x-m.x,dy=o.y-m.y,d=Math.hypot(dx,dy)||1,min=sim.M.mrad*2+4;
      if(d<min){const f=(min-d)*.06,fx=dx/d*f,fy=dy/d*f;m.vx-=fx;m.vy-=fy;o.vx+=fx;o.vy+=fy;}}
    m.vx*=damp;m.vy*=damp;const v=Math.hypot(m.vx,m.vy),vm=1+T*5;if(v>vm){m.vx*=vm/v;m.vy*=vm/v;}
    m.x+=m.vx;m.y+=m.vy;m.w=(m.w+(Math.random()-.5)*.012*(T+.05))*.97;m.a+=m.w*(.3+T*3);
    if(m.x<x0){m.x=x0;m.vx=Math.abs(m.vx);}if(m.x>x1){m.x=x1;m.vx=-Math.abs(m.vx);}
    if(m.y<y0){m.y=y0;m.vy=Math.abs(m.vy);}if(m.y>y1){m.y=y1;m.vy=-Math.abs(m.vy);}

}
function drawMany(def){
  if(!sim||sim.id!==def.id)initSim(def);
  if(!reduce||S.heat>.12)stepSim();
  const ms=sim.ms,sp=sim.sp,T=S.heat,M=sim.M,la=clamp(1.2-T*1.7);
  if(la>0){ctx.strokeStyle=C.muted;ctx.lineWidth=1.6;ctx.setLineDash([3,6]);
    for(let i=0;i<ms.length;i++)for(let j=i+1;j<ms.length;j++){const d=Math.hypot(ms[i].x-ms[j].x,ms[i].y-ms[j].y);
      if(d<sp*1.3){ctx.globalAlpha=GA*la*clamp((sp*1.3-d)/(sp*.25));ctx.beginPath();ctx.moveTo(ms[i].x,ms[i].y);ctx.lineTo(ms[j].x,ms[j].y);ctx.stroke();}}
    ctx.setLineDash([]);}
  ctx.globalAlpha=GA;
  for(const m of ms){const c=Math.cos(m.a),s=Math.sin(m.a),q=M.mini.map(p=>[m.x+p.x*c-p.y*s,m.y+p.x*s+p.y*c]);
    ctx.strokeStyle=C.ink;ctx.lineCap='round';
    for(const b of M.bonds){ctx.lineWidth=b.ord===1?4:b.ord===2?7:10;ctx.beginPath();ctx.moveTo(q[b.a][0],q[b.a][1]);ctx.lineTo(q[b.b][0],q[b.b][1]);ctx.stroke();}
    M.mini.forEach((p,i)=>{ctx.fillStyle=EL[p.el].c;ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q[i][0],q[i][1],p.r,0,TAU);ctx.fill();ctx.stroke();});
  }
  ctx.globalAlpha=1;
}

/* ---------- lattices ---------- */
let lat=null;
function genLattice(def,kind,n){
  let pts=[],D=1,same=false,bonds=null;const R3=Math.sqrt(3);
  if(kind==='rock'){for(let i=0;i<=2*n;i++)for(let j=0;j<=2*n;j++)for(let k=0;k<=2*n;k++)pts.push([i,j,k,(i+j+k)%2?0:1]);}
  else if(kind==='cscl'){for(let i=0;i<=n;i++)for(let j=0;j<=n;j++)for(let k=0;k<=n;k++)pts.push([i,j,k,1]);
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++)pts.push([i+.5,j+.5,k+.5,0]);D=R3/2;}
  else if(kind==='fluor'||kind==='anti'||kind==='diamond'||kind==='sio2'){const m=4*n,dia=kind==='diamond'||kind==='sio2';D=R3;same=dia;
    for(let x=0;x<=m;x++)for(let y=0;y<=m;y++)for(let z=0;z<=m;z++){const ev=!(x%2||y%2||z%2),od=x%2&&y%2&&z%2,sm=(x+y+z)%4;
      if(ev&&sm===0)pts.push([x,y,z,dia?2:kind==='fluor'?0:1]);
      else if(od&&(!dia||sm===3))pts.push([x,y,z,dia?2:kind==='fluor'?1:0]);}
  }else{const h=Math.sqrt(2/3),nl=n>=3?6:4,Rp=.75+n*.62,seq=kind==='layer'?i=>i%3:i=>i%2,cx=.5,cy=R3/6;
    const sites=(k,z,type,keep)=>{for(let i=-7;i<=7;i++)for(let j=-7;j<=7;j++){const px=i+j*.5+k*.5-cx,py=j*R3/2+k*R3/6-cy;
      if(Math.hypot(px,py)<=Rp&&(!keep||keep(i,j)))pts.push([px,z,py,type]);}};
    for(let l=0;l<nl;l++){const z=(l-(nl-1)/2)*h;sites(seq(l),z,1);
      if(l<nl-1){const k=3-seq(l)-seq(l+1);
        if(kind==='layer'){if(l%2===0)sites(k,z+h/2,0);}
        else sites(k,z+h/2,0,(i,j)=>(((i-j+l)%3)+3)%3!==0);}}
    D=1/Math.SQRT2;}
  const N=pts.length,c=[0,0,0];pts.forEach(p=>{c[0]+=p[0]/N;c[1]+=p[1]/N;c[2]+=p[2]/N;});
  let atoms=pts.map(p=>({x:p[0]-c[0],y:p[1]-c[1],z:p[2]-c[2],t:p[3]}));
  bonds=[];const thr=D*1.08;
  for(let i=0;i<atoms.length;i++)for(let j=i+1;j<atoms.length;j++){const a=atoms[i],b=atoms[j];if(!same&&a.t===b.t)continue;
    const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;if(dx*dx+dy*dy+dz*dz<thr*thr)bonds.push([i,j]);}
  if(kind==='sio2'){const si=atoms.map(a=>({...a,t:3})),ox=bonds.map(([i,j])=>({x:(atoms[i].x+atoms[j].x)/2,y:(atoms[i].y+atoms[j].y)/2,z:(atoms[i].z+atoms[j].z)/2,t:4}));
    const nb=[];bonds.forEach(([i,j],k)=>{nb.push([i,si.length+k],[j,si.length+k]);});atoms=si.concat(ox);bonds=nb;D=D/2;}
  let ext=0;for(const a of atoms)ext=Math.max(ext,Math.hypot(a.x,a.y,a.z));
  // radii and colours
  const real=S.level==='alevel',ion=S.mode==='ionic';
  let rc=.42*D,ra=.58*D;if(ion&&real){const m=EL[def.m].ri,x=EL[def.x].ri;rc=m/(m+x)*D;ra=x/(m+x)*D;}
  const colr={0:'#E5483B',1:'#3B6BF5',2:'#5A6475',3:'#C8A768',4:'#EE4B3F'};
  for(const a of atoms){a.r=a.t===0?rc:a.t===1?ra:a.t===4?.44*D:.5*D;a.c=colr[a.t];}
  // one formula unit, nearest the centre
  let unit=null;
  if(ion){const idx=t=>atoms.map((a,i)=>i).filter(i=>atoms[i].t===t),d2=(i,p)=>{const a=atoms[i];return (a.x-p.x)**2+(a.y-p.y)**2+(a.z-p.z)**2;};
    const st=def.nm<=def.nx?0:1,ot=1-st,need=[def.nm,def.nx];
    const seed=idx(st).sort((i,j)=>d2(i,{x:.01,y:.02,z:.03})-d2(j,{x:.01,y:.02,z:.03}))[0];unit=[seed];
    idx(ot).sort((i,j)=>d2(i,atoms[seed])-d2(j,atoms[seed])).slice(0,need[ot]).forEach(i=>unit.push(i));
    const cen={x:0,y:0,z:0};unit.forEach(i=>{cen.x+=atoms[i].x/unit.length;cen.y+=atoms[i].y/unit.length;cen.z+=atoms[i].z/unit.length;});
    idx(st).filter(i=>i!==seed).sort((i,j)=>d2(i,cen)-d2(j,cen)).slice(0,need[st]-1).forEach(i=>unit.push(i));
    unit=new Set(unit);}
  return {atoms,bonds,ext:ext+ra,unit,ion};
}
function latKey(){const d=cur();return [S.mode,d.id,S.n,S.level].join('|');}
function drawLattice(def){
  const key=latKey();if(!lat||lat.key!==key){lat=genLattice(def,S.mode==='ionic'?def.lat:def.giant,S.n);lat.key=key;}
  const L=lat,A=area(),cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
  const sc=Math.min(A.w,A.h+30)*.47/L.ext,cam=L.ext*4.5,fill=S.view==='fill',rk=fill?1:.4,hi=S.unit&&L.unit;
  const pr=L.atoms.map(a=>{const x1=a.x*cy+a.z*sy,z1=-a.x*sy+a.z*cy,y1=a.y*cp-z1*sp,z2=a.y*sp+z1*cp,p=cam/(cam+z2);
    return {x:A.cx+x1*p*sc,y:A.cy+y1*p*sc,z:z2,r:a.r*rk*p*sc};});
  const items=pr.map((p,i)=>({z:p.z,i}));
  if(!fill)for(const b of L.bonds)items.push({z:(pr[b[0]].z+pr[b[1]].z)/2+.001,b});
  items.sort((a,b)=>b.z-a.z);
  for(const it of items){
    if(it.b){const p=pr[it.b[0]],q=pr[it.b[1]],on=!hi||(L.unit.has(it.b[0])&&L.unit.has(it.b[1]));
      ctx.globalAlpha=GA*(on?.9:.1);ctx.strokeStyle=C.line;ctx.lineWidth=Math.max(1.2,(p.r+q.r)*.16);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();continue;}
    const p=pr[it.i],a=L.atoms[it.i],on=!hi||L.unit.has(it.i);
    ctx.globalAlpha=GA*(on?1:.13);
    const g=ctx.createRadialGradient(p.x-p.r*.35,p.y-p.r*.4,p.r*.1,p.x,p.y,p.r);
    g.addColorStop(0,shade(a.c,.55));g.addColorStop(.6,a.c);g.addColorStop(1,shade(a.c,-.35));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
    if(L.ion&&p.r>9)text(a.t===0?'+':'−',p.x,p.y+1,Math.min(26,p.r*1.15),'#FFFFFF');
  }
  ctx.globalAlpha=1;
}

/* ---------- frame loop ---------- */
let last=0,dragging=false;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S.anim!==S.step){const d=S.step-S.anim,stp=dt/1.25*Math.max(1,Math.abs(d));S.anim=Math.abs(d)<=stp?S.step:S.anim+Math.sign(d)*stp;}
  if(S.spin&&!dragging&&S.step===3&&isLat())S.yaw+=dt*.3;
  requestAnimationFrame(frame);
  if(!W||!H){resize();if(!W||!H)return;}
  if(!C.ink)readColours();
  ctx.clearRect(0,0,W,H);ctx.globalAlpha=1;
  const d=cur(),a=S.anim,ion=S.mode==='ionic';
  const scene=k=>{if(ion){k<=2?drawIonic(d,k):drawLattice(d);}
    else if(k<=1)drawDC(d,k);else if(k===2)drawStick(d);else d.giant?drawLattice(d):drawMany(d);};
  const lo=ion?2:1;
  if(a<=lo){GA=1;scene(a);}
  else{const k=Math.floor(a),f=ease(a-k);if(f<=0){GA=1;scene(k);}else{GA=1-f;if(GA>.01)scene(k);GA=f;scene(k+1);GA=1;}}
}

/* ---------- interface ---------- */
function press(el,on){el.setAttribute('aria-pressed',on?'true':'false');}
function setStep(n){S.step=clamp(n,0,nSteps()-1);if(reduce)S.anim=S.step;if(S.step!==1)S.sel=null;ui();}
function pick(mode,id){S.mode=mode;if(mode==='ionic')S.ion=id;else S.cov=id;S.sel=null;S.unit=false;sim=null;
  if(S.step>nSteps()-1){S.step=nSteps()-1;}S.anim=S.step;ui();}
function chips(){
  const list=S.mode==='ionic'?IONIC:COV,al=S.level==='alevel',two=S.mode==='cov';
  const mk=(box,items)=>{box.innerHTML='';for(const d of items){const b=document.createElement('button');b.type='button';b.textContent=d.f;b.title=d.name;
    if(d.al)b.className='al';press(b,d.id===cur().id);b.onclick=()=>pick(S.mode,d.id);box.appendChild(b);}};
  mk($('chips'),list.filter(d=>two?!d.al:(al||!d.al)));
  const show=two&&al;$('chips2').hidden=$('chips2-h').hidden=!show;if(show)mk($('chips2'),list.filter(d=>d.al));
}
function facts(){
  const d=cur(),al=S.level==='alevel';$('f-box').textContent=d.f;$('f-name').textContent=d.name;
  const tags=[],dl=[];let note='';
  if(S.mode==='ionic'){const M=EL[d.m],X=EL[d.x],q=M.cfg[M.cfg.length-1],p=8-X.cfg[X.cfg.length-1];
    tags.push('Ionic','Giant ionic lattice');
    dl.push(['Ions',d.m+sup(chg(q)+'+')+' and '+d.x+sup(chg(p)+'−')],['Ratio',d.nm+' : '+d.nx+' so the charges cancel'],
      ['In the lattice','each '+d.m+sup(chg(q)+'+')+' has '+d.cn[0]+' '+d.x+sup(chg(p)+'−')+' neighbours; each '+d.x+sup(chg(p)+'−')+' has '+d.cn[1]+' '+d.m+sup(chg(q)+'+')],
      ['Melting point',d.mp+' °C']);
    note='High melting point: melting means overcoming the strong electrostatic attraction between <b>all</b> the oppositely charged ions. Conducts electricity only when molten or dissolved, when the ions are free to move.';
  }else{const M=mol(d),g={};
    for(const b of M.bonds){const k=M.at[b.a].el+['','–','=','≡'][b.ord]+M.at[b.b].el+(b.dat?' (dative)':'');g[k]=(g[k]||0)+1;}
    tags.push('Covalent',d.giant?'Giant covalent':d.charge?'Molecular ion':'Simple molecular');
    dl.push(['Bonds',Object.keys(g).map(k=>g[k]+' × '+k).join(', ')+(d.giant?' around each atom':'')]);
    const lp=M.at.reduce((s,a)=>s+a.lp,0);if(!d.giant)dl.push(['Lone pairs',String(lp)]);
    if(d.bp)dl.push(['Boiling point',d.bp]);if(d.mp)dl.push(['Melting point',d.mp]);
    note=d.note||(d.giant?'':'Low boiling point: only the weak intermolecular forces between molecules have to be overcome. The covalent bonds inside each molecule do not break.');
    if(d.note&&!d.giant&&!d.charge&&d.bp)note+=' Boiling overcomes only the weak forces between molecules.';
  }
  $('f-tags').innerHTML=tags.map(t=>'<span class="tag">'+t+'</span>').join('');
  $('f-dl').innerHTML=dl.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');$('f-note').innerHTML=note;
}
function detail(){
  const d=cur(),al=S.level==='alevel',box=$('d-rows');box.innerHTML='';
  if(S.mode==='ionic'){const M=EL[d.m],X=EL[d.x],q=M.cfg[M.cfg.length-1],v=X.cfg[X.cfg.length-1],p=8-v;
    $('d-h').textContent=al?'Atoms, ions and sizes':'Atoms and ions';
    const row=(s,e,ic,ch,verb,k)=>'<div class="irow">'+s+' '+e.cfg.join(',')+' → '+s+sup(ch)+' '+ic.join(',')+
      '<small>'+verb+' '+k+' electron'+(k>1?'s':'')+(al?'. Radius '+e.ra+' pm → '+e.ri+' pm':'')+'</small></div>';
    box.innerHTML=row(d.m,M,M.cfg.slice(0,-1),chg(q)+'+','loses',q)+row(d.x,X,X.cfg.slice(0,-1).concat(8),chg(p)+'−','gains',p);
    $('d-note').innerHTML=al?'The positive ion is smaller than its atom: it has lost its whole outer shell. The negative ion is larger: the extra electron'+(p>1?'s add':' adds')+' repulsion with no extra protons. <b>Smaller ions with bigger charges attract more strongly</b>, giving a higher melting point: compare NaCl with MgO, or NaF with CsCl.'
      :'Metal atoms lose electrons to form positive ions. Non-metal atoms gain electrons to form negative ions. Both end up with the electron arrangement of a noble gas.';
  }else{const M=mol(d);$('d-h').textContent='Outer-shell electrons';
    M.at.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='orow';press(b,S.sel===a.i);
      const full=a.el==='H'?2:8,msg=a.open?'bonds continue to more atoms':a.count===0?'H⁺ has no electrons of its own':a.count===full?'full outer shell'
        :a.count<full?'fewer than 8: octet not reached':'more than 8: expanded octet';
      b.innerHTML='<span class="s">'+a.el+'</span><span class="c">'+msg+'</span><span class="n">'+(a.open?a.count+a.open:a.count)+'</span>';
      if(!a.open&&a.count!==full)b.querySelector('.c').style.color='var(--warn)';
      b.onclick=()=>{S.sel=S.sel===a.i?null:a.i;if(S.step!==1){S.step=1;if(reduce)S.anim=1;}ui();};box.appendChild(b);});
    $('d-note').innerHTML='Count every electron on an atom’s circle, including both electrons of each shared pair. Click an atom here or on the diagram.';

}
function caption(){
  const d=cur(),s=S.step;let h='';
  if(S.mode==='ionic'){const M=EL[d.m],X=EL[d.x],q=M.cfg[M.cfg.length-1],v=X.cfg[X.cfg.length-1],p=8-v,pl=n=>n+' electron'+(n>1?'s':'');
    h=[`<b>Atoms.</b> Each ${M.n} atom has ${pl(q)} in its outer shell. Each ${X.n} atom has ${v}.`,
       `<b>Electron transfer.</b> Each ${M.n} atom loses ${pl(q)}. Each ${X.n} atom gains ${p}. ${d.nm*q>1?'In total '+d.nm*q+' electrons move':'One electron moves'} from metal to non-metal.`,
       `<b>Ions.</b> ${d.m}${sup(chg(q)+'+')} and ${d.x}${sup(chg(p)+'−')} both have full outer shells. The strong electrostatic attraction between oppositely charged ions is the ionic bond.`,
       `<b>Giant ionic lattice.</b> The dot and cross diagram shows just one formula unit. A real crystal contains billions of ions, each attracted to every oppositely charged neighbour in all directions. ${d.f} gives the ratio of ions, not a molecule.`][s];
  }else{const M=mol(d),dat=M.bonds.some(b=>b.dat),o=[0,0,0,0];M.bonds.forEach(b=>o[b.ord]++);
    const kinds=[o[1]&&o[1]+' single',o[2]&&o[2]+' double',o[3]&&o[3]+' triple'].filter(Boolean).join(', ');
    h=[`<b>Separate atoms.</b> Only outer-shell electrons are shown. Dots and crosses show which atom each electron belongs to.`,
       `<b>Shared pairs.</b> Each overlap holds shared electrons: 2 for a single bond, 4 for a double, 6 for a triple. Here: ${kinds} bond${M.bonds.length>1?'s':''}${d.giant?' shown':''}.${dat?' In a dative bond both shared electrons come from the same atom.':''}`,
       d.giant?`<b>One small part.</b> Each line is a covalent bond. The dashed lines are bonds to more atoms: this is not a molecule.`
        :`<b>${d.charge?'One ion':'One molecule'}.</b> Each line is one shared pair of electrons, a covalent bond.${dat?' The arrow shows a dative bond, pointing from the atom that supplied both electrons.':''}`,
       d.giant?`<b>Giant covalent structure.</b> Every atom is joined to its neighbours by strong covalent bonds. There are no separate molecules, so melting means breaking covalent bonds: a very high melting point.`
        :`<b>Many molecules.</b> Strong covalent bonds hold each molecule together. Only weak intermolecular forces act between molecules. Turn up the heat: the molecules separate but none of them breaks apart.`][s];

}
function legend(){
  const d=cur(),s=S.step,dot='<i style="color:var(--dot)">●</i>',x='<i style="color:var(--cross)">✕</i>';let h;
  if(S.mode==='ionic'){h=s<3?`<span>${dot} ${EL[d.m].n} electrons</span><span>${x} ${EL[d.x].n} electrons</span>`
      :`<span><span class="sw" style="background:#E5483B"></span>${d.m} ion (positive)</span><span><span class="sw" style="background:#3B6BF5"></span>${d.x} ion (negative)</span>`;}
  else if(s<2)h=`<span>${dot} ${x} show which atom each electron came from</span>`;
  else if(s===2)h=`<span><span class="ln"></span>covalent bond</span>`+(d.giant?`<span><span class="ln dash"></span>continues</span>`:'');
  else if(d.giant)h=(d.giant==='sio2'?[['Si','silicon'],['O','oxygen']]:[['C','carbon']]).map(e=>`<span><span class="sw" style="background:${e[0]==='C'?'#5A6475':EL[e[0]].c}"></span>${e[1]}</span>`).join('')+`<span><span class="ln"></span>covalent bond</span>`;
  else h=`<span><span class="ln"></span>covalent bond (strong)</span><span><span class="ln dash"></span>intermolecular force (weak)</span>`;
  $('legend').innerHTML=h;
}
function ui(){

  press($('lvl-gcse'),!al);press($('lvl-alevel'),al);press($('m-ionic'),ion);press($('m-cov'),!ion);
  const nav=$('steps');nav.innerHTML='';
  names.forEach((nm,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span class="yr">STEP '+(i+1)+'</span><span class="nm">'+nm+'</span>';
    press(b,S.step===i);b.disabled=i>=nSteps();if(b.disabled)b.title='An ion like this is found in ionic compounds, not on its own';b.onclick=()=>setStep(i);nav.appendChild(b);});
  $('g-ionic').hidden=!(ion&&S.step<3);$('scale-btn').hidden=!al;
  $('g-lat').hidden=!latStep;$('unit-btn').hidden=!ion;$('g-many').hidden=!(!ion&&S.step===3&&!d.giant);
  const hint=!ion&&S.step===1?'Click an atom to count its outer shell':latStep?'Drag to rotate':'';$('g-hint').textContent=hint;$('g-hint').hidden=!hint;
  press($('sh-outer'),S.shells==='outer');press($('sh-all'),S.shells==='all');press($('scale-btn'),S.scale);
  press($('v-stick'),S.view==='stick');press($('v-fill'),S.view==='fill');press($('unit-btn'),S.unit);press($('spin-btn'),S.spin);
  $('n-dn').disabled=S.n<=1;$('n-up').disabled=S.n>=3;$('n-lbl').textContent=['','Small piece','Bigger piece','Bigger still'][S.n];
  $('state-lbl').textContent=S.heat<.3?'Solid: molecules held in place':S.heat<.66?'Liquid: molecules slide past each other':'Gas: molecules far apart';
  $('prev').disabled=S.step===0;$('next').disabled=S.step>=nSteps()-1;
  cv.className=latStep?'drag':(!ion&&S.step===1?'pick':'');
  chips();facts();detail();caption();legend();
  try{if(window.claude&&window.claude.hot)window.claude.hot.data={level:S.level,mode:S.mode,ion:S.ion,cov:S.cov,step:S.step};}catch(e){}
}
function setLevel(l){S.level=l;if(l==='gcse'&&cur().al){if(S.mode==='ionic')S.ion='NaCl';else S.cov='H2O';S.step=Math.min(S.step,3);S.anim=S.step;}lat=null;save();ui();}
$('lvl-gcse').onclick=()=>setLevel('gcse');$('lvl-alevel').onclick=()=>setLevel('alevel');
$('m-ionic').onclick=()=>pick('ionic',S.ion);$('m-cov').onclick=()=>pick('cov',S.cov);
$('prev').onclick=()=>setStep(S.step-1);$('next').onclick=()=>setStep(S.step+1);
$('sh-outer').onclick=()=>{S.shells='outer';ui();};$('sh-all').onclick=()=>{S.shells='all';ui();};
$('scale-btn').onclick=()=>{S.scale=!S.scale;ui();};
$('v-stick').onclick=()=>{S.view='stick';ui();};$('v-fill').onclick=()=>{S.view='fill';ui();};
$('unit-btn').onclick=()=>{S.unit=!S.unit;ui();};$('spin-btn').onclick=()=>{S.spin=!S.spin;ui();};
$('n-dn').onclick=()=>{S.n=Math.max(1,S.n-1);ui();};$('n-up').onclick=()=>{S.n=Math.min(3,S.n+1);ui();};
$('heat').oninput=e=>{S.heat=e.target.value/100;ui();};
$('theme-btn').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme=dark?'light':'dark';readColours();save();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColours);
new MutationObserver(readColours).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'){setStep(S.step+1);e.preventDefault();}if(e.key==='ArrowLeft'){setStep(S.step-1);e.preventDefault();}});
let px=0,py=0;
cv.addEventListener('pointerdown',e=>{
  if(S.step===3&&isLat()){dragging=true;px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId);return;}
  if(S.mode==='cov'&&S.step===1&&dcHit){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-dcHit.cx)/dcHit.s,y=(e.clientY-r.top-dcHit.cy)/dcHit.s;
    let hit=null,bd=1e9;dcHit.M.at.forEach(a=>{const d=Math.hypot(x-dcHit.P[a.i][0],y-dcHit.P[a.i][1]);if(d<a.R&&d/a.R<bd){bd=d/a.R;hit=a.i;}});
    S.sel=hit===S.sel?null:hit;ui();}
});
cv.addEventListener('pointermove',e=>{if(!dragging)return;S.yaw+=(e.clientX-px)*.008;S.pitch=clamp(S.pitch+(e.clientY-py)*.008,-1.4,1.4);px=e.clientX;py=e.clientY;});
const endDrag=()=>{dragging=false;};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
new ResizeObserver(resize).observe(cv);

try{const hot=window.claude&&window.claude.hot;
if(hot&&hot.data){for(const k of['level','mode','ion','cov','step'])if(hot.data[k]!==undefined)S[k]=hot.data[k];if(!cur())throw 0;S.step=S.anim=clamp(+S.step||0,0,nSteps()-1);}}catch(e){S.mode='ionic';S.ion='NaCl';S.cov='H2O';S.step=S.anim=0;}
if(location.hash){const m=location.hash.slice(1).split('-');const f=(m[0]==='ionic'?IONIC:COV).find(d=>d.id===m[1]);
  if(f){S.mode=m[0]==='ionic'?'ionic':'cov';if(S.mode==='ionic')S.ion=f.id;else S.cov=f.id;if(f.al)S.level='alevel';if(m[2])S.step=S.anim=clamp(+m[2]-1,0,3);if(m[3]==='al')S.level='alevel';}}
requestAnimationFrame(frame);readColours();resize();ui();
})();
</script>
</body>
</html>
