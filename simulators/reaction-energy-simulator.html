<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Energy Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: instrument bench, matching Atom Viewer and Bonding Simulator. Five numbered steps across the top,
     a wide stage (system inside surroundings) on the left, a read-and-calculate rail on the right. */
  --bg:#EDF0F5; --surface:#FFFFFF; --soft:#E6EAF2; --ink:#0D1424; --muted:#566076; --line:#D7DDE8;
  --accent:#2348F5; --accent-ink:#FFFFFF;
  --stage:#FAFBFE; --stage2:#E3E8F2; --stage-line:#93A0B8;
  --hot:#D9481C; --cold:#1F74D6; --energy:#F2A100;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080C15; --surface:#111828; --soft:#1A2337; --ink:#EDF1FA; --muted:#98A3BA; --line:#242E46;
    --accent:#8198FF; --accent-ink:#0A0F1C;
    --stage:#0E1527; --stage2:#05080F; --stage-line:#5A6884;
    --hot:#FF7A4D; --cold:#5FA8FF; --energy:#FFC233;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080C15; --surface:#111828; --soft:#1A2337; --ink:#EDF1FA; --muted:#98A3BA; --line:#242E46;
  --accent:#8198FF; --accent-ink:#0A0F1C;
  --stage:#0E1527; --stage2:#05080F; --stage-line:#5A6884;
  --hot:#FF7A4D; --cold:#5FA8FF; --energy:#FFC233;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:12px;padding:12px 18px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.18)}
.seg.strong button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.timeline{display:flex;gap:6px;padding:4px 18px 12px;overflow-x:auto;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.timeline button{flex:1 0 auto;min-width:128px;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px}
.timeline .yr{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.timeline .nm{font-family:var(--font-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.15}
.timeline button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.timeline button[aria-pressed="true"] .yr{color:inherit;opacity:.7}

.bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:14px;padding:0 18px 16px}
.stagewrap{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stagebox{position:relative;flex:1;min-height:340px;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--stage-line) 22%,transparent) 1px,transparent 1.5px) 0 0/22px 22px,
             radial-gradient(ellipse at 50% 45%,var(--stage),var(--stage2))}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov.tl{top:12px;left:12px;right:12px}.ov.bl{bottom:12px;left:12px;right:12px}
.ov .seg{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line)}
.ov .seg button{padding:5px 12px;font-size:13px}
.ov .seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.pill{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
button.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.in{border-color:var(--cold);color:var(--cold)}
.pill.out{border-color:var(--hot);color:var(--hot)}
.hint{font-size:12.5px;color:var(--muted);font-weight:600;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 78%,transparent)}
.hint i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--energy);margin-right:5px}
.scrub{padding:8px 14px 0;border-top:1px solid var(--line)}
.scrub input{width:100%;accent-color:var(--accent);display:block}
.caption{padding:8px 14px 12px;font-size:15px;display:flex;gap:14px;align-items:center}
.caption #caption{flex:1;min-height:66px}
.caption b{font-weight:600}
.nav{display:flex;gap:6px;flex:none}
.nav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;white-space:nowrap}
.nav #next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.rail{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;padding-right:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cardhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.cardhead h2{margin:0 auto 0 0}
.cardhead .seg button{padding:4px 10px;font-size:12.5px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;font-weight:600;font-size:13.5px;
  text-align:left;line-height:1.25;display:flex;gap:7px;align-items:center}
.chips button::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--hot)}
.chips button.endo::before{background:var(--cold)}
.chips button:hover{border-color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--soft);border-color:var(--ink)}
.key{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}
.key span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--hot);margin-right:5px}
.key span.endo::before{background:var(--cold)}
.eq{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-top:10px;line-height:1.2}

.store{display:grid;gap:4px;margin-bottom:10px}
.store .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600}
.store .lab b{font-variant-numeric:tabular-nums;font-weight:700}
.track{position:relative;height:20px;background:var(--soft);border-radius:6px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px 0 0 6px}
.track em{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink)}
.note{font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink);font-weight:600}
.note+.note{margin-top:8px}

#diag{display:block;width:100%;height:auto}
#diag text{font-family:var(--font-body);font-size:11px;font-weight:600;fill:var(--ink)}
#diag .m{fill:var(--muted)}
#diag .b{font-size:12.5px;font-weight:700}
#diag .tin{fill:var(--cold)} #diag .tout{fill:var(--hot)}
#diag .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
#diag .lv{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round}
#diag .ds{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;fill:none}
#diag .cat{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 4;fill:none}
#diag .ain{stroke:var(--cold);stroke-width:2;fill:none}
#diag .aout{stroke:var(--hot);stroke-width:2;fill:none}
#diag .aink{stroke:var(--ink);stroke-width:2;fill:none}
#diag #mk{fill:var(--energy);stroke:var(--ink);stroke-width:1.5}

table.calc{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.calc th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:left;padding:8px 0 3px}
table.calc th.tin{color:var(--cold)} table.calc th.tout{color:var(--hot)}
table.calc td{padding:2px 0}
table.calc td:nth-child(2),table.calc td:nth-child(3){text-align:right;white-space:nowrap;padding-left:10px}
table.calc tr.sum td{border-top:1px solid var(--line);font-weight:700}
.result{margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.result strong{font-family:var(--font-display);font-size:19px;font-weight:700}
details summary{cursor:pointer;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
details[open] summary{margin-bottom:4px}

@media (max-width:980px){
  html,body{height:auto}
  body{display:block}
  .bench{display:block;padding:0 16px 16px}
  .stagebox{height:62vw;min-height:340px;flex:none}
  .rail{overflow:visible;margin-top:12px}
  .caption{flex-direction:column;align-items:stretch}
  .nav{justify-content:flex-end}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--ink)"/><path d="M5 14h5c4 0 4-8 7-8s3 16 6 16h4" fill="none" stroke="var(--energy)" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h1>Reaction Energy Simulator</h1>
  </div>
  <div class="seg strong" id="level" role="group" aria-label="Level">
    <button data-v="gcse" aria-pressed="true">GCSE</button><button data-v="a" aria-pressed="false">A-level</button>
  </div>
</header>

<nav class="timeline" id="steps" aria-label="Steps"></nav>

<main class="bench">
  <section class="stagewrap">
    <div class="stagebox">
      <canvas id="stage" aria-label="Particle view of the system and its surroundings"></canvas>
      <div class="ov tl">
        <div class="seg" id="mode" role="group" aria-label="View">
          <button data-v="one" aria-pressed="true">One reaction, step by step</button><button data-v="mix" aria-pressed="false">Whole mixture</button>
        </div>
        <button class="pill" id="lab" aria-pressed="true">Bond energies</button>
      </div>
      <div class="ov bl">
        <span class="pill in" id="pin"></span><span class="pill out" id="pout"></span><span class="hint" id="hint"></span>
      </div>
    </div>
    <div class="scrub"><input type="range" id="scr" min="0" max="1000" value="0" aria-label="Progress of reaction"></div>
    <div class="caption">
      <p id="caption"></p>
      <div class="nav"><button id="prev">Back</button><button id="play">Play</button><button id="next">Next step</button></div>
    </div>
  </section>

  <aside class="rail">
    <div class="card">
      <div class="cardhead"><h2>Reaction</h2><div class="key"><span>exothermic</span><span class="endo">endothermic</span></div></div>
      <div class="chips" id="chips"></div>
      <div class="eq" id="eq"></div>
    </div>

    <div class="card">
      <h2>Where is the energy?</h2>
      <div class="store">
        <div class="lab"><span>System: energy stored in bonds</span><b id="vs"></b></div>
        <div class="track"><i id="bs"></i><em id="ts"></em></div>
      </div>
      <div class="store">
        <div class="lab"><span>Surroundings: thermal energy</span><b id="vu"></b></div>
        <div class="track"><i id="bu"></i><em id="tu"></em></div>
      </div>
      <p class="note">Dashed line = where each started. <b>Total energy: unchanged.</b> Whatever one loses, the other gains.</p>
    </div>

    <div class="card">
      <div class="cardhead">
        <h2 id="dtitle">Energy diagram</h2>
        <button class="pill" id="cat" aria-pressed="false" hidden>Catalyst</button>
        <div class="seg" id="dsel" role="group" aria-label="Diagram">
          <button data-v="levels" aria-pressed="true">Bond energies</button><button data-v="profile" aria-pressed="false">Reaction profile</button>
        </div>
      </div>
      <svg id="diag" viewBox="0 0 430 238" role="img" aria-label="Energy diagram"></svg>
      <p class="note" id="dnote"></p>
    </div>

    <div class="card">
      <details open>
        <summary>Calculation</summary>
        <div id="calc"></div>
      </details>
    </div>
  </aside>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t*t*(3-2*t);
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const fmt=x=>(x>0?'+':x<0?'−':'')+Math.abs(Math.round(x));

/* ---------- data: bond energies in kJ per mole ---------- */
const BE={'H–H':436,'Cl–Cl':242,'H–Cl':431,'O=O':498,'O–H':464,'C–H':412,'C=O':805,'N≡N':945,'N–H':391,'H–Br':366,'Br–Br':193};
const EL={H:{r:4.5,c:'#FFFFFF',t:'#0D1424'},C:{r:6.5,c:'#3A4252',t:'#FFFFFF'},O:{r:6.5,c:'#E23B2E',t:'#FFFFFF'},
          N:{r:6.5,c:'#2F5BEA',t:'#FFFFFF'},Cl:{r:7.5,c:'#2FA84F',t:'#FFFFFF'},Br:{r:7.5,c:'#9A4A22',t:'#FFFFFF'}};
/* positions in a 100 x 60 box. A = left-hand side of the equation as written, B = right-hand side */
const BASE={
 hcl:{atoms:['H','H','Cl','Cl'],A:[[30,22],[30,38],[68,19],[68,41]],B:[[34,16],[48,44],[52,16],[66,44]],
      bA:[[0,1,'H–H'],[2,3,'Cl–Cl']],bB:[[0,2,'H–Cl'],[1,3,'H–Cl']],eA:'H₂(g) + Cl₂(g)',eB:'2HCl(g)',data:-185},
 h2o:{atoms:['H','H','H','H','O','O'],A:[[16,14],[30,14],[16,46],[30,46],[66,20],[66,40]],B:[[26,25],[50,25],[50,49],[74,49],[38,16],[62,40]],
      bA:[[0,1,'H–H'],[2,3,'H–H'],[4,5,'O=O']],bB:[[4,0,'O–H'],[4,1,'O–H'],[5,2,'O–H'],[5,3,'O–H']],eA:'2H₂(g) + O₂(g)',eB:'2H₂O(g)',data:-484},
 ch4:{atoms:['C','H','H','H','H','O','O','O','O'],A:[[28,30],[28,15],[43,30],[28,45],[13,30],[62,12],[82,12],[62,48],[82,48]],
      B:[[50,14],[60,49],[84,49],[38,49],[14,49],[30,14],[70,14],[26,40],[72,40]],
      bA:[[0,1,'C–H'],[0,2,'C–H'],[0,3,'C–H'],[0,4,'C–H'],[5,6,'O=O'],[7,8,'O=O']],
      bB:[[0,5,'C=O'],[0,6,'C=O'],[7,4,'O–H'],[7,3,'O–H'],[8,1,'O–H'],[8,2,'O–H']],eA:'CH₄(g) + 2O₂(g)',eB:'CO₂(g) + 2H₂O(g)',data:-802,
      extra:'This is with water formed as a gas. The standard enthalpy of combustion (liquid water) is −890.'},
 nh3:{atoms:['N','N','H','H','H','H','H','H'],A:[[18,20],[18,40],[50,12],[64,12],[70,30],[84,30],[50,48],[64,48]],
      B:[[30,16],[70,32],[17,22],[30,31],[43,22],[57,38],[70,47],[83,38]],
      bA:[[0,1,'N≡N'],[2,3,'H–H'],[4,5,'H–H'],[6,7,'H–H']],bB:[[0,2,'N–H'],[0,3,'N–H'],[0,4,'N–H'],[1,5,'N–H'],[1,6,'N–H'],[1,7,'N–H']],
      eA:'N₂(g) + 3H₂(g)',eB:'2NH₃(g)',data:-92},
 hbr:{atoms:['H','H','Br','Br'],A:[[28,22],[28,38],[68,18],[68,42]],B:[[34,16],[47,44],[53,16],[66,44]],
      bA:[[0,1,'H–H'],[2,3,'Br–Br']],bB:[[0,2,'H–Br'],[1,3,'H–Br']],eA:'H₂(g) + Br₂(g)',eB:'2HBr(g)',data:-103}
};
const RX=[{base:'hcl'},{base:'h2o'},{base:'ch4'},{base:'nh3'},{base:'hbr',rev:1},{base:'nh3',rev:1},{base:'h2o',rev:1}];
const PH={b0:.08,b1:.46,f0:.54,f1:.92}, TRAVEL=.06;
const ST=[0,.08,.46,.54,.92], EN=[0,.455,.5,.915,1];
const STEPS=[['Step 1','Reactants'],['Step 2','Break bonds: energy in'],['Step 3','Separate atoms'],['Step 4','Make bonds: energy out'],['Step 5','Products']];

const S={level:'gcse',rx:0,mode:'one',p:0,target:null,diag:'levels',cat:false,labels:true};
let R=null, D=null;

function build(i){
  const d=RX[i], b=BASE[d.base], rev=!!d.rev;
  const A=rev?b.B:b.A, B=rev?b.A:b.B;
  const mk=l=>l.map(([a,c,n])=>({a,b:c,l:n,e:BE[n],o:n.includes('≡')?3:n.includes('=')?2:1}));
  const bA=mk(rev?b.bB:b.bA), bB=mk(rev?b.bA:b.bB);
  const n=b.atoms.length, comp=[...Array(n).keys()];
  const find=x=>comp[x]===x?x:(comp[x]=find(comp[x]));
  bA.forEach(k=>{comp[find(k.a)]=find(k.b)});
  const X=A.map((pt,j)=>{const g=find(j);let sx=0,sy=0,c=0;
    A.forEach((q,k)=>{if(find(k)===g){sx+=q[0];sy+=q[1];c++}});sx/=c;sy/=c;
    return[sx+(pt[0]-sx)*1.5,sy+(pt[1]-sy)*1.5]});
  const sumB=bA.reduce((s,k)=>s+k.e,0), sumM=bB.reduce((s,k)=>s+k.e,0), dH=sumB-sumM;
  const rg=rnd(i*977+5), pk=[];
  const ang=(k,P)=>Math.atan2((P[k.a][1]+P[k.b][1])/2-30,(P[k.a][0]+P[k.b][0])/2-50)+(rg()-.5)*1.7;
  const segB=(PH.b1-PH.b0)/bA.length, segF=(PH.f1-PH.f0)/bB.length;
  bA.forEach((k,bi)=>{const q=Math.max(1,Math.round(k.e/100));
    for(let j=0;j<q;j++)pk.push({dir:1,bond:k,t0:PH.b0+segB*bi+segB*(j+1)/q-TRAVEL,th:ang(k,A)})});
  bB.forEach((k,bi)=>{const q=Math.max(1,Math.round(k.e/100));
    for(let j=0;j<q;j++)pk.push({dir:-1,bond:k,t0:PH.f0+segF*bi+segF*j/q,th:ang(k,B)})});
  /* whole-mixture particles */
  const mix=[], order=[...Array(36).keys()];
  for(let j=35;j>0;j--){const k=Math.floor(rg()*(j+1));[order[j],order[k]]=[order[k],order[j]]}
  const np=Math.max(1,Math.round(Math.abs(dH)/250));
  for(let j=0;j<36;j++){
    const x=8+(j%9)*10.5+rg()*4, y=9+Math.floor(j/9)*13.5+rg()*4, c=.06+.88*(order[j]+.5)/36, th=[];
    for(let q=0;q<np;q++)th.push(Math.atan2(y-30,x-50)+(rg()-.5)*2.2);
    mix.push({x,y,c,th,ph:rg()*6.3});
  }
  R={atoms:b.atoms,A,B,X,bA,bB,sumB,sumM,dH,pk,mix,exo:dH<0,
     eA:rev?b.eB:b.eA,eB:rev?b.eA:b.eB,data:rev?-b.data:b.data,extra:rev?'':(b.extra||'')};
}
const prog=(i,n,p,s0,s1)=>{const seg=(s1-s0)/n;return clamp((p-(s0+seg*i))/seg,0,1)};
const frac=p=>clamp((p-.06)/.88,0,1);
function energyIn(p){return R.bA.reduce((s,k,i)=>s+k.e*prog(i,R.bA.length,p,PH.b0,PH.b1),0)}
function energyOut(p){return R.bB.reduce((s,k,i)=>s+k.e*prog(i,R.bB.length,p,PH.f0,PH.f1),0)}
function E(p){return S.mode==='one'?energyIn(p)-energyOut(p):R.dH*frac(p)}
function atomPos(p){
  const fb=R.bA.map((k,i)=>ease(prog(i,R.bA.length,p,PH.b0,PH.b1))), ff=R.bB.map((k,i)=>ease(prog(i,R.bB.length,p,PH.f0,PH.f1)));
  return R.atoms.map((_,j)=>{
    let s=0,c=0;R.bA.forEach((k,i)=>{if(k.a===j||k.b===j){s+=fb[i];c++}});const tb=c?s/c:1;
    s=0;c=0;R.bB.forEach((k,i)=>{if(k.a===j||k.b===j){s+=ff[i];c++}});const tf=c?s/c:0;
    return{x:lerp(lerp(R.A[j][0],R.X[j][0],tb),R.B[j][0],tf),y:lerp(lerp(R.A[j][1],R.X[j][1],tb),R.B[j][1],tf),free:tb>=1&&tf<=0};
  });
}
const curStep=p=>p<.08?0:p<.46?1:p<=.54?2:p<.92?3:4;
const unit=()=>S.level==='a'?'kJ mol⁻¹':'kJ/mol';

/* ---------- canvas ---------- */
const cv=$('#stage'), ctx=cv.getContext('2d');
let W=0,H=0,G=null,C={},sur=[],clock=0,jig=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function theme(){const cs=getComputedStyle(document.documentElement);
  for(const k of['ink','muted','surface','soft','stage','stage2','stage-line','accent','hot','cold','energy','line'])C[k]=cs.getPropertyValue('--'+k).trim()}
function hex(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mixc(a,b,t){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
function rgba(h,a){return'rgba('+hex(h).join(',')+','+a+')'}
function resize(){
  const r=cv.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  W=r.width;H=r.height;if(!W||!H)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const tw=W<560?64:92, bw=Math.max(200,Math.min((W-tw)*.7,(H-150)*100/60)), bh=bw*.6;
  G={bw,bh,u:bw/100,cx:(W-tw)/2,cy:H/2,x0:(W-tw)/2-bw/2,y0:H/2-bh/2,tw,m:Math.max(30,bw*.1)};
  const rg=rnd(42);sur=[];
  const n=Math.min(170,Math.round((W*H-bw*bh)/2400));
  let guard=0;
  while(sur.length<n&&guard++<4000){
    const x=8+rg()*(W-tw-8), y=8+rg()*(H-16);
    if(x>G.x0-9&&x<G.x0+bw+9&&y>G.y0-9&&y<G.y0+bh+9)continue;
    sur.push({x,y,a:rg()*6.3,b:rg()*6.3,f:.7+rg()*.9,g:.7+rg()*.9});
  }
}
const PX=(x,y)=>[G.x0+x*G.u,G.y0+y*G.u];
function ring(th){ // point in the surroundings, outside the system box, in direction th
  const dx=Math.cos(th),dy=Math.sin(th),t=Math.min((G.bw/2+G.m)/Math.abs(dx||1e-6),(G.bh/2+G.m)/Math.abs(dy||1e-6));
  return[clamp(G.cx+dx*t,12,W-G.tw-4),clamp(G.cy+dy*t,12,H-12)];
}
function spark(x,y,a){
  const r=Math.max(4,G.u*.95);
  ctx.fillStyle=rgba(C.energy,.28*a);ctx.beginPath();ctx.arc(x,y,r*2.1,0,7);ctx.fill();
  ctx.fillStyle=rgba(C.energy,a);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
}
function halo(x,y,t,col){ctx.strokeStyle=rgba(col,.7*(1-t));ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,G.u*(1.5+5*t),0,7);ctx.stroke()}
function label(txt,x,y,col,size,align){
  ctx.font='600 '+size+'px "Instrument Sans","Segoe UI",sans-serif';ctx.textAlign=align||'center';ctx.textBaseline='middle';
  ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle=C.surface;ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y);
}
function drawBond(a,b,o,alpha,dash,col){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l,gap=G.u*1.7;
  ctx.strokeStyle=col;ctx.globalAlpha=alpha;ctx.lineWidth=Math.max(2,G.u*.85);ctx.lineCap='round';ctx.setLineDash(dash?[G.u*1.4,G.u*1.6]:[]);
  for(let i=0;i<o;i++){const off=(i-(o-1)/2)*gap;ctx.beginPath();ctx.moveTo(a[0]+nx*off,a[1]+ny*off);ctx.lineTo(b[0]+nx*off,b[1]+ny*off);ctx.stroke()}
  ctx.setLineDash([]);ctx.globalAlpha=1;
  return[(a[0]+b[0])/2+nx*(gap*(o-1)/2+G.u*3.6),(a[1]+b[1])/2+ny*(gap*(o-1)/2+G.u*3.6)];
}
function draw(){
  if(!G)return;
  const p=S.p, e=E(p), one=S.mode==='one';
  const tau=one?-e/Math.max(R.sumB,R.sumM):clamp(-e/900,-1,1);
  ctx.clearRect(0,0,W,H);
  /* surroundings: tint and particles */
  if(tau>0){ctx.fillStyle=rgba(C.hot,Math.min(.2,tau*.5));ctx.fillRect(0,0,W,H)}
  else if(tau<0){ctx.fillStyle=rgba(C.cold,Math.min(.2,-tau*.2));ctx.fillRect(0,0,W,H)}
  const warm=clamp(.4+.6*tau*(tau>0?2:1),0,1), amp=2+9*warm;
  const pc=tau>=0?mixc(C['stage-line'],C.hot,Math.min(1,tau*2.5)):mixc(C['stage-line'],C.cold,Math.min(1,-tau));
  ctx.fillStyle=pc;
  for(const s of sur){ctx.beginPath();ctx.arc(s.x+amp*Math.sin(jig*s.f+s.a),s.y+amp*Math.cos(jig*s.g+s.b),3.2,0,7);ctx.fill()}
  /* system box */
  ctx.fillStyle=C.surface;ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.setLineDash([7,6]);
  ctx.beginPath();ctx.roundRect(G.x0,G.y0,G.bw,G.bh,14);ctx.fill();ctx.stroke();ctx.setLineDash([]);
  const fs=Math.max(11,Math.min(14,G.u*2.3));
  label('SYSTEM: the reacting particles',G.x0+12,G.y0+fs*.9+4,C.muted,fs,'left');
  label(W<560?'SURROUNDINGS':'SURROUNDINGS: everything else (water, air, beaker, thermometer)',G.x0,G.y0+G.bh+fs+4,C.ink,fs,'left');

  if(one){
    const at=atomPos(p), P=at.map((a,j)=>{const w=(a.free?.9:.35)*G.u;const q=PX(a.x,a.y);return[q[0]+w*Math.sin(clock*3.1+j*1.7),q[1]+w*Math.cos(clock*2.7+j*2.3)]});
    R.bA.forEach((k,i)=>{const bp=prog(i,R.bA.length,p,PH.b0,PH.b1);if(bp>=1)return;
      const act=bp>0, m=drawBond(P[k.a],P[k.b],k.o,1-.55*bp,bp>.6,act?C.cold:C.ink);
      if(S.labels)label(act?'+'+k.e:''+k.e,m[0],m[1],act?C.cold:C.muted,Math.max(11,G.u*(act?3:2.5)))});
    R.bB.forEach((k,i)=>{const fp=prog(i,R.bB.length,p,PH.f0,PH.f1);if(fp<=0)return;
      const act=fp<1, m=drawBond(P[k.a],P[k.b],k.o,.35+.65*fp,fp<.4,act?C.hot:C.ink);
      if(S.labels)label(act?'−'+k.e:''+k.e,m[0],m[1],act?C.hot:C.muted,Math.max(11,G.u*(act?3:2.5)))});
    R.atoms.forEach((el,j)=>{const d=EL[el],r=d.r*G.u,[x,y]=P[j];
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=d.c;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(13,20,36,.55)';ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(x-r*.3,y-r*.32,r*.32,0,7);ctx.fill();
      ctx.fillStyle=d.t;ctx.font='700 '+Math.round(r*1.02)+'px "Instrument Sans","Segoe UI",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(el,x,y+1)});
    for(const k of R.pk){
      const t=(p-k.t0)/TRAVEL;if(t<=0||t>=1.5)continue;
      const mid=[(P[k.bond.a][0]+P[k.bond.b][0])/2,(P[k.bond.a][1]+P[k.bond.b][1])/2], out=ring(k.th);
      const from=k.dir>0?out:mid, to=k.dir>0?mid:out;
      if(t<1){const q=ease(t);spark(lerp(from[0],to[0],q),lerp(from[1],to[1],q),1)}
      else halo(to[0],to[1],(t-1)/.5,k.dir>0?C.cold:C.hot);
    }
  }else{
    const r=G.u*2.5, np=R.mix[0].th.length;
    for(const m of R.mix){
      const [x0,y0]=PX(m.x,m.y), x=x0+G.u*.8*Math.sin(clock*2.2+m.ph), y=y0+G.u*.8*Math.cos(clock*1.9+m.ph*1.3), done=p>=m.c;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=done?C.accent:C.soft;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=C.ink;ctx.stroke();
      if(done&&p<m.c+.04)halo(x,y,(p-m.c)/.04,C.accent);
      for(let q=0;q<np;q++){
        const out=ring(m.th[q]), t0=R.exo?m.c+q*.012:m.c-.07-q*.012, t=(p-t0)/.07;
        if(t<=0||t>=1.5)continue;
        const from=R.exo?[x,y]:out, to=R.exo?out:[x,y];
        if(t<1){const z=ease(t);spark(lerp(from[0],to[0],z),lerp(from[1],to[1],z),1)}
        else if(R.exo)halo(to[0],to[1],(t-1)/.5,C.hot);
      }
    }
  }
  /* gauge in the surroundings */
  const tx=W-G.tw/2, top=Math.max(70,H*.2), bot=Math.min(H-66,H*.8), tw=W<560?10:13, br=tw+3;
  let L, T=null;
  if(one)L=clamp(.5+.42*tau,.05,.97);else{T=20-R.dH*.04*frac(p);L=clamp(.5+(T-20)/100,.05,.97)}
  ctx.fillStyle=C.surface;ctx.strokeStyle=C['stage-line'];ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(tx-tw/2,top,tw,bot-top,tw/2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(tx,bot,br,0,7);ctx.fill();ctx.stroke();
  const liq=one?(tau>=0?mixc(C.muted,C.hot,Math.min(1,tau*3+.25)):mixc(C.muted,C.cold,Math.min(1,-tau+.25))):C.hot, ly=bot-L*(bot-top);
  ctx.fillStyle=liq;ctx.beginPath();ctx.arc(tx,bot,br-3,0,7);ctx.fill();
  ctx.beginPath();ctx.roundRect(tx-tw/2+3,ly,tw-6,bot-ly,(tw-6)/2);ctx.fill();
  ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.fillStyle=C.ink;ctx.textBaseline='middle';
  const small=W<560?10:11.5;
  if(one){const y=bot-.5*(bot-top);ctx.beginPath();ctx.moveTo(tx-tw/2-7,y);ctx.lineTo(tx+tw/2+7,y);ctx.stroke();
    label('start',tx-tw/2-10,y,C.ink,small,'right');
    label('thermal energy',tx,top-32,C.ink,small);label('of surroundings',tx,top-17,C.ink,small);
  }else{
    for(let d=-20;d<=60;d+=20){const y=bot-(.5+(d-20)/100)*(bot-top);ctx.beginPath();ctx.moveTo(tx-tw/2-5,y);ctx.lineTo(tx-tw/2,y);ctx.stroke();
      label(String(d).replace('-','−'),tx-tw/2-8,y,C.muted,small,'right')}
    label('thermometer',tx,top-36,C.muted,small);label(T.toFixed(1).replace('-','−')+' °C',tx,top-17,C.ink,W<560?13:16);
  }
}

/* ---------- diagram ---------- */
function drawDiagram(){
  const A=S.level==='a', dH=R.dH, sv=$('#diag');
  const defs='<defs>'+['in','out','ink'].map(c=>`<marker id="h-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--${c==='in'?'cold':c==='out'?'hot':'ink'})"/></marker>`).join('')+'</defs>';
  const axes=`<path class="ax" d="M40 214V10M40 214H424" marker-end="url(#h-ink)"/><path class="ax" d="M40 214V10" marker-end="url(#h-ink)"/>`+
    `<text class="m" transform="translate(22 112) rotate(-90)" text-anchor="middle">${A?'Enthalpy':'Energy'}</text><text class="m" x="232" y="232" text-anchor="middle">Progress of reaction</text>`;
  const ov1=A?'ΔH':'overall', ovv=fmt(dH);
  let body='', pos;
  if(S.diag==='levels'){
    const lo0=Math.min(0,dH), hi0=R.sumB, sp=hi0-lo0, lo=lo0-.15*sp, hi=hi0+.11*sp, y=v=>206-(v-lo)/(hi-lo)*190;
    const yR=y(0), yA=y(R.sumB), yP=y(dH), mid=(a,b)=>(a+b)/2;
    body+=`<path class="lv" d="M50 ${yR}H140M120 ${yA}H290M260 ${yP}H372"/><path class="ds" d="M140 ${yR}H372"/>`;
    body+=`<text x="50" y="${yR+14}">${R.eA}</text><text x="276" y="${dH<0?yP+14:yP-7}">${R.eB}</text>`;
    body+=`<text x="205" y="${yA-7}" text-anchor="middle">separate atoms</text>`;
    body+=`<path class="ain" d="M132 ${yR-2}V${yA+4}" marker-end="url(#h-in)"/><path class="aout" d="M268 ${yA+2}V${yP-4}" marker-end="url(#h-out)"/>`;
    body+=`<text class="tin" x="126" y="${mid(yR,yA)-4}" text-anchor="end">bonds broken</text><text class="tin b" x="126" y="${mid(yR,yA)+11}" text-anchor="end">+${R.sumB}</text>`;
    body+=`<text class="tout" x="275" y="${mid(yA,yP)-14}">bonds made</text><text class="tout b" x="275" y="${mid(yA,yP)+1}">−${R.sumM}</text>`;
    body+=`<path class="aink" d="M362 ${yR}V${yP+(dH<0?-4:4)}" marker-end="url(#h-ink)"/>`;
    body+=`<text x="372" y="${mid(yR,yP)-3}">${ov1}</text><text class="b" x="372" y="${mid(yR,yP)+11}">${ovv}</text>`;
    pos=p=>{const x=p<=.08?95:p<.46?lerp(95,205,ease((p-.08)/.38)):p<=.54?205:p<.92?lerp(205,310,ease((p-.54)/.38)):310;return[x,y(energyIn(p)-energyOut(p))]};
  }else{
    const lowB=.3*Math.min(R.sumB,R.sumM), f=S.cat?.55:1, Ea=Math.max(0,dH)+lowB, EaC=Math.max(0,dH)+lowB*.55;
    const lo0=Math.min(0,dH), sp=Ea-lo0, lo=lo0-.17*sp, hi=Ea+.1*sp, y=v=>206-(v-lo)/(hi-lo)*190;
    const pe=(x,ea)=>x<=0?0:x>=1?dH:x<.5?ea*(1-Math.cos(Math.PI*x*2))/2:dH+(ea-dH)*(1+Math.cos(Math.PI*(x-.5)*2))/2;
    const curve=ea=>{let d=`M50 ${y(0)}H120`;for(let i=1;i<=60;i++)d+=`L${120+i*3} ${y(pe(i/60,ea)).toFixed(1)}`;return d+'H372'};
    const yR=y(0), yP=y(dH), yK=y(Ea), yK0=yK, mid=(a,b)=>(a+b)/2;
    body+=`<path class="lv" d="${curve(Ea)}"/>`+(S.cat?`<path class="cat" d="${curve(EaC)}"/><text x="238" y="${yK0+5}" style="fill:var(--accent)">with catalyst</text>`:'');
    body+=`<path class="ds" d="M120 ${yR}H372M92 ${yK}H210"/>`;
    body+=`<text x="50" y="${yR+14}">${R.eA}</text><text x="372" y="${dH<0?yP+14:yP-7}" text-anchor="end">${R.eB}</text>`;
    body+=`<path class="aink" d="M100 ${yR-2}V${yK+4}" marker-end="url(#h-ink)"/>`;
    body+=A?`<text class="b" x="107" y="${mid(yR,yK)+4}">Eₐ</text>`:`<text x="107" y="${mid(yR,yK)-3}">activation</text><text x="107" y="${mid(yR,yK)+10}">energy</text>`;
    body+=`<path class="aink" d="M345 ${yR}V${yP+(dH<0?-4:4)}" marker-end="url(#h-ink)"/>`;
    body+=`<text x="378" y="${mid(yR,yP)-3}">${ov1}</text><text class="b" x="378" y="${mid(yR,yP)+11}">${ovv}</text>`;
    const ea=S.cat?EaC:Ea;
    pos=p=>{const x=p<=.08?lerp(60,120,p/.08):p<.92?lerp(120,300,(p-.08)/.84):lerp(300,360,(p-.92)/.08);return[x,y(pe((x-120)/180,ea))]};
  }
  sv.innerHTML=defs+axes+body+'<circle id="mk" r="6.5"/>';
  D={pos,mk:sv.querySelector('#mk')};
  $('#cat').hidden=S.diag!=='profile';
  const u=unit();
  $('#dnote').innerHTML=S.diag==='levels'
    ?`Values in ${u}. The dot follows the particles on the left.`+(A?' Full atomisation is a model for the calculation, not the real pathway.':'')
    :(A?`E<sub>a</sub> is not drawn to scale. Bonds break and form together in a real collision, so E<sub>a</sub> is much smaller than the ${R.sumB} ${u} needed to break every bond. For the reverse reaction, E<sub>a</sub>(reverse) = E<sub>a</sub> − ΔH. A catalyst gives a different route with lower E<sub>a</sub>; ΔH is unchanged.`
        :'The activation energy is the minimum energy the particles need to react. It is not drawn to scale. A catalyst lowers the activation energy but the overall energy change stays the same.');
}

/* ---------- side panels ---------- */
function drawCalc(){
  const A=S.level==='a', u=unit();
  const rows=l=>{const m=new Map();l.forEach(k=>m.set(k.l,(m.get(k.l)||0)+1));
    return[...m].map(([n,c])=>`<tr><td>${c} × ${n}</td><td>${c} × ${BE[n]}</td><td>= ${c*BE[n]}</td></tr>`).join('')};
  const dH=R.dH;
  $('#calc').innerHTML=`<table class="calc">
    <tr><th class="tin" colspan="3">${A?'Bonds broken (endothermic)':'Energy in: bonds broken'}</th></tr>${rows(R.bA)}
    <tr class="sum"><td>Total in</td><td></td><td>${R.sumB}</td></tr>
    <tr><th class="tout" colspan="3">${A?'Bonds formed (exothermic)':'Energy out: bonds made'}</th></tr>${rows(R.bB)}
    <tr class="sum"><td>Total out</td><td></td><td>${R.sumM}</td></tr></table>
    <div class="result">${A?'ΔH = Σ(bonds broken) − Σ(bonds formed)':'Overall energy change = energy in − energy out'}<br>
      = ${R.sumB} − ${R.sumM} = <strong>${fmt(dH)} ${u}</strong></div>
    <p class="note"><b>${dH<0?'Exothermic':'Endothermic'}.</b> ${dH<0
      ?`More energy is released making the new bonds than is taken in breaking the old ones. The extra ${-dH} ${u} is transferred to the surroundings, so their temperature rises.`
      :`More energy is taken in breaking the old bonds than is released making the new ones. The missing ${dH} ${u} is taken from the surroundings, so their temperature falls.`}</p>`+
    (A?`<p class="note">Data-book value: <b>${fmt(R.data)} ${u}</b>. ${R.extra} The bond enthalpy answer is an estimate because mean bond enthalpies are averaged over many different compounds, and they only apply to substances in the gas state.</p>`
      :`<p class="note">Bond energies are in kJ/mol: the energy to break one mole of that bond.</p>`);
}
function caption(){
  const A=S.level==='a', u=unit(), k=curStep(S.p), d=Math.abs(R.dH);
  if(S.mode==='mix')return`A real mixture has billions of particles reacting at different moments, so bond breaking and bond making overlap. A thermometer sits in the <b>surroundings</b> and only shows the overall effect: energy is transferred ${R.exo?'out of the system, the surrounding particles move faster and the temperature <b>rises</b>':'into the system, the surrounding particles move more slowly and the temperature <b>falls</b>'}. Example temperatures.`;
  return[
    `The <b>system</b> is only the reacting particles. Everything else is the <b>surroundings</b>: the water or air around them, the beaker and the thermometer. ${A?'Enthalpy is stored in the bonds of the system.':'Energy is stored in the bonds of the system.'}`,
    `Old bonds must break first. Breaking bonds <b>takes energy in</b>${A?' (endothermic)':''}. That energy comes from the surroundings, so the system gains energy and the surroundings lose exactly the same amount.`,
    `Every bond is broken. The separate atoms store <b>${R.sumB} ${u}</b> more than the reactant molecules did. Nothing has been lost: the energy has moved from the surroundings into the system.${A?' In a real mixture this dip is never seen, because other particles are making bonds at the same time.':' A real thermometer never shows this dip: see Whole mixture.'}`,
    `New bonds form. Making bonds <b>gives energy out</b>${A?' (exothermic)':''}. The energy leaves the system and spreads through the surroundings. Their particles move faster, which is what hotter means.`,
    R.exo?`<b>${R.sumM}</b> went out but only <b>${R.sumB}</b> came in. The system ends with ${d} ${u} less energy and the surroundings end with ${d} ${u} more, so their temperature has risen. The energy was not made: it moved from the bonds to the surroundings.${A?` ΔH = ${fmt(R.dH)} ${u}.`:''}`
         :`<b>${R.sumB}</b> came in but only <b>${R.sumM}</b> went out. The system ends with ${d} ${u} more energy stored in its bonds and the surroundings end with ${d} ${u} less, so their temperature has fallen. The energy was not destroyed: it moved into the bonds.${A?` ΔH = ${fmt(R.dH)} ${u}.`:''}`
  ][k];
}
let capKey='';
const setT=(el,t)=>{if(el.textContent!==t)el.textContent=t};
function ui(){
  const p=S.p, one=S.mode==='one', k=curStep(p), e=E(p), u=unit();
  const scr=$('#scr');if(document.activeElement!==scr||S.target!=null)scr.value=Math.round(p*1000);
  document.querySelectorAll('#steps button').forEach((b,i)=>{b.setAttribute('aria-pressed',one&&i===k);b.disabled=!one});
  const key=[S.level,S.rx,S.mode,one?k:0].join();
  if(key!==capKey){capKey=key;$('#caption').innerHTML=caption()}
  if(one){
    setT($('#pin'),'Energy in: '+Math.round(energyIn(p))+' kJ');setT($('#pout'),'Energy out: '+Math.round(energyOut(p))+' kJ');
    $('#pout').hidden=false;$('#pin').className='pill in';
    if(!$('#hint').dataset.one){$('#hint').innerHTML='<i></i>= 100 kJ of energy';$('#hint').dataset.one=1}
  }else{
    setT($('#pin'),(R.exo?'Transferred to surroundings: ':'Taken from surroundings: ')+Math.round(Math.abs(e))+' kJ');
    $('#pin').className='pill '+(R.exo?'out':'in');$('#pout').hidden=true;
    if($('#hint').dataset.one!==''){$('#hint').textContent='○ reactant particles   ● product particles';$('#hint').dataset.one=''}
  }
  /* stores */
  const lo=Math.min(0,R.dH), hi=one?R.sumB:Math.max(0,R.dH), pad=.22*(hi-lo), tot=hi-lo+2*pad;
  $('#bs').style.width=(e-lo+pad)/tot*100+'%';$('#ts').style.left=(pad-lo)/tot*100+'%';
  $('#bu').style.width=(hi-e+pad)/tot*100+'%';$('#tu').style.left=(hi+pad)/tot*100+'%';
  $('#bu').style.background=e>0?'var(--cold)':e<0?'var(--hot)':'var(--muted)';
  setT($('#vs'),(Math.round(e)===0?'0':fmt(e))+' '+u);setT($('#vu'),(Math.round(e)===0?'0':fmt(-e))+' '+u);
  if(D){if(one){const q=D.pos(p);D.mk.setAttribute('cx',q[0]);D.mk.setAttribute('cy',q[1]);D.mk.style.display=''}else D.mk.style.display='none'}
  setT($('#play'),S.target!=null?'Pause':'Play');
  $('#lab').hidden=!one;$('#prev').disabled=!one;$('#next').disabled=!one||p>=1;
}
function setRx(i){S.rx=i;build(i);S.p=0;S.target=null;
  document.querySelectorAll('#chips button').forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
  $('#eq').textContent=R.eA+' → '+R.eB;drawDiagram();drawCalc();capKey=''}
function go(k){if(S.mode!=='one')return;if(!(S.p>=ST[k]&&S.p<EN[k]))S.p=ST[k];S.target=EN[k]}
function next(){if(S.mode!=='one'||S.target!=null)return;const k=curStep(S.p);if(S.p<EN[k]-1e-6)S.target=EN[k];else if(k<4)S.target=EN[k+1]}
function prev(){if(S.mode!=='one')return;const k=curStep(S.p);S.target=null;S.p=k>0?EN[k-1]:0}
function play(){if(S.target!=null)S.target=null;else{if(S.p>=1)S.p=0;S.target=1}}

/* ---------- wiring ---------- */
function seg(id,fn){const el=$(id);el.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset.v)})}
$('#steps').innerHTML=STEPS.map((s,i)=>`<button data-i="${i}" aria-pressed="false"><span class="yr">${s[0].toUpperCase()}</span><span class="nm">${s[1]}</span></button>`).join('');
$('#steps').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)go(+b.dataset.i)});
$('#chips').innerHTML=RX.map((d,i)=>{const b=BASE[d.base],l=(d.rev?b.eB+' → '+b.eA:b.eA+' → '+b.eB).replace(/\(g\)/g,'');
  return`<button data-i="${i}" class="${d.rev?'endo':''}" aria-pressed="false">${l}</button>`}).join('');
$('#chips').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)setRx(+b.dataset.i)});
seg('#level',v=>{S.level=v;drawDiagram();drawCalc();capKey=''});
seg('#mode',v=>{S.mode=v;S.p=0;S.target=null;capKey=''});
seg('#dsel',v=>{S.diag=v;$('#dtitle').textContent=v==='levels'?'Energy diagram':'Reaction profile';drawDiagram()});
$('#cat').addEventListener('click',()=>{S.cat=!S.cat;$('#cat').setAttribute('aria-pressed',S.cat);drawDiagram()});
$('#lab').addEventListener('click',()=>{S.labels=!S.labels;$('#lab').setAttribute('aria-pressed',S.labels)});
$('#scr').addEventListener('input',ev=>{S.target=null;S.p=ev.target.value/1000});
$('#prev').addEventListener('click',prev);$('#next').addEventListener('click',next);$('#play').addEventListener('click',play);
document.addEventListener('keydown',ev=>{if(ev.target.matches('input,button'))return;
  if(ev.key==='ArrowRight')next();else if(ev.key==='ArrowLeft')prev();else if(ev.key===' '){ev.preventDefault();play()}});
new ResizeObserver(resize).observe(cv);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S.target!=null){
    if(reduce)S.p=S.target;else S.p=Math.min(S.target,S.p+dt*(S.mode==='one'?.075:.1));
    if(S.p>=S.target-1e-9){S.p=S.target;S.target=null}
  }
  if(!reduce){
    clock+=dt;
    const e=E(S.p), tau=S.mode==='one'?-e/Math.max(R.sumB,R.sumM):clamp(-e/900,-1,1);
    jig+=dt*(.5+3.2*clamp(.4+.6*tau*(tau>0?2:1),0,1));
  }
  ui();draw();requestAnimationFrame(frame);
}
theme();setRx(0);resize();requestAnimationFrame(frame);
</script>
</body>
</html>
