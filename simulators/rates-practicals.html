<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rates of Reaction Practicals</title>
<style>
/* Layout idea: lab bench on the left (apparatus, stopwatch, run buttons), lab book on the right (set-up, results table, graph), teacher notes underneath.
   Three experiments on tabs. Single light theme for projectors. */
:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --ink:#131c2b; --muted:#56637a; --line:#d3dae6;
  --accent:#2a4fc9; --accent-soft:#e3e9fb; --warn:#b4530a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#6250d6;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
header a{color:var(--accent);font-size:.9rem;text-decoration:none;flex-basis:100%}
header a:hover{text-decoration:underline}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;min-width:170px}
.tabs button b{font-size:1rem}
.tabs button span{font-size:.82rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[aria-selected="true"] span{color:#fff;opacity:.85}
main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){main{grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
h2{margin:0 0 2px;font-size:1.3rem;text-wrap:balance}
h3{margin:0 0 8px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{margin:0 0 10px;color:var(--muted)}
canvas{display:block;width:100%;height:auto;border-radius:10px}
#bench{background:#f7f9fc;aspect-ratio:640/440}
#graph{aspect-ratio:600/370}
.run{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
.clock{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.6em;line-height:1}
.clock small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:4px}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 14px;min-height:42px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650;padding:9px 18px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .lab{font-weight:600;margin-right:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row + .row{margin-top:10px}
.status{margin:10px 0 0;padding:8px 12px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;min-height:2.6em}
.vars{margin:10px 0 0;padding:0;list-style:none;font-size:.92rem;color:var(--muted)}
.vars b{color:var(--ink)}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.98rem}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.84rem;color:var(--muted);font-weight:600;vertical-align:bottom}
th i,.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
td.now{background:var(--accent-soft);font-weight:700}
.empty{color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 6px;padding:0;list-style:none;font-size:.9rem}
.gopt{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:8px}
.gopt label{display:flex;align-items:center;gap:6px}
.gopt input[type=range]{width:170px;accent-color:var(--accent)}
.gopt input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
#tanOut{font-weight:650;font-variant-numeric:tabular-nums}
details{border-bottom:1px solid var(--line);padding:9px 0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 2px;padding:8px 12px;background:var(--accent-soft);border-radius:8px}
.heads{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.heads h3{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html">&larr; Simulators</a>
    <h1>Rates of reaction practicals</h1>
    <p>AQA GCSE required practical &middot; three experiments, three ways to measure rate</p>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>

  <main>
    <div class="col">
      <section class="card">
        <h2 id="title"></h2><p class="sub" id="sub"></p>
        <canvas id="bench" width="640" height="440" role="img" aria-label="Apparatus"></canvas>
        <div class="run">
          <div class="clock" id="clock">0<small>s</small></div>
          <button type="button" class="btn primary" id="go"></button>
          <button type="button" class="btn primary" id="stop" hidden>Cross has gone: stop</button>
          <button type="button" class="btn" id="reset">Reset apparatus</button>
          <div class="seg" id="speed"><span class="lab">Speed</span>
            <button type="button" class="btn" data-v="1" aria-pressed="true">Real time</button>
            <button type="button" class="btn" data-v="3" aria-pressed="false">&times;3</button>
            <button type="button" class="btn" data-v="10" aria-pressed="false">&times;10</button>
          </div>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
      <section class="card">
        <h3>Questions for the class</h3>
        <div id="notes"></div>
      </section>
    </div>

    <div class="col">
      <section class="card">
        <h3>Set-up</h3>
        <div id="setup"></div>
        <ul class="vars" id="vars"></ul>
      </section>
      <section class="card">
        <div class="heads"><h3>Results</h3><button type="button" class="btn" id="clear">Clear results</button></div>
        <div class="tscroll" id="table"></div>
      </section>
      <section class="card">
        <h3>Graph</h3>
        <ul class="legend" id="legend"></ul>
        <canvas id="graph" width="600" height="370" role="img" aria-label="Graph of the results"></canvas>
        <div class="gopt" id="gopt"></div>
      </section>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
var el=function(id){return document.getElementById(id);};
var COL=["#2a78d6","#eb6834","#1baf7a","#6250d6"],INK="#131c2b",MUTED="#56637a",WALL="#56637a";
var FONT=getComputedStyle(document.body).fontFamily;
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

/* ---------- canvas helpers ---------- */
var bc=el("bench"),bx=bc.getContext("2d"),gc=el("graph"),gx=gc.getContext("2d"),c;
function txt(s,x,y,o){o=o||{};c.font=(o.b?"700 ":"500 ")+(o.size||15)+"px "+FONT;c.textAlign=o.al||"center";c.textBaseline="alphabetic";c.fillStyle=o.col||INK;String(s).split("\n").forEach(function(l,i){c.fillText(l,x,y+i*(o.size||15)*1.2);});}
function rr(x,y,w,h,r){c.beginPath();if(c.roundRect)c.roundRect(x,y,w,h,r);else c.rect(x,y,w,h);}
function line(a){c.beginPath();c.moveTo(a[0],a[1]);for(var i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.stroke();}
function flaskPath(cx,by,w,h){var n=w*.15;c.beginPath();c.moveTo(cx-n,by-h);c.lineTo(cx-n,by-h*.62);c.lineTo(cx-w/2,by-10);c.quadraticCurveTo(cx-w/2-2,by,cx-w/2+10,by);c.lineTo(cx+w/2-10,by);c.quadraticCurveTo(cx+w/2+2,by,cx+w/2,by-10);c.lineTo(cx+n,by-h*.62);c.lineTo(cx+n,by-h);}
function flask(cx,by,w,h,liq,level,inside){
  c.save();flaskPath(cx,by,w,h);c.closePath();c.fillStyle="rgba(255,255,255,.75)";c.fill();c.clip();
  c.fillStyle=liq;c.fillRect(cx-w,by-level,2*w,level);if(inside)inside();c.restore();
  c.strokeStyle=WALL;c.lineWidth=4;c.lineJoin="round";c.lineCap="round";flaskPath(cx,by,w,h);c.stroke();
  c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=3;line([cx-w/2+14,by-20,cx-w*.2,by-h*.52]);
}
function bubbles(list,dt,rate,cx,by,w,level){
  if(Math.random()<rate*dt)list.push({x:cx+R(-w*.36,w*.36),y:by-6,r:R(2,4.5),v:R(40,70)});
  for(var i=list.length-1;i>=0;i--){var b=list[i];b.y-=b.v*dt;b.x+=(cx-b.x)*dt*.5;if(b.y<by-level+4)list.splice(i,1);}
}
function drawBubbles(list){c.strokeStyle="#fff";c.fillStyle="rgba(255,255,255,.55)";c.lineWidth=1.5;list.forEach(function(b){c.beginPath();c.arc(b.x,b.y,b.r,0,6.3);c.fill();c.stroke();});}
function bench(){c.fillStyle="#f7f9fc";c.fillRect(0,0,640,440);c.fillStyle="#d9c7a8";c.fillRect(0,400,640,40);c.fillStyle="#c4b08c";c.fillRect(0,400,640,5);}

/* ---------- graph ---------- */
function plot(o){
  c=gx;var L=64,T=14,Rm=18,B=50,w=600-L-Rm,h=370-T-B;
  c.clearRect(0,0,600,370);c.fillStyle="#fff";c.fillRect(0,0,600,370);
  function X(v){return L+v/o.xmax*w;}function Y(v){return T+h-v/o.ymax*h;}
  o.yt.forEach(function(v){c.strokeStyle=v?"#e6eaf1":WALL;c.lineWidth=v?1:2;line([L,Y(v),L+w,Y(v)]);txt(o.yf?o.yf(v):v,L-8,Y(v)+5,{al:"right",size:13.5,col:MUTED});});
  o.xt.forEach(function(v){if(v){c.strokeStyle="#e6eaf1";c.lineWidth=1;line([X(v),T,X(v),T+h]);}txt(v,X(v),T+h+20,{size:13.5,col:MUTED});});
  c.strokeStyle=WALL;c.lineWidth=2;line([L,T,L,T+h]);
  txt(o.xl,L+w/2,T+h+42,{size:14.5,col:MUTED});
  c.save();c.translate(17,T+h/2);c.rotate(-Math.PI/2);txt(o.yl,0,0,{size:14.5,col:MUTED});c.restore();
  o.series.forEach(function(s){
    if(s.pts.length>1&&s.line!==false){c.strokeStyle=s.col;c.lineWidth=2.5;c.lineJoin="round";c.beginPath();s.pts.forEach(function(p,i){if(i)c.lineTo(X(p[0]),Y(p[1]));else c.moveTo(X(p[0]),Y(p[1]));});c.stroke();}
    s.pts.forEach(function(p){c.fillStyle=s.col;c.beginPath();c.arc(X(p[0]),Y(p[1]),4.5,0,6.3);c.fill();c.strokeStyle="#fff";c.lineWidth=2;c.stroke();});
  });
  if(o.tan){var t=o.tan,x1=Math.max(0,t.x-t.span),x2=Math.min(o.xmax,t.x+t.span);
    c.save();c.beginPath();c.rect(L,T,w,h);c.clip();c.strokeStyle=INK;c.lineWidth=2;c.setLineDash([7,5]);line([X(x1),Y(t.y+(x1-t.x)*t.m),X(x2),Y(t.y+(x2-t.x)*t.m)]);c.setLineDash([]);c.restore();
    c.fillStyle=INK;c.beginPath();c.arc(X(t.x),Y(t.y),5.5,0,6.3);c.fill();c.strokeStyle="#fff";c.lineWidth=2;c.stroke();}
}
function niceMax(v,steps){var s=steps.filter(function(x){return x>=v;})[0]||steps[steps.length-1];return s;}
function ticks(max,n){var a=[];for(var i=0;i<=n;i++)a.push(Math.round(max/n*i*100)/100);return a;}

/* =====================================================================
   1. DISAPPEARING CROSS
   ===================================================================== */
var E1=(function(){
  var CONC=[8,16,24,32,40],TEMP=[20,30,40,50];
  var e={
    id:"disappearing-cross",tab:"Disappearing cross",tabsub:"sodium thiosulfate + acid",
    title:"The disappearing cross",sub:"Sodium thiosulfate solution and dilute hydrochloric acid make a cloudy precipitate of sulfur",
    go:"Add acid and start timer",manual:true,
    cfg:{mode:"conc",conc:40,temp:20,auto:false,y:"time"},
    runs:{conc:[],temp:[]},state:"idle",t:0,trueT:0,
    vars:["<b>Independent:</b> concentration of sodium thiosulfate, or temperature","<b>Dependent:</b> time for the cross to disappear","<b>Control:</b> volume of each solution, concentration of acid, the same cross, the same person judging, and whichever of concentration or temperature is not being changed"],
    notes:[
      ["Why does the cross disappear?","Solid sulfur forms as a precipitate. It makes the solution cloudy (turbid), so less light passes through and the cross can no longer be seen."],
      ["Which variables must be kept the same, and why?","The volume of solution (so the depth looked through is the same), the concentration and volume of acid, the same cross and the same person judging. Otherwise the times cannot be fairly compared."],
      ["Why is the time judged by eye a weakness, and how could it be improved?","Different people decide the cross has gone at different moments, so the results are not reproducible. A light sensor and data logger would give an objective end point."],
      ["Explain the effect of concentration using collision theory.","At a higher concentration there are more particles in the same volume, so collisions are more frequent and the rate is higher. The time taken is shorter."],
      ["Explain the effect of temperature using collision theory.","At a higher temperature the particles move faster, so collisions are more frequent, and more of the particles have the activation energy. The rate is higher."],
      ["How can a rate be worked out from the time?","Rate is proportional to 1 ÷ time. Here 1000 ÷ time is used to give easier numbers. A shorter time means a higher rate."]
    ],
    setup:function(){
      var s=this,k=s.cfg,lock=s.state==="running"?" disabled":"";
      function seg(label,key,vals,unit,fixed){return '<div class="row"><div class="seg"><span class="lab">'+label+'</span>'+vals.map(function(v){return '<button type="button" class="btn" data-set="'+key+'" data-v="'+v+'" aria-pressed="'+(k[key]===v)+'"'+((fixed||lock)?" disabled":"")+'>'+v+'</button>';}).join("")+'<span>'+unit+'</span></div></div>';}
      return '<div class="row"><div class="seg"><span class="lab">Investigate</span><button type="button" class="btn" data-set="mode" data-v="conc" aria-pressed="'+(k.mode==="conc")+'"'+lock+'>Concentration</button><button type="button" class="btn" data-set="mode" data-v="temp" aria-pressed="'+(k.mode==="temp")+'"'+lock+'>Temperature</button></div></div>'+
        seg("Sodium thiosulfate","conc",CONC,"g/dm³",k.mode==="temp")+seg("Temperature","temp",TEMP,"°C",k.mode==="conc")+
        '<div class="row"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="auto" style="width:18px;height:18px"'+(k.auto?" checked":"")+'> Stop the timer automatically when the cross has gone</label></div>';
    },
    set:function(key,v){var k=this.cfg;if(key==="mode"){k.mode=v;k.conc=v==="conc"?40:16;k.temp=20;}else if(key==="y")k.y=v;else k[key]=+v;this.reset();},
    start:function(){this.t=0;this.state="running";this.trueT=(1000/this.cfg.conc)/Math.pow(2,(this.cfg.temp-20)/10)*R(.96,1.04);},
    stop:function(){
      if(this.state!=="running")return;this.state="done";
      var k=this.cfg,list=this.runs[k.mode];list.push({conc:k.conc,temp:k.temp,time:Math.max(1,Math.round(this.t))});if(list.length>12)list.shift();
    },
    reset:function(){this.state="idle";this.t=0;},
    step:function(dt){if(this.state!=="running")return;this.t+=dt;if(this.cfg.auto&&this.t>=this.trueT){this.t=this.trueT;this.stop();}if(this.t>this.trueT*3+20)this.stop();},
    status:function(){
      if(this.state==="idle")return "Choose the "+(this.cfg.mode==="conc"?"concentration":"temperature")+", then add the acid. Watch the cross from above.";
      if(this.state==="running")return this.cfg.auto?"Timing. The timer will stop when the cross has gone.":"Timing. Press the stop button the moment the class can no longer see the cross.";
      return "Time recorded. Reset the apparatus, change the "+(this.cfg.mode==="conc"?"concentration":"temperature")+" and repeat.";
    },
    draw:function(){
      var k=this.cfg,f=this.state==="idle"?0:clamp(this.t/this.trueT,0,1.4),cloud=clamp(Math.pow(f,1.4),0,1),i;
      bench();
      /* paper with cross under the flask */
      c.fillStyle="#fff";c.strokeStyle="#c9d1dd";c.lineWidth=1.5;c.beginPath();c.moveTo(60,400);c.lineTo(110,372);c.lineTo(330,372);c.lineTo(380,400);c.closePath();c.fill();c.stroke();
      c.strokeStyle=INK;c.lineWidth=5;line([190,378,250,394]);line([250,378,190,394]);
      var liq="rgb("+Math.round(226+cloud*20)+","+Math.round(240-cloud*10)+","+Math.round(250-cloud*95)+")";
      flask(220,392,210,250,liq,92);
      txt("50 cm³ sodium thiosulfate solution",220,128,{size:14,col:MUTED});
      if(this.state!=="idle")txt("+ 5 cm³ dilute hydrochloric acid",220,108,{size:14,col:"#b4530a",b:1});
      /* thermometer */
      c.fillStyle="#fff";rr(402,190,14,170,7);c.fill();c.strokeStyle=WALL;c.lineWidth=2;c.stroke();
      var th=40+(k.temp-10)*2.4;c.fillStyle="#d6455d";c.fillRect(406,352-th,6,th);c.beginPath();c.arc(409,362,11,0,6.3);c.fill();
      txt(k.temp+" °C",409,180,{b:1,size:16});
      /* view from above */
      var vx=530,vy=250,vr=84;
      txt("View from above",vx,138,{b:1,size:16});
      c.save();c.beginPath();c.arc(vx,vy,vr,0,6.3);c.clip();c.fillStyle="#fff";c.fillRect(vx-vr,vy-vr,2*vr,2*vr);
      c.strokeStyle=INK;c.lineWidth=13;c.lineCap="round";line([vx-44,vy-44,vx+44,vy+44]);line([vx+44,vy-44,vx-44,vy+44]);
      c.fillStyle="rgba(226,240,250,.35)";c.fillRect(vx-vr,vy-vr,2*vr,2*vr);
      c.fillStyle="rgba(243,229,150,"+cloud.toFixed(3)+")";c.fillRect(vx-vr,vy-vr,2*vr,2*vr);c.restore();
      c.strokeStyle=WALL;c.lineWidth=5;c.beginPath();c.arc(vx,vy,vr,0,6.3);c.stroke();c.lineWidth=2;c.strokeStyle="#9aa7bf";c.beginPath();c.arc(vx,vy,vr-22,0,6.3);c.stroke();
      txt(k.conc+" g/dm³",vx,vy+vr+30,{size:15,col:MUTED});
    },
    table:function(){
      var list=this.runs[this.cfg.mode];if(!list.length)return '<p class="empty">No results yet. Each run adds a row.</p>';
      return "<table><tr><th>Run</th><th>Concentration<br>in g/dm³</th><th>Temperature<br>in °C</th><th>Time for cross to<br>disappear in s</th><th>1000 ÷ time</th></tr>"+
        list.map(function(r,i){return "<tr><td>"+(i+1)+"</td><td>"+r.conc+"</td><td>"+r.temp+"</td><td>"+r.time+"</td><td>"+(1000/r.time).toFixed(0)+"</td></tr>";}).join("")+"</table>";
    },
    legend:function(){return "";},
    gopt:function(){return '<div class="seg"><span class="lab">Plot</span><button type="button" class="btn" data-set="y" data-v="time" aria-pressed="'+(this.cfg.y==="time")+'">Time</button><button type="button" class="btn" data-set="y" data-v="rate" aria-pressed="'+(this.cfg.y==="rate")+'">1000 ÷ time</button></div>';},
    graph:function(){
      var k=this.cfg,list=this.runs[k.mode],xk=k.mode==="conc"?"conc":"temp",rate=k.y==="rate";
      var pts=list.map(function(r){return [r[xk],rate?1000/r.time:r.time];}).sort(function(a,b){return a[0]-b[0];});
      var ymax=niceMax(Math.max.apply(null,pts.map(function(p){return p[1];}).concat([rate?40:60]))*1.08,rate?[50,100,150,200,300,400]:[60,90,120,150,180,240,300]);
      plot({xmax:k.mode==="conc"?40:60,ymax:ymax,xt:k.mode==="conc"?[0,8,16,24,32,40]:[0,10,20,30,40,50,60],yt:ticks(ymax,rate?5:6),
        xl:k.mode==="conc"?"Concentration of sodium thiosulfate in g/dm³":"Temperature in °C",yl:rate?"1000 ÷ time":"Time for cross to disappear in s",series:[{pts:pts,col:COL[0]}]});
    }
  };
  return e;
})();

/* =====================================================================
   2 and 3. CURVE EXPERIMENTS (gas syringe, mass loss)
   ===================================================================== */
function curveExp(o){
  var e={
    id:o.id,tab:o.tab,tabsub:o.tabsub,title:o.title,sub:o.sub,go:o.go,vars:o.vars,notes:o.notes,
    cfg:{v:o.levels[o.def].v,tan:false,tanT:o.tmax/4},runs:[],state:"idle",t:0,cur:null,bub:[],nextCol:0,
    setup:function(){
      var s=this,lock=s.state==="running"?" disabled":"";
      return '<div class="row"><div class="seg"><span class="lab">'+o.varLabel+'</span>'+o.levels.map(function(l){return '<button type="button" class="btn" data-set="v" data-v="'+l.v+'" aria-pressed="'+(s.cfg.v===l.v)+'"'+lock+'>'+l.name+'</button>';}).join("")+(o.unit?'<span>'+o.unit+'</span>':'')+'</div></div>';
    },
    level:function(){var v=this.cfg.v;return o.levels.filter(function(l){return l.v===v;})[0];},
    set:function(key,v){if(key==="v"){this.cfg.v=isNaN(+v)?v:+v;this.reset();}},
    val:function(t,run){return o.max*(1-Math.exp(-run.k*t));},
    start:function(){
      var l=this.level(),n=this.runs.filter(function(r){return r.v===l.v;}).length;
      this.cur={v:l.v,label:l.name+(o.unit?" "+o.unit:"")+(n?" ("+(n+1)+")":""),k:l.k*R(.95,1.05),data:[[0,0]],col:COL[this.nextCol%4]};this.nextCol++;
      this.runs.push(this.cur);if(this.runs.length>4)this.runs.shift();
      this.t=0;this.state="running";this.bub=[];
    },
    stop:function(){},
    reset:function(){if(this.state==="running"&&this.cur){this.runs.splice(this.runs.indexOf(this.cur),1);}this.state="idle";this.t=0;this.cur=null;this.bub=[];},
    step:function(dt){
      if(this.state!=="running")return;
      this.t=Math.min(o.tmax,this.t+dt);var after=Math.floor(this.t/o.dt+1e-9);
      for(var i=this.cur.data.length;i<=after;i++){var tt=i*o.dt,v=this.val(tt,this.cur)+R(-o.noise,o.noise);var prev=this.cur.data[this.cur.data.length-1][1];this.cur.data.push([tt,clamp(Math.max(prev,+v.toFixed(o.dp)),0,o.max)]);}
      o.sim(this,dt);
      if(this.t>=o.tmax)this.state="done";
    },
    rate:function(){return this.cur&&this.state==="running"?o.max*this.cur.k*Math.exp(-this.cur.k*this.t):0;},
    now:function(){return this.cur?this.val(this.t,this.cur):0;},
    status:function(){
      if(this.state==="idle")return o.idle;
      if(this.state==="running")return "Running. A reading is recorded every "+o.dt+" seconds.";
      return "Finished. Reset the apparatus, change the "+o.varWord+" and run again to compare the curves.";
    },
    draw:function(){o.draw(this);},
    table:function(){
      var runs=this.runs,s=this;if(!runs.length)return '<p class="empty">No results yet. Each run adds a column, up to four.</p>';
      var h="<table><tr><th>Time in s</th>"+runs.map(function(r){return '<th><i style="background:'+r.col+'"></i>'+esc(r.label)+"</th>";}).join("")+"</tr>";
      for(var i=0;i<=o.tmax/o.dt;i++){h+="<tr><td>"+i*o.dt+"</td>"+runs.map(function(r){var d=r.data[i],last=r===s.cur&&s.state==="running"&&i===r.data.length-1;return "<td"+(last?' class="now"':"")+">"+(d?d[1].toFixed(o.dp):"")+"</td>";}).join("")+"</tr>";}
      return h+"</table><p class='empty' style='margin-top:6px;font-size:.88rem'>"+o.tableNote+"</p>";
    },
    legend:function(){return this.runs.map(function(r){return '<li><i style="background:'+r.col+'"></i>'+esc(r.label)+"</li>";}).join("");},
    gopt:function(){
      var k=this.cfg;return '<label><input type="checkbox" id="tan"'+(k.tan?" checked":"")+'> Tangent on the latest run</label>'+
        '<label>at <input type="range" id="tanT" min="0" max="'+o.tmax+'" step="'+(o.tmax/60)+'" value="'+k.tanT+'"'+(k.tan?"":" disabled")+'></label><span id="tanOut"></span>';
    },
    graph:function(){
      var k=this.cfg,last=this.runs[this.runs.length-1],tan=null;
      if(k.tan&&last){var m=o.max*last.k*Math.exp(-last.k*k.tanT);tan={x:k.tanT,y:this.val(k.tanT,last),m:m,span:o.tmax*.3};
        var out=el("tanOut");if(out)out.textContent=Math.round(k.tanT)+" s: gradient = rate = "+m.toFixed(o.rdp)+" "+o.runit;}
      else{var out2=el("tanOut");if(out2)out2.textContent=k.tan?"Run the experiment first":"";}
      plot({xmax:o.tmax,ymax:o.gmax,xt:o.xt,yt:o.yt,yf:o.yf,xl:"Time in s",yl:o.yl,series:this.runs.map(function(r){return {pts:r.data,col:r.col};}),tan:tan});
    }
  };
  return e;
}

var EX=[E1,E2,E3],cur=0,speed=1,last=0,drawnKey="";
function E(){return EX[cur];}
function fmtClock(t){return (t<100?t.toFixed(1):Math.round(t))+"<small>s</small>";}
function refresh(all){
  var e=E();
  el("go").disabled=e.state!=="idle";el("stop").hidden=!e.manual;el("stop").disabled=e.state!=="running";
  el("status").textContent=e.status();
  if(all){el("setup").innerHTML=e.setup();el("gopt").innerHTML=e.gopt();}
  el("table").innerHTML=e.table();el("legend").innerHTML=e.legend();el("legend").hidden=!e.legend();
  e.graph();
}
function show(i){
  cur=i;var e=E();
  el("title").textContent=e.title;el("sub").textContent=e.sub;el("go").textContent=e.go;
  el("vars").innerHTML=e.vars.map(function(v){return "<li>"+v+"</li>";}).join("");
  el("notes").innerHTML=e.notes.map(function(n){return "<details><summary>"+esc(n[0])+"</summary><p>"+esc(n[1])+"</p></details>";}).join("");
  [].forEach.call(el("tabs").children,function(b,n){b.setAttribute("aria-selected",n===i?"true":"false");});
  refresh(true);
}
function frame(ts){
  var dt=Math.min(.1,(ts-last)/1000||0);last=ts;var e=E(),st=e.state,n=e.cur?e.cur.data.length:0;
  e.step(dt*speed);
  c=bx;bx.setTransform(bc.width/640,0,0,bc.height/440,0,0);e.draw();
  el("clock").innerHTML=fmtClock(e.t);
  if(e.state!==st||(e.cur&&e.cur.data.length!==n))refresh(e.state!==st);
  requestAnimationFrame(frame);
}
el("tabs").innerHTML=EX.map(function(s,i){return '<button type="button" role="tab" data-i="'+i+'"><b>'+(i+1)+'. '+esc(s.tab)+'</b><span>'+esc(s.tabsub)+'</span></button>';}).join("");

el("go").addEventListener("click",function(){E().start();refresh(true);});
el("stop").addEventListener("click",function(){E().stop();refresh(true);});
el("reset").addEventListener("click",function(){E().reset();refresh(true);});
el("clear").addEventListener("click",function(){var e=E();e.reset();if(e===E1)e.runs[e.cfg.mode]=[];else{e.runs=[];e.nextCol=0;}refresh(true);});

function fromHash(){var h=location.hash.replace("#",""),i=EX.findIndex(function(s){return s.id===h;});show(i<0?0:i);}
addEventListener("hashchange",fromHash);

addEventListener("resize",size);
fromHash();size();
requestAnimationFrame(frame);
})();
