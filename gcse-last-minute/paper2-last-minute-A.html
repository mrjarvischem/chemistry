<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper 2 last-minute walkthrough A</title>
<style>
:root{--cream:#fbf5e9;--card:#fffdf7;--brown:#5b3a1e;--mid:#8a5a2b;--line:#e2d3b8;--tan:#f1e4cb;--ink:#2e2218;--good:#2f7d4f;--goodbg:#e3f3e8;--bad:#b3402e;--badbg:#fbe6e1;--gold:#c98a1b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:1.15rem;margin:0}header small{display:block;opacity:.85;font-weight:400;font-size:.85rem}
#timer{display:flex;align-items:center;gap:8px}#clock{font:700 1.3rem ui-monospace,Consolas,monospace;background:#3d2612;padding:4px 10px;border-radius:6px;min-width:84px;text-align:center}
#clock.over{background:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--mid);background:var(--tan);color:var(--brown);padding:6px 12px}
button:hover{background:#e9d6b1}header button{background:#fff;border-color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--tan);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;background:var(--card)}nav button.on{background:var(--brown);color:#fff;border-color:var(--brown)}nav button.done::after{content:" ✓";color:var(--good)}nav button.on.done::after{color:#bfe8cd}
main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
h2{color:var(--brown);margin:.2em 0 .3em;font-size:1.45rem}h3{color:var(--brown);margin:0 0 .4em;font-size:1.08rem}
.why{color:var(--mid);margin:0 0 6px}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.pill{background:var(--tan);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--brown)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.key{border-left:6px solid var(--gold)}.key ul,.card ul{margin:.2em 0;padding-left:1.2em}.key li{margin:.25em 0}
.trap{background:#fff3d6;border:1px solid #edd08f;border-radius:8px;padding:8px 12px;margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--tan);color:var(--brown)}
.opts{display:grid;gap:8px;margin:8px 0}.opts button{text-align:left;background:#fff;color:var(--ink);border-color:var(--line);padding:9px 12px}
.opts button.right{background:var(--goodbg);border-color:var(--good)}.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:.95rem;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--tan)}
.step{display:none;border-top:1px dashed var(--line);padding:10px 0}.step.show{display:block}.step:first-of-type{border-top:0}
.step input{font:inherit;width:120px;padding:5px 8px;border:1px solid var(--mid);border-radius:6px;margin-right:6px}
.step.ok input{background:var(--goodbg);border-color:var(--good)}.step.no input{background:var(--badbg);border-color:var(--bad)}
.work{display:none;color:var(--good);margin:6px 0 0;font-weight:600}.step.ok .work,.step.told .work{display:block}.step.told .work{color:var(--mid)}
.mp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.mp input{width:20px;height:20px;margin-top:3px;flex:none}
.hid{display:none}.tag{display:inline-block;background:var(--brown);color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:6px}
.reveal li{color:transparent;background:var(--tan);border-radius:6px;margin:5px 0;padding:2px 6px;cursor:pointer;user-select:none}.reveal li.on{color:inherit;background:none;cursor:default}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.big{font-size:1.05rem;padding:10px 18px;background:var(--brown);color:#fff;border-color:var(--brown)}.big:hover{background:#3d2612}
.score{font-size:1.6rem;font-weight:700;color:var(--brown)}svg{max-width:100%;height:auto;display:block;margin:6px auto}
@media print{nav,#timer,.next{display:none}}

<script>const WT=({
file:'paper2-last-minute-A.html',
title:'Paper 2 last-minute walkthrough A',
sub:'Rates, equilibrium and crude oil · AQA GCSE Chemistry and Trilogy (Higher) · 25 minutes',
tabs:[
{name:'Collision theory',mins:4,why:'Rates is the biggest single topic on Paper 2. It was the final 17-mark question on two of the last six papers.',
 seen:['Jun 22 (17 marks)','Jun 23','Nov 20','Nov 21','Trilogy Jun 22','Trilogy Jun 23 (17 marks)'],
 blocks:[
 {t:'key',title:'Start every answer here',items:[
  'Particles must <b>collide</b> with enough energy to react. The minimum energy needed is the <b>activation energy</b>.',
  'Rate depends on the <b>frequency of collisions</b> and the <b>energy of the collisions</b>.']},
 {t:'tbl',title:'What each change does',head:['Change','Explanation'],rows:[
  ['Higher concentration (or pressure of a gas)','More particles in the same volume, so <b>more frequent collisions</b>'],
  ['Higher temperature','Particles move faster, so more frequent collisions, <b>and</b> more particles have the activation energy, so more of the collisions are successful'],
  ['Larger surface area (smaller pieces, powder)','More particles of the solid are exposed, so more frequent collisions'],
  ['Catalyst','Provides a <b>different reaction pathway with a lower activation energy</b>. It is not used up']]},
 {t:'key',title:'Reading rate curves',items:[
  'Steeper line = faster reaction.',
  'The rate <b>decreases during the reaction</b> because reactant is used up, so its concentration falls and collisions are less frequent.',
  'The line goes <b>horizontal</b> when the reaction has stopped because one reactant has been used up.',
  'Faster conditions with the <b>same amounts</b>: steeper line that levels off at the <b>same height</b>, sooner.',
  'Half the amount of the limiting reactant: levels off at <b>half the height</b>.'],
  trap:'Writing “more collisions”. The mark is for more <b>frequent</b> collisions (or more collisions per second).'}],
 checks:[
 {q:'Why does powdered zinc react faster than lumps of zinc with the same mass?',opts:['The particles have more energy','Powder has a larger surface area so collisions are more frequent','Powder lowers the activation energy','There are more zinc atoms in powder'],a:1,why:'Larger surface area → more frequent collisions.'},
 {q:'Which change makes the reaction SLOWER?',opts:['Adding a catalyst','Using smaller pieces of solid','Using a lower temperature','Using more concentrated acid'],a:2,why:'Slower particles, less frequent and less energetic collisions.'},
 {q:'An experiment is repeated with acid of double the concentration (acid in excess, same mass of solid). The new line on the graph is…',opts:['steeper and levels off higher','steeper and levels off at the same height','less steep and levels off at the same height','identical'],a:1,why:'Faster, but the same mass of solid makes the same amount of product.'}],
 exam:{q:'(a) Explain why increasing the temperature increases the rate of a reaction. [3]<br>(b) Explain how a catalyst increases the rate of a reaction. [2]',
  ms:['particles move faster / have more energy','so collisions are more frequent','more particles have the activation energy / more collisions are successful','provides a different (reaction) pathway','with a lower activation energy']}},

{name:'Rate calculations and tangents',mins:4,why:'“Determine the rate at … seconds by drawing a tangent” is worth 4–5 marks and has come up on five of the last six papers.',
 seen:['Jun 22 (5 marks)','Jun 23 (4 marks)','Nov 21 (5 marks)','Trilogy Jun 22','Trilogy Jun 23 (5 marks)','Nov 20 (mean rate)'],
 blocks:[
 {t:'key',title:'Two kinds of rate',items:[
  '<b>Mean rate</b> = amount of product formed (or reactant used) ÷ time taken.',
  '<b>Rate at a particular time</b> = gradient of the tangent to the curve at that time.',
  'Gradient = change in y ÷ change in x. Make your triangle as big as you can.',
  'Units come from the axes: cm³/s, g/s or mol/s.']},
 {t:'graph',xmax:180,ymax:70,xn:9,yn:7,xl:'Time in s',yl:'Volume of gas in cm³',f:x=>60*(1-Math.exp(-x/60)),tan:[[0,9],[100,60]],at:40,cap:'The red line is the tangent at 40 s. It passes through (0, 9) and (100, 60).'},
 {t:'calc',title:'Rate from a tangent',q:'Use the tangent on the graph to determine the rate of reaction at 40 s.',
  steps:[
  {p:'Change in y (volume) along the tangent.',a:51,tol:0,u:'cm³',show:'60 − 9 = 51 cm³'},
  {p:'Change in x (time) along the tangent.',a:100,tol:0,u:'s',show:'100 − 0 = 100 s'},
  {p:'Gradient = change in y ÷ change in x.',a:0.51,tol:0.001,u:'cm³/s',show:'51 ÷ 100 = 0.51 cm³/s'}]}],
 checks:[
 {q:'36 cm³ of gas is collected in 90 s. What is the mean rate?',opts:['0.4 cm³/s','2.5 cm³/s','3240 cm³/s','0.4 s/cm³'],a:0,why:'36 ÷ 90 = 0.4 cm³/s.'},
 {q:'A student measures the loss in mass every 20 seconds. What is the unit of rate?',opts:['g','s/g','g/s','g/cm³'],a:2,why:'Mass ÷ time.'},
 {q:'Four trials give rates of 0.52, 0.55, 0.41 and 0.55 cm³/s. What is the mean, leaving out the anomalous result?',opts:['0.51','0.54','0.55','0.52'],a:1,why:'Leave out 0.41. (0.52 + 0.55 + 0.55) ÷ 3 = 0.54.'}],
 exam:{q:'A student collects the gas produced in a reaction.<br>(a) 48 cm³ of gas is collected in the first 120 s. Calculate the mean rate of reaction. Give the unit. [2]<br>(b) A tangent drawn to the curve at 30 s passes through the points (10, 20) and (70, 56). Determine the rate of reaction at 30 s. Give your answer to 2 significant figures. [3]',
  ms:['48 ÷ 120 = 0.4','cm³/s','change in y = 36 and change in x = 60','36 ÷ 60','0.60 (cm³/s)']}},

{name:'Equilibrium and Le Chatelier',mins:5,why:'Predicting which way an equilibrium moves is on every paper, and has twice been a six-marker about choosing conditions.',
 seen:['Jun 22 (6 marks)','Jun 23 (13 marks)','Nov 20 (10 marks)','Nov 21 (6 marks)','Trilogy Jun 22','Trilogy Jun 23'],
 blocks:[
 {t:'key',title:'What equilibrium means',items:[
  'In a <b>closed system</b> (nothing can enter or leave), a reversible reaction reaches equilibrium.',
  'The forward and reverse reactions are happening at the <b>same rate</b>, so the concentrations do not change.',
  'If the forward reaction is exothermic, the reverse reaction is endothermic and transfers the same amount of energy.']},
 {t:'key',title:'Le Chatelier: the equilibrium shifts to oppose the change',items:[
  '<b>If T increases</b>, equilibrium shifts to decrease T to oppose the change, so it moves in the <b>endothermic</b> direction.',
  '<b>If T decreases</b>, equilibrium shifts to increase T to oppose the change, so it moves in the <b>exothermic</b> direction.',
  '<b>If P increases</b>, equilibrium shifts to decrease P to oppose the change, so it moves to the side with <b>fewer gas molecules</b>.',
  '<b>If the concentration of a reactant increases</b>, equilibrium shifts to decrease it to oppose the change, so it moves to the <b>right</b> (more product).',
  'Same number of gas molecules on both sides: pressure has <b>no effect</b>.',
  'A catalyst has <b>no effect</b> on the position of equilibrium. It speeds up both directions equally.'],
  trap:'Count gas molecules using the coefficients (big numbers). N₂ + 3H₂ ⇌ 2NH₃ is 4 molecules on the left and 2 on the right.'},
 {t:'key',title:'Choosing conditions in industry (six-mark structure)',items:[
  '<b>Temperature:</b> a low temperature gives a higher yield if the forward reaction is exothermic, but the rate is too slow. So a <b>compromise</b> temperature is used.',
  '<b>Pressure:</b> a high pressure gives a higher yield if there are fewer molecules on the right, and a faster rate. But high pressure is expensive (energy and strong equipment).',
  '<b>Catalyst:</b> increases the rate so less energy is needed. No effect on the yield.']}],
 checks:[
 {q:'N₂(g) + 3H₂(g) ⇌ 2NH₃(g). The pressure is increased. The equilibrium…',opts:['shifts left, yield of ammonia decreases','shifts right, yield of ammonia increases','does not move','shifts right, yield of ammonia decreases'],a:1,why:'If P increases, equilibrium shifts to decrease P, so it moves to the side with fewer molecules (4 → 2), the right.'},
 {q:'The forward reaction for making ammonia is exothermic. The temperature is increased. The yield of ammonia…',opts:['increases','decreases','stays the same','doubles'],a:1,why:'If T increases, equilibrium shifts to decrease T, so it moves in the endothermic direction (left). Less ammonia.'},
 {q:'2NO₂(g) ⇌ N₂O₄(g). NO₂ is brown, N₂O₄ is colourless. The pressure is increased. The mixture becomes…',opts:['darker brown','lighter brown','the same','green'],a:1,why:'Shifts to the side with fewer molecules (right), making more colourless N₂O₄.'},
 {q:'H₂(g) + I₂(g) ⇌ 2HI(g). What is the effect of increasing the pressure on the position of equilibrium?',opts:['Shifts left','Shifts right','No effect, because there are 2 molecules on each side','No effect, because it is not reversible'],a:2,why:'Equal numbers of gas molecules on both sides.'},
 {q:'A ⇌ B. The forward reaction is endothermic. Which change gives more B?',opts:['Lower temperature','Higher temperature','Adding a catalyst','Removing A'],a:1,why:'If T increases, equilibrium shifts to decrease T, so it moves in the endothermic direction, which here is forward.'},
 {q:'Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq). Fe³⁺ is yellow, FeSCN²⁺ is red. More SCN⁻ is added. The mixture becomes…',opts:['more yellow','more red','colourless','unchanged'],a:1,why:'If the concentration of a reactant increases, equilibrium shifts right to decrease it. More red FeSCN²⁺.'}],
 exam:{q:'Methanol is made in a reversible reaction: &nbsp; CO(g) + 2H₂(g) ⇌ CH₃OH(g)<br>The forward reaction is exothermic.<br>(a) Explain the effect of increasing the pressure on the yield of methanol. [2]<br>(b) Explain the effect of increasing the temperature on the yield of methanol. [2]<br>(c) Why does a concentration stay constant at equilibrium? [1]',
  ms:['(equilibrium) shifts to the right / to the side with fewer molecules (3 on the left, 1 on the right)','so the yield of methanol increases','(equilibrium) shifts to the left / in the endothermic direction','so the yield of methanol decreases','the forward and reverse reactions happen at the same rate']}},

{name:'Crude oil, alkanes and cracking',mins:5,why:'Fractional distillation is a regular four-marker, and cracking, combustion equations and bromine water are quick marks around it.',
 seen:['Jun 22 (16 marks)','Nov 21','Nov 20','Trilogy Jun 22','Trilogy Jun 23 (11 marks)'],
 blocks:[
 {t:'model',q:'Explain how crude oil is separated into fractions by fractional distillation. [4]',a:[
  'The crude oil is <b>heated so that it evaporates</b> (vaporises).',
  'The vapours rise up the column, which is <b>hot at the bottom and cooler at the top</b>.',
  'Each vapour <b>condenses</b> when it reaches a level that is at its <b>boiling point</b>.',
  'So fractions with different boiling points are <b>collected at different levels</b> (small molecules near the top).']},
 {t:'key',title:'Alkanes',items:[
  'A <b>hydrocarbon</b> is a compound of hydrogen and carbon <b>only</b>.',
  'Alkanes: general formula C<sub>n</sub>H<sub>2n+2</sub>. Methane CH₄, ethane C₂H₆, propane C₃H₈, butane C₄H₁₀.',
  'Longer chains: <b>higher boiling point, more viscous, less flammable</b>. Bigger molecules have stronger intermolecular forces.',
  'Complete combustion gives carbon dioxide and water: &nbsp; C₃H₈ + 5O₂ → 3CO₂ + 4H₂O',
  'To balance: carbons first, then hydrogens, then count the oxygen atoms and choose the coefficient (big number) for O₂.']},
 {t:'key',title:'Cracking',items:[
  'Cracking breaks long-chain hydrocarbons into <b>shorter, more useful molecules</b> that are in higher demand.',
  'Products: a shorter <b>alkane</b> (for fuels) and an <b>alkene</b> (for making polymers).',
  'Conditions: <b>high temperature and a catalyst</b>, or <b>high temperature and steam</b>.',
  'The atoms must balance: &nbsp; C₁₀H₂₂ → C₈H₁₈ + C₂H₄',
  'Alkenes are C<sub>n</sub>H<sub>2n</sub>. Test: <b>bromine water turns from orange to colourless</b>. With an alkane it stays orange.']}],
 checks:[
 {q:'What is the formula of the alkane with nine carbon atoms?',opts:['C₉H₁₈','C₉H₂₀','C₉H₂₂','C₉H₉'],a:1,why:'2n + 2 = 20.'},
 {q:'C₁₂H₂₆ → C₈H₁₈ + 2 ____',opts:['C₂H₆','C₄H₈','C₂H₄','CH₄'],a:2,why:'12 − 8 = 4 carbons and 26 − 18 = 8 hydrogens, shared between 2 molecules: C₂H₄.'},
 {q:'Which pair would both turn bromine water colourless?',opts:['C₇H₁₆ and C₈H₁₈','C₇H₁₄ and C₈H₁₈','C₇H₁₄ and C₈H₁₆','C₇H₁₆ and C₈H₁₆'],a:2,why:'Both are C<sub>n</sub>H<sub>2n</sub>, so both are alkenes.'}],
 exam:{q:'(a) Explain how crude oil is separated into fractions. [4]<br>(b) Balance the equation for the complete combustion of pentane. [2]<br>C₅H₁₂ + __O₂ → __CO₂ + __H₂O',
  ms:['crude oil is heated / evaporated / vaporised','the column is hotter at the bottom and cooler at the top','vapours condense at their boiling points','so fractions are collected at different levels','5CO₂ and 6H₂O','8O₂']}},

{name:'The rates practical',mins:3,why:'Most rates questions are built around a method. Know the three ways of following a reaction and the usual “suggest why” answers.',
 seen:['Jun 22','Jun 23','Nov 20','Nov 21','Trilogy Jun 22','Trilogy Jun 23'],
 blocks:[
 {t:'tbl',title:'Three ways to follow a reaction',head:['Measure','How','Used for'],rows:[
  ['Volume of gas','Gas syringe, or an upturned measuring cylinder full of water','Metal + acid, carbonate + acid, hydrogen peroxide decomposing'],
  ['Loss in mass','Flask on a balance. The mass falls because the <b>gas escapes</b>','Reactions that give off a gas'],
  ['Time for a cross to disappear','Flask on a cross. Solid sulfur forms and makes the mixture cloudy','Sodium thiosulfate + hydrochloric acid']]},
 {t:'key',title:'Usual “suggest why” answers',items:[
  'Put the bung in quickly: so that no gas escapes before it is measured.',
  'Control variables: volume and concentration of the solutions, temperature, mass and size of any solid.',
  'A larger volume of gas or a longer time has a smaller percentage error, so it is more accurate.',
  'Leave anomalous results out of the mean.',
  '<b>Repeatable:</b> the same person gets similar results with the same method. <b>Reproducible:</b> a different person, or a different method, gets similar results.',
  'The disappearing cross relies on judgement by eye. A light sensor is more accurate.']}],
 checks:[
 {q:'Calcium carbonate reacts with acid in an open flask on a balance. Why does the mass fall?',opts:['The acid evaporates','Carbon dioxide gas escapes','Calcium carbonate dissolves','The flask gets hotter'],a:1,why:'The gas made leaves the flask.'},
 {q:'A student gets similar results when they repeat the experiment the next day using the same method. The results are…',opts:['reproducible','repeatable','anomalous','valid'],a:1,why:'Same person, same method: repeatable.'}],
 exam:{q:'Sodium thiosulfate solution reacts with hydrochloric acid. Solid sulfur is produced and the mixture goes cloudy.<br>Describe how a student could investigate the effect of the concentration of sodium thiosulfate solution on the rate of this reaction. [4]',
  ms:['measure a fixed volume of sodium thiosulfate solution into a flask placed on a cross','add a fixed volume of hydrochloric acid and start a timer','stop the timer when the cross can no longer be seen','repeat with different concentrations of sodium thiosulfate, keeping the volumes and temperature the same']}}
],
quiz:[
{q:'Why does a higher concentration increase the rate?',opts:['Particles have more energy','More frequent collisions','Lower activation energy','Bigger surface area'],a:1,why:'More particles in the same volume.'},
{q:'How does a catalyst work?',opts:['It gives particles more energy','It provides a different pathway with a lower activation energy','It increases the concentration','It increases the yield'],a:1,why:'Lower activation energy pathway.'},
{q:'A tangent passes through (0, 5) and (50, 30). What is the gradient?',opts:['0.5','0.6','2','25'],a:0,why:'(30 − 5) ÷ (50 − 0) = 0.5'},
{q:'Why does the rate fall as a reaction goes on?',opts:['The temperature rises','The catalyst is used up','Reactant concentration falls so collisions are less frequent','The activation energy rises'],a:2,why:'Reactants are used up.'},
{q:'2SO₂(g) + O₂(g) ⇌ 2SO₃(g). The pressure is increased. The equilibrium…',opts:['shifts left','shifts right','does not move','stops'],a:1,why:'3 molecules on the left, 2 on the right. It moves to the side with fewer molecules.'},
{q:'A forward reaction is exothermic. The temperature is lowered. The yield of product…',opts:['increases','decreases','stays the same','becomes zero'],a:0,why:'If T decreases, equilibrium shifts to increase T, so it moves in the exothermic direction (forward).'},
{q:'In a fractionating column, where do the smallest molecules condense?',opts:['At the bottom, where it is hottest','At the top, where it is coolest','In the middle','They do not condense'],a:1,why:'Small molecules have low boiling points.'},
{q:'What are the conditions for cracking?',opts:['Low temperature and a catalyst','High temperature and a catalyst (or steam)','High pressure and yeast','Room temperature and bromine'],a:1,why:'High temperature with a catalyst, or with steam.'}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
