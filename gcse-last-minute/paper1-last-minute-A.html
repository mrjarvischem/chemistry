<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper 1 last-minute walkthrough A</title>
<style>
:root{--cream:#fbf5e9;--card:#fffdf7;--brown:#5b3a1e;--mid:#8a5a2b;--line:#e2d3b8;--tan:#f1e4cb;--ink:#2e2218;--good:#2f7d4f;--goodbg:#e3f3e8;--bad:#b3402e;--badbg:#fbe6e1;--gold:#c98a1b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:1.15rem;margin:0}header small{display:block;opacity:.85;font-weight:400;font-size:.85rem}
#timer{display:flex;align-items:center;gap:8px}#clock{font:700 1.3rem ui-monospace,Consolas,monospace;background:#3d2612;padding:4px 10px;border-radius:6px;min-width:84px;text-align:center}
#clock.over{background:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--mid);background:var(--tan);color:var(--brown);padding:6px 12px}
button:hover{background:#e9d6b1}header button{background:#fff;border-color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--tan);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;background:var(--card)}nav button.on{background:var(--brown);color:#fff;border-color:var(--brown)}nav button.done::after{content:" ✓";color:var(--good)}nav button.on.done::after{color:#bfe8cd}
main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
h2{color:var(--brown);margin:.2em 0 .3em;font-size:1.45rem}h3{color:var(--brown);margin:0 0 .4em;font-size:1.08rem}
.why{color:var(--mid);margin:0 0 6px}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.pill{background:var(--tan);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--brown)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.key{border-left:6px solid var(--gold)}.key ul,.card ul{margin:.2em 0;padding-left:1.2em}.key li{margin:.25em 0}
.trap{background:#fff3d6;border:1px solid #edd08f;border-radius:8px;padding:8px 12px;margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--tan);color:var(--brown)}
.opts{display:grid;gap:8px;margin:8px 0}.opts button{text-align:left;background:#fff;color:var(--ink);border-color:var(--line);padding:9px 12px}
.opts button.right{background:var(--goodbg);border-color:var(--good)}.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:.95rem;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--tan)}
.step{display:none;border-top:1px dashed var(--line);padding:10px 0}.step.show{display:block}.step:first-of-type{border-top:0}
.step input{font:inherit;width:120px;padding:5px 8px;border:1px solid var(--mid);border-radius:6px;margin-right:6px}
.step.ok input{background:var(--goodbg);border-color:var(--good)}.step.no input{background:var(--badbg);border-color:var(--bad)}
.work{display:none;color:var(--good);margin:6px 0 0;font-weight:600}.step.ok .work,.step.told .work{display:block}.step.told .work{color:var(--mid)}
.mp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.mp input{width:20px;height:20px;margin-top:3px;flex:none}
.hid{display:none}.tag{display:inline-block;background:var(--brown);color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:6px}
.reveal li{color:transparent;background:var(--tan);border-radius:6px;margin:5px 0;padding:2px 6px;cursor:pointer;user-select:none}.reveal li.on{color:inherit;background:none;cursor:default}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.big{font-size:1.05rem;padding:10px 18px;background:var(--brown);color:#fff;border-color:var(--brown)}.big:hover{background:#3d2612}
.score{font-size:1.6rem;font-weight:700;color:var(--brown)}svg{max-width:100%;height:auto;display:block;margin:6px auto}
@media print{nav,#timer,.next{display:none}}
</style></head><body>
<header><h1 id="ttl"></h1><div id="timer"><span id="clock">25:00</span><button id="go">Start</button></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>const WT=({
file:'paper1-last-minute-A.html',
title:'Paper 1 last-minute walkthrough A',
sub:'Atoms, bonding and the periodic table · AQA GCSE Chemistry and Trilogy (Higher) · 25 minutes',
tabs:[
{name:'Isotopes and relative atomic mass',mins:4,why:'The relative atomic mass calculation has come up on four of the last five Paper 1s. It is 2–3 easy marks.',
 seen:['Jun 22','Jun 23','Nov 21','Nov 20','Jun 24 (isotopes)'],
 blocks:[
 {t:'key',title:'Learn these word for word',items:[
  '<b>Isotopes</b> are atoms of the same element with the <b>same number of protons</b> but <b>different numbers of neutrons</b>.',
  'Protons = atomic number (small number). Electrons = protons. Neutrons = mass number − atomic number.',
  '<b>Plum pudding model:</b> a ball of positive charge with negative electrons embedded in it. No nucleus, no empty space.',
  '<b>Nuclear model:</b> mass and positive charge are concentrated in a tiny nucleus; most of the atom is empty space; electrons orbit the nucleus.',
  '<b>Bohr:</b> electrons orbit the nucleus at specific distances (in shells / energy levels). <b>Chadwick:</b> showed neutrons exist.',
  'Order of discovery: electron → proton → neutron.'],
  trap:'Do not mention electrons when you define isotopes. The marks are for protons and neutrons.'},
 {t:'calc',title:'Relative atomic mass',q:'Copper has two isotopes. 69% of copper atoms have mass number 63 and 31% have mass number 65. Calculate the relative atomic mass of copper to 1 decimal place.',
  steps:[
  {p:'Multiply the first mass number by its percentage: 63 × 69',a:4347,tol:0,show:'63 × 69 = 4347'},
  {p:'Do the same for the second isotope: 65 × 31',a:2015,tol:0,show:'65 × 31 = 2015'},
  {p:'Add them together.',a:6362,tol:0,show:'4347 + 2015 = 6362'},
  {p:'Divide by 100 and give your answer to 1 decimal place.',a:63.6,tol:0.001,show:'6362 ÷ 100 = 63.62 = 63.6 (1 d.p.)'}]}],
 checks:[
 {q:'An atom of potassium has atomic number 19 and mass number 39. How many neutrons does it have?',opts:['19','20','39','58'],a:1,why:'39 − 19 = 20 neutrons.'},
 {q:'Which statement is true for the nuclear model but not the plum pudding model?',opts:['The atom contains electrons','The atom has no overall charge','Most of the atom is empty space','The atom contains positive charge'],a:2,why:'Both models have electrons, positive charge and no overall charge. Only the nuclear model has empty space and a nucleus.'},
 {q:'Why did Mendeleev swap the order of some pairs of elements?',opts:['To put them in order of atomic number','So elements with similar properties were in the same group','Because their atomic weights had been measured wrongly','To leave gaps for the noble gases'],a:1,why:'Protons had not been discovered, so it cannot be atomic number. He placed elements in groups with similar properties.'}],
 exam:{q:'Boron has two isotopes. 20% of boron atoms have mass number 10 and 80% have mass number 11.<br>(a) Give the meaning of ‘isotopes’. [2]<br>(b) Calculate the relative atomic mass of boron to 1 decimal place. [2]',
  ms:['atoms (of the same element) with the same number of protons','with different numbers of neutrons','(10 × 20) + (11 × 80) = 1080','÷ 100 = 10.8']}},

{name:'Ionic bonding',mins:5,why:'“Describe what happens when a metal atom reacts with a non-metal atom” is a regular 4-marker. So is “explain why it has a high melting point”.',
 seen:['Jun 22','Nov 21','Jun 24','Nov 20 (6 marks)'],
 blocks:[
 {t:'model',q:'Describe what happens when magnesium reacts with chlorine to form magnesium chloride. Answer in terms of electrons. [4]',a:[
  'Each magnesium atom <b>loses two</b> electrons.',
  'Each chlorine atom <b>gains one</b> electron.',
  'So <b>one</b> magnesium atom reacts with <b>two</b> chlorine atoms (electrons are transferred from magnesium to chlorine).',
  'Mg²⁺ ions and Cl⁻ ions are formed (both with full outer shells).']},
 {t:'key',title:'Properties of ionic compounds',items:[
  '<b>Structure:</b> a giant ionic lattice.',
  '<b>High melting point:</b> there are strong electrostatic forces of attraction between oppositely charged ions, acting in all directions. A large amount of energy is needed to overcome them.',
  '<b>Solid does not conduct:</b> the ions are in fixed positions and cannot move.',
  '<b>Molten or dissolved does conduct:</b> the ions are free to move and carry charge.',
  'Ion charges: Group 1 → 1+, Group 2 → 2+, Group 3 → 3+, Group 6 → 2−, Group 7 → 1−.'],
  trap:'Writing “electrons move” for an ionic compound, or “intermolecular forces”. Ionic compounds have ions and no molecules.'}],
 checks:[
 {q:'Gallium is in Group 3. What is the most likely formula of a gallium ion?',opts:['Ga⁺','Ga³⁺','Ga³⁻','Ga⁵⁺'],a:1,why:'Group 3 metals lose three outer electrons to form 3+ ions.'},
 {q:'Why can solid calcium chloride not be electrolysed?',opts:['It has no ions','Its electrons cannot move','Its ions cannot move','Its covalent bonds are too strong'],a:2,why:'In the solid the ions are in fixed positions.'},
 {q:'How many potassium atoms react with one oxygen atom to make potassium oxide?',opts:['1','2','3','4'],a:1,why:'Oxygen needs to gain 2 electrons. Each potassium atom loses 1, so 2 are needed: K₂O.'}],
 exam:{q:'Lithium reacts with oxygen to form lithium oxide, Li₂O.<br>(a) Describe what happens when lithium atoms react with an oxygen atom. Answer in terms of electrons. [4]<br>(b) Explain why lithium oxide has a high melting point. [3]',
  ms:['each lithium atom loses one electron','each oxygen atom gains two electrons','two lithium atoms react with one oxygen atom','Li⁺ and O²⁻ ions are formed','giant (ionic) lattice / giant structure','strong electrostatic forces of attraction between oppositely charged ions','large amount of energy needed to overcome the forces']}},

{name:'Simple molecules and giant covalent',mins:5,why:'Every paper asks you to explain a property using structure and bonding. Decide first: small molecules or giant structure?',
 seen:['Jun 22 (diamond)','Nov 21 (graphite, 6 marks)','Jun 23','Jun 24','Nov 20 (6 marks)'],
 blocks:[
 {t:'tbl',title:'Which structure is it?',head:['','Simple molecules (CO₂, H₂O, CH₄, Cl₂)','Giant covalent (diamond, graphite, SiO₂)'],rows:[
  ['What holds it together','Strong covalent bonds inside each molecule, but <b>weak intermolecular forces between molecules</b>','Every atom joined to others by <b>strong covalent bonds</b> in a giant structure'],
  ['Melting / boiling point','Low: little energy is needed','Very high: a lot of energy is needed to break the many strong covalent bonds'],
  ['Conducts?','No: molecules have no overall charge','No, except graphite']]},
 {t:'key',title:'Phrases that get the marks',items:[
  'Simple molecules: intermolecular forces are <b>overcome when the substance melts</b> and <b>broken when it boils</b>. The covalent bonds are not broken.',
  'Bigger molecules have stronger intermolecular forces, so boiling point rises (down Group 7; polymers are solids).',
  '<b>Diamond:</b> each carbon atom forms <b>four</b> covalent bonds. No delocalised electrons, so it does not conduct. Very hard.',
  '<b>Graphite:</b> each carbon atom forms <b>three</b> covalent bonds, making layers of hexagonal rings. One <b>delocalised electron</b> per carbon atom moves through the structure and carries charge, so it conducts.',
  'Graphite is soft and slippery: there are <b>no covalent bonds between the layers</b> (only weak forces), so the layers slide over each other.',
  'Fullerenes (C₆₀) are hollow, so they can carry drugs around the body. Graphene is a single layer of graphite.'],
  trap:'Saying “weak covalent bonds” for a low boiling point. Covalent bonds are always strong. It is the forces between molecules that are weak.'}],
 checks:[
 {q:'Propane is a gas at room temperature. Why does it have a low boiling point?',opts:['The covalent bonds are weak','The intermolecular forces are weak','The ionic bonds are weak','It has delocalised electrons'],a:1,why:'Small molecules, weak intermolecular forces, little energy needed to overcome them.'},
 {q:'Which two substances have intermolecular forces between their particles?',opts:['Diamond and water','Sodium chloride and magnesium','Water and poly(ethene)','Silicon dioxide and water'],a:2,why:'Water and poly(ethene) are both made of molecules. The others are giant covalent, ionic or metallic.'},
 {q:'Why does the boiling point of the halogens increase down Group 7?',opts:['The covalent bonds get stronger','The molecules get bigger so intermolecular forces get stronger','The atoms gain more electrons','The molecules become ionic'],a:1,why:'Bigger molecules → stronger intermolecular forces → more energy needed.'}],
 exam:{q:'Diamond and graphite are both made only of carbon atoms.<br>Explain why graphite conducts electricity and is soft, but diamond does not conduct electricity and is very hard. [6]',
  ms:['graphite: each carbon atom forms three covalent bonds','so there is one delocalised electron per carbon atom','delocalised electrons move through the structure / carry charge','graphite has layers with no covalent bonds (only weak forces) between them, so the layers slide','diamond: each carbon atom forms four covalent bonds, so there are no delocalised electrons','diamond is a giant structure of strong covalent bonds that need a lot of energy to break / are hard to break']}},

{name:'Metals and alloys',mins:3,why:'Two short explanations that repeat almost every year: how metals conduct, and why alloys are harder.',
 seen:['Jun 22','Jun 23','Nov 21','Jun 24'],
 blocks:[
 {t:'model',q:'Describe how metals conduct electricity. [3]',a:['Metals contain <b>delocalised electrons</b>.','The electrons are free to <b>move through the whole structure</b>.','The moving electrons <b>carry electrical charge</b>.']},
 {t:'model',q:'Explain why alloys are harder than pure metals. [3]',a:['The alloy contains atoms of <b>different sizes</b>.','These <b>distort the layers</b> of atoms.','So the layers <b>cannot slide</b> over each other easily.']},
 {t:'key',title:'Also worth knowing',items:[
  'Metallic structure: a giant structure of positive ions in regular layers, with delocalised outer-shell electrons.',
  'Pure metals are soft because the layers of atoms slide over each other.',
  'Metals conduct thermal energy because energy is transferred by the delocalised electrons.',
  'High melting points: strong metallic bonds (attraction between positive ions and delocalised electrons).']}],
 checks:[
 {q:'Substance X melts at 1535 °C and conducts electricity when solid and when liquid. What is X?',opts:['A simple molecular substance','An ionic compound','A metal','A giant covalent substance'],a:2,why:'Only metals (and graphite) conduct when solid. Ionic compounds conduct only when molten or dissolved.'},
 {q:'Which particles carry the charge when a metal conducts electricity?',opts:['Positive ions','Delocalised electrons','Negative ions','Protons'],a:1,why:'Delocalised electrons move through the structure.'}],
 exam:{q:'Bronze is an alloy of copper and tin.<br>(a) Describe how copper conducts electricity. [3]<br>(b) Explain why bronze is harder than pure copper. [3]',
  ms:['delocalised electrons','(electrons) move through the (whole) structure','(electrons) carry (electrical) charge','tin atoms are a different size from copper atoms','so the layers are distorted','so the layers cannot slide (easily)']}},

{name:'Group 1, Group 7 and Group 0',mins:4,why:'“Explain the trend in reactivity” is a 3–4 mark question that appears most years, usually with an equation to balance.',
 seen:['Jun 22','Nov 21','Nov 20','Jun 23','Jun 24'],
 blocks:[
 {t:'tbl',title:'Reactivity trends: the same three ideas, opposite endings',head:['','Group 1: MORE reactive going down','Group 7: LESS reactive going down'],rows:[
  ['1','Outer electron is further from the nucleus (more shells)','Outer shell is further from the nucleus (more shells)'],
  ['2','More shielding, so weaker attraction between the nucleus and the outer electron','More shielding, so weaker attraction between the nucleus and an incoming electron'],
  ['3','The outer electron is <b>lost more easily</b>','An electron is <b>gained less easily</b>']]},
 {t:'key',title:'Facts to grab',items:[
  'Group 1 metal + water: floats, moves around, fizzes (effervescence), melts into a ball, gets smaller. Potassium burns with a lilac flame.',
  'Equation: 2K + 2H₂O → 2KOH + H₂. The coefficient (big number) 2 goes in front of K, H₂O and KOH. The solution is alkaline (OH⁻ ions).',
  'Group 7: a more reactive halogen displaces a less reactive halogen from a solution of its salt. Chlorine displaces bromine and iodine.',
  'Group 0: atoms have full outer shells, so they are stable and do not gain, lose or share electrons. Boiling points increase down the group.',
  'Elements in the same group have the same number of outer shell electrons, so they react in similar ways.']}],
 checks:[
 {q:'Which pair of solutions will react?',opts:['Bromine and potassium chloride','Iodine and potassium bromide','Chlorine and potassium bromide','Bromine and potassium fluoride'],a:2,why:'Chlorine is more reactive than bromine, so it displaces bromine from potassium bromide.'},
 {q:'What is the coefficient (big number) in front of H₂O when this is balanced?  __Na + __H₂O → __NaOH + H₂',opts:['1','2','3','4'],a:1,why:'2Na + 2H₂O → 2NaOH + H₂'},
 {q:'Why does argon not form compounds?',opts:['It has 8 protons','It has a full outer shell so is stable','It is a gas','It has weak intermolecular forces'],a:1,why:'A full outer shell means no tendency to gain, lose or share electrons.'}],
 exam:{q:'(a) Explain why potassium is more reactive than sodium. [3]<br>(b) Complete and balance the equation for the reaction of lithium with water. [2]<br>__Li + __H₂O → ______ + ______',
  ms:['potassium’s outer electron is further from the nucleus / potassium has more shells','so there is less attraction between the nucleus and the outer electron / more shielding','so the outer electron is lost more easily','products LiOH and H₂','correctly balanced: 2Li + 2H₂O → 2LiOH + H₂']}}
],
quiz:[
{q:'Isotopes of an element have the same number of…',opts:['neutrons','protons','neutrons and protons','mass number'],a:1,why:'Same protons, different neutrons.'},
{q:'Element Z has isotopes of mass 20 (90%) and 22 (10%). What is its relative atomic mass?',opts:['20.2','21.0','20.0','21.8'],a:0,why:'(20×90 + 22×10) ÷ 100 = 20.2'},
{q:'When calcium reacts with chlorine, each calcium atom…',opts:['gains two electrons','loses one electron','loses two electrons','shares two electrons'],a:2,why:'Group 2: loses two electrons to form Ca²⁺.'},
{q:'Why does sodium chloride conduct electricity when molten?',opts:['Electrons are free to move','Ions are free to move','Molecules are free to move','Atoms are free to move'],a:1,why:'Ions carry the charge in ionic compounds.'},
{q:'Each carbon atom in graphite is bonded to how many other carbon atoms?',opts:['2','3','4','6'],a:1,why:'Three bonds, leaving one delocalised electron per atom.'},
{q:'Why is methane a gas at room temperature?',opts:['Weak covalent bonds','Weak intermolecular forces','Weak ionic bonds','Weak metallic bonds'],a:1,why:'Little energy is needed to overcome weak intermolecular forces.'},
{q:'Why are alloys harder than pure metals?',opts:['They have more delocalised electrons','Different sized atoms distort the layers so they cannot slide','They have stronger covalent bonds','They have a higher density'],a:1,why:'Distorted layers cannot slide easily.'},
{q:'Going down Group 7, the elements become…',opts:['more reactive, lower boiling point','more reactive, higher boiling point','less reactive, lower boiling point','less reactive, higher boiling point'],a:3,why:'Less reactive (gain electrons less easily) and higher boiling point (bigger molecules).'}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
