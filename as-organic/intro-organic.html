<style>

}

  --accent:#55b8bd; --accent-ink:#0b1417; --accent-soft:#143338;
  --amber:#e2a54a; --amber-soft:#2e2412;
  --ok:#72c58a; --ok-soft:#163423; --bad:#f08f84; --bad-soft:#3a1d1a; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f171b; --surface:#162127; --ink:#e4ebe9; --muted:#9aabb0; --line:#2a3a42;
  --accent:#55b8bd; --accent-ink:#0b1417; --accent-soft:#143338;
  --amber:#e2a54a; --amber-soft:#2e2412;

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 80px}
header.top{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;padding-bottom:22px;border-bottom:2px solid var(--ink)}
.kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;margin-top:28px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail .grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 4px 10px}
nav.rail .grp:first-child{margin-top:0}
nav.rail button{all:unset;cursor:pointer;display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;font-size:15px;line-height:1.3}
nav.rail button:hover{background:var(--accent-soft)}

nav.rail button.on{background:var(--ink);color:var(--paper)}
nav.rail .n{font-family:var(--f-chem);font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;opacity:.75}

.opt:hover:not([disabled]){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .let{font-family:var(--f-chem);font-weight:600;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--muted);font-size:13px;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

.opt.right{border-color:var(--ok);background:var(--ok-soft)}

.opt.faded{opacity:.5}
.opt .fb{grid-column:2;font-size:15px;margin-top:4px}
.opt.wrong .fb{color:var(--bad)}

.next{all:unset;cursor:pointer;margin-top:18px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 18px;border-radius:6px;font-size:16px}

.next:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ghost{all:unset;cursor:pointer;padding:8px 14px;border:1.5px solid var(--line);border-radius:6px;font-size:15px}
.ghost:hover{border-color:var(--accent)}
.ghost:focus-visible{outline:2px solid var(--accent)}
.finish{margin-top:36px;padding:18px;border-radius:8px;background:var(--accent-soft)}
.finish h3{margin:0 0 6px;font-family:var(--f-display);font-size:22px}

figure{margin:0 0 14px}
figure svg{width:100%;max-width:560px;height:auto;display:block}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.mols{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px}
.mols figure{margin:0;flex:0 1 220px;min-width:0}
.mols svg{width:100%;max-width:230px;height:auto;display:block}
.mols figcaption{text-align:center;margin-top:0}
.mols .join{font-family:var(--f-chem);font-size:24px;color:var(--muted);text-align:center}
.mols .join small{display:block;font-family:var(--f-body);font-size:12px;color:var(--amber);font-weight:700}
.smi{margin:0 0 14px}
.smi svg{width:100%;max-width:260px;height:auto;max-height:170px;display:block}
.irf{margin:0 0 14px}
.irf svg{width:100%;max-width:560px;height:auto;display:block}
.bonds{display:flex;flex-direction:column;gap:8px;margin:0 0 14px}
.bonds .row{display:grid;grid-template-columns:54px 1fr 70px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bonds .row b{font-family:var(--f-chem)}
.bonds .track{height:18px;background:var(--line);border-radius:3px;overflow:hidden}
.bonds .track i{display:block;height:100%;background:var(--accent)}
.bonds .row span{font-size:14px;color:var(--muted);text-align:right}

.home .lead{font-size:19px;max-width:62ch}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin:24px 0}
.how div{border-top:2px solid var(--ink);padding-top:10px}
.how h4{margin:0 0 4px;font-family:var(--f-display);font-size:18px}
.how p{margin:0;font-size:15px;color:var(--muted)}
.res{width:100%;min-width:420px}
.res td.num{font-variant-numeric:tabular-nums;font-weight:400}
.bankgrp{margin-top:26px}
.bankgrp h3{font-family:var(--f-display);font-size:20px;margin:0 0 10px}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr);gap:18px}

  nav.rail .grp{display:none}
  nav.rail button{grid-template-columns:22px auto;white-space:nowrap;border:1.5px solid var(--line)}
  nav.rail .st{display:none}
  body{font-size:16px}
}

<script src="https://cdn.jsdelivr.net/npm/smiles-drawer@2.1.7/dist/smiles-drawer.min.js"></script>
<script>
/* ---------- formula formatting ---------- */
function fmtF(t){
  let out='', i=0;
  const m=t.match(/^(\d+½|\d+\.\d+|\d+|½|n)(?=[A-Z(•\[])/);
  if(m){ out+='<span class="co">'+m[1]+'</span>'; i=m[1].length; }
  while(i<t.length){
    const c=t[i];
    if(c==='^'){ i++; let ch=''; while(i<t.length && /[0-9+\-−]/.test(t[i])){ ch+= t[i]==='-'?'−':t[i]; i++; } out+='<sup>'+ch+'</sup>'; continue; }
    if(/\d/.test(c) && i>0 && /[A-Za-z)\]]/.test(t[i-1])){ let d=''; while(i<t.length && /\d/.test(t[i])){ d+=t[i]; i++; } out+='<sub>'+d+'</sub>'; continue; }
    if(c==='n' && t[i-1]===']'){ out+='<sub>n</sub>'; i++; continue; }
    if(c==='•'){ out+='<span class="rad">•</span>'; i++; continue; }
    out+=c; i++;
  }
  return out;
}
function fmtEq(s){
  return s.trim().split(/\s+/).map(t=> (t==='+'||t==='→'||t==='⇌') ? '<span class="op">'+t+'</span>' : fmtF(t)).join(' ');
}
function rich(s){ return s.replace(/\[\[(.+?)\]\]/g,(_,m)=>'<span class="chem">'+fmtEq(m)+'</span>'); }

/* ---------- content ---------- */
const L=(h,...b)=>({k:'learn',h,b});
const Q=(q,o,why,fig)=>({k:'check',q,o,why,fig});

const SECTIONS=[
{id:'formulae',grp:'Representing molecules',short:'Types of formula',title:'Types of formula',spec:'3.3.1.1',
 intro:'Six ways of writing the same molecule, and when each one is used.',
 steps:[
 L('Six types of formula',
  `The same molecule can be written in several ways. Here they are for butan-1-ol:`,
  {table:{head:['Type','What it shows','Butan-1-ol'],rows:[
   ['Molecular','The actual number of atoms of each element','[[C4H10O]]'],
   ['Empirical','The simplest whole-number ratio of atoms','[[C4H10O]] (already the simplest ratio)'],
   ['General','The formula for a whole homologous series','C<sub>n</sub>H<sub>2n+1</sub>OH'],
   ['Structural','The arrangement of atoms, carbon by carbon, without drawing every bond','[[CH3CH2CH2CH2OH]]'],
   ['Displayed','Every atom and every bond drawn out','(see below)'],
   ['Skeletal','Carbon chain as zigzag lines; C and H on carbons not shown','(see below)']]}},
  {smi:'CCCCO',cap:'Skeletal formula of butan-1-ol',alt:'CH3CH2CH2CH2OH'},
  `In a <strong>skeletal formula</strong>, every end of a line and every corner is a carbon atom. Each carbon has enough H atoms to make four bonds. Atoms other than C and H (and H atoms attached to them, as in OH) are always written in.`),
 Q(`What is the empirical formula of butane, [[C4H10]]?`,[
  [`[[C2H5]]`,true,`Correct. Divide 4 and 10 by 2.`],
  [`[[C4H10]]`,false,`That is the molecular formula. The ratio 4 : 10 can be simplified.`],
  [`[[CH3CH2CH2CH3]]`,false,`That is the structural formula.`],
  [`C<sub>n</sub>H<sub>2n+2</sub>`,false,`That is the general formula for all alkanes.`]],
  `Empirical = simplest whole-number ratio.`),
 Q(`How many carbon atoms are in this molecule?`,[
  [`5`,true,`Correct. Count the line ends and corners: there are five.`],
  [`4`,false,`Remember that both ends of the zigzag are carbon atoms, as well as every corner.`],
  [`3`,false,`Every corner counts as a carbon, and so does each line end.`],
  [`6`,false,`The O is part of the OH group, not a carbon.`]],
  `Every line end and every corner is a carbon.`,{smi:'CCCCCO',alt:'CH3CH2CH2CH2CH2OH'}),
 Q(`Which of these is a structural formula of propan-2-ol?`,[
  [`[[CH3CH(OH)CH3]]`,true,`Correct. It shows which carbon carries the OH group without drawing every bond.`],
  [`[[C3H8O]]`,false,`That is the molecular formula. It does not show where the OH is.`],
  [`[[CH3CH2CH2OH]]`,false,`That is propan-1-ol: the OH is on the end carbon.`],
  [`C<sub>n</sub>H<sub>2n+1</sub>OH`,false,`That is the general formula for alcohols.`]],
  `Structural formulae show the arrangement, carbon by carbon.`)
 ]},

{id:'groups',grp:'Representing molecules',short:'Functional groups',title:'Functional groups and homologous series',spec:'3.3.1.1',
 intro:'The group of atoms that decides how a molecule reacts.',
 steps:[
 L('Homologous series',
  `A <strong>homologous series</strong> is a family of compounds that:`,
  `<ul><li>have the same <strong>general formula</strong></li><li>have the same <strong>functional group</strong></li><li>have similar <strong>chemical</strong> properties</li><li>show a gradual trend in <strong>physical</strong> properties, such as boiling point</li><li>differ from the next member by <strong>CH<sub>2</sub></strong>.</li></ul>`,
  `A <strong>functional group</strong> is the group of atoms responsible for the characteristic reactions of a compound.`),
 L('The Year 1 functional groups',
  {table:{head:['Homologous series','Functional group','Name ending or prefix','Example'],rows:[
   ['Alkane','C–C only','-ane','propane'],
   ['Alkene','C=C','-ene','propene'],
   ['Halogenoalkane','C–X (X = F, Cl, Br, I)','prefix fluoro-, chloro-, bromo-, iodo-','1-bromopropane'],
   ['Alcohol','–OH','-ol','propan-1-ol'],
   ['Aldehyde','–CHO (C=O at the end of a chain)','-al','propanal'],
   ['Ketone','C=O in the middle of a chain','-one','propanone'],
   ['Carboxylic acid','–COOH','-oic acid','propanoic acid'],
   ['Nitrile','–C≡N','-nitrile','propanenitrile'],
   ['Amine','–NH₂','-amine','propylamine']]}},
  {tip:`Aldehydes and ketones both contain C=O. The difference is position: an aldehyde's C=O is at the <strong>end</strong> of the chain (the carbon also has an H). A ketone's C=O has a carbon on <strong>both sides</strong>.`,t:'Commonly confused'},
  {smi:'CCC=O',cap:'propanal (aldehyde)',alt:'CH3CH2CHO'},
  {smi:'CC(=O)C',cap:'propanone (ketone)',alt:'CH3COCH3'}),
 Q(`Which homologous series does [[CH3CH2COOH]] belong to?`,[
  [`Carboxylic acids`,true,`Correct. –COOH is the carboxylic acid group.`],
  [`Alcohols`,false,`It contains an OH, but the OH is on a C=O carbon. Together C=O and OH make –COOH, a carboxylic acid.`],
  [`Aldehydes`,false,`Aldehydes are –CHO. Here the C=O carbon has an OH instead of an H.`],
  [`Ketones`,false,`A ketone's C=O has a carbon on each side. Here the C=O is at the end of the chain.`]],
  `–COOH = carboxylic acid.`),
 Q(`Which group is shown in this skeletal formula?`,[
  [`Ketone`,true,`Correct. The C=O carbon has a carbon on each side.`],
  [`Aldehyde`,false,`An aldehyde's C=O is at the end of the chain. Here it is in the middle.`],
  [`Carboxylic acid`,false,`There is no OH on the C=O carbon.`],
  [`Alcohol`,false,`There is no OH group: the O is double bonded to carbon.`]],
  `C=O in the middle = ketone.`,{smi:'CCC(=O)CC',alt:'CH3CH2COCH2CH3'}),
 Q(`Members of a homologous series have similar <em>chemical</em> properties because they…`,[
  [`have the same functional group`,true,`Correct. The functional group decides the reactions.`],
  [`have the same boiling point`,false,`Boiling points change gradually along a series. That is a physical property.`],
  [`have the same molecular formula`,false,`Each member has a different molecular formula, differing by CH<sub>2</sub>.`],
  [`have the same number of carbon atoms`,false,`Each member has one more carbon than the one before.`]],
  `Same functional group → same reactions.`)
 ]},

{id:'naming',grp:'Naming',short:'IUPAC naming rules',title:'Naming organic compounds',spec:'3.3.1.1',
 intro:'The rules that turn a structure into a name, step by step.',
 steps:[
 L('Stems: counting the chain',
  {table:{head:['Carbons','1','2','3','4','5','6'],rows:[
   ['Stem','meth','eth','prop','but','pent','hex']]}},
  `Side branches use the same stems with -yl: methyl (CH<sub>3</sub>–), ethyl (C<sub>2</sub>H<sub>5</sub>–), propyl (C<sub>3</sub>H<sub>7</sub>–).`),
 L('The naming method',
  `<ol><li>Find the <strong>longest carbon chain</strong> that contains the functional group. This gives the stem.</li><li>Find the <strong>main functional group</strong>: it gives the suffix (ending).</li><li>Number the chain from the end that gives the main functional group the <strong>lowest number</strong>. If there is no suffix group, give the substituents the lowest numbers.</li><li>Add substituents as prefixes, in <strong>alphabetical order</strong>, each with its number.</li><li>Use di-, tri-, tetra- for repeated substituents, with a number for each.</li></ol>`,
  `Punctuation: commas between numbers (2,3-), hyphens between numbers and letters (2-methyl).`,
  {table:{head:['Structure','Name','Why'],rows:[
   ['[[CH3CH(CH3)CH2CH3]]','2-methylbutane','Longest chain is 4 C; methyl on C2 from the nearer end'],
   ['[[CH3CHBrCH(CH3)CH3]]','2-bromo-3-methylbutane','Bromo before methyl (alphabetical); numbers 2,3 either way, so first in the alphabet gets the lower number'],
   ['[[CH3CH2CH(OH)CH3]]','butan-2-ol','OH gets the lowest number: 2, not 3'],
   ['[[CH3C(CH3)2CH3]]','2,2-dimethylpropane','Two methyls on C2: write 2,2-di']]}},
  {tip:`Alphabetical order ignores di-, tri- and tetra-. So 2,2-dimethyl comes after 1-bromo, and "ethyl" comes before "methyl".`,t:'Common mistake'}),
 Q(`Name [[CH3CH2CH(CH3)CH3]].`,[
  [`2-methylbutane`,true,`Correct. Four-carbon chain, methyl on carbon 2 counting from the right.`],
  [`3-methylbutane`,false,`Number from the end nearer the branch, so the methyl is on carbon 2.`],
  [`pentane`,false,`It has five carbons, but they are not in one straight chain. The longest chain is four.`],
  [`1,1-dimethylpropane`,false,`A methyl on carbon 1 would just extend the chain. Always find the longest chain first.`]],
  `Longest chain, then lowest number for the branch.`),
 L('Choosing the suffix',
  `When a molecule has more than one functional group, one group gives the suffix and the others become prefixes. For Year 1, the order is:`,
  `<p class="chem" style="white-space:normal">carboxylic acid &gt; aldehyde &gt; ketone &gt; alcohol &gt; alkene</p>`,
  `Halogens are <strong>always</strong> prefixes. A group used as a prefix: OH becomes <strong>hydroxy-</strong>.`,
  {table:{head:['Structure','Name'],rows:[
   ['[[CH2ClCH2CH2OH]]','3-chloropropan-1-ol'],
   ['[[CH3CH(OH)COOH]]','2-hydroxypropanoic acid'],
   ['[[CH2=CHCH2OH]]','prop-2-en-1-ol']]}},
  `With a suffix group that must be at the end of a chain (–CHO, –COOH, –CN), that carbon is always carbon 1, so no number is needed: propanal, propanoic acid.`),
 Q(`Name [[CH3CHClCH2COOH]].`,[
  [`3-chlorobutanoic acid`,true,`Correct. The COOH carbon is carbon 1, so Cl is on carbon 3.`],
  [`2-chlorobutanoic acid`,false,`Count from the COOH carbon, which is carbon 1. The Cl is on carbon 3.`],
  [`3-chlorobutan-1-oic acid`,false,`COOH must be on carbon 1, so the 1 is never written.`],
  [`2-chloropropanoic acid`,false,`The COOH carbon counts in the chain, so there are four carbons: butanoic acid.`]],
  `COOH carbon = carbon 1.`),
 Q(`Name [[CH3CH(OH)CH(CH3)CH3]].`,[
  [`3-methylbutan-2-ol`,true,`Correct. Four carbons, OH gets the lowest number (2), methyl on carbon 3.`],
  [`2-methylbutan-3-ol`,false,`The OH (the suffix group) must get the lowest number, so number from the left.`],
  [`2-methylbutan-2-ol`,false,`The OH and the methyl are on different carbons here.`],

{id:'terms',grp:'Reactions',short:'Reaction types',title:'Reaction types and reagents',spec:'3.3.1.2',

const KEY='intro-organic-guide-v1';
let P={}, view='home';
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ P=s.p||{}; view=s.v||'home'; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({p:P,v:view})); }catch(e){} }
function sp(id){ if(!P[id]) P[id]={u:1,a:{}}; return P[id]; }

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function order(n,seed){ const a=[...Array(n).keys()]; let x=seed||1; for(let i=n-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function secStats(sec){
  const pr=P[sec.id]; const checks=sec.steps.map((s,i)=>[s,i]).filter(([s])=>s.k==='check');
  let first=0, solved=0;
  checks.forEach(([s,i])=>{ const a=pr&&pr.a[i]; if(a&&a.s){ solved++; if(!a.w.length) first++; } });
  const done = pr && pr.u>=sec.steps.length && (sec.steps[sec.steps.length-1].k!=='check' || (pr.a[sec.steps.length-1]||{}).s);
  return {total:checks.length, first, solved, done:!!done, started:!!pr};
}

/* ---------- skeletal formulae (SmilesDrawer) ---------- */
let SMI_N=0;
function smiFig(b){ const id='smi'+(SMI_N++); return `<figure class="smi"><svg id="${id}" data-smi="${b.smi}" data-alt="${(b.alt||'').replace(/"/g,'&quot;')}"></svg>${b.cap?`<figcaption>${rich(b.cap)}</figcaption>`:''}</figure>`; }
function isDark(){ const t=document.documentElement.dataset.theme; return t==='dark' || (t!=='light' && matchMedia('(prefers-color-scheme: dark)').matches); }
function drawSmiles(root){
  const svgs=(root||document).querySelectorAll('svg[data-smi]');
  if(!svgs.length) return;
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#16232a';
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim()||'#fff';
  if(typeof SmilesDrawer==='undefined'){ svgs.forEach(s=>{ const f=document.createElement('div'); f.className='chem'; f.innerHTML=s.dataset.alt?fmtEq(s.dataset.alt):'(structure could not load)'; s.replaceWith(f); }); return; }
  const th={C:ink,O:ink,N:ink,F:ink,CL:ink,BR:ink,I:ink,P:ink,S:ink,B:ink,SI:ink,H:ink,BACKGROUND:bg};
  const d=new SmilesDrawer.SvgDrawer({width:260,height:170,bondThickness:1.3,bondLength:22,fontSizeLarge:9,fontSizeSmall:6,padding:12,compactDrawing:false,terminalCarbons:false,themes:{mono:th}});
  svgs.forEach(s=>{ if(s.dataset.done) return; SmilesDrawer.parse(s.dataset.smi, tree=>{ try{ d.draw(tree,s,'mono'); s.dataset.done=1; }catch(e){} }, ()=>{}); });
}

/* ---------- IR spectra (schematic) ---------- */
const IR={
  ethanol:[[3350,55,170],[2975,45,35],[2900,25,25],[1450,22,18],[1380,18,14],[1090,30,22],[1050,50,18],[880,22,14]],
  acid:[[2980,48,300],[1715,72,24],[1410,28,18],[1290,42,22],[940,24,22]],
  ketone:[[3005,18,25],[2925,15,20],[1715,75,22],[1360,38,18],[1220,48,20],[1090,14,14]],
  aldehyde:[[2980,32,35],[2820,18,14],[2720,18,14],[1730,72,22],[1460,22,16],[1390,22,14],[1110,18,16]],
  alkane:[[2955,58,32],[2870,45,22],[1465,30,14],[1380,20,10],[725,14,10]],
  alkene:[[3080,22,14],[2930,52,30],[1645,28,12],[1440,22,14],[990,30,10],[910,38,10]],
  nitrile:[[2950,35,30],[2250,48,14],[1460,25,16],[1380,18,12]]
};
function irFig(b){
  const pk=IR[b.ir], W=540, H=230, L=44, R=W-14, T=14, B=H-38;
  const x=v=>L+(4000-v)/(4000-500)*(R-L), y=t=>T+(100-t)/100*(B-T);
  let d=''; for(let v=4000; v>=500; v-=5){ let t=95; pk.forEach(([c,dp,w])=>t-=dp*Math.exp(-(((v-c)/w)**2))); d+=(v===4000?'M':'L')+x(v).toFixed(1)+' '+y(Math.max(2,t)).toFixed(1)+' '; }
  let ax=''; [4000,3500,3000,2500,2000,1500,1000,500].forEach(v=>{ ax+=`<line x1="${x(v)}" y1="${B}" x2="${x(v)}" y2="${B+5}" style="stroke:var(--muted)"/><text x="${x(v)}" y="${B+18}" text-anchor="middle" style="fill:var(--muted);font-size:11px;font-family:var(--f-chem)">${v}</text>`; });
  [0,50,100].forEach(t=>{ ax+=`<text x="${L-6}" y="${y(t)+4}" text-anchor="end" style="fill:var(--muted);font-size:11px;font-family:var(--f-chem)">${t}</text>`; });
  return `<figure class="irf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Infrared spectrum">
  <rect x="${x(1500)}" y="${T}" width="${x(500)-x(1500)}" height="${B-T}" style="fill:var(--accent-soft)"/>
  <text x="${(x(1500)+x(500))/2}" y="${B-8}" text-anchor="middle" style="fill:var(--accent);font-size:11px;font-weight:700;font-family:var(--f-body)">fingerprint region</text>
  <line x1="${L}" y1="${B}" x2="${R}" y2="${B}" style="stroke:var(--muted)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${B}" style="stroke:var(--muted)"/>
  <path d="${d}" style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round"/>${ax}
  <text x="${(L+R)/2}" y="${H-4}" text-anchor="middle" style="fill:var(--muted);font-size:11.5px;font-family:var(--f-body)">Wavenumber / cm⁻¹</text>
  <text x="12" y="${(T+B)/2}" text-anchor="middle" transform="rotate(-90 12 ${(T+B)/2})" style="fill:var(--muted);font-size:11.5px;font-family:var(--f-body)">Transmittance / %</text></svg>
  ${b.cap?`<figcaption>${rich(b.cap)}</figcaption>`:''}</figure>`;
}

/* ---------- rendering ---------- */
function block(b){
  if(typeof b==='string') return b.trim().startsWith('<') ? rich(b) : `<p>${rich(b)}</p>`;
  if(b.eq!==undefined){
    let html;
    if(b.cond){ const ar=b.eq.includes('⇌')?'⇌':'→'; const [l,r]=b.eq.split(ar); html=fmtEq(l)+` <span class="arrow"><small>${b.cond}</small><span>${ar}</span></span> `+fmtEq(r); }
    else html=fmtEq(b.eq);
    return `<div class="eqb">${b.tag?`<div class="tag">${rich(b.tag)}</div>`:''}<div class="eq">${html}</div>${b.note?`<div class="eqnote">${rich(b.note)}</div>`:''}</div>`;
  }
  if(b.tip) return `<div class="tip"><b class="t">${b.t||'Tip'}</b>${rich(b.tip)}</div>`;
  if(b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.fig) return (FIGS[b.fig]||(()=>''))(b);
  if(b.mols) return molRow(b);
  if(b.smi) return smiFig(b);
  if(b.ir) return irFig(b);
  return '';
}

function renderRail(){

  h+=`<button class="${view==='home'?'on':''}" data-v="home"><span class="n">i</span><span>Start here</span><span class="st"></span></button>`;
  SECTIONS.forEach((s,i)=>{
    if(s.grp!==g){ g=s.grp; h+=`<div class="grp">${g}</div>`; }
    const st=secStats(s);
    const cls=[view===s.id?'on':'', st.done?'done':(st.started?'part':'')].join(' ');
    h+=`<button class="${cls}" data-v="${s.id}"><span class="n">${st.done?'✓':i+1}</span><span>${s.short}</span><span class="st">${st.solved?st.first+'/'+st.total:''}</span></button>`;
  });
  h+=`<div class="grp">Revision</div>`;
  h+=`<button class="${view==='bank'?'on':''}" data-v="bank"><span class="n">=</span><span>Equation bank</span><span class="st"></span></button>`;
  h+=`<button class="${view==='results'?'on':''}" data-v="results"><span class="n">%</span><span>My results</span><span class="st"></span></button>`;
  rail.innerHTML=h;
  rail.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  // overall
  let done=0,first=0,tot=0,solved=0; SECTIONS.forEach(s=>{const st=secStats(s); if(st.done)done++; first+=st.first; tot+=st.total; solved+=st.solved;});
  document.getElementById('ovSec').textContent=`${done} of ${SECTIONS.length} sections complete`;
  document.getElementById('ovScore').textContent= solved?`${first}/${solved} right first time`:'';
  document.getElementById('ovBar').style.width=(done/SECTIONS.length*100)+'%';
}

function go(v){ view=v; save(); render(); window.scrollTo({top:0}); }

function renderHome(){
  const next=SECTIONS.find(s=>!secStats(s).done);
  return `<div class="home"><div class="sechead"><div class="spec">How this guide works</div><h2>Learn it step by step, check as you go</h2></div>
  <p class="lead">This guide covers formulae, functional groups, naming, isomerism and reaction types, with the focus on <strong>what is happening and the overall equation</strong>. Mechanisms (curly arrows) come later, in class.</p>
  <div class="how">
   <div><h4>Read a step</h4><p>Each section is broken into short steps. Read one, then press Continue.</p></div>
   <div><h4>Answer the check</h4><p>Multiple-choice checks appear between steps. You must get each right to move on.</p></div>
   <div><h4>Learn from mistakes</h4><p>A wrong answer tells you why it is wrong. Use that to try again.</p></div>
   <div><h4>Aim for first time</h4><p>Your score counts questions you got right on the first try. Revisit sections to improve.</p></div>
  </div>
  <p>Work through the sections in order: later sections build on earlier ones. Your progress is saved in this browser.</p>
  <button class="next" id="startBtn">${next? (secStats(next).started?'Carry on: ':'Start: ')+next.title : 'Review the equation bank'} →</button></div>`;
}

function renderSection(sec){
  const pr=sp(sec.id); const idx=SECTIONS.indexOf(sec);
  let h=`<div class="sechead"><div class="spec">Section ${idx+1} · Spec ${sec.spec}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="stepcount">Step ${Math.min(pr.u,sec.steps.length)} of ${sec.steps.length}</div></div>`;
  let ln=0;
  for(let i=0;i<pr.u && i<sec.steps.length;i++){
    const st=sec.steps[i];
    if(st.k==='learn'){ ln++; h+=`<section class="step learn" id="st${i}"><h3><span class="sn">${idx+1}.${ln}</span>${rich(st.h)}</h3>${st.b.map(block).join('')}</section>`; }
    else h+=renderCheck(sec,st,i,pr);
    const last=i===pr.u-1, solved= st.k==='learn' || (pr.a[i]&&pr.a[i].s);
    if(last && solved && i<sec.steps.length-1) h+=`<button class="next" data-cont="1">Continue →</button>`;
  }
  const stt=secStats(sec);
  if(stt.done){
    const nxt=SECTIONS[idx+1];
    h+=`<div class="finish"><h3>Section complete</h3><p>You got <strong>${stt.first} of ${stt.total}</strong> checks right first time.${stt.first<stt.total?' Look back at the ones you missed before moving on.':''}</p>
    <div class="confirm">${nxt?`<button class="next" data-go="${nxt.id}">Next: ${nxt.short} →</button>`:`<button class="next" data-go="bank">Go to the equation bank →</button>`}<button class="ghost" data-redo="${sec.id}">Redo this section</button></div></div>`;
  }
  return h;
}

function renderCheck(sec,st,i,pr){
  const a=pr.a[i]||{w:[],s:false};
  const ord=order(st.o.length,hash(sec.id+i+st.q));
  let qn=sec.steps.slice(0,i+1).filter(s=>s.k==='check').length;
  let h=`<section class="step" id="st${i}"><div class="check"><div class="clabel"><span>Check ${qn}</span><span>${a.s?(a.w.length?'Solved':'Right first time'):''}</span></div><div class="q">${rich(st.q)}</div>${st.fig?block(st.fig):''}<div class="opts">`;
  ord.forEach((oi,pos)=>{
    const o=st.o[oi]; const isW=a.w.includes(oi); const isR=a.s&&o[1];
    const cls=isW?'wrong':isR?'right':(a.s?'faded':'');
    const dis=a.s||isW;
    h+=`<button class="opt ${cls}" ${dis?'disabled':''} data-q="${i}" data-o="${oi}"><span class="let">${'ABCD'[pos]}</span><span>${rich(o[0])}</span>${(isW||isR)?`<span class="fb">${isW?'✗ ':'✓ '}${rich(o[2])}</span>`:''}</button>`;
  });
  h+=`</div>${a.s?`<div class="why"><b>Key point:</b> ${rich(st.why)}</div>`:''}</div></section>`;
  return h;
}

function renderBank(){
  let h=`<div class="sechead"><div class="spec">Revision</div><h2>Equation bank</h2><p>The key equations from every section in one place. Cover the right-hand side and try to write each one from memory.</p></div>`;
  SECTIONS.forEach((s,i)=>{
    const eqs=[]; s.steps.forEach(st=>{ if(st.k==='learn') st.b.forEach(b=>{ if(b&&b.key) eqs.push(b); }); });
    if(!eqs.length) return;
    h+=`<div class="bankgrp"><h3>${i+1}. ${s.title}</h3>${eqs.map(e=>block({eq:e.eq,cond:e.cond,tag:e.tag})).join('')}</div>`;
  });
  return h;
}

function renderResults(){
  let rows='', tf=0, tt=0, ts=0;
  SECTIONS.forEach((s,i)=>{ const st=secStats(s); tf+=st.first; tt+=st.total; ts+=st.solved;
    rows+=`<tr><td>${i+1}. ${s.short}</td><td class="num">${st.done?'Complete':st.started?'In progress':'Not started'}</td><td class="num">${st.solved}/${st.total}</td><td class="num">${st.solved?st.first+'/'+st.total:'–'}</td></tr>`; });
  return `<div class="sechead"><div class="spec">Revision</div><h2>My results</h2><p>"First time" counts checks you answered correctly with no wrong attempts. Show this page to your teacher if asked.</p></div>
  <div class="tbl"><table class="res"><thead><tr><th>Section</th><th>Status</th><th>Checks done</th><th>Right first time</th></tr></thead><tbody>${rows}
  <tr><td>Total</td><td></td><td class="num">${ts}/${tt}</td><td class="num"><strong>${tf}/${tt}</strong></td></tr></tbody></table></div>
  <div id="resetArea"><button class="ghost" id="resetBtn">Reset all progress</button></div>`;
}

function render(){
  renderRail();
  const m=document.getElementById('main');
  const sec=SECTIONS.find(s=>s.id===view);
  m.innerHTML = view==='bank'?renderBank(): view==='results'?renderResults(): sec?renderSection(sec): renderHome();
  drawSmiles(m);
  const sb=document.getElementById('startBtn');
  if(sb) sb.onclick=()=>{ const n=SECTIONS.find(s=>!secStats(s).done); go(n?n.id:'bank'); };
  m.querySelectorAll('[data-cont]').forEach(b=>b.onclick=()=>{ const pr=sp(view); pr.u++; save(); render(); const el=document.getElementById('st'+(pr.u-1)); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{ P[b.dataset.redo]={u:1,a:{}}; save(); render(); window.scrollTo({top:0}); });
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.o));
  const rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=()=>{ document.getElementById('resetArea').innerHTML=`<div class="confirm"><span>This clears every answer. Are you sure?</span><button class="next" id="yesReset">Yes, reset</button><button class="ghost" id="noReset">Cancel</button></div>`;
    document.getElementById('yesReset').onclick=()=>{ P={}; save(); render(); };
    document.getElementById('noReset').onclick=()=>render(); };
}

function answer(i,oi){
  const sec=SECTIONS.find(s=>s.id===view); const pr=sp(sec.id); const st=sec.steps[i];
  const a=pr.a[i]||(pr.a[i]={w:[],s:false}); if(a.s) return;
  if(st.o[oi][1]) a.s=true; else if(!a.w.includes(oi)) a.w.push(oi);
  save(); render();
  const el=document.querySelector(`.opt[data-q="${i}"][data-o="${oi}"]`); if(el && !a.s) el.focus();
  if(a.s){ const nb=document.querySelector('[data-cont]')||document.querySelector('.finish .next'); if(nb) nb.focus({preventScroll:true}); }
}

render();
</script>

</body></html>
