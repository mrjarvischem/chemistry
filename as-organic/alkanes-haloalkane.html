<script>
/* ---------- formula formatting ---------- */
function fmtF(t){
  let out='', i=0;
  const m=t.match(/^(\d+½|\d+\.\d+|\d+|½|n)(?=[A-Z(•\[])/);
  if(m){ out+='<span class="co">'+m[1]+'</span>'; i=m[1].length; }
  while(i<t.length){
    const c=t[i];
    if(c==='^'){ i++; let ch=''; while(i<t.length && /[0-9+\-−]/.test(t[i])){ ch+= t[i]==='-'?'−':t[i]; i++; } out+='<sup>'+ch+'</sup>'; continue; }
    if(/\d/.test(c) && i>0 && /[A-Za-z)\]]/.test(t[i-1])){ let d=''; while(i<t.length && /\d/.test(t[i])){ d+=t[i]; i++; } out+='<sub>'+d+'</sub>'; continue; }
    if(c==='n' && t[i-1]===']'){ out+='<sub>n</sub>'; i++; continue; }
    if(c==='•'){ out+='<span class="rad">•</span>'; i++; continue; }
    out+=c; i++;
  }
  return out;
}
function fmtEq(s){
  return s.trim().split(/\s+/).map(t=> (t==='+'||t==='→'||t==='⇌') ? '<span class="op">'+t+'</span>' : fmtF(t)).join(' ');
}
function rich(s){ return s.replace(/\[\[(.+?)\]\]/g,(_,m)=>'<span class="chem">'+fmtEq(m)+'</span>'); }

/* ---------- content ---------- */
const L=(h,...b)=>({k:'learn',h,b});
const Q=(q,o,why,fig)=>({k:'check',q,o,why,fig});

const SECTIONS=[
{id:'distil',grp:'Alkanes',short:'Fractional distillation',title:'Crude oil and fractional distillation',spec:'3.3.2.1',
 intro:'How a mixture of thousands of alkanes is separated into useful fractions.',
 steps:[
 L('Crude oil is a mixture',
  `Crude oil is a mixture of hydrocarbons, mostly <strong>alkanes</strong>. Alkanes are <strong>saturated</strong> hydrocarbons: they contain only single C–C and C–H bonds, with the general formula <span class="chem">C<sub>n</sub>H<sub>2n+2</sub></span>.`,
  `On its own, crude oil is not much use. It has to be separated into <strong>fractions</strong>: groups of molecules with similar chain lengths, and therefore similar boiling points.`,
  {tip:`Fractional distillation is a <strong>physical</strong> process. The molecules are separated, but no covalent bonds inside them are broken or made. Every molecule leaves the column exactly as it went in.`,t:'Key idea'}),
 L('Inside the fractionating column',
  {fig:'column'},
  `<ol><li>Crude oil is heated in a furnace until most of it <strong>vaporises</strong>.</li><li>The vapour enters near the bottom of the column. The column has a <strong>temperature gradient</strong>: hot at the bottom, cooler towards the top.</li><li>Vapour rises through trays. As it cools, each compound <strong>condenses</strong> when it reaches a tray cooler than its boiling point, and is piped off there.</li><li>Small molecules have low boiling points, so they rise furthest. The very largest molecules never vaporise and leave the bottom as a residue.</li></ol>`),
 Q(`In the fractionating column, where do the compounds with the <em>highest</em> boiling points condense?`,[
  [`Near the bottom, where the column is hottest`,true,`High-boiling compounds condense as soon as they meet a temperature below their boiling point, which happens low down.`],
  [`Near the top, where the column is coolest`,false,`The top is the coolest part, so only compounds with very low boiling points are still gases by the time they get there.`],
  [`In the furnace, before entering the column`,false,`The furnace vaporises the crude oil. Anything that does not vaporise at all leaves as residue; it does not condense anywhere.`],
  [`Evenly throughout the column`,false,`Each fraction condenses at a particular height, set by its boiling point. That is the whole point of the temperature gradient.`]],
  `Higher boiling point means condensing lower in the column, where it is hotter.`),
 L('Why chain length controls boiling point',
  `Alkane molecules are non-polar, so the only forces between them are <strong>van der Waals forces</strong> (induced dipole–dipole forces).`,
  `A longer chain has more electrons and a bigger surface area in contact with neighbouring molecules. That means stronger van der Waals forces between the molecules, so more energy is needed to separate them, and the boiling point is higher.`,
  {tip:`Boiling an alkane overcomes the forces <em>between</em> molecules. It never breaks the C–C or C–H bonds <em>inside</em> a molecule. Writing "bonds break" in this answer loses the mark.`,t:'Common mistake'}),
 Q(`Why does [[C20H42]] have a higher boiling point than [[C8H18]]?`,[
  [`It has more electrons and a larger surface area, so the van der Waals forces between its molecules are stronger`,true,`Correct. More electrons and more contact between molecules give stronger induced dipole–dipole attractions.`],
  [`It has more C–C bonds, which need more energy to break`,false,`No covalent bonds are broken when an alkane boils. The molecules stay intact and are just pulled apart from each other.`],
  [`Its molecules can form hydrogen bonds`,false,`Hydrogen bonding needs H attached to N, O or F. Alkanes only have C–H bonds, so they cannot hydrogen bond.`],
  [`Its molecules are more polar`,false,`C–H bonds are almost non-polar and alkanes have no overall dipole, whatever their length.`]],
  `Longer chain → more electrons and surface contact → stronger van der Waals forces → higher boiling point.`),
 Q(`Fractional distillation is described as a physical process. Which statement best explains why?`,[
  [`Compounds are separated by boiling point and no covalent bonds are broken or made`,true,`Correct. A physical process changes state or separates substances without making new ones.`],
  [`It uses heat`,false,`Many chemical reactions use heat too, cracking for example. Using heat does not make a process physical.`],
  [`No catalyst is used`,false,`Plenty of chemical reactions have no catalyst. What matters is whether new substances are made.`],
  [`The products are useful fuels`,false,`Whether the products are useful says nothing about whether bonds were broken.`]],
  `Physical: separation by boiling point, same molecules out as went in.`)
 ]},

{id:'crack',grp:'Alkanes',short:'Cracking',title:'Cracking',spec:'3.3.2.2',
 intro:'Breaking long alkanes into shorter, more valuable molecules, and writing the equations.',
 steps:[
 L('Why crack long alkanes?',
  `Fractional distillation produces more of the long-chain fractions (such as fuel oil) than anyone wants to buy, and not enough of the short-chain fractions (such as petrol), which are in high demand.`,
  `<strong>Cracking</strong> breaks C–C bonds in long-chain alkanes to make <strong>shorter alkanes</strong> and <strong>alkenes</strong>.`,
  `<ul><li>Shorter alkanes are used as fuels such as petrol.</li><li>Alkenes are very valuable feedstock for the chemical industry, for example ethene to make poly(ethene) and ethanol.</li></ul>`,
  {tip:`The economic reason: cracking turns low-value, low-demand fractions into high-value, high-demand products. Unlike fractional distillation, cracking is a <strong>chemical</strong> change because bonds are broken.`,t:'Exam phrase'}),
 L('Thermal and catalytic cracking',
  {table:{head:['','Thermal cracking','Catalytic cracking'],rows:[
   ['Temperature','High: 400–900 °C','High: about 450 °C'],
   ['Pressure','High: up to 7000 kPa','Slight pressure'],
   ['Catalyst','None','Zeolite (an aluminosilicate)'],
   ['Main products','High percentage of alkenes, especially short ones like ethene','Motor fuels (branched alkanes, cycloalkanes) and aromatic hydrocarbons']]}},
  `In industry, thermal cracking is often carried out with steam mixed into the hydrocarbon feed, so you may see it called <strong>steam cracking</strong>. In exam answers, treat steam cracking as thermal cracking.`,
  `The zeolite catalyst lets catalytic cracking run at a lower temperature and pressure than thermal cracking, which saves energy costs.`),
 Q(`Which set of conditions is used for <em>catalytic</em> cracking?`,[
  [`Zeolite catalyst, about 450 °C, slight pressure`,true,`Correct.`],
  [`No catalyst, 400–900 °C, up to 7000 kPa`,false,`These are the conditions for thermal cracking.`],
  [`Nickel catalyst, 150 °C`,false,`Nickel at about 150 °C is used to add hydrogen to alkenes (hydrogenation), not for cracking.`],
  [`Phosphoric acid catalyst, 300 °C, 6000 kPa`,false,`This is the hydration of ethene with steam to make ethanol.`]],
  `Catalytic: zeolite, slight pressure, high temperature. Thermal: no catalyst, high pressure, high temperature.`),
 Q(`A company wants to make as much ethene as possible to turn into poly(ethene). Which process should it use?`,[
  [`Thermal cracking`,true,`Correct. Thermal cracking gives a high percentage of alkenes.`],
  [`Catalytic cracking`,false,`Catalytic cracking mainly produces motor fuels and aromatic hydrocarbons, not lots of small alkenes.`],
  [`Fractional distillation of crude oil`,false,`Crude oil contains almost no alkenes. Alkenes have to be made by cracking.`],
  [`Either: both give the same products`,false,`The two methods give quite different product mixtures, which is why both are used.`]],
  `For alkenes, choose thermal cracking.`),
 L('Writing cracking equations',
  `Cracking equations are about counting atoms. The number of C atoms and H atoms must be the same on both sides.`,
  {eq:'C10H22 → C8H18 + C2H4',tag:'Example',note:'C: 10 = 8 + 2 · H: 22 = 18 + 4',key:true},
  `To find a missing product, <strong>subtract</strong> the known product from the starting alkane: 10 − 8 = 2 carbons and 22 − 18 = 4 hydrogens, giving [[C2H4]].`,
  `One alkane can crack into several products, as long as the atoms add up:`,
  {eq:'C16H34 → C8H18 + C4H8 + 2C2H4',note:'C: 8 + 4 + 4 = 16 · H: 18 + 8 + 8 = 34'},
  {tip:`There is always at least one alkene. An alkane C<sub>n</sub>H<sub>2n+2</sub> splitting into two alkanes would need 2 more hydrogen atoms than it has. For example, [[C10H22]] → [[C5H12]] + [[C5H12]] needs 24 H, but only 22 are available.`,t:'Why an alkene must form'}),
 Q(`Identify X: [[C14H30 → C8H18 + X]]`,[
  [`[[C6H12]]`,true,`Correct. 14 − 8 = 6 carbons and 30 − 18 = 12 hydrogens. [[C6H12]] fits C<sub>n</sub>H<sub>2n</sub>, so it is an alkene.`],
  [`[[C6H14]]`,false,`Count the hydrogens: 30 − 18 = 12, not 14. Two alkanes cannot both be made from one alkane.`],
  [`[[C6H10]]`,false,`Count the hydrogens again: 30 − 18 = 12.`],
  [`[[C22H48]]`,false,`You added instead of subtracting. Cracking breaks a big molecule into smaller ones.`]],
  `Subtract the known product from the starting alkane, then check C and H balance.`),
 Q(`Why can [[C10H22]] never crack to give two alkanes as the only products?`,[
  [`Two alkanes would need two more hydrogen atoms than [[C10H22]] contains`,true,`Correct. Two alkanes with 10 carbons in total would need 24 H atoms. Only 22 are available, so one product must be an alkene.`],
  [`Alkanes are too stable to be products of a reaction`,false,`Cracking makes shorter alkanes all the time. The problem is the hydrogen count.`],
  [`C–C bonds can only break if a C=C double bond forms in the same molecule`,false,`This sounds plausible, but the real reason is atom counting: there are not enough H atoms for two alkanes.`],
  [`The alkene is always the larger product`,false,`The alkene is often the smaller product, like ethene. This does not explain why an alkene must form.`]],
  `Atom conservation forces at least one product to be an alkene.`),
 Q(`What is the main <em>economic</em> reason for cracking?`,[
  [`It converts surplus long-chain fractions into products that are in higher demand and worth more`,true,`Correct. Supply of heavy fractions exceeds demand, while petrol and alkenes are in short supply.`],
  [`It removes sulfur impurities from fuels`,false,`Sulfur removal is a separate process. Cracking is about changing chain length.`],
  [`It makes long-chain alkanes for lubricating oils`,false,`This is the wrong way round. Cracking makes shorter molecules.`],
  [`It is cheaper than fractional distillation, so it replaces it`,false,`Cracking happens after fractional distillation, using fractions it produced. It does not replace it.`]],
  `Supply and demand: low-value heavy fractions in, high-value petrol and alkenes out.`)
 ]},

{id:'comb',grp:'Alkanes',short:'Combustion & pollutants',title:'Combustion of alkanes and engine pollutants',spec:'3.3.2.3',
 intro:'Complete and incomplete combustion equations, and where each pollutant from an engine comes from.',
 steps:[
 L('Complete combustion',
  `Alkanes are used as fuels because they release a lot of energy when burned. In a plentiful supply of oxygen, <strong>complete combustion</strong> produces carbon dioxide and water.`,
  `Balance in this order: <strong>C first, then H, then O</strong>. Halves are allowed in front of [[O2]].`,
  {eq:'C8H18 + 12½O2 → 8CO2 + 9H2O',tag:'Octane, complete',note:'O atoms needed: (8 × 2) + 9 = 25, so 12½ O<sub>2</sub>',key:true},
  {eq:'2C8H18 + 25O2 → 16CO2 + 18H2O',note:'The same equation doubled to remove the half'}),
 L('Incomplete combustion',
  `In a limited supply of oxygen, such as inside an engine cylinder, there is not enough oxygen to turn all the carbon into [[CO2]]. Instead you get <strong>carbon monoxide</strong> or <strong>carbon</strong> (soot).`,
  {eq:'C8H18 + 8½O2 → 8CO + 9H2O',tag:'Making carbon monoxide',note:'O atoms: 8 + 9 = 17, so 8½ O<sub>2</sub>',key:true},
  {eq:'C8H18 + 4½O2 → 8C + 9H2O',tag:'Making soot',note:'O atoms: 9 only, so 4½ O<sub>2</sub>',key:true},
  {tip:`The hydrogen always ends up as [[H2O]]. Only the carbon product changes: [[CO2]], [[CO]] or [[C]]. Less oxygen available means less oxygen in the carbon product.`,t:'Pattern to spot'}),
 Q(`Find x: [[C8H18 + xO2 → 8CO + 9H2O]]`,[
  [`8½`,true,`Correct. 8 O atoms in CO plus 9 in water = 17 O atoms = 8½ O<sub>2</sub>.`],
  [`12½`,false,`That is the value for complete combustion to [[CO2]]. Here the product is [[CO]].`],
  [`17`,false,`17 is the number of O <em>atoms</em>. Each [[O2]] molecule has two, so you need 8½ molecules.`],
  [`4½`,false,`That is the value for making soot, where only the water contains oxygen.`]],
  `Count O atoms in the products, then halve to get O<sub>2</sub>.`),
 Q(`Which equation shows incomplete combustion of propane to produce soot?`,[
  [`[[C3H8 + 2O2 → 3C + 4H2O]]`,true,`Correct. All the oxygen goes into the 4 water molecules: 4 O atoms = 2 O<sub>2</sub>.`],
  [`[[C3H8 + 5O2 → 3CO2 + 4H2O]]`,false,`This is complete combustion. Soot is carbon, C.`],
  [`[[C3H8 + 3½O2 → 3CO + 4H2O]]`,false,`This one is balanced, but it makes carbon monoxide, not soot.`],
  [`[[C3H8 + O2 → 3C + 4H2]]`,false,`The hydrogen in a hydrocarbon fuel burns to water, not hydrogen gas.`]],
  `Soot means C as a product, with all the oxygen in the water.`),
 L('Pollutants from an engine',
  {table:{head:['Pollutant','How it forms','Why it is a problem'],rows:[
   ['Carbon monoxide, CO','Incomplete combustion','Toxic: binds to haemoglobin so blood carries less oxygen'],
   ['Carbon (soot)','Incomplete combustion','Breathing problems; blackens buildings; global dimming'],
   ['Unburned hydrocarbons','Fuel that passes through without burning','Help form photochemical smog'],
   ['Nitrogen oxides, NOₓ','N₂ and O₂ <em>from the air</em> react at the high temperature of the engine','Toxic; NO₂ forms acid rain and photochemical smog'],
   ['Carbon dioxide, CO₂','Complete combustion','Greenhouse gas: contributes to climate change']]}},
  `The nitrogen in [[NO]] does <strong>not</strong> come from the fuel. Petrol contains no nitrogen. Air is about 78% nitrogen, and the very high temperature and spark in the cylinder give [[N2]] enough energy to react:`,
  {eq:'N2 + O2 → 2NO',tag:'In the engine',key:true},
  {eq:'2NO + O2 → 2NO2',tag:'Once in the air',key:true},
  `Normally [[N2]] is very unreactive because the N≡N triple bond is so strong. It only reacts at very high temperatures.`,
  {tip:`Some fuels contain sulfur impurities, which burn to form [[SO2]] and cause acid rain. In power stations it is removed by flue gas desulfurisation, reacting it with calcium oxide or calcium carbonate: [[CaO + SO2 → CaSO3]] and [[CaCO3 + SO2 → CaSO3 + CO2]].`,t:'Also on the spec'}),
 Q(`Where does the nitrogen in [[NO]] produced by car engines come from?`,[
  [`Nitrogen gas in the air drawn into the engine`,true,`Correct. The high temperature lets N<sub>2</sub> and O<sub>2</sub> from the air react.`],
  [`Nitrogen atoms in the petrol`,false,`Petrol is a mixture of hydrocarbons. It contains only C and H, no nitrogen.`],
  [`The catalytic converter`,false,`The catalytic converter removes NO. It does not make it.`],
  [`Water vapour in the exhaust`,false,`Water contains H and O only.`]],
  `Air in, high temperature, N<sub>2</sub> + O<sub>2</sub> → 2NO.`),
 Q(`Why does nitrogen react with oxygen inside an engine but not in the air around us?`,[
  [`The N≡N triple bond is very strong, so the reaction needs the very high temperature found in the engine`,true,`Correct. The high activation energy can only be overcome at engine temperatures.`],
  [`Oxygen is only present inside the engine`,false,`Air everywhere contains about 21% oxygen. The difference is temperature.`],
  [`Nitrogen only reacts when dissolved in fuel`,false,`Nitrogen does not dissolve in petrol to any useful extent. It reacts as a gas, at high temperature.`],
  [`The fuel acts as a catalyst`,false,`The fuel burns and is used up. Its role is to produce the high temperature.`]],
  `Strong N≡N bond, high activation energy, needs engine temperatures.`)
 ]},

{id:'cat',grp:'Alkanes',short:'Catalytic converters',title:'Catalytic converters',spec:'3.3.2.3',
 intro:'Removing CO, NO and unburned hydrocarbons, including the equation students find hardest.',
 steps:[
 L('What a catalytic converter does',
  `A catalytic converter sits in the exhaust system. It is a <strong>ceramic honeycomb</strong> coated with a thin layer of <strong>platinum, palladium and rhodium</strong>.`,
  `<ul><li>The honeycomb gives a very large surface area for the gases to contact the catalyst.</li><li>A thin coating means less of the expensive metal is needed.</li><li>The gases adsorb onto the metal surface, react, and the products leave the surface. It is a heterogeneous catalyst.</li></ul>`,
  `It converts the three main pollutants, CO, NO and unburned hydrocarbons, into [[CO2]], [[N2]] and [[H2O]]. The most important equation is CO and NO removing each other:`,
  {eq:'2CO + 2NO → 2CO2 + N2',tag:'Removing CO and NO',key:true},
  `Here [[CO]] is oxidised (it gains oxygen) and [[NO]] is reduced (it loses oxygen).`),
 Q(`What is the main reason the catalyst is coated onto a honeycomb structure?`,[
  [`To give a large surface area of catalyst for the gases to react on`,true,`Correct. More surface area means more reaction, and only a thin layer of expensive metal is needed.`],
  [`To cool the exhaust gases down`,false,`The converter actually works best when hot. The honeycomb is there for surface area.`],
  [`To trap soot particles`,false,`Soot is removed by a particulate filter, which is a different device.`],
  [`To slow the gases down so they stay longer`,false,`The gases flow through quickly. Large surface area is what makes the reaction fast enough.`]],
  `Honeycomb = large surface area, thin coating = less expensive metal.`),
 Q(`In [[2CO + 2NO → 2CO2 + N2]], which statement is correct?`,[
  [`CO is oxidised and NO is reduced`,true,`Correct. CO gains an oxygen atom; NO loses its oxygen atom.`],
  [`NO is oxidised and CO is reduced`,false,`Track the oxygen: NO loses oxygen (reduction), CO gains it (oxidation).`],
  [`Both CO and NO are oxidised`,false,`If one species is oxidised, another must be reduced. Here NO gives its oxygen to CO.`],
  [`The platinum is oxidised`,false,`Platinum is the catalyst. It is not used up or changed overall.`]],
  `Oxygen moves from NO to CO.`),
 L('The hard one: hydrocarbons reacting with NO',
  `Unburned hydrocarbons can react with [[NO]] in the converter. The trick is to see [[NO]] as an <strong>oxygen supplier</strong>. Each NO gives up one O atom, and the N atoms pair up as [[N2]].`,
  `Work through it in four steps. Example: octane.`,
  `<ol><li><strong>Products from C and H.</strong> 8 C gives 8 [[CO2]]; 18 H gives 9 [[H2O]].</li><li><strong>Count O atoms needed.</strong> (8 × 2) + 9 = 25 O atoms.</li><li><strong>One NO per O atom.</strong> So 25 [[NO]].</li><li><strong>Pair up the N atoms.</strong> 25 N atoms make 12½ [[N2]].</li></ol>`,
  {eq:'C8H18 + 25NO → 8CO2 + 9H2O + 12½N2',tag:'Octane + NO',key:true},
  {eq:'2C8H18 + 50NO → 16CO2 + 18H2O + 25N2',note:'Doubled to remove the half'},
  `Another example with heptane: 7 [[CO2]] + 8 [[H2O]] need 14 + 8 = 22 O atoms, so 22 NO and 11 [[N2]].`,
  {eq:'C7H16 + 22NO → 7CO2 + 8H2O + 11N2',key:true},
  {tip:`Hydrocarbons can also be oxidised by leftover [[O2]] in the converter. That equation is identical to complete combustion, for example [[C8H18 + 12½O2 → 8CO2 + 9H2O]].`,t:'Also accepted'}),
 Q(`Complete the equation: [[C6H14 + aNO → 6CO2 + 7H2O + bN2]]`,[
  [`a = 19, b = 9½`,true,`Correct. O atoms needed: (6 × 2) + 7 = 19, so 19 NO. 19 N atoms make 9½ N<sub>2</sub>.`],
  [`a = 19, b = 19`,false,`19 N atoms, but nitrogen is diatomic, so that is 9½ molecules of N<sub>2</sub>.`],
  [`a = 12, b = 6`,false,`You counted the oxygen in CO<sub>2</sub> only. The water needs 7 O atoms too.`],
  [`a = 9½, b = 19`,false,`These are swapped. Each NO supplies one O atom, so the number of NO equals the number of O atoms needed.`]],
  `O atoms needed = number of NO. Then halve the number of N atoms to get N<sub>2</sub>.`),
 Q(`Which of these can a catalytic converter <em>not</em> remove from car exhaust?`,[
  [`Carbon dioxide`,true,`Correct. CO<sub>2</sub> is a product of the converter, not something it can remove.`],
  [`Carbon monoxide`,false,`CO is oxidised to CO<sub>2</sub> in the converter.`],
  [`Nitrogen monoxide`,false,`NO is reduced to N<sub>2</sub> in the converter.`],
  [`Unburned hydrocarbons`,false,`These are oxidised to CO<sub>2</sub> and H<sub>2</sub>O in the converter.`]],
  `The converter makes CO<sub>2</sub>; it cannot get rid of it.`)
 ]},

{id:'frs',grp:'Alkanes',short:'Free radical substitution',title:'Free radical substitution',spec:'3.3.2.4',
 intro:'How alkanes react with halogens in UV light, and the three steps that make it happen.',
 steps:[
 L('Alkanes and halogens',
  `Alkanes are fairly unreactive: their bonds are strong and non-polar. However, in <strong>UV light</strong> they react with chlorine or bromine.`,
  `A hydrogen atom is replaced by a halogen atom, so this is a <strong>substitution</strong> reaction.`,
  {eq:'CH4 + Cl2 → CH3Cl + HCl',cond:'UV light',tag:'Overall equation',key:true},
  {eq:'C2H6 + Br2 → C2H5Br + HBr',cond:'UV light'},
  {tip:`The second product is the hydrogen halide ([[HCl]] or [[HBr]]), not [[H2]]. The H atom that is replaced leaves with a halogen atom.`,t:'Common mistake'}),
 L('What is a radical?',
  `A <strong>radical</strong> is a species with an <strong>unpaired electron</strong>. It is shown with a dot: [[Cl•]].`,
  `Radicals form when a covalent bond breaks so that each atom keeps one electron of the shared pair. This is <strong>homolytic fission</strong>.`,
  `UV light provides the energy to break the Cl–Cl bond, which is weaker than the C–H bonds in methane.`,
  `Radicals are very reactive because they want to pair up their single electron.`),
 L('The three steps',
  `Every free radical reaction is written as three types of step.`,
  {eq:'Cl2 → 2Cl•',cond:'UV light',tag:'1 · Initiation: radicals are made',key:true},
  {eq:'Cl• + CH4 → •CH3 + HCl',tag:'2 · Propagation: radical in, radical out',key:true},
  {eq:'•CH3 + Cl2 → CH3Cl + Cl•',key:true},
  {eq:'Cl• + Cl• → Cl2',tag:'3 · Termination: two radicals meet, stable molecule made',key:true},
  {eq:'•CH3 + Cl• → CH3Cl',key:true},
  {eq:'•CH3 + •CH3 → C2H6',key:true},
  `The [[Cl•]] made in the second propagation step goes back into the first. This is a <strong>chain reaction</strong>: one initiation step can lead to thousands of cycles before termination stops it.`,
  {tip:`Add the two propagation steps together and cancel anything on both sides. [[Cl•]] and [[•CH3]] cancel, leaving the overall equation [[CH4 + Cl2 → CH3Cl + HCl]]. Use this to check your propagation steps.`,t:'Self-check'}),
 Q(`Which of these is a <em>propagation</em> step?`,[
  [`[[•CH3 + Cl2 → CH3Cl + Cl•]]`,true,`Correct. One radical reacts, one radical is made.`],
  [`[[Cl2 → 2Cl•]]`,false,`No radical reacts here; radicals are created. This is initiation.`],
  [`[[•CH3 + Cl• → CH3Cl]]`,false,`Two radicals react and none are made. This is termination.`],
  [`[[CH4 + Cl2 → CH3Cl + HCl]]`,false,`This is the overall equation. It contains no radicals at all.`]],
  `Propagation: one radical on each side.`),
 Q(`In the first propagation step, [[Cl•]] reacts with [[CH4]]. What are the products?`,[
  [`[[•CH3 + HCl]]`,true,`Correct. The Cl radical pulls off a hydrogen atom, leaving a methyl radical.`],
  [`[[CH3Cl + H•]]`,false,`A tempting guess, but the Cl radical removes an H atom to make HCl. It does not swap in for it in this step.`],
  [`[[CH3Cl + H2]]`,false,`This does not balance and has no radical to continue the chain.`],
  [`[[CH3 + HCl]]`,false,`The methyl group has an unpaired electron, so it must be written as a radical, •CH<sub>3</sub>.`]],
  `Cl• + CH<sub>4</sub> → •CH<sub>3</sub> + HCl.`),
 Q(`Why does a small amount of ethane form when methane reacts with chlorine?`,[
  [`Two methyl radicals join together in a termination step`,true,`Correct. •CH<sub>3</sub> + •CH<sub>3</sub> → C<sub>2</sub>H<sub>6</sub>.`],
  [`Methane reacts with itself in UV light`,false,`Two methane molecules have no unpaired electrons, so they do not combine.`],
  [`The methane gas contained ethane as an impurity`,false,`Ethane is a genuine product of the reaction mechanism.`],
  [`HCl reacts with methane`,false,`HCl does not react with methane, and there would be no way to make a C–C bond.`]],
  `Termination between two methyl radicals makes ethane.`),
 L('Further substitution',
  `If there is enough chlorine, the [[CH3Cl]] formed can react again, replacing more hydrogen atoms:`,
  {eq:'CH3Cl + Cl2 → CH2Cl2 + HCl',cond:'UV light'},
  {eq:'CH2Cl2 + Cl2 → CHCl3 + HCl',cond:'UV light'},
  {eq:'CHCl3 + Cl2 → CCl4 + HCl',cond:'UV light'},
  {eq:'CH4 + 4Cl2 → CCl4 + 4HCl',cond:'UV light',tag:'All four H replaced',key:true},
  `This means free radical substitution gives a <strong>mixture of products</strong>, which is a disadvantage. Using excess methane makes [[CH3Cl]] the main product.`,
  `Each further substitution follows the same pattern of propagation steps. For [[CH2Cl2]]:`,
  {eq:'Cl• + CH3Cl → •CH2Cl + HCl'},
  {eq:'•CH2Cl + Cl2 → CH2Cl2 + Cl•'}),
 Q(`Which equation shows bromine reacting with ethane in UV light to give a monosubstituted product?`,[
  [`[[C2H6 + Br2 → C2H5Br + HBr]]`,true,`Correct. One H is replaced by Br and the H leaves as HBr.`],
  [`[[C2H6 + Br2 → C2H4Br2 + H2]]`,false,`The H atoms leave as HBr, not H<sub>2</sub>, and this is disubstitution.`],
  [`[[C2H6 + Br2 → C2H6Br2]]`,false,`That would be addition. Alkanes are saturated so they cannot add atoms; they substitute.`],
  [`[[C2H6 + Br2 → C2H5Br + H•]]`,false,`This does not balance: one Br atom is missing. The H goes to HBr.`]],
  `Substitution: alkane + X<sub>2</sub> → halogenoalkane + HX.`),
 Q(`Which is the <em>second</em> propagation step when [[CH3Cl]] is converted into [[CH2Cl2]]?`,[
  [`[[•CH2Cl + Cl2 → CH2Cl2 + Cl•]]`,true,`Correct. The radical takes a Cl atom from Cl<sub>2</sub> and releases a new Cl•.`],
  [`[[Cl• + CH3Cl → CH2Cl2 + H•]]`,false,`In step one the Cl• removes an H atom to make HCl and •CH<sub>2</sub>Cl.`],
  [`[[•CH2Cl + Cl• → CH2Cl2]]`,false,`Two radicals combine with none left over. This is termination.`],
  [`[[CH3Cl + Cl2 → CH2Cl2 + HCl]]`,false,`This is the overall equation for the step, not a propagation step.`]],
  `Same pattern as methane: remove H with Cl•, then take Cl from Cl<sub>2</sub>.`)
 ]},

{id:'nuc',grp:'Halogenoalkanes',short:'Nucleophiles',title:'Halogenoalkanes and nucleophiles',spec:'3.3.3.1',
 intro:'Why the C–X bond is attacked, and how to pick out the nucleophile from a reagent.',
 steps:[
 L('The polar C–X bond',
  `Halogenoalkanes contain a carbon–halogen bond, C–X. The halogen is more electronegative than carbon, so the bond is <strong>polar</strong>: C<sup>δ+</sup>–X<sup>δ−</sup>.`,
  `The δ+ carbon is electron-deficient. It attracts species that have an electron pair to donate.`,
  `Naming reminder: [[CH3CH2CH2Br]] is 1-bromopropane; [[CH3CHBrCH3]] is 2-bromopropane.`),
 L('What is a nucleophile?',
  `A <strong>nucleophile</strong> is an <strong>electron pair donor</strong>. It has a lone pair of electrons, and is often (not always) negatively charged.`,
  `The three nucleophiles you need are:`,
  `<ul><li>hydroxide ion, [[OH^-]]</li><li>cyanide ion, [[CN^-]]</li><li>ammonia, [[NH3]] (neutral, with a lone pair on N)</li></ul>`,
  `The nucleophile replaces the halogen, which leaves as a halide ion, [[X^-]]. This is <strong>nucleophilic substitution</strong>.`),
 L('Spotting the nucleophile in a reagent',
  `Exam questions name a <em>reagent</em>, not the nucleophile. Split ionic reagents into their ions. The metal ion is a <strong>spectator</strong>: positive ions have no lone pair to donate, and would be repelled by the δ+ carbon.`,
  {table:{head:['Reagent','Nucleophile','Spectator ion','Product type'],rows:[
   ['NaOH or KOH (aq)','OH⁻','Na⁺ or K⁺','Alcohol'],
   ['KCN','CN⁻','K⁺','Nitrile'],
   ['NH₃','NH₃','none','Amine'],
   ['H₂O','H₂O (weak)','none','Alcohol (slowly)']]}},
  {tip:`If the reagent is a metal compound, the nucleophile is the negative ion. If it is a neutral molecule like [[NH3]] or [[H2O]], look for the lone pair.`,t:'Quick rule'}),
 Q(`The reagent is potassium cyanide, KCN. Which species acts as the nucleophile?`,[
  [`[[CN^-]]`,true,`Correct. The cyanide ion has a lone pair on carbon to donate.`],
  [`[[K^+]]`,false,`K<sup>+</sup> is positive with no lone pair. It is repelled by the δ+ carbon and is a spectator ion.`],
  [`The whole KCN unit`,false,`KCN is ionic and separates into K<sup>+</sup> and CN<sup>−</sup> in solution. Only the anion attacks.`],
  [`[[H^+]]`,false,`There is no H<sup>+</sup> in KCN, and a positive ion cannot donate an electron pair.`]],
  `Split the reagent into ions; the anion is the nucleophile.`),
 Q(`Which of these is <em>not</em> a nucleophile?`,[
  [`[[Na^+]]`,true,`Correct. Na<sup>+</sup> has no lone pair to donate and is positively charged.`],
  [`[[OH^-]]`,false,`OH<sup>−</sup> has lone pairs on oxygen and a negative charge. It is a nucleophile.`],
  [`[[NH3]]`,false,`NH<sub>3</sub> is neutral, but it has a lone pair on nitrogen, so it is a nucleophile.`],
  [`[[H2O]]`,false,`Water has two lone pairs on oxygen. It is a weak nucleophile, used in the hydrolysis practical.`]],
  `Nucleophile = lone pair donor. Metal cations never qualify.`),
 Q(`Why is the carbon atom in a C–Br bond attacked by nucleophiles?`,[
  [`Bromine is more electronegative, so the carbon is δ+`,true,`Correct. The partial positive charge attracts the nucleophile's lone pair.`],
  [`Carbon has a lone pair of electrons`,false,`Carbon in C–Br has four bonds and no lone pair. It is the nucleophile that brings the lone pair.`],
  [`The C–Br bond is non-polar`,false,`C–Br is polar because of the difference in electronegativity.`],
  [`Bromine is δ+`,false,`Bromine is more electronegative than carbon, so it carries the δ− charge.`]],
  `C<sup>δ+</sup>–Br<sup>δ−</sup>: the nucleophile goes for the δ+ carbon.`)
 ]},

{id:'sub',grp:'Halogenoalkanes',short:'Nucleophilic substitution',title:'Nucleophilic substitution equations',spec:'3.3.3.1',
 intro:'Reagents, conditions and balanced equations for the three nucleophiles.',
 steps:[
 L('The general pattern',
  `The nucleophile takes the place of the halogen. The halogen leaves as a halide ion.`,
  {eq:'R–X + Nu^- → R–Nu + X^-',tag:'General'},
  `You can write equations either as <strong>ionic</strong> equations (with the nucleophile only) or with the <strong>full reagent</strong>. Both are accepted.`),
 L('Hydroxide ions: making alcohols',
  `<strong>Reagent and conditions:</strong> NaOH or KOH dissolved in <strong>water</strong> (aqueous), warm, heat under reflux.`,
  {eq:'CH3CH2Br + OH^- → CH3CH2OH + Br^-',tag:'Ionic',key:true},
  {eq:'CH3CH2Br + NaOH → CH3CH2OH + NaBr',tag:'Full reagent'},
  `Bromoethane becomes ethanol. This reaction is also called <strong>hydrolysis</strong>.`),
 L('Cyanide ions: making nitriles',
  `<strong>Reagent and conditions:</strong> KCN dissolved in aqueous <strong>ethanol</strong>, heat under reflux.`,
  {eq:'CH3CH2Br + CN^- → CH3CH2CN + Br^-',tag:'Ionic',key:true},
  {eq:'CH3CH2Br + KCN → CH3CH2CN + KBr',tag:'Full reagent'},
  `The product is <strong>propanenitrile</strong>. Count the carbons: the C in CN is part of the chain, so the product has 3 carbons although bromoethane had 2.`,
  {tip:`Cyanide adds a carbon to the chain. This is useful in synthesis for making a longer carbon chain. When naming the nitrile, include the CN carbon.`,t:'Key idea'}),
 L('Ammonia: making amines',
  `<strong>Reagent and conditions:</strong> <strong>excess</strong> concentrated ammonia dissolved in ethanol, heated in a sealed tube (under pressure).`,
  {eq:'CH3CH2Br + 2NH3 → CH3CH2NH2 + NH4Br',tag:'Overall',key:true},
  `Why two [[NH3]]? The reaction happens in two stages:`,
  {eq:'CH3CH2Br + NH3 → CH3CH2NH3^+ + Br^-',tag:'1 · [[NH3]] acts as the nucleophile'},
  {eq:'CH3CH2NH3^+ + NH3 → CH3CH2NH2 + NH4^+',tag:'2 · A second [[NH3]] acts as a base and removes H<sup>+</sup>'},
  `The product is ethylamine. Excess ammonia is used so that it is more likely to react with the halogenoalkane than the amine product is. Otherwise the amine, which is also a nucleophile, reacts further.`,
  {tip:`[[CH3CH2Br + NH3 → CH3CH2NH2 + HBr]] balances, but HBr cannot exist in excess ammonia: it reacts straight away to form [[NH4Br]]. Use 2 NH<sub>3</sub> and NH<sub>4</sub>Br in exams.`,t:'Common slip'}),
 Q(`1-bromopropane is warmed with aqueous sodium hydroxide. What is the organic product?`,[
  [`Propan-1-ol, [[CH3CH2CH2OH]]`,true,`Correct. OH<sup>−</sup> replaces Br.`],
  [`Propene, [[CH3CH=CH2]]`,false,`Propene forms by elimination, which needs KOH in ethanol. Aqueous conditions favour substitution.`],
  [`Butan-1-ol`,false,`OH<sup>−</sup> does not add a carbon. Only cyanide makes the chain longer.`],
  [`[[CH3CH2CH2ONa]]`,false,`Na<sup>+</sup> is a spectator ion. It ends up in NaBr, not in the organic product.`]],
  `Aqueous hydroxide: halogenoalkane → alcohol with the same carbon chain.`),
 Q(`1-bromopropane is heated under reflux with KCN in aqueous ethanol. Name the organic product.`,[
  [`Butanenitrile`,true,`Correct. [[CH3CH2CH2CN]] has four carbons including the CN carbon.`],
  [`Propanenitrile`,false,`Count the CN carbon too: CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>CN has 4 carbons, so it is butanenitrile.`],
  [`Propylamine`,false,`Amines come from ammonia, not cyanide.`],
  [`Butan-1-ol`,false,`The CN group stays intact; it does not become OH.`]],
  `Cyanide adds one carbon, and the CN carbon is counted in the name.`),
 Q(`Which equation shows chloroethane reacting with excess ammonia?`,[
  [`[[CH3CH2Cl + 2NH3 → CH3CH2NH2 + NH4Cl]]`,true,`Correct. One NH<sub>3</sub> is the nucleophile, the second removes H<sup>+</sup> to form NH<sub>4</sub>Cl.`],
  [`[[CH3CH2Cl + NH3 → CH3CH2NH2 + HCl]]`,false,`This balances, but HCl reacts at once with the excess ammonia to form NH<sub>4</sub>Cl. The accepted equation uses 2NH<sub>3</sub>.`],
  [`[[CH3CH2Cl + NH3 → CH3CH2NH3 + Cl]]`,false,`This does not show the charges and leaves an extra H on nitrogen. The second NH<sub>3</sub> removes that H<sup>+</sup>.`],
  [`[[CH3CH2Cl + 2NH3 → CH3CH2NH3 + NH3Cl]]`,false,`NH<sub>3</sub>Cl is not a real compound. Count the H atoms: the product should be the amine plus NH<sub>4</sub>Cl.`]],
  `Halogenoalkane + 2NH<sub>3</sub> → amine + NH<sub>4</sub>X.`),
 Q(`Which conditions would you use to make a nitrile from a halogenoalkane?`,[
  [`KCN in aqueous ethanol, heat under reflux`,true,`Correct.`],
  [`KOH in ethanol, heat`,false,`These are elimination conditions, giving an alkene.`],
  [`Excess ammonia in ethanol, heated in a sealed tube`,false,`These conditions make an amine.`],
  [`NaOH(aq), warm`,false,`These conditions make an alcohol.`]],
  `Nitrile: KCN, aqueous ethanol, reflux.`)
 ]},

{id:'rate',grp:'Halogenoalkanes',short:'C–X bond enthalpy & rate',title:'C–X bond enthalpy and rate of hydrolysis',spec:'3.3.3.1',
 intro:'Which halogenoalkane reacts fastest, why, and the practical that shows it.',
 steps:[
 L('Two factors that could control the rate',
  `When a nucleophile attacks a halogenoalkane, the C–X bond has to break. Two properties of that bond could affect how fast this happens.`,
  `<ul><li><strong>Polarity.</strong> C–F is the most polar, so its carbon is the most δ+. This predicts fluoroalkanes react fastest.</li><li><strong>Bond enthalpy.</strong> C–I is the weakest bond, so it needs least energy to break. This predicts iodoalkanes react fastest.</li></ul>`,
  {fig:'bonds'},
  `The two ideas predict opposite orders, so we need an experiment to decide.`),
 L('The practical: hydrolysis with silver nitrate',
  `<ol><li>Put a few drops of 1-chlorobutane, 1-bromobutane and 1-iodobutane into three separate test tubes, each with 1 cm³ of ethanol.</li><li>Stand these, and a tube of aqueous silver nitrate, in a water bath at about 50 °C.</li><li>Add 1 cm³ of silver nitrate solution to each tube and start a timer.</li><li>Record the time for a precipitate to appear.</li></ol>`,
  `Water is the nucleophile. It hydrolyses the halogenoalkane, releasing halide ions:`,
  {eq:'CH3CH2CH2CH2I + H2O → CH3CH2CH2CH2OH + H^+ + I^-',tag:'Hydrolysis',key:true},
  `The silver ions then react with the halide ions to form a precipitate. The faster the hydrolysis, the sooner the precipitate appears.`,
  {eq:'Ag^+(aq) + I^-(aq) → AgI(s)',tag:'Precipitate',key:true},
  {table:{head:['Halogenoalkane','Precipitate','Time'],rows:[
   ['1-iodobutane','Yellow, AgI','Fastest'],
   ['1-bromobutane','Cream, AgBr','Middle'],
   ['1-chlorobutane','White, AgCl','Slowest']]}},
  `<strong>Fair test:</strong> same chain length and type (all primary), same volumes, same concentration of silver nitrate, same temperature.`,
  {tip:`Ethanol is a co-solvent: halogenoalkanes do not mix with water, but both dissolve in ethanol. NaOH is not used because OH<sup>−</sup> would react with Ag<sup>+</sup> to form a brown precipitate of silver oxide, hiding the result.`,t:'Why ethanol, why water'}),
 Q(`Which halogenoalkane is hydrolysed fastest?`,[
  [`1-iodobutane`,true,`Correct. The C–I bond is the weakest, so it breaks most easily.`],
  [`1-fluorobutane`,false,`This is what the polarity argument predicts, but C–F is the strongest bond. Fluoroalkanes barely react.`],
  [`1-chlorobutane`,false,`1-chlorobutane is the slowest of the three in the practical.`],
  [`They all react at the same rate`,false,`The precipitates appear at clearly different times.`]],
  `Weakest C–X bond = fastest hydrolysis.`),
 Q(`What does this experiment tell us?`,[
  [`Bond enthalpy has a bigger effect on rate than bond polarity`,true,`Correct. If polarity were more important, the order would be reversed.`],
  [`Bond polarity has a bigger effect on rate than bond enthalpy`,false,`Polarity predicts C–F fastest, but the results show C–I is fastest.`],
  [`Larger halogens are better nucleophiles`,false,`The halogen leaves the molecule. The nucleophile here is water.`],
  [`Iodine is the most electronegative halogen`,false,`Iodine is the least electronegative halogen. Fluorine is the most.`]],
  `The results follow bond enthalpy, not polarity.`),
 Q(`In this practical, which species acts as the nucleophile?`,[
  [`[[H2O]]`,true,`Correct. Water's lone pair attacks the δ+ carbon.`],
  [`[[Ag^+]]`,false,`Ag<sup>+</sup> is positive and has no lone pair to donate. It only reacts with the halide ion after it has been released.`],
  [`[[NO3^-]]`,false,`Nitrate is a spectator ion in this practical.`],
  [`Ethanol`,false,`Ethanol is there as a solvent so that the halogenoalkane and the aqueous solution mix.`]],
  `Water is the nucleophile; silver ions detect the halide.`),
 Q(`What colour precipitate forms with 1-bromobutane?`,[
  [`Cream`,true,`Correct. Silver bromide, AgBr, is cream.`],
  [`White`,false,`White is silver chloride, AgCl.`],
  [`Yellow`,false,`Yellow is silver iodide, AgI.`],
  [`Brown`,false,`Brown silver oxide would form if hydroxide ions were present, which is why NaOH is not used.`]],
  `AgCl white, AgBr cream, AgI yellow.`)
 ]},

{id:'elim',grp:'Halogenoalkanes',short:'Elimination',title:'Elimination, and why it competes with substitution',spec:'3.3.3.2',
 intro:'Making alkenes from halogenoalkanes, and how conditions decide which reaction wins.',
 steps:[
 L('Same reagent, different job',
  `Hydroxide ions can react with a halogenoalkane in two ways:`,
  `<ul><li>as a <strong>nucleophile</strong>: it attacks the δ+ carbon and replaces the halogen, giving an <strong>alcohol</strong> (substitution).</li><li>as a <strong>base</strong>: it removes an H<sup>+</sup> from the carbon <em>next to</em> the C–X carbon. HX is lost and a C=C double bond forms, giving an <strong>alkene</strong> (elimination).</li></ul>`,
  {eq:'CH3CH2Br + KOH → CH2=CH2 + KBr + H2O',tag:'Elimination, full reagent',key:true},
  {eq:'CH3CH2Br + OH^- → CH2=CH2 + H2O + Br^-',tag:'Ionic'},
  {tip:`Elimination gives <strong>three</strong> products: the alkene, water and the halide. Substitution gives two. Count them as a check.`,t:'Spot the difference'}),
 L('Conditions decide which reaction wins',
  {table:{head:['','Substitution','Elimination'],rows:[
   ['Reagent','NaOH or KOH','KOH'],
   ['Solvent','Water (aqueous)','Ethanol'],
   ['Temperature','Warm','Hot, under reflux'],
   ['OH⁻ acts as','Nucleophile','Base'],
   ['Product','Alcohol','Alkene']]}},
  `The structure of the halogenoalkane matters too. Primary halogenoalkanes mainly undergo substitution; tertiary ones mainly undergo elimination.`,
  `Because the same ion can do both jobs, the two reactions <strong>happen at the same time</strong> in the same flask. Changing the conditions only changes the <em>proportion</em> of each product. You always get a mixture, which reduces the yield of the product you want.`),
 Q(`In elimination, the hydroxide ion acts as…`,[
  [`a base, accepting an H⁺ ion`,true,`Correct. It removes H<sup>+</sup> from the carbon next to the C–X carbon.`],
  [`a nucleophile, attacking the δ+ carbon`,false,`That is its role in substitution, which gives an alcohol.`],
  [`an oxidising agent`,false,`No oxidation happens. HX is simply removed from the molecule.`],
  [`a catalyst`,false,`OH<sup>−</sup> is used up: it ends up in water.`]],
  `Substitution: OH⁻ as nucleophile. Elimination: OH⁻ as base.`),
 L('The spec example: 2-bromopropane',
  `2-bromopropane reacting with potassium hydroxide shows both reactions side by side:`,
  {eq:'CH3CHBrCH3 + KOH → CH3CH(OH)CH3 + KBr',tag:'Substitution: aqueous, warm → propan-2-ol',key:true},
  {eq:'CH3CHBrCH3 + KOH → CH3CH=CH2 + KBr + H2O',tag:'Elimination: ethanolic, hot → propene',key:true},
  `With longer chains, the H<sup>+</sup> can be removed from either carbon next to the C–Br carbon. 2-bromobutane gives a mixture of alkenes:`,
  {eq:'CH3CHBrCH2CH3 + KOH → CH2=CHCH2CH3 + KBr + H2O',tag:'But-1-ene'},
  {eq:'CH3CHBrCH2CH3 + KOH → CH3CH=CHCH3 + KBr + H2O',tag:'But-2-ene (as E and Z isomers)'}),
 Q(`2-bromopropane is heated under reflux with KOH dissolved in ethanol. What is the main organic product?`,[
  [`Propene`,true,`Correct. Ethanolic, hot conditions favour elimination.`],
  [`Propan-2-ol`,false,`Propan-2-ol is the substitution product, favoured by aqueous, warm conditions.`],
  [`Propan-1-ol`,false,`Substitution would put the OH where the Br was, on carbon 2. In any case these conditions favour elimination.`],
  [`Propane`,false,`Elimination removes HBr and forms a C=C, so the product is an alkene, not an alkane.`]],
  `Ethanol solvent and heat → elimination → alkene.`),
 Q(`Which balanced equation shows the elimination reaction of bromoethane with KOH?`,[
  [`[[CH3CH2Br + KOH → CH2=CH2 + KBr + H2O]]`,true,`Correct. Three products: alkene, salt and water.`],
  [`[[CH3CH2Br + KOH → CH2=CH2 + KBr]]`,false,`Count the atoms: one O and one H are missing. They form water.`],
  [`[[CH3CH2Br + KOH → CH3CH2OH + KBr]]`,false,`This is substitution, giving ethanol.`],
  [`[[CH3CH2Br → CH2=CH2 + HBr]]`,false,`This shows what is lost from the molecule, but the reagent is KOH. It removes the H<sup>+</sup> as water and the Br<sup>−</sup> ends up as KBr.`]],
  `Elimination with KOH: alkene + KBr + H<sub>2</sub>O.`),
 Q(`Why do substitution and elimination often happen together?`,[
  [`The hydroxide ion can act as both a nucleophile and a base, so both reactions occur in the same mixture`,true,`Correct. Conditions shift the balance but rarely give one product only.`],
  [`The alkene from elimination reacts on to give the alcohol`,false,`The two products form by separate routes. One does not turn into the other under these conditions.`],
  [`KOH contains two ions, and each causes one of the reactions`,false,`K<sup>+</sup> is a spectator ion. Both reactions are caused by OH<sup>−</sup>.`],
  [`Ethanol reacts with the halogenoalkane`,false,`The competition is between the two roles of OH<sup>−</sup>, not between OH<sup>−</sup> and the solvent.`]],
  `One reagent, two possible roles, so two reactions run side by side.`),
 Q(`How many different alkenes, counting E and Z isomers separately, form when 2-bromobutane undergoes elimination?`,[
  [`3`,true,`Correct: but-1-ene, E-but-2-ene and Z-but-2-ene.`],
  [`1`,false,`H<sup>+</sup> can be removed from carbon 1 or carbon 3, so there are at least two structural isomers.`],
  [`2`,false,`But-1-ene and but-2-ene are right, but but-2-ene exists as E and Z isomers, so there are three.`],
  [`4`,false,`But-1-ene has no E/Z isomers because carbon 1 has two H atoms. The total is three.`]],
  `Two positions for the C=C, and but-2-ene has E and Z forms.`)
 ]},

{id:'ozone',grp:'Ozone and CFCs',short:'Ozone depletion',title:'Ozone depletion',spec:'3.3.3.3',
 intro:'Why the ozone layer matters and the radical cycles that destroy it.',
 steps:[
 L('The ozone layer',
  `Ozone, [[O3]], in the stratosphere absorbs harmful ultraviolet radiation from the Sun. Without it, more UV reaches the ground, increasing the risk of skin cancer and cataracts and damaging crops.`,
  `Ozone is constantly being made and broken down. Normally the rates balance:`,
  {eq:'O2 → 2O',cond:'UV'},
  {eq:'O + O2 → O3'},
  {eq:'O3 → O2 + O',cond:'UV',note:'This step absorbs the harmful UV'}),
 L('Chlorine radicals destroy ozone',
  `Chlorine radicals in the stratosphere break ozone down in two propagation steps:`,
  {eq:'Cl• + O3 → ClO• + O2',tag:'Step 1',key:true},
  {eq:'ClO• + O3 → 2O2 + Cl•',tag:'Step 2',key:true},
  {eq:'2O3 → 3O2',tag:'Overall',key:true},
  `Add the steps and cancel [[Cl•]] and [[ClO•]] from both sides to get the overall equation.`,
  `[[Cl•]] is used in step 1 and regenerated in step 2, so it acts as a <strong>catalyst</strong>. One chlorine radical can destroy many thousands of ozone molecules before a termination step removes it.`,
  {tip:`Some textbooks write step 2 as [[ClO• + O → Cl• + O2]], using an oxygen atom. The AQA spec uses the version with [[O3]] above.`,t:'You may see'}),
 Q(`What is the overall equation for the breakdown of ozone by chlorine radicals?`,[
  [`[[2O3 → 3O2]]`,true,`Correct. The radicals cancel out because they are regenerated.`],
  [`[[Cl• + O3 → ClO• + O2]]`,false,`This is only the first propagation step. Add both steps together.`],
  [`[[3O2 → 2O3]]`,false,`This is ozone being made. The reaction here destroys ozone.`],
  [`[[O3 → O2 + O]]`,false,`This is the natural breakdown of ozone by UV, not the chlorine-catalysed reaction.`]],
  `Add the two steps; Cl• and ClO• cancel.`),
 Q(`Complete step 2: [[ClO• + O3 → ?]]`,[
  [`[[2O2 + Cl•]]`,true,`Correct. 4 O atoms on each side, and the Cl radical is regenerated.`],
  [`[[ClO2 + O2]]`,false,`This loses the radical, so the chain would stop. The Cl• has to be regenerated.`],
  [`[[Cl2 + 2O2]]`,false,`This does not balance: there is only one Cl atom on the left.`],
  [`[[Cl• + O3]]`,false,`Count the oxygens: 4 on the left, only 3 on the right.`]],
  `ClO• + O<sub>3</sub> → 2O<sub>2</sub> + Cl•`),
 Q(`What type of step is [[Cl• + O3 → ClO• + O2]]?`,[
  [`Propagation`,true,`Correct. A radical reacts and a new radical is formed, just like in the chlorination of methane.`],
  [`Initiation`,false,`Initiation makes radicals from a molecule with none. Here a radical is already present.`],
  [`Termination`,false,`Termination uses up radicals with none made. Here a new radical, ClO•, forms.`],
  [`Substitution`,false,`Substitution describes an overall reaction type. The step names are initiation, propagation and termination.`]],
  `Radical in, radical out = propagation.`),
 L('Nitrogen monoxide does the same',
  `[[NO]] has 15 electrons, an odd number, so it has an unpaired electron and is a radical: [[NO•]]. NO from aircraft engines and thunderstorms also breaks down ozone:`,
  {eq:'NO• + O3 → NO2• + O2',key:true},
  {eq:'NO2• + O3 → NO• + 2O2',key:true},
  `The overall equation is again [[2O3 → 3O2]], and [[NO•]] acts as a catalyst.`),
 Q(`Why is NO described as a radical?`,[
  [`It has an odd number of electrons, so one electron is unpaired`,true,`Correct. 7 from N + 8 from O = 15 electrons.`],
  [`It contains a double bond`,false,`Many stable molecules have double bonds. A radical needs an unpaired electron.`],
  [`It is formed using UV light`,false,`NO forms at high temperatures, and how a species is made does not make it a radical.`],
  [`It is a gas`,false,`Being a gas has nothing to do with being a radical.`]],
  `Odd electron count → unpaired electron → radical.`)
 ]},

{id:'cfc',grp:'Ozone and CFCs',short:'CFCs & legislation',title:'CFCs, chlorine radicals and legislation',spec:'3.3.3.3',
 intro:'Where the chlorine radicals come from, and how science led to a worldwide ban.',
 steps:[
 L('What are CFCs?',
  `<strong>Chlorofluorocarbons</strong> are halogenoalkanes containing only carbon, chlorine and fluorine, for example [[CCl2F2]] (dichlorodifluoromethane) and [[CCl3F]] (trichlorofluoromethane).`,
  `They were widely used as <strong>refrigerants</strong>, <strong>aerosol propellants</strong>, <strong>solvents</strong> (for example for cleaning electronics) and for blowing foams. They were chosen because they are unreactive, non-toxic, non-flammable and volatile.`,
  `Being unreactive is also the problem. CFCs are not broken down in the lower atmosphere, so they survive for decades and slowly drift up into the stratosphere.`),
 L('Making chlorine radicals from CFCs',
  `In the stratosphere, intense UV breaks the C–Cl bond by homolytic fission:`,
  {eq:'CCl2F2 → •CClF2 + Cl•',cond:'UV',key:true},
  {eq:'CCl3F → •CCl2F + Cl•',cond:'UV',key:true},
  `It is the <strong>C–Cl</strong> bond that breaks, not C–F, because C–Cl is much weaker (346 kJ mol<sup>−1</sup> compared with 467 kJ mol<sup>−1</sup>). This is the same bond enthalpy idea as in the hydrolysis practical.`,
  `The [[Cl•]] released then enters the ozone-destroying cycle from the previous section.`),
 Q(`Which bond breaks when [[CCl2F2]] absorbs UV in the stratosphere?`,[
  [`C–Cl, because it is weaker than C–F`,true,`Correct. The weakest bond breaks first.`],
  [`C–F, because it is more polar`,false,`Polarity does not decide which bond breaks here. C–F is the strongest bond, so it stays intact.`],
  [`Both C–Cl bonds at once`,false,`One C–Cl bond breaks to give one Cl• and a •CClF<sub>2</sub> radical.`],
  [`C–Cl, because it is more polar`,false,`The right bond, wrong reason. C–F is more polar. C–Cl breaks because it has the lower bond enthalpy.`]],
  `Lowest bond enthalpy = the bond that breaks.`),
 Q(`Which equation shows the formation of a chlorine radical from [[CCl3F]]?`,[
  [`[[CCl3F → •CCl2F + Cl•]]`,true,`Correct. Homolytic fission of one C–Cl bond.`],
  [`[[CCl3F → •CCl3 + F•]]`,false,`This breaks the C–F bond, which is the strongest. C–Cl breaks instead.`],
  [`[[CCl3F → CCl2F^+ + Cl^-]]`,false,`This is heterolytic fission, making ions. UV causes homolytic fission, making radicals.`],
  [`[[CCl3F + O3 → CCl2F + ClO + O2]]`,false,`The CFC does not react directly with ozone. UV first releases Cl•.`]],
  `UV + CFC → carbon radical + Cl•.`),
 L('From research to legislation',
  `<ul><li><strong>1974:</strong> chemists Mario Molina and Sherwood Rowland proposed that CFCs could release chlorine atoms that destroy stratospheric ozone.</li><li><strong>1985:</strong> scientists from the British Antarctic Survey published measurements showing a large seasonal "hole" in the ozone layer over Antarctica.</li><li><strong>1987:</strong> the <strong>Montreal Protocol</strong>, an international agreement, set out to phase out CFCs. Developed countries stopped producing them by 1996.</li></ul>`,
  `The legislation to ban CFCs was <strong>supported by the results of research by scientists</strong>. This is the phrase the spec uses.`,
  `<strong>Chemists then developed chlorine-free alternatives:</strong>`,
  `<ul><li><strong>HFCs</strong> (hydrofluorocarbons), for example [[CH2FCF3]], used in fridges and aerosols. With no C–Cl bonds, they cannot release Cl•.</li><li><strong>Hydrocarbons</strong> such as butane, used as refrigerants and propellants.</li></ul>`,
  `HFCs do not harm ozone, but they are powerful greenhouse gases, so they are now also being phased down. The ozone layer is slowly recovering, because CFCs already released stay in the atmosphere for many decades.`),
 Q(`Why do HFCs such as [[CH2FCF3]] not deplete ozone?`,[
  [`They contain no C–Cl bonds, and C–F bonds are too strong to be broken by UV`,true,`Correct. No chlorine radicals can form.`],
  [`They are broken down before reaching the stratosphere`,false,`HFCs are also unreactive and do reach the stratosphere. They simply cannot release Cl•.`],
  [`Fluorine radicals do not react with ozone`,false,`The point is that fluorine radicals are not formed, because the C–F bond does not break.`],
  [`They are not volatile`,false,`HFCs are volatile; that is why they work as refrigerants and propellants.`]],
  `No C–Cl bond, so no Cl• radicals.`),
 Q(`Which property made CFCs useful <em>and</em> allowed them to damage the ozone layer?`,[
  [`They are very unreactive, so they last long enough to reach the stratosphere`,true,`Correct. Their stability made them safe to use but also meant they survived to reach the ozone layer.`],
  [`They are very reactive, so they attack ozone directly`,false,`CFCs are very unreactive. It is the Cl• released by UV that attacks ozone.`],
  [`They are denser than air, so they stay near the ground`,false,`If they stayed near the ground they could not reach the ozone layer.`],
  [`They are greenhouse gases`,false,`CFCs are greenhouse gases, but that is a separate problem from ozone depletion.`]],
  `Low reactivity: a benefit in use, a problem in the stratosphere.`),
 Q(`What role did scientists play in the banning of CFCs?`,[
  [`Their research provided evidence that supported the legislation`,true,`Correct. This is the AQA spec wording.`],
  [`They passed the laws that banned CFCs`,false,`Governments pass laws. Scientists provided the evidence.`],
  [`They discovered that CFCs were toxic to humans`,false,`CFCs are non-toxic. The concern was the stratospheric ozone layer.`],
  [`They proved that HFCs damage ozone more than CFCs`,false,`HFCs do not damage ozone. They were developed as alternatives.`]],
  `Research → evidence → legislation (Montreal Protocol) → chlorine-free alternatives.`)
 ]}
];

/* ---------- state ---------- */
const KEY='alkhalo-guide-v1';
let P={}, view='home';
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s){ P=s.p||{}; view=s.v||'home'; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({p:P,v:view})); }catch(e){} }
function sp(id){ if(!P[id]) P[id]={u:1,a:{}}; return P[id]; }

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function order(n,seed){ const a=[...Array(n).keys()]; let x=seed||1; for(let i=n-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function secStats(sec){
  const pr=P[sec.id]; const checks=sec.steps.map((s,i)=>[s,i]).filter(([s])=>s.k==='check');
  let first=0, solved=0;
  checks.forEach(([s,i])=>{ const a=pr&&pr.a[i]; if(a&&a.s){ solved++; if(!a.w.length) first++; } });
  const done = pr && pr.u>=sec.steps.length && (sec.steps[sec.steps.length-1].k!=='check' || (pr.a[sec.steps.length-1]||{}).s);
  return {total:checks.length, first, solved, done:!!done, started:!!pr};
}

  <text x="68" y="399" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12.5" font-weight="700" fill="var(--ink)">Furnace</text>
  <text x="68" y="415" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="var(--muted)">about 350 °C</text>
  <line x1="116" y1="392" x2="146" y2="392" stroke="var(--ink)" stroke-width="2"/><path d="M144 388 L151 392 L144 396" fill="var(--ink)"/>
  <text x="68" y="372" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="var(--muted)">crude oil vapour</text>
  <line x1="40" y1="330" x2="40" y2="60" stroke="var(--muted)" stroke-width="1.5"/><path d="M36 64 L40 52 L44 64" fill="var(--muted)"/>
  <text x="54" y="70" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">cooler</text>
  <text x="54" y="86" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">~25 °C</text>
  <text x="54" y="318" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">hotter</text>
  <text x="54" y="334" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">~350 °C</text>
  </svg>`;
  return `<figure>${s}<figcaption>Chain lengths are approximate; textbooks quote slightly different ranges. Smaller molecules leave higher up.</figcaption></figure>`;
}
function figBonds(){
  const b=[['C–F',467,'most polar'],['C–Cl',346,''],['C–Br',290,''],['C–I',228,'weakest']];
  return `<div class="bonds" aria-label="Mean bond enthalpies">${b.map(x=>`<div class="row"><b>${x[0]}</b><div class="track"><i style="width:${(x[1]/467*100).toFixed(1)}%"></i></div><span>${x[1]} kJ mol<sup>−1</sup></span></div>`).join('')}</div><p style="font-size:14px;color:var(--muted);margin-top:-6px">Mean bond enthalpies. Values vary slightly between data sources.</p>`;
}

/* ---------- structure drawings ---------- */
function lab(x,y,t,anc){
  let o=`<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" style="fill:var(--ink);font-family:var(--f-chem);font-size:15px">`, off=0;
  (t.match(/\d+|[^\d]+/g)||[]).forEach(r=>{ const d=/^\d/.test(r); const ny=d?4:0; o+=`<tspan dy="${ny-off}"${d?' style="font-size:11px"':''}>${r}</tspan>`; off=ny; });
  return o+'</text>';
}
const LN=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink);stroke-width:1.8;stroke-linecap:round"/>`;
function alkeneSVG(g){ // g = [top-left, bottom-left, top-right, bottom-right]
  return `<svg viewBox="0 0 230 130" role="img" aria-label="Displayed formula">${lab(85,65,'C','middle')}${lab(145,65,'C','middle')}
  ${LN(95,60,135,60)}${LN(95,70,135,70)}${LN(78,57,62,39)}${LN(78,73,62,91)}${LN(152,57,168,39)}${LN(152,73,168,91)}
  ${lab(60,30,g[0],'end')}${lab(60,101,g[1],'end')}${lab(170,30,g[2],'start')}${lab(170,101,g[3],'start')}</svg>`;
}
function ruSVG(g){ // g = [top1, bottom1, top2, bottom2]
  return `<svg viewBox="0 0 240 132" role="img" aria-label="Repeat unit">${lab(95,66,'C','middle')}${lab(150,66,'C','middle')}
  ${LN(28,66,86,66)}${LN(104,66,141,66)}${LN(159,66,214,66)}${LN(95,56,95,34)}${LN(95,76,95,98)}${LN(150,56,150,34)}${LN(150,76,150,98)}
  ${lab(95,23,g[0],'middle')}${lab(95,110,g[1],'middle')}${lab(150,23,g[2],'middle')}${lab(150,110,g[3],'middle')}
  <path d="M64 14 L56 14 L56 118 L64 118" style="fill:none;stroke:var(--ink);stroke-width:1.8"/><path d="M180 14 L188 14 L188 118 L180 118" style="fill:none;stroke:var(--ink);stroke-width:1.8"/>
  ${lab(196,122,'n','start')}</svg>`;
}
function molRow(b){
  return `<div class="mols">${b.mols.map((m,i)=>(i&&b.join?`<div class="join">${b.jl?`<small>${b.jl}</small>`:''}${b.join}</div>`:'')+`<figure>${m.t==='ru'?ruSVG(m.g):alkeneSVG(m.g)}${m.cap?`<figcaption>${rich(m.cap)}</figcaption>`:''}</figure>`).join('')}</div>`;
}

const FIGS={column:figColumn,bonds:figBonds};

/* ---------- rendering ---------- */
function block(b){
  if(typeof b==='string') return b.trim().startsWith('<') ? rich(b) : `<p>${rich(b)}</p>`;
  if(b.eq!==undefined){
    let html;
    if(b.cond){ const ar=b.eq.includes('⇌')?'⇌':'→'; const [l,r]=b.eq.split(ar); html=fmtEq(l)+` <span class="arrow"><small>${b.cond}</small><span>${ar}</span></span> `+fmtEq(r); }
    else html=fmtEq(b.eq);
    return `<div class="eqb">${b.tag?`<div class="tag">${rich(b.tag)}</div>`:''}<div class="eq">${html}</div>${b.note?`<div class="eqnote">${rich(b.note)}</div>`:''}</div>`;
  }
  if(b.tip) return `<div class="tip"><b class="t">${b.t||'Tip'}</b>${rich(b.tip)}</div>`;
  if(b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.fig) return (FIGS[b.fig]||(()=>''))(b);
  if(b.mols) return molRow(b);
  return '';
}

function renderRail(){
  const rail=document.getElementById('rail'); let h='', g='';
  h+=`<button class="${view==='home'?'on':''}" data-v="home"><span class="n">i</span><span>Start here</span><span class="st"></span></button>`;
  SECTIONS.forEach((s,i)=>{
    if(s.grp!==g){ g=s.grp; h+=`<div class="grp">${g}</div>`; }
    const st=secStats(s);
    const cls=[view===s.id?'on':'', st.done?'done':(st.started?'part':'')].join(' ');
    h+=`<button class="${cls}" data-v="${s.id}"><span class="n">${st.done?'✓':i+1}</span><span>${s.short}</span><span class="st">${st.solved?st.first+'/'+st.total:''}</span></button>`;
  });
  h+=`<div class="grp">Revision</div>`;
  h+=`<button class="${view==='bank'?'on':''}" data-v="bank"><span class="n">=</span><span>Equation bank</span><span class="st"></span></button>`;
  h+=`<button class="${view==='results'?'on':''}" data-v="results"><span class="n">%</span><span>My results</span><span class="st"></span></button>`;
  rail.innerHTML=h;
  rail.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  // overall
  let done=0,first=0,tot=0,solved=0; SECTIONS.forEach(s=>{const st=secStats(s); if(st.done)done++; first+=st.first; tot+=st.total; solved+=st.solved;});
  document.getElementById('ovSec').textContent=`${done} of ${SECTIONS.length} sections complete`;
  document.getElementById('ovScore').textContent= solved?`${first}/${solved} right first time`:'';
  document.getElementById('ovBar').style.width=(done/SECTIONS.length*100)+'%';
}

function go(v){ view=v; save(); render(); window.scrollTo({top:0}); }

function renderHome(){
  const next=SECTIONS.find(s=>!secStats(s).done);
  return `<div class="home"><div class="sechead"><div class="spec">How this guide works</div><h2>Learn it step by step, check as you go</h2></div>
  <p class="lead">This guide covers the reactions of alkanes and halogenoalkanes, with the focus on <strong>what is happening and the overall equation</strong>. Mechanisms (curly arrows) come later, in class.</p>
  <div class="how">
   <div><h4>Read a step</h4><p>Each section is broken into short steps. Read one, then press Continue.</p></div>
   <div><h4>Answer the check</h4><p>Multiple-choice checks appear between steps. You must get each right to move on.</p></div>
   <div><h4>Learn from mistakes</h4><p>A wrong answer tells you why it is wrong. Use that to try again.</p></div>
   <div><h4>Aim for first time</h4><p>Your score counts questions you got right on the first try. Revisit sections to improve.</p></div>
  </div>
  <p>Work through the sections in order: later sections build on earlier ones. Your progress is saved in this browser.</p>
  <button class="next" id="startBtn">${next? (secStats(next).started?'Carry on: ':'Start: ')+next.title : 'Review the equation bank'} →</button></div>`;
}

function renderSection(sec){
  const pr=sp(sec.id); const idx=SECTIONS.indexOf(sec);
  let h=`<div class="sechead"><div class="spec">Section ${idx+1} · Spec ${sec.spec}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="stepcount">Step ${Math.min(pr.u,sec.steps.length)} of ${sec.steps.length}</div></div>`;
  let ln=0;
  for(let i=0;i<pr.u && i<sec.steps.length;i++){
    const st=sec.steps[i];
    if(st.k==='learn'){ ln++; h+=`<section class="step learn" id="st${i}"><h3><span class="sn">${idx+1}.${ln}</span>${rich(st.h)}</h3>${st.b.map(block).join('')}</section>`; }
    else h+=renderCheck(sec,st,i,pr);
    const last=i===pr.u-1, solved= st.k==='learn' || (pr.a[i]&&pr.a[i].s);
    if(last && solved && i<sec.steps.length-1) h+=`<button class="next" data-cont="1">Continue →</button>`;
  }
  const stt=secStats(sec);
  if(stt.done){
    const nxt=SECTIONS[idx+1];
    h+=`<div class="finish"><h3>Section complete</h3><p>You got <strong>${stt.first} of ${stt.total}</strong> checks right first time.${stt.first<stt.total?' Look back at the ones you missed before moving on.':''}</p>
    <div class="confirm">${nxt?`<button class="next" data-go="${nxt.id}">Next: ${nxt.short} →</button>`:`<button class="next" data-go="bank">Go to the equation bank →</button>`}<button class="ghost" data-redo="${sec.id}">Redo this section</button></div></div>`;
  }
  return h;
}

function renderCheck(sec,st,i,pr){
  const a=pr.a[i]||{w:[],s:false};
  const ord=order(st.o.length,hash(sec.id+i+st.q));
  let qn=sec.steps.slice(0,i+1).filter(s=>s.k==='check').length;
  let h=`<section class="step" id="st${i}"><div class="check"><div class="clabel"><span>Check ${qn}</span><span>${a.s?(a.w.length?'Solved':'Right first time'):''}</span></div><div class="q">${rich(st.q)}</div>${st.fig?block(st.fig):''}<div class="opts">`;
  ord.forEach((oi,pos)=>{
    const o=st.o[oi]; const isW=a.w.includes(oi); const isR=a.s&&o[1];
    const cls=isW?'wrong':isR?'right':(a.s?'faded':'');
    const dis=a.s||isW;
    h+=`<button class="opt ${cls}" ${dis?'disabled':''} data-q="${i}" data-o="${oi}"><span class="let">${'ABCD'[pos]}</span><span>${rich(o[0])}</span>${(isW||isR)?`<span class="fb">${isW?'✗ ':'✓ '}${rich(o[2])}</span>`:''}</button>`;
  });
  h+=`</div>${a.s?`<div class="why"><b>Key point:</b> ${rich(st.why)}</div>`:''}</div></section>`;
  return h;
}

function renderBank(){
  let h=`<div class="sechead"><div class="spec">Revision</div><h2>Equation bank</h2><p>The key equations from every section in one place. Cover the right-hand side and try to write each one from memory.</p></div>`;
  SECTIONS.forEach((s,i)=>{
    const eqs=[]; s.steps.forEach(st=>{ if(st.k==='learn') st.b.forEach(b=>{ if(b&&b.key) eqs.push(b); }); });
    if(!eqs.length) return;
    h+=`<div class="bankgrp"><h3>${i+1}. ${s.title}</h3>${eqs.map(e=>block({eq:e.eq,cond:e.cond,tag:e.tag})).join('')}</div>`;
  });
  return h;
}

function renderResults(){
  let rows='', tf=0, tt=0, ts=0;
  SECTIONS.forEach((s,i)=>{ const st=secStats(s); tf+=st.first; tt+=st.total; ts+=st.solved;
    rows+=`<tr><td>${i+1}. ${s.short}</td><td class="num">${st.done?'Complete':st.started?'In progress':'Not started'}</td><td class="num">${st.solved}/${st.total}</td><td class="num">${st.solved?st.first+'/'+st.total:'–'}</td></tr>`; });
  return `<div class="sechead"><div class="spec">Revision</div><h2>My results</h2><p>"First time" counts checks you answered correctly with no wrong attempts. Show this page to your teacher if asked.</p></div>
  <div class="tbl"><table class="res"><thead><tr><th>Section</th><th>Status</th><th>Checks done</th><th>Right first time</th></tr></thead><tbody>${rows}
  <tr><td>Total</td><td></td><td class="num">${ts}/${tt}</td><td class="num"><strong>${tf}/${tt}</strong></td></tr></tbody></table></div>
  <div id="resetArea"><button class="ghost" id="resetBtn">Reset all progress</button></div>`;
}

function render(){
  renderRail();
  const m=document.getElementById('main');
  const sec=SECTIONS.find(s=>s.id===view);
  m.innerHTML = view==='bank'?renderBank(): view==='results'?renderResults(): sec?renderSection(sec): renderHome();
  const sb=document.getElementById('startBtn');
  if(sb) sb.onclick=()=>{ const n=SECTIONS.find(s=>!secStats(s).done); go(n?n.id:'bank'); };
  m.querySelectorAll('[data-cont]').forEach(b=>b.onclick=()=>{ const pr=sp(view); pr.u++; save(); render(); const el=document.getElementById('st'+(pr.u-1)); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{ P[b.dataset.redo]={u:1,a:{}}; save(); render(); window.scrollTo({top:0}); });
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.o));
  const rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=()=>{ document.getElementById('resetArea').innerHTML=`<div class="confirm"><span>This clears every answer. Are you sure?</span><button class="next" id="yesReset">Yes, reset</button><button class="ghost" id="noReset">Cancel</button></div>`;
    document.getElementById('yesReset').onclick=()=>{ P={}; save(); render(); };
    document.getElementById('noReset').onclick=()=>render(); };
}

function answer(i,oi){
  const sec=SECTIONS.find(s=>s.id===view); const pr=sp(sec.id); const st=sec.steps[i];
  const a=pr.a[i]||(pr.a[i]={w:[],s:false}); if(a.s) return;
  if(st.o[oi][1]) a.s=true; else if(!a.w.includes(oi)) a.w.push(oi);
  save(); render();
  const el=document.querySelector(`.opt[data-q="${i}"][data-o="${oi}"]`); if(el && !a.s) el.focus();
  if(a.s){ const nb=document.querySelector('[data-cont]')||document.querySelector('.finish .next'); if(nb) nb.focus({preventScroll:true}); }
}

render();
</script>

</body></html>
