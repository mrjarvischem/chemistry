figure{margin:0 0 14px}
figure svg{width:100%;max-width:560px;height:auto;display:block}
figcaption{font-size:14px;color:var(--muted);margin-top:4px}
.mols{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px}
.mols figure{margin:0;flex:0 1 220px;min-width:0}
.mols svg{width:100%;max-width:230px;height:auto;display:block}
.mols figcaption{text-align:center;margin-top:0}

<script>
/* ---------- formula formatting ---------- */
function fmtF(t){
  let out='', i=0;
  const m=t.match(/^(\d+½|\d+\.\d+|\d+|½|n)(?=[A-Z(•\[])/);
  if(m){ out+='<span class="co">'+m[1]+'</span>'; i=m[1].length; }
  while(i<t.length){
    const c=t[i];
    if(c==='^'){ i++; let ch=''; while(i<t.length && /[0-9+\-−]/.test(t[i])){ ch+= t[i]==='-'?'−':t[i]; i++; } out+='<sup>'+ch+'</sup>'; continue; }
    if(/\d/.test(c) && i>0 && /[A-Za-z)\]]/.test(t[i-1])){ let d=''; while(i<t.length && /\d/.test(t[i])){ d+=t[i]; i++; } out+='<sub>'+d+'</sub>'; continue; }
    if(c==='n' && t[i-1]===']'){ out+='<sub>n</sub>'; i++; continue; }
    if(c==='•'){ out+='<span class="rad">•</span>'; i++; continue; }
    out+=c; i++;
  }
  return out;
}
function fmtEq(s){
  return s.trim().split(/\s+/).map(t=> (t==='+'||t==='→'||t==='⇌') ? '<span class="op">'+t+'</span>' : fmtF(t)).join(' ');
}
function rich(s){ return s.replace(/\[\[(.+?)\]\]/g,(_,m)=>'<span class="chem">'+fmtEq(m)+'</span>'); }

/* ---------- content ---------- */
const L=(h,...b)=>({k:'learn',h,b});
const Q=(q,o,why,fig)=>({k:'check',q,o,why,fig});

const SECTIONS=[
{id:'struct',grp:'Alkenes',short:'Structure & naming',title:'Structure, bonding and naming',spec:'3.3.4.1',
 intro:'What makes an alkene an alkene, and why the double bond makes it reactive.',
 steps:[
 L('Unsaturated hydrocarbons',
  `Alkenes are <strong>unsaturated</strong> hydrocarbons: they contain a carbon–carbon double bond, C=C. Alkenes with one double bond have the general formula <span class="chem">C<sub>n</sub>H<sub>2n</sub></span>.`,
  {mols:[{g:['H','H','H','H'],cap:'ethene, [[C2H4]]'},{g:['H','H','H','CH3'],cap:'propene, [[C3H6]]'}]},
  `The double bond contains <strong>four electrons</strong> between the two carbon atoms. It is a region of <strong>high electron density</strong>, and that is what makes alkenes much more reactive than alkanes.`,
  {tip:`Cycloalkanes such as cyclohexane, [[C6H12]], also have the formula C<sub>n</sub>H<sub>2n</sub> but no double bond. A formula alone cannot tell you a compound is an alkene.`,t:'Watch out'}),
 Q(`What is the molecular formula of an alkene with six carbon atoms and one C=C double bond?`,[
  [`[[C6H12]]`,true,`Correct. C<sub>n</sub>H<sub>2n</sub> with n = 6.`],
  [`[[C6H14]]`,false,`That fits C<sub>n</sub>H<sub>2n+2</sub>, the formula for alkanes.`],
  [`[[C6H10]]`,false,`That would need two double bonds (or a ring and a double bond).`],
  [`[[C6H6]]`,false,`That is benzene, which is far more unsaturated.`]],
  `Alkenes: C<sub>n</sub>H<sub>2n</sub>.`),
 L('Naming alkenes',
  `Number the chain from the end that gives the double bond the <strong>lowest number</strong>. The number tells you the first carbon of the double bond.`,
  {table:{head:['Structure','Name'],rows:[
   ['[[CH2=CHCH2CH3]]','but-1-ene'],
   ['[[CH3CH=CHCH3]]','but-2-ene'],
   ['[[CH3CH2CH=CH2]]','but-1-ene (numbered from the right)'],
   ['[[CH2=C(CH3)CH3]]','2-methylpropene']]}},
  `But-1-ene and but-2-ene are <strong>positional isomers</strong>: same molecular formula, double bond in a different position.`),
 Q(`Name [[CH3CH2CH2CH=CH2]].`,[
  [`pent-1-ene`,true,`Correct. Numbering from the right puts the double bond at carbon 1.`],
  [`pent-4-ene`,false,`Number from the end nearest the double bond, so it starts at carbon 1, not 4.`],
  [`but-1-ene`,false,`Count the carbons: there are five, so the stem is pent-.`],
  [`pentane`,false,`The -ane ending is for alkanes. This has a C=C, so it ends in -ene.`]],
  `Lowest number for the double bond.`),
 Q(`Why are alkenes much more reactive than alkanes?`,[
  [`The C=C double bond is a region of high electron density that attracts electron-deficient species`,true,`Correct. This is the key idea behind every reaction in this guide.`],
  [`The C=C bond is stronger than a C–C bond, so it releases more energy`,false,`A C=C is stronger than one C–C bond, but that does not explain reactivity. What matters is the high electron density.`],
  [`Alkenes are polar molecules`,false,`Simple alkenes like ethene are non-polar. Their reactivity comes from the electron-rich double bond.`],
  [`Alkenes contain fewer hydrogen atoms`,false,`Fewer H atoms is a consequence of the double bond, not a reason for reactivity.`]],
  `High electron density in C=C = reactive.`)
 ]},

{id:'ez',grp:'Alkenes',short:'E/Z isomerism',title:'E/Z stereoisomerism',spec:'3.3.1.3',
 intro:'Why some alkenes exist as two different isomers with the same structural formula.',
 steps:[
 L('Restricted rotation',
  `Atoms joined by a single bond can rotate freely. A C=C double bond <strong>cannot rotate</strong>. Groups attached to each end are locked in place, either on the same side or on opposite sides.`,
  {mols:[{g:['H3C','H','CH3','H'],cap:'both CH<sub>3</sub> on the same side'},{g:['H3C','H','H','CH3'],cap:'CH<sub>3</sub> groups on opposite sides'}]},
  `These two molecules of but-2-ene have the same structural formula, [[CH3CH=CHCH3]], but their atoms are arranged differently in space. They are <strong>stereoisomers</strong>, and they cannot turn into each other without breaking the double bond.`,
  `E/Z isomerism needs two conditions:`,
  `<ol><li>a C=C double bond (restricted rotation), and</li><li><strong>each</strong> carbon of the double bond has <strong>two different</strong> groups attached.</li></ol>`),
 Q(`Which alkene shows E/Z isomerism?`,[
  [`pent-2-ene, [[CH3CH=CHCH2CH3]]`,true,`Correct. C2 has H and CH<sub>3</sub>; C3 has H and C<sub>2</sub>H<sub>5</sub>. Each carbon has two different groups.`],
  [`but-1-ene, [[CH2=CHCH2CH3]]`,false,`Carbon 1 has two H atoms. If either carbon has two identical groups there is no E/Z isomerism.`],
  [`propene, [[CH2=CHCH3]]`,false,`Carbon 1 has two H atoms, so swapping sides gives the same molecule.`],
  [`2-methylbut-2-ene, [[(CH3)2C=CHCH3]]`,false,`Carbon 2 has two CH<sub>3</sub> groups, so it fails the "two different groups" test.`]],
  `Check both carbons: each needs two different groups.`),
 L('Naming E and Z: the priority rules',
  `On <strong>each</strong> carbon of the double bond, find the group with the higher priority. Priority depends on the <strong>atomic number</strong> of the atom directly attached to the carbon. Higher atomic number wins.`,
  `<ul><li><strong>Z</strong> (zusammen, together): the two higher-priority groups are on the <strong>same side</strong>.</li><li><strong>E</strong> (entgegen, opposite): they are on <strong>opposite sides</strong>.</li></ul>`,
  {mols:[{g:['H3C','H','CH3','H'],cap:'Z-but-2-ene'},{g:['H3C','H','H','CH3'],cap:'E-but-2-ene'}]},
  `For but-2-ene, CH<sub>3</sub> (C, atomic number 6) beats H (atomic number 1) on both carbons.`,
  {tip:`Compare the atom joined directly to the double-bond carbon, not the size of the group. Cl (17) beats CH<sub>3</sub> (6) even though CH<sub>3</sub> looks bigger on paper. If the first atoms are the same, move to the next atoms out.`,t:'Common mistake'}),
 Q(`Is this isomer of 1,2-dichloroethene E or Z?`,[
  [`Z`,true,`Correct. Cl beats H on each carbon, and the two Cl atoms are on the same side.`],
  [`E`,false,`The higher-priority groups (Cl) are both on the top, which is the same side. Same side = Z.`],
  [`Neither: it has no E/Z isomers`,false,`Each carbon has H and Cl, which are different, so E/Z isomers exist.`],
  [`It depends on how you rotate the molecule`,false,`The double bond cannot rotate, so the arrangement is fixed.`]],
  `Same side = Z.`,{mols:[{g:['Cl','H','Cl','H']}]}),
 Q(`Is this isomer E or Z?`,[
  [`E`,true,`Correct. On the left, Br (35) beats H. On the right, Cl (17) beats CH<sub>3</sub> (6). Br is on top and Cl is on the bottom: opposite sides.`],
  [`Z`,false,`It looks like Br and CH<sub>3</sub> are the "big" groups on the same side, but on the right Cl has the higher atomic number. Br and Cl are on opposite sides.`],
  [`It has no E/Z isomers`,false,`Each carbon has two different groups, so E/Z isomers exist.`],
  [`Z, because CH<sub>3</sub> has more atoms than Cl`,false,`Priority depends on the atomic number of the atom directly attached: Cl is 17, the C of CH<sub>3</sub> is 6.`]],
  `Compare atomic numbers of the directly attached atoms on each carbon.`,{mols:[{g:['Br','H','CH3','Cl']}]}),
 Q(`Why does E/Z isomerism exist in alkenes but not in alkanes?`,[
  [`Rotation about a C=C double bond is restricted`,true,`Correct. Single bonds rotate freely, so any arrangement can turn into any other.`],
  [`Alkenes have more hydrogen atoms`,false,`Alkenes have fewer H atoms than alkanes. The reason is restricted rotation.`],
  [`The double bond is polar`,false,`C=C in a hydrocarbon is not polar. E/Z isomerism is about shape, not polarity.`],
  [`Alkanes do not have structural isomers`,false,`Alkanes do have structural isomers, but not E/Z stereoisomers, because their C–C bonds rotate freely.`]],
  `No rotation about C=C → two fixed arrangements.`)
 ]},

{id:'bromine',grp:'Addition reactions',short:'Electrophiles & bromine',title:'Electrophilic addition and the bromine test',spec:'3.3.4.2',
 intro:'What addition means, what an electrophile is, and the test for a C=C bond.',
 steps:[
 L('Addition reactions',
  `In an <strong>addition</strong> reaction, two atoms or groups add across the C=C double bond. The double bond becomes a single bond and there is <strong>only one product</strong>. The product is saturated.`,
  {eq:'CH2=CH2 + Br2 → CH2BrCH2Br',tag:'Ethene + bromine → 1,2-dibromoethane',key:true},
  `Compare substitution (alkanes): something is swapped and there are two products. In addition, nothing leaves.`),
 L('What is an electrophile?',
  `An <strong>electrophile</strong> is an <strong>electron pair acceptor</strong>. It is electron-deficient, often with a δ+ atom, so it is attracted to the electron-rich C=C.`,
  `<ul><li><strong>HBr</strong>: H–Br is polar, with H<sup>δ+</sup>.</li><li><strong>H₂SO₄</strong>: has H<sup>δ+</sup> atoms.</li><li><strong>Br₂</strong>: non-polar on its own, but the electron-rich double bond repels the electrons in Br–Br as it approaches, <strong>inducing</strong> a dipole. The nearer Br becomes δ+.</li></ul>`,
  `So the reactions of alkenes are called <strong>electrophilic addition</strong>. Compare halogenoalkanes, which are attacked by <em>nucleophiles</em> (electron pair donors).`,
  {tip:`Nucleophiles are attracted to δ+ carbon (halogenoalkanes). Electrophiles are attracted to electron-rich C=C (alkenes). Same idea, opposite direction.`,t:'Link to halogenoalkanes'}),
 Q(`What is an electrophile?`,[
  [`An electron pair acceptor`,true,`Correct. It is attracted to regions of high electron density such as C=C.`],
  [`An electron pair donor`,false,`That is a nucleophile, such as OH<sup>−</sup>, which attacks halogenoalkanes.`],
  [`A species with an unpaired electron`,false,`That is a radical, as in free radical substitution.`],
  [`A negatively charged ion`,false,`Negative ions are usually nucleophiles. Electrophiles are electron-deficient.`]],
  `Electrophile = electron pair acceptor, attracted to C=C.`),
 L('The test for alkenes: bromine water',
  `Shake the compound with <strong>bromine water</strong>.`,
  {table:{head:['Compound','Observation'],rows:[
   ['Alkene','Orange → <strong>colourless</strong>'],
   ['Alkane','Stays orange']]}},
  `The bromine adds across the double bond, so the orange Br<sub>2</sub> is used up. The product has two Br atoms on <strong>adjacent</strong> carbons:`,
  {eq:'CH3CH=CH2 + Br2 → CH3CHBrCH2Br',tag:'Propene → 1,2-dibromopropane',key:true},
  {eq:'C6H10 + Br2 → C6H10Br2',tag:'Cyclohexene → 1,2-dibromocyclohexane'},
  {tip:`Write "colourless", not "clear". A solution can be clear and still coloured: bromine water is clear and orange.`,t:'Exam phrase'}),
 Q(`What is observed when bromine water is shaken with cyclohexene?`,[
  [`Orange to colourless`,true,`Correct.`],
  [`Orange to clear`,false,`"Clear" means see-through; bromine water is already clear. The mark needs "colourless".`],
  [`Colourless to orange`,false,`This is backwards. Bromine water starts orange and is decolourised.`],
  [`Stays orange`,false,`That is what happens with an alkane such as cyclohexane. Cyclohexene has a C=C.`]],
  `Alkene: orange → colourless.`),
 Q(`What is the product when but-2-ene reacts with bromine?`,[
  [`2,3-dibromobutane, [[CH3CHBrCHBrCH3]]`,true,`Correct. Br adds to each carbon of the double bond, carbons 2 and 3.`],
  [`1,2-dibromobutane`,false,`The Br atoms go on the two carbons that formed the double bond. In but-2-ene those are carbons 2 and 3.`],
  [`2-bromobutane + HBr`,false,`That would be substitution. Alkenes undergo addition: both Br atoms add and there is one product.`],
  [`2,2-dibromobutane`,false,`One Br adds to each carbon of the C=C, so they end up on adjacent carbons, not the same one.`]],
  `Bromine adds one Br to each carbon of the C=C.`),
 Q(`Why can a non-polar Br<sub>2</sub> molecule act as an electrophile?`,[
  [`The electron-rich C=C repels the electrons in Br–Br, inducing a dipole`,true,`Correct. The Br nearer the double bond becomes δ+.`],
  [`Bromine is always polar`,false,`Br–Br joins two identical atoms, so on its own it is non-polar.`],
  [`Bromine forms Br<sup>+</sup> ions in water`,false,`Bromine does not simply ionise into Br<sup>+</sup>. The dipole is induced by the double bond.`],
  [`The alkene donates a hydrogen atom to bromine`,false,`No hydrogen moves in this reaction. Both Br atoms add to the alkene.`]],
  `The C=C induces a dipole in Br<sub>2</sub>.`)
 ]},

{id:'hbr',grp:'Addition reactions',short:'Hydrogen bromide',title:'Adding hydrogen bromide: major and minor products',spec:'3.3.4.2',
 intro:'Making halogenoalkanes from alkenes, and predicting which product wins.',
 steps:[
 L('Alkene + hydrogen halide',
  `Hydrogen halides (HBr, HCl, HI) add across the C=C at room temperature. H goes to one carbon, Br goes to the other.`,
  {eq:'CH2=CH2 + HBr → CH3CH2Br',tag:'Ethene → bromoethane',key:true},
  `A <strong>symmetrical</strong> alkene has the same groups on each carbon of the double bond, so it does not matter which way round H and Br add. There is only one product:`,
  {eq:'CH3CH=CHCH3 + HBr → CH3CHBrCH2CH3',tag:'But-2-ene → 2-bromobutane only'}),
 Q(`What is the product when ethene reacts with hydrogen chloride?`,[
  [`Chloroethane, [[CH3CH2Cl]]`,true,`Correct. H adds to one carbon and Cl to the other.`],
  [`1,2-dichloroethane, [[CH2ClCH2Cl]]`,false,`That needs Cl<sub>2</sub>. HCl adds one H and one Cl.`],
  [`Chloroethene, [[CH2=CHCl]]`,false,`In addition the double bond becomes a single bond; it does not survive.`],
  [`Chloroethane and hydrogen`,false,`Addition gives one product only. Nothing leaves.`]],
  `Alkene + HX → halogenoalkane.`),
 L('Unsymmetrical alkenes: two possible products',
  `Propene is <strong>unsymmetrical</strong>: the two carbons of the double bond carry different groups. HBr can add two ways round, giving two products in different amounts:`,
  {eq:'CH3CH=CH2 + HBr → CH3CHBrCH3',tag:'Major product: 2-bromopropane',key:true},
  {eq:'CH3CH=CH2 + HBr → CH3CH2CH2Br',tag:'Minor product: 1-bromopropane',key:true},
  `<strong>Rule for the major product:</strong> the H atom adds to the double-bond carbon that <strong>already has more H atoms</strong>. The Br goes to the carbon with more carbon (alkyl) groups attached.`,
  `<strong>Why?</strong> The reaction goes through a positively charged intermediate called a <strong>carbocation</strong>. Alkyl groups push electron density towards a positive carbon and stabilise it, so stability runs <strong>tertiary &gt; secondary &gt; primary</strong>. The major product comes from the more stable carbocation. You will see exactly how in the mechanism lessons.`),
 Q(`What is the <em>major</em> product when propene reacts with HBr?`,[
  [`2-bromopropane`,true,`Correct. H adds to CH<sub>2</sub> (the carbon with more H), Br adds to the middle carbon.`],
  [`1-bromopropane`,false,`This forms, but as the minor product. It comes from the less stable primary carbocation.`],
  [`1,2-dibromopropane`,false,`That is the product with Br<sub>2</sub>. HBr adds one H and one Br.`],
  [`They form in equal amounts`,false,`The two carbocations differ in stability, so one product is formed in much greater amounts.`]],
  `H to the carbon with more H; Br to the carbon with more alkyl groups.`),
 Q(`Why is 2-bromopropane the major product?`,[
  [`It forms from a secondary carbocation, which is more stable than the primary one`,true,`Correct. Two alkyl groups stabilise the positive carbon in the secondary carbocation.`],
  [`Bromine prefers carbon atoms with more hydrogen atoms`,false,`This is the wrong way round. H goes to the carbon with more H; Br goes to the other one.`],
  [`2-bromopropane is a more stable molecule than 1-bromopropane`,false,`The product ratio is decided by the intermediate, not by the stability of the final products.`],
  [`The primary carbocation is more stable`,false,`Primary carbocations are the least stable: they have only one alkyl group to stabilise them.`]],
  `Carbocation stability: tertiary > secondary > primary.`),
 Q(`2-methylpropene, [[(CH3)2C=CH2]], reacts with HBr. Which is the major product?`,[
  [`2-bromo-2-methylpropane, [[(CH3)3CBr]]`,true,`Correct. This comes from a tertiary carbocation, the most stable kind.`],
  [`1-bromo-2-methylpropane, [[(CH3)2CHCH2Br]]`,false,`This is the minor product, from a primary carbocation.`],
  [`1,2-dibromo-2-methylpropane`,false,`That is the bromine product. HBr adds one H and one Br.`],
  [`2-methylpropane`,false,`That would need hydrogen, H<sub>2</sub>, not HBr.`]],
  `Tertiary carbocation → major product.`),
 Q(`Which alkene gives only <em>one</em> product with HBr?`,[
  [`but-2-ene`,true,`Correct. It is symmetrical, so both ways round give 2-bromobutane.`],
  [`propene`,false,`Propene is unsymmetrical, so it gives 2-bromopropane (major) and 1-bromopropane (minor).`],
  [`but-1-ene`,false,`But-1-ene is unsymmetrical: it gives 2-bromobutane (major) and 1-bromobutane (minor).`],
  [`2-methylpropene`,false,`It is unsymmetrical: one carbon has two H atoms, the other two CH<sub>3</sub> groups.`]],
  `Symmetrical alkene → one product.`)
 ]},

{id:'water',grp:'Addition reactions',short:'Sulfuric acid & steam',title:'Making alcohols: sulfuric acid and steam',spec:'3.3.4.2 · 3.3.5.2',
 intro:'Two ways of adding water across a C=C, one in the lab and one in industry.',
 steps:[
 L('Adding concentrated sulfuric acid',
  `Alkenes react with <strong>cold, concentrated sulfuric acid</strong>. Treat [[H2SO4]] as H–OSO<sub>2</sub>OH: the H adds to one carbon and the OSO<sub>2</sub>OH group adds to the other, just like H and Br.`,
  {eq:'CH2=CH2 + H2SO4 → CH3CH2OSO2OH',tag:'Stage 1: ethene → ethyl hydrogensulfate',key:true},
  `Then add water and warm. The hydrogensulfate is <strong>hydrolysed</strong> to an alcohol and the sulfuric acid is regenerated:`,
  {eq:'CH3CH2OSO2OH + H2O → CH3CH2OH + H2SO4',tag:'Stage 2: hydrolysis → ethanol',key:true},
  `Add the two stages and cancel [[H2SO4]]:`,
  {eq:'CH2=CH2 + H2O → CH3CH2OH',tag:'Overall'},
  `The sulfuric acid is used in stage 1 and given back in stage 2, so overall it acts as a <strong>catalyst</strong>.`),
 Q(`What is formed when ethene reacts with cold, concentrated sulfuric acid?`,[
  [`Ethyl hydrogensulfate, [[CH3CH2OSO2OH]]`,true,`Correct. H adds to one carbon and OSO<sub>2</sub>OH to the other.`],
  [`Ethanol`,false,`Ethanol forms in the second stage, when water is added and the mixture warmed.`],
  [`Ethane and SO<sub>3</sub>`,false,`Addition gives one product. The whole H<sub>2</sub>SO<sub>4</sub> molecule adds across the double bond.`],
  [`Ethyl sulfate and hydrogen`,false,`No hydrogen gas forms. The H from the acid bonds to carbon.`]],
  `Stage 1 makes an alkyl hydrogensulfate.`),
 Q(`What is the role of sulfuric acid in converting ethene into ethanol overall?`,[
  [`Catalyst: it is used in stage 1 and regenerated in stage 2`,true,`Correct.`],
  [`Reactant: it is used up`,false,`Look at stage 2: H<sub>2</sub>SO<sub>4</sub> is a product. Overall it is not consumed.`],
  [`Dehydrating agent`,false,`Concentrated sulfuric acid can dehydrate alcohols, but here water is added overall, not removed.`],
  [`Solvent`,false,`It reacts chemically in stage 1, so it is more than a solvent.`]],
  `Used then regenerated = catalyst.`),
 L('Unsymmetrical alkenes again',
  `With propene, the same major/minor rule applies. The OSO<sub>2</sub>OH goes to the middle carbon (secondary carbocation), so the major alcohol is propan-2-ol:`,
  {eq:'CH3CH=CH2 + H2SO4 → CH3CH(OSO2OH)CH3',tag:'Major intermediate'},
  {eq:'CH3CH(OSO2OH)CH3 + H2O → CH3CH(OH)CH3 + H2SO4',tag:'Propan-2-ol (major)',key:true}),
 Q(`Propene is reacted with cold concentrated sulfuric acid, then warmed with water. What is the main organic product?`,[
  [`Propan-2-ol`,true,`Correct. The OH ends up where the OSO<sub>2</sub>OH went: the middle carbon.`],
  [`Propan-1-ol`,false,`This is the minor product. It forms from the less stable primary carbocation.`],
  [`Propene`,false,`Propene is the starting material. It has been converted into an alcohol.`],
  [`Propane-1,2-diol`,false,`Only one OH is added: water adds H and OH across the double bond.`]],
  `Same rule as HBr: the major product comes from the secondary carbocation.`),
 L('Industrial hydration: steam',
  `Industry makes ethanol directly by reacting ethene with <strong>steam</strong>:`,
  {eq:'CH2=CH2 + H2O ⇌ CH3CH2OH',cond:'H3PO4 catalyst',tag:'Direct hydration',key:true},
  {table:{head:['Condition','Value'],rows:[
   ['Catalyst','Phosphoric acid, H₃PO₄, on a silica support'],
   ['Temperature','About 300 °C'],
   ['Pressure','About 6–7 MPa (60–70 atm)']]}},
  `The reaction is reversible and only about 5% of the ethene converts on each pass. Unreacted ethene is separated and recycled, so the overall conversion is about 95%.`,
  `Hydration is an addition reaction with one product, so its <strong>atom economy is 100%</strong>.`),
 Q(`Which conditions are used for the industrial hydration of ethene?`,[
  [`Steam, phosphoric acid catalyst, about 300 °C and 6 MPa`,true,`Correct.`],
  [`Cold concentrated sulfuric acid, then water`,false,`That is the two-stage laboratory method.`],
  [`Aqueous NaOH, warm`,false,`Aqueous NaOH converts halogenoalkanes into alcohols. It does not react with alkenes.`],
  [`Zeolite catalyst, 450 °C, slight pressure`,false,`These are catalytic cracking conditions.`]],
  `Steam, H<sub>3</sub>PO<sub>4</sub>, 300 °C, 6–7 MPa.`),
 Q(`What is the atom economy of [[CH2=CH2 + H2O → CH3CH2OH]]?`,[
  [`100%`,true,`Correct. All the atoms in the reactants end up in the single desired product.`],
  [`About 5%`,false,`5% is the conversion per pass through the reactor. Atom economy is a different idea: it compares masses in the equation.`],
  [`About 95%`,false,`95% is the overall conversion with recycling. Atom economy depends only on the equation.`],
  [`50%`,false,`There are two reactants but only one product, and it contains every atom.`]],
  `Addition reactions with one product have 100% atom economy.`)
 ]},

{id:'poly',grp:'Polymers',short:'Addition polymers',title:'Addition polymers',spec:'3.3.4.3',
 intro:'Joining alkenes into chains, drawing repeat units, and why polymer properties differ.',
 steps:[
 L('Monomer to polymer',
  `Alkenes can join together into very long chains called <strong>addition polymers</strong>. Each alkene is a <strong>monomer</strong>. The double bond opens and the carbons bond to neighbouring monomers.`,
  {eq:'nCH2=CH2 → –[CH2–CH2]n–',tag:'Ethene → poly(ethene)',key:true},
  {mols:[{g:['H','H','H','H'],cap:'ethene (monomer)'},{t:'ru',g:['H','H','H','H'],cap:'repeat unit of poly(ethene)'}],join:'→',jl:'n ×'},
  `The polymer is named <strong>poly(</strong>monomer name<strong>)</strong>. Like any addition product, the polymer is saturated: there is no double bond left.`),
 L('Drawing repeat units from substituted alkenes',
  `Substituted alkenes polymerise the same way. The two carbons of the C=C become the <strong>two-carbon backbone</strong> of the repeat unit. Every other group hangs off the backbone.`,
  {mols:[{g:['H','H','CH3','H'],cap:'propene'},{t:'ru',g:['H','H','CH3','H'],cap:'poly(propene)'}],join:'→',jl:'n ×'},
  {mols:[{g:['H','H','Cl','H'],cap:'chloroethene'},{t:'ru',g:['H','H','Cl','H'],cap:'poly(chloroethene), PVC'}],join:'→',jl:'n ×'},
  `Steps for drawing a repeat unit:`,
  `<ol><li>Draw the two C=C carbons with a <strong>single</strong> bond between them.</li><li>Put the other groups above and below, in the same positions as in the monomer.</li><li>Add bonds sticking out from each end, through the brackets.</li><li>Write <strong>n</strong> after the bracket.</li></ol>`,
  {tip:`The CH<sub>3</sub> in propene is <strong>not</strong> part of the backbone. A repeat unit from one alkene monomer always has exactly two carbons in the main chain.`,t:'Common mistake'}),
 Q(`What is the repeat unit of poly(propene)?`,[
  [`[[–[CH2–CH(CH3)]–]]`,true,`Correct. Two-carbon backbone with CH<sub>3</sub> as a branch.`],
  [`[[–[CH2–CH2–CH2]–]]`,false,`The CH<sub>3</sub> group is a branch. Only the two C=C carbons form the backbone.`],
  [`[[–[CH2=CH(CH3)]–]]`,false,`The double bond opens during polymerisation. The repeat unit has a single C–C bond.`],
  [`[[–[CH3–CH–CH2]–]]`,false,`This puts all three carbons in the chain. CH<sub>3</sub> cannot be part of a chain: its carbon already has three H atoms.`]],
  `Two-carbon backbone; substituents hang off it.`),
 Q(`A polymer has the repeat unit [[–[CH2–CHCl]–]]. What is the monomer?`,[
  [`Chloroethene, [[CH2=CHCl]]`,true,`Correct. Put a double bond between the two backbone carbons and remove the end bonds.`],
  [`Chloroethane, [[CH3CH2Cl]]`,false,`Chloroethane has no C=C, so it cannot polymerise by addition.`],
  [`Ethene and chlorine`,false,`An addition polymer comes from one alkene monomer containing all the atoms of the repeat unit.`],
  [`1,2-dichloroethene`,false,`The repeat unit has only one Cl atom.`]],
  `Working backwards: backbone C–C becomes C=C.`),
 Q(`A sample of poly(ethene) has a relative molecular mass of 28 000. How many ethene monomers joined to make each chain? (M<sub>r</sub> of [[C2H4]] = 28)`,[
  [`1000`,true,`Correct. 28 000 ÷ 28 = 1000. No atoms are lost in addition polymerisation.`],
  [`500`,false,`You may have divided by 56. Each repeat unit is one ethene molecule, M<sub>r</sub> 28.`],
  [`2000`,false,`One repeat unit comes from one ethene molecule, not half of one.`],
  [`28 000`,false,`Divide the polymer mass by the mass of one monomer.`]],
  `Polymer M<sub>r</sub> = n × monomer M<sub>r</sub>.`),
 L('Properties of addition polymers',
  `Poly(alkenes) are <strong>unreactive</strong>. They are saturated, and their C–C and C–H bonds are strong and non-polar. That makes them useful for containers and packaging, but it also means they are <strong>not biodegradable</strong>.`,
  `The forces <em>between</em> chains decide how strong or flexible a polymer is.`,
  `<ul><li>Longer chains have stronger van der Waals forces between them.</li><li><strong>PVC</strong> contains polar C–Cl bonds, so there are <strong>permanent dipole–dipole</strong> forces between chains. Pure PVC is hard and rigid: used for pipes and window frames.</li><li>Adding a <strong>plasticiser</strong> puts small molecules between the chains. They push the chains apart and <strong>weaken the intermolecular forces</strong>, so the chains slide past each other. Plasticised PVC is flexible: used for cable insulation and clothing.</li></ul>`,
  {tip:`Polymer waste can go to landfill (it does not break down), be incinerated (releases energy, but burning PVC gives toxic HCl that must be removed) or be recycled (sorted, melted and remoulded).`,t:'Disposal'}),
 Q(`Why does adding a plasticiser make PVC flexible?`,[
  [`Plasticiser molecules get between the chains and weaken the intermolecular forces, so chains slide more easily`,true,`Correct.`],
  [`It breaks the C–C bonds in the chains`,false,`The polymer chains stay intact. The plasticiser only affects forces between chains.`],
  [`It forms covalent cross-links between chains`,false,`Cross-links would make the polymer more rigid, not more flexible.`],
  [`It removes the chlorine atoms`,false,`The PVC is chemically unchanged. The plasticiser just separates the chains.`]],
  `Plasticiser: chains pushed apart, weaker intermolecular forces.`),
 Q(`Why are poly(alkenes) unreactive?`,[
  [`They are saturated and contain only strong, non-polar C–C and C–H bonds`,true,`Correct.`],
  [`They still contain C=C double bonds, which are very strong`,false,`The double bonds open during polymerisation, so the polymer has none left.`],
  [`They have very high relative molecular masses`,false,`Size alone does not make a substance unreactive. It is the bonding.`],
  [`They are ionic`,false,`Polymers are covalent molecules, not ionic compounds.`]],
  `Saturated, strong non-polar bonds → unreactive → non-biodegradable.`)
 ]},

{id:'mix',grp:'Review',short:'Which reagent?',title:'Choosing the reagent: mixed review',spec:'3.3.4 · 3.3.3',
 intro:'Bringing the alkene reactions together, and linking them back to halogenoalkanes.',
 steps:[
 L('Summary of alkene reactions',
  {table:{head:['Reagent','Conditions','Product (from ethene)'],rows:[
   ['Br₂ (or bromine water)','Room temperature','1,2-dibromoethane'],
   ['HBr','Room temperature','Bromoethane'],
   ['Conc. H₂SO₄, then H₂O','Cold acid, then warm with water','Ethyl hydrogensulfate, then ethanol'],
   ['Steam','H₃PO₄ catalyst, 300 °C, 6–7 MPa','Ethanol'],
   ['Ethene itself','Polymerisation','Poly(ethene)']]}},
  `Alkenes and halogenoalkanes link together:`,
  `<ul><li>alkene → halogenoalkane: add HBr</li><li>halogenoalkane → alkene: KOH in ethanol, hot (elimination)</li><li>halogenoalkane → alcohol: NaOH(aq), warm (substitution)</li></ul>`,
  {eq:'CH3CH2Br + KOH → CH2=CH2 + KBr + H2O',tag:'Elimination makes the alkene back'}),
 Q(`Which reagent turns but-2-ene into 2-bromobutane?`,[
  [`HBr`,true,`Correct. H adds to one carbon and Br to the other.`],
  [`Br<sub>2</sub>`,false,`Bromine adds two Br atoms, giving 2,3-dibromobutane.`],
  [`Br<sup>−</sup> ions in water`,false,`Bromide ions are nucleophiles and are not attracted to the electron-rich C=C.`],
  [`Bromine in UV light`,false,`UV is used for free radical substitution of alkanes.`]],
  `Alkene + HBr → bromoalkane.`),
 Q(`Which is a correct two-step route from ethene to ethylamine, [[CH3CH2NH2]]?`,[
  [`Step 1: HBr. Step 2: excess NH<sub>3</sub> in ethanol, heated in a sealed tube`,true,`Correct. Ethene → bromoethane → ethylamine.`],
  [`Step 1: Br<sub>2</sub>. Step 2: excess NH<sub>3</sub>`,false,`Br<sub>2</sub> gives 1,2-dibromoethane, which has two Br atoms. You would not get ethylamine.`],
  [`Step 1: HBr. Step 2: KOH in ethanol`,false,`KOH in ethanol eliminates HBr and gives ethene back.`],
  [`Step 1: steam and H<sub>3</sub>PO<sub>4</sub>. Step 2: NH<sub>3</sub>`,false,`This makes ethanol. Alcohols do not react with ammonia to give amines under these conditions.`]],
  `Make the halogenoalkane first, then substitute.`),
 Q(`How could you distinguish hexane from hex-1-ene?`,[
  [`Shake with bromine water: hex-1-ene turns it colourless; hexane leaves it orange`,true,`Correct.`],
  [`Add aqueous silver nitrate: hex-1-ene gives a precipitate`,false,`Silver nitrate tests for halide ions. Neither compound contains a halogen.`],
  [`Add sodium hydroxide: hexane reacts`,false,`Neither compound reacts with NaOH(aq).`],
  [`Burn them: only hexane gives CO<sub>2</sub>`,false,`Both are hydrocarbons and both give CO<sub>2</sub> when burned.`]],
  `Bromine water: the test for C=C.`),
 Q(`Identify X: [[C3H6 + X → C3H8O]]`,[
  [`[[H2O]], as steam with a phosphoric acid catalyst`,true,`Correct. Adding H<sub>2</sub>O to propene gives propanol, C<sub>3</sub>H<sub>8</sub>O.`],
  [`[[O2]]`,false,`Count the atoms: C<sub>3</sub>H<sub>8</sub>O − C<sub>3</sub>H<sub>6</sub> = H<sub>2</sub>O, not O<sub>2</sub>.`],
  [`[[H2]]`,false,`That would give propane, C<sub>3</sub>H<sub>8</sub>, with no oxygen.`],
  [`NaOH(aq)`,false,`NaOH(aq) does not react with alkenes. It converts halogenoalkanes into alcohols.`]],
  `Subtract the formulas to find what was added.`),
 Q(`But-1-ene reacts with HBr. Which statement is correct?`,[
  [`The major product is 2-bromobutane; 1-bromobutane is the minor product`,true,`Correct. The major product comes from the secondary carbocation.`],
  [`The only product is 1-bromobutane`,false,`But-1-ene is unsymmetrical, so two products form, and 1-bromobutane is the minor one.`],
  [`The major product is 1,2-dibromobutane`,false,`HBr adds one H and one Br, not two Br atoms.`],
  [`The products are but-2-ene and HBr`,false,`HBr adds to the alkene. Nothing is eliminated.`]],
  `Unsymmetrical alkene → major product from the more stable carbocation.`)
 ]}
];

function save(){ try{ localStorage.setItem(KEY,JSON.stringify({p:P,v:view})); }catch(e){} }
function sp(id){ if(!P[id]) P[id]={u:1,a:{}}; return P[id]; }

function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function order(n,seed){ const a=[...Array(n).keys()]; let x=seed||1; for(let i=n-1;i>0;i--){ x=(Math.imul(x,1103515245)+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function secStats(sec){
  const pr=P[sec.id]; const checks=sec.steps.map((s,i)=>[s,i]).filter(([s])=>s.k==='check');
  let first=0, solved=0;
  checks.forEach(([s,i])=>{ const a=pr&&pr.a[i]; if(a&&a.s){ solved++; if(!a.w.length) first++; } });
  const done = pr && pr.u>=sec.steps.length && (sec.steps[sec.steps.length-1].k!=='check' || (pr.a[sec.steps.length-1]||{}).s);
  return {total:checks.length, first, solved, done:!!done, started:!!pr};
}

/* ---------- figures ---------- */

    <text x="292" y="${y+13}" font-family="JetBrains Mono, monospace" font-size="11.5" fill="var(--muted)">${f[1].replace(/(\d+)/g,'$1')}  ·  ${f[2]}</text>`; });
  s+=`<rect x="20" y="380" width="96" height="46" rx="6" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.5"/>
  <text x="68" y="399" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="12.5" font-weight="700" fill="var(--ink)">Furnace</text>
  <text x="68" y="415" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="var(--muted)">about 350 °C</text>
  <line x1="116" y1="392" x2="146" y2="392" stroke="var(--ink)" stroke-width="2"/><path d="M144 388 L151 392 L144 396" fill="var(--ink)"/>
  <text x="68" y="372" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="11.5" fill="var(--muted)">crude oil vapour</text>
  <line x1="40" y1="330" x2="40" y2="60" stroke="var(--muted)" stroke-width="1.5"/><path d="M36 64 L40 52 L44 64" fill="var(--muted)"/>
  <text x="54" y="70" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">cooler</text>
  <text x="54" y="86" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">~25 °C</text>
  <text x="54" y="318" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">hotter</text>
  <text x="54" y="334" font-family="Atkinson Hyperlegible, sans-serif" font-size="12" fill="var(--muted)">~350 °C</text>
  </svg>`;
  return `<figure>${s}<figcaption>Chain lengths are approximate; textbooks quote slightly different ranges. Smaller molecules leave higher up.</figcaption></figure>`;
}
function figBonds(){
  const b=[['C–F',467,'most polar'],['C–Cl',346,''],['C–Br',290,''],['C–I',228,'weakest']];
  return `<div class="bonds" aria-label="Mean bond enthalpies">${b.map(x=>`<div class="row"><b>${x[0]}</b><div class="track"><i style="width:${(x[1]/467*100).toFixed(1)}%"></i></div><span>${x[1]} kJ mol<sup>−1</sup></span></div>`).join('')}</div><p style="font-size:14px;color:var(--muted);margin-top:-6px">Mean bond enthalpies. Values vary slightly between data sources.</p>`;
}

/* ---------- structure drawings ---------- */
function lab(x,y,t,anc){
  let o=`<text x="${x}" y="${y}" text-anchor="${anc}" dominant-baseline="middle" style="fill:var(--ink);font-family:var(--f-chem);font-size:15px">`, off=0;
  (t.match(/\d+|[^\d]+/g)||[]).forEach(r=>{ const d=/^\d/.test(r); const ny=d?4:0; o+=`<tspan dy="${ny-off}"${d?' style="font-size:11px"':''}>${r}</tspan>`; off=ny; });
  return o+'</text>';
}
const LN=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--ink);stroke-width:1.8;stroke-linecap:round"/>`;
function alkeneSVG(g){ // g = [top-left, bottom-left, top-right, bottom-right]
  return `<svg viewBox="0 0 230 130" role="img" aria-label="Displayed formula">${lab(85,65,'C','middle')}${lab(145,65,'C','middle')}
  ${LN(95,60,135,60)}${LN(95,70,135,70)}${LN(78,57,62,39)}${LN(78,73,62,91)}${LN(152,57,168,39)}${LN(152,73,168,91)}
  ${lab(60,30,g[0],'end')}${lab(60,101,g[1],'end')}${lab(170,30,g[2],'start')}${lab(170,101,g[3],'start')}</svg>`;
}
function ruSVG(g){ // g = [top1, bottom1, top2, bottom2]
  return `<svg viewBox="0 0 240 132" role="img" aria-label="Repeat unit">${lab(95,66,'C','middle')}${lab(150,66,'C','middle')}
  ${LN(28,66,86,66)}${LN(104,66,141,66)}${LN(159,66,214,66)}${LN(95,56,95,34)}${LN(95,76,95,98)}${LN(150,56,150,34)}${LN(150,76,150,98)}
  ${lab(95,23,g[0],'middle')}${lab(95,110,g[1],'middle')}${lab(150,23,g[2],'middle')}${lab(150,110,g[3],'middle')}
  <path d="M64 14 L56 14 L56 118 L64 118" style="fill:none;stroke:var(--ink);stroke-width:1.8"/><path d="M180 14 L188 14 L188 118 L180 118" style="fill:none;stroke:var(--ink);stroke-width:1.8"/>
  ${lab(196,122,'n','start')}</svg>`;
}
function molRow(b){
  return `<div class="mols">${b.mols.map((m,i)=>(i&&b.join?`<div class="join">${b.jl?`<small>${b.jl}</small>`:''}${b.join}</div>`:'')+`<figure>${m.t==='ru'?ruSVG(m.g):alkeneSVG(m.g)}${m.cap?`<figcaption>${rich(m.cap)}</figcaption>`:''}</figure>`).join('')}</div>`;
}

const FIGS={column:figColumn,bonds:figBonds};

/* ---------- rendering ---------- */
function block(b){
  if(typeof b==='string') return b.trim().startsWith('<') ? rich(b) : `<p>${rich(b)}</p>`;
  if(b.eq!==undefined){
    let html;
    if(b.cond){ const ar=b.eq.includes('⇌')?'⇌':'→'; const [l,r]=b.eq.split(ar); html=fmtEq(l)+` <span class="arrow"><small>${b.cond}</small><span>${ar}</span></span> `+fmtEq(r); }
    else html=fmtEq(b.eq);
    return `<div class="eqb">${b.tag?`<div class="tag">${rich(b.tag)}</div>`:''}<div class="eq">${html}</div>${b.note?`<div class="eqnote">${rich(b.note)}</div>`:''}</div>`;
  }
  if(b.tip) return `<div class="tip"><b class="t">${b.t||'Tip'}</b>${rich(b.tip)}</div>`;
  if(b.table) return `<div class="tbl"><table><thead><tr>${b.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.fig) return (FIGS[b.fig]||(()=>''))(b);
  if(b.mols) return molRow(b);
  return '';
}

function renderRail(){
  const rail=document.getElementById('rail'); let h='', g='';
  h+=`<button class="${view==='home'?'on':''}" data-v="home"><span class="n">i</span><span>Start here</span><span class="st"></span></button>`;
  SECTIONS.forEach((s,i)=>{
    if(s.grp!==g){ g=s.grp; h+=`<div class="grp">${g}</div>`; }
    const st=secStats(s);
    const cls=[view===s.id?'on':'', st.done?'done':(st.started?'part':'')].join(' ');
    h+=`<button class="${cls}" data-v="${s.id}"><span class="n">${st.done?'✓':i+1}</span><span>${s.short}</span><span class="st">${st.solved?st.first+'/'+st.total:''}</span></button>`;
  });
  h+=`<div class="grp">Revision</div>`;
  h+=`<button class="${view==='bank'?'on':''}" data-v="bank"><span class="n">=</span><span>Equation bank</span><span class="st"></span></button>`;
  h+=`<button class="${view==='results'?'on':''}" data-v="results"><span class="n">%</span><span>My results</span><span class="st"></span></button>`;
  rail.innerHTML=h;
  rail.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.v));
  // overall
  let done=0,first=0,tot=0,solved=0; SECTIONS.forEach(s=>{const st=secStats(s); if(st.done)done++; first+=st.first; tot+=st.total; solved+=st.solved;});
  document.getElementById('ovSec').textContent=`${done} of ${SECTIONS.length} sections complete`;
  document.getElementById('ovScore').textContent= solved?`${first}/${solved} right first time`:'';
  document.getElementById('ovBar').style.width=(done/SECTIONS.length*100)+'%';
}

function go(v){ view=v; save(); render(); window.scrollTo({top:0}); }

function renderHome(){
  const next=SECTIONS.find(s=>!secStats(s).done);
  return `<div class="home"><div class="sechead"><div class="spec">How this guide works</div><h2>Learn it step by step, check as you go</h2></div>
  <p class="lead">This guide covers alkenes: structure, E/Z isomerism, addition reactions and polymers, with the focus on <strong>what is happening and the overall equation</strong>. Mechanisms (curly arrows) come later, in class.</p>
  <div class="how">
   <div><h4>Read a step</h4><p>Each section is broken into short steps. Read one, then press Continue.</p></div>
   <div><h4>Answer the check</h4><p>Multiple-choice checks appear between steps. You must get each right to move on.</p></div>
   <div><h4>Learn from mistakes</h4><p>A wrong answer tells you why it is wrong. Use that to try again.</p></div>
   <div><h4>Aim for first time</h4><p>Your score counts questions you got right on the first try. Revisit sections to improve.</p></div>
  </div>
  <p>Work through the sections in order: later sections build on earlier ones. Your progress is saved in this browser.</p>
  <button class="next" id="startBtn">${next? (secStats(next).started?'Carry on: ':'Start: ')+next.title : 'Review the equation bank'} →</button></div>`;
}

function renderSection(sec){
  const pr=sp(sec.id); const idx=SECTIONS.indexOf(sec);
  let h=`<div class="sechead"><div class="spec">Section ${idx+1} · Spec ${sec.spec}</div><h2>${sec.title}</h2><p>${sec.intro}</p><div class="stepcount">Step ${Math.min(pr.u,sec.steps.length)} of ${sec.steps.length}</div></div>`;
  let ln=0;
  for(let i=0;i<pr.u && i<sec.steps.length;i++){
    const st=sec.steps[i];
    if(st.k==='learn'){ ln++; h+=`<section class="step learn" id="st${i}"><h3><span class="sn">${idx+1}.${ln}</span>${rich(st.h)}</h3>${st.b.map(block).join('')}</section>`; }
    else h+=renderCheck(sec,st,i,pr);
    const last=i===pr.u-1, solved= st.k==='learn' || (pr.a[i]&&pr.a[i].s);
    if(last && solved && i<sec.steps.length-1) h+=`<button class="next" data-cont="1">Continue →</button>`;
  }
  const stt=secStats(sec);
  if(stt.done){
    const nxt=SECTIONS[idx+1];
    h+=`<div class="finish"><h3>Section complete</h3><p>You got <strong>${stt.first} of ${stt.total}</strong> checks right first time.${stt.first<stt.total?' Look back at the ones you missed before moving on.':''}</p>
    <div class="confirm">${nxt?`<button class="next" data-go="${nxt.id}">Next: ${nxt.short} →</button>`:`<button class="next" data-go="bank">Go to the equation bank →</button>`}<button class="ghost" data-redo="${sec.id}">Redo this section</button></div></div>`;
  }
  return h;
}

function renderCheck(sec,st,i,pr){
  const a=pr.a[i]||{w:[],s:false};
  const ord=order(st.o.length,hash(sec.id+i+st.q));
  let qn=sec.steps.slice(0,i+1).filter(s=>s.k==='check').length;
  let h=`<section class="step" id="st${i}"><div class="check"><div class="clabel"><span>Check ${qn}</span><span>${a.s?(a.w.length?'Solved':'Right first time'):''}</span></div><div class="q">${rich(st.q)}</div>${st.fig?block(st.fig):''}<div class="opts">`;
  ord.forEach((oi,pos)=>{
    const o=st.o[oi]; const isW=a.w.includes(oi); const isR=a.s&&o[1];
    const cls=isW?'wrong':isR?'right':(a.s?'faded':'');
    const dis=a.s||isW;
    h+=`<button class="opt ${cls}" ${dis?'disabled':''} data-q="${i}" data-o="${oi}"><span class="let">${'ABCD'[pos]}</span><span>${rich(o[0])}</span>${(isW||isR)?`<span class="fb">${isW?'✗ ':'✓ '}${rich(o[2])}</span>`:''}</button>`;
  });
  h+=`</div>${a.s?`<div class="why"><b>Key point:</b> ${rich(st.why)}</div>`:''}</div></section>`;
  return h;
}

function renderBank(){
  let h=`<div class="sechead"><div class="spec">Revision</div><h2>Equation bank</h2><p>The key equations from every section in one place. Cover the right-hand side and try to write each one from memory.</p></div>`;
  SECTIONS.forEach((s,i)=>{
    const eqs=[]; s.steps.forEach(st=>{ if(st.k==='learn') st.b.forEach(b=>{ if(b&&b.key) eqs.push(b); }); });
    if(!eqs.length) return;
    h+=`<div class="bankgrp"><h3>${i+1}. ${s.title}</h3>${eqs.map(e=>block({eq:e.eq,cond:e.cond,tag:e.tag})).join('')}</div>`;
  });
  return h;
}

function renderResults(){
  let rows='', tf=0, tt=0, ts=0;
  SECTIONS.forEach((s,i)=>{ const st=secStats(s); tf+=st.first; tt+=st.total; ts+=st.solved;
    rows+=`<tr><td>${i+1}. ${s.short}</td><td class="num">${st.done?'Complete':st.started?'In progress':'Not started'}</td><td class="num">${st.solved}/${st.total}</td><td class="num">${st.solved?st.first+'/'+st.total:'–'}</td></tr>`; });
  return `<div class="sechead"><div class="spec">Revision</div><h2>My results</h2><p>"First time" counts checks you answered correctly with no wrong attempts. Show this page to your teacher if asked.</p></div>
  <div class="tbl"><table class="res"><thead><tr><th>Section</th><th>Status</th><th>Checks done</th><th>Right first time</th></tr></thead><tbody>${rows}
  <tr><td>Total</td><td></td><td class="num">${ts}/${tt}</td><td class="num"><strong>${tf}/${tt}</strong></td></tr></tbody></table></div>
  <div id="resetArea"><button class="ghost" id="resetBtn">Reset all progress</button></div>`;
}

function render(){
  renderRail();
  const m=document.getElementById('main');
  const sec=SECTIONS.find(s=>s.id===view);
  m.innerHTML = view==='bank'?renderBank(): view==='results'?renderResults(): sec?renderSection(sec): renderHome();
  const sb=document.getElementById('startBtn');
  if(sb) sb.onclick=()=>{ const n=SECTIONS.find(s=>!secStats(s).done); go(n?n.id:'bank'); };
  m.querySelectorAll('[data-cont]').forEach(b=>b.onclick=()=>{ const pr=sp(view); pr.u++; save(); render(); const el=document.getElementById('st'+(pr.u-1)); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
  m.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  m.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{ P[b.dataset.redo]={u:1,a:{}}; save(); render(); window.scrollTo({top:0}); });
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.o));
  const rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=()=>{ document.getElementById('resetArea').innerHTML=`<div class="confirm"><span>This clears every answer. Are you sure?</span><button class="next" id="yesReset">Yes, reset</button><button class="ghost" id="noReset">Cancel</button></div>`;
    document.getElementById('yesReset').onclick=()=>{ P={}; save(); render(); };
    document.getElementById('noReset').onclick=()=>render(); };
}

function answer(i,oi){
  const sec=SECTIONS.find(s=>s.id===view); const pr=sp(sec.id); const st=sec.steps[i];
  const a=pr.a[i]||(pr.a[i]={w:[],s:false}); if(a.s) return;
  if(st.o[oi][1]) a.s=true; else if(!a.w.includes(oi)) a.w.push(oi);
  save(); render();
  const el=document.querySelector(`.opt[data-q="${i}"][data-o="${oi}"]`); if(el && !a.s) el.focus();
  if(a.s){ const nb=document.querySelector('[data-cont]')||document.querySelector('.finish .next'); if(nb) nb.focus({preventScroll:true}); }
}

render();
</script>

</body></html>
