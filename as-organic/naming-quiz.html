<style>

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

input[type=text]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);flex:1 1 220px;min-width:0}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}

.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .let{font-family:var(--f-chem);font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--muted);font-size:12px;color:var(--muted)}
.opt .nm{font-family:var(--f-chem);font-size:15.5px;word-break:break-word}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{border-color:var(--bad);color:var(--bad)}
.opt.faded{opacity:.5}
.fb{margin-top:12px;padding:12px 14px;border-radius:6px;font-size:16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
.next{margin-top:18px;display:flex;justify-content:flex-end}
.tbl{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.m{font-family:var(--f-chem);font-size:14px}
.y{color:var(--ok);font-weight:700}.x{color:var(--bad);font-weight:700}
.big{font-family:var(--f-display);font-size:48px;font-weight:750;line-height:1;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}
</style>

['ethylamine','CCN','CH3CH2NH2','amine',[['methylamine','Count the carbons: two.'],['ethanenitrile','NH₂ is an amine group, not C≡N.'],['ethanamide','An amide also has a C=O.']],'2 C with NH₂.'],
['propylamine','CCCN','CH3CH2CH2NH2','amine',[['propanenitrile','NH₂ is an amine, not C≡N.'],['ethylamine','Count the carbons: three.'],['propanamide','An amide also has a C=O.']],'3 C with NH₂.'],
['4-chlorobutan-2-ol','CC(O)CCCl','CH3CH(OH)CH2CH2Cl','alcohol',[['1-chlorobutan-3-ol','The OH (suffix group) gets the lowest number, not the Cl.'],['2-hydroxy-4-chlorobutane','The OH gives the suffix -ol. Halogens are always prefixes.'],['4-chlorobutan-2-one','There is an OH, not a C=O.']],'OH gives the suffix and the lowest number (2). Cl on carbon 4.',1],
['but-3-en-2-ol','CC(O)C=C','CH3CH(OH)CH=CH2','alcohol',[['but-1-en-3-ol','The OH outranks the C=C, so the OH gets the lowest number.'],['butan-2-ol','There is a C=C as well.'],['but-3-ene-2-ol','The "e" of -ene is dropped before a vowel: -en-2-ol.']],'OH gives the suffix and lowest number (2). C=C starts at carbon 3.',1],
['3-bromopropanoic acid','BrCCC(=O)O','CH2BrCH2COOH','carboxylic acid',[['1-bromopropanoic acid','The COOH carbon is carbon 1.'],['2-bromopropanoic acid','Count from COOH: the Br is on carbon 3.'],['3-bromopropanal','There is an OH on the C=O carbon: COOH.']],'COOH carbon = 1. Br on carbon 3.',1],
['2-hydroxypropanoic acid','CC(O)C(=O)O','CH3CH(OH)COOH','carboxylic acid',[['3-hydroxypropanoic acid','Count from COOH: the OH is on carbon 2.'],['2-hydroxypropanal','There is an OH on the C=O carbon: COOH.'],['propan-2-ol-oic acid','The acid gives the suffix; the OH becomes the prefix hydroxy-.']],'COOH outranks OH, so OH becomes hydroxy-, on carbon 2.',1],
['prop-2-en-1-ol','C=CCO','CH2=CHCH2OH','alcohol',[['prop-1-en-3-ol','The OH gets the lowest number.'],['propan-1-ol','There is a C=C as well.'],['prop-2-enal','There is an OH, not a CHO.']],'OH at carbon 1 (suffix). C=C starts at carbon 2.',1]
];

const GROUPS=['alkane','alkene','halogenoalkane','alcohol','aldehyde','ketone','carboxylic acid','nitrile','amine'];
const CONF={alcohol:['aldehyde','carboxylic acid','ketone'],aldehyde:['ketone','alcohol','carboxylic acid'],ketone:['aldehyde','alcohol','carboxylic acid'],'carboxylic acid':['aldehyde','alcohol','ketone'],alkane:['alkene','halogenoalkane','alcohol'],alkene:['alkane','alcohol','halogenoalkane'],halogenoalkane:['alkane','alkene','amine'],nitrile:['amine','alkene','ketone'],amine:['nitrile','alcohol','halogenoalkane']};
const WHY={alkane:'Only C–C and C–H single bonds.',alkene:'There is a C=C double bond.',halogenoalkane:'A halogen atom (F, Cl, Br or I) is bonded to carbon.',alcohol:'An –OH on a carbon that has no C=O.',aldehyde:'A C=O at the end of the chain (–CHO).',ketone:'A C=O with a carbon on each side.','carboxylic acid':'A C=O and an OH on the same carbon (–COOH).',nitrile:'A C≡N triple bond.',amine:'An –NH₂ group.'};
const SYN={alkane:['alkane','cycloalkane'],alkene:['alkene','cycloalkene'],halogenoalkane:['halogenoalkane','haloalkane','bromoalkane','chloroalkane','iodoalkane','fluoroalkane','alkylhalide'],alcohol:['alcohol','primaryalcohol','secondaryalcohol','tertiaryalcohol','hydroxyl','hydroxy'],aldehyde:['aldehyde'],ketone:['ketone'],'carboxylic acid':['carboxylicacid','carboxylic','carboxyl'],nitrile:['nitrile'],amine:['amine','primaryamine']};

/* ---------- helpers ---------- */
function fmtF(t){ let o='',i=0; while(i<t.length){ const c=t[i]; if(/\d/.test(c)&&i>0&&/[A-Za-z)]/.test(t[i-1])){ let d=''; while(i<t.length&&/\d/.test(t[i])){d+=t[i];i++;} o+='<sub>'+d+'</sub>'; continue;} o+=c; i++; } return o; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lev(a,b){ const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let p=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return d[b.length]; }
function norm(s){ return s.toLowerCase().replace(/[^a-z]/g,'').replace(/s$/,''); }
function matchGroup(txt){
  const n=norm(txt); if(!n) return null;
  let best=null,bd=99;
  for(const g of GROUPS) for(const s of SYN[g]){ const d=lev(n,s); const tol=s.length>=8?2:s.length>=6?1:0; if(d<=tol && d<bd){ best=g; bd=d; } }
  return best;
}
const store={ get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };

/* ---------- state ---------- */
let S=Object.assign({gmode:'type',view:'mix',len:10,groups:GROUPS.slice()}, store.get('naming-quiz-settings')||{});
let R=null; // round
const app=document.getElementById('app');

function setScore(){ const el=document.getElementById('score'); if(!R){ el.innerHTML=''; return; } el.innerHTML=`Question ${Math.min(R.i+1,R.qs.length)} of ${R.qs.length}<br><b>${R.pts}</b> / ${R.qs.length*2} points`; }

/* ---------- setup ---------- */
function setup(){
  R=null; setScore();
  const seg=(key,opts)=>`<div class="seg" data-key="${key}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${S[key]==v}">${l}</button>`).join('')}</div>`;
  const count=M.filter(m=>S.groups.includes(m[3])).length;
  app.innerHTML=`<div class="card">
   <h2>Set up a round</h2>
   <p class="muted">Each question shows a structure. First identify the functional group, then choose the correct name. One point for each part.</p>
   <div class="field"><span class="lbl">Part 1: answer the functional group by</span>${seg('gmode',[['type','Typing it'],['mc','Multiple choice']])}</div>
   <div class="field"><span class="lbl">Show structures as</span>${seg('view',[['skeletal','Skeletal formulae'],['structural','Structural formulae'],['mix','A mix of both']])}</div>
   <div class="field"><span class="lbl">Questions per round</span>${seg('len',[[10,'10'],[15,'15'],[20,'20']])}</div>
   <div class="field"><span class="lbl">Include these functional groups</span><div class="seg" id="gsel">${GROUPS.map(g=>`<button type="button" class="chip" data-g="${g}" aria-pressed="${S.groups.includes(g)}">${g}</button>`).join('')}</div>
   <p class="note" id="gcount">${count} molecules in the pool.</p></div>
   <button class="btn" id="go" ${count?'':'disabled'}>Start the quiz →</button></div>`;
  app.querySelectorAll('.seg[data-key] button').forEach(b=>b.onclick=()=>{ const k=b.parentNode.dataset.key; S[k]= k==='len'?+b.dataset.v:b.dataset.v; store.set('naming-quiz-settings',S); setup(); });
  app.querySelectorAll('#gsel .chip').forEach(b=>b.onclick=()=>{ const g=b.dataset.g; S.groups=S.groups.includes(g)?S.groups.filter(x=>x!==g):[...S.groups,g]; store.set('naming-quiz-settings',S); setup(); });
  document.getElementById('go').onclick=()=>start();
}

function start(pool){
  const src=pool||shuffle(M.filter(m=>S.groups.includes(m[3])));
  const qs=src.slice(0,Math.min(S.len,src.length)).map(m=>{
    const ring=m[2]===null; const v= ring?'skeletal': S.view==='mix'?(Math.random()<.5?'skeletal':'structural'):S.view;
    return {m, v, gopts:shuffle([m[3],...CONF[m[3]]]), nopts:shuffle([[m[0],null],...m[4]]), g:null, gOk:null, n:null, nOk:null};
  });
  R={qs,i:0,pts:0}; question();
}

/* ---------- question ---------- */
function drawStruct(q){
  const box=document.getElementById('struct');
  if(q.v==='structural' || typeof SmilesDrawer==='undefined'){
    box.innerHTML=`<div class="cf">${q.m[2]?fmtF(q.m[2]):'(drawing unavailable)'}</div>`;
    if(q.v==='skeletal') document.getElementById('ftype').textContent='Structural formula (skeletal drawing could not load)';
    return;
  }
  box.innerHTML='<svg id="mol"></svg>';
  const cs=getComputedStyle(document.documentElement), ink=cs.getPropertyValue('--ink').trim(), bg=cs.getPropertyValue('--paper').trim();
  const th={C:ink,O:ink,N:ink,F:ink,CL:ink,BR:ink,I:ink,P:ink,S:ink,B:ink,SI:ink,H:ink,BACKGROUND:bg};
  const d=new SmilesDrawer.SvgDrawer({width:340,height:220,bondThickness:1.4,bondLength:26,fontSizeLarge:10,fontSizeSmall:7,padding:16,compactDrawing:false,themes:{mono:th}});
  SmilesDrawer.parse(q.m[1],tree=>{ try{ d.draw(tree,'mol','mono'); }catch(e){ box.innerHTML=`<div class="cf">${fmtF(q.m[2]||'')}</div>`; } },()=>{ box.innerHTML=`<div class="cf">${fmtF(q.m[2]||'')}</div>`; });
}

function question(){
  setScore();
  const q=R.qs[R.i], m=q.m;
  const gq= m[5+1] ? 'This molecule has two functional groups. Which one gives the name its suffix?' : 'Which functional group is present?';
  let part1;
  if(q.g===null){
    part1 = S.gmode==='type'
     ? `<div class="row"><input type="text" id="gin" autocomplete="off" spellcheck="false" placeholder="e.g. alkene" aria-label="Functional group"><button class="btn" id="gchk">Check</button></div>`
     : `<div class="opts">${q.gopts.map((g,k)=>`<button class="opt" data-g="${g}"><span class="let">${'ABCD'[k]}</span><span>${g}</span></button>`).join('')}</div>`;
  } else {
    const typed = S.gmode==='type';
    part1 = (typed?`<p>You answered: <strong>${q.g||'(blank)'}</strong></p>`:
      `<div class="opts">${q.gopts.map((g,k)=>{ const c=g===m[3]?'right':g===q.g?'wrong':'faded'; return `<button class="opt ${c}" disabled><span class="let">${'ABCD'[k]}</span><span>${g}</span></button>`; }).join('')}</div>`)
     + `<div class="fb ${q.gOk?'ok':'bad'}"><b>${q.gOk?'Correct':'Not quite'}: ${m[3]}</b>${WHY[m[3]]}${m[6]?' The other group is named as a prefix or with its position number.':''}</div>`;
  }
  let part2='';
  if(q.g!==null){
    part2=`<div class="part"><h3><span class="n">2</span>Choose the correct name</h3><div class="opts">${q.nopts.map(([nm],k)=>{
      let c=''; if(q.n!==null){ c= nm===m[0]?'right': nm===q.n?'wrong':'faded'; }
      return `<button class="opt ${c}" data-n="${k}" ${q.n!==null?'disabled':''}><span class="let">${'ABCD'[k]}</span><span class="nm">${nm}</span></button>`; }).join('')}</div>`;
    if(q.n!==null){
      const why = q.nOk?'' : (q.nopts.find(o=>o[0]===q.n)||[])[1];
      part2+=`<div class="fb ${q.nOk?'ok':'bad'}"><b>${q.nOk?'Correct':'Not quite'}: ${m[0]}</b>${why?why+' ':''}${m[5]}</div>
      <div class="next"><button class="btn" id="nxt">${R.i<R.qs.length-1?'Next molecule →':'See results →'}</button></div>`;
    }
    part2+='</div>';
  }
  app.innerHTML=`<div class="card"><div class="qtop"><span>Molecule ${R.i+1}</span><span>${q.v==='skeletal'?'Skeletal formula':'Structural formula'}</span></div>
   <div class="struct" id="struct"></div><div class="ftype" id="ftype"></div>
   <div class="part" style="border-top:0;margin-top:0;padding-top:0"><h3><span class="n">1</span>${gq}</h3>${part1}</div>${part2}</div>`;
  drawStruct(q);
  const gin=document.getElementById('gin');
  if(gin){ gin.focus({preventScroll:true}); const go=()=>answerG(gin.value.trim()); document.getElementById('gchk').onclick=go; gin.onkeydown=e=>{ if(e.key==='Enter') go(); }; }
  app.querySelectorAll('.opt[data-g]').forEach(b=>b.onclick=()=>answerG(b.dataset.g));
  app.querySelectorAll('.opt[data-n]').forEach(b=>b.onclick=()=>answerN(+b.dataset.n));
  const nx=document.getElementById('nxt'); if(nx){ nx.focus({preventScroll:true}); nx.onclick=()=>{ R.i++; R.i<R.qs.length?question():results(); window.scrollTo({top:0}); }; }
}
function answerG(v){
  const q=R.qs[R.i];
  const g = S.gmode==='type' ? matchGroup(v) : v;
  q.g = S.gmode==='type' ? (v||'') : v;
  q.gOk = g===q.m[3]; if(q.gOk) R.pts++;
  question();
}
function answerN(k){
  const q=R.qs[R.i]; const nm=q.nopts[k][0];
  q.n=nm; q.nOk= nm===q.m[0]; if(q.nOk) R.pts++;
  question();
}

/* ---------- results ---------- */
function results(){
  setScore();
  const tot=R.qs.length*2, missed=R.qs.filter(q=>!q.gOk||!q.nOk).map(q=>q.m);
  app.innerHTML=`<div class="card"><h2>Round complete</h2>
   <div class="row" style="gap:24px;margin:10px 0"><div class="big">${R.pts}<span class="muted" style="font-size:24px"> / ${tot}</span></div>
   <div class="muted">${Math.round(R.pts/tot*100)}% · Functional groups ${R.qs.filter(q=>q.gOk).length}/${R.qs.length} · Names ${R.qs.filter(q=>q.nOk).length}/${R.qs.length}</div></div>
   <div class="tbl"><table><thead><tr><th>Molecule</th><th>Group</th><th>Name</th></tr></thead><tbody>
   ${R.qs.map(q=>`<tr><td class="m">${q.m[0]}</td><td><span class="${q.gOk?'y':'x'}">${q.gOk?'✓':'✗'}</span> ${q.m[3]}</td><td>${q.nOk?'<span class="y">✓</span>':'<span class="x">✗</span> you chose '+q.n}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="row">${missed.length?`<button class="btn" id="redo">Practise the ${missed.length} I missed →</button>`:''}<button class="btn ghost" id="again">New round</button><button class="btn ghost" id="set">Change settings</button></div></div>`;
  const r=document.getElementById('redo'); if(r) r.onclick=()=>start(shuffle(missed));
  document.getElementById('again').onclick=()=>start();
  document.getElementById('set').onclick=()=>setup();
}

setup();
</script>

</body></html>
