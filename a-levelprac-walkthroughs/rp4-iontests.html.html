<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: test-tube rack on the bench with reagent bottles below, results grid beside it; step card underneath drives the lesson. */
:root{
  --paper:#f7f1e6; --panel:#fffbf3; --ink:#3b2a1d; --muted:#7a6552; --rule:#e2d4bf;
  --brown:#7b4a26; --brown-soft:#efe2cf; --blue:#2f6fb8; --good:#2e7d4f; --warn:#d9822b; --bad:#b23a2b;
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
h1{font-family:var(--f-display);font-size:1.7rem;margin:0;text-wrap:balance;color:var(--brown)}
h1 small{display:block;font-family:var(--f-body);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:16px}
@media (max-width:920px){.stage{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.panel h2{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
canvas{display:block;width:100%;max-width:100%;cursor:pointer}
.reagents{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.reagent{font:inherit;font-size:.85rem;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.reagent i{width:14px;height:20px;border-radius:2px 2px 4px 4px;border:1px solid rgba(0,0,0,.25)}
.reagent.follow{border-style:dashed}
.reagent[aria-pressed="true"]{border-color:var(--brown);box-shadow:0 0 0 2px var(--brown) inset}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px;min-height:1.3em}
.hint.err{color:var(--bad);font-weight:600}
.step{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{font:inherit;font-size:.8rem;border:1px solid var(--rule);background:#fff;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer}
.dots button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.dots button.done{color:var(--brown);border-color:var(--brown)}
.step h3{font-family:var(--f-display);font-size:1.35rem;margin:2px 0 0;color:var(--brown);text-wrap:balance}
.body{max-width:84ch}
.body p{margin:.4em 0}
.body ul,.body ol{margin:.3em 0;padding-left:1.3em}
.callout{border-left:4px solid var(--warn);background:#fdf1e3;padding:8px 12px;border-radius:0 6px 6px 0;margin:.6em 0}
.eq{font-family:var(--f-data);font-size:.88rem;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;overflow-x:auto;margin:.5em 0;line-height:1.7}
.nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--brown);background:#fff;color:var(--brown);border-radius:7px;padding:7px 14px;cursor:pointer}
.btn.primary{background:var(--brown);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.spacer{flex:1}
.tblwrap{overflow-x:auto}
table.grid,table.cmp{border-collapse:collapse;font-size:.82rem;width:100%}
.grid th,.grid td,.cmp th,.cmp td{border:1px solid var(--rule);padding:5px 6px;text-align:center;vertical-align:middle}
.cmp th,.cmp td{text-align:left}
.grid thead th,.cmp thead th{background:var(--brown-soft);font-weight:600}
.grid tbody th{background:#fff;font-weight:600;min-width:2.5em}
.grid td{background:#fff;color:#c9b8a3;min-width:4.5em}
.grid td.pos{color:var(--ink);background:#eaf5ee;font-weight:600}
.grid td.neg{color:var(--muted)}
.grid .name{font-size:.75rem;color:var(--brown);display:block;font-weight:500}
.side{display:grid;gap:10px;align-content:start}
.answer{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.answer select{font:inherit;font-size:.85rem;padding:3px 4px;border:1px solid var(--rule);border-radius:5px;background:#fff;color:var(--ink)}
.answer .ok{color:var(--good);font-weight:700}.answer .no{color:var(--bad);font-weight:700}
.answers{display:grid;gap:6px}
.stage[hidden]{display:none}
.score{font-family:var(--f-data);font-size:.9rem;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;color:var(--brown);white-space:nowrap}
.mcq{background:#fff;border:1px solid var(--rule);border-top:4px solid var(--brown);border-radius:8px;padding:12px 14px;margin:12px 0 0;max-width:80ch}
.qh{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brown);margin:14px 0 6px;font-weight:700}
.mcq .qh{margin-top:0}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:7px}
.opt{text-align:left;font:inherit;font-size:.92rem;background:#fff;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brown)}
.opt:disabled{cursor:default}
.opt.right{background:#eaf5ee;border-color:var(--good)}
.opt.wrong{background:#fbe9e6;border-color:var(--bad)}
.fb{margin:10px 0 0;font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--brown-soft)}
.fb.ok{background:#eaf5ee}.fb.no{background:#fbe9e6}
.qnum{font-family:var(--f-data);color:var(--brown);margin-right:6px}
.evals{display:grid;gap:8px;max-width:84ch}
.eval{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--warn);border-radius:0 8px 8px 0;padding:8px 12px}
.eval b{color:var(--brown)}
.final{background:var(--brown);color:#fff;border-radius:10px;padding:14px 16px;margin-top:14px;max-width:80ch}
.final b{font-family:var(--f-display);font-size:1.2rem}
</style>

<div class="wrap">
  <header>
    <h1><small>AQA Required Practical 4 · Inorganic tests</small>Tests for Group 2 ions, ammonium ions and anions</h1>
    <div class="score" id="score">Score 0 / 0</div>
  </header>

  <div class="stage">
    <section class="panel" aria-label="Bench">
      <h2>Bench</h2>
      <canvas id="bench" data-ratio="0.62"></canvas>
      <div class="reagents" id="reagents"></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="panel side" aria-label="Results">
      <h2>Results</h2>
      <div class="tblwrap"><table class="grid" id="grid"></table></div>
      <div id="answers" class="answers"></div>
      <div class="nav" id="gridNav"></div>
    </section>
  </div>

  <section class="panel step" aria-live="polite">
    <div class="dots" id="dots"></div>
    <h3 id="stitle"></h3>
    <div class="body" id="sbody"></div>
    <div class="nav">
      <button class="btn" id="back">← Back</button>
      <span class="spacer"></span>
      <button class="btn primary" id="next">Next →</button>
    </div>
  </section>
</div>

<script>
(()=>{
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,f)=>a+(b-a)*f;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- Substances: cation + anion ----
const CAT={Mg:'Mg²⁺',Ca:'Ca²⁺',Sr:'Sr²⁺',Ba:'Ba²⁺',NH4:'NH₄⁺',Na:'Na⁺',K:'K⁺'};
const AN={Cl:'Cl⁻',Br:'Br⁻',I:'I⁻',OH:'OH⁻',CO3:'CO₃²⁻',SO4:'SO₄²⁻',NO3:'NO₃⁻'};
const SUB={
  MgCl2:{f:'MgCl₂',c:'Mg',a:'Cl'}, CaCl2:{f:'CaCl₂',c:'Ca',a:'Cl'}, SrCl2:{f:'SrCl₂',c:'Sr',a:'Cl'}, BaCl2:{f:'BaCl₂',c:'Ba',a:'Cl'},
  NH4Cl:{f:'NH₄Cl',c:'NH4',a:'Cl'}, NaCl:{f:'NaCl',c:'Na',a:'Cl'}, NaBr:{f:'NaBr',c:'Na',a:'Br'}, NaI:{f:'NaI',c:'Na',a:'I'},
  NaOH:{f:'NaOH',c:'Na',a:'OH'}, Na2CO3:{f:'Na₂CO₃',c:'Na',a:'CO3'}, Na2SO4:{f:'Na₂SO₄',c:'Na',a:'SO4'},
  MgSO4:{f:'MgSO₄',c:'Mg',a:'SO4'}, NH4Br:{f:'NH₄Br',c:'NH4',a:'Br'}, NH42SO4:{f:'(NH₄)₂SO₄',c:'NH4',a:'SO4'},
  KI:{f:'KI',c:'K',a:'I'}, SrBr2:{f:'SrBr₂',c:'Sr',a:'Br'}, BaNO32:{f:'Ba(NO₃)₂',c:'Ba',a:'NO3'}, K2CO3:{f:'K₂CO₃',c:'K',a:'CO3'},
  NaOHair:{f:'old NaOH',c:'Na',a:'OH',co3:true}
};
const POOL=['MgSO4','CaCl2','BaCl2','SrBr2','NH4Br','NH42SO4','Na2CO3','NaOH','KI','NaCl','BaNO32','K2CO3'];

// ---- Reagents ----
const REA={
  naoh:{name:'NaOH(aq), dropwise',short:'NaOH',col:'#eef1f3',a:.2},
  nh4:{name:'NaOH(aq), warm + damp red litmus',short:'NaOH, warm',col:'#eef1f3',a:.2,heat:true,paper:true},
  h2so4:{name:'Dilute H₂SO₄',short:'H₂SO₄',col:'#eef1f3',a:.2},
  litmus:{name:'Red litmus paper',short:'Litmus',col:'#d9534f',a:1,paperOnly:true},
  hcl:{name:'Dilute HCl + limewater',short:'HCl / limewater',col:'#eef1f3',a:.2,lime:true},
  bacl2:{name:'BaCl₂(aq) alone',short:'BaCl₂ only',col:'#eef1f3',a:.2},
  hbacl:{name:'HCl, then BaCl₂(aq)',short:'HCl + BaCl₂',col:'#eef1f3',a:.2},
  agno3n:{name:'AgNO₃(aq) alone',short:'AgNO₃ only',col:'#eef1f3',a:.2},
  agno3:{name:'HNO₃, then AgNO₃(aq)',short:'HNO₃ + AgNO₃',col:'#eef1f3',a:.2},
  nh3d:{name:'then dilute NH₃(aq)',short:'dil NH₃',col:'#eef4f7',a:.2,follow:true},
  nh3c:{name:'then conc. NH₃(aq)',short:'conc NH₃',col:'#eef4f7',a:.2,follow:true}
};
const WHITE='#ffffff', CREAM='#e9d597', YELLOW='#e8c52e', AGCO3='#ece0a6', AG2O='#6e4a2c';

// state after a sequence of additions; returns visual + text
function evaluate(key,seq){
  const s=SUB[key], st={ppt:0,pcol:WHITE,ag:null,fizz:false,paper:null,lime:false,heat:false,txt:[],short:[]};
  for(const r of seq){
    if(r==='naoh'||r==='nh4'){
      const amt={Mg:.85,Ca:.35,Sr:.18}[s.c]||0;
      if(amt){st.ppt=amt;st.pcol=WHITE;}
      if(r==='naoh'){st.txt.push(amt>.5?'white precipitate':amt>.3?'slight white precipitate':amt?'very slight white precipitate':'no visible change');
        st.short.push(amt>.5?'white ppt':amt>.3?'slight white ppt':amt?'very slight ppt':'no change');}
      else{st.heat=true;st.paper=s.c==='NH4'?'blue':'red';
        if(s.c==='NH4'){st.txt.push('gas turns damp red litmus blue');st.short.push('litmus → blue');}
        else{st.txt.push(amt?'precipitate; litmus stays red':'litmus stays red');st.short.push(amt?'ppt; litmus red':'litmus red');}}
    }
    if(r==='h2so4'){
      const amt={Ba:.95,Sr:.6,Ca:.3}[s.c]||0; if(amt){st.ppt=amt;st.pcol=WHITE;}
      if(s.a==='CO3')st.fizz=true;
      const t=amt>.9?'dense white precipitate':amt>.5?'white precipitate':amt?'slight white precipitate':'';
      st.txt.push([t,st.fizz?'effervescence':''].filter(Boolean).join('; ')||'no visible change');
      st.short.push([amt>.9?'dense white ppt':amt>.5?'white ppt':amt?'slight ppt':'',st.fizz?'fizzes':''].filter(Boolean).join(', ')||'no change');
    }
    if(r==='litmus'){st.paper=(s.a==='OH'||s.a==='CO3')?'blue':'red';st.txt.push(st.paper==='blue'?'red litmus turns blue':'litmus stays red');st.short.push(st.paper==='blue'?'turns blue':'stays red');}
    if(r==='hcl'){if(s.a==='CO3'){st.fizz=true;st.lime=true;st.txt.push('effervescence; limewater turns cloudy');st.short.push('fizz; limewater cloudy');}
      else{st.lime=false;st.txt.push('no visible change');st.short.push('no change');}}
    if(r==='bacl2'){if(s.a==='SO4'||s.a==='CO3'){st.ppt=.8;st.pcol=WHITE;st.txt.push('white precipitate');st.short.push('white ppt');}
      else if(s.co3){st.ppt=.4;st.pcol=WHITE;st.txt.push('slight white precipitate (BaCO₃)');st.short.push('slight white ppt');}
      else{st.txt.push('no visible change');st.short.push('no change');}}
    if(r==='hbacl'){if(s.a==='CO3')st.fizz=true;
      if(s.co3&&s.a!=='SO4'){st.txt.push('no precipitate: carbonate removed by acid');st.short.push('no change');continue;}
      if(s.a==='SO4'&&s.c!=='Ba'){st.ppt=.8;st.pcol=WHITE;st.txt.push('white precipitate');st.short.push('white ppt');}
      else{st.txt.push(s.a==='CO3'?'fizzes with acid; no precipitate':'no visible change');st.short.push(s.a==='CO3'?'fizz, no ppt':'no change');}}
    if(r==='agno3n'){
      const k={Cl:['AgCl',WHITE,'white'],Br:['AgBr',CREAM,'cream'],I:['AgI',YELLOW,'yellow'],CO3:['Ag2CO3',AGCO3,'pale yellow'],OH:['Ag2O',AG2O,'brown']}[s.a];
      if(k){st.ppt=.8;st.pcol=k[1];st.ag=k[0];st.txt.push(k[2]+' precipitate'+(k[0]==='Ag2CO3'?' (Ag₂CO₃)':k[0]==='Ag2O'?' (Ag₂O)':''));st.short.push(k[2]+' ppt');}
      else{st.txt.push('no visible change');st.short.push('no change');}}
    if(r==='agno3'){if(s.a==='CO3')st.fizz=true;
      const k={Cl:['AgCl',WHITE,'white'],Br:['AgBr',CREAM,'cream'],I:['AgI',YELLOW,'yellow']}[s.a];
      if(k){st.ppt=.8;st.pcol=k[1];st.ag=k[0];st.txt.push(k[2]+' precipitate');st.short.push(k[2]+' ppt');}
      else{st.txt.push(s.a==='CO3'?'fizzes with acid; no precipitate':'no visible change');st.short.push(s.a==='CO3'?'fizz, no ppt':'no change');}}
    if(r==='nh3d'){if(st.ag==='AgCl'){st.ppt=0;st.ag='gone';st.txt.push('dissolves in dilute NH₃');st.short.push('dissolves in dil NH₃');}
      else if(st.ag==='AgBr'||st.ag==='AgI'){st.txt.push('does not dissolve in dilute NH₃');st.short.push('insoluble in dil NH₃');}
      else{st.txt.push('no change');st.short.push('');}}
    if(r==='nh3c'){if(st.ag==='AgCl'||st.ag==='AgBr'){st.ppt=0;st.ag='gone';st.txt.push('dissolves in conc. NH₃');st.short.push('dissolves in conc NH₃');}
      else if(st.ag==='AgI'){st.txt.push('does not dissolve in conc. NH₃');st.short.push('insoluble in conc NH₃');}
      else{st.txt.push('no change');st.short.push('');}}
  }
  st.pos=st.ppt>0||st.fizz||st.lime||st.paper==='blue'||seq.some(r=>(r==='nh3d'||r==='nh3c'))&&st.ag==='gone';
  return st;
}

// ---- Steps ----
const STEPS_RAW=[
 {t:'The tests',tubes:[],reagents:[],b:()=>`
  <div class="tblwrap"><table class="cmp"><thead><tr><th>Ion</th><th>Test</th><th>Positive result</th></tr></thead><tbody>
   <tr><td>Group 2 cations</td><td>NaOH(aq), a few drops<br>Dilute H₂SO₄</td><td>Mg²⁺ white ppt; Ca²⁺ slight; Sr²⁺ very slight; Ba²⁺ none<br>Ba²⁺ dense white ppt; Sr²⁺ white; Ca²⁺ slight; Mg²⁺ none</td></tr>
   <tr><td>NH₄⁺</td><td>NaOH(aq), warm; damp red litmus at the mouth</td><td>Litmus turns blue (NH₃ given off)</td></tr>
   <tr><td>OH⁻</td><td>Red litmus paper</td><td>Turns blue</td></tr>
   <tr><td>CO₃²⁻</td><td>Dilute HCl; bubble gas through limewater</td><td>Effervescence; limewater turns cloudy</td></tr>
   <tr><td>SO₄²⁻</td><td>Dilute HCl, then BaCl₂(aq)</td><td>White precipitate</td></tr>
   <tr><td>Cl⁻, Br⁻, I⁻</td><td>Dilute HNO₃, then AgNO₃(aq); then NH₃(aq)</td><td>White / cream / yellow ppt; see step 6 for NH₃</td></tr></tbody></table></div>
  <p>Each test uses about 1 cm³ of the unknown solution in a clean test tube. Click <b>Next</b> to try each test.</p>`},
 {t:'Group 2 cations',tubes:['MgCl2','CaCl2','SrCl2','BaCl2'],reagents:['naoh','h2so4'],b:()=>`
  <p>Select a reagent, then click a tube. Try both reagents on all four solutions.</p>
  <ul><li><b>Hydroxides</b> become <b>more soluble</b> down the group. Mg(OH)₂ is sparingly soluble, so Mg²⁺ gives a white precipitate; Ba(OH)₂ is soluble.</li>
  <li><b>Sulfates</b> become <b>less soluble</b> down the group. BaSO₄ is insoluble, so Ba²⁺ gives a dense white precipitate; MgSO₄ is soluble.</li></ul>
  <div class="eq">Mg²⁺(aq) + 2OH⁻(aq) → Mg(OH)₂(s)<br>Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)</div>
  <div class="callout">The two trends run in opposite directions, so using both reagents identifies each Group 2 ion.</div>`},
 {t:'Ammonium ions',tubes:['NH4Cl','NaCl'],reagents:['nh4'],b:()=>`
  <p>Add NaOH(aq) and <b>warm gently</b> in a water bath. Hold <b>damp red litmus</b> paper at the mouth of the tube.</p>
  <div class="eq">NH₄⁺(aq) + OH⁻(aq) → NH₃(g) + H₂O(l)</div>
  <ul><li>The litmus must be <b>damp</b>: ammonia has to dissolve to form OH⁻ ions before it can change colour.</li>
  <li>Do not let the paper touch the tube. NaOH on the glass would turn it blue and give a false positive.</li></ul>`},
 {t:'Hydroxide and carbonate',tubes:['NaOH','Na2CO3','NaCl'],reagents:['litmus','hcl'],b:()=>`
  <p>Test each solution with red litmus paper, and then with dilute HCl. The delivery tube bubbles any gas through limewater in the small tube beside it.</p>
  <div class="eq">CO₃²⁻(aq) + 2H⁺(aq) → CO₂(g) + H₂O(l)<br>Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l)</div>
  <div class="callout"><b>Carbonate solutions are alkaline too</b>, so they also turn red litmus blue. A blue result alone does not prove OH⁻. Do the carbonate test as well.</div>`},
 {t:'Sulfate',tubes:['Na2SO4','Na2CO3','NaCl'],reagents:['bacl2','hbacl'],b:()=>`
  <p>Try BaCl₂ on its own first, then with dilute HCl added first. The <b>old NaOH</b> tube has been left open to the air.</p>
  <div class="eq">Ba²⁺(aq) + SO₄²⁻(aq) → BaSO₄(s)</div>
  <div class="eq">Ba²⁺(aq) + CO₃²⁻(aq) → BaCO₃(s) &nbsp;&nbsp;(false positive)<br>CO₂(g) + 2OH⁻(aq) → CO₃²⁻(aq) + H₂O(l)</div>
  <ul><li>Without acid, carbonate gives a white precipitate of <b>BaCO₃</b>: a false positive.</li>
  <li>Carbonate can be present even if the compound is not a carbonate. <b>CO₂ from the air dissolves</b> in solutions, especially alkaline ones, and forms CO₃²⁻ ions. The old NaOH gives a slight white precipitate with BaCl₂ alone for this reason.</li>
  <li>Adding HCl first removes CO₃²⁻ as CO₂, so only sulfate gives a precipitate.</li>
  <li>Use <b>HCl or HNO₃</b>. Never use H₂SO₄: it adds sulfate ions.</li></ul>`},
 {t:'Halides',tubes:['NaCl','NaBr','NaI'],reagents:['agno3','nh3d','nh3c'],b:()=>`
  <p>First try <b>AgNO₃ alone</b> on all five tubes, including sodium carbonate and old NaOH. Then use fresh samples with dilute HNO₃ added first, and test each precipitate with ammonia. The dashed buttons add ammonia to the same tube.</p>
  <div class="eq">2Ag⁺(aq) + CO₃²⁻(aq) → Ag₂CO₃(s) &nbsp;&nbsp;pale yellow: looks like AgBr or AgI<br>2Ag⁺(aq) + 2OH⁻(aq) → Ag₂O(s) + H₂O(l) &nbsp;&nbsp;brown</div>
  <p>Carbonate ions from CO₂ dissolved from the air would give a pale precipitate that could be mistaken for a halide. Acidifying removes them as CO₂ first.</p>
  <div class="eq">Ag⁺(aq) + X⁻(aq) → AgX(s)</div>
  <div class="tblwrap"><table class="cmp"><thead><tr><th></th><th>Precipitate</th><th>Dilute NH₃</th><th>Conc. NH₃</th></tr></thead><tbody>
   <tr><td>Cl⁻</td><td>AgCl, white</td><td>Dissolves</td><td>Dissolves</td></tr>
   <tr><td>Br⁻</td><td>AgBr, cream</td><td>Insoluble</td><td>Dissolves</td></tr>

    const lay=bot-tw/2-4-10*amt;ctx.fillStyle=hexA(col,1);ctx.fillRect(-tw,lay,tw*2,40);
    ctx.strokeStyle='rgba(120,110,90,.55)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-tw/2,lay);ctx.lineTo(tw/2,lay);ctx.stroke();}
  if(cur.fizz&&last&&!REA[last].follow&&p>0.25){ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle='rgba(150,160,170,.7)';ctx.lineWidth=.8;
    const nb=p<1?14:6;for(let i=0;i<nb;i++){const ph=(now*1.2+i*0.137)%1;const y=bot-10-ph*(bot-10-level);ctx.beginPath();ctx.arc(-8+((i*37)%17),y,1.5+ph*1.5,0,7);ctx.fill();ctx.stroke();}}
  if(cur.heat&&p>0.3&&t.sub.startsWith('NH4')){ctx.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<5;i++){const ph=(now*.8+i*.2)%1;ctx.beginPath();ctx.arc(-5+i*2.5,level-ph*(level-top),2+ph*2,0,7);ctx.fill();}}
  ctx.restore();
  path();ctx.strokeStyle='rgba(110,140,160,.95)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-tw/2+4,top+6,3,bot-top-30);
  // dropper while adding liquid
  if(last&&p<0.35&&!REA[last].paperOnly){ctx.fillStyle='#55504a';ctx.fillRect(-4,top-48,8,14);ctx.fillStyle='rgba(220,230,236,.95)';ctx.fillRect(-2.5,top-34,5,30);
    const ph=(now*3)%1;ctx.fillStyle='rgba(160,180,195,1)';ctx.beginPath();ctx.arc(0,top+ph*(level-top),2.4,0,7);ctx.fill();}
  // litmus paper: at the mouth (gas test) or dipped (solution test)
  if(cur.paper&&last&&(last==='nh4'||last==='litmus')){
    const toBlue=cur.paper==='blue'?clamp((p-0.45)/0.45,0,1):0;
    const pc=`rgb(${Math.round(lerp(214,70,toBlue))},${Math.round(lerp(83,110,toBlue))},${Math.round(lerp(79,190,toBlue))})`;
    ctx.fillStyle=pc;
    if(last==='nh4'){ctx.save();ctx.translate(6,top-10);ctx.rotate(-0.5);ctx.fillRect(0,-4,34,8);ctx.restore();
      ctx.fillStyle=css('--muted');ctx.font='10px '+css('--f-body');ctx.textAlign='center';}
    else{ctx.fillRect(-4,level-60,8,80);}
  }
  // limewater side tube
  if(last==='hcl'){const lx=gap*0.32, lt=150;
    ctx.strokeStyle='rgba(110,140,160,.95)';ctx.lineWidth=2;ctx.fillStyle='#55504a';ctx.fillRect(-tw/2-1,top-8,tw+2,10);
    ctx.beginPath();ctx.moveTo(4,top-8);ctx.lineTo(4,top-24);ctx.lineTo(lx,top-24);ctx.lineTo(lx,lt+66);ctx.stroke();
    ctx.beginPath();ctx.moveTo(lx-9,lt);ctx.lineTo(lx-9,lt+82);ctx.arc(lx,lt+82,9,Math.PI,0,true);ctx.lineTo(lx+9,lt);ctx.stroke();
    const milk=cur.lime?clamp((p-0.4)/0.5,0,1):0;ctx.fillStyle=`rgba(${Math.round(lerp(225,248,milk))},${Math.round(lerp(238,248,milk))},${Math.round(lerp(244,244,milk))},${.5+milk*.45})`;
    ctx.fillRect(lx-8,lt+30,16,52);ctx.beginPath();ctx.arc(lx,lt+82,8,0,Math.PI);ctx.fill();
    if(cur.lime&&p>0.3){ctx.fillStyle='#fff';for(let i=0;i<3;i++){const ph=(now*1.5+i*.33)%1;ctx.beginPath();ctx.arc(lx,lt+86-ph*50,1.8,0,7);ctx.fill();}}
  }
  // labels
  ctx.fillStyle=css('--ink');ctx.textAlign='center';
  const big=t.label.length===1;
  ctx.font=(big?'bold 20px ':'bold 13px ')+css('--f-body');
  ctx.fillText(t.label,0,top-56);
  if(big&&S.revealed){ctx.font='11px '+css('--f-body');ctx.fillStyle=css('--brown');ctx.fillText(SUB[t.sub].f,0,top-40);}
  if(t.seq.length&&p>=1){ctx.font='bold 11.5px '+css('--f-body');ctx.fillStyle=cur.pos?css('--good'):css('--muted');wrapText(ctx,cur.txt[cur.txt.length-1],0,336,gap-6);}
  ctx.restore();
}
function wrapText(ctx,s,x,y,maxW){const words=s.split(' ');let line='',yy=y;
  for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=13;}else line=test;}
  ctx.fillText(line,x,yy);}

function apply(t){
  const r=S.reagent;if(!r)return;
  if(REA[r].follow){
    const st=evaluate(t.sub,t.seq);
    if(!t.seq.includes('agno3')){setHint('Add HNO₃ then AgNO₃ to this tube first.',true);return;}
    if(t.seq.includes(r)){setHint('Ammonia has already been added to this tube.',true);return;}
    t.seq=[...t.seq,r];
  }else t.seq=[r];
  t.p=0;t.recorded=false;setHint();
}
cv.addEventListener('click',e=>{
  if(!layout.length)return;
  const rect=cv.getBoundingClientRect(),x=(e.clientX-rect.left)/(rect.width/640);
  const hit=layout.reduce((a,b)=>Math.abs(b.x-x)<Math.abs(a.x-x)?b:a);
  if(Math.abs(hit.x-x)<45)apply(hit.t);
});
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const i=parseInt(e.key,10)-1;if(i>=0&&i<S.tubes.length)apply(S.tubes[i]);});

// ---- Steps UI ----
const dots=document.getElementById('dots');
dots.innerHTML=STEPS.map((s,i)=>`<button data-i="${i}">${i+1}. ${s.t.replace(' and common errors','')}</button>`).join('');
dots.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
function renderBody(){const s=STEPS[S.step];
  document.getElementById('sbody').innerHTML=s.b();
  document.getElementById('score').textContent=`Score ${SC.r} / ${SC.n}`;}
document.getElementById('sbody').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const key=b.dataset.key,k=+b.dataset.k;QA[key]=k;SC.n++;if(k===itemFor(key).a)SC.r++;renderBody();});
function go(i){S.step=clamp(i,0,STEPS.length-1);const s=STEPS[S.step];
  document.querySelector('.stage').hidden=!!s.final||s.tubes.length===0;
  document.getElementById('stitle').textContent=`${S.step+1}. ${s.t}`;
  renderBody();
  [...dots.children].forEach((b,j)=>b.className=j===S.step?'on':j<S.step?'done':'');
  document.getElementById('back').disabled=S.step===0;document.getElementById('next').disabled=S.step===STEPS.length-1;
  setupStep();}
document.getElementById('next').onclick=()=>go(S.step+1);
document.getElementById('back').onclick=()=>go(S.step-1);

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  S.tubes.forEach(t=>{if(t.seq.length&&t.p<1){t.p=reduce?1:Math.min(1,t.p+dt/2.4);
    if(t.p>=1&&!t.recorded){t.recorded=true;const st=evaluate(t.sub,t.seq);
      const base=t.seq[0];let txt=st.short.filter(Boolean).join('; ');
      S.grid[cellKey(t,base)]={pos:st.pos,txt};renderGrid();}}});
  drawBench();requestAnimationFrame(tick);}
addEventListener('resize',drawBench);
go(0);requestAnimationFrame(tick);
})();
</script>

</body></html>
