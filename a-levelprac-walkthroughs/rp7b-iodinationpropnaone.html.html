<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Iodination of Propanone Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: step rail on top, picture beside instructions, question and mistake cards below. Single light (projector) theme by choice. */
:root{
  --paper:#f7f1e6; --panel:#fffdf8; --ink:#2b2118; --muted:#6e5d4c;
  --brown:#6b4226; --brown-2:#8a5a36; --line:#e2d5c0; --soft:#f1e7d6;
  --good:#2f7a3d; --good-bg:#e5f2e3; --bad:#a3322a; --bad-bg:#f8e3df; --amber:#a86a12;
  --display:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--brown);padding-bottom:12px}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;color:var(--brown);text-wrap:balance;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{font-family:var(--mono);font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--brown);white-space:nowrap}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.rail button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.rail button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.rail button.done:not(.on){border-color:var(--good);color:var(--good)}
.rail button:focus-visible,.opt:focus-visible,.nav button:focus-visible,.pred button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.pic{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.pic svg{width:100%;height:auto;display:block}
.eyebrow{font:700 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brown-2);margin:0}
h2{font-family:var(--display);font-size:1.55rem;margin:2px 0 8px;line-height:1.2;text-wrap:balance}
.how{margin:0 0 10px;padding-left:20px}
.how li{margin-bottom:4px}
.why{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.95rem;margin:0}
.why b{color:var(--brown)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--brown)}
.card.mistake{border-top:4px solid var(--bad)}
.card.mcq{border-top:4px solid var(--brown)}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:.95rem;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brown-2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;font-size:.93rem;padding:9px 12px;border-radius:8px;background:var(--soft)}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.pred{display:flex;flex-wrap:wrap;gap:8px}
.pred button{flex:1 1 110px;font:600 .9rem var(--body);border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 8px;cursor:pointer;color:var(--ink)}
.pred button.right{background:var(--good-bg);border-color:var(--good)}
.pred button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.effect{display:inline-block;font:700 .8rem var(--mono);padding:2px 8px;border-radius:4px;background:var(--bad);color:#fff;margin-right:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{font:600 .95rem var(--body);background:var(--brown);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.nav button.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.nav button:disabled{opacity:.35;cursor:default}
.summary .card{margin-bottom:14px}
.summary h4{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--brown-2);margin:22px 0 8px}
.qnum{font-family:var(--mono);color:var(--brown-2);margin-right:6px}
.tag{font:700 .7rem var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--soft);color:var(--brown);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.final{background:var(--brown);color:#fff;border-radius:10px;padding:16px 18px;margin-top:8px}
.final b{font-family:var(--display);font-size:1.3rem}
.evals{display:grid;gap:10px;margin:0 0 6px}
.eval{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px}
.eval b{color:var(--brown)}
sub,sup{line-height:0}
@media (prefers-reduced-motion:no-preference){.fadein{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>


<div class="wrap">
  <header>
    <div>
      <h1>Iodination of Propanone Walkthrough</h1>
      <p class="sub">AQA Required Practical 7b · measuring rate by continuous monitoring (propanone + iodine, sampled and titrated)</p>
    </div>
    <div class="score" id="score">Score 0 / 0</div>
  </header>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- drawing helpers (viewBox 400 x 320) ---------- */
const C={glass:"#5a4632",thio:"#e8f0f4",acid:"#cde4f1",sulfur:"#efe2a2",water:"#bcd9ec",ink:"#2b2118",red:"#a3322a",brown:"#6b4226",muted:"#6e5d4c",wood:"#c9b28f",steel:"#8a8f96",good:"#2f7a3d"};
let uid=0;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Segoe UI,system-ui,sans-serif" font-size="${o.size||11.5}" font-weight="${o.w||500}" fill="${o.fill||C.ink}" text-anchor="${o.a||'start'}">${s}</text>`;
const lead=(x1,y1,x2,y2,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||C.muted}" stroke-width="1"/><circle cx="${x2}" cy="${y2}" r="2" fill="${col||C.muted}"/>`;
function lbl(x,y,lines,tx,ty,o={}){
  const wd=Math.max(...lines.map(l=>l.length))*6.1;
  const sx=o.lx??(tx>x+wd?x+wd+4:x-4);
  let s=tx!=null?lead(sx,o.ly??(y-4),tx,ty,o.col):"";
  lines.forEach((l,i)=>s+=T(x,y+i*14,l,{a:o.a,w:i?400:(o.w||600),fill:o.col&&!i?o.col:C.ink}));
  return s;
}
function flask(cx,by,liq,frac,o={}){
  const id="fk"+(uid++);
  const p=`M${cx-11},${by-112} L${cx-11},${by-72} L${cx-48},${by-6} Q${cx-50},${by} ${cx-43},${by} L${cx+43},${by} Q${cx+50},${by} ${cx+48},${by-6} L${cx+11},${by-72} L${cx+11},${by-112}`;
  const h=frac*70;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs>`;
  s+=`<path d="${p} Z" fill="#fff" fill-opacity=".55"/>`;
  if(liq)s+=`<rect clip-path="url(#${id})" x="${cx-60}" y="${by-h}" width="120" height="${h}" fill="${liq}" fill-opacity="${o.op??1}"/>`;
  s+=`<path d="${p}" fill="none" stroke="${C.glass}" stroke-width="1.8"/><path d="M${cx-14},${by-112} L${cx+14},${by-112}" stroke="${C.glass}" stroke-width="2"/>`;
  return s;
}
function bench(y){return `<rect x="0" y="${y}" width="400" height="${320-y}" fill="${C.wood}" opacity=".35"/>`;}
function eye(x,y,rot){return `<g transform="translate(${x},${y}) rotate(${rot||0})"><path d="M-16,0 Q0,-11 16,0 Q0,11 -16,0 Z" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/><circle cx="4" cy="0" r="4.5" fill="${C.brown}"/><circle cx="5" cy="-1" r="1.6" fill="#fff"/></g>`;}
function cyl(cx,by,h,frac,col){
  const w=24,top=by-h,id="cy"+(uid++);
  let s=`<rect x="${cx-34}" y="${by-6}" width="68" height="6" rx="2" fill="#fff" stroke="${C.glass}" stroke-width="1.4"/>`;
  s+=`<defs><clipPath id="${id}"><rect x="${cx-w/2}" y="${top}" width="${w}" height="${h-6}"/></clipPath></defs>`;
  s+=`<rect clip-path="url(#${id})" x="${cx-w/2}" y="${by-6-(h-6)*frac}" width="${w}" height="${(h-6)*frac}" fill="${col}"/>`;
  s+=`<path d="M${cx-w/2},${top} L${cx-w/2},${by-6} L${cx+w/2},${by-6} L${cx+w/2},${top} M${cx-w/2-4},${top-2} L${cx-w/2},${top+3}" fill="none" stroke="${C.glass}" stroke-width="1.6"/>`;
  for(let i=1;i<10;i++){const y=by-6-i*(h-14)/10;s+=`<line x1="${cx-w/2}" y1="${y}" x2="${cx-w/2+(i%5?5:10)}" y2="${y}" stroke="${C.glass}" stroke-width=".8"/>`;}
  return s;
}
function btube(cx,top,len,col,frac,o={}){
  const w=22,id="bt"+(uid++),bot=top+len;
  const p=`M${cx-w/2},${top} L${cx-w/2},${bot-w/2} A${w/2},${w/2} 0 0 0 ${cx+w/2},${bot-w/2} L${cx+w/2},${top}`;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs><path d="${p} Z" fill="#fff" fill-opacity=".55"/>`;
  if(col)s+=`<rect clip-path="url(#${id})" x="${cx-w}" y="${bot-len*frac}" width="${w*2}" height="${len*frac}" fill="${col}"/>`;
  s+=`<path d="${p}" fill="none" stroke="${C.glass}" stroke-width="1.6"/>`;
  return s;
}
function thermo(x,top,bot,frac){
  const lv=bot-(bot-top-14)*frac;
  return `<rect x="${x-3}" y="${top}" width="6" height="${bot-top}" rx="3" fill="#f6f3ee" stroke="#8a8a8a" stroke-width="1"/><circle cx="${x}" cy="${bot}" r="5" fill="${C.red}"/><rect x="${x-1.2}" y="${lv}" width="2.4" height="${bot-lv}" fill="${C.red}"/>`;
}
function stopwatch(cx,cy,txt){
  return `<rect x="${cx-5}" y="${cy-36}" width="10" height="8" rx="2" fill="${C.steel}"/><circle cx="${cx}" cy="${cy}" r="28" fill="#fff" stroke="${C.brown}" stroke-width="3"/>`+T(cx,cy+6,txt,{a:"middle",size:16,w:700,fill:C.brown});
}
function paper(cx,y){
  return `<path d="M${cx-92},${y} L${cx+78},${y} L${cx+92},${y+16} L${cx-78},${y+16} Z" fill="#fff" stroke="#bfb3a1"/>`;
}
function topView(cx,cy,r,cloud,o={}){ // looking down through the flask at the cross
  const id="tv"+(uid++);
  let s=`<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${C.brown}" stroke-width="2"/>`;
  s+=`<g clip-path="url(#${id})"><path d="M${cx-r*.5},${cy-r*.5} L${cx+r*.5},${cy+r*.5} M${cx+r*.5},${cy-r*.5} L${cx-r*.5},${cy+r*.5}" stroke="#111" stroke-width="${r*.16}" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.sulfur}" fill-opacity="${cloud}"/></g>`;
  if(o.label)s+=T(cx,cy+r+16,o.label,{a:"middle",size:10.5,fill:C.muted});
  return s;
}
function bath(x,by,w,h,o={}){
  let s=`<rect x="${x}" y="${by-h*0.82}" width="${w}" height="${h*0.82}" fill="${C.water}" fill-opacity=".55"/>`;
  s+=`<path d="M${x},${by-h} L${x},${by} L${x+w},${by} L${x+w},${by-h}" fill="none" stroke="${C.glass}" stroke-width="2"/>`;
  return s;
}
function arrow(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),h=9;return `<path d="M${x1},${y1} L${x2},${y2} M${x2},${y2} L${x2-h*Math.cos(a-.4)},${y2-h*Math.sin(a-.4)} M${x2},${y2} L${x2-h*Math.cos(a+.4)},${y2-h*Math.sin(a+.4)}" fill="none" stroke="${C.brown}" stroke-width="2" stroke-dasharray="${o_dash}"/>`;}
let o_dash="5 4";
const svg=inner=>`<svg viewBox="0 0 400 320" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

/* ---------- extra apparatus helpers ---------- */
C.mantle="#5b544d";C.ice="#ffffff";C.solid="#f4f1ea";C.org="#f3e7b8";C.aq="#cfe3f0";C.uv="#7b5cc4";
function beaker(x,by,w,h,col,frac,text){
  const id="bk"+(uid++),p=`M${x},${by-h} L${x},${by} L${x+w},${by} L${x+w},${by-h}`;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs><path d="${p} Z" fill="#fff" fill-opacity=".55"/>`;
  if(col)s+=`<rect clip-path="url(#${id})" x="${x}" y="${by-h*frac}" width="${w}" height="${h*frac}" fill="${col}"/>`;
  s+=`<path d="M${x-4},${by-h-2} L${x},${by-h+2}" stroke="${C.glass}" stroke-width="1.6"/><path d="${p}" fill="none" stroke="${C.glass}" stroke-width="1.6"/>`;
  if(text)s+=T(x+w/2,by+14,text,{a:"middle",size:10.5,fill:C.muted});
  return s;
}
function iceBath(x,by,w,h){let s=beaker(x,by,w,h,C.water,.7);
  for(let i=0;i<Math.floor(w/16);i++){const xx=x+6+i*16,yy=by-h*.7+6+(i%2)*14;s+=`<rect x="${xx}" y="${yy}" width="10" height="10" rx="2" fill="#fff" stroke="#b8cbd6" transform="rotate(${(i*23)%40-20} ${xx+5} ${yy+5})"/>`;}
  return s;}
function rbf(cx,cy,r,col,frac,o={}){
  const id="rb"+(uid++),nw=o.nw||9,nt=cy-r-(o.neck??34),sq=Math.sqrt(r*r-nw*nw);
  let s=`<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" fill-opacity=".6"/>`;
  if(col)s+=`<rect clip-path="url(#${id})" x="${cx-r}" y="${cy+r-2*r*frac}" width="${2*r}" height="${2*r*frac}" fill="${col}"/>`;
  if(o.granules)[[-10,r-8],[4,r-6],[14,r-10]].forEach(([dx,dy])=>s+=`<circle cx="${cx+dx}" cy="${cy+dy}" r="2.6" fill="#fff" stroke="#8a8a8a" stroke-width=".7"/>`);
  s+=`<path d="M${cx-nw},${nt} L${cx-nw},${cy-sq} A${r},${r} 0 1 0 ${cx+nw},${cy-sq} L${cx+nw},${nt}" fill="none" stroke="${C.glass}" stroke-width="1.8"/>`;
  return s;
}
function mantle(cx,cy,r){return `<path d="M${cx-r-10},${cy-4} L${cx-r-10},${cy+r*.3} Q${cx-r-10},${cy+r+16} ${cx},${cy+r+16} Q${cx+r+10},${cy+r+16} ${cx+r+10},${cy+r*.3} L${cx+r+10},${cy-4} Z" fill="${C.mantle}"/><rect x="${cx-r-18}" y="${cy+r+12}" width="${2*r+36}" height="12" rx="3" fill="#47413b"/>`;}
function condenserV(cx,top,bot){
  return `<rect x="${cx-14}" y="${top+18}" width="28" height="${bot-top-36}" rx="4" fill="${C.water}" fill-opacity=".55" stroke="${C.glass}" stroke-width="1.6"/>
  <path d="M${cx-6},${top} L${cx-6},${bot} M${cx+6},${top} L${cx+6},${bot}" stroke="${C.glass}" stroke-width="1.6"/>
  <path d="M${cx+14},${bot-30} l14,0 M${cx+14},${top+30} l14,0" stroke="${C.glass}" stroke-width="3"/>`
  +T(cx+32,bot-26,"water in",{size:10,fill:"#2f6fb8",w:600})+T(cx+32,top+34,"water out",{size:10,fill:"#2f6fb8",w:600});
}
function condenserSlope(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1)*180/Math.PI,len=Math.hypot(x2-x1,y2-y1);
  return `<g transform="translate(${x1},${y1}) rotate(${a})"><rect x="22" y="-13" width="${len-44}" height="26" rx="4" fill="${C.water}" fill-opacity=".55" stroke="${C.glass}" stroke-width="1.6"/>
  <path d="M0,-5 L${len},-5 M0,5 L${len},5" stroke="${C.glass}" stroke-width="1.6"/>
  <path d="M36,-13 l0,-12 M${len-36},13 l0,12" stroke="${C.glass}" stroke-width="3"/></g>`;
}
function stillHead(cx,top,armY,armTo){ // vertical tube with side arm
  return `<path d="M${cx-7},${top+60} L${cx-7},${top} M${cx+7},${top+60} L${cx+7},${armY+6} M${cx+7},${armY-6} L${cx+7},${top}" stroke="${C.glass}" stroke-width="1.8" fill="none"/>
  <path d="M${cx+7},${armY-6} L${armTo[0]},${armTo[1]-5} M${cx+7},${armY+6} L${armTo[0]},${armTo[1]+5}" stroke="${C.glass}" stroke-width="1.8"/>`;
}
function sepFunnel(cx,top,layers,o={}){ // layers bottom→top: [colour, height]
  const id="sf"+(uid++),b0=top+22,b1=top+150;
  const body=`M${cx-6},${b0} C${cx-56},${b0+40} ${cx-60},${b1-30} ${cx-8},${b1} L${cx+8},${b1} C${cx+60},${b1-30} ${cx+56},${b0+40} ${cx+6},${b0} Z`;
  let s=`<defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs><path d="${body}" fill="#fff" fill-opacity=".6"/>`;
  let y=b1;layers.forEach(([c,h])=>{s+=`<rect clip-path="url(#${id})" x="${cx-60}" y="${y-h}" width="120" height="${h}" fill="${c}"/>`;y-=h;});
  s+=`<path d="${body}" fill="none" stroke="${C.glass}" stroke-width="1.8"/>`;
  s+=`<path d="M${cx-6},${b0} L${cx-6},${top} M${cx+6},${b0} L${cx+6},${top}" stroke="${C.glass}" stroke-width="1.8"/>`;
  if(o.stopper!==false)s+=`<rect x="${cx-9}" y="${top-14}" width="18" height="16" rx="3" fill="#d9d2c4" stroke="${C.glass}" stroke-width="1.3"/>`;
  s+=`<path d="M${cx-3},${b1} L${cx-3},${b1+60} M${cx+3},${b1} L${cx+3},${b1+60}" stroke="${C.glass}" stroke-width="1.6"/>`;
  s+=`<rect x="${cx-8}" y="${b1+14}" width="16" height="12" rx="2" fill="#d9d2c4" stroke="${C.glass}" stroke-width="1.3"/>`;
  s+=o.open?`<rect x="${cx-2.5}" y="${b1+8}" width="5" height="24" rx="2" fill="${C.brown}"/>`:`<rect x="${cx-18}" y="${b1+17.5}" width="36" height="5" rx="2" fill="${C.brown}"/>`;
  if(o.ring)s+=`<ellipse cx="${cx}" cy="${b1-4}" rx="30" ry="6" fill="none" stroke="${C.steel}" stroke-width="3"/><rect x="${cx+30}" y="${b1-6}" width="${o.ring}" height="4" fill="${C.steel}"/>`;
  return s;
}
function buchner(cx,by,o={}){
  let s=flask(cx,by,null,0);
  s+=`<path d="M${cx+11},${by-96} L${cx+44},${by-104} L${cx+80},${by-104}" fill="none" stroke="${C.glass}" stroke-width="5"/>`;
  s+=`<path d="M${cx+80},${by-104} L${cx+120},${by-104}" stroke="#555" stroke-width="7" stroke-linecap="round"/>`;
  s+=`<rect x="${cx-13}" y="${by-120}" width="26" height="12" rx="3" fill="#3d3a38"/>`;
  s+=`<path d="M${cx-40},${by-170} L${cx-40},${by-138} L${cx-8},${by-128} L${cx-6},${by-104} L${cx+6},${by-104} L${cx+8},${by-128} L${cx+40},${by-138} L${cx+40},${by-170}" fill="#fff" fill-opacity=".7" stroke="${C.glass}" stroke-width="1.8"/>`;
  s+=`<line x1="${cx-38}" y1="${by-142}" x2="${cx+38}" y2="${by-142}" stroke="#9a8a76" stroke-width="2"/>`;
  if(o.crystals)for(let i=0;i<26;i++){const xx=cx-34+(i*7)%68,yy=by-146-(i%3)*3;s+=`<rect x="${xx}" y="${yy}" width="4" height="3" fill="${C.solid}" stroke="#bfb7a6" stroke-width=".5"/>`;}

 {q:"The rate equation for this reaction is rate = k[CH₃COCH₃][H⁺]. What does this tell you about the mechanism?",o:["Iodine is not involved in the rate-determining step","Iodine is involved in the rate-determining step","The reaction has a single step","H⁺ is used up"],a:0,e:"Only species in or before the rate-determining step appear in the rate equation."},
 {q:"What is the overall order of the reaction rate = k[CH₃COCH₃][H⁺]?",o:["2","3","1","0"],a:0,e:"1 + 1 = 2. Iodine is zero order."},
 {q:"Why must the time be recorded when the sample enters the NaHCO₃, not when the titration is done?",o:["The reaction stops at the moment of quenching, so that is the time [I₂] is measured","The titration takes no time","NaHCO₃ restarts the reaction","It does not matter"],a:0,e:"The quench fixes [I₂] at that moment."},
 {q:"From the graph, the rate is 1.6 × 10⁻⁴ mol dm⁻³ min⁻¹. What is this in mol dm⁻³ s⁻¹?",o:["2.7 × 10⁻⁶","9.6 × 10⁻³","1.6 × 10⁻⁴","2.7 × 10⁻⁴"],a:0,e:"1.6 × 10⁻⁴ ÷ 60 = 2.7 × 10⁻⁶ mol dm⁻³ s⁻¹."},
 {q:"How could the order with respect to propanone be found?",o:["Repeat with a different concentration of propanone (still in excess) and compare the gradients","Measure the half-life of iodine","Use more iodine","Use a different indicator"],a:0,e:"If doubling [propanone] doubles the gradient, the reaction is first order in propanone."},
 {q:"What would the [I₂]–time graph look like if the reaction were first order in I₂?",o:["A curve with a constant half-life","A straight line","A horizontal line","A straight line through the origin"],a:0,e:"The rate would fall as [I₂] falls, so the gradient gets less steep."},
 {q:"Why is this called a continuous monitoring method?",o:["The concentration of one reactant is followed over time during a single reaction","Only the initial rate is measured","The reaction runs continuously without stopping","Several reactions are run at the same time"],a:0,e:"One run gives a whole concentration–time graph, from which rates can be found from gradients."},
 {q:"Which is a safety precaution for this practical?",o:["Propanone is highly flammable, so keep it away from flames","Iodine solution is explosive","Sodium hydrogencarbonate is toxic","Starch is corrosive"],a:0,e:"Also, iodine stains and is harmful, so wear gloves and eye protection."},
 {q:"Which titration observation is the end point?",o:["The blue-black colour just disappears","The solution turns pale yellow","The solution turns blue-black","A white precipitate forms"],a:0,e:"Pale yellow tells you to add starch. The end point is when the blue-black colour disappears."}
];
const evals=[
 ["Excess of the other reactants","Propanone and H⁺ in large excess keep their concentrations constant, so only [I₂] changes."],
 ["Quench immediately and record that time","Sodium hydrogencarbonate neutralises the acid catalyst. Delays cause extra reaction and points below the line."],
 ["Add starch near the end point","When the solution is pale yellow, for a sharp end point."],
 ["Rinse the pipette with the reaction mixture","Water dilutes the sample and lowers every titre."],
 ["Straight-line [I₂]–time graph means zero order","Rate = −gradient. A curve would mean the order is greater than zero."],
 ["Constant errors do not change the gradient","A late timer start or an unzeroed colorimeter shifts all points but leaves the rate unchanged."],
 ["Colorimetry is better for continuous monitoring","More readings, no sampling, and the reaction is not disturbed."],
 ["Hazards","Propanone is highly flammable; iodine is harmful and stains; sulfuric acid is an irritant. Wear eye protection and gloves."]
];

/* ---------- state & render ---------- */
const S={cur:0,ans:{},att:0,right:0};
const $=s=>document.querySelector(s);
function shuffleOrder(n,seed){const a=[...Array(n).keys()];let x=seed*9301+49297;for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updScore(){$("#score").textContent=`Score ${S.right} / ${S.att}`;}
function rail(){
  const r=$("#rail");r.innerHTML="";
  steps.forEach((s,i)=>{const b=document.createElement("button");b.textContent=`${i+1}. ${s.t}`;if(i===S.cur)b.classList.add("on");if(S.ans["q"+i]!==undefined&&S.ans["m"+i]!==undefined)b.classList.add("done");b.onclick=()=>go(i);r.appendChild(b);});
  const b=document.createElement("button");b.textContent="Evaluation & quiz";if(S.cur===steps.length)b.classList.add("on");b.onclick=()=>go(steps.length);r.appendChild(b);
}
function mcqHTML(key,item,seed){
  const ord=shuffleOrder(item.o.length,seed);
  const done=S.ans[key];
  let h=`<div class="opts">`;
  ord.forEach(k=>{let cls="";if(done!==undefined){if(k===item.a)cls="right";else if(k===done)cls="wrong";}
    h+=`<button class="opt ${cls}" data-key="${key}" data-k="${k}" ${done!==undefined?"disabled":""}>${item.o[k]}</button>`;});
  h+=`</div>`;
  if(done!==undefined)h+=`<p class="fb ${done===item.a?'ok':'no'}">${done===item.a?"Correct. ":"Not quite. "}${item.e}</p>`;
  return h;
}
function render(){
  rail();updScore();
  const m=$("#main");
  if(S.cur===steps.length){renderSummary();return;}
  const s=steps[S.cur],i=S.cur,md=S.ans["m"+i],lab=s.lab||DEFLAB;
  m.innerHTML=`<div class="fadein">
   <div class="stage">
     <div class="pic">${pics[i]()}</div>
     <div>
       <p class="eyebrow">Step ${i+1} of ${steps.length}</p>
       <h2>${s.t}</h2>
       <ul class="how">${s.how.map(x=>`<li>${x}</li>`).join("")}</ul>
       <p class="why"><b>Why: </b>${s.why}</p>
     </div>
   </div>
   <div class="cards">
     <section class="card mcq"><h3>Check your understanding</h3><p class="q">${s.q.q}</p>${mcqHTML("q"+i,s.q,i+3)}</section>
     <section class="card mistake"><h3>Potential mistake</h3><p class="q">${s.m.t}</p>
       <p style="margin:0 0 8px;color:var(--muted);font-size:.9rem">${s.ask||DEFASK}</p>
       <div class="pred">${["higher","lower","none"].map(f=>{let c="";if(md!==undefined){if(f===s.m.fx)c="right";else if(f===md)c="wrong";}return `<button data-m="${i}" data-f="${f}" class="${c}" ${md!==undefined?"disabled":""}>${lab[f]}</button>`;}).join("")}</div>
       ${md!==undefined?`<p class="fb ${md===s.m.fx?'ok':'no'}"><span class="effect">${lab[s.m.fx]}</span>${s.m.e}</p>`:""}
     </section>
   </div>
   <div class="nav"><button class="ghost" id="prev" ${i===0?"disabled":""}>← Previous</button><button id="next">${i===steps.length-1?"Evaluation & quiz →":"Next step →"}</button></div>
  </div>`;
  $("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
  bind();
}
function renderSummary(){
  const m=$("#main");
  let h=`<div class="fadein summary"><p class="eyebrow">Evaluation</p><h2>Common exam points</h2><div class="evals">${evals.map(([a,b])=>`<div class="eval"><b>${a}.</b> ${b}</div>`).join("")}</div>`;
  h+=`<h4>Summary questions</h4>`;
  summary.forEach((q,j)=>{h+=`<section class="card mcq"><p class="q"><span class="qnum">Q${j+1}</span>${q.q}${q.tag?`<span class="tag">${q.tag}</span>`:""}</p>${mcqHTML("s"+j,q,j+11)}</section>`;});
  const answered=summary.filter((q,j)=>S.ans["s"+j]!==undefined).length;
  if(answered===summary.length){const sc=summary.filter((q,j)=>S.ans["s"+j]===q.a).length;h+=`<div class="final"><b>Summary quiz: ${sc} / ${summary.length}</b><br>Whole walkthrough: ${S.right} / ${S.att} correct first time.</div>`;}
  h+=`<div class="nav"><button class="ghost" id="prev">← Back to step ${steps.length}</button><button id="restart">Start again</button></div></div>`;
  m.innerHTML=h;
  $("#prev").onclick=()=>go(steps.length-1);
  $("#restart").onclick=()=>{S.ans={};S.att=0;S.right=0;go(0);};
  bind();
}
function bind(){
  document.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key,k=+b.dataset.k;S.ans[key]=k;S.att++;
    const item=key[0]==="q"?steps[+key.slice(1)].q:summary[+key.slice(1)];
    if(k===item.a)S.right++;render();
  });
  document.querySelectorAll(".pred button:not(:disabled)").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.m,f=b.dataset.f;S.ans["m"+i]=f;S.att++;if(f===steps[i].m.fx)S.right++;render();
  });
}
function go(i){S.cur=Math.max(0,Math.min(steps.length,i));render();window.scrollTo({top:0,behavior:"smooth"});}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;if(e.key==="ArrowRight")go(S.cur+1);if(e.key==="ArrowLeft")go(S.cur-1);});
render();
</script>

</body></html>
