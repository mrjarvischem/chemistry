<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>pH Curves and Indicators</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: live pH curve on graph paper beside the step card; questions underneath. Single light (projector) theme by choice. */
:root{
  --paper:#f7f1e6; --panel:#fffdf8; --ink:#2b2118; --muted:#6e5d4c;
  --brown:#6b4226; --brown-2:#8a5a36; --line:#e2d5c0; --soft:#f1e7d6;
  --good:#2f7a3d; --good-bg:#e5f2e3; --bad:#a3322a; --bad-bg:#f8e3df; --amber:#a86a12; --blue:#2f6fb8;
  --grid-minor:#efdcc0; --grid-major:#ddbf98;
  --display:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--brown);padding-bottom:12px}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;color:var(--brown);text-wrap:balance;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{font-family:var(--mono);font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--brown);white-space:nowrap}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.rail button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.rail button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.rail button.done:not(.on){border-color:var(--good);color:var(--good)}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.stage{grid-template-columns:1fr}}
.stage[hidden],.controls[hidden]{display:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.graph svg{width:100%;height:auto;display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:10px}
.lbl{font:700 .72rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--brown);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--brown);font:inherit;font-size:.83rem;padding:5px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--brown)}
.seg button[aria-pressed="true"]{background:var(--brown);color:#fff}
.seg button:disabled{opacity:.45;cursor:default}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem}
.checks label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.slider{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.slider input{flex:1 1 220px;accent-color:var(--brown)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.readout div{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.readout span{display:block;font:700 .68rem var(--body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.readout b{font-family:var(--mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.readout .wide{grid-column:1/-1}
.readout .wide b{font-family:var(--body);font-size:.92rem;font-weight:600}
.eyebrow{font:700 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brown-2);margin:0}
h2{font-family:var(--display);font-size:1.5rem;margin:2px 0 8px;line-height:1.2;text-wrap:balance}
.text p{margin:.45em 0}
.text ul,.text ol{margin:.35em 0;padding-left:1.25em}
.text li{margin-bottom:3px}
.why{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.95rem;margin:.6em 0}
.why b{color:var(--brown)}
.callout{border-left:4px solid var(--amber);background:#fdf1e3;padding:8px 12px;border-radius:0 6px 6px 0;margin:.6em 0;font-size:.95rem}
.eq{font-family:var(--mono);font-size:.88rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;overflow-x:auto;margin:.5em 0;line-height:1.8}
.eq b{color:var(--brown)}
.ind{border-collapse:collapse;font-size:.88rem;width:100%;margin:.5em 0}
.ind th,.ind td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.ind thead th{background:var(--soft)}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--brown);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--brown)}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:.95rem;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brown-2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;font-size:.93rem;padding:9px 12px;border-radius:8px;background:var(--soft)}
.fb.ok{background:var(--good-bg);color:var(--ink);font-weight:400}.fb.no{background:var(--bad-bg);color:var(--ink);font-weight:400}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{font:600 .95rem var(--body);background:var(--brown);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.btn:disabled{opacity:.35;cursor:default}
.summary .card{margin-bottom:14px}
.qnum{font-family:var(--mono);color:var(--brown-2);margin-right:6px}
.evals{display:grid;gap:10px;margin:0 0 6px}
.eval{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px}
.eval b{color:var(--brown)}
.summary h4{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--brown-2);margin:22px 0 8px}
.final{background:var(--brown);color:#fff;border-radius:10px;padding:16px 18px;margin-top:8px}
.final b{font-family:var(--display);font-size:1.3rem}
sub,sup{line-height:0}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>pH Curves and Indicators</h1>
      <p class="sub">A-level Chemistry Year 2 · titration curves, choosing an indicator, and K<sub>a</sub> from half-neutralisation (includes Required Practical 9)</p>
    </div>
    <div class="score" id="score">Score 0 / 0</div>
  </header>
  <nav class="rail" id="rail" aria-label="Steps"></nav>

  <div class="stage" id="stage">
    <section class="panel graph" aria-label="pH curve">
      <div id="svgwrap"></div>
      <div class="slider"><span class="lbl" style="margin:0">Volume added</span><input type="range" id="vol" min="0" max="50" step="0.05" value="12.5"></div>
      <div class="readout">
        <div><span>Volume added</span><b id="rV">–</b></div>
        <div><span>pH</span><b id="rpH">–</b></div>
        <div class="wide"><span>In the flask</span><b id="rFlask">–</b></div>
      </div>
      <div class="controls">
        <div><span class="lbl">Titration</span><span class="seg" id="segPair"></span></div>
        <div><span class="lbl">Direction</span><span class="seg" id="segDir"><button data-v="b2a">Base added to acid</button><button data-v="a2b">Acid added to base</button></span></div>
      </div>
      <div class="controls" id="acidRow" hidden>
        <div><span class="lbl">Weak acid</span><span class="seg" id="segAcid"></span></div>
      </div>
      <div class="controls checks">
        <label><input type="checkbox" id="cAll"> Show all four curves</label>
        <label><input type="checkbox" id="cInd"> Indicator ranges</label>
        <label><input type="checkbox" id="cHalf"> Half-equivalence</label>
        <label><input type="checkbox" id="cSteep"> Vertical section</label>
      </div>
    </section>
    <section class="panel text" id="text"></section>
  </div>
  <div id="below"></div>
</div>

<script>
/* ---------- chemistry ---------- */
const Kw=1e-14, C0=0.100, V0=25.0;
const ACIDS={
  eth:{name:'ethanoic acid',f:'CH₃COOH',Ka:1.74e-5},
  meth:{name:'methanoic acid',f:'HCOOH',Ka:1.78e-4},
  prop:{name:'propanoic acid',f:'CH₃CH₂COOH',Ka:1.35e-5}
};
const PAIRS={
  SS:{name:'Strong acid + strong base',acid:'HCl',base:'NaOH',ex:'HCl and NaOH',wa:false,wb:false},
  WS:{name:'Weak acid + strong base',acid:'CH₃COOH',base:'NaOH',ex:'CH₃COOH and NaOH',wa:true,wb:false},
  SW:{name:'Strong acid + weak base',acid:'HCl',base:'NH₃',ex:'HCl and NH₃',wa:false,wb:true},
  WW:{name:'Weak acid + weak base',acid:'CH₃COOH',base:'NH₃',ex:'CH₃COOH and NH₃',wa:true,wb:true}
};
const KbNH3=1.78e-5;
const INDS=[
  {k:'mo',name:'Methyl orange',lo:3.1,hi:4.4,c1:'#d23b2b',c2:'#f0c419',cols:'red → yellow'},
  {k:'btb',name:'Bromothymol blue',lo:6.0,hi:7.6,c1:'#e2c534',c2:'#2a62b8',cols:'yellow → blue'},
  {k:'pp',name:'Phenolphthalein',lo:8.3,hi:10.0,c1:'#f4eef2',c2:'#d9358f',cols:'colourless → pink'}
];
const SUIT={SS:['mo','btb','pp'],WS:['pp'],SW:['mo'],WW:[]};

function pHof(pair,dir,V,acidKey){
  const P=PAIRS[pair], Ka=P.wa?ACIDS[acidKey||'eth'].Ka:1e8, KaBH=P.wb?Kw/KbNH3:1e-24;
  const tot=V0+V, acidV=dir==='b2a'?V0:V, baseV=dir==='b2a'?V:V0;
  const CA=C0*acidV/tot, CB=C0*baseV/tot;
  const f=lh=>{const h=10**lh;return h+CB*h/(h+KaBH)-Kw/h-CA*Ka/(Ka+h);};
  let lo=-14.8,hi=1;for(let i=0;i<70;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m;}
  return -(lo+hi)/2;
}
function curve(pair,dir,acidKey){const pts=[];for(let i=0;i<=1000;i++){const V=i*0.05;pts.push([V,pHof(pair,dir,V,acidKey)]);}return pts;}
function steepBand(pts){ // pH range around V=25 where |slope| > 1 pH per cm³
  const i0=500;let a=i0,b=i0;const sl=i=>Math.abs(pts[i+1][1]-pts[i-1][1])/0.1;
  while(a>1&&sl(a-1)>1)a--;while(b<999&&sl(b+1)>1)b++;
  const p1=pts[a][1],p2=pts[b][1];return [Math.min(p1,p2),Math.max(p1,p2)];
}

/* ---------- state ---------- */
const S={cur:0,pair:'SS',dir:'b2a',acid:'eth',V:12.5,all:false,ind:false,half:false,steep:false,ans:{},att:0,right:0,mys:null,mysN:0};
const $=s=>document.querySelector(s);

/* ---------- graph ---------- */
const W=640,H=430,L=54,R=150,T=16,B=50;
const X=v=>L+v/50*(W-L-R), Y=p=>T+(14-p)/14*(H-T-B);
const path=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+','+Y(Math.max(0,Math.min(14,p[1]))).toFixed(1)).join('');
const txt=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Segoe UI,system-ui,sans-serif" font-size="${o.size||12}" font-weight="${o.w||500}" fill="${o.fill||'#2b2118'}" text-anchor="${o.a||'start'}">${s}</text>`;
function names(){
  const st=steps[S.cur]||{}, P=PAIRS[S.pair], mys=st.mystery;
  const acidName=P.wa?ACIDS[S.acid].f:'HCl';
  const acid=mys?'acid':acidName, base=mys?'base':P.base;
  const flask=S.dir==='b2a'?acid:base, titrant=S.dir==='b2a'?base:acid;
  return {flask,titrant,acidName};
}
function draw(){
  const st=steps[S.cur]||{};
  const pts=curve(S.pair,S.dir,S.acid);
  const n=names();
  let s=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="#fffdf8"/>`;
  for(let v=0;v<=50;v+=1){const maj=v%5===0;s+=`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${H-B}" stroke="${maj?'#ddbf98':'#f3e6d2'}" stroke-width="${maj?1:.6}"/>`;}
  for(let p=0;p<=14;p+=0.5){const maj=p%1===0;s+=`<line x1="${L}" y1="${Y(p)}" x2="${W-R}" y2="${Y(p)}" stroke="${maj?'#ddbf98':'#f3e6d2'}" stroke-width="${maj?1:.6}"/>`;}
  for(let v=0;v<=50;v+=10)s+=txt(X(v),H-B+16,v,{a:'middle',size:11});
  for(let p=0;p<=14;p+=2)s+=txt(L-7,Y(p)+4,p,{a:'end',size:11});
  s+=txt((L+W-R)/2,H-12,`Volume of ${n.titrant}(aq) added / cm³`,{a:'middle',size:12.5});
  s+=`<g transform="translate(16,${(T+H-B)/2}) rotate(-90)">${txt(0,0,'pH',{a:'middle',size:12.5,w:700})}</g>`;
  s+=`<rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="none" stroke="#2b2118" stroke-width="1.2"/>`;
  // indicator bands
  if(S.ind){INDS.forEach((I,i)=>{const id='g'+I.k;
    s+=`<defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${I.c1}"/><stop offset="1" stop-color="${I.c2}"/></linearGradient></defs>`;
    s+=`<rect x="${L}" y="${Y(I.hi)}" width="${W-L-R}" height="${Y(I.lo)-Y(I.hi)}" fill="url(#${id})" opacity=".28"/>`;
    s+=`<rect x="${W-R+6}" y="${Y(I.hi)}" width="12" height="${Y(I.lo)-Y(I.hi)}" fill="url(#${id})" stroke="#9a8a76" stroke-width=".6"/>`;
    const ok=!st.mystery&&SUIT[S.pair].includes(I.k);
    s+=txt(W-R+24,(Y(I.hi)+Y(I.lo))/2-2,I.name,{size:11,w:700});
    s+=txt(W-R+24,(Y(I.hi)+Y(I.lo))/2+12,`pH ${I.lo}–${I.hi}${st.mystery?'':ok?' ✓':' ✗'}`,{size:10.5,fill:st.mystery?'#6e5d4c':ok?'#2f7a3d':'#a3322a',w:600});});}
  // steep section
  const band=steepBand(pts);
  if(S.steep&&S.pair!=='WW'){s+=`<rect x="${X(23.5)}" y="${Y(band[1])}" width="${X(26.5)-X(23.5)}" height="${Y(band[0])-Y(band[1])}" fill="none" stroke="#2f6fb8" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    s+=txt(X(27),Y(band[1])+12,`vertical section`,{size:11,fill:'#2f6fb8',w:700})+txt(X(27),Y(band[1])+26,`pH ${band[0].toFixed(1)}–${band[1].toFixed(1)}`,{size:11,fill:'#2f6fb8'});}
  // all four
  if(S.all){Object.keys(PAIRS).forEach(k=>{if(k===S.pair)return;s+=`<path d="${path(curve(k,S.dir,S.acid))}" fill="none" stroke="#b9a68e" stroke-width="1.6"/>`;
      const p=curve(k,S.dir,S.acid)[1000][1];s+=txt(W-R+4,Y(p)+4,st.mystery?'':PAIRS[k].ex,{size:10,fill:'#8b7a66'});});}
  // half equivalence
  if(S.half){const ph=pHof(S.pair,S.dir,12.5,S.acid);
    s+=`<line x1="${X(12.5)}" y1="${H-B}" x2="${X(12.5)}" y2="${Y(ph)}" stroke="#a86a12" stroke-width="1.6" stroke-dasharray="5 4"/><line x1="${L}" y1="${Y(ph)}" x2="${X(12.5)}" y2="${Y(ph)}" stroke="#a86a12" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    s+=`<circle cx="${X(12.5)}" cy="${Y(ph)}" r="5" fill="#a86a12"/>`+txt(X(12.5)+8,Y(ph)-8,`half-equivalence: pH ${ph.toFixed(2)}`,{size:11.5,w:700,fill:'#a86a12'});
    s+=txt(X(12.5)+4,H-B-6,'12.50',{size:10.5,fill:'#a86a12',w:700});
    s+=`<line x1="${X(25)}" y1="${H-B}" x2="${X(25)}" y2="${Y(pHof(S.pair,S.dir,25,S.acid))}" stroke="#6e5d4c" stroke-dasharray="2 3"/>`+txt(X(25)+4,H-B-6,'25.00',{size:10.5,fill:'#6e5d4c'});}
  // main curve
  s+=`<path d="${path(pts)}" fill="none" stroke="#6b4226" stroke-width="2.6" stroke-linejoin="round"/>`;
  // annotations
  if(st.annot&&!st.mystery){const p0=pts[0][1],pe=pHof(S.pair,S.dir,25,S.acid),pf=pts[1000][1];
    s+=`<circle cx="${X(0)}" cy="${Y(p0)}" r="4.5" fill="#6b4226"/>`+txt(X(0)+8,Y(p0)+(S.dir==='b2a'?-6:16),`start pH ${p0.toFixed(1)}`,{size:11.5,w:700,fill:'#6b4226'});
    s+=`<circle cx="${X(25)}" cy="${Y(pe)}" r="5" fill="#fff" stroke="#6b4226" stroke-width="2"/>`+txt(X(25)-8,Y(pe)+4,`equivalence: 25.00 cm³, pH ${pe.toFixed(1)}`,{size:11.5,w:700,fill:'#6b4226',a:'end'});
    s+=txt(X(50)-4,Y(pf)+(S.dir==='b2a'?18:-8),`final pH ${pf.toFixed(1)}`,{size:11.5,w:700,fill:'#6b4226',a:'end'});}
  // cursor
  const pv=pHof(S.pair,S.dir,S.V,S.acid);
  s+=`<line x1="${X(S.V)}" y1="${T}" x2="${X(S.V)}" y2="${H-B}" stroke="#2f6fb8" stroke-width="1" opacity=".5"/><circle cx="${X(S.V)}" cy="${Y(pv)}" r="6" fill="#2f6fb8" stroke="#fff" stroke-width="2"/>`;
  s+=txt(L+8,T+16,`Flask: 25.0 cm³ of 0.100 mol dm⁻³ ${n.flask}`,{size:11.5,fill:'#6e5d4c'});
  s+=txt(L+8,T+31,`Burette: 0.100 mol dm⁻³ ${n.titrant}`,{size:11.5,fill:'#6e5d4c'});
  $('#svgwrap').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="pH curve">${s}</svg>`;
  $('#rV').textContent=S.V.toFixed(2)+' cm³';$('#rpH').textContent=pv.toFixed(2);
  $('#rFlask').textContent=flaskText(st.mystery);
}
function flaskText(mys){
  if(mys)return 'Identify the acid and base from the shape of the curve.';
  const P=PAIRS[S.pair],a=P.wa?ACIDS[S.acid].f:'HCl',an=P.wa?ACIDS[S.acid].f.replace(/H$/,'⁻').replace('COOH⁻','COO⁻'):'Cl⁻',base=P.base,bh=P.wb?'NH₄⁺':'Na⁺';
  const V=S.V, b2a=S.dir==='b2a';
  if(V<0.02)return `${b2a?a:base} only (nothing added yet)`;
  if(Math.abs(V-25)<0.03)return `Equivalence point: salt solution only (${bh} and ${an})`;
  const acidXs=b2a?V<25:V>25;
  if(acidXs){
    return P.wa?`Buffer: ${a} and ${an} (excess weak acid)`:`Excess strong acid (H⁺) plus salt`;}
  return P.wb?`Buffer: NH₃ and NH₄⁺ (excess weak base)`:`Excess strong base (OH⁻) plus salt`;
}

/* ---------- controls ---------- */
$('#segPair').innerHTML=Object.entries(PAIRS).map(([k,p])=>`<button data-v="${k}">${p.ex}</button>`).join('');
$('#segAcid').innerHTML=Object.entries(ACIDS).map(([k,a])=>`<button data-v="${k}">${a.f}</button>`).join('');
function syncControls(){
  const st=steps[S.cur]||{};
  [...$('#segPair').children].forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===S.pair);b.disabled=!!st.lockPair&&b.dataset.v!==S.pair;b.hidden=!!st.mystery;});
  $('#segPair').parentElement.hidden=!!st.mystery;
  [...$('#segDir').children].forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===S.dir);b.disabled=!!st.lockDir&&b.dataset.v!==S.dir;});
  $('#segDir').parentElement.hidden=!!st.mystery;
  [...$('#segAcid').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.acid));
  $('#acidRow').hidden=!st.acidPick;

  if(done!==undefined)h+=`<p class="fb ${done===item.a?'ok':'no'}">${done===item.a?'Correct. ':'Not quite. '}${item.e}</p>`;

function renderSummary(){
  ITEMS={};summary.forEach((q,j)=>ITEMS['s'+j]=q);
  let h=`<div class="summary"><p class="eyebrow">Evaluation</p><h2>Common exam points</h2><div class="evals">${evals.map(([a,b])=>`<div class="eval"><b>${a}.</b> ${b}</div>`).join('')}</div><h4>Summary questions</h4>`;
  summary.forEach((q,j)=>h+=`<section class="card"><p class="q"><span class="qnum">Q${j+1}</span>${q.q}</p>${mcq('s'+j,q,j+21)}</section>`);
  if(summary.every((q,j)=>S.ans['s'+j]!==undefined)){const sc=summary.filter((q,j)=>S.ans['s'+j]===q.a).length;h+=`<div class="final"><b>Summary quiz: ${sc} / ${summary.length}</b><br>Whole walkthrough: ${S.right} / ${S.att} correct first time.</div>`;}
  h+=`<div class="nav"><button class="btn ghost" id="prev">← Back to step ${steps.length}</button><button class="btn" id="restart">Start again</button></div></div>`;
  $('#below').innerHTML=h;
  $('#prev').onclick=()=>go(steps.length-1);$('#restart').onclick=()=>{S.ans={};S.att=0;S.right=0;go(0);};
  $('#score').textContent=`Score ${S.right} / ${S.att}`;rail();
}
$('#below').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const key=b.dataset.key,k=+b.dataset.k;S.ans[key]=k;S.att++;if(k===ITEMS[key].a)S.right++;
  if(S.cur===steps.length)renderSummary();else renderBelow();});
function go(i){
  S.cur=Math.max(0,Math.min(steps.length,i));
  const st=steps[S.cur];
  $('#stage').hidden=!st;
  if(!st){renderSummary();window.scrollTo({top:0,behavior:'smooth'});return;}
  if(st.mystery){if(!S.mys)newMystery();S.pair=S.mys.pair;S.dir=S.mys.dir;S.acid='eth';}
  else{if(st.pair)S.pair=st.pair;if(st.dir)S.dir=st.dir;if(!st.acidPick)S.acid='eth';}
  S.ind=!!st.ind;S.half=!!st.half;S.steep=!!st.steep;S.all=false;S.V=st.half?12.5:12.5;
  syncControls();draw();renderText();renderBelow();
  window.scrollTo({top:0,behavior:'smooth'});
}
const _segAcid=$('#segAcid').onclick;
$('#segAcid').onclick=e=>{_segAcid(e);};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight')go(S.cur+1);if(e.key==='ArrowLeft')go(S.cur-1);});
go(0);
</script>

</body></html>
