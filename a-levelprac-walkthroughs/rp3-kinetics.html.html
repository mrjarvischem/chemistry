<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rate and Temperature Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: step rail on top, picture beside instructions, question and mistake cards below. Single light (projector) theme by choice. */
:root{
  --paper:#f7f1e6; --panel:#fffdf8; --ink:#2b2118; --muted:#6e5d4c;
  --brown:#6b4226; --brown-2:#8a5a36; --line:#e2d5c0; --soft:#f1e7d6;
  --good:#2f7a3d; --good-bg:#e5f2e3; --bad:#a3322a; --bad-bg:#f8e3df; --amber:#a86a12;
  --display:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--brown);padding-bottom:12px}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;color:var(--brown);text-wrap:balance;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{font-family:var(--mono);font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--brown);white-space:nowrap}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.rail button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.rail button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.rail button.done:not(.on){border-color:var(--good);color:var(--good)}
.rail button:focus-visible,.opt:focus-visible,.nav button:focus-visible,.pred button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.pic{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.pic svg{width:100%;height:auto;display:block}
.eyebrow{font:700 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brown-2);margin:0}
h2{font-family:var(--display);font-size:1.55rem;margin:2px 0 8px;line-height:1.2;text-wrap:balance}
.how{margin:0 0 10px;padding-left:20px}
.how li{margin-bottom:4px}
.why{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.95rem;margin:0}
.why b{color:var(--brown)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card h3{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--brown)}
.card.mistake{border-top:4px solid var(--bad)}
.card.mcq{border-top:4px solid var(--brown)}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:.95rem;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--brown-2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;font-size:.93rem;padding:9px 12px;border-radius:8px;background:var(--soft)}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.pred{display:flex;flex-wrap:wrap;gap:8px}
.pred button{flex:1 1 110px;font:600 .9rem var(--body);border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 8px;cursor:pointer;color:var(--ink)}
.pred button.right{background:var(--good-bg);border-color:var(--good)}
.pred button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.effect{display:inline-block;font:700 .8rem var(--mono);padding:2px 8px;border-radius:4px;background:var(--bad);color:#fff;margin-right:6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{font:600 .95rem var(--body);background:var(--brown);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.nav button.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.nav button:disabled{opacity:.35;cursor:default}
.summary .card{margin-bottom:14px}
.summary h4{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--brown-2);margin:22px 0 8px}
.qnum{font-family:var(--mono);color:var(--brown-2);margin-right:6px}
.tag{font:700 .7rem var(--body);letter-spacing:.05em;text-transform:uppercase;background:var(--soft);color:var(--brown);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.final{background:var(--brown);color:#fff;border-radius:10px;padding:16px 18px;margin-top:8px}
.final b{font-family:var(--display);font-size:1.3rem}
.evals{display:grid;gap:10px;margin:0 0 6px}
.eval{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px}
.eval b{color:var(--brown)}
sub,sup{line-height:0}
@media (prefers-reduced-motion:no-preference){.fadein{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Rate and Temperature Walkthrough</h1>
      <p class="sub">AQA Required Practical 3 · Na₂S₂O₃(aq) + 2HCl(aq) → 2NaCl(aq) + SO₂(g) + S(s) + H₂O(l)</p>
    </div>
    <div class="score" id="score">Score 0 / 0</div>
  </header>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- drawing helpers (viewBox 400 x 320) ---------- */
const C={glass:"#5a4632",thio:"#e8f0f4",acid:"#cde4f1",sulfur:"#efe2a2",water:"#bcd9ec",ink:"#2b2118",red:"#a3322a",brown:"#6b4226",muted:"#6e5d4c",wood:"#c9b28f",steel:"#8a8f96",good:"#2f7a3d"};
let uid=0;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Segoe UI,system-ui,sans-serif" font-size="${o.size||11.5}" font-weight="${o.w||500}" fill="${o.fill||C.ink}" text-anchor="${o.a||'start'}">${s}</text>`;
const lead=(x1,y1,x2,y2,col)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col||C.muted}" stroke-width="1"/><circle cx="${x2}" cy="${y2}" r="2" fill="${col||C.muted}"/>`;
function lbl(x,y,lines,tx,ty,o={}){
  const wd=Math.max(...lines.map(l=>l.length))*6.1;
  const sx=o.lx??(tx>x+wd?x+wd+4:x-4);
  let s=tx!=null?lead(sx,o.ly??(y-4),tx,ty,o.col):"";
  lines.forEach((l,i)=>s+=T(x,y+i*14,l,{a:o.a,w:i?400:(o.w||600),fill:o.col&&!i?o.col:C.ink}));
  return s;
}
function flask(cx,by,liq,frac,o={}){
  const id="fk"+(uid++);
  const p=`M${cx-11},${by-112} L${cx-11},${by-72} L${cx-48},${by-6} Q${cx-50},${by} ${cx-43},${by} L${cx+43},${by} Q${cx+50},${by} ${cx+48},${by-6} L${cx+11},${by-72} L${cx+11},${by-112}`;
  const h=frac*70;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs>`;
  s+=`<path d="${p} Z" fill="#fff" fill-opacity=".55"/>`;
  if(liq)s+=`<rect clip-path="url(#${id})" x="${cx-60}" y="${by-h}" width="120" height="${h}" fill="${liq}" fill-opacity="${o.op??1}"/>`;
  s+=`<path d="${p}" fill="none" stroke="${C.glass}" stroke-width="1.8"/><path d="M${cx-14},${by-112} L${cx+14},${by-112}" stroke="${C.glass}" stroke-width="2"/>`;
  return s;
}
function bench(y){return `<rect x="0" y="${y}" width="400" height="${320-y}" fill="${C.wood}" opacity=".35"/>`;}
function eye(x,y,rot){return `<g transform="translate(${x},${y}) rotate(${rot||0})"><path d="M-16,0 Q0,-11 16,0 Q0,11 -16,0 Z" fill="#fff" stroke="${C.ink}" stroke-width="1.4"/><circle cx="4" cy="0" r="4.5" fill="${C.brown}"/><circle cx="5" cy="-1" r="1.6" fill="#fff"/></g>`;}
function cyl(cx,by,h,frac,col){
  const w=24,top=by-h,id="cy"+(uid++);
  let s=`<rect x="${cx-34}" y="${by-6}" width="68" height="6" rx="2" fill="#fff" stroke="${C.glass}" stroke-width="1.4"/>`;
  s+=`<defs><clipPath id="${id}"><rect x="${cx-w/2}" y="${top}" width="${w}" height="${h-6}"/></clipPath></defs>`;
  s+=`<rect clip-path="url(#${id})" x="${cx-w/2}" y="${by-6-(h-6)*frac}" width="${w}" height="${(h-6)*frac}" fill="${col}"/>`;
  s+=`<path d="M${cx-w/2},${top} L${cx-w/2},${by-6} L${cx+w/2},${by-6} L${cx+w/2},${top} M${cx-w/2-4},${top-2} L${cx-w/2},${top+3}" fill="none" stroke="${C.glass}" stroke-width="1.6"/>`;
  for(let i=1;i<10;i++){const y=by-6-i*(h-14)/10;s+=`<line x1="${cx-w/2}" y1="${y}" x2="${cx-w/2+(i%5?5:10)}" y2="${y}" stroke="${C.glass}" stroke-width=".8"/>`;}
  return s;
}
function btube(cx,top,len,col,frac,o={}){
  const w=22,id="bt"+(uid++),bot=top+len;
  const p=`M${cx-w/2},${top} L${cx-w/2},${bot-w/2} A${w/2},${w/2} 0 0 0 ${cx+w/2},${bot-w/2} L${cx+w/2},${top}`;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs><path d="${p} Z" fill="#fff" fill-opacity=".55"/>`;
  if(col)s+=`<rect clip-path="url(#${id})" x="${cx-w}" y="${bot-len*frac}" width="${w*2}" height="${len*frac}" fill="${col}"/>`;
  s+=`<path d="${p}" fill="none" stroke="${C.glass}" stroke-width="1.6"/>`;
  return s;
}
function thermo(x,top,bot,frac){
  const lv=bot-(bot-top-14)*frac;
  return `<rect x="${x-3}" y="${top}" width="6" height="${bot-top}" rx="3" fill="#f6f3ee" stroke="#8a8a8a" stroke-width="1"/><circle cx="${x}" cy="${bot}" r="5" fill="${C.red}"/><rect x="${x-1.2}" y="${lv}" width="2.4" height="${bot-lv}" fill="${C.red}"/>`;
}
function stopwatch(cx,cy,txt){
  return `<rect x="${cx-5}" y="${cy-36}" width="10" height="8" rx="2" fill="${C.steel}"/><circle cx="${cx}" cy="${cy}" r="28" fill="#fff" stroke="${C.brown}" stroke-width="3"/>`+T(cx,cy+6,txt,{a:"middle",size:16,w:700,fill:C.brown});
}
function paper(cx,y){
  return `<path d="M${cx-92},${y} L${cx+78},${y} L${cx+92},${y+16} L${cx-78},${y+16} Z" fill="#fff" stroke="#bfb3a1"/>`;
}
function topView(cx,cy,r,cloud,o={}){ // looking down through the flask at the cross
  const id="tv"+(uid++);
  let s=`<defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${C.brown}" stroke-width="2"/>`;
  s+=`<g clip-path="url(#${id})"><path d="M${cx-r*.5},${cy-r*.5} L${cx+r*.5},${cy+r*.5} M${cx+r*.5},${cy-r*.5} L${cx-r*.5},${cy+r*.5}" stroke="#111" stroke-width="${r*.16}" stroke-linecap="round"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.sulfur}" fill-opacity="${cloud}"/></g>`;
  if(o.label)s+=T(cx,cy+r+16,o.label,{a:"middle",size:10.5,fill:C.muted});
  return s;
}
function bath(x,by,w,h,o={}){
  let s=`<rect x="${x}" y="${by-h*0.82}" width="${w}" height="${h*0.82}" fill="${C.water}" fill-opacity=".55"/>`;
  s+=`<path d="M${x},${by-h} L${x},${by} L${x+w},${by} L${x+w},${by-h}" fill="none" stroke="${C.glass}" stroke-width="2"/>`;
  return s;
}
function arrow(x1,y1,x2,y2){const a=Math.atan2(y2-y1,x2-x1),h=9;return `<path d="M${x1},${y1} L${x2},${y2} M${x2},${y2} L${x2-h*Math.cos(a-.4)},${y2-h*Math.sin(a-.4)} M${x2},${y2} L${x2-h*Math.cos(a+.4)},${y2-h*Math.sin(a+.4)}" fill="none" stroke="${C.brown}" stroke-width="2" stroke-dasharray="${o_dash}"/>`;}
let o_dash="5 4";
const svg=inner=>`<svg viewBox="0 0 400 320" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

/* ---------- data (Ea ≈ 50 kJ mol⁻¹) ---------- */
const DATA=[[21.0,101.6],[30.5,51.5],[39.5,30.7],[49.0,16.4],[58.5,10.2]];

/* ---------- pictures for each step ---------- */
const pics=[
 ()=>svg(bench(292)+cyl(70,290,150,.45,C.thio)+flask(200,290,C.thio,.32)+cyl(320,290,150,.45,C.acid)
   +`<path d="M84,128 C120,96 160,104 192,170" fill="none" stroke="${C.brown}" stroke-width="2" stroke-dasharray="5 4"/><path d="M192,170 l-1,-11 m1,11 l-9,-6" stroke="${C.brown}" stroke-width="2" fill="none"/>`
   +lbl(14,28,["10.0 cm³ Na₂S₂O₃(aq)","0.15 mol dm⁻³"],60,214)
   +lbl(262,28,["10.0 cm³ HCl(aq)","1.0 mol dm⁻³"],322,214)
   +lbl(140,312,["Conical flask"],null)
   +T(262,90,"Separate measuring",{w:600})+T(262,104,"cylinder for each")+T(262,118,"solution")),
 ()=>svg(bench(296)+bath(40,294,320,150)+flask(150,290,C.thio,.32)+thermo(150,100,262,.45)+btube(280,108,170,C.acid,.32)+thermo(286,74,262,.45)
   +`<rect x="50" y="290" width="300" height="6" fill="#5b544d"/>`
   +lbl(20,28,["Both solutions in the water","bath until each reaches","the set temperature"])
   +lbl(250,30,["Thermometer in each"],286,80)
   +T(200,312,"water bath, e.g. 40 °C",{a:"middle",size:11.5,fill:"#2f6fb8",w:600})),
 ()=>svg(bench(280)+paper(170,268)+`<path d="M150,270 L190,282 M190,270 L150,282" stroke="#111" stroke-width="4" stroke-linecap="round"/>`+flask(170,276,C.thio,.32,{op:.7})
   +topView(320,120,48,0,{label:"view from above"})
   +lbl(14,30,["Cross drawn in black","on white paper"],128,276)
   +lbl(250,216,["Use the same cross and","the same observer","for every run"])),
 ()=>svg(bench(280)+paper(160,268)+`<path d="M140,270 L180,282 M180,270 L140,282" stroke="#111" stroke-width="4" stroke-linecap="round"/>`+flask(160,276,C.thio,.4)
   +`<g transform="rotate(-127 176 150)">${btube(176,150,140,null,0)}</g>`
   +`<path d="M170,154 q-4,30 -6,62" stroke="#9cc6e0" stroke-width="4" fill="none"/>`
   +stopwatch(330,210,"0 s")
   +lbl(14,40,["Pour in all the acid","and start the timer","at the same moment"])
   +lbl(276,272,["Swirl once, then","leave on the cross"])),
 ()=>svg(bench(280)+paper(150,268)+flask(150,276,C.sulfur,.4)+eye(150,40,90)
   +`<line x1="150" y1="58" x2="150" y2="200" stroke="${C.brown}" stroke-dasharray="3 3"/>`
   +topView(300,92,40,.25,{label:"cloudy"})+topView(300,208,40,.97,{label:"cross gone: stop"})
   +stopwatch(64,206,"31 s")
   +lbl(14,30,["Look down through","the solution"])
   +lbl(170,135,["Pale yellow sulfur","forms"],160,252)),
 ()=>svg(bench(280)+paper(150,268)+flask(150,276,C.sulfur,.4)+thermo(150,80,250,.42)
   +`<rect x="200" y="96" width="190" height="98" rx="6" fill="#fff" stroke="#d7c8b0"/>`
   +T(212,120,"Start temperature",{size:12})+T(380,120,"41.0 °C",{a:"end",size:12,w:700})
   +T(212,146,"End temperature",{size:12})+T(380,146,"38.0 °C",{a:"end",size:12,w:700})
   +`<line x1="208" y1="158" x2="382" y2="158" stroke="#e6dac6"/>`
   +T(212,180,"Mean",{size:12,w:700,fill:C.brown})+T(380,180,"39.5 °C",{a:"end",size:13,w:700,fill:C.brown})
   +lbl(14,30,["Measure the mixture,","not the water bath"],148,96)),
 ()=>{let s=`<rect x="20" y="18" width="360" height="226" rx="6" fill="#fff" stroke="#d7c8b0"/>`;
   const hd=["T / °C","Time / s","1/t / s⁻¹"],cx=[80,200,310];
   hd.forEach((h,j)=>s+=T(cx[j],44,h,{a:"middle",w:700,size:12.5}));
   s+=`<line x1="30" y1="54" x2="370" y2="54" stroke="#d7c8b0"/>`;
   DATA.forEach(([c,t],i)=>{const y=78+i*34;s+=T(cx[0],y,c.toFixed(1),{a:"middle",size:12.5})+T(cx[1],y,t.toFixed(1),{a:"middle",size:12.5})+T(cx[2],y,(1/t).toFixed(4),{a:"middle",size:12.5,fill:C.brown,w:600});if(i<4)s+=`<line x1="30" y1="${y+12}" x2="370" y2="${y+12}" stroke="#eee3d2"/>`;});
   s+=`<rect x="60" y="258" width="280" height="44" rx="6" fill="#f1e7d6"/>`+T(200,277,"Each time is the mean of repeat runs",{a:"middle",size:12})+T(200,294,"rate ∝ 1/t",{a:"middle",size:13,w:700,fill:C.brown});
   return svg(s);},
 ()=>{const L=62,R=380,Tp=24,B=262,x0=3.00e-3,x1=3.42e-3,y0=-4.8,y1=-2.0;
   const X=v=>L+(v-x0)/(x1-x0)*(R-L),Y=v=>B-(v-y0)/(y1-y0)*(B-Tp);
   let s=`<rect x="${L}" y="${Tp}" width="${R-L}" height="${B-Tp}" fill="#fffdf8" stroke="${C.ink}"/>`;
   for(let v=3.05e-3;v<=3.41e-3;v+=0.05e-3)s+=`<line x1="${X(v)}" y1="${Tp}" x2="${X(v)}" y2="${B}" stroke="#efe3cf"/>`+T(X(v),B+14,(v*1e3).toFixed(2),{a:"middle",size:9.5,fill:C.muted});
   for(let v=-4.5;v<=-2.0;v+=0.5)s+=`<line x1="${L}" y1="${Y(v)}" x2="${R}" y2="${Y(v)}" stroke="#efe3cf"/>`+T(L-6,Y(v)+3,v.toFixed(1),{a:"end",size:9.5,fill:C.muted});
   s+=T((L+R)/2,B+32,"1/T  / 10⁻³ K⁻¹",{a:"middle",size:11});
   s+=`<g transform="translate(14,${(Tp+B)/2}) rotate(-90)">${T(0,0,"ln(1/t)",{a:"middle",size:11})}</g>`;
   const pts=DATA.map(([c,t])=>[1/(c+273.15),Math.log(1/t)]);
   const m=-5978,c=pts.reduce((a,p)=>a+p[1]-m*p[0],0)/pts.length;
   s+=`<line x1="${X(3.0e-3)}" y1="${Y(m*3.0e-3+c)}" x2="${X(3.415e-3)}" y2="${Y(m*3.415e-3+c)}" stroke="#2f6fb8" stroke-width="2"/>`;
   pts.forEach(([x,y])=>s+=`<path d="M${X(x)-4},${Y(y)-4} l8,8 m0,-8 l-8,8" stroke="${C.brown}" stroke-width="2"/>`);
   s+=`<rect x="196" y="36" width="174" height="44" rx="5" fill="#fff" stroke="#d7c8b0"/>`+T(206,54,"gradient = −Eₐ / R",{size:12,w:700,fill:"#2f6fb8"})+T(206,71,"≈ −5980 K → Eₐ ≈ 50 kJ mol⁻¹",{size:10.5});
   return svg(s);}
];

/* ---------- content ---------- */
const TIME={higher:"Time longer",lower:"Time shorter",none:"No effect"};
const steps=[
 {t:"Measure out the solutions",how:["Measure 10.0 cm³ of 0.15 mol dm⁻³ sodium thiosulfate into a conical flask.","Measure 10.0 cm³ of 1.0 mol dm⁻³ hydrochloric acid into a boiling tube.","Use a separate measuring cylinder for each solution, and the same volumes in every run."],
  why:"Temperature is the <b>independent variable</b>. Concentrations and volumes are <b>control variables</b>, so they must be the same every run.",
  q:{q:"Why must the total volume of the mixture be the same in every run?",o:["The depth of liquid you look through must be the same, so the same amount of sulfur hides the cross","A larger volume would react faster","So the flask does not overflow when the acid is added","The volume affects the activation energy"],a:0,e:"You are timing how long it takes to make a fixed amount of sulfur. A deeper or shallower solution changes how much sulfur is needed to hide the cross."},
  m:{t:"The same measuring cylinder is used for the acid and then the thiosulfate, without rinsing.",fx:"lower",e:"Acid left in the cylinder starts the reaction early, so some sulfur forms before the timer starts. The cross disappears sooner: the recorded time is <b>too short</b>."}},
 {t:"Warm both solutions separately",how:["Stand the flask of thiosulfate and the tube of acid in a water bath at the chosen temperature.","Put a thermometer in each and wait until both reach the set temperature.","For room temperature, leave both on the bench to stand."],
  why:"If only one solution is warmed, the mixture ends up at a lower temperature than intended. Heating after mixing would let the reaction start at the wrong temperature.",
  q:{q:"Why are the solutions heated separately, rather than mixed first and then heated?",o:["The reaction would start before the mixture reached the set temperature","Heating the mixture would release too much SO₂","Thiosulfate decomposes when heated alone","The water bath can only hold one container"],a:0,e:"The reaction starts as soon as the solutions meet. Bringing both to temperature first means the reaction runs at that temperature from the start."},
  m:{t:"Only the thiosulfate is warmed. The acid is added straight from the bottle at room temperature.",fx:"higher",e:"The cold acid lowers the temperature of the mixture, so the reaction is slower than it should be at the recorded temperature. The time is <b>too long</b>."}},
 {t:"Place the flask on the cross",how:["Draw a bold black cross on white paper.","Put the conical flask of warm thiosulfate on top of the cross.","Use the same cross, the same lighting and the same observer for every run."],
  why:"The end point is judged by eye, so it is <b>subjective</b>. Keeping everything else the same makes the judgement as consistent as possible.",
  q:{q:"Why should the same person judge the end point in every run?",o:["People differ in when they decide the cross has disappeared","One person can work the stopwatch faster","So the readings are more precise to 0.01 s","To reduce the risk of breathing in SO₂"],a:0,e:"The end point is a judgement. Different observers would stop the timer at different amounts of cloudiness, adding random error between runs."},
  m:{t:"For the hotter runs a thicker, darker cross is used because the old one was smudged.",fx:"higher",e:"A bolder cross needs more sulfur to hide it, so the reaction must go further before you stop the timer. The time is <b>too long</b>."}},
 {t:"Mix and start the timer",how:["Pour all the acid into the flask and start the stopwatch at the same moment.","Swirl once to mix, then put the flask straight back on the cross.","Do not keep swirling: the flask must stay still over the cross."],
  why:"The time measured must be from the moment the reactants meet.",
  q:{q:"Which equation shows the reaction that makes the solution cloudy?",o:["Na₂S₂O₃ + 2HCl → 2NaCl + SO₂ + S + H₂O","Na₂S₂O₃ + HCl → NaCl + H₂S + SO₃","Na₂S₂O₃ + 2HCl → 2NaCl + H₂SO₄ + S","Na₂S₂O₃ + 2HCl → Na₂S + 2HClO₃"],a:0,e:"Thiosulfate disproportionates in acid to give a precipitate of sulfur (the cloudiness) and sulfur dioxide gas."},
  m:{t:"The stopwatch is started a few seconds after the acid has been poured in.",fx:"lower",e:"The reaction has already been running before timing begins, so the recorded time is <b>too short</b>."}},
 {t:"Time until the cross disappears",how:["Look down through the solution from above.","A pale yellow precipitate of sulfur forms and the solution becomes cloudy.","Stop the timer at the moment you can no longer see the cross."],
  why:"The time taken to form a <b>fixed amount of sulfur</b> is measured each time, so a shorter time means a faster rate.",
  q:{q:"Why is it acceptable to use 1/t as a measure of rate?",o:["The same amount of sulfur is made by the end point in every run","1/t is the initial rate of the reaction","The time is directly proportional to the rate","1/t removes the effect of temperature"],a:0,e:"Rate = amount ÷ time. The amount of sulfur needed to hide the cross is fixed, so rate is proportional to 1/t."},
  m:{t:"The timer is stopped when the solution first turns cloudy, not when the cross disappears.",fx:"lower",e:"Less sulfur has formed at this point than at the true end point, so the recorded time is <b>too short</b>. It also makes the end point harder to judge consistently."}},
 {t:"Measure the mixture temperature",how:["Measure the temperature of the mixture at the start and at the end of the run.","Record the mean as the temperature of that run.","The mixture cools during the run, especially at higher temperatures."],
  why:"The temperature that matters is the temperature of the reacting mixture, not the water bath.",
  q:{q:"Why is a mean of the start and end temperatures recorded?",o:["The mixture loses heat during the reaction, so its temperature changes","The thermometer is only accurate to ±1 °C","The reaction is very exothermic","So that the run can be repeated at the same temperature"],a:0,e:"A warm mixture cools towards room temperature as it reacts. The mean is a better estimate of the temperature during the reaction."},
  ask:"Is the temperature recorded for this run too high, too low or unaffected?",lab:{higher:"Too high",lower:"Too low",none:"Unaffected"},
  m:{t:"At 60 °C, the temperature of the water bath is recorded instead of the temperature of the mixture.",fx:"higher",e:"The mixture is cooler than the water bath by the time it reacts. The recorded temperature is <b>too high</b>, so the point is plotted at the wrong temperature."}},
 {t:"Repeat at different temperatures",how:["Repeat at about five temperatures between room temperature and 60 °C.","Do each temperature at least twice and calculate a mean time.","Wash and dry the flask between runs.","Calculate 1/t for each temperature."],
  why:"Above about 60 °C the times are too short to measure accurately, and more SO₂ is given off.",
  q:{q:"Why are temperatures above about 60 °C avoided?",o:["The times are very short, so reaction-time error is a large percentage, and more SO₂ is released","The thiosulfate boils","Sulfur does not precipitate above 60 °C","The thermometer cannot read above 60 °C"],a:0,e:"A reaction time of ±0.5 s is small next to 100 s but large next to 8 s. SO₂ is also less soluble in hot water, so more escapes."},
  m:{t:"The flask is not washed between runs, so a film of sulfur is left on the inside of the base.",fx:"lower",e:"The cross is partly hidden before the reaction starts, so it disappears sooner. The recorded time is <b>too short</b>."}},
 {t:"Process the results",how:["Plot rate (1/t) against temperature: the curve gets steeper as temperature rises.","For an Arrhenius plot, convert temperatures to kelvin and plot ln(1/t) against 1/T.","Gradient = −Eₐ/R, so Eₐ = −gradient × 8.31 J K⁻¹ mol⁻¹."],
  why:"A rise of 10 °C roughly doubles the rate here. Collision theory explains why: many more particles have energy ≥ Eₐ.",
  q:{q:"Which statement best explains why the rate increases with temperature?",o:["A much larger proportion of particles have energy greater than or equal to the activation energy","The activation energy decreases","Particles collide more often, and this is the main reason","More particles are present in the solution"],a:0,e:"Collision frequency does rise a little, but the main reason is the shift in the Maxwell–Boltzmann distribution: far more collisions have enough energy to react."},
  ask:"Where will this point lie on the ln(1/t) against 1/T graph?",lab:{higher:"Above the line",lower:"Below the line",none:"On the line"},
  m:{t:"For the 39.5 °C run, a more concentrated thiosulfate solution is used by mistake.",fx:"higher",e:"The higher concentration makes the reaction faster, so t is shorter and ln(1/t) is larger. The point lies <b>above</b> the line of best fit and should be treated as anomalous."}}
];
const summary=[
 {q:"What causes the cloudiness that hides the cross?",o:["A precipitate of sulfur","Bubbles of SO₂","A precipitate of sodium chloride","Undissolved thiosulfate"],a:0,e:"S(s) forms as a pale yellow precipitate. SO₂ is formed too, but it is mostly dissolved and does not cause the cloudiness."},
 {q:"At 20 °C the cross disappears in 80 s. At 30 °C it disappears in 40 s. What is the effect of the 10 °C rise on the rate?",o:["Rate doubles","Rate halves","Rate increases by 10 times","Rate increases by 40 s⁻¹"],a:0,e:"Rate ∝ 1/t. 1/40 ÷ 1/80 = 2, so the rate has doubled."},
 {q:"Human reaction time is about ±0.5 s. What is the percentage uncertainty for a time of 10.2 s?",o:["4.9%","0.5%","2.5%","49%"],a:0,e:"(0.5 ÷ 10.2) × 100 = 4.9%. At 101.6 s the same error is only 0.5%, so the high-temperature results are the least reliable."},
 {q:"Which change would make the end point less subjective?",o:["Use a light sensor or colorimeter to detect when the transmitted light drops to a set value","Use a larger cross","Swirl the flask throughout","Use a more concentrated acid"],a:0,e:"A sensor judges the same amount of cloudiness every time, removing the observer's judgement."},
 {q:"Which is the most important safety precaution in this practical?",o:["Good ventilation, because SO₂ is toxic and can trigger asthma","Wear gloves, because thiosulfate is corrosive","Use a Bunsen burner rather than a water bath","Keep the lid on the flask"],a:0,e:"SO₂ is toxic. Work in a ventilated room, keep temperatures below about 60 °C and dispose of the mixture promptly."},
 {q:"Which is a control variable in this investigation?",o:["Concentration of the thiosulfate","Temperature of the mixture","Time for the cross to disappear","Rate of reaction"],a:0,e:"Temperature is the independent variable and the time is the dependent variable. Concentration and volume must be kept the same."},
 {q:"The mixture cools during the run at 58.5 °C. Which is the best way to reduce this problem?",o:["Keep the flask in the water bath while it reacts and record the mean temperature","Use a larger flask","Start the timer earlier","Use a mercury thermometer"],a:0,e:"Keeping the mixture in the bath holds it closer to a constant temperature, and the mean gives the best single value."},
 {q:"A plot of ln(1/t) against 1/T has a gradient of −5980 K. What is the activation energy? (R = 8.31 J K⁻¹ mol⁻¹)",o:["49.7 kJ mol⁻¹","−49.7 kJ mol⁻¹","720 kJ mol⁻¹","0.720 kJ mol⁻¹"],a:0,e:"Gradient = −Eₐ/R, so Eₐ = 5980 × 8.31 = 49 700 J mol⁻¹ = 49.7 kJ mol⁻¹. Activation energy is always positive.",tag:"Year 2 link"},
 {q:"Why must temperatures be in kelvin for the Arrhenius plot?",o:["The Arrhenius equation uses absolute temperature; 1/T in °C gives wrong values and cannot be used at 0 °C","Kelvin values are larger, so the graph is easier to read","The gas constant only works for gases","It makes the gradient positive"],a:0,e:"k = Ae^(−Eₐ/RT) uses absolute temperature. Using °C would give a curve with the wrong gradient.",tag:"Year 2 link"}
];
const evals=[
 ["The end point is subjective","Different people stop at different amounts of cloudiness. Use one observer, the same cross and lighting, or a light sensor."],
 ["Reaction time is a large fraction of short times","At high temperatures, ±0.5 s is several percent of the time. Repeat runs and avoid temperatures above about 60 °C."],
 ["The mixture temperature changes","The mixture cools (or warms) towards room temperature during the run. Record the start and end temperatures and use the mean, or keep the flask in the bath."],
 ["The two solutions may not be at the same temperature","Warm both in the same bath and check each with a thermometer before mixing."],
 ["\"More collisions\" is not a full explanation","Mark schemes want: more particles have energy ≥ Eₐ, so a greater proportion of collisions are successful."],
 ["Say \"rate is proportional to 1/t\", not \"rate = 1/t\"","1/t is only proportional to rate because the same amount of sulfur forms by the end point each time."],
 ["SO₂ is toxic","Ventilate the room, keep the temperature below about 60 °C, and take care with students who have asthma."]
];

/* ---------- state & render ---------- */
const S={cur:0,ans:{},att:0,right:0};
const $=s=>document.querySelector(s);
function shuffleOrder(n,seed){const a=[...Array(n).keys()];let x=seed*9301+49297;for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updScore(){$("#score").textContent=`Score ${S.right} / ${S.att}`;}
function rail(){
  const r=$("#rail");r.innerHTML="";
  steps.forEach((s,i)=>{const b=document.createElement("button");b.textContent=`${i+1}. ${s.t}`;if(i===S.cur)b.classList.add("on");if(S.ans["q"+i]!==undefined&&S.ans["m"+i]!==undefined)b.classList.add("done");b.onclick=()=>go(i);r.appendChild(b);});
  const b=document.createElement("button");b.textContent="Evaluation & quiz";if(S.cur===steps.length)b.classList.add("on");b.onclick=()=>go(steps.length);r.appendChild(b);
}
function mcqHTML(key,item,seed){
  const ord=shuffleOrder(item.o.length,seed);
  const done=S.ans[key];
  let h=`<div class="opts">`;
  ord.forEach(k=>{let cls="";if(done!==undefined){if(k===item.a)cls="right";else if(k===done)cls="wrong";}
    h+=`<button class="opt ${cls}" data-key="${key}" data-k="${k}" ${done!==undefined?"disabled":""}>${item.o[k]}</button>`;});
  h+=`</div>`;
  if(done!==undefined)h+=`<p class="fb ${done===item.a?'ok':'no'}">${done===item.a?"Correct. ":"Not quite. "}${item.e}</p>`;
  return h;
}
function render(){
  rail();updScore();
  const m=$("#main");
  if(S.cur===steps.length){renderSummary();return;}
  const s=steps[S.cur],i=S.cur,md=S.ans["m"+i],lab=s.lab||TIME;
  m.innerHTML=`<div class="fadein">
   <div class="stage">
     <div class="pic">${pics[i]()}</div>
     <div>
       <p class="eyebrow">Step ${i+1} of ${steps.length}</p>
       <h2>${s.t}</h2>
       <ul class="how">${s.how.map(x=>`<li>${x}</li>`).join("")}</ul>
       <p class="why"><b>Why: </b>${s.why}</p>
     </div>
   </div>
   <div class="cards">
     <section class="card mcq"><h3>Check your understanding</h3><p class="q">${s.q.q}</p>${mcqHTML("q"+i,s.q,i+3)}</section>
     <section class="card mistake"><h3>Potential mistake</h3><p class="q">${s.m.t}</p>
       <p style="margin:0 0 8px;color:var(--muted);font-size:.9rem">${s.ask||"What happens to the time recorded for this run?"}</p>
       <div class="pred">${["higher","lower","none"].map(f=>{let c="";if(md!==undefined){if(f===s.m.fx)c="right";else if(f===md)c="wrong";}return `<button data-m="${i}" data-f="${f}" class="${c}" ${md!==undefined?"disabled":""}>${lab[f]}</button>`;}).join("")}</div>
       ${md!==undefined?`<p class="fb ${md===s.m.fx?'ok':'no'}"><span class="effect">${lab[s.m.fx]}</span>${s.m.e}</p>`:""}
     </section>
   </div>
   <div class="nav"><button class="ghost" id="prev" ${i===0?"disabled":""}>← Previous</button><button id="next">${i===steps.length-1?"Evaluation & quiz →":"Next step →"}</button></div>
  </div>`;
  $("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
  bind();
}
function renderSummary(){
  const m=$("#main");
  let h=`<div class="fadein summary"><p class="eyebrow">Evaluation</p><h2>Common exam points</h2><div class="evals">${evals.map(([a,b])=>`<div class="eval"><b>${a}.</b> ${b}</div>`).join("")}</div>`;
  h+=`<h4>Summary questions</h4>`;
  summary.forEach((q,j)=>{h+=`<section class="card mcq"><p class="q"><span class="qnum">Q${j+1}</span>${q.q}${q.tag?`<span class="tag">${q.tag}</span>`:""}</p>${mcqHTML("s"+j,q,j+11)}</section>`;});
  const answered=summary.filter((q,j)=>S.ans["s"+j]!==undefined).length;
  if(answered===summary.length){const sc=summary.filter((q,j)=>S.ans["s"+j]===q.a).length;h+=`<div class="final"><b>Summary quiz: ${sc} / ${summary.length}</b><br>Whole walkthrough: ${S.right} / ${S.att} correct first time.</div>`;}
  h+=`<div class="nav"><button class="ghost" id="prev">← Back to step ${steps.length}</button><button id="restart">Start again</button></div></div>`;
  m.innerHTML=h;
  $("#prev").onclick=()=>go(steps.length-1);
  $("#restart").onclick=()=>{S.ans={};S.att=0;S.right=0;go(0);};
  bind();
}
function bind(){
  document.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key,k=+b.dataset.k;S.ans[key]=k;S.att++;
    const item=key[0]==="q"?steps[+key.slice(1)].q:summary[+key.slice(1)];
    if(k===item.a)S.right++;render();
  });
  document.querySelectorAll(".pred button:not(:disabled)").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.m,f=b.dataset.f;S.ans["m"+i]=f;S.att++;if(f===steps[i].m.fx)S.right++;render();
  });
}
function go(i){S.cur=Math.max(0,Math.min(steps.length,i));render();window.scrollTo({top:0,behavior:"smooth"});}
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;if(e.key==="ArrowRight")go(S.cur+1);if(e.key==="ArrowLeft")go(S.cur-1);});
render();
</script>
