places chlorine.", "c": 0, "f": "A less reactive halogen cannot displace a more reactive one."}, {"t": "The solution turns brown/purple because iodine forms.", "c": 0, "f": "There is no iodine in either reactant."}], "e": " chlorine + potassium bromide → potassium chloride + bromine. Bromine in solution is orange."}], [{"s": "AQA Jun 2022 · 1H", "q": "Neon has three isotopes.<table><tr><th>Mass number</th><th>Percentage abundance (%)</th></tr><tr><td>20</td><td>90.48</td></tr><tr><td>21</td><td>0.27</td></tr><tr><td>22</td><td>9.25</td></tr></table>Calculate the relative atomic mass of neon. Give your answer to 3 significant figures.", "o": [{"t": "20.2", "c": 1, "f": ""}, {"t": "20.19", "c": 0, "f": "Your calculation is correct, but 20.19 is 4 significant figures."}, {"t": "20.1", "c": 0, "f": "You have truncated 20.1877 instead of rounding it. The next digit is 8, so round up."}, {"t": "21.0", "c": 0, "f": "That is the simple mean of 20, 21 and 22. Each isotope must be weighted by its abundance."}], "e": " (20 × 90.48 + 21 × 0.27 + 22 × 9.25) ÷ 100 = (1809.6 + 5.67 + 203.5) ÷ 100 = 20.1877 = 20.2 (3 s.f.)"}, {"s": "New question", "q": "Chlorine has two isotopes, chlorine-35 and chlorine-37. The relative atomic mass of chlorine is 35.5. What is the percentage abundance of chlorine-35?", "o": [{"t": "75%", "c": 1, "f": ""}, {"t": "25%", "c": 0, "f": "25% is the abundance of chlorine-37. Check which isotope 35.5 is closer to."}, {"t": "50%", "c": 0, "f": "A 50 : 50 mixture would give an A<sub>r</sub> of 36.0."}, {"t": "35.5%", "c": 0, "f": "35.5 is the relative atomic mass, not a percentage."}], "e": " Let x = % of Cl-35: 35x + 37(100 − x) = 3550 → 3700 − 2x = 3550 → x = 75%. Check: (35 × 75 + 37 × 25) ÷ 100 = 35.5 ✓"}, {"s": "AQA Nov 2021 · 1F/1H", "q": "Element R is extracted from its oxide by reduction with hydrogen:<br>3H<sub>2</sub> + RO<sub>3</sub> → R + 3H<sub>2</sub>O<br>The sum of the relative formula masses of the reactants (3H<sub>2</sub> + RO<sub>3</sub>) is 150. Calculate the A<sub>r</sub> of R. (A<sub>r</sub>: H = 1, O = 16)", "o": [{"t": "96", "c": 1, "f": ""}, {"t": "99", "c": 0, "f": "3H<sub>2</sub> contains 6 hydrogen atoms (mass 6), not 3."}, {"t": "128", "c": 0, "f": "RO<sub>3</sub> has three oxygen atoms: 3 × 16 = 48."}, {"t": "144", "c": 0, "f": "You subtracted the hydrogen but not the oxygen."}], "e": " 3H<sub>2</sub> = 3 × 2 = 6. O<sub>3</sub> = 3 × 16 = 48. A<sub>r</sub>(R) = 150 − 6 − 48 = 96, so R is molybdenum (Mo)."}, {"s": "New question", "q": "The radius of a nucleus is about 1 × 10<sup>−14</sup> m. What is this in nanometres? (1 nm = 1 × 10<sup>−9</sup> m)", "o": [{"t": "1 × 10<sup>−5</sup> nm", "c": 1, "f": ""}, {"t": "1 × 10<sup>5</sup> nm", "c": 0, "f": "Check the sign. A nucleus is much smaller than 1 nm, so the power must be negative."}, {"t": "1 × 10<sup>−23</sup> nm", "c": 0, "f": "You multiplied by 10<sup>−9</sup>. To convert m → nm, divide by 10<sup>−9</sup>."}, {"t": "1 × 10<sup>−14</sup> nm", "c": 0, "f": "That is the value in metres. It needs converting."}], "e": " Number of nm = 10<sup>−14</sup> ÷ 10<sup>−9</sup> = 10<sup>(−14 − −9)</sup> = 10<sup>−5</sup> nm. Atoms are about 0.1 nm (10<sup>−1</sup> nm), so the nucleus is 10 000 times smaller ✓"}, {"s": "New question", "q": "An aluminium ion is written <sup>27</sup><sub>13</sub>Al<sup>3+</sup>. How many protons, neutrons and electrons does it have?", "o": [{"t": "13 protons, 14 neutrons, 10 electrons", "c": 1, "f": ""}, {"t": "13 protons, 14 neutrons, 16 electrons", "c": 0, "f": "A 3+ charge means 3 electrons have been lost, not gained."}, {"t": "13 protons, 14 neutrons, 13 electrons", "c": 0, "f": "That is the neutral atom. The 3+ ion has lost 3 electrons."}, {"t": "13 protons, 27 neutrons, 10 electrons", "c": 0, "f": "27 is the mass number (protons + neutrons)."}], "e": " Protons = 13. Neutrons = 27 − 13 = 14. Electrons = 13 − 3 = 10 (electronic structure 2,8)."}, {"s": "New question", "q": "Bromine has two isotopes, <sup>79</sup>Br and <sup>81</sup>Br, in roughly equal amounts (50 : 50). Bromine molecules (Br<sub>2</sub>) can have three different relative formula masses. Which relative formula mass is the most common?", "o": [{"t": "160", "c": 1, "f": ""}, {"t": "158", "c": 0, "f": "158 is <sup>79</sup>Br–<sup>79</sup>Br. That only happens one way."}, {"t": "162", "c": 0, "f": "162 is <sup>81</sup>Br–<sup>81</sup>Br. That only happens one way."}, {"t": "80", "c": 0, "f": "80 is the A<sub>r</sub> of a bromine atom, not a molecule."}], "e": " Possible pairs: 79+79 = 158, 79+81 = 160, 81+79 = 160, 81+81 = 162. 160 can form two ways, so it is twice as common (ratio 1 : 2 : 1)."}, {"s": "Adapted from AQA Jun 2022 · 1F", "q": "A mixture of four liquids is fractionally distilled.<table><tr><th>Liquid</th><th>A</th><th>B</th><th>C</th><th>D</th></tr><tr><td>Boiling point (°C)</td><td>97</td><td>138</td><td>78</td><td>118</td></tr></table>Which liquid is collected <b>second</b>?", "o": [{"t": "A", "c": 1, "f": ""}, {"t": "C", "c": 0, "f": "C has the lowest boiling point, so it is collected first."}, {"t": "D", "c": 0, "f": "D (118 °C) comes third."}, {"t": "B", "c": 0, "f": "B has the highest boiling point, so it is collected last."}], "e": " Liquids distil off in order of boiling point, lowest first: C (78), A (97), D (118), B (138)."}, {"s": "New question", "q": "In the alpha particle scattering experiment, most alpha particles passed straight through the gold foil. Which conclusion comes from this observation?", "o": [{"t": "Most of the atom is empty space.", "c": 1, "f": ""}, {"t": "The nucleus is positively charged.", "c": 0, "f": "This is true, but it comes from some particles being deflected, not from most going straight through."}, {"t": "Electrons are arranged in shells.", "c": 0, "f": "Shells came later, from Bohr."}, {"t": "The atom is a ball of positive charge with electrons embedded in it.", "c": 0, "f": "That is the plum pudding model, which this experiment disproved."}], "e": " If most particles pass straight through, there is nothing to stop them in most of the atom. The mass must be concentrated in a tiny nucleus."}, {"s": "New question", "q": "An ion X<sup>2−</sup> has 18 electrons and a mass number of 32. How many neutrons are in the nucleus?", "o": [{"t": "16", "c": 1, "f": ""}, {"t": "14", "c": 0, "f": "You used electrons instead of protons: 32 − 18."}, {"t": "12", "c": 0, "f": "Don't subtract the charge as well."}, {"t": "18", "c": 0, "f": "18 is the number of electrons in the ion."}], "e": " A 2− ion has gained 2 electrons, so protons = 18 − 2 = 16 (sulfur). Neutrons = 32 − 16 = 16."}, {"s": "Adapted from AQA Jun 2023 · 1F/1H", "q": "Lithium has two isotopes, <sup>6</sup>Li and <sup>7</sup>Li. Its relative atomic mass is 6.9. In a sample of 1000 lithium atoms, how many are <sup>6</sup>Li?", "o": [{"t": "100", "c": 1, "f": ""}, {"t": "900", "c": 0, "f": "900 is the number of <sup>7</sup>Li atoms. 6.9 is much closer to 7, so most atoms are <sup>7</sup>Li."}, {"t": "690", "c": 0, "f": "Multiplying the A<sub>r</sub> by 100 does not give a number of atoms."}, {"t": "10", "c": 0, "f": "10% is the percentage, but you need the number out of 1000."}], "e": " Let x = number of <sup>6</sup>Li: 6x + 7(1000 − x) = 6900 → 7000 − x = 6900 → x = 100 (10%)."}]];

let store = {};
try { store = JSON.parse(localStorage.getItem("mcq-"+TOPIC) || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("mcq-"+TOPIC, JSON.stringify(store)); } catch(e) {} }

const orders = DATA.map(set => set.map(q => shuffle(q.o.map((_,i)=>i))));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur = 0;
const tabs = document.getElementById("tabs"), main = document.getElementById("main");

function levelScore(l){
  const ans = store[l] || {}; let s=0, n=0;
  DATA[l].forEach((q,i)=>{ if(ans[i]!==undefined){ n++; if(q.o[ans[i]].c) s++; } });
  return {s,n};
}
function drawTabs(){
  tabs.innerHTML = "";
  LEVELS.forEach((L,l)=>{
    const b = document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", l===cur);
    b.style.setProperty("--c", L.col);
    const {s,n} = levelScore(l);
    b.innerHTML = `<span class="sc">${n? s+"/10":""}</span><span class="lv">${L.name}</span><span class="tier">${L.tier}</span>`;
    b.onclick = ()=>{ cur=l; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
}
function render(){
  const L = LEVELS[cur]; document.body.style.setProperty("--c", L.col);
  drawTabs();
  const ans = store[cur] || {};
  let h = `<div class="intro"><b>${L.name} · ${L.tier}.</b> ${L.intro} Your first click counts.</div>`;
  DATA[cur].forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="src">${q.s}</span></div><div class="stem">${q.q}</div><div class="opts">`;
    orders[cur][i].forEach((oi,k)=>{
      const o = q.o[oi]; let cls="";
      if(ans[i]!==undefined){ if(o.c) cls="right"; else if(ans[i]===oi) cls="wrong"; }
      h += `<button class="opt ${cls}" data-q="${i}" data-o="${oi}" ${ans[i]!==undefined?"disabled":""}><span class="let">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
    });
    h += `</div><div class="fb" id="fb${i}"></div></div>`;
  });
  h += `<div class="done" id="done"></div>`;
  main.innerHTML = h;
  main.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> choose(+b.dataset.q, +b.dataset.o));
  DATA[cur].forEach((q,i)=>{ if(ans[i]!==undefined) showFb(i, ans[i]); });
  update();
}
function choose(i, oi){
  store[cur] = store[cur] || {};
  if(store[cur][i]!==undefined) return;
  store[cur][i] = oi; save();
  const box = document.getElementById("q"+i);
  box.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true; const o = DATA[cur][i].o[+b.dataset.o];
    if(o.c) b.classList.add("right"); else if(+b.dataset.o===oi) b.classList.add("wrong");
  });
  showFb(i, oi); update(); drawTabs();
}
function showFb(i, oi){
  const q = DATA[cur][i], o = q.o[oi], fb = document.getElementById("fb"+i);
  const right = q.o.find(x=>x.c);
  fb.className = "fb show " + (o.c ? "ok" : "no");
  fb.innerHTML = o.c
    ? `<b>Correct.</b>${q.e}`
    : `<b>Not quite – the answer is: ${right.t}</b>${o.f ? o.f+" " : ""}${q.e}`;
}
function update(){
  const {s,n} = levelScore(cur);
  document.getElementById("score").textContent = `${s} / 10`;
  document.getElementById("answered").textContent = `${n} answered`;
  document.getElementById("prog").style.width = (n*10)+"%";
  const done = document.getElementById("done");
  if(n===10){
    const ans = store[cur]; const wrong = DATA[cur].map((q,i)=>({q,i})).filter(x=>!x.q.o[ans[x.i]].c);
    let h = `<h2>${LEVELS[cur].name} done: ${s} / 10</h2>`;
    if(!wrong.length){ h += `<p>Full marks. ${cur<3 ? "Try "+LEVELS[cur+1].name+" next." : "Excellent work."}</p>`; }
    else {
      h += `<p>Copy these into your fix-it table: write the question in column 1, leave column 2 blank to answer next time, and copy the correct answer into column 3.</p>
      <table class="fix"><tr><th>Question</th><th>My answer next time</th><th>Correct answer</th></tr>`;
      wrong.forEach(x=>{ h += `<tr><td>${x.q.q.replace(/<table[\s\S]*?<\/table>/g," [see table] ")}</td><td></td><td>${x.q.o.find(o=>o.c).t}</td></tr>`; });
      h += `</table>`;
    }
    done.innerHTML = h; done.classList.add("show");
  } else done.classList.remove("show");
}
document.getElementById("reset").onclick = ()=>{
  delete store[cur]; save(); orders[cur] = DATA[cur].map(q=>shuffle(q.o.map((_,i)=>i))); render();
};
render();
</script>
</body>
</html>
