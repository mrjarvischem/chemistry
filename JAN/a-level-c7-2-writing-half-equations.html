var f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('b');
function unlock(text,quiet){
  if(!(window.crypto&&crypto.subtle)){msg.textContent='This page needs to be opened over https.';return}
  msg.textContent='';btn.disabled=true;btn.textContent='Opening…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(text),'PBKDF2',false,['deriveKey']).then(function(k){
