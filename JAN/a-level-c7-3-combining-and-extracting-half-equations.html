    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(D));
  }).then(function(buf){
    var h=new TextDecoder().decode(buf);
    try{sessionStorage.setItem('jan-key',text)}catch(e){}
    document.open();document.write(h);document.close();
  }).catch(function(){
    try{sessionStorage.removeItem('jan-key')}catch(e){}
    msg.textContent=quiet?'':'Wrong password. Try again.';btn.disabled=false;btn.textContent='Open';
  });
}
f.addEventListener('submit',function(e){e.preventDefault();unlock(document.getElementById('pw').value,false)});
try{var saved=sessionStorage.getItem('jan-key');if(saved)unlock(saved,true)}catch(e){}
})();
</script>
