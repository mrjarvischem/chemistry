function u(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('b');
function unlock(text,quiet){
  if(!(window.crypto&&crypto.subtle)){msg.textContent='This page needs to be opened over https.';return}
  msg.textContent='';btn.disabled=true;btn.textContent='Opening…';
  crypto.subtle.importKey('raw',new TextEncoder().encode(text),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);

    return crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(D));
  }).then(function(buf){
    var h=new TextDecoder().decode(buf);
    try{sessionStorage.setItem('jan-key',text)}catch(e){}
    document.open();document.write(h);document.close();
  }).catch(function(){
    try{sessionStorage.removeItem('jan-key')}catch(e){}
    msg.textContent=quiet?'':'Wrong password. Try again.';btn.disabled=false;btn.textContent='Open';
  });
}
