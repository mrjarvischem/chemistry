at's not why it can't be used."}, {"t": "Carbon reduction uses more energy.", "c": 0, "f": ""}], "e": " Carbon can only reduce metals below it in the reactivity series. Sodium is above carbon."}, {"s": "AQA Jun 2023 · 1F", "q": "Aluminium oxide is mixed with cryolite before electrolysis. Why?", "o": [{"t": "The mixture has a lower melting point than pure aluminium oxide.", "c": 1, "f": ""}, {"t": "The mixture has the same melting point.", "c": 0, "f": ""}, {"t": "The mixture has a higher melting point.", "c": 0, "f": "A higher melting point would cost more energy."}], "e": " A lower melting point means less energy is needed, which reduces costs."}, {"s": "Adapted from AQA Jun 2022 · 1F", "q": "Molten potassium iodide is electrolysed. What are the products?", "o": [{"t": "Potassium at the negative electrode, iodine at the positive electrode", "c": 1, "f": ""}, {"t": "Iodine at the negative electrode, potassium at the positive electrode", "c": 0, "f": "Positive metal ions go to the negative electrode."}, {"t": "Hydrogen at the negative electrode, iodine at the positive electrode", "c": 0, "f": "There is no water in a molten compound, so hydrogen can't form."}, {"t": "Potassium at the negative electrode, oxygen at the positive electrode", "c": 0, "f": ""}], "e": " Molten binary compounds give the metal at the negative electrode and the non-metal at the positive electrode."}, {"s": "AQA Nov 2020 · 1F", "q": "A crystal with colourless positive ions and purple negative ions dissolves in an electrolyte. What happens to the purple ions when the current is switched on?", "o": [{"t": "They move towards the positive electrode.", "c": 1, "f": ""}, {"t": "They do not move.", "c": 0, "f": ""}, {"t": "They move towards the negative electrode.", "c": 0, "f": "Opposite charges attract. Negative ions go to the positive electrode."}], "e": " Negative ions (anions) are attracted to the positive electrode."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "Fe<sub>2</sub>O<sub>3</sub> + 3C → 2Fe + 3CO. How does the equation show that iron oxide is reduced?", "o": [{"t": "Iron oxide loses oxygen.", "c": 1, "f": ""}, {"t": "Iron oxide gains oxygen.", "c": 0, "f": "Gaining oxygen is oxidation."}, {"t": "Carbon loses oxygen.", "c": 0, "f": ""}, {"t": "Iron is formed as a solid.", "c": 0, "f": ""}], "e": " Reduction is the loss of oxygen. Carbon gains oxygen, so carbon is oxidised."}], [{"s": "AQA Jun 2022 · 1F", "q": "Sodium sulfate solution contains H<sup>+</sup>, OH<sup>−</sup>, Na<sup>+</sup> and SO<sub>4</sub><sup>2−</sup> ions. Oxygen is produced at the positive electrode. Which ions are discharged to produce oxygen?", "o": [{"t": "Hydroxide ions", "c": 1, "f": ""}, {"t": "Hydrogen ions", "c": 0, "f": "H<sup>+</sup> is positive, so it goes to the negative electrode."}, {"t": "Sodium ions", "c": 0, "f": ""}, {"t": "Sulfate ions", "c": 0, "f": "Sulfate ions aren't discharged. Oxygen comes from hydroxide ions instead."}], "e": " With sulfates and nitrates, OH<sup>−</sup> ions from water are discharged at the positive electrode to form oxygen."}, {"s": "AQA Jun 2023 · 1F", "q": "Electrolysis of sodium sulfate solution produces hydrogen and oxygen. What is the source of these gases?", "o": [{"t": "Water", "c": 1, "f": ""}, {"t": "Air", "c": 0, "f": ""}, {"t": "Sulfate ions", "c": 0, "f": ""}], "e": " Water provides H<sup>+</sup> and OH<sup>−</sup> ions."}, {"s": "AQA Jun 2023 · 1F", "q": "Why is hydrogen produced instead of sodium when sodium sulfate solution is electrolysed?", "o": [{"t": "Hydrogen is less reactive than sodium.", "c": 1, "f": ""}, {"t": "Hydrogen has the same reactivity as sodium.", "c": 0, "f": ""}, {"t": "Hydrogen is more reactive than sodium.", "c": 0, "f": ""}], "e": " At the negative electrode the less reactive element is produced. Hydrogen forms if the metal is more reactive than hydrogen."}, {"s": "AQA Jun 2022 · 1H", "q": "Which is the correct half equation for the production of sodium in the electrolysis of molten sodium chloride?", "o": [{"t": "Na<sup>+</sup> + e<sup>−</sup> → Na", "c": 1, "f": ""}, {"t": "Na + e<sup>−</sup> → Na<sup>+</sup>", "c": 0, "f": ""}, {"t": "Na → Na<sup>+</sup> + e<sup>−</sup>", "c": 0, "f": "That is oxidation, the reverse of what happens."}, {"t": "Na<sup>+</sup> → Na + e<sup>−</sup>", "c": 0, "f": "Charges don't balance."}], "e": " Positive ions gain electrons at the negative electrode. This is reduction."}, {"s": "AQA Nov 2021 · 1H", "q": "Copper, copper carbonate and copper oxide are insoluble solids. Which can react with dilute hydrochloric acid to make a copper salt?", "o": [{"t": "Copper carbonate and copper oxide only", "c": 1, "f": ""}, {"t": "Copper and copper carbonate only", "c": 0, "f": "Copper is below hydrogen in the reactivity series, so it doesn't react with dilute acids."}, {"t": "Copper and copper oxide only", "c": 0, "f": ""}, {"t": "Copper, copper carbonate and copper oxide", "c": 0, "f": ""}], "e": " Bases (oxides) and carbonates react with acids. Unreactive metals like copper don't."}, {"s": "AQA Nov 2021 · 1H", "q": "1 g of hydrogen chloride (which fully ionises) is dissolved in 1 dm<sup>3</sup> of water. Which describes the solution?", "o": [{"t": "A dilute solution of a strong acid", "c": 1, "f": ""}, {"t": "A concentrated solution of a strong acid", "c": 0, "f": "1 g/dm<sup>3</sup> is a small amount in a large volume, so it's dilute."}, {"t": "A dilute solution of a weak acid", "c": 0, "f": "Fully ionised means strong."}, {"t": "A concentrated solution of a weak acid", "c": 0, "f": ""}], "e": " Strong/weak describes how much the acid ionises. Concentrated/dilute describes how much acid is in a given volume."}, {"s": "AQA Nov 2021 · 1H", "q": "Which solution has the lowest pH?", "o": [{"t": "1.0 mol/dm<sup>3</sup> hydrogen chloride", "c": 1, "f": ""}, {"t": "1.0 mol/dm<sup>3</sup> ethanoic acid", "c": 0, "f": "Ethanoic acid is weak, so only about 1% ionises."}, {"t": "0.1 mol/dm<sup>3</sup> hydrogen chloride", "c": 0, "f": ""}, {"t": "0.1 mol/dm<sup>3</sup> ethanoic acid", "c": 0, "f": ""}], "e": " The lowest pH means the highest H<sup>+</sup> concentration. That comes from a strong acid at the higher concentration."}, {"s": "AQA Jun 2023 · 1H", "q": "A + 2B<sup>+</sup> → 2B + A<sup>2+</sup>. Why is this a redox reaction?", "o": [{"t": "A loses electrons and B<sup>+</sup> gains electrons.", "c": 1, "f": ""}, {"t": "A gains electrons and B<sup>+</sup> loses electrons.", "c": 0, "f": "A becomes A<sup>2+</sup>, so it lost 2 electrons."}, {"t": "Both A and B<sup>+</sup> gain electrons.", "c": 0, "f": ""}, {"t": "Both A and B<sup>+</sup> lose electrons.", "c": 0, "f": ""}], "e": " OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons). A is oxidised and B<sup>+</sup> is reduced."}, {"s": "AQA Jun 2023 · 1F", "q": "Metals were added to solutions of each other's sulfates (✓ = displacement).<table><tr><th>Metal</th><th>A sulfate</th><th>B sulfate</th><th>C sulfate</th><th>D sulfate</th></tr><tr><td>A</td><td>–</td><td>✗</td><td>✓</td><td>✗</td></tr><tr><td>B</td><td>✓</td><td>–</td><td>✓</td><td>✗</td></tr><tr><td>C</td><td>✗</td><td>✗</td><td>–</td><td>✗</td></tr><tr><td>D</td><td>✓</td><td>✓</td><td>✓</td><td>–</td></tr></table>What is the order of reactivity, most reactive first?", "o": [{"t": "D, B, A, C", "c": 1, "f": ""}, {"t": "C, A, B, D", "c": 0, "f": "This is least reactive first."}, {"t": "D, A, B, C", "c": 0, "f": "B displaces A, so B is more reactive than A."}, {"t": "A, B, C, D", "c": 0, "f": ""}], "e": " The more metals a metal displaces, the more reactive it is: D (3), B (2), A (1), C (0)."}, {"s": "Adapted from AQA Nov 2021 · 1F", "q": "Copper sulfate solution and sodium chloride solution are each electrolysed. What forms at the negative electrode in each?", "o": [{"t": "Copper; hydrogen", "c": 1, "f": ""}, {"t": "Copper; sodium", "c": 0, "f": "Sodium is more reactive than hydrogen, so hydrogen forms instead."}, {"t": "Hydrogen; hydrogen", "c": 0, "f": "Copper is less reactive than >1</td><td>A</td><td>BNO<sub>3</sub></td><td>A + 2BNO<sub>3</sub> → 2B + A(NO<sub>3</sub>)<sub>2</sub></td></tr><tr><td>2</td><td>C</td><td>A(NO<sub>3</sub>)<sub>2</sub></td><td>2C + 3A(NO<sub>3</sub>)<sub>2</sub> → 3A + 2C(NO<sub>3</sub>)<sub>3</sub></td></tr><tr><td>3</td><td>C</td><td>D(NO<sub>3</sub>)<sub>2</sub></td><td>no reaction</td></tr></table>", "o": [{"t": "C", "c": 1, "f": ""}, {"t": "D", "c": 0, "f": "D is more reactive than C, but its nitrate is D(NO<sub>3</sub>)<sub>2</sub>, so it forms 2+ ions."}, {"t": "A", "c": 0, "f": "A(NO<sub>3</sub>)<sub>2</sub> means A forms 2+ ions."}, {"t": "B", "c": 0, "f": "BNO<sub>3</sub> means B forms 1+ ions."}], "e": " Aluminium forms Al<sup>3+</sup>, so its nitrate is Al(NO<sub>3</sub>)<sub>3</sub>. Only C(NO<sub>3</sub>)<sub>3</sub> matches."}, {"s": "Adapted from AQA Nov 2020 · 1H", "q": "Mg(s) + Zn<sup>2+</sup>(aq) → Mg<sup>2+</sup>(aq) + Zn(s). Which species is oxidised?", "o": [{"t": "Mg", "c": 1, "f": ""}, {"t": "Zn<sup>2+</sup>", "c": 0, "f": "Zn<sup>2+</sup> gains electrons, so it's reduced."}, {"t": "Zn", "c": 0, "f": "Zn is a product."}, {"t": "Mg<sup>2+</sup>", "c": 0, "f": "Mg<sup>2+</sup> is a product."}], "e": " Mg → Mg<sup>2+</sup> + 2e<sup>−</sup>: loss of electrons = oxidation. Zn<sup>2+</sup> + 2e<sup>−</sup> → Zn: gain = reduction."}, {"s": "New question", "q": "Why must the positive electrodes be replaced regularly in the extraction of aluminium?", "o": [{"t": "They are made of carbon, which reacts with the oxygen produced to form carbon dioxide.", "c": 1, "f": ""}, {"t": "Aluminium is deposited on them.", "c": 0, "f": "Aluminium forms at the negative electrode."}, {"t": "They melt at the high temperature.", "c": 0, "f": ""}, {"t": "They react with the cryolite.", "c": 0, "f": ""}], "e": " Oxygen forms at the positive electrode (2O<sup>2−</sup> → O<sub>2</sub> + 4e<sup>−</sup>) and burns the carbon away."}, {"s": "AQA Nov 2021 · 1H", "q": "Which is the ionic equation for the neutralisation of hydrochloric acid by potassium hydroxide?", "o": [{"t": "H<sup>+</sup> + OH<sup>−</sup> → H<sub>2</sub>O", "c": 1, "f": ""}, {"t": "HCl + KOH → KCl + H<sub>2</sub>O", "c": 0, "f": "That is the full symbol equation, not the ionic equation."}, {"t": "K<sup>+</sup> + Cl<sup>−</sup> → KCl", "c": 0, "f": "K<sup>+</sup> and Cl<sup>−</sup> are spectator ions."}, {"t": "H<sup>+</sup> + OH<sup>−</sup> → H<sub>2</sub> + O<sup>−</sup>", "c": 0, "f": ""}], "e": " Every neutralisation has the same ionic equation. The spectator ions are left out."}, {"s": "Adapted from AQA Nov 2020 · 1H", "q": "Green copper chromate solution contains blue Cu<sup>2+</sup> ions and yellow CrO<sub>4</sub><sup>2−</sup> ions. During electrolysis the solution turns yellow near the positive electrode. Why?", "o": [{"t": "Yellow CrO<sub>4</sub><sup>2−</sup> ions are attracted to the positive electrode.", "c": 1, "f": ""}, {"t": "Blue Cu<sup>2+</sup> ions are attracted to the positive electrode.", "c": 0, "f": "Positive ions are repelled by the positive electrode."}, {"t": "Chromate ions are discharged as a yellow gas.", "c": 0, "f": ""}, {"t": "Copper metal forms at the positive electrode.", "c": 0, "f": "Copper forms at the negative electrode."}], "e": " Negative ions move to the positive electrode, so the yellow colour builds up there."}, {"s": "AQA Jun 2023 · 1H", "q": "Fe<sub>2</sub>O<sub>3</sub> + 3C → 2Fe + 3CO. Which substance is reduced, and why?", "o": [{"t": "Iron oxide, because it loses oxygen", "c": 1, "f": ""}, {"t": "Carbon, because it gains oxygen", "c": 0, "f": "Gaining oxygen is oxidation."}, {"t": "Iron, because it is formed", "c": 0, "f": ""}, {"t": "Carbon monoxide, because it contains oxygen", "c": 0, "f": ""}], "e": " Fe<sub>2</sub>O<sub>3</sub> loses oxygen (reduced). Carbon gains oxygen (oxidised)."}, {"s": "Adapted from AQA Jun 2023 · 1H", "q": "At the negative electrode: Al<sup>3+</sup> + 3e<sup>−</sup> → Al. How many moles of electrons are needed to make 54 g of aluminium? (A<sub>r</sub>: Al = 27)", "o": [{"t": "6", "c": 1, "f": ""}, {"t": "3", "c": 0, "f": "3 mol of electrons makes only 1 mol (27 g) of Al."}, {"t": "2", "c": 0, "f": "2 is the moles of Al. Each needs 3 electrons."}, {"t": "18", "c": 0, "f": ""}], "e": " 54 ÷ 27 = 2 mol Al. 2 × 3 = 6 mol of electrons."}, {"s": "AQA Nov 2021 · 1H", "q": "Molten lead bromide is electrolysed. Which is the balanced half equation at the positive electrode?", "o": [{"t": "2Br<sup>−</sup> → Br<sub>2</sub> + 2e<sup>−</sup>", "c": 1, "f": ""}, {"t": "Br<sup>−</sup> → Br + e<sup>−</sup>", "c": 0, "f": "Bromine is diatomic: Br<sub>2</sub>."}, {"t": "2Br<sup>−</sup> + 2e<sup>−</sup> → Br<sub>2</sub>", "c": 0, "f": "Charges don't balance. Negative ions lose electrons."}, {"t": "Br<sub>2</sub> + 2e<sup>−</sup> → 2Br<sup>−</sup>", "c": 0, "f": "This is the reverse reaction."}], "e": " Negative ions lose electrons at the positive electrode (oxidation). Charge: −2 on the left, −2 on the right."}]];

let store = {};
try { store = JSON.parse(localStorage.getItem("mcq-"+TOPIC) || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("mcq-"+TOPIC, JSON.stringify(store)); } catch(e) {} }

const orders = DATA.map(set => set.map(q => shuffle(q.o.map((_,i)=>i))));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur = 0;
const tabs = document.getElementById("tabs"), main = document.getElementById("main");

function levelScore(l){
  const ans = store[l] || {}; let s=0, n=0;
  DATA[l].forEach((q,i)=>{ if(ans[i]!==undefined){ n++; if(q.o[ans[i]].c) s++; } });
  return {s,n};
}
function drawTabs(){
  tabs.innerHTML = "";
  LEVELS.forEach((L,l)=>{
    const b = document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", l===cur);
    b.style.setProperty("--c", L.col);
    const {s,n} = levelScore(l);
    b.innerHTML = `<span class="sc">${n? s+"/10":""}</span><span class="lv">${L.name}</span><span class="tier">${L.tier}</span>`;
    b.onclick = ()=>{ cur=l; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
}
function render(){
  const L = LEVELS[cur]; document.body.style.setProperty("--c", L.col);
  drawTabs();
  const ans = store[cur] || {};
  let h = `<div class="intro"><b>${L.name} · ${L.tier}.</b> ${L.intro} Your first click counts.</div>`;
  DATA[cur].forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="src">${q.s}</span></div><div class="stem">${q.q}</div><div class="opts">`;
    orders[cur][i].forEach((oi,k)=>{
      const o = q.o[oi]; let cls="";
      if(ans[i]!==undefined){ if(o.c) cls="right"; else if(ans[i]===oi) cls="wrong"; }
      h += `<button class="opt ${cls}" data-q="${i}" data-o="${oi}" ${ans[i]!==undefined?"disabled":""}><span class="let">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
    });
    h += `</div><div class="fb" id="fb${i}"></div></div>`;
  });
  h += `<div class="done" id="done"></div>`;
  main.innerHTML = h;
  main.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> choose(+b.dataset.q, +b.dataset.o));
  DATA[cur].forEach((q,i)=>{ if(ans[i]!==undefined) showFb(i, ans[i]); });
  update();
}
function choose(i, oi){
  store[cur] = store[cur] || {};
  if(store[cur][i]!==undefined) return;
  store[cur][i] = oi; save();
  const box = document.getElementById("q"+i);
  box.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true; const o = DATA[cur][i].o[+b.dataset.o];
    if(o.c) b.classList.add("right"); else if(+b.dataset.o===oi) b.classList.add("wrong");
  });
  showFb(i, oi); update(); drawTabs();
}
function showFb(i, oi){
  const q = DATA[cur][i], o = q.o[oi], fb = document.getElementById("fb"+i);
  const right = q.o.find(x=>x.c);
  fb.className = "fb show " + (o.c ? "ok" : "no");
  fb.innerHTML = o.c
    ? `<b>Correct.</b>${q.e}`
    : `<b>Not quite – the answer is: ${right.t}</b>${o.f ? o.f+" " : ""}${q.e}`;
}
function update(){
  const {s,n} = levelScore(cur);
  document.getElementById("score").textContent = `${s} / 10`;
  document.getElementById("answered").textContent = `${n} answered`;
  document.getElementById("prog").style.width = (n*10)+"%";
  const done = document.getElementById("done");
  if(n===10){
    const ans = store[cur]; const wrong = DATA[cur].map((q,i)=>({q,i})).filter(x=>!x.q.o[ans[x.i]].c);
    let h = `<h2>${LEVELS[cur].name} done: ${s} / 10</h2>`;
    if(!wrong.length){ h += `<p>Full marks. ${cur<3 ? "Try "+LEVELS[cur+1].name+" next." : "Excellent work."}</p>`; }
    else {
      h += `<p>Copy these into your fix-it table: write the question in column 1, leave column 2 blank to answer next time, and copy the correct answer into column 3.</p>
      <table class="fix"><tr><th>Question</th><th>My answer next time</th><th>Correct answer</th></tr>`;
      wrong.forEach(x=>{ h += `<tr><td>${x.q.q.replace(/<table[\s\S]*?<\/table>/g," [see table] ")}</td><td></td><td>${x.q.o.find(o=>o.c).t}</td></tr>`; });
      h += `</table>`;
    }
    done.innerHTML = h; done.classList.add("show");
  } else done.classList.remove("show");
}
document.getElementById("reset").onclick = ()=>{
  delete store[cur]; save(); orders[cur] = DATA[cur].map(q=>shuffle(q.o.map((_,i)=>i))); render();
};
render();
</script>
