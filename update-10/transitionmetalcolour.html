<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: section rail on top, diagram beside explanation, question cards below; end quizzes in tabs. Single light (projector) theme by choice, matching the walkthrough series. */
:root{
  --paper:#f7f1e6; --panel:#fffdf8; --ink:#2b2118; --muted:#6e5d4c;
  --brown:#6b4226; --brown-2:#8a5a36; --line:#e2d5c0; --soft:#f1e7d6;
  --good:#2f7a3d; --good-bg:#e5f2e3; --bad:#a3322a; --bad-bg:#f8e3df; --amber:#a86a12;
  --display:"Charter","Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--brown);padding-bottom:12px}
h1{font-family:var(--display);font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;color:var(--brown);text-wrap:balance;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.score{font-family:var(--mono);font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--brown);white-space:nowrap}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.rail button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.rail button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.rail button.done:not(.on){border-color:var(--good);color:var(--good)}
.rail .sep{width:1px;background:var(--line);margin:0 4px}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.pic{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.pic svg{width:100%;height:auto;display:block}
.eyebrow{font:700 .75rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brown-2);margin:0}
h2{font-family:var(--display);font-size:1.55rem;margin:2px 0 8px;line-height:1.2;text-wrap:balance}
.text{min-width:0}
.text p{margin:0 0 10px}
.how{margin:0 0 10px;padding-left:20px}
.how li{margin-bottom:5px}
.why{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:.95rem;margin:10px 0 0}
.why b{color:var(--brown)}
.eq{font-family:var(--mono);font-size:.88rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin:6px 0;overflow-x:auto;white-space:nowrap}
.eq .lab{font-family:var(--body);font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brown-2);margin-right:8px}
.defs{display:grid;gap:6px;margin:0 0 10px}
.def{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:.93rem}
.def b{color:var(--brown)}
table.col{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0 10px}
table.col th,table.col td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:middle}
table.col th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brown-2)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:6px}
.tablewrap{overflow-x:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0;border-top:4px solid var(--brown)}
.card h3{font:700 .8rem var(--body);letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;color:var(--brown);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.src{font:700 .7rem var(--body);letter-spacing:.04em;text-transform:none;background:var(--soft);color:var(--brown);border-radius:4px;padding:2px 7px}
.src.real{background:var(--brown);color:#fff}
.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;font:inherit;font-size:.95rem;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt .k{font:700 .85rem var(--mono);color:var(--brown-2);flex:none}
.opt:hover:not(:disabled){border-color:var(--brown-2)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.fb{margin:10px 0 0;font-size:.93rem;padding:9px 12px;border-radius:8px;background:var(--soft)}
.fb.ok{background:var(--good-bg)}.fb.no{background:var(--bad-bg)}
.alt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.alt button{font:600 .85rem var(--body);border:1.5px solid var(--brown);background:var(--panel);color:var(--brown);border-radius:8px;padding:6px 11px;cursor:pointer}
.alt button.on{background:var(--brown);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
.picker button{font:600 .85rem var(--mono);min-width:42px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:6px 8px;cursor:pointer}
.picker button.on{background:var(--brown);border-color:var(--brown);color:#fff}
.picker button:disabled{opacity:.3;cursor:default}
.readout{font-family:var(--mono);font-size:1rem;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:6px;overflow-x:auto}
.verdict{margin-top:6px;font-size:.92rem;padding:8px 10px;border-radius:6px}
.verdict.y{background:var(--good-bg)}.verdict.n{background:var(--bad-bg)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{font:600 .95rem var(--body);background:var(--brown);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
.nav button.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.nav button:disabled{opacity:.35;cursor:default}
.qintro{color:var(--muted);margin:0 0 12px;max-width:70ch}
.res{display:grid;gap:8px;margin:12px 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px}
.row .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--brown);font-size:.9rem;white-space:nowrap}
.row .n small{color:var(--muted);font-size:.75rem;font-family:var(--body);display:block;text-transform:uppercase;letter-spacing:.06em}
.final{background:var(--brown);color:#fff;border-radius:10px;padding:16px 18px;margin-top:8px}
.final b{font-family:var(--display);font-size:1.3rem}
sub,sup{line-height:0}
@media (prefers-reduced-motion:no-preference){.fadein{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Transition Metals Walkthrough</h1>
      <p class="sub">AQA A-level Chemistry 3.2.5 · Part 1: complexes, ligands, shapes and the chelate effect</p>
    </div>
    <div class="score" id="score">Score 0 / 0</div>
  </header>
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script>
/* ---------- text helpers: _{sub} ^{sup} markup ---------- */
const c=s=>String(s).replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>');
const COL={ink:"#2b2118",muted:"#6e5d4c",brown:"#6b4226",line:"#bfae94",glass:"#5a4632",good:"#2f7a3d",red:"#a3322a",amber:"#a86a12",paper:"#fffdf8",metal:"#6b4226"};
function T(x,y,s,o={}){ // svg text with sub/sup tspans
  const fs=o.size||13; let cur=0,out="";
  String(s).split(/(_\{[^}]*\}|\^\{[^}]*\})/).forEach(p=>{
    if(!p)return; let t=0,txt=p,small=false;
    if(p.startsWith("_{")){t=fs*.32;txt=p.slice(2,-1);small=true}
    else if(p.startsWith("^{")){t=-fs*.45;txt=p.slice(2,-1);small=true}
    const dy=t-cur;cur=t;
    out+=`<tspan${dy?` dy="${dy.toFixed(1)}"`:""}${small?` font-size="${(fs*.72).toFixed(1)}"`:""}>${txt}</tspan>`;
  });
  return `<text x="${x}" y="${y}" font-family="Segoe UI,system-ui,sans-serif" font-size="${fs}" font-weight="${o.w||500}" fill="${o.fill||COL.ink}" text-anchor="${o.a||"start"}">${out}</text>`;
}
const svg=(inner,w=400,h=320)=>`<svg viewBox="0 0 ${w} ${h}" role="img" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
function arrowHead(x1,y1,x2,y2,col,sz=7){const a=Math.atan2(y2-y1,x2-x1);return `<path d="M${x2},${y2} L${x2-sz*Math.cos(a-.45)},${y2-sz*Math.sin(a-.45)} L${x2-sz*Math.cos(a+.45)},${y2-sz*Math.sin(a+.45)} Z" fill="${col}"/>`;}
function arrow(x1,y1,x2,y2,col=COL.brown,w=2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"/>`+arrowHead(x1,y1,x2,y2,col,9);}
function lead(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${COL.muted}" stroke-width="1"/><circle cx="${x2}" cy="${y2}" r="2" fill="${COL.muted}"/>`;}

/* ---------- bond drawing ---------- */
function lp(x,y,ux,uy,col=COL.ink){const l=Math.hypot(ux,uy)||1,px=-uy/l*3.4,py=ux/l*3.4;return `<circle cx="${x+px}" cy="${y+py}" r="1.7" fill="${col}"/><circle cx="${x-px}" cy="${y-py}" r="1.7" fill="${col}"/>`;}
function lpToward(ax,ay,bx,by,d,col){const ux=bx-ax,uy=by-ay,l=Math.hypot(ux,uy);return lp(ax+ux/l*d,ay+uy/l*d,ux,uy,col);}
const DONOR_FIRST={"H_{2}O":"OH_{2}","H_{3}N":"NH_{3}"},DONOR_LAST={"OH_{2}":"H_{2}O","NH_{3}":"H_{3}N"};
function bond(x1,y1,x2,y2,style,col=COL.ink){
  if(style==="wedge"){const a=Math.atan2(y2-y1,x2-x1),w=5,px=-Math.sin(a)*w,py=Math.cos(a)*w;
    return `<path d="M${x1},${y1} L${x2+px},${y2+py} L${x2-px},${y2-py} Z" fill="${col}"/>`;}
  if(style==="dash")return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2" stroke-dasharray="3 3"/>`;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2"/>`;
}
const POS={
  oct:{T:[0,-1,"plain"],B:[0,1,"plain"],L:[-1,0,"plain"],R:[1,0,"plain"],W:[-.6,.55,"wedge"],D:[.6,-.55,"dash"]},
  tet:{T:[0,-1,"plain"],L:[-.92,.4,"plain"],W:[.3,.88,"wedge"],D:[.95,.25,"dash"]},
  sq:{T:[0,-1,"plain"],B:[0,1,"plain"],L:[-1,0,"plain"],R:[1,0,"plain"]},
  lin:{L:[-1,0,"plain"],R:[1,0,"plain"]}
};
/* complex(cx,cy,r,geom,{pos:label},metal,opts) */
function complex(cx,cy,r,geom,ligs,metal,o={}){
  const P=POS[geom],fs=o.fs||13; let s="";
  const flip=o.flip?-1:1;
  Object.entries(ligs).forEach(([k,lab])=>{
    if(!P[k]||lab==null)return; const [ux0,uy,st]=P[k]; const ux=ux0*flip;
    const len=Math.hypot(ux,uy), nx=ux/len, ny=uy/len;
    const x1=cx+nx*13,y1=cy+ny*13, x2=cx+ux*r,y2=cy+uy*r;
    s+=bond(x1,y1,x2,y2,st);
    if(o.dative){const mx=cx+nx*(13+ (r*len-13)*.45), my=cy+ny*(13+(r*len-13)*.45); s+=arrowHead(x2,y2,mx,my,COL.red,9);}
    if(lab!==""){
      s+=lp(x2+nx*5,y2+ny*5,nx,ny);
      let a=nx<-.3?"end":nx>.3?"start":"middle", L=lab, gap=11;
      if(a==="end")L=DONOR_LAST[lab]||lab; else L=DONOR_FIRST[lab]||lab;
      let lx=x2+nx*gap, ly=ny<-.7?y2-10:y2+ny*gap+fs*.35+(ny>.7?fs*.5:0);
      if(a==="middle"&&/^[NO]/.test(L)){a="start";lx-=fs*.38;}
      s+=T(lx,ly,L,{size:fs,w:600,a});}
  });
  s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="${o.mfill||"#efe2cf"}" stroke="${COL.brown}" stroke-width="1.6"/>`+T(cx,cy+4.5,metal,{size:metal.length>2?10.5:12,w:700,a:"middle",fill:COL.brown});
  if(o.charge!=null){const bw=o.bw||r+48,bh=o.bh||r+26;
    s+=`<path d="M${cx-bw+8},${cy-bh} L${cx-bw},${cy-bh} L${cx-bw},${cy+bh} L${cx-bw+8},${cy+bh} M${cx+bw-8},${cy-bh} L${cx+bw},${cy-bh} L${cx+bw},${cy+bh} L${cx+bw-8},${cy+bh}" fill="none" stroke="${COL.ink}" stroke-width="1.6"/>`;
    if(o.charge)s+=T(cx+bw+3,cy-bh+6,o.charge,{size:13,w:700});}
  return s;
}
function bident(cx,cy,r,pairs,o={}){ // octahedral with bidentate arcs; pairs [[k1,k2,label]]
  const P=POS.oct,flip=o.flip?-1:1;let s="";
  pairs.forEach(([a,b,lab])=>{
    const pa=P[a],pb=P[b];const ax=cx+pa[0]*flip*r,ay=cy+pa[1]*r,bx=cx+pb[0]*flip*r,by=cy+pb[1]*r;
    [[pa,ax,ay],[pb,bx,by]].forEach(([p,x,y])=>{const ux=p[0]*flip,uy=p[1],l=Math.hypot(ux,uy);s+=bond(cx+ux/l*13,cy+uy/l*13,x,y,p[2]);});
    const mx=(ax+bx)/2-cx,my=(ay+by)/2-cy,ml=Math.hypot(mx,my)||1;const qx=cx+mx/ml*r*1.45,qy=cy+my/ml*r*1.45;
    s+=`<path d="M${ax},${ay} Q${qx},${qy} ${bx},${by}" fill="none" stroke="${COL.amber}" stroke-width="3"/>`;
    [[ax,ay],[bx,by]].forEach(([x,y])=>{s+=lpToward(x,y,cx,cy,12)+`<circle cx="${x}" cy="${y}" r="7.5" fill="#fff" stroke="${COL.amber}" stroke-width="1.5"/>`+T(x,y+3.5,"N",{size:9.5,w:700,a:"middle",fill:COL.brown});});
    s+=T(cx+mx/ml*r*1.38,cy+my/ml*r*1.38+4,lab,{size:11,w:700,a:"middle",fill:COL.amber});
  });
  s+=`<circle cx="${cx}" cy="${cy}" r="13" fill="#efe2cf" stroke="${COL.brown}" stroke-width="1.6"/>`+T(cx,cy+4.5,o.metal||"Ni",{size:12,w:700,a:"middle",fill:COL.brown});
  return s;
}
function tube(x,by,col,lab,o={}){ // test tube with coloured solution
  const w=o.w||26,h=o.h||70,id="tb"+Math.random().toString(36).slice(2,8);
  const p=`M${x},${by-h} L${x},${by-w/2} A${w/2},${w/2} 0 0 0 ${x+w},${by-w/2} L${x+w},${by-h}`;
  let s=`<defs><clipPath id="${id}"><path d="${p} Z"/></clipPath></defs><path d="${p} Z" fill="#fff"/>`;
  s+=`<rect clip-path="url(#${id})" x="${x}" y="${by-h*.68}" width="${w}" height="${h}" fill="${col}"/>`;
  s+=`<path d="${p}" fill="none" stroke="${COL.glass}" stroke-width="1.6"/><path d="M${x-3},${by-h} L${x+w+3},${by-h}" stroke="${COL.glass}" stroke-width="2"/>`;
  if(lab)s+=T(x+w/2,by+15,lab,{size:o.fs||11.5,w:600,a:"middle"});
  if(o.sub)s+=T(x+w/2,by+29,o.sub,{size:10,a:"middle",fill:COL.muted});
  return s;
}
const CL={cuaq:"#7fb6e6",cucl:"#e6cf52",cugreen:"#9cc26a",cuam:"#2c4fb3",coaq:"#f0b3c4",cocl:"#3f6fd0",coam:"#d8b56a",fe2:"#cfe3b0",fe3:"#d9b25c",cr3:"#9d8bc4",v5:"#f0d34a",v4:"#5d8fd6",v3:"#5fa36a",v2:"#8c6bb8"};

/* ---------- section diagrams ---------- */
function picChar(){
  let s="";
  const tile=(x,y,t)=>`<rect x="${x}" y="${y}" width="190" height="152" rx="8" fill="#fff" stroke="${COL.line}"/>`+T(x+10,y+20,t,{size:12,w:700,fill:COL.brown});
  s+=tile(5,5,"1  Complex formation")+tile(205,5,"2  Coloured ions")+tile(5,163,"3  Variable oxidation states")+tile(205,163,"4  Catalytic activity");
  s+=complex(100,88,34,"oct",{T:"L",B:"L",L:"L",R:"L",W:"L",D:"L"},"M",{fs:11});
  [["fe2","Fe^{2+}"],["cuaq","Cu^{2+}"],["coaq","Co^{2+}"],["cr3","Cr^{3+}"]].forEach(([k,l],i)=>s+=tube(222+i*44,118,CL[k],l,{h:64,w:24}));
  [["v5","+5"],["v4","+4"],["v3","+3"],["v2","+2"]].forEach(([k,l],i)=>s+=tube(22+i*44,278,CL[k],l,{h:64,w:24}));
  s+=T(100,312,"vanadium, reduced by zinc",{size:10,a:"middle",fill:COL.muted});
  // energy profile
  s+=`<path d="M220,290 L220,200 M220,290 L385,290" stroke="${COL.muted}" stroke-width="1.2" fill="none"/>`;
  s+=`<path d="M228,262 C262,262 270,192 300,192 C330,192 336,276 372,276" fill="none" stroke="${COL.ink}" stroke-width="1.8"/>`;
  s+=`<path d="M228,262 C262,262 276,232 300,232 C324,232 336,276 372,276" fill="none" stroke="${COL.good}" stroke-width="2" stroke-dasharray="5 3"/>`;
  s+=T(306,214,"catalysed",{size:10,fill:COL.good,w:600});
  s+=T(300,307,"Fe: Haber · V_{2}O_{5}: Contact",{size:10.5,a:"middle",w:600});
  return svg(s);
}
function picAqua(){
  let s=complex(150,150,74,"oct",{T:"H_{2}O",B:"H_{2}O",L:"H_{2}O",R:"H_{2}O",W:"H_{2}O",D:"H_{2}O"},"Cu",{dative:true,charge:"2+",bw:128,bh:112});
  s+=lead(296,250,152,192)+T(300,250,"co-ordinate bond",{size:11.5,w:700,fill:COL.red})+T(300,264,"both electrons",{size:11})+T(300,278,"from an O lone pair",{size:11});
  s+=T(16,300,"co-ordination number 6 · octahedral · 90°",{size:12,w:600,fill:COL.brown});
  return svg(s,400,315);
}
function picSub(mode){
  let s="";
  if(mode==="cocl"){
    s+=complex(95,120,48,"oct",{T:"H_{2}O",B:"H_{2}O",L:"H_{2}O",R:"H_{2}O",W:"H_{2}O",D:"H_{2}O"},"Co",{fs:10.5,charge:"2+",bw:90,bh:76});
    s+=arrow(198,120,232,120)+T(215,104,"+4Cl^{−}",{size:11,a:"middle",w:600});
    s+=complex(305,125,46,"tet",{T:"Cl",L:"Cl",W:"Cl",D:"Cl"},"Co",{fs:11.5,charge:"2−",bw:72,bh:70});
    s+=tube(82,292,CL.coaq,"pink",{h:62})+tube(292,292,CL.cocl,"blue",{h:62});
    s+=T(200,250,"6 → 4",{size:15,w:700,a:"middle",fill:COL.brown})+T(200,266,"octahedral → tetrahedral",{size:10.5,a:"middle",fill:COL.muted});
  } else if(mode==="cucl"){
    s+=complex(95,120,48,"oct",{T:"H_{2}O",B:"H_{2}O",L:"H_{2}O",R:"H_{2}O",W:"H_{2}O",D:"H_{2}O"},"Cu",{fs:10.5,charge:"2+",bw:90,bh:76});
    s+=arrow(198,120,232,120)+T(215,104,"+4Cl^{−}",{size:11,a:"middle",w:600});
    s+=complex(305,125,46,"tet",{T:"Cl",L:"Cl",W:"Cl",D:"Cl"},"Cu",{fs:11.5,charge:"2−",bw:72,bh:70});

const EL={Sc:[1,2,[0,3]],Ti:[2,2,[0,2,3,4]],V:[3,2,[0,2,3]],Cr:[5,1,[0,2,3]],Mn:[5,2,[0,2]],Fe:[6,2,[0,2,3]],Co:[7,2,[0,2,3]],Ni:[8,2,[0,2]],Cu:[10,1,[0,1,2]],Zn:[10,2,[0,2]]};

function conf(el,q){let [d,s]=EL[el];const sOut=Math.min(s,q);s-=sOut;d-=(q-sOut);return [d,s];}
function boxes(d,s){
  let o="";const bw=46,y=40,x0=24;
  const fill=n=>{const up=Array(5).fill(0),dn=Array(5).fill(0);for(let i=0;i<n;i++){if(i<5)up[i]=1;else dn[i-5]=1;}return [up,dn];};
  const [up,dn]=fill(d);
  o+=T(x0,y-10,"3d",{size:13,w:700,fill:COL.brown});
  for(let i=0;i<5;i++){const x=x0+i*bw;o+=`<rect x="${x}" y="${y}" width="${bw}" height="52" fill="#fff" stroke="${COL.ink}" stroke-width="1.5"/>`;
    if(up[i])o+=arrow(x+16,y+44,x+16,y+10,COL.ink,2);
    if(dn[i])o+=arrow(x+30,y+8,x+30,y+42,COL.ink,2);}
  const xs=x0+5*bw+34;o+=T(xs,y-10,"4s",{size:13,w:700,fill:COL.brown});
  o+=`<rect x="${xs}" y="${y}" width="${bw}" height="52" fill="#fff" stroke="${COL.ink}" stroke-width="1.5"/>`;
  if(s>=1)o+=arrow(xs+16,y+44,xs+16,y+10,COL.ink,2);if(s>=2)o+=arrow(xs+30,y+8,xs+30,y+42,COL.ink,2);
  return svg(o,400,110);
}
function cfgWidget(){
  const [d,s]=conf(cfg.el,cfg.q);
  const sym=cfg.el+(cfg.q?`<sup>${cfg.q>1?cfg.q:""}+</sup>`:"");
  const str=`[Ar] 3d<sup>${d}</sup>`+(s?` 4s<sup>${s}</sup>`:"");
  const inc=d>0&&d<10;
  const ions=EL[cfg.el][2].filter(q=>q>0).map(q=>conf(cfg.el,q)[0]);
  const isTM=ions.some(x=>x>0&&x<10);
  let note="";
  if(cfg.el==="Cr"&&!cfg.q)note=" Chromium takes 3d<sup>5</sup> 4s<sup>1</sup>: a half-full d sub-level is more stable.";
  if(cfg.el==="Cu"&&!cfg.q)note=" Copper takes 3d<sup>10</sup> 4s<sup>1</sup>: a full d sub-level is more stable.";
  if(cfg.q)note+=" The 4s electrons are lost before any 3d electrons.";
  return `<div class="picker" role="group" aria-label="Element">${Object.keys(EL).map(e=>`<button data-el="${e}" class="${e===cfg.el?"on":""}">${e}</button>`).join("")}</div>
  <div class="picker" role="group" aria-label="Charge">${[0,1,2,3,4].map(q=>`<button data-q="${q}" class="${q===cfg.q?"on":""}" ${EL[cfg.el][2].includes(q)?"":"disabled"}>${q?q+"+":"atom"}</button>`).join("")}</div>
  ${boxes(d,s)}
  <div class="readout">${sym}: ${str}</div>
  <div class="verdict ${inc?"y":"n"}">${inc?"Incomplete 3d sub-level.":"3d sub-level is "+(d?"full":"empty")+"."}${note}</div>
  <div class="verdict ${isTM?"y":"n"}"><b>${cfg.el}</b> ${isTM?"is a transition metal: it forms at least one stable ion with an incomplete d sub-level.":"is not a transition metal: its only ion has "+(ions[0]===0?"an empty":"a full")+" d sub-level."}</div>`;
}

 {q:"What is the electron configuration of Fe^{3+}?",o:["[Ar] 3d^{3} 4s^{2}","[Ar] 3d^{4} 4s^{1}","[Ar] 3d^{5}","[Ar] 3d^{6}"],a:2,fb:["This removes 3d electrons before 4s. The 4s electrons go first.","This removes one 4s and two 3d electrons. Both 4s electrons go first.","Correct. Remove both 4s electrons, then one 3d: 3d^{6} 4s^{2} → 3d^{5}.","This is Fe^{2+}. Fe^{3+} has lost one more electron."]},
 {q:"What is the electron configuration of a copper atom?",o:["[Ar] 3d^{9} 4s^{2}","[Ar] 3d^{10} 4s^{1}","[Ar] 3d^{10} 4s^{2}","[Ar] 3d^{9}"],a:1,fb:["This follows the simple filling pattern, but copper is an exception.","Correct. A full 3d sub-level is more stable, so one electron moves from 4s to 3d.","This has 30 electrons: it is zinc.","This is Cu^{2+}, not the atom."]},
 {q:"Which ion has the same electron configuration as Mn^{2+}?",o:["Fe^{2+}","Fe^{3+}","Cr^{3+}","Co^{2+}"],a:1,fb:["Fe^{2+} is 3d^{6}. Mn^{2+} is 3d^{5}.","Correct. Both are [Ar] 3d^{5}.","Cr^{3+} is 3d^{3}.","Co^{2+} is 3d^{7}."]},
 {q:"How many unpaired electrons does an Fe^{2+} ion have?",o:["2","4","6","0"],a:1,fb:["Fill the five 3d boxes singly first, then pair: 3d^{6} gives one pair and four singles.","Correct. 3d^{6}: five electrons go one per box, the sixth pairs up, leaving four unpaired.","Six electrons, but one pair forms because there are only five d orbitals.","Fe^{2+} has a partly filled d sub-level, so some electrons must be unpaired."]}
 ]},
{id:"aqua",short:"Aqua ions",title:"Formation of aqua ions",
 pic:()=>picAqua(),
 text:`<div class="defs">
 <div class="def"><b>Complex</b>: a central metal atom or ion surrounded by ligands.</div>
 <div class="def"><b>Ligand</b>: a molecule or ion that forms a co-ordinate bond with a transition metal by donating a pair of electrons.</div>
 <div class="def"><b>Co-ordinate bond</b>: a shared pair of electrons in which both electrons come from the same atom.</div>
 <div class="def"><b>Co-ordination number</b>: the number of co-ordinate bonds to the central metal atom or ion.</div>
 </div>
 <p>When a transition metal salt dissolves in water, six water molecules each donate a lone pair from oxygen to the metal ion. This makes an octahedral <b>metal-aqua ion</b>. Water is neutral, so the complex keeps the charge of the metal ion.</p>
 <div class="eq">CuSO_{4}(s) + 6H_{2}O(l) → [Cu(H_{2}O)_{6}]^{2+}(aq) + SO_{4}^{2−}(aq)</div>
 <div class="eq">FeCl_{3}(s) + 6H_{2}O(l) → [Fe(H_{2}O)_{6}]^{3+}(aq) + 3Cl^{−}(aq)</div>
 <div class="tablewrap"><table class="col"><tr><th>Aqua ion</th><th>Colour</th></tr>
 <tr><td>[Fe(H_{2}O)_{6}]^{2+}</td><td><span class="sw" style="background:${CL.fe2}"></span>pale green</td></tr>
 <tr><td>[Fe(H_{2}O)_{6}]^{3+}</td><td><span class="sw" style="background:${CL.fe3}"></span>pale violet; solutions usually look yellow-brown</td></tr>
 <tr><td>[Cu(H_{2}O)_{6}]^{2+}</td><td><span class="sw" style="background:${CL.cuaq}"></span>blue</td></tr>
 <tr><td>[Co(H_{2}O)_{6}]^{2+}</td><td><span class="sw" style="background:${CL.coaq}"></span>pink</td></tr>
 <tr><td>[Cr(H_{2}O)_{6}]^{3+}</td><td><span class="sw" style="background:${CL.cr3}"></span>violet; often green from partial substitution</td></tr></table></div>
 <p class="why"><b>Lewis view.</b> The metal ion accepts electron pairs, so it is a Lewis acid. Each ligand donates a pair, so it is a Lewis base.</p>`,
 qs:[
 {q:"In [Fe(H_{2}O)_{6}]^{3+}, which atom donates the electron pair in each co-ordinate bond?",o:["Fe","H","O","Both H atoms"],a:2,fb:["The metal ion accepts the electron pairs.","Hydrogen in water has no lone pair.","Correct. Each O in water has two lone pairs; one is donated to the iron.","Hydrogen has no lone pairs to donate."]},
 {q:"What is the overall charge on the aqua ion formed by Cr^{3+}?",o:["3+","3−","0","9+"],a:0,fb:["Correct. Water ligands are neutral, so the complex has the 3+ charge of Cr^{3+}.","The ligands are neutral water molecules, not anions.","The metal ion is still 3+; neutral ligands do not cancel it.","Each ligand is neutral, so it adds no charge."]},
 {q:"Which best describes the bond between a water ligand and a metal ion?",o:["Ionic","Co-ordinate (dative covalent)","Hydrogen bond","Metallic"],a:1,fb:["There is no electron transfer between water and the metal ion.","Correct. A shared pair in which both electrons come from oxygen.","Hydrogen bonds form between molecules, not between a ligand and the metal.","Metallic bonding is in the solid metal."]},
 {q:"In Lewis terms, the metal ion in a complex is acting as",o:["a Lewis base","a Brønsted–Lowry acid","a Lewis acid","a reducing agent"],a:2,fb:["A Lewis base donates an electron pair; that is the ligand's role.","Brønsted–Lowry acids donate protons. The metal ion is accepting electron pairs here.","Correct. It accepts lone pairs from the ligands.","No electrons are transferred, so this is not redox."]}
 ]},
{id:"sub",short:"Ligand substitution",title:"Ligand substitution",
 pic:"sub",
 text:`<p>Ligands in a complex can be replaced by other ligands.</p>
 <p><b>H_{2}O and NH_{3}</b> are similar in size and both uncharged, so they swap with <b>no change in co-ordination number</b> or shape.</p>
 <div class="eq">[Co(H_{2}O)_{6}]^{2+} + 6NH_{3} → [Co(NH_{3})_{6}]^{2+} + 6H_{2}O</div>
 <p>With copper, excess ammonia replaces only four of the six waters, giving deep blue [Cu(NH_{3})_{4}(H_{2}O)_{2}]^{2+}.</p>
 <div class="eq">[Cu(H_{2}O)_{6}]^{2+} + 4NH_{3} → [Cu(NH_{3})_{4}(H_{2}O)_{2}]^{2+} + 4H_{2}O</div>
 <p><b>Cl^{−}</b> is larger than H_{2}O, so only four fit round the metal. Adding concentrated HCl changes the co-ordination number from 6 to 4 and the shape from octahedral to tetrahedral.</p>
 <div class="eq">[Cu(H_{2}O)_{6}]^{2+} + 4Cl^{−} → [CuCl_{4}]^{2−} + 6H_{2}O</div>
 <div class="eq">[Co(H_{2}O)_{6}]^{2+} + 4Cl^{−} → [CoCl_{4}]^{2−} + 6H_{2}O</div>
 <p class="why"><b>Exam point.</b> Ligand substitution is not redox: the oxidation state of the metal does not change. Adding water reverses the chloride substitution.</p>`,
 qs:[
 {q:"Concentrated HCl is added to [Cu(H_{2}O)_{6}]^{2+}(aq) until no further change. What is the copper-containing product?",o:["[CuCl_{6}]^{4−}","[CuCl_{4}]^{2−}","[Cu(H_{2}O)_{4}Cl_{2}]","CuCl_{2}(s)"],a:1,fb:["Six Cl^{−} ions are too large to fit round Cu^{2+}.","Correct. Four chloride ligands, tetrahedral, overall charge 2+ + 4(−1) = 2−.","This mixed complex can form on the way, but excess Cl^{−} replaces all the water.","No precipitate forms; the solution simply changes colour."]},
 {q:"Why does the co-ordination number fall from 6 to 4 when Cl^{−} replaces H_{2}O?",o:["Cl^{−} is larger than H_{2}O, so fewer fit round the metal ion","Cl^{−} donates two electron pairs each","The metal is oxidised","Cl^{−} is a weaker base than H_{2}O"],a:0,fb:["Correct. Chloride ions are bigger, so only four fit.","Cl^{−} is monodentate: one co-ordinate bond each.","The oxidation state stays +2. Substitution is not redox.","Base strength is not the reason; size is."]},
 {q:"What colour is [CoCl_{4}]^{2−}?",o:["Pink","Blue","Deep blue-violet","Yellow"],a:1,fb:["Pink is [Co(H_{2}O)_{6}]^{2+}, the starting complex.","Correct. Pink [Co(H_{2}O)_{6}]^{2+} turns blue with concentrated HCl.","That is closer to [Cu(NH_{3})_{4}(H_{2}O)_{2}]^{2+}.","Yellow is [CuCl_{4}]^{2−}."]},
 {q:"Which complex forms when excess aqueous ammonia is added to [Cu(H_{2}O)_{6}]^{2+}?",o:["[Cu(NH_{3})_{6}]^{2+}","[Cu(NH_{3})_{4}]^{2+}, tetrahedral","[Cu(NH_{3})_{4}(H_{2}O)_{2}]^{2+}","[Cu(NH_{3})_{2}]^{+}"],a:2,fb:["Only four of the six water ligands are replaced for copper.","The two water ligands stay, so it is still six-co-ordinate and octahedral.","Correct. Four ammonia and two water ligands: deep blue.","Copper stays +2; substitution does not change the oxidation state."]}
 ]},
{id:"multi",short:"Multidentate ligands",title:"Monodentate, bidentate and multidentate ligands",
 pic:"multi",
 text:`<p>Ligands are classified by how many co-ordinate bonds each one forms.</p>
 <div class="tablewrap"><table class="col"><tr><th>Type</th><th>Bonds</th><th>Examples</th></tr>
 <tr><td>Monodentate</td><td>1</td><td>H_{2}O, NH_{3}, Cl^{−}</td></tr>
 <tr><td>Bidentate</td><td>2</td><td>H_{2}NCH_{2}CH_{2}NH_{2} (en), C_{2}O_{4}^{2−}</td></tr>
 <tr><td>Multidentate</td><td>several</td><td>EDTA^{4−} (six), haem ring (four)</td></tr></table></div>
 <p>The co-ordination number counts <b>bonds</b>, not ligands. [Cu(en)_{3}]^{2+} has three ligands but co-ordination number 6.</p>
 <div class="eq">[Fe(H_{2}O)_{6}]^{3+} + 3C_{2}O_{4}^{2−} → [Fe(C_{2}O_{4})_{3}]^{3−} + 6H_{2}O</div>
 <p><b>Haemoglobin</b> carries oxygen. Haem is an iron(II) complex with a multidentate ligand: four N atoms of the porphyrin ring, one N from the globin protein, and O_{2} in the sixth position.</p>
 <p class="why"><b>Why CO is toxic.</b> CO forms a stronger co-ordinate bond to Fe^{2+} than O_{2} does. It replaces O_{2} and is not easily released, so less oxygen is carried round the body.</p>`,
 qs:[
 {q:"How many co-ordinate bonds can one EDTA^{4−} ion form to a metal ion?",o:["2","4","6","8"],a:2,fb:["Two is bidentate, like ethanedioate.","EDTA has four carboxylate O^{−} donors and also two N donors.","Correct. Two N lone pairs and four O^{−}: hexadentate.","EDTA has six donor atoms, and an octahedral complex has only six positions."]},
 {q:"What is the co-ordination number of iron in [Fe(C_{2}O_{4})_{3}]^{3−}?",o:["3","4","6","12"],a:2,fb:["There are three ligands, but each forms two bonds.","Count the bonds: 3 × 2.","Correct. Three bidentate ligands each form two co-ordinate bonds.","Each ethanedioate bonds through two O atoms, not four."]},
 {q:"Which is a bidentate ligand?",o:["NH_{3}","Cl^{−}","H_{2}NCH_{2}CH_{2}NH_{2}","H_{2}O"],a:2,fb:["Ammonia has one lone pair on N: monodentate.","Chloride bonds through one lone pair: monodentate.","Correct. Each N has a lone pair, so it forms two co-ordinate bonds.","Water bonds through one lone pair on O: monodentate."]},
 {q:"Why is carbon monoxide toxic?",o:["It oxidises Fe^{2+} in haem to Fe^{3+}","It binds more strongly to the Fe^{2+} in haem than O_{2}, so less O_{2} is carried","It replaces the porphyrin ring","It is a bidentate ligand"],a:1,fb:["CO does not change the oxidation state of iron.","Correct. CO takes the O_{2} position and is held strongly.","CO takes only the position where O_{2} would bond.","CO is monodentate: one lone pair on carbon bonds to iron."]}
 ]},
{id:"shape",short:"Shapes and isomerism",title:"Shapes of complexes and isomerism",
 pic:"shape",
 text:`<div class="tablewrap"><table class="col"><tr><th>Shape</th><th>Co-ord. no.</th><th>Example</th></tr>
 <tr><td>Octahedral, 90°</td><td>6</td><td>[Co(H_{2}O)_{6}]^{2+}, small ligands</td></tr>
 <tr><td>Tetrahedral, 109.5°</td><td>4</td><td>[CuCl_{4}]^{2−}, larger Cl^{−}</td></tr>
 <tr><td>Square planar, 90°</td><td>4</td><td>[Pt(NH_{3})_{2}Cl_{2}], cisplatin</td></tr>
 <tr><td>Linear, 180°</td><td>2</td><td>[Ag(NH_{3})_{2}]^{+}, Tollens' reagent</td></tr></table></div>
 <p><b>Cis–trans isomerism</b> is a special case of E–Z isomerism. It occurs in square planar complexes with two pairs of ligands, and in octahedral complexes with four of one ligand and two of another. Cis has the matching ligands at 90°, trans at 180°.</p>
 <p><b>Optical isomerism</b> occurs in octahedral complexes with three bidentate ligands, such as [Ni(en)_{3}]^{2+}. The two forms are non-superimposable mirror images.</p>
 <p class="why"><b>Cisplatin.</b> In a cell, both Cl^{−} ligands are replaced by N atoms on DNA bases. The platinum binds two strands, which stops DNA replication in fast-dividing cancer cells. It also harms healthy cells, so doses are kept low.</p>`,
 qs:[
 {q:"What are the shape and bond angle of [Ag(NH_{3})_{2}]^{+}?",o:["Bent, 104.5°","Linear, 180°","Tetrahedral, 109.5°","Square planar, 90°"],a:1,fb:["The metal has no lone pairs that affect the shape here.","Correct. Two ligands, linear.","Tetrahedral needs four ligands.","Square planar needs four ligands."]},
 {q:"Which complex is square planar?",o:["[CuCl_{4}]^{2−}","[Pt(NH_{3})_{2}Cl_{2}]","[Co(H_{2}O)_{6}]^{2+}","[Ag(NH_{3})_{2}]^{+}"],a:1,fb:["[CuCl_{4}]^{2−} is tetrahedral.","Correct. Platinum(II) complexes such as cisplatin are square planar.","Six ligands: octahedral.","Two ligands: linear."]},
 {q:"Which complex shows optical isomerism?",o:["[Co(NH_{3})_{6}]^{3+}","trans-[Co(NH_{3})_{4}Cl_{2}]^{+}","[Ni(H_{2}NCH_{2}CH_{2}NH_{2})_{3}]^{2+}","[CoCl_{4}]^{2−}"],a:2,fb:["Six identical ligands: its mirror image is identical.","The trans form has planes of symmetry, so it is superimposable on its mirror image.","Correct. Three bidentate ligands wrap round in a left- or right-handed way.","Four identical ligands in a tetrahedron: no isomers."]},
 {q:"In cisplatin, what is the Cl–Pt–Cl bond angle?",o:["90°","109.5°","120°","180°"],a:0,fb:["Correct. Cis means the two Cl^{−} ligands are next to each other in the square plane.","109.5° is tetrahedral; platinum(II) here is square planar.","120° is trigonal planar.","180° is the trans isomer."]}
 ]},
{id:"chel",short:"Chelate effect",title:"The chelate effect",
 pic:"chel",
 text:`<p>When monodentate ligands are replaced by bidentate or multidentate ligands, the new complex is more stable. This is the <b>chelate effect</b>.</p>
 <ul class="how">
 <li><b>ΔH ≈ 0</b>: similar numbers and types of bond are broken and made, e.g. six Co–N bonds broken and six Co–N bonds formed.</li>
 <li><b>ΔS is positive</b>: the number of particles in solution increases.</li>
 <li>So <b>ΔG = ΔH − TΔS is negative</b> and the reaction is feasible.</li>
 </ul>
 <div class="eq">[Co(NH_{3})_{6}]^{2+} + 3en → [Co(en)_{3}]^{2+} + 6NH_{3}&nbsp;&nbsp;&nbsp;(4 → 7)</div>
 <div class="eq">[Cu(H_{2}O)_{6}]^{2+} + EDTA^{4−} → [Cu(EDTA)]^{2−} + 6H_{2}O&nbsp;&nbsp;&nbsp;(2 → 7)</div>
 <p>The reverse reaction would need a large decrease in entropy, so chelate complexes are hard to break up.</p>
 <p class="why"><b>Exam point.</b> Count particles on each side, say the entropy change is positive, and link it to ΔG being negative. Write "ΔS is positive", not "ΔS increases".</p>`,
 qs:[
 {q:"For [Cu(H_{2}O)_{6}]^{2+} + 3H_{2}NCH_{2}CH_{2}NH_{2} → [Cu(H_{2}NCH_{2}CH_{2}NH_{2})_{3}]^{2+} + 6H_{2}O, how many particles are there on each side?",o:["2 → 7","4 → 7","4 → 4","1 → 1"],a:1,fb:["There are three en molecules on the left, not one.","Correct. 1 + 3 = 4 on the left; 1 + 6 = 7 on the right.","Count the six water molecules released.","Count every species, including the free ligands."]},
 {q:"Why is ΔH close to zero for the chelate substitution of [Co(NH_{3})_{6}]^{2+} by en?",o:["No bonds are broken","The same number and type of bonds (Co–N) are broken and formed","en forms ionic bonds","The reaction is very fast"],a:1,fb:["Six co-ordinate bonds are broken, but six similar ones are formed.","Correct. Six Co–N bonds break and six Co–N bonds form.","All the metal–ligand bonds are co-ordinate bonds.","Rate tells you nothing about ΔH."]},
 {q:"What is the main reason a chelate complex forms in preference?",o:["ΔH is very negative","ΔS is positive, so ΔG is negative","The activation energy is lower","The metal is oxidised"],a:1,fb:["ΔH is close to zero, so it is not the driving force.","Correct. More particles means positive ΔS, which makes ΔG negative.","Activation energy affects rate, not whether the product is favoured.","Substitution does not change the oxidation state."]},
 {q:"Which substitution of [Cu(H_{2}O)_{6}]^{2+} gives the largest increase in the number of particles?",o:["+ 4Cl^{−}","+ 4NH_{3}","+ 3en","+ EDTA^{4−}"],a:3,fb:["5 → 7: an increase of 2.","5 → 5: no change, since four NH_{3} replace four H_{2}O.","4 → 7: an increase of 3.","Correct. 2 → 7: an increase of 5."]}
 ]}
];

 {src:["Practice",P],q:"Which catalyst is correctly matched to its process?",o:["Fe: Contact process","V_{2}O_{5}: Contact process","V_{2}O_{5}: Haber process","Pt: Haber process"],a:1,fb:["Iron is the Haber process catalyst.","Correct. Vanadium(V) oxide catalyses SO_{2} → SO_{3}.","The Haber process uses iron.","The Haber process uses iron."]},

{id:"aqua",title:"Aqua ions and complexes",qs:[

 {src:["AQA 7405/3 Nov 2020 Q19",R],q:"Which shows the correct oxidation state and co-ordination number of cobalt in [Co(NH_{3})_{5}Cl]Cl_{2}?",o:["oxidation state +2, co-ordination number 5","oxidation state +2, co-ordination number 6","oxidation state +3, co-ordination number 5","oxidation state +3, co-ordination number 6"],a:3,fb:["The complex ion is [Co(NH_{3})_{5}Cl]^{2+}: Co + 0 − 1 = +2, so Co = +3. Count all six ligands.","The complex ion has charge 2+ (balanced by 2Cl^{−} outside). With one Cl^{−} ligand, Co must be +3.","Five NH_{3} plus one Cl^{−} gives six co-ordinate bonds.","Correct answer. Co = +3; five NH_{3} and one Cl^{−} give co-ordination number 6. The two Cl^{−} outside the bracket are not ligands."]},

 {src:["AQA 7405/3 2021 Q08",R],q:"Which statement about chloride ions is <u>not</u> correct?",o:["They form a white precipitate with silver nitrate solution that is soluble in dilute aqueous ammonia.","They form an octahedral cobalt(II) complex when aqueous cobalt(II) ions are reacted with an excess of chloride ions.","They form when chlorine reacts with potassium bromide solution.","They have the electron configuration 1s^{2} 2s^{2} 2p^{6} 3s^{2} 3p^{6}"],a:1,fb:["This is a correct statement about AgCl.","Correct answer. Cl^{−} is large, so [CoCl_{4}]^{2−} is tetrahedral, not octahedral.","Chlorine oxidises bromide, forming chloride ions. Correct statement.","This is the correct configuration of Cl^{−}."]},

/* ---------- state + rendering ---------- */
const state={page:0,alt:{sub:"cocl",multi:"en",shape:"shapes",chel:"en"},quiz:0,ans:{}};
const pages=[...S.map(s=>({type:"sec",s})),{type:"quiz"},{type:"res"}];
const $=s=>document.querySelector(s);
function scoreAll(){const v=Object.values(state.ans);const t=v.length,ok=v.filter(x=>x.first).length;$("#score").textContent=`First try ${ok} / ${t}`;}
function qCard(id,qq,n,label){
  const st=state.ans[id];
  const tag=qq.src?`<span class="src ${qq.src[1]===R?"real":""}">${qq.src[0]}</span>`:"";
  let h=`<div class="card" data-id="${id}"><h3><span>${label} ${n}</span>${tag}</h3><p class="q">${c(qq.q)}</p><div class="opts">`;
  qq.o.forEach((o,i)=>{let cls="";if(st){if(i===qq.a&&st.done)cls="right";else if(st.tried&&st.tried.includes(i))cls="wrong";}
    h+=`<button class="opt ${cls}" data-i="${i}" ${st&&st.done?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${c(o)}</span></button>`;});
  h+=`</div>`;
  if(st&&st.last!=null){const ok=st.last===qq.a;h+=`<p class="fb ${ok?"ok":"no"}">${ok?"":"<b>Not quite.</b> "}${c(qq.fb[st.last])}</p>`;}
  return h+`</div>`;
}
function findQ(id){const [kind,a,b]=id.split(":");return kind==="s"?S[+a].qs[+b]:QZ[+a].qs[+b];}
function rail(){
  $("#rail").innerHTML=pages.map((p,i)=>{
    let lab,done=false;
    if(p.type==="sec"){lab=`${i+1}. ${p.s.short}`;done=p.s.qs.every((q,j)=>state.ans[`s:${i}:${j}`]?.done);}
    else if(p.type==="quiz"){lab="Quizzes";done=QZ.every((z,a)=>z.qs.every((q,b)=>state.ans[`z:${a}:${b}`]?.done));}
    else lab="Results";
    return (p.type==="quiz"?`<span class="sep"></span>`:"")+`<button data-p="${i}" class="${i===state.page?"on":""} ${done?"done":""}">${lab}</button>`;
  }).join("");
}
function picFor(s){
  if(s.pic==="cfg")return `<div id="cfgw">${cfgWidget()}</div>`;
  if(s.pic==="sub")return alts("sub",[["cocl","Co^{2+} + Cl^{−}"],["cucl","Cu^{2+} + Cl^{−}"],["cuam","Cu^{2+} + NH_{3}"]])+picSub(state.alt.sub);
  if(s.pic==="multi")return alts("multi",[["en","en"],["ox","ethanedioate"],["edta","EDTA"],["haem","haem"]])+picMulti(state.alt.multi);
  if(s.pic==="shape")return alts("shape",[["shapes","Shapes"],["cistrans","Cis–trans"],["optical","Optical"]])+picShape(state.alt.shape);
  if(s.pic==="chel")return alts("chel",[["en","en"],["ox","ethanedioate"],["edta","EDTA"]])+picChelate(state.alt.chel);
  return s.pic();
}
function alts(key,list){return `<div class="alt" role="group">${list.map(([k,l])=>`<button data-alt="${key}" data-v="${k}" class="${state.alt[key]===k?"on":""}">${c(l)}</button>`).join("")}</div>`;}
function render(){
  rail();scoreAll();
  const p=pages[state.page],i=state.page;let h="";
  if(p.type==="sec"){const s=p.s;
    h=`<section class="fadein"><div class="stage"><div class="pic">${picFor(s)}</div><div class="text"><p class="eyebrow">Section ${i+1} of ${S.length}</p><h2>${s.title}</h2>${c(s.text)}</div></div>
    <div class="cards">${s.qs.map((q,j)=>qCard(`s:${i}:${j}`,q,j+1,"Check")).join("")}</div></section>`;
  } else if(p.type==="quiz"){const z=QZ[state.quiz],a=state.quiz;
    const nReal=QZ.reduce((n,z)=>n+z.qs.filter(q=>q.src[1]===R).length,0);
    h=`<section class="fadein"><p class="eyebrow">End-of-topic quizzes</p><h2>${z.title}</h2>
    <p class="qintro">${nReal} of these questions are real AQA Paper 3 multiple-choice questions, labelled with the paper. The rest are practice questions in the same style. Your first answer to each one counts towards your score.</p>
    <div class="alt" role="group">${QZ.map((q,k)=>`<button data-quiz="${k}" class="${k===a?"on":""}">${k+1}. ${q.title}</button>`).join("")}</div>
    <div class="cards">${z.qs.map((q,b)=>qCard(`z:${a}:${b}`,q,b+1,"Question")).join("")}</div></section>`;
  } else {
    const tally=(pre,n,arr)=>{let t=0,ok=0;arr.forEach((q,j)=>{const s=state.ans[`${pre}:${n}:${j}`];if(s&&s.done){t++;if(s.first)ok++;}});return [ok,t,arr.length];};
    let tot=[0,0,0];
    const rows=S.map((s,k)=>{const a=tally("s",k,s.qs),b=tally("z",k,QZ[k].qs);[a,b].forEach(x=>{tot[0]+=x[0];tot[1]+=x[1];tot[2]+=x[2];});
      return `<div class="row"><span>${k+1}. ${s.title}</span><span class="n"><small>Walkthrough</small>${a[0]} / ${a[2]}</span><span class="n"><small>Quiz</small>${b[0]} / ${b[2]}</span></div>`;}).join("");
    const pct=tot[2]?Math.round(100*tot[0]/tot[2]):0;
    const weak=S.filter((s,k)=>{const a=tally("s",k,s.qs),b=tally("z",k,QZ[k].qs);const att=a[1]+b[1];return att&&(a[0]+b[0])/att<.6;}).map(s=>s.short);
    h=`<section class="fadein"><p class="eyebrow">Results</p><h2>How you did</h2><p class="qintro">Scores count correct first attempts. A question you have not answered yet counts as zero.</p>
    <div class="res">${rows}</div>
    <div class="final"><b>${tot[0]} / ${tot[2]} first time (${pct}%)</b><br>${tot[1]<tot[2]?`You have ${tot[2]-tot[1]} questions still to answer. `:""}${weak.length?"Go back over: "+weak.join(", ")+".":tot[1]?"No section is below 60% so far.":""}</div></section>`;
  }
  h+=`<div class="nav"><button class="ghost" data-nav="-1" ${i===0?"disabled":""}>Back</button><button data-nav="1" ${i===pages.length-1?"disabled":""}>${i===pages.length-2?"See results":"Next"}</button></div>`;
  $("#main").innerHTML=h;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.p!=null){state.page=+b.dataset.p;render();window.scrollTo({top:0});return;}
  if(b.dataset.nav){state.page=Math.max(0,Math.min(pages.length-1,state.page+ +b.dataset.nav));render();window.scrollTo({top:0});return;}
  if(b.dataset.alt){state.alt[b.dataset.alt]=b.dataset.v;render();return;}
  if(b.dataset.quiz!=null){state.quiz=+b.dataset.quiz;render();return;}
  if(b.dataset.el){cfg.el=b.dataset.el;if(!EL[cfg.el][2].includes(cfg.q))cfg.q=0;$("#cfgw").innerHTML=cfgWidget();return;}
  if(b.dataset.q!=null){cfg.q=+b.dataset.q;$("#cfgw").innerHTML=cfgWidget();return;}
  if(b.classList.contains("opt")){
    const card=b.closest(".card"),id=card.dataset.id,qq=findQ(id),i=+b.dataset.i;
    const st=state.ans[id]||(state.ans[id]={tried:[],first:null,done:false,last:null});
    if(st.done)return;
    if(st.first===null)st.first=(i===qq.a);
    st.last=i;if(i===qq.a)st.done=true;else if(!st.tried.includes(i))st.tried.push(i);
    card.outerHTML=qCard(id,qq,+card.querySelector("h3 span").textContent.match(/\d+$/)[0],id.startsWith("s")?"Check":"Question");
    rail();scoreAll();
    const nc=document.querySelector(`.card[data-id="${id}"] .opt.right, .card[data-id="${id}"] .opt.wrong`);
  }
});
render();
</script>

</body></html>
