<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Hess's Law Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: example picker on top, one fixed-ratio stage (scaled to fit) with step caption + teacher controls beneath. Single cream projector theme. */
:root{
  --paper:#FBF6EC; --stage:#FFFDF8; --card:#F3E9D8; --ink:#3B2A1E; --muted:#7A6555; --brown:#8A5A33; --rule:#E2D2BA;
  --hot:#C4501B; --cold:#2C68AE; --green:#3B7A3A; --purple:#6E3D8F; --strike:#B3261E;
  --f-body:"Segoe UI", Calibri, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 24px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;color:var(--brown)}
.sub{color:var(--muted);font-size:.95rem}
.picker{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp b{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chip{font:inherit;font-size:.95rem;padding:5px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--stage);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brown);background:var(--card);font-weight:600;box-shadow:inset 0 0 0 1px var(--brown)}
.chip.c{border-left:4px solid var(--hot)} .chip.f{border-left:4px solid var(--cold)} .chip.b{border-left:4px solid var(--purple)}
.frame{background:var(--stage);border:1px solid var(--rule);border-radius:10px;overflow:hidden;position:relative;width:100%;max-width:calc((100vh - 240px) * 1000 / 560);margin:0 auto;aspect-ratio:1000/560}
#stage{position:absolute;left:0;top:0;width:1000px;height:560px;transform-origin:0 0}
.k{position:absolute;white-space:nowrap;font-size:23px;line-height:34px;height:34px;transition:left .9s ease, top .9s ease, opacity .6s ease, width .9s ease;color:var(--ink)}
.k.L{text-align:right}.k.R{text-align:left}.k.M{text-align:center}
.tg{color:var(--cold);font-weight:600}
.dh{font-size:19px;color:var(--hot);font-weight:600}
.tag{font-size:15px;line-height:26px;height:26px;margin-top:4px;padding:0 8px;border-radius:13px;background:var(--card);color:var(--brown);font-weight:600;width:auto!important}
.sp{transition:opacity .5s, color .5s}
.sp.x{text-decoration:line-through;text-decoration-thickness:2px;color:var(--strike);opacity:.5}
.lab{position:absolute;font-size:15px;color:var(--muted);transition:opacity .5s}
.note{font-size:18px;color:var(--muted)}
.arm{font-size:19px;line-height:26px;height:auto;white-space:normal;color:var(--ink)}
.ans{font-size:24px;font-weight:700;color:var(--green)}
.flash{animation:fl 1.1s ease}
@keyframes fl{0%{background:#FBE3B4}100%{background:transparent}}
svg line,svg path{transition:opacity .6s, stroke .4s}
.below{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;max-width:calc((100vh - 240px) * 1000 / 560);width:100%;margin:0 auto}
.cap h2{font-size:1.35rem;margin:0}
.ctl{display:flex;gap:8px;align-items:center}
.ctl button{font:inherit;font-size:1rem;padding:8px 14px;border-radius:8px;border:1px solid var(--brown);background:var(--stage);color:var(--brown);cursor:pointer}
.ctl button.pri{background:var(--brown);color:var(--paper)}
.dots{display:flex;gap:5px;margin:0 6px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--rule);display:block}.dots i.on{background:var(--brown)}
button:focus-visible{outline:3px solid var(--cold);outline-offset:2px}
@media (max-width:700px){.below{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header><h1>Hess's Law Explorer</h1><span class="sub">Equations → sum → cycle. Click the stage or press → to step.</span></header>
  <div class="picker" id="picker"></div>
  <div class="frame" id="frame"><div id="stage">
    <svg id="svg" width="1000" height="560" viewBox="0 0 1000 560" style="position:absolute;left:0;top:0">
      <defs>
        <marker id="hd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="context-stroke"/></marker>
      </defs>
      <line id="sumline" x1="110" y1="318" x2="990" y2="318" stroke="#3B2A1E" stroke-width="2" opacity="0"/>
      <line id="aTop" stroke="#2C68AE" stroke-width="3.5" marker-end="url(#hd)" opacity="0"/>
      <line id="aL" stroke="#8A5A33" stroke-width="3.5" marker-end="url(#hd)" opacity="0"/>
      <line id="aR" stroke="#8A5A33" stroke-width="3.5" marker-end="url(#hd)" opacity="0"/>
      <path id="route" fill="none" stroke="#3B7A3A" stroke-width="6" stroke-dasharray="2 12" stroke-linecap="round" opacity="0"/>
      <circle id="dot" r="11" fill="#3B7A3A" opacity="0"/>
    </svg>
  </div></div>
  <div class="below">
    <div class="cap" id="cap" aria-live="polite"></div>
    <div class="ctl"><button id="bk" type="button">◀ Back</button><div class="dots" id="dots"></div><button id="rp" type="button" title="Replay (R)">↺</button><button id="nx" type="button" class="pri">Next ▶</button></div>
  </div>
</div>

<script>
(() => {
"use strict";
/* ---------------- species data: formation and combustion equations ---------------- */
const SP = {
  'Fe2O3(s)':  {f: [[2,'Fe(s)'],[1.5,'O2(g)']], fH: -822},
  'CO(g)':     {f: [[1,'C(s)'],[0.5,'O2(g)']], fH: -111, c: 0.5, cp: [[1,'CO2(g)']], cH: -283},
  'CO2(g)':    {f: [[1,'C(s)'],[1,'O2(g)']], fH: -394},
  'C(s)':      {el: 1, c: 1, cp: [[1,'CO2(g)']], cH: -394},
  'H2(g)':     {el: 1, c: 0.5, cp: [[1,'H2O(l)']], cH: -286},
  'H2O(l)':    {f: [[1,'H2(g)'],[0.5,'O2(g)']], fH: -286},
  'H2O(g)':    {f: [[1,'H2(g)'],[0.5,'O2(g)']], fH: -242},
  'CH4(g)':    {f: [[1,'C(s)'],[2,'H2(g)']], fH: -75, c: 2, cp: [[1,'CO2(g)'],[2,'H2O(l)']], cH: -890},
  'C2H5OH(l)': {f: [[2,'C(s)'],[3,'H2(g)'],[0.5,'O2(g)']], fH: -277, c: 3, cp: [[2,'CO2(g)'],[3,'H2O(l)']], cH: -1367},
  'C3H7OH(l)': {f: [[3,'C(s)'],[4,'H2(g)'],[0.5,'O2(g)']], fH: -305, c: 4.5, cp: [[3,'CO2(g)'],[4,'H2O(l)']], cH: -2021},
  'NH3(g)':    {f: [[0.5,'N2(g)'],[1.5,'H2(g)']], fH: -46},
  'NO(g)':     {f: [[0.5,'N2(g)'],[0.5,'O2(g)']], fH: 90},
  'Al2O3(s)':  {f: [[2,'Al(s)'],[1.5,'O2(g)']], fH: -1676},
  'CaCO3(s)':  {f: [[1,'Ca(s)'],[1,'C(s)'],[1.5,'O2(g)']], fH: -1207},
  'CaO(s)':    {f: [[1,'Ca(s)'],[0.5,'O2(g)']], fH: -635},
  'C2H4(g)':   {f: [[2,'C(s)'],[2,'H2(g)']], fH: 52, c: 3, cp: [[2,'CO2(g)'],[2,'H2O(l)']], cH: -1411},
  'C2H6(g)':   {f: [[2,'C(s)'],[3,'H2(g)']], fH: -85, c: 3.5, cp: [[2,'CO2(g)'],[3,'H2O(l)']], cH: -1560},
  'Sb2O3(s)':  {f: [[2,'Sb(s)'],[1.5,'O2(g)']], fH: -705},
  'Sb(l)':     {f: [[1,'Sb(s)']], fH: 20},
  'CF4(g)':    {f: [[1,'C(s)'],[2,'F2(g)']], fH: -680},
  'HF(g)':     {f: [[0.5,'H2(g)'],[0.5,'F2(g)']], fH: -269},
};
/* mean bond enthalpies: atomisation of each gaseous species */
const BD = {
  'H2(g)':   {at: [[2,'H(g)']], b: [[1,'H–H',436]]},
  'Cl2(g)':  {at: [[2,'Cl(g)']], b: [[1,'Cl–Cl',243]]},
  'Br2(g)':  {at: [[2,'Br(g)']], b: [[1,'Br–Br',193]]},
  'HCl(g)':  {at: [[1,'H(g)'],[1,'Cl(g)']], b: [[1,'H–Cl',432]]},
  'HBr(g)':  {at: [[1,'H(g)'],[1,'Br(g)']], b: [[1,'H–Br',366]]},
  'O2(g)':   {at: [[2,'O(g)']], b: [[1,'O=O',498]]},
  'N2(g)':   {at: [[2,'N(g)']], b: [[1,'N≡N',945]]},
  'CH4(g)':  {at: [[1,'C(g)'],[4,'H(g)']], b: [[4,'C–H',413]]},
  'CO2(g)':  {at: [[1,'C(g)'],[2,'O(g)']], b: [[2,'C=O',805]]},
  'H2O(g)':  {at: [[2,'H(g)'],[1,'O(g)']], b: [[2,'O–H',464]]},
  'NH3(g)':  {at: [[1,'N(g)'],[3,'H(g)']], b: [[3,'N–H',391]]},
  'C2H4(g)': {at: [[2,'C(g)'],[4,'H(g)']], b: [[1,'C=C',612],[4,'C–H',413]]},
  'C2H6(g)': {at: [[2,'C(g)'],[6,'H(g)']], b: [[1,'C–C',347],[6,'C–H',413]]},
  'C2H4Br2(g)': {at: [[2,'C(g)'],[4,'H(g)'],[2,'Br(g)']], b: [[1,'C–C',347],[4,'C–H',413],[2,'C–Br',290]]},
};
/* kind f = formation data (arrows up from elements), kind c = combustion data (arrows down to combustion products) */
const EX = [
  {n: 'Iron extraction', k: 'f', L: [[1,'Fe2O3(s)'],[3,'CO(g)']], R: [[2,'Fe(s)'],[3,'CO2(g)']]},
  {n: 'Thermite', k: 'f', L: [[2,'Al(s)'],[1,'Fe2O3(s)']], R: [[1,'Al2O3(s)'],[2,'Fe(s)']]},
  {n: 'Heating CaCO₃', k: 'f', L: [[1,'CaCO3(s)']], R: [[1,'CaO(s)'],[1,'CO2(g)']]},
  {n: 'Burning methane', k: 'f', L: [[1,'CH4(g)'],[2,'O2(g)']], R: [[1,'CO2(g)'],[2,'H2O(l)']]},
  {n: 'Burning ethanol', k: 'f', L: [[1,'C2H5OH(l)'],[3,'O2(g)']], R: [[2,'CO2(g)'],[3,'H2O(l)']]},
  {n: 'Oxidising ammonia', k: 'f', L: [[4,'NH3(g)'],[5,'O2(g)']], R: [[4,'NO(g)'],[6,'H2O(g)']]},
  {n: 'Ethene + H₂ (ΔfH)', k: 'f', L: [[1,'C2H4(g)'],[1,'H2(g)']], R: [[1,'C2H6(g)']]},
  {n: 'Antimony', k: 'f', L: [[1,'Sb2O3(s)'],[3,'CO(g)']], R: [[2,'Sb(l)'],[3,'CO2(g)']]},
  {n: 'ΔfH of methane', k: 'c', L: [[1,'C(s)'],[2,'H2(g)']], R: [[1,'CH4(g)']]},
  {n: 'ΔfH of ethanol', k: 'c', L: [[2,'C(s)'],[3,'H2(g)'],[0.5,'O2(g)']], R: [[1,'C2H5OH(l)']]},
  {n: 'ΔfH of propan-1-ol', k: 'c', L: [[3,'C(s)'],[4,'H2(g)'],[0.5,'O2(g)']], R: [[1,'C3H7OH(l)']]},
  {n: 'ΔfH of ethene', k: 'c', L: [[2,'C(s)'],[2,'H2(g)']], R: [[1,'C2H4(g)']]},
  {n: 'C → CO', k: 'c', L: [[1,'C(s)'],[0.5,'O2(g)']], R: [[1,'CO(g)']]},
  {n: 'Ethene + H₂ (ΔcH)', k: 'c', L: [[1,'C2H4(g)'],[1,'H2(g)']], R: [[1,'C2H6(g)']]},
  {n: 'H₂ + Cl₂', k: 'b', L: [[1,'H2(g)'],[1,'Cl2(g)']], R: [[2,'HCl(g)']]},
  {n: 'H₂ + Br₂', k: 'b', L: [[1,'H2(g)'],[1,'Br2(g)']], R: [[2,'HBr(g)']]},
  {n: 'Making ammonia', k: 'b', L: [[1,'N2(g)'],[3,'H2(g)']], R: [[2,'NH3(g)']]},
  {n: 'Burning hydrogen', k: 'b', L: [[2,'H2(g)'],[1,'O2(g)']], R: [[2,'H2O(g)']]},
  {n: 'Burning methane', k: 'b', L: [[1,'CH4(g)'],[2,'O2(g)']], R: [[1,'CO2(g)'],[2,'H2O(g)']]},
  {n: 'Ethene + H₂', k: 'b', L: [[1,'C2H4(g)'],[1,'H2(g)']], R: [[1,'C2H6(g)']]},
  {n: 'Ethene + Br₂', k: 'b', L: [[1,'C2H4(g)'],[1,'Br2(g)']], R: [[1,'C2H4Br2(g)']]},
];

/* ---------------- formatting ---------------- */
const FR = {0.5: '½', 1.5: '1½', 2.5: '2½', 3.5: '3½', 4.5: '4½', 5.5: '5½'};
const coef = c => c === 1 ? '' : (FR[c] || String(+c.toFixed(3)));
const fmla = s => s.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
const term = (c, s) => coef(c) + fmla(s);
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v));
const par = v => v < 0 ? '(−' + Math.abs(v) + ')' : String(v);
const side = (ts, keyed) => ts.map(([c, s]) => keyed ? `<span class="sp" data-s="${s}">${term(c, s)}</span>` : term(c, s)).join(' + ');

/* ---------------- build an example ---------------- */
function build(ex){
  const isF = ex.k === 'f', isB = ex.k === 'b', sym = isF ? 'Δ<sub>f</sub>H' : isB ? 'ΣBE' : 'Δ<sub>c</sub>H', symT = isF ? 'ΔfH' : 'ΔcH';
  const rows = [];
  const addRow = (c, s, prod) => {
    if (isB) { const d = BD[s]; if (!d) return;
      rows.push({s, c, prod, H: d.b.reduce((a, [n, , v]) => a + n * v, 0), nat: {l: [[1, s]], r: d.at}, rev: prod}); return; }
    const d = SP[s];
    if (isF && (!d || d.el || !d.f)) return;               // elements: ΔfH = 0
    if (!isF && (!d || d.c == null)) return;              // O2 etc: no combustion
    const H = isF ? d.fH : d.cH;
    const nat = isF ? {l: d.f, r: [[1, s]]} : {l: [[1, s], [d.c, 'O2(g)']], r: d.cp};
    const rev = isF ? !prod : prod;                         // f: reverse reactants; c: reverse products
    rows.push({s, c, H, prod, nat, rev});
  };
  ex.L.forEach(([c, s]) => addRow(c, s, false));
  ex.R.forEach(([c, s]) => addRow(c, s, true));
  // scaled equations for the sum method
  rows.forEach(r => {
    const sc = ts => ts.map(([k, x]) => [k * r.c, x]);
    const l = sc(r.nat.l), rr = sc(r.nat.r);
    r.sum = r.rev ? {l: rr, r: l} : {l, r: rr};
    r.val = (r.rev ? -1 : 1) * r.c * r.H;
    const hv = r.H < 0 ? '(−' + Math.abs(r.H) + ')' : String(r.H);
    const inner = r.c !== 1 ? coef(r.c) + ' × ' + hv : '(' + (r.H < 0 ? '−' : '') + Math.abs(r.H) + ')';
    r.expr = r.rev || r.c !== 1 ? (r.rev ? '−' : '') + inner + ' = ' + sgn(r.val) : sgn(r.val);
    r.tag = (r.rev ? 'reverse' : '') + (r.rev && r.c !== 1 ? ' ' : '') + (r.c !== 1 ? '× ' + coef(r.c) : '');
  });
  // net equation check and cancelling species
  const tot = {}, onL = {}, onR = {};
  rows.forEach(r => { r.sum.l.forEach(([k, x]) => { tot[x] = (tot[x] || 0) + k; onL[x] = (onL[x] || 0) + k; });
                      r.sum.r.forEach(([k, x]) => { tot[x] = (tot[x] || 0) - k; onR[x] = (onR[x] || 0) + k; }); });
  const want = {}; ex.L.forEach(([k, x]) => want[x] = (want[x] || 0) + k); ex.R.forEach(([k, x]) => want[x] = (want[x] || 0) - k);
  const ok = Object.keys({...tot, ...want}).every(x => Math.abs((tot[x] || 0) - (want[x] || 0)) < 1e-9);
  if (!ok) console.error('Equations do not sum to target', ex.n, tot, want);
  const cancel = Object.keys(onL).filter(x => onR[x]);
  const partial = cancel.filter(x => Math.abs(onL[x] - onR[x]) > 1e-9).map(x => ({x, l: onL[x], r: onR[x]}));
  // cycle corners
  const sumL = rows.filter(r => !r.prod), sumR = rows.filter(r => r.prod);
  const armVal = rs => rs.reduce((a, r) => a + r.c * r.H, 0);
  const armExpr = rs => rs.length ? rs.map(r => r.c !== 1 ? coef(r.c) + '(' + (r.H < 0 ? '−' : '') + Math.abs(r.H) + ')' : par(r.H)).join(' + ') : '0';
  let bottom, tagL = '', tagR = '';
  if (isB) {
    const at = {}; ex.L.forEach(([k, x]) => BD[x].at.forEach(([kk, y]) => at[y] = (at[y] || 0) + kk * k));
    const ORD = ['C(g)','H(g)','N(g)','O(g)','Cl(g)','Br(g)'];
    bottom = Object.entries(at).map(([x, k]) => [k, x]).sort((a, b) => ORD.indexOf(a[1]) - ORD.indexOf(b[1]));
  } else if (isF) {
    const el = {};
    ex.L.forEach(([k, x]) => { const d = SP[x]; if (!d || d.el || !d.f) el[x] = (el[x] || 0) + k; else d.f.forEach(([kk, y]) => el[y] = (el[y] || 0) + kk * k); });
    const ORD = ['Fe(s)','Al(s)','Ca(s)','Sb(s)','C(s)','H2(g)','N2(g)','O2(g)','F2(g)'];
    bottom = Object.entries(el).map(([x, k]) => [k, x]).sort((a, b) => ORD.indexOf(a[1]) - ORD.indexOf(b[1]));
  } else {
    const pr = {}; let o2 = 0, o2R = 0;
    ex.L.forEach(([k, x]) => { const d = SP[x]; if (d && d.c != null) { o2 += d.c * k; d.cp.forEach(([kk, y]) => pr[y] = (pr[y] || 0) + kk * k); } else if (x === 'O2(g)') o2 -= k; });
    ex.R.forEach(([k, x]) => { const d = SP[x]; if (d && d.c != null) o2R += d.c * k; });
    bottom = Object.entries(pr).map(([x, k]) => [k, x]);
    if (o2 > 1e-9) tagL = '+ ' + term(o2, 'O2(g)');
    if (o2R > 1e-9) tagR = '+ ' + term(o2R, 'O2(g)');
  }
  const aL = armVal(sumL), aR = armVal(sumR);
  const ans = isF ? aR - aL : aL - aR;
  const rowSum = rows.reduce((a, r) => a + r.val, 0);
  if (Math.abs(rowSum - ans) > 1e-9) console.error('Route mismatch', ex.n, rowSum, ans);
  const bonds = isB ? [...new Map([...ex.L, ...ex.R].flatMap(([, x]) => BD[x].b.map(([, n, v]) => [n, v]))).entries()].map(([n, v]) => n + ' ' + v).join(',  ') : '';
  return {ex, isF, isB, bonds, sym, symT, rows, cancel, partial, bottom, tagL, tagR, aL, aR, ans, exL: armExpr(sumL), exR: armExpr(sumR)};
}

/* ---------------- stage elements ---------------- */
const stage = document.getElementById('stage'), frame = document.getElementById('frame');
const $ = id => document.getElementById(id);
function fit(){ stage.style.transform = `scale(${frame.clientWidth / 1000})`; }
new ResizeObserver(fit).observe(frame);
const els = {};
function mk(id, cls){ let e = document.createElement('div'); e.id = id; e.className = 'k ' + (cls || ''); stage.appendChild(e); els[id] = e; return e; }

let B = null, S = 0, routeT0 = 0;
const STEPS = 6;
const CAPS = ['The data and the target', 'Make the data match the target', 'Add the equations: species on both sides cancel', 'The same equations as a Hess cycle', 'Route 1 = route 2', 'The shortcut'];

function load(i){
  B = build(EX[i]);
  Object.values(els).forEach(e => e.remove()); for (const k in els) delete els[k];
  [...document.querySelectorAll('.chip[data-i]')].forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i ? 'true' : 'false'));
  const ex = B.ex;
  mk('lt', 'lab').textContent = 'Target'; els.lt.style.cssText = 'left:20px;top:24px';
  mk('tl', 'tg').innerHTML = side(ex.L, true); mk('ta').textContent = '→'; mk('tr', 'tg').innerHTML = side(ex.R, true);
  mk('td', 'dh').innerHTML = 'Δ<sub>r</sub>H = ?';
  mk('ld', 'lab').innerHTML = (B.isF ? 'Enthalpies of formation' : B.isB ? 'Bonds broken to make gaseous atoms (mean bond enthalpies)' : 'Enthalpies of combustion'); els.ld.style.cssText = 'left:20px;top:92px';
  B.rows.forEach((r, j) => {
    mk('g' + j, 'tag');
    mk('a' + j); mk('b' + j); mk('w' + j).textContent = '→'; mk('h' + j, 'dh');
  });
  mk('el', 'note');
  if (B.isF) { const els0 = [...ex.L, ...ex.R].filter(([, s]) => !SP[s] || SP[s].el).map(([, s]) => fmla(s));
    els.el.innerHTML = els0.length ? [...new Set(els0)].join(', ') + ': Δ<sub>f</sub>H = 0 (elements)' : ''; }
  else if (B.isB) { els.el.innerHTML = 'kJ mol<sup>−1</sup>:  ' + B.bonds; }
  else { els.el.innerHTML = [...ex.L, ...ex.R].some(([, s]) => s === 'O2(g)') ? 'O<sub>2</sub>(g) does not burn – no Δ<sub>c</sub>H' : ''; }
  ['p1', 'p2', 'p3'].forEach(k => mk(k).textContent = '+');
  mk('sl', 'tg').innerHTML = side(ex.L); mk('sa').textContent = '→'; mk('sr', 'tg').innerHTML = side(ex.R);
  mk('sd', 'dh'); mk('pn', 'note');
  mk('cb').innerHTML = side(B.bottom); mk('tgl', 'note'); mk('tgr', 'note');
  els.tgl.innerHTML = B.tagL; els.tgr.innerHTML = B.tagR;
  mk('al', 'arm'); mk('ar', 'arm'); mk('an', 'ans');
  go(0, true);
}

const LX = 120, LW = 330, AX = 452, RX = 492, RW = 300, DX = 800;
const ROWY = j => 128 + j * 58;
function put(id, x, y, w, cls, o){ const e = els[id]; if (!e) return; e.style.left = x + 'px'; e.style.top = y + 'px'; if (w) e.style.width = w + 'px'; e.style.opacity = o;
  if (cls) { e.classList.remove('L', 'R', 'M'); e.classList.add(cls); } }

function go(s, instant){
  if (s < 0 || s >= STEPS) return; S = s;
  if (instant) Object.values(els).forEach(e => e.style.transition = 'none');
  const n = B.rows.length, list = s <= 2;
  // target row
  if (list) { put('tl', LX, 20, LW, 'L', 1); put('ta', AX, 20, 36, 'M', 1); put('tr', RX, 20, RW, 'R', 1); put('td', DX, 22, 190, 'R', 1); }
  else { const ty = B.isB ? 410 : 64; put('tl', 30, ty, 420, 'M', 1); put('ta', 482, ty - 24, 36, 'M', 0); put('tr', 550, ty, 420, 'M', 1); put('td', 380, B.isB ? 362 : 18, 240, 'M', 1); }
  els.td.innerHTML = s >= 4 ? 'Δ<sub>r</sub>H = ' + sgn(B.ans) + ' kJ mol<sup>−1</sup>' : 'Δ<sub>r</sub>H = ?';
  els.td.classList.toggle('flash', s === 4);
  els.lt.style.opacity = list ? 1 : 0; els.ld.style.opacity = list ? 1 : 0;
  B.rows.forEach((r, j) => {
    const y = ROWY(j), swap = s >= 1 && r.rev;
    // a = natural left side, b = natural right side
    const nat = r.nat, useScale = s >= 1;
    const sc = ts => useScale ? ts.map(([k, x]) => [k * r.c, x]) : ts;
    els['a' + j].innerHTML = side(sc(nat.l), true); els['b' + j].innerHTML = side(sc(nat.r), true);
    els['h' + j].innerHTML = s === 0 ? B.sym + ' = ' + sgn(r.H) : r.expr;
    els['g' + j].textContent = r.tag;
    if (list) {
      put('a' + j, swap ? RX : LX, y, swap ? RW : LW, swap ? 'R' : 'L', 1);
      put('b' + j, swap ? LX : RX, y, swap ? LW : RW, swap ? 'L' : 'R', 1);
      put('w' + j, AX, y, 36, 'M', 1); put('h' + j, DX, y + 2, 195, 'R', 1);
      put('g' + j, 6, y + 2, 0, null, s >= 1 && r.tag ? 1 : 0);
      if (s === 1 && !instant && (r.rev || r.c !== 1)) ['h' + j, 'a' + j, 'b' + j].forEach(id => { const e = els[id]; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); });
    } else {
      // species side flies to its top corner, the other side to the bottom corner
      const spSide = B.isF ? 'b' : 'a', other = B.isF ? 'a' : 'b', ty = B.isB ? 410 : 64;
      const top = r.prod ? [550, ty] : [30, ty];
      put(spSide + j, top[0], top[1], 420, 'M', 0); put(other + j, 290, B.isB ? 40 : 470, 420, 'M', 0);
      put('w' + j, r.prod ? 700 : 260, 280, 36, 'M', 0); put('h' + j, r.prod ? 720 : 90, 260, 195, 'M', 0); put('g' + j, 6, 260, 0, null, 0);
    }
  });
  put('el', LX, ROWY(n) - 4, 700, 'L', list && s < 2 && els.el.innerHTML ? 1 : 0); els.el.style.textAlign = 'left';
  // plus signs and sum line
  ['p1', 'p2', 'p3'].forEach((k, j) => put(k, 116, ROWY(j + 1), 24, 'M', s === 2 && j + 1 < n ? 1 : 0));
  const yLine = ROWY(n) + 2; $('sumline').setAttribute('y1', yLine); $('sumline').setAttribute('y2', yLine);
  $('sumline').style.opacity = s === 2 ? 1 : 0;
  put('sl', LX, yLine + 12, LW, 'L', s === 2 ? 1 : 0); put('sa', AX, yLine + 12, 36, 'M', s === 2 ? 1 : 0); put('sr', RX, yLine + 12, RW, 'R', s === 2 ? 1 : 0);
  els.sd.innerHTML = 'Δ<sub>r</sub>H = ' + B.rows.map(r => '(' + sgn(r.val) + ')').join(' + ') + ' = <b>' + sgn(B.ans) + ' kJ mol<sup>−1</sup></b>';
  put('sd', LX, yLine + 58, 860, 'L', s === 2 ? 1 : 0); els.sd.style.textAlign = 'left';
  els.pn.innerHTML = B.partial.map(p => term(p.l, p.x) + ' − ' + term(p.r, p.x) + ' leaves ' + term(Math.abs(p.l - p.r), p.x) + ' on the ' + (p.l > p.r ? 'left' : 'right')).join(';  ');
  put('pn', LX, yLine + 96, 860, 'L', s === 2 && B.partial.length ? 1 : 0); els.pn.style.textAlign = 'left';
  document.querySelectorAll('.sp').forEach(e => e.classList.toggle('x', s === 2 && B.cancel.includes(e.dataset.s) && !e.closest('#tl,#tr')));
  // cycle
  const cyc = s >= 3;
  put('cb', 290, B.isB ? 40 : 470, 420, 'M', cyc ? 1 : 0);
  put('tgl', 30, 100, 420, 'M', cyc && B.tagL ? 1 : 0); put('tgr', 550, 100, 420, 'M', cyc && B.tagR ? 1 : 0);
  ['tgl', 'tgr'].forEach(k => els[k].style.textAlign = 'center');
  const P = B.isB ? {TL: [240, 400], TR: [760, 400], BL: [440, 92], BR: [560, 92]} : {TL: [240, 132], TR: [760, 132], BL: [440, 462], BR: [560, 462]};
  const setL = (id, a, b) => { const e = $(id); e.setAttribute('x1', a[0]); e.setAttribute('y1', a[1]); e.setAttribute('x2', b[0]); e.setAttribute('y2', b[1]); };
  setL('aTop', [455, B.isB ? 427 : 81], [545, B.isB ? 427 : 81]);
  if (B.isB) { setL('aL', P.TL, P.BL); setL('aR', P.BR, P.TR); }
  else if (B.isF) { setL('aL', P.BL, P.TL); setL('aR', P.BR, P.TR); } else { setL('aL', P.TL, P.BL); setL('aR', P.TR, P.BR); }
  ['aTop', 'aL', 'aR'].forEach(id => $(id).style.opacity = cyc ? 1 : 0);
  const armTxt = (expr, val) => (B.isF ? 'Σ' : 'Σ') + B.sym + ' = ' + expr + '<br><b>= ' + sgn(val) + '</b>';
  els.al.innerHTML = armTxt(B.exL, B.aL); els.ar.innerHTML = armTxt(B.exR, B.aR);
  if (B.isB) { els.al.innerHTML = '<b>bonds broken</b><br>' + B.exL + '<br><b>= ' + sgn(B.aL) + '</b>';
               els.ar.innerHTML = '<b>bonds made</b><br>' + B.exR + '<br><b>= ' + sgn(-B.aR) + '</b>'; }
  if (s >= 4 && B.isB) {
    els.al.innerHTML = 'with the arrow<br>bonds broken <b>' + sgn(B.aL) + '</b>';
    els.ar.innerHTML = 'with the arrow<br>bonds made <b>' + sgn(-B.aR) + '</b>';
  } else if (s >= 4) {
    // route TL -> bottom -> TR; left arm: f = against arrow, c = with arrow; right arm: f = with, c = against
    const lAg = B.isF, rAg = !B.isF;
    els.al.innerHTML = (lAg ? '<span style="color:var(--strike)">against the arrow</span><br>−(' + sgn(B.aL) + ') = <b>' + sgn(-B.aL) + '</b>' : 'with the arrow<br><b>' + sgn(B.aL) + '</b>');
    els.ar.innerHTML = (rAg ? '<span style="color:var(--strike)">against the arrow</span><br>−(' + sgn(B.aR) + ') = <b>' + sgn(-B.aR) + '</b>' : 'with the arrow<br><b>' + sgn(B.aR) + '</b>');
  }
  put('al', 10, 232, 250, 'R', cyc ? 1 : 0); put('ar', 742, 232, 250, 'L', cyc ? 1 : 0);
  els.al.style.textAlign = 'right'; els.ar.style.textAlign = 'left';
  const legs = [(B.isF ? -B.aL : B.aL), (B.isF ? B.aR : -B.aR)];
  if (s === 5 && B.isB) els.an.innerHTML = 'Δ<sub>r</sub>H = Σ(bonds broken) − Σ(bonds made) = ' + sgn(B.aL) + ' − ' + B.aR + ' = ' + sgn(B.ans) + '  <span style="font-weight:400;font-size:17px;color:var(--muted)">(mean values: approximate)</span>';
  if (s === 4) els.an.innerHTML = 'Δ<sub>r</sub>H = (' + sgn(legs[0]) + ') + (' + sgn(legs[1]) + ') = ' + sgn(B.ans) + ' kJ mol<sup>−1</sup>';
  if (s === 5 && !B.isB) els.an.innerHTML = B.isF
    ? 'Δ<sub>r</sub>H = ΣΔ<sub>f</sub>H(products) − ΣΔ<sub>f</sub>H(reactants) = ' + sgn(B.aR) + ' − ' + par(B.aL) + ' = ' + sgn(B.ans)
    : 'Δ<sub>r</sub>H = ΣΔ<sub>c</sub>H(reactants) − ΣΔ<sub>c</sub>H(products) = ' + sgn(B.aL) + ' − ' + par(B.aR) + ' = ' + sgn(B.ans);
  put('an', 20, 518, 960, 'M', s >= 4 ? 1 : 0); els.an.style.fontSize = s === 5 ? '21px' : '24px';
  // route path
  const rt = $('route'); rt.setAttribute('d', B.isB ? `M ${P.TL[0] - 10} ${P.TL[1] - 8} L 500 102 L ${P.TR[0] + 10} ${P.TR[1] - 8}` : `M ${P.TL[0] - 10} ${P.TL[1] + 8} L 500 452 L ${P.TR[0] + 10} ${P.TR[1] + 8}`);
  rt.style.opacity = s === 4 ? 0.9 : 0; $('dot').style.opacity = s === 4 ? 1 : 0; routeT0 = performance.now();
  ['aL', 'aR'].forEach(id => $(id).setAttribute('stroke', s === 4 ? '#3B7A3A' : '#8A5A33'));
  // caption + dots
  $('cap').innerHTML = `<h2>${CAPS[s]}</h2>`;
  $('dots').innerHTML = Array.from({length: STEPS}, (_, i) => `<i class="${i === s ? 'on' : ''}"></i>`).join('');
  $('bk').disabled = s === 0; $('nx').disabled = s === STEPS - 1;
  if (instant) requestAnimationFrame(() => Object.values(els).forEach(e => e.style.transition = ''));
}

function anim(t){
  if (S === 4) {
    const rt = $('route'), L = rt.getTotalLength(), u = ((t - routeT0) / 3200) % 1;
    const p = rt.getPointAtLength(L * Math.min(1, u * 1.15));
    $('dot').setAttribute('cx', p.x); $('dot').setAttribute('cy', p.y);
  }
  requestAnimationFrame(anim);
}
requestAnimationFrame(anim);

/* ---------------- picker + controls ---------------- */
const pk = $('picker');
pk.innerHTML = `<div class="grp"><b>Formation data</b>${EX.map((e, i) => e.k === 'f' ? `<button type="button" class="chip f" id="ex${i}" data-i="${i}">${e.n}</button>` : '').join('')}</div>`
  + `<div class="grp"><b>Combustion data</b>${EX.map((e, i) => e.k === 'c' ? `<button type="button" class="chip c" id="ex${i}" data-i="${i}">${e.n}</button>` : '').join('')}</div>`
  + `<div class="grp"><b>Bond enthalpies</b>${EX.map((e, i) => e.k === 'b' ? `<button type="button" class="chip b" id="ex${i}" data-i="${i}">${e.n}</button>` : '').join('')}</div>`;
pk.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => load(+b.dataset.i)));
$('nx').addEventListener('click', () => go(S + 1)); $('bk').addEventListener('click', () => go(S - 1));
$('rp').addEventListener('click', () => { const s = S; go(Math.max(0, s - 1), true); setTimeout(() => go(s), 60); });
frame.addEventListener('click', () => go(S + 1));
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(S + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(S - 1); }
  else if (e.key === 'r' || e.key === 'R') $('rp').click();
});
const h = EX.findIndex((e, i) => location.hash === '#ex' + (i + 1));
load(h >= 0 ? h : 8);
fit();
window.__hx = {go, load, get S(){ return S; }, EX, build};
})();
</script>
