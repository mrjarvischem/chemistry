<script>const WT=({
file:"alevel-paper3-last-minute-A.html",
title:"A-level Paper 3 last-minute walkthrough A",
sub:"Practical skills: titrations, uncertainty, calorimetry, graphs and pH curves · AQA A-level Chemistry 7405/3 · 25 minutes",
tabs:[
{name:"Standard solutions and titrations",mins:5,why:"Describing how to make a standard solution, or how to carry out a titration properly, came up on Paper 3 in 2019, 2020 and 2021 and on Paper 1 in 2023. In 2021 the whole of Question 1 (20 marks) was built around a manganate(VII) titration.",
 seen:["Jun 19 (10)","2020 (6-mark)","2021 (20)","P1 Jun 23 (10)","P2 Jun 22 (12)","P3 2020 (MCQ)"],
 blocks:[
 {t:"model",q:"Describe how to make 250 cm³ of a standard solution from an accurately weighed solid. [5]",a:[
  "Weigh the solid in a weighing bottle (or boat). Tip it into a <b>beaker</b>, then <b>reweigh the bottle</b> (or wash the bottle and add the washings) so the mass transferred is known.",
  "Add distilled water (about 100 cm³) and <b>stir with a glass rod until all the solid has dissolved</b>.",
  "Transfer to a 250 cm³ <b>volumetric flask</b> using a funnel. <b>Rinse the beaker, rod and funnel</b> with distilled water and add the <b>washings</b> to the flask.",
  "Make up <b>to the mark</b> with distilled water, adding the last drops with a pipette so the <b>bottom of the meniscus is on the line</b>.",
  "<b>Stopper and invert</b> the flask several times to mix thoroughly."]},
 {t:"key",title:"Titration technique: the reason is usually the mark",items:[
  "<b>Rinse the burette</b> with the solution that will go in it. Rinsing with water only would dilute the solution, so the <b>titre would be too large</b>.",
  "<b>Rinse the pipette</b> with the solution it will measure. Water left inside would dilute it, so the titre would be too small.",
  "<b>The conical flask</b> can be rinsed with distilled water (and the sides washed down during the titration): this does not change the <b>number of moles</b> of reagent in the flask.",
  "<b>Remove the funnel</b> from the burette before titrating: drops could fall from it and change the volume. <b>Fill the jet</b> (no air bubble below the tap): otherwise the titre is too large.",
  "Read the burette at <b>eye level</b>, from the <b>bottom of the meniscus</b>, to <b>two decimal places</b> ending in 0 or 5.",
  "Add the solution <b>drop by drop near the end point</b>, swirling, with a <b>white tile</b> under the flask.",
  "Repeat until two titres are <b>concordant</b> (within 0.10 cm³). Use only the concordant titres for the <b>mean</b>.",
  "<b>Indicators:</b> use only a few drops because indicators are weak acids and would react with the alkali."],
  trap:"Including the rough titre, or a titre that is not concordant, in the mean."},
 {t:"calc",title:"Mean titre",q:"Titres: 23.45 cm³, 23.20 cm³ and 23.10 cm³. Calculate the mean titre.",
  steps:[
  {p:"Which two titres are concordant? Type their mean in cm³.",a:23.15,tol:0.001,u:" cm³",show:"23.20 and 23.10 are within 0.10 cm³. Mean = (23.20 + 23.10) ÷ 2 = 23.15 cm³"}]}],
 checks:[
 {q:"The burette is rinsed only with water before an acid is added to it. What happens to the titre?",opts:["It is larger than it should be","It is smaller than it should be","It is unchanged","It becomes zero"],a:0,why:"The acid in the burette is diluted, so more of it is needed."},
 {q:"Why does washing down the sides of the conical flask with distilled water during a titration not affect the result?",opts:["Water is neutral","It does not change the number of moles of reagent in the flask","It makes the indicator work better","The water evaporates"],a:1,why:"The moles of the reagent from the pipette are unchanged."},
 {q:"Why is a volumetric flask inverted several times after making up to the mark?",opts:["To dissolve the solid","To remove air bubbles","To make sure the solution has the same concentration throughout","To check for leaks"],a:2,why:"To mix thoroughly, so the concentration is uniform."}],
 exam:{q:"A student makes 250 cm³ of a standard solution of sodium ethanedioate and titrates 25.0 cm³ portions (with excess sulfuric acid, at 60 °C) with potassium manganate(VII) solution from a burette.<br>(a) State what should be done to the weighing boat after tipping the solid into the beaker, and why. [2]<br>(b) Give two practical steps needed before recording the initial burette reading. [2]<br>(c) State the colour change at the end point. [1]<br>(d) Suggest why the titration is not carried out with hydrochloric acid in place of sulfuric acid. [1]",
  ms:["reweigh the boat (or rinse the boat and add the washings to the beaker)","so the exact mass of solid transferred is known","remove the funnel","fill the jet / make sure there are no air bubbles below the tap","colourless to (pale) pink","chloride ions would be oxidised by manganate(VII) (so the titre would be too large)"]}},

{name:"Percentage uncertainty",mins:4,why:"A percentage uncertainty calculation was on four of the six Paper 3s from 2018 to 2023, and on Paper 1 in 2019, 2020 and 2023. It is nearly always followed by “how could it be reduced?”",
 seen:["Jun 18 (3)","Jun 19 (1)","2020 (2)","Jun 22 (3)","P1 Jun 19 (2)","P1 2020 (1)","P1 Jun 23 (1)","P2 Jun 23 (2)"],
 blocks:[
 {t:"key",title:"The rules",items:[
  "<b>% uncertainty = uncertainty ÷ measurement × 100</b>",
  "If the measurement comes from <b>two readings</b> (a burette titre, a temperature change, a mass by difference), use <b>2 × the uncertainty of one reading</b>.",
  "A burette titre: two readings plus judging the end point. If the question gives a total (for example ±0.15 cm³), just use it.",
  "A pipette or volumetric flask is <b>one</b> measurement, so use the uncertainty once.",
  "<b>Total % uncertainty</b> = add up the percentage uncertainties of each piece of apparatus.",
  "<b>To reduce % uncertainty with the same apparatus, make the measurement bigger:</b> a larger titre (more concentrated solution in the flask or less concentrated solution in the burette), a larger temperature change (more concentrated solutions or a larger mass of solid), a larger mass."],
  trap:"Suggesting “use a more accurate burette” when the question says “using the same apparatus”."},
 {t:"calc",title:"Three uncertainties",q:"Work out each percentage uncertainty.",
  steps:[
  {p:"A titre of 22.50 cm³. The total uncertainty in using the burette is ±0.15 cm³.",a:0.667,tol:0.006,u:" %",show:"0.15 ÷ 22.50 × 100 = 0.67%"},
  {p:"A temperature rise of 8.0 °C. Each thermometer reading has an uncertainty of ±0.1 °C.",a:2.5,tol:0.01,u:" %",show:"Two readings: (2 × 0.1) ÷ 8.0 × 100 = 2.5%"},
  {p:"A mass of 1.25 g found by weighing a container and then the container plus solid. Each balance reading is ±0.005 g.",a:0.8,tol:0.005,u:" %",show:"Two readings: (2 × 0.005) ÷ 1.25 × 100 = 0.80%"}]}],
 checks:[
 {q:"A 25.0 cm³ pipette has an uncertainty of ±0.05 cm³. What is the percentage uncertainty?",opts:["0.05%","0.10%","0.20%","0.40%"],a:2,why:"0.05 ÷ 25.0 × 100 = 0.20% (one measurement)."},
 {q:"A temperature change of 4.0 °C has a percentage uncertainty of 5%. How could this be reduced using the same thermometer?",opts:["Stir more slowly","Use more concentrated solutions to get a larger temperature change","Use a larger volume of water with the same amount of reactant","Use a lid"],a:1,why:"A bigger temperature change makes the same ±0.2 °C a smaller percentage."},
 {q:"Uncertainty in a balance reading is ±0.001 g. A mass of 0.146 g is recorded directly (one reading). What uncertainty does this cause in a volume calculated as 68.5 cm³?",opts:["0.001 cm³","0.47 cm³","0.68 cm³","6.85 cm³"],a:1,why:"% uncertainty = 0.001 ÷ 0.146 × 100 = 0.685%. 0.685% of 68.5 cm³ = 0.47 cm³"}],
 exam:{q:"In a titration the mean titre is 9.00 cm³. The total uncertainty in using the burette is ±0.15 cm³.<br>(a) Calculate the percentage uncertainty in the titre. [1]<br>(b) Suggest two ways the student could reduce this percentage uncertainty using the same apparatus. [2]<br>(c) The 25.0 cm³ pipette used has an uncertainty of ±0.05 cm³. Calculate the total percentage uncertainty from using the pipette and the burette. [1]",
  ms:["0.15 ÷ 9.00 × 100 = 1.7%","use a less concentrated solution in the burette (so the titre is larger)","use a larger volume / more concentrated solution in the conical flask (or a larger mass of the original solid)","0.20 + 1.67 = 1.9%"]}},

{name:"Calorimetry practical",mins:4,why:"A calorimetry practical question was on Paper 3 in 2017, 2018, 2020, 2022 and 2023, for up to 18 marks. Method, graph, calculation and improvements all come from the same short list.",
 seen:["Jun 17 (9)","Jun 18 (16)","2020 (8)","Jun 22 (18)","Jun 23 (3)","P2 2021 (7)"],
 blocks:[
 {t:"model",q:"Describe an experiment to find the enthalpy of solution of a solid, and how the results are used. [6]",a:[
  "Measure a known volume of water (for example 25.0 cm³ with a pipette) into a <b>polystyrene cup</b> (insulated, with a lid).",
  "<b>Weigh</b> the solid accurately (weigh the container before and after adding the solid).",
  "Record the temperature of the water <b>every minute for 3 minutes</b>. Add the solid at the 4th minute and <b>stir</b>.",
  "Keep recording the temperature every minute for several more minutes.",
  "Plot temperature against time. <b>Extrapolate both lines to the time of mixing</b> (4th minute) to find ΔT.",
  "q = mcΔT (m = mass of water), then ΔH = q ÷ moles of solid, with the correct sign."]},
 {t:"key",title:"Why extrapolate?",items:[
  "The reaction is not instant and <b>heat is lost (or gained) while it happens</b>, so the highest temperature you read is too low.",
  "Extrapolating the cooling line back to the time of mixing gives the temperature change there would have been <b>with no heat loss</b>.",
  "The temperature is not recorded at the minute of mixing because the mixture is still reacting and the reading would not be steady."]},
 {t:"key",title:"Errors and improvements",items:[
  "<b>Reduce heat loss:</b> polystyrene cup instead of a glass beaker, a lid, extra insulation.",
  "<b>Combustion experiments:</b> the result is less exothermic than the data book value because of heat loss, incomplete combustion and evaporation of fuel. Improve with a draught shield and a lid on the calorimeter, and stir the water.",
  "A copper calorimeter is better than a glass beaker: copper is a better conductor, and clamping it close to the flame (no tripod and gauze) loses less heat.",
  "<b>Table for a combustion experiment:</b> initial and final mass of burner (g); initial and final temperature of water (°C); mass (or volume) of water.",
  "<b>Neutralisation:</b> the enthalpy change is per mole of <b>water</b> formed. It is less exothermic for a weak acid because energy is needed to dissociate the acid.",
  "In q = mcΔT for solutions, m is the <b>total mass of solution</b> (both volumes added together, density taken as 1.00 g cm⁻³)."],
  trap:"Using the mass of the solid instead of the mass of the water (or solution) in q = mcΔT."},
 {t:"calc",title:"Enthalpy of neutralisation",q:"50.0 cm³ of 1.00 mol dm⁻³ HCl is mixed with 50.0 cm³ of 1.00 mol dm⁻³ NaOH. The temperature rises by 6.8 °C. (c = 4.18 J K⁻¹ g⁻¹, density = 1.00 g cm⁻³)",
  steps:[
  {p:"Calculate q in joules. Remember the total volume.",a:2842,tol:15,u:" J",show:"100 × 4.18 × 6.8 = 2842 J"},
  {p:"How many moles of water are formed?",a:0.05,tol:0.0003,u:" mol",show:"0.0500 × 1.00 = 0.0500 mol"},
  {p:"Calculate the enthalpy of neutralisation in kJ mol⁻¹. Include the sign.",a:-56.8,tol:0.4,u:" kJ mol⁻¹",show:"2842 ÷ 0.0500 = 56 840 J mol⁻¹, so ΔH = −56.8 kJ mol⁻¹"}]}],
 checks:[
 {q:"Why is the temperature recorded for several minutes before the reagents are mixed?",opts:["To let the thermometer warm up","To check the starting temperature is steady, so it can be extrapolated","To let the solid dissolve","To allow heat loss"],a:1,why:"It gives a reliable baseline to extrapolate to the time of mixing."},
 {q:"A student measures an enthalpy of solution as +15 kJ mol⁻¹. The true value is +26 kJ mol⁻¹. What is the most likely reason?",opts:["Heat was gained from the surroundings","Too much water was used","The balance was wrong","The solid was impure"],a:0,why:"The process is endothermic, so the mixture gained heat from the surroundings and the temperature fall measured was too small."},
 {q:"Which change would make an enthalpy of combustion experiment more accurate?",opts:["Use a glass beaker on a tripod","Move the burner further from the calorimeter","Add a draught shield and a lid","Use less water"],a:2,why:"Both reduce heat loss to the surroundings."}],
 exam:{q:"A student adds 3.20 g of NH₄NO₃ (M<sub>r</sub> = 80.0) to 25.0 cm³ of water in a beaker. The temperature falls from 21.5 °C to 15.1 °C.<br>(a) Calculate the enthalpy of solution in kJ mol⁻¹. (c = 4.18 J K⁻¹ g⁻¹; assume the density of the solution is 1.00 g cm⁻³) [3]<br>(b) Each temperature reading has an uncertainty of ±0.1 °C. Calculate the percentage uncertainty in the temperature change. [1]<br>(c) Suggest one change to the apparatus that would give a more accurate value, and explain why. [2]",
  ms:["q = 25.0 × 4.18 × 6.4 = 669 J","mol NH₄NO₃ = 3.20 ÷ 80.0 = 0.0400","ΔH = +16.7 kJ mol⁻¹ (positive sign needed)","(2 × 0.1) ÷ 6.4 × 100 = 3.1%","use a polystyrene cup (instead of the beaker) / add a lid / insulate","to reduce heat gained from the surroundings"]}},

{name:"Graph skills",mins:4,why:"Five of the seven Paper 3s from 2017 to 2023 had a graph to plot or a gradient to calculate, worth 5 marks or more. The chemistry changes (ΔG, Arrhenius, cells, rates) but the graph marks are the same.",
 seen:["Jun 17 (5)","Jun 18 (9)","Jun 19 (6)","2020 (5)","Jun 22 (6)","P2 Jun 18 (6)","P2 2021 (6)"],
 blocks:[
 {t:"key",title:"Plotting marks",items:[
  "Choose scales so the points fill <b>more than half the grid</b> in both directions. Use sensible scales (1, 2 or 5 per square), not 3s or 7s. The axis does not have to start at zero.",
  "Plot points <b>accurately</b> (within half a small square) with small crosses.",
  "Draw a <b>line of best fit</b>: a single straight line with a ruler or one smooth curve. <b>Ignore anomalous points</b>.",
  "Label the axes with the <b>quantity and units</b>."]},
 {t:"key",title:"Gradient marks",items:[
  "Use two points <b>on the line</b> (not data points) that are <b>far apart</b>. Draw the triangle on the graph.",
  "<b>Gradient = change in y ÷ change in x</b>. Keep the signs.",
  "Match the equation to <b>y = mx + c</b> to see what the gradient means.",
  "<b>ΔG = −ΔS × T + ΔH</b>: plot ΔG against T. Gradient = −ΔS, intercept = ΔH.",
  "<b>ln k = (−E<sub>a</sub>/R) × (1/T) + ln A</b>: plot ln k against 1/T. Gradient = −E<sub>a</sub>/R.",
  "<b>Tangent to a curve</b> at a point gives the rate at that time. The tangent just touches the curve.",
  "<b>Zero order:</b> concentration–time graph is a straight line, and the gradient is −k. <b>First order:</b> rate–concentration graph is a straight line through the origin."],
  trap:"Reading the 1/T axis as 3.2 when it is 3.2 × 10⁻³, which makes the gradient 1000 times too small."},
 {t:"calc",title:"ΔS from a ΔG against T graph",q:"A straight-line graph of ΔG (kJ mol⁻¹) against T (K) passes through (250, −120.0) and (400, −96.0).",
  steps:[
  {p:"Calculate the gradient in kJ K⁻¹ mol⁻¹.",a:0.16,tol:0.002,show:"(−96.0 − −120.0) ÷ (400 − 250) = 24.0 ÷ 150 = +0.160 kJ K⁻¹ mol⁻¹"},
  {p:"Calculate ΔS in J K⁻¹ mol⁻¹. Include the sign.",a:-160,tol:2,u:" J K⁻¹ mol⁻¹",show:"Gradient = −ΔS, so ΔS = −0.160 kJ K⁻¹ mol⁻¹ = −160 J K⁻¹ mol⁻¹"},
  {p:"Use ΔG = ΔH − TΔS at 250 K to find ΔH in kJ mol⁻¹.",a:-160,tol:1,u:" kJ mol⁻¹",show:"ΔH = ΔG + TΔS = −120.0 + (250 × −0.160) = −160 kJ mol⁻¹ (the intercept at T = 0)"}]}],
 checks:[
 {q:"A graph of [H⁺] against time is a straight line with a negative gradient. What is the order of reaction with respect to H⁺?",opts:["0","1","2","Cannot tell"],a:0,why:"Constant gradient = constant rate, so the rate does not depend on [H⁺]."},
 {q:"Which pair of points gives the most accurate gradient?",opts:["Two data points close together","Two points on the line, far apart","The first and last data points, whether or not they are on the line","Any two points"],a:1,why:"A big triangle on the line of best fit reduces the percentage error in reading the scales."},
 {q:"A rate–concentration graph is a straight line through the origin. What is the order?",opts:["0","1","2","3"],a:1,why:"Rate is directly proportional to concentration."}],
 exam:{q:"The rate constant k of a reaction is measured at several temperatures. A graph of ln k against 1/T is a straight line passing through (3.10 × 10⁻³ K⁻¹, −13.6) and (3.40 × 10⁻³ K⁻¹, −17.6).<br>(a) Calculate the gradient of the line. [2]<br>(b) Use the gradient to calculate the activation energy in kJ mol⁻¹. (R = 8.31 J K⁻¹ mol⁻¹) [2]<br>(c) One data point lies well away from the line. State what should be done with this point when drawing the line of best fit. [1]",
  ms:["(−17.6 − −13.6) ÷ (3.40 × 10⁻³ − 3.10 × 10⁻³)","= −13 300 K (−1.33 × 10⁴)","E<sub>a</sub> = 13 300 × 8.31 = 111 000 J mol⁻¹","= 111 kJ mol⁻¹","ignore it (treat it as anomalous)"]}},

{name:"pH curves and indicators",mins:4,why:"pH curves and choosing an indicator came up on Paper 3 in 2017 (9 marks), on Paper 1 in 2019, 2021 and 2023, and in most multiple-choice sections.",
 seen:["Jun 17 (9)","P1 Jun 19 (4)","P1 2021 (4)","P1 Jun 23 (3)","P3 Jun 18 (MCQ)","P3 2020 (MCQ)"],
 blocks:[
 {t:"tbl",title:"The four curves (alkali added to acid)",head:["Acid + base","Starts at about","Vertical section","pH at equivalence","Indicator"],rows:[
  ["strong + strong","pH 1","3 to 11","7","any (methyl orange or phenolphthalein)"],
  ["weak acid + strong base","pH 3","7 to 11","above 7","phenolphthalein (8.3–10)"],
  ["strong acid + weak base","pH 1","3 to 7","below 7","methyl orange (3.1–4.4)"],
  ["weak + weak","pH 3","no sharp vertical section","about 7","none: use a pH meter"]]},
 {t:"key",title:"What to say",items:[
  "An indicator is suitable if its <b>pH range lies completely within the vertical section</b> of the curve, so it changes colour with one drop at the equivalence point.",
  "<b>Weak acid with weak base:</b> there is no sharp change in pH at the equivalence point, so no indicator changes colour quickly enough.",
  "<b>Half-neutralisation point</b> (half the equivalence volume): [HA] = [A⁻], so <b>pH = pKa</b> and Ka = 10<sup>−pH</sup>.",
  "The flat region around half-neutralisation is the <b>buffer region</b>: the mixture contains both HA and A⁻.",
  "<b>Concentration from the curve:</b> moles of alkali at the equivalence point = moles of monoprotic acid.",
  "<b>Practical:</b> calibrate the pH meter with buffer solutions of known pH. Rinse the probe with distilled water between readings. Add the alkali in <b>smaller volumes near the equivalence point</b> because the pH changes rapidly there."],
  trap:"Choosing an indicator because its range “includes 7”. It is the vertical section of the curve that matters."},
 {t:"calc",title:"Ka from a pH curve",q:"25.0 cm³ of a weak acid HX needs 24.0 cm³ of 0.100 mol dm⁻³ NaOH to reach the equivalence point. The pH is 4.87 when 12.0 cm³ of NaOH has been added. <br><small>Type standard form like this: 1.3e-5</small>",
  steps:[
  {p:"Calculate the concentration of HX in mol dm⁻³.",a:0.096,tol:0.0006,u:" mol dm⁻³",show:"mol NaOH = 2.40 × 10⁻³ = mol HX.   2.40 × 10⁻³ ÷ 0.0250 = 0.0960 mol dm⁻³"},
  {p:"12.0 cm³ is half-neutralisation, so pH = pKa. Calculate Ka.",a:1.35e-5,tol:1e-7,u:" mol dm⁻³",show:"Ka = 10⁻⁴·⁸⁷ = 1.35 × 10⁻⁵ mol dm⁻³"}]}],
 checks:[
 {q:"Which indicator is suitable for titrating methylamine solution with hydrochloric acid?",opts:["Thymol blue (1.2–2.8)","Bromophenol blue (3.0–4.6)","Phenol red (6.8–8.4)","Phenolphthalein (8.3–10.0)"],a:1,why:"Weak base with strong acid: the vertical section is about pH 3 to 7."},
 {q:"Which acid–base pair has the highest pH at the equivalence point?",opts:["HCl and NaOH","HCl and NH₃","CH₃COOH and NaOH","CH₃COOH and NH₃"],a:2,why:"Weak acid with strong base: the salt solution is alkaline."},
 {q:"On a weak acid–strong base curve, where is the solution acting as a buffer?",opts:["At the start, before any alkali is added","Around half-neutralisation","At the equivalence point","Well after the equivalence point"],a:1,why:"Both HA and A⁻ are present in similar amounts."}],
 exam:{q:"Sodium hydroxide solution is added from a burette to 25 cm³ of ethanoic acid and the pH is measured with a pH meter.<br>(a) Explain why the sodium hydroxide is added in smaller volumes near the equivalence point. [1]<br>(b) Suggest why the pH probe is washed with distilled water between calibration readings. [1]<br>(c) State, with a reason, whether methyl orange (pH range 3.1–4.4) is a suitable indicator for this titration. [2]<br>(d) Explain why this titration could not be done with an indicator if aqueous ammonia were used instead of sodium hydroxide. [2]",
  ms:["the pH changes rapidly there (so the equivalence point can be found accurately)","to avoid contaminating the next solution / to remove the previous solution, which would change the pH","not suitable","its range is not within the vertical section of the curve (about pH 7 to 11) / it would change colour before the equivalence point","weak acid with weak base: there is no sharp (vertical) change in pH at the equivalence point","so the indicator would change colour gradually over a large volume"]}}
],
quiz:[
{q:"Which piece of apparatus is used to make up a standard solution to exactly 250 cm³?",opts:["Measuring cylinder","Beaker","Volumetric flask","Burette"],a:2,why:"A volumetric flask has a single, accurate graduation mark."},
{q:"Titres: 24.60, 24.10, 24.05 and 24.15 cm³. What is the mean titre?",opts:["24.23 cm³","24.10 cm³","24.08 cm³","24.15 cm³"],a:1,why:"Leave out 24.60. (24.10 + 24.05 + 24.15) ÷ 3 = 24.10 cm³"},
{q:"A burette reading has an uncertainty of ±0.05 cm³. What is the percentage uncertainty in a titre of 20.00 cm³ (two readings)?",opts:["0.25%","0.50%","1.00%","0.05%"],a:1,why:"(2 × 0.05) ÷ 20.00 × 100 = 0.50%"},
{q:"In a calorimetry experiment, why are the lines extrapolated to the time of mixing?",opts:["To find the average temperature","To allow for heat lost to the surroundings","To make the graph neater","To find the rate of reaction"],a:1,why:"It gives the temperature change that would have happened with no heat loss."},
{q:"What does the gradient of a graph of ΔG against T equal?",opts:["ΔH","ΔS","−ΔS","−ΔH"],a:2,why:"ΔG = −ΔS × T + ΔH"},
{q:"At the half-neutralisation point of a weak acid, the pH equals…",opts:["7","pKa","Ka","half the final pH"],a:1,why:"[HA] = [A⁻], so [H⁺] = Ka."},
{q:"Which indicator suits a titration of ethanoic acid with sodium hydroxide?",opts:["Methyl orange (3.1–4.4)","Bromophenol blue (3.0–4.6)","Phenolphthalein (8.3–10.0)","None"],a:2,why:"The vertical section is from about pH 7 to 11."},
{q:"Why is a polystyrene cup used instead of a glass beaker in calorimetry?",opts:["It is cheaper","It is a better insulator, so less heat is lost","It does not break","It holds more solution"],a:1,why:"Less heat exchange with the surroundings."}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
