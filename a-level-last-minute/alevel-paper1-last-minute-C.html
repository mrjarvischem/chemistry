{name:"Complexes: shape, isomerism and colour",mins:4,why:"Shapes of complexes, isomerism and why complexes are coloured were on five of the seven Paper 1s, including a 6-mark question in 2019.",

 blocks:[
 {t:"key",title:"Words and shapes",items:[
  "<b>Ligand:</b> a molecule or ion that donates a lone pair of electrons to form a co-ordinate bond with a metal ion. <b>Complex:</b> a central metal atom or ion surrounded by ligands. <b>Co-ordination number:</b> the number of co-ordinate bonds to the metal.",
  "<b>Octahedral</b> (90°): six small ligands such as H₂O or NH₃. <b>Tetrahedral</b> (109.5°): four large Cl⁻ ligands, such as [CuCl₄]²⁻ and [CoCl₄]²⁻. <b>Square planar:</b> platinum complexes such as cisplatin. <b>Linear:</b> [Ag(NH₃)₂]⁺",
  "<b>Ligand substitution with Cl⁻:</b> [Cu(H₂O)₆]²⁺ + 4Cl⁻ → [CuCl₄]²⁻ + 6H₂O (blue → yellow-green). Co-ordination number changes from 6 to 4 because Cl⁻ is larger.",
  "<b>Bidentate</b> ligands form two co-ordinate bonds: H₂NCH₂CH₂NH₂ and C₂O₄²⁻. <b>EDTA⁴⁻</b> is multidentate (six).",
  "<b>Chelate effect:</b> [Cu(H₂O)₆]²⁺ + EDTA⁴⁻ → [Cu(EDTA)]²⁻ + 6H₂O. 2 particles → 7 particles, so ΔS is positive. ΔH is about zero (same number and type of bonds broken and made), so ΔG is negative.",
  "<b>Cis–trans isomerism:</b> octahedral [M(NH₃)₄Cl₂]⁺ and square planar [Pt(NH₃)₂Cl₂]. <b>Optical isomerism:</b> octahedral complexes with three bidentate ligands, such as [Co(H₂NCH₂CH₂NH₂)₃]²⁺"]},

 {q:"Why is the enthalpy change close to zero when [Co(NH₃)₆]²⁺ reacts with H₂NCH₂CH₂NH₂ to form [Co(H₂NCH₂CH₂NH₂)₃]²⁺?",opts:["No bonds are broken","The same number of Co–N bonds are broken and made","The reaction is very slow","The entropy change is zero"],a:1,why:"Six Co–N bonds broken and six Co–N bonds made. The reaction happens because ΔS is positive (4 particles → 7)."}],
 exam:{q:"(a) Concentrated hydrochloric acid is added to a solution containing [Co(H₂O)₆]²⁺ ions. Give an equation for the reaction, state the colour change and name the shape of the complex formed. [4]<br>(b) The complex [Cr(NH₃)₄Cl₂]⁺ exists as two isomers. State the type of isomerism and describe how the two isomers differ. [2]<br>(c) State three ways of changing a complex so that its colour changes. [3]",
  ms:["[Co(H₂O)₆]²⁺ + 4Cl⁻ → [CoCl₄]²⁻ + 6H₂O","pink (solution)","to blue (solution)","tetrahedral","cis–trans (E–Z / geometric) isomerism","in one isomer the two Cl⁻ ligands are next to each other (90°, cis); in the other they are opposite (180°, trans)","change the oxidation state of the metal","change the ligand","change the co-ordination number"]}},

{name:"Catalysts",mins:4,why:"Catalysis is the topic most often used for a long answer in inorganic chemistry: a 6-mark question in 2021 and on Paper 3 in 2022, plus shorter questions in 2018 and on Paper 3 in 2020.",
 seen:["Jun 18 (4)","2021 (11)","P3 2020 (4)","P3 Jun 22 (11)","P3 Jun 17 (MCQ)","P3 Jun 23 (MCQ)"],
 blocks:[
 {t:"key",title:"Heterogeneous catalysts (different phase from the reactants)",items:[
  "<b>How they work:</b> reactants are <b>adsorbed</b> onto active sites on the surface → bonds are weakened and the <b>reaction</b> takes place on the surface → products are <b>desorbed</b>.",
  "<b>Haber process:</b> iron. <b>Contact process:</b> V₂O₅, which works by changing oxidation state:<br>V₂O₅ + SO₂ → V₂O₄ + SO₃   then   V₂O₄ + ½O₂ → V₂O₅",
  "<b>Efficiency:</b> use a large surface area, for example a thin layer on a ceramic support (honeycomb), which also cuts cost.",
  "<b>Poisoning:</b> impurities (such as sulfur in the Haber process, lead in catalytic converters) bind strongly to the active sites and block them. The catalyst becomes less efficient and has to be replaced, which costs money."]},
 {t:"key",title:"Homogeneous catalysts (same phase)",items:[
  "They work through an <b>intermediate species</b>, with the metal changing oxidation state.",
  "<b>S₂O₈²⁻ + 2I⁻ → 2SO₄²⁻ + I₂</b> is slow because both ions are <b>negative, so they repel</b> (high activation energy).",
  "Fe²⁺ catalyst:   <b>S₂O₈²⁻ + 2Fe²⁺ → 2SO₄²⁻ + 2Fe³⁺</b>   then   <b>2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂</b>   Each step has oppositely charged ions, which attract. (Fe³⁺ also works: the steps happen in the other order.)",
  "A metal ion can only catalyse this if its E° lies between the two values (+0.54 V and +2.01 V). Zn²⁺ cannot because zinc has only one oxidation state in its compounds.",
  "<b>Autocatalysis:</b> a product of the reaction is the catalyst. In 2MnO₄⁻ + 16H⁺ + 5C₂O₄²⁻ → 2Mn²⁺ + 8H₂O + 10CO₂ the reaction starts slowly (two negative ions repel), then speeds up as <b>Mn²⁺</b> forms:<br>4Mn²⁺ + MnO₄⁻ + 8H⁺ → 5Mn³⁺ + 4H₂O   then   2Mn³⁺ + C₂O₄²⁻ → 2Mn²⁺ + 2CO₂"],
  trap:"Writing “absorbed” for a surface catalyst. The word is adsorbed."},
 {t:"model",q:"Describe the stages by which a heterogeneous catalyst provides an alternative route with a lower activation energy. [3]",a:[
  "Reactant molecules are <b>adsorbed</b> onto the surface (at active sites).",
  "Bonds in the reactants are weakened and the <b>reaction takes place on the surface</b>.",
  "The products are <b>desorbed</b> from the surface."]}],
 checks:[
 {q:"Why is the uncatalysed reaction between S₂O₈²⁻ and I⁻ slow?",opts:["Both ions are negative, so they repel","Both ions are large","The reaction is endothermic","Iodide is a weak reducing agent"],a:0,why:"Repulsion between two negative ions gives a high activation energy."},
 {q:"Which species is the autocatalyst in the reaction between manganate(VII) ions and ethanedioate ions?",opts:["MnO₄⁻","H⁺","Mn²⁺","CO₂"],a:2,why:"Mn²⁺ is a product, and it catalyses the reaction."},
 {q:"Which process does not use a heterogeneous catalyst?",opts:["Haber process","Contact process","Catalytic cracking","Decomposition of ozone by chlorine atoms"],a:3,why:"Chlorine atoms and ozone are both gases: homogeneous."}],
 exam:{q:"(a) State the meaning of the term heterogeneous catalyst. [2]<br>(b) Give two equations to show how V₂O₅ acts as a catalyst in the Contact process. [2]<br>(c) Explain how Fe²⁺ ions catalyse the reaction between S₂O₈²⁻ ions and I⁻ ions. Include equations. [4]",
  ms:["in a different phase / state from the reactants","speeds up the reaction without being used up (by providing a route with lower activation energy)","V₂O₅ + SO₂ → V₂O₄ + SO₃","V₂O₄ + ½O₂ → V₂O₅","the uncatalysed reaction is slow because both ions are negative and repel","S₂O₈²⁻ + 2Fe²⁺ → 2SO₄²⁻ + 2Fe³⁺","2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂","each step involves oppositely charged ions (which attract), so the activation energy is lower / Fe²⁺ is regenerated"]}}
],
quiz:[

<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
