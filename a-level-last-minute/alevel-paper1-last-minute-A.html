<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-level Paper 1 last-minute walkthrough A</title>
<style>
:root{--cream:#fbf5e9;--card:#fffdf7;--brown:#5b3a1e;--mid:#8a5a2b;--line:#e2d3b8;--tan:#f1e4cb;--ink:#2e2218;--good:#2f7d4f;--goodbg:#e3f3e8;--bad:#b3402e;--badbg:#fbe6e1;--gold:#c98a1b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
header h1{font-size:1.15rem;margin:0}header small{display:block;opacity:.85;font-weight:400;font-size:.85rem}
#timer{display:flex;align-items:center;gap:8px}#clock{font:700 1.3rem ui-monospace,Consolas,monospace;background:#3d2612;padding:4px 10px;border-radius:6px;min-width:84px;text-align:center}
#clock.over{background:var(--bad)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--mid);background:var(--tan);color:var(--brown);padding:6px 12px}
button:hover{background:#e9d6b1}header button{background:#fff;border-color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--tan);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;background:var(--card)}nav button.on{background:var(--brown);color:#fff;border-color:var(--brown)}nav button.done::after{content:" ✓";color:var(--good)}nav button.on.done::after{color:#bfe8cd}
main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
h2{color:var(--brown);margin:.2em 0 .3em;font-size:1.45rem}h3{color:var(--brown);margin:0 0 .4em;font-size:1.08rem}
.why{color:var(--mid);margin:0 0 6px}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.pill{background:var(--tan);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--brown)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.key{border-left:6px solid var(--gold)}.key ul,.card ul{margin:.2em 0;padding-left:1.2em}.key li{margin:.25em 0}
.trap{background:#fff3d6;border:1px solid #edd08f;border-radius:8px;padding:8px 12px;margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--tan);color:var(--brown)}
.opts{display:grid;gap:8px;margin:8px 0}.opts button{text-align:left;background:#fff;color:var(--ink);border-color:var(--line);padding:9px 12px}
.opts button.right{background:var(--goodbg);border-color:var(--good)}.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:.95rem;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--tan)}
.step{display:none;border-top:1px dashed var(--line);padding:10px 0}.step.show{display:block}.step:first-of-type{border-top:0}
.step input{font:inherit;width:120px;padding:5px 8px;border:1px solid var(--mid);border-radius:6px;margin-right:6px}
.step.ok input{background:var(--goodbg);border-color:var(--good)}.step.no input{background:var(--badbg);border-color:var(--bad)}
.work{display:none;color:var(--good);margin:6px 0 0;font-weight:600}.step.ok .work,.step.told .work{display:block}.step.told .work{color:var(--mid)}
.mp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}.mp input{width:20px;height:20px;margin-top:3px;flex:none}
.hid{display:none}.tag{display:inline-block;background:var(--brown);color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:6px}
.reveal li{color:transparent;background:var(--tan);border-radius:6px;margin:5px 0;padding:2px 6px;cursor:pointer;user-select:none}.reveal li.on{color:inherit;background:none;cursor:default}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.big{font-size:1.05rem;padding:10px 18px;background:var(--brown);color:#fff;border-color:var(--brown)}.big:hover{background:#3d2612}
.score{font-size:1.6rem;font-weight:700;color:var(--brown)}svg{max-width:100%;height:auto;display:block;margin:6px auto}
svg.mol{width:100%;height:auto;display:block;margin:0 auto}svg.mol .bd{stroke:#3b2a1a;stroke-width:2.2;stroke-linecap:round}svg.mol text{font-family:"Segoe UI",Arial,sans-serif}.eq{font-weight:600}.card{overflow-x:auto}@media(max-width:560px){table{font-size:.8rem}th,td{padding:4px 5px}}
@media print{nav,#timer,.next{display:none}}

<script>const WT=({
file:"alevel-paper1-last-minute-A.html",
title:"A-level Paper 1 last-minute walkthrough A",
sub:"The big calculations: mass spec, Kp, pH and buffers · AQA A-level Chemistry 7405/1 · 25 minutes",
tabs:[
{name:"Time of flight calculation",mins:4,why:"A time of flight calculation was on six of the seven Paper 1s from 2017 to 2023, usually for 5 marks. The method is the same every time.",
 seen:["Jun 17","Jun 18 (5)","Jun 19 (5)","2020 (5)","Jun 22 (5)","Jun 23 (5)"],
 blocks:[
 {t:"key",title:"The method in four lines",items:[
  "<b>Mass of one ion in kg</b> = (mass number × 10⁻³) ÷ 6.022 × 10²³. The × 10⁻³ turns grams into kilograms.",
  "<b>KE = ½mv²</b>, so v = √(2KE ÷ m).",
  "<b>v = d ÷ t</b>, so t = d ÷ v and d = v × t.",
  "Working backwards to a mass number: m = 2KE × t² ÷ d², then mass number = m × 6.022 × 10²³ × 1000.",
  "All ions are given the <b>same kinetic energy</b>, so lighter ions travel faster and reach the detector first.",
  "<b>Electron impact:</b> a high-energy electron knocks an electron off each atom. X(g) → X⁺(g) + e⁻. <b>Electrospray:</b> the sample is dissolved, injected through a needle at high voltage, and each molecule gains a proton. X(g) + H⁺ → XH⁺(g)",
  "<b>Detection:</b> each ion hits the negative plate and gains an electron. The size of the current is proportional to the abundance."],
  trap:"Forgetting to convert the mass to kg (÷ 1000), and forgetting that an electrospray peak is at Mr + 1."},
 {t:"calc",title:"Time of flight",q:"A ⁶³Cu⁺ ion has a kinetic energy of 2.50 × 10⁻¹⁶ J and travels along a flight tube of length 1.20 m. Calculate the time of flight. (L = 6.022 × 10²³ mol⁻¹) <br><small>Type standard form like this: 1.05e-25</small>",
  steps:[
  {p:"Calculate the mass of one ⁶³Cu⁺ ion in kg.",a:1.046e-25,u:" kg",show:"63 × 10⁻³ ÷ 6.022 × 10²³ = 1.046 × 10⁻²⁵ kg"},
  {p:"Use v = √(2KE ÷ m) to find the speed in m s⁻¹.",a:69133,u:" m s⁻¹",show:"√(2 × 2.50 × 10⁻¹⁶ ÷ 1.046 × 10⁻²⁵) = 6.91 × 10⁴ m s⁻¹"},
  {p:"Use t = d ÷ v to find the time in s.",a:1.736e-5,u:" s",show:"1.20 ÷ 6.91 × 10⁴ = 1.74 × 10⁻⁵ s"}]}],
 checks:[
 {q:"A sample contains ²⁴Mg⁺, ²⁵Mg⁺ and ²⁶Mg⁺ ions, all with the same kinetic energy. Which reaches the detector first?",opts:["²⁴Mg⁺","²⁵Mg⁺","²⁶Mg⁺","They arrive together"],a:0,why:"Same kinetic energy, so the lightest ion has the greatest speed."},
 {q:"A compound is ionised by electrospray ionisation. Its spectrum has a peak at m/z = 147. What is its Mr?",opts:["145","146","147","148"],a:1,why:"Each molecule gains H⁺, so the peak is at Mr + 1. Mr = 146."},
 {q:"Why must the sample be ionised before it enters the flight tube?",opts:["So the atoms can be vaporised","So the ions can be accelerated by an electric field and detected","So the isotopes have different masses","So the atoms lose all their electrons"],a:1,why:"Only charged particles are accelerated by the electric field and produce a current at the detector."}],
 exam:{q:"An ion X⁺ has a kinetic energy of 4.00 × 10⁻¹⁶ J. It takes 1.254 × 10⁻⁵ s to travel along a flight tube of length 0.950 m.<br>(a) Calculate the mass number of X. (L = 6.022 × 10²³ mol⁻¹) [4]<br>(b) State how the ions are detected and how their relative abundance is found. [2]",
  ms:["v = d ÷ t = 0.950 ÷ 1.254 × 10⁻⁵ = 7.576 × 10⁴ m s⁻¹","m = 2KE ÷ v² = 1.394 × 10⁻²⁵ kg","mass of 1 mol = 1.394 × 10⁻²⁵ × 6.022 × 10²³ = 0.0839 kg (= 83.9 g)","mass number = 84","each ion gains an electron at the (negative) detector plate","the (size of the) current is proportional to the abundance"]}},

{name:"Isotopes and abundance",mins:4,why:"An isotope abundance calculation has come up on five of the last six Paper 1s. The definition of relative atomic mass is asked almost as often.",
 seen:["Jun 18 (4)","2020 (6)","2021 (3)","Jun 22 (4)","Jun 23 (3)"],
 blocks:[
 {t:"key",title:"Learn these word for word",items:[
  "<b>Relative atomic mass:</b> the average mass of one atom of an element, compared with 1/12 of the mass of one atom of carbon-12.",
  "<b>Isotopes</b> have the same number of protons but different numbers of neutrons.",
  "Isotopes have the <b>same chemical properties</b> because they have the same electron configuration.",
  "A<sub>r</sub> = sum of (isotope mass × abundance) ÷ total abundance.",
  "<b>Two unknown abundances:</b> call one x and the other (what is left − x). Expand the brackets and solve.",
  "<b>Abundances in a ratio</b> (for example 1 : 2): call them x and 2x."],
  trap:"In the definition, missing out “average” or missing out “1/12”. Each is worth a mark."},
 {t:"calc",title:"Two missing abundances",q:"A sample of magnesium has A<sub>r</sub> = 24.32. It contains ²⁴Mg, ²⁵Mg and ²⁶Mg. The abundance of ²⁴Mg is 79.0%. Find the abundance of ²⁵Mg.",
  steps:[
  {p:"What percentage is left for ²⁵Mg and ²⁶Mg together?",a:21,tol:0,u:" %",show:"100 − 79.0 = 21.0%. Let ²⁵Mg = x and ²⁶Mg = (21 − x)."},
  {p:"(24 × 79) + 25x + 26(21 − x) = 24.32 × 100. Work out the number on the right-hand side.",a:2432,tol:0,show:"24.32 × 100 = 2432"},
  {p:"Expand the left: 1896 + 25x + 546 − 26x = 2432, so 2442 − x = 2432. What is x?",a:10,tol:0.01,u:" %",show:"x = 2442 − 2432 = 10.0%  (so ²⁶Mg = 11.0%)"}]}],
 checks:[
 {q:"Chlorine is 75% ³⁵Cl and 25% ³⁷Cl. What is its relative atomic mass?",opts:["35.5","36.0","36.5","35.0"],a:0,why:"(35 × 75 + 37 × 25) ÷ 100 = 35.5"},
 {q:"How many neutrons and electrons are in one ⁴⁹Ti²⁺ ion? (Ti has atomic number 22)",opts:["27 neutrons, 22 electrons","27 neutrons, 20 electrons","49 neutrons, 20 electrons","27 neutrons, 24 electrons"],a:1,why:"49 − 22 = 27 neutrons. A 2+ ion has lost two electrons: 22 − 2 = 20."},
 {q:"An element has two isotopes with relative abundances 10 and 17. To find A<sub>r</sub> you divide the total mass by…",opts:["100","2","27","17"],a:2,why:"Divide by the total abundance, 10 + 17 = 27. It is only 100 when the abundances are percentages."}],
 exam:{q:"A sample of silicon has A<sub>r</sub> = 28.12 and contains only ²⁸Si, ²⁹Si and ³⁰Si. The abundances of ²⁹Si and ³⁰Si are equal.<br>(a) Define relative atomic mass. [2]<br>(b) Calculate the percentage abundance of ²⁸Si. [3]",
  ms:["average mass of one atom (of an element)","compared with 1/12 of the mass of one atom of ¹²C","let ²⁹Si = ³⁰Si = x, so ²⁸Si = 100 − 2x","28(100 − 2x) + 29x + 30x = 2812, so 2800 + 3x = 2812","x = 4.0, so ²⁸Si = 92.0%"]}},

{name:"Kp calculations",mins:5,why:"Kp was on every Paper 1 from 2017 to 2023, for 8 to 12 marks. It is always the same chain: moles → mole fractions → partial pressures → Kp.",
 seen:["Jun 17 (8)","Jun 18 (9)","Jun 19 (10)","2020 (11)","2021 (11)","Jun 22 (12)","Jun 23 (11)"],
 blocks:[
 {t:"key",title:"The chain",items:[
  "<b>Equilibrium moles:</b> use the equation ratio to find how much has reacted (start − change).",
  "<b>Mole fraction</b> = moles of that gas ÷ total moles of gas.",
  "<b>Partial pressure</b> = mole fraction × total pressure.",
  "<b>Kp</b> = partial pressures of products ÷ partial pressures of reactants, each raised to the power of its number in the equation. Use p(X) or (pX). <b>No square brackets.</b>",
  "<b>Units:</b> cancel the pressure units. If the powers top and bottom are equal there are no units.",
  "If the equation is reversed, Kp becomes 1 ÷ Kp. If the equation is halved, take the square root."],
  trap:"Square brackets in a Kp expression lose the mark. Square brackets mean concentration."},
 {t:"calc",title:"Moles to Kp",q:"PCl₅(g) ⇌ PCl₃(g) + Cl₂(g)<br>0.500 mol of PCl₅ is heated in a sealed container. At equilibrium there is 0.200 mol of Cl₂ and the total pressure is 140 kPa.",
  steps:[
  {p:"How many moles of PCl₅ are left at equilibrium?",a:0.3,tol:0.001,u:" mol",show:"0.200 mol reacted (1 : 1), so 0.500 − 0.200 = 0.300 mol"},
  {p:"What is the total number of moles of gas at equilibrium?",a:0.7,tol:0.001,u:" mol",show:"0.300 + 0.200 + 0.200 = 0.700 mol"},
  {p:"Calculate the partial pressure of PCl₅ in kPa.",a:60,tol:0.3,u:" kPa",show:"(0.300 ÷ 0.700) × 140 = 60.0 kPa. PCl₃ and Cl₂ are each (0.200 ÷ 0.700) × 140 = 40.0 kPa"},
  {p:"Kp = p(PCl₃) × p(Cl₂) ÷ p(PCl₅). Calculate Kp.",a:26.67,u:" kPa",show:"40.0 × 40.0 ÷ 60.0 = 26.7 kPa"}]},
 {t:"tbl",title:"What changes Kp?",head:["Change","Position of equilibrium","Value of Kp"],rows:[
  ["Increase pressure","Moves to the side with fewer moles of gas","<b>No change</b>"],
  ["Add more of a reactant","Moves to the right","<b>No change</b>"],
  ["Add a catalyst","No change (both rates increase equally)","<b>No change</b>"],
  ["Increase temperature","Moves in the endothermic direction","Increases if forward is endothermic; decreases if forward is exothermic"]]}],
 checks:[
 {q:"N₂(g) + 3H₂(g) ⇌ 2NH₃(g). Pressures are in kPa. What are the units of Kp?",opts:["kPa²","kPa⁻²","kPa⁻¹","no units"],a:1,why:"kPa² ÷ (kPa × kPa³) = kPa⁻²"},
 {q:"For 2SO₂(g) + O₂(g) ⇌ 2SO₃(g), Kp = 4.0 kPa⁻¹. What is Kp for 2SO₃(g) ⇌ 2SO₂(g) + O₂(g) at the same temperature?",opts:["4.0 kPa","−4.0 kPa","0.25 kPa","2.0 kPa"],a:2,why:"Reverse the equation: Kp = 1 ÷ 4.0 = 0.25, and the units flip to kPa."},
 {q:"The pressure of an equilibrium mixture is increased at constant temperature. What happens to Kp?",opts:["It increases","It decreases","It stays the same","It depends on the number of moles"],a:2,why:"Only temperature changes the value of Kp."}],
 exam:{q:"2NO(g) + O₂(g) ⇌ 2NO₂(g)   ΔH = −115 kJ mol⁻¹<br>0.600 mol of NO and 0.400 mol of O₂ are mixed. At equilibrium the mixture contains 0.400 mol of NO₂ and the total pressure is 200 kPa.<br>(a) Calculate Kp and give its units. [6]<br>(b) State and explain the effect of an increase in temperature on the value of Kp. [2]",
  ms:["equilibrium moles: NO = 0.200 and O₂ = 0.200","total moles = 0.800 (mole fractions 0.25, 0.25, 0.50)","partial pressures: NO = 50, O₂ = 50, NO₂ = 100 kPa","Kp = p(NO₂)² ÷ (p(NO)² × p(O₂))","Kp = 0.0800","units kPa⁻¹","Kp decreases","equilibrium moves to the left / in the endothermic direction to oppose the increase in temperature"]}},

{name:"pH: Kw, strong bases and weak acids",mins:4,why:"Every Paper 1 has 12 to 18 marks on acids and bases. The pH of a strong base at a temperature other than 25 °C has come up five times, and weak acid pH three times.",
 seen:["Jun 17","Jun 18","Jun 19","2021","Jun 22","Jun 23"],
 blocks:[
 {t:"key",title:"Four calculations to have ready",items:[
  "<b>pH = −log₁₀[H⁺]</b> and [H⁺] = 10<sup>−pH</sup>. Give pH to 2 decimal places.",
  "<b>Strong acid:</b> [H⁺] = concentration of acid × number of H⁺ per molecule.",
  "<b>Strong base:</b> find [OH⁻] (× 2 for Ba(OH)₂, Ca(OH)₂, Sr(OH)₂), then [H⁺] = Kw ÷ [OH⁻].",
  "<b>Pure water:</b> [H⁺] = √Kw. Water is always neutral because [H⁺] = [OH⁻], even when its pH is not 7.",
  "<b>Weak acid:</b> Ka = [H⁺]² ÷ [HA], so [H⁺] = √(Ka × [HA]).",
  "<b>pKa = −log₁₀Ka</b> and Ka = 10<sup>−pKa</sup>.",
  "Kw increases with temperature because the dissociation of water is endothermic, so the equilibrium moves to the right."],
  trap:"Using Kw = 1.00 × 10⁻¹⁴ when the question gives a different value at a different temperature."},
 {t:"calc",title:"Strong base at 40 °C",q:"Calculate the pH of 0.0250 mol dm⁻³ Ba(OH)₂ at 40 °C. At 40 °C, Kw = 2.92 × 10⁻¹⁴ mol² dm⁻⁶. <br><small>Type standard form like this: 5.8e-13</small>",
  steps:[
  {p:"What is [OH⁻] in mol dm⁻³?",a:0.05,tol:0.0003,show:"2 × 0.0250 = 0.0500 mol dm⁻³"},
  {p:"Use [H⁺] = Kw ÷ [OH⁻].",a:5.84e-13,show:"2.92 × 10⁻¹⁴ ÷ 0.0500 = 5.84 × 10⁻¹³ mol dm⁻³"},
  {p:"Calculate the pH to 2 decimal places.",a:12.23,tol:0.006,show:"−log(5.84 × 10⁻¹³) = 12.23"}]}],
 checks:[
 {q:"At 40 °C, Kw = 2.92 × 10⁻¹⁴ mol² dm⁻⁶. What is the pH of pure water at 40 °C?",opts:["7.00","6.77","13.53","7.23"],a:1,why:"[H⁺] = √(2.92 × 10⁻¹⁴) = 1.71 × 10⁻⁷, pH = 6.77. It is still neutral."},
 {q:"What is the pH of 0.200 mol dm⁻³ propanoic acid? (Ka = 1.35 × 10⁻⁵ mol dm⁻³)",opts:["0.70","5.57","2.78","4.87"],a:2,why:"[H⁺] = √(1.35 × 10⁻⁵ × 0.200) = 1.64 × 10⁻³, pH = 2.78"},
 {q:"25.0 cm³ of 0.100 mol dm⁻³ HCl is mixed with 35.0 cm³ of 0.100 mol dm⁻³ NaOH. What do you do next to find the pH?",opts:["Use Ka","Find the excess moles of OH⁻ and divide by the total volume (60.0 cm³)","Find the excess moles of OH⁻ and divide by 35.0 cm³","Take the average of the two pH values"],a:1,why:"Excess OH⁻ = 1.00 × 10⁻³ mol in 0.0600 dm³. Then use Kw to get [H⁺]."}],
 exam:{q:"(a) State the meaning of the term weak acid. [1]<br>(b) 30.0 cm³ of 0.150 mol dm⁻³ NaOH is added to 20.0 cm³ of 0.100 mol dm⁻³ HCl at 25 °C. Calculate the pH of the mixture. (Kw = 1.00 × 10⁻¹⁴ mol² dm⁻⁶) [5]",
  ms:["only partially / slightly dissociates (into ions) in water","mol NaOH = 4.50 × 10⁻³ and mol HCl = 2.00 × 10⁻³","excess OH⁻ = 2.50 × 10⁻³ mol","[OH⁻] = 2.50 × 10⁻³ ÷ 0.0500 = 0.0500 mol dm⁻³","[H⁺] = 1.00 × 10⁻¹⁴ ÷ 0.0500 = 2.00 × 10⁻¹³ mol dm⁻³","pH = 12.70"]}},

{name:"Buffer calculations",mins:4,why:"A 5 or 6 mark buffer calculation was on six of the seven Paper 1s from 2017 to 2023. Usually acid or alkali is added to the buffer first.",
 seen:["Jun 17 (9)","Jun 18 (5)","Jun 19 (6)","2020 (6)","Jun 22 (8)","Jun 23 (5)"],
 blocks:[
 {t:"key",title:"The method",items:[
  "Work in <b>moles</b> of acid HA and moles of salt A⁻.",
  "<b>Adding OH⁻:</b> moles of HA go <b>down</b> and moles of A⁻ go <b>up</b> by the moles of OH⁻ added.",
  "<b>Adding H⁺:</b> moles of A⁻ go <b>down</b> and moles of HA go <b>up</b> by the moles of H⁺ added.",
  "[H⁺] = Ka × (moles HA ÷ moles A⁻). The volume cancels, so you can use moles.",
  "<b>Making a buffer from a weak acid and NaOH:</b> the NaOH is the limiting reagent. Moles of A⁻ formed = moles of NaOH. Moles of HA left = start − moles of NaOH.",
  "Diluting a buffer does not change its pH because the ratio [HA] ÷ [A⁻] stays the same."],
  trap:"Using [H⁺] = √(Ka × [HA]) for a buffer. That equation is only for a weak acid on its own."},
 {t:"calc",title:"Adding alkali to a buffer",q:"A buffer contains 0.150 mol of ethanoic acid and 0.100 mol of sodium ethanoate. 0.0200 mol of NaOH is added. Ka = 1.74 × 10⁻⁵ mol dm⁻³. <br><small>Type standard form like this: 1.9e-5</small>",
  steps:[
  {p:"How many moles of ethanoic acid are there after the NaOH is added?",a:0.13,tol:0.0005,u:" mol",show:"0.150 − 0.0200 = 0.130 mol"},
  {p:"How many moles of ethanoate ions are there now?",a:0.12,tol:0.0005,u:" mol",show:"0.100 + 0.0200 = 0.120 mol"},
  {p:"Calculate [H⁺] = Ka × (mol acid ÷ mol salt).",a:1.885e-5,show:"1.74 × 10⁻⁵ × (0.130 ÷ 0.120) = 1.885 × 10⁻⁵ mol dm⁻³"},
  {p:"Calculate the pH to 2 decimal places.",a:4.72,tol:0.006,show:"−log(1.885 × 10⁻⁵) = 4.72  (it was 4.58 before, so it has barely changed)"}]},
 {t:"model",q:"Explain how an ethanoic acid / sodium ethanoate buffer resists a change in pH when a small amount of acid is added. [2]",a:[
  "The added H⁺ ions react with ethanoate ions: CH₃COO⁻ + H⁺ → CH₃COOH",
  "The ratio [CH₃COOH] ÷ [CH₃COO⁻] stays almost constant, so [H⁺] and the pH stay almost constant."]}],
 checks:[
 {q:"Which pair makes an acidic buffer?",opts:["HCl and NaCl","CH₃COOH and CH₃COONa","NaOH and NaCl","HCl and NaOH"],a:1,why:"A weak acid and the salt of that weak acid."},
 {q:"0.010 mol of NaOH is added to 0.050 mol of a weak acid HA. What is in the mixture?",opts:["0.050 mol HA and 0.010 mol A⁻","0.040 mol HA and 0.010 mol A⁻","0.040 mol HA only","0.060 mol HA"],a:1,why:"NaOH is limiting. It turns 0.010 mol of HA into A⁻, leaving 0.040 mol of HA. This is a buffer."},
 {q:"When alkali is added to an acidic buffer, the OH⁻ ions react with…",opts:["A⁻ ions","HA molecules","Na⁺ ions","water"],a:1,why:"HA + OH⁻ → A⁻ + H₂O"}],
 exam:{q:"A buffer is made by dissolving 0.0400 mol of sodium methanoate in 250 cm³ of 0.200 mol dm⁻³ methanoic acid. Then 5.00 cm³ of 1.00 mol dm⁻³ HCl is added.<br>For methanoic acid, Ka = 1.78 × 10⁻⁴ mol dm⁻³.<br>Calculate the pH of the solution after the HCl is added. [5]",
  ms:["original mol HCOOH = 0.0500 and mol HCl added = 5.00 × 10⁻³","new mol HCOOH = 0.0550","new mol HCOO⁻ = 0.0350","[H⁺] = 1.78 × 10⁻⁴ × (0.0550 ÷ 0.0350) = 2.80 × 10⁻⁴ mol dm⁻³","pH = 3.55"]}}
],
quiz:[
{q:"What is the mass, in kg, of one ⁵⁰Cr⁺ ion?",opts:["8.30 × 10⁻²³","8.30 × 10⁻²⁶","3.01 × 10²²","5.00 × 10⁻²"],a:1,why:"50 × 10⁻³ ÷ 6.022 × 10²³ = 8.30 × 10⁻²⁶ kg"},
{q:"In a time of flight mass spectrometer, all the ions in the flight tube have the same…",opts:["speed","mass","kinetic energy","time of flight"],a:2,why:"They are all accelerated to the same kinetic energy."},
{q:"Why do isotopes of an element have the same chemical properties?",opts:["Same number of neutrons","Same electron configuration","Same mass number","Same relative atomic mass"],a:1,why:"Chemical properties depend on the electrons."},
{q:"A gas mixture at 300 kPa contains 0.20 mol of N₂ and 0.60 mol of H₂. What is the partial pressure of N₂?",opts:["60 kPa","75 kPa","100 kPa","225 kPa"],a:1,why:"Mole fraction = 0.20 ÷ 0.80 = 0.25. 0.25 × 300 = 75 kPa"},
{q:"Which change alters the value of Kp?",opts:["Adding a catalyst","Increasing the pressure","Adding more reactant","Changing the temperature"],a:3,why:"Only temperature."},
{q:"What is the pH of 0.0500 mol dm⁻³ HCl?",opts:["0.05","1.30","2.70","12.70"],a:1,why:"−log(0.0500) = 1.30"},
{q:"A weak acid has pKa = 4.87. What is its Ka in mol dm⁻³?",opts:["1.35 × 10⁻⁵","4.87 × 10⁻⁵","7.41 × 10⁴","0.688"],a:0,why:"Ka = 10⁻⁴·⁸⁷ = 1.35 × 10⁻⁵"},
{q:"In a buffer, [HA] = [A⁻]. What is the pH?",opts:["7.00","Equal to pKa","Equal to Ka","Half of pKa"],a:1,why:"[H⁺] = Ka × 1, so pH = pKa."}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
