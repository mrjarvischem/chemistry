<style>
:root{--cream:#fbf5e9;--card:#fffdf7;--brown:#5b3a1e;--mid:#8a5a2b;--line:#e2d3b8;--tan:#f1e4cb;--ink:#2e2218;--good:#2f7d4f;--goodbg:#e3f3e8;--bad:#b3402e;--badbg:#fbe6e1;--gold:#c98a1b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 "Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--mid);background:var(--tan);color:var(--brown);padding:6px 12px}
button:hover{background:#e9d6b1}header button{background:#fff;border-color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--tan);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

main{max-width:860px;margin:0 auto;padding:16px 14px 60px}
h2{color:var(--brown);margin:.2em 0 .3em;font-size:1.45rem}h3{color:var(--brown);margin:0 0 .4em;font-size:1.08rem}
.why{color:var(--mid);margin:0 0 6px}.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.pill{background:var(--tan);border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.8rem;color:var(--brown)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.key{border-left:6px solid var(--gold)}.key ul,.card ul{margin:.2em 0;padding-left:1.2em}.key li{margin:.25em 0}
.trap{background:#fff3d6;border:1px solid #edd08f;border-radius:8px;padding:8px 12px;margin:8px 0 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--tan);color:var(--brown)}
.opts{display:grid;gap:8px;margin:8px 0}.opts button{text-align:left;background:#fff;color:var(--ink);border-color:var(--line);padding:9px 12px}
.opts button.right{background:var(--goodbg);border-color:var(--good)}.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{font-size:.95rem;margin:6px 0 0;padding:8px 10px;border-radius:8px;background:var(--tan)}

.step input{font:inherit;width:120px;padding:5px 8px;border:1px solid var(--mid);border-radius:6px;margin-right:6px}

.work{display:none;color:var(--good);margin:6px 0 0;font-weight:600}.step.ok .work,.step.told .work{display:block}.step.told .work{color:var(--mid)}

.hid{display:none}.tag{display:inline-block;background:var(--brown);color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;margin-right:6px}
.reveal li{color:transparent;background:var(--tan);border-radius:6px;margin:5px 0;padding:2px 6px;cursor:pointer;user-select:none}.reveal li.on{color:inherit;background:none;cursor:default}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:6px}.big{font-size:1.05rem;padding:10px 18px;background:var(--brown);color:#fff;border-color:var(--brown)}.big:hover{background:#3d2612}
.score{font-size:1.6rem;font-weight:700;color:var(--brown)}svg{max-width:100%;height:auto;display:block;margin:6px auto}
svg.mol{width:100%;height:auto;display:block;margin:0 auto}svg.mol .bd{stroke:#3b2a1a;stroke-width:2.2;stroke-linecap:round}svg.mol text{font-family:"Segoe UI",Arial,sans-serif}.eq{font-weight:600}.card{overflow-x:auto}@media(max-width:560px){table{font-size:.8rem}th,td{padding:4px 5px}}

<script>const WT=({
file:"alevel-paper2-last-minute-A.html",
title:"A-level Paper 2 last-minute walkthrough A",
sub:"Physical chemistry: rate equations, Arrhenius, Kc and calorimetry · AQA A-level Chemistry 7405/2 · 25 minutes",
tabs:[
{name:"Rate equations and the rate constant",mins:4,why:"Rate equations were on every Paper 2 from 2017 to 2023, for 10 to 20 marks. Calculating k with its units is the single most repeated 3-mark question.",
 seen:["Jun 17 (11)","Jun 18 (14)","Jun 19 (10)","2020 (11)","2021 (12)","Jun 22 (14)","Jun 23 (20)"],
 blocks:[
 {t:"key",title:"The rules",items:[
  "<b>rate = k[A]<sup>m</sup>[B]<sup>n</sup></b>. m and n are the orders. They come from experiment, not from the balanced equation.",
  "<b>Order 0:</b> changing the concentration has no effect on the rate. <b>Order 1:</b> double the concentration, rate doubles. <b>Order 2:</b> double the concentration, rate × 4 (triple it, rate × 9).",
  "<b>Overall order</b> = the sum of the powers in the rate equation.",
  "<b>k = rate ÷ ([A]<sup>m</sup>[B]<sup>n</sup>)</b>",
  "<b>Units of k:</b> put units into the same expression and cancel. Overall order 1: s⁻¹ · order 2: mol⁻¹ dm³ s⁻¹ · order 3: mol⁻² dm⁶ s⁻¹",
  "<b>Rates tables:</b> find two experiments where only one concentration changes. If two change at once, allow for the one you already know first.",
  "k only changes with temperature (or a catalyst). It increases as temperature increases."],
  trap:"Forgetting to square the concentration when you calculate k for a second-order reactant."},
 {t:"calc",title:"k and its units",q:"rate = k[A]²[B]<br>The initial rate is 3.60 × 10⁻⁴ mol dm⁻³ s⁻¹ when [A] = 0.150 mol dm⁻³ and [B] = 0.400 mol dm⁻³.",
  steps:[
  {p:"Calculate [A]² × [B].",a:0.009,tol:0.00005,show:"0.150² × 0.400 = 9.00 × 10⁻³"},
  {p:"Calculate k.",a:0.04,tol:0.0003,u:" mol⁻² dm⁶ s⁻¹",show:"3.60 × 10⁻⁴ ÷ 9.00 × 10⁻³ = 0.0400.   Units: mol dm⁻³ s⁻¹ ÷ (mol dm⁻³)³ = mol⁻² dm⁶ s⁻¹"},
  {p:"The concentrations of A and B are both doubled. By what factor does the rate increase?",a:8,tol:0,show:"2² × 2 = 8 times faster"}]}],
 checks:[
 {q:"rate = k[X][Y]². What are the units of k?",opts:["s⁻¹","mol⁻¹ dm³ s⁻¹","mol⁻² dm⁶ s⁻¹","mol dm⁻³ s⁻¹"],a:2,why:"Third order overall."},
 {q:"When [P] is tripled (everything else constant), the rate increases by a factor of 9. What is the order with respect to P?",opts:["0","1","2","3"],a:2,why:"3² = 9"},
 {q:"rate = k[L][M]². The concentrations of L and M are both halved. What happens to the rate?",opts:["It halves","It is 4 times smaller","It is 8 times smaller","It does not change"],a:2,why:"½ × (½)² = ⅛"}],
 exam:{q:"X and Y react at constant temperature. Initial rates:<br><table><tr><th>Experiment</th><th>[X] / mol dm⁻³</th><th>[Y] / mol dm⁻³</th><th>Initial rate / mol dm⁻³ s⁻¹</th></tr><tr><td>1</td><td>0.10</td><td>0.10</td><td>2.0 × 10⁻³</td></tr><tr><td>2</td><td>0.20</td><td>0.10</td><td>8.0 × 10⁻³</td></tr><tr><td>3</td><td>0.20</td><td>0.30</td><td>2.4 × 10⁻²</td></tr></table>(a) Deduce the order with respect to X and the order with respect to Y. [2]<br>(b) Calculate the rate constant and give its units. [3]<br>(c) Calculate the initial rate when [X] = [Y] = 0.050 mol dm⁻³ [1]",
  ms:["order with respect to X = 2 (experiments 1 and 2: [X] × 2, rate × 4)","order with respect to Y = 1 (experiments 2 and 3: [Y] × 3, rate × 3)","k = 2.0 × 10⁻³ ÷ (0.10² × 0.10)","k = 2.0","mol⁻² dm⁶ s⁻¹","rate = 2.0 × 0.050² × 0.050 = 2.5 × 10⁻⁴ mol dm⁻³ s⁻¹"]}},

{name:"The Arrhenius equation",mins:5,why:"An Arrhenius calculation or graph was on six of the seven Paper 2s (and on Paper 3 in 2020), for 3 to 6 marks. Both forms of the equation are given to you. The marks are for rearranging and for units.",
 seen:["Jun 17 (4)","Jun 18 (8)","Jun 19 (4)","2021 (3)","Jun 22 (5)","Jun 23 (3)","P3 2020 (7)"],
 blocks:[
 {t:"key",title:"Using the equation",items:[
  "<b>k = Ae<sup>−Ea/RT</sup></b>   and   <b>ln k = −E<sub>a</sub>/RT + ln A</b>",
  "E<sub>a</sub> must be in <b>J mol⁻¹</b> in the equation (kJ × 1000). T must be in <b>K</b>. R = 8.31 J K⁻¹ mol⁻¹.",
  "<b>Finding E<sub>a</sub>:</b> E<sub>a</sub> = (ln A − ln k) × RT. Divide by 1000 at the end to give kJ mol⁻¹.",
  "<b>Finding T:</b> T = E<sub>a</sub> ÷ (R × (ln A − ln k))",
  "<b>Finding A:</b> A = k ÷ e<sup>−Ea/RT</sup>. A has the same units as k.",
  "<b>Graph of ln k (y) against 1/T (x):</b> straight line with <b>gradient = −E<sub>a</sub>/R</b> and intercept = ln A. So E<sub>a</sub> = −gradient × 8.31.",
  "For the gradient, use two points on the line that are far apart and read the 1/T scale carefully (values are often × 10⁻³)."],
  trap:"Leaving E<sub>a</sub> in J mol⁻¹ when the answer line says kJ mol⁻¹, or using °C instead of K."},
 {t:"calc",title:"Finding the activation energy",q:"For a reaction at 298 K, k = 1.80 × 10⁻⁴ s⁻¹ and ln A = 25.0. Use ln k = −E<sub>a</sub>/RT + ln A to find E<sub>a</sub>. (R = 8.31 J K⁻¹ mol⁻¹)",
  steps:[
  {p:"Calculate ln k.",a:-8.62,tol:0.02,show:"ln(1.80 × 10⁻⁴) = −8.62"},
  {p:"Calculate ln A − ln k.",a:33.62,tol:0.03,show:"25.0 − (−8.62) = 33.62"},
  {p:"E<sub>a</sub> = 33.62 × R × T. Give E<sub>a</sub> in kJ mol⁻¹.",a:83.3,tol:0.3,u:" kJ mol⁻¹",show:"33.62 × 8.31 × 298 = 83 260 J mol⁻¹ = 83.3 kJ mol⁻¹"}]},
 {t:"calc",title:"Activation energy from a graph",q:"A graph of ln k against 1/T is a straight line. It passes through (3.10 × 10⁻³, −4.20) and (3.40 × 10⁻³, −7.50).",
  steps:[
  {p:"Calculate the gradient (in K).",a:-11000,tol:60,u:" K",show:"(−7.50 − −4.20) ÷ (3.40 × 10⁻³ − 3.10 × 10⁻³) = −3.30 ÷ 3.0 × 10⁻⁴ = −11 000 K"},
  {p:"Calculate E<sub>a</sub> in kJ mol⁻¹.",a:91.4,tol:0.5,u:" kJ mol⁻¹",show:"E<sub>a</sub> = 11 000 × 8.31 = 91 410 J mol⁻¹ = 91.4 kJ mol⁻¹"}]}],
 checks:[
 {q:"On a graph of ln k against 1/T, what does the gradient equal?",opts:["E<sub>a</sub>","−E<sub>a</sub>/R","ln A","−E<sub>a</sub> × R"],a:1,why:"ln k = (−E<sub>a</sub>/R) × (1/T) + ln A is in the form y = mx + c."},
 {q:"The temperature is increased. What happens to the rate constant k?",opts:["It increases","It decreases","It stays the same","It becomes zero"],a:0,why:"More molecules have energy ≥ E<sub>a</sub>, so k increases."},
 {q:"For a first-order reaction, k has units s⁻¹. What are the units of the Arrhenius constant A?",opts:["No units","J mol⁻¹","s⁻¹","K"],a:2,why:"The exponential term has no units, so A has the same units as k."}],
 exam:{q:"For the decomposition of a gas, E<sub>a</sub> = 62.0 kJ mol⁻¹ and A = 4.50 × 10¹⁰ s⁻¹.<br>k = Ae<sup>−Ea/RT</sup>   (R = 8.31 J K⁻¹ mol⁻¹)<br>(a) Calculate the temperature at which k = 0.320 s⁻¹ [3]<br>(b) The temperature is increased. State two ways in which the Maxwell–Boltzmann distribution curve changes and explain why the rate of reaction increases. [4]",
  ms:["ln(k ÷ A) = ln(0.320 ÷ 4.50 × 10¹⁰) = −25.67  (= −E<sub>a</sub>/RT)","T = 62 000 ÷ (8.31 × 25.67)","T = 291 K","the peak is lower","the peak moves to the right (higher energy) / the curve is more spread out (area stays the same)","many more molecules have energy greater than or equal to the activation energy","so there are more successful collisions per second"]}},

{name:"Mechanisms and rate graphs",mins:4,why:"Linking a rate equation to the rate-determining step, and reading orders from graphs, came up on Paper 2 in 2017, 2020, 2021 and 2023 and in the Paper 3 practical questions in 2018 and 2022.",
 seen:["Jun 17 (4)","2020 (6)","2021 (9)","Jun 23 (5)","P3 Jun 18 (19)","P3 Jun 22 (10)"],
 blocks:[
 {t:"key",title:"Rate-determining step",items:[
  "The <b>rate-determining step</b> is the <b>slowest</b> step in the mechanism.",
  "The species in the rate equation are the ones that react in the steps <b>up to and including</b> the rate-determining step. The order tells you how many of each.",
  "A species that is <b>zero order</b> is not in the rate equation, so it only takes part <b>after</b> the rate-determining step.",
  "Example: rate = k[B]²[H⁺]. Step 1: B + H⁺ → BH⁺. Step 2: BH⁺ + B → B₂H⁺. Step 3: B₂H⁺ + A → products. By the end of step 2, two B and one H⁺ have reacted, so <b>step 2</b> is rate-determining."]},
 {t:"tbl",title:"Graphs for each order",head:["Order","Concentration against time","Rate against concentration"],rows:[
  ["0","straight line sloping down (constant gradient = constant rate)","horizontal line"],
  ["1","curve with a <b>constant half-life</b>","straight line through the origin"],
  ["2","steeper curve, half-life gets longer","curve getting steeper (rate ∝ concentration²)"]]},
 {t:"key",title:"Getting rates from experiments",items:[
  "<b>Initial rate:</b> draw a tangent to the curve at t = 0 and find its gradient. Use a big triangle.",
  "<b>Clock reactions:</b> measure the time t for a fixed, small amount of product to form. <b>Rate ∝ 1/t</b>.",
  "<b>Large excess:</b> if a reactant is in large excess its concentration is effectively constant, so it does not affect the rate and the order for the other reactant can be found.",
  "<b>Quenching:</b> to stop the reaction in a sample before titrating it, cool it rapidly, dilute it, or remove the catalyst or a reactant (for example add NaHCO₃ to neutralise an acid catalyst).",
  "Units for a rate from a gas volume graph: cm³ s⁻¹. From a mass graph: g s⁻¹ (or g min⁻¹)."],
  trap:"Drawing a chord instead of a tangent, or giving the units of rate as mol dm⁻³ when the graph shows volume or mass."}],
 checks:[
 {q:"rate = k[CH₃COCH₃][H⁺] for the reaction of propanone with iodine. What does this tell you about iodine?",opts:["Iodine is the catalyst","Iodine reacts in the rate-determining step","Iodine takes part after the rate-determining step","Iodine does not react"],a:2,why:"Zero order: iodine is not in the rate equation."},
 {q:"A graph of concentration against time for reactant Q is a straight line sloping down. What is the order with respect to Q?",opts:["0","1","2","Cannot tell"],a:0,why:"Constant gradient means constant rate, so the rate does not depend on [Q]."},
 {q:"In a clock reaction, the time taken halves when the concentration of R is doubled. What is the order with respect to R?",opts:["0","1","2","3"],a:1,why:"Rate ∝ 1/t. Time halves, so rate doubles: first order."}],
 exam:{q:"2NO₂ + F₂ → 2NO₂F has the rate equation rate = k[NO₂][F₂]<br>A suggested mechanism is:   Step 1: NO₂ + F₂ → NO₂F + F     Step 2: NO₂ + F → NO₂F<br>(a) Deduce which step is the rate-determining step. Explain your answer. [2]<br>(b) In an experiment to follow this reaction, [F₂] is plotted against time. Describe how you would use the graph to find the initial rate. [2]<br>(c) State the effect on the rate of doubling the concentration of NO₂ and halving the concentration of F₂. [1]",
  ms:["step 1","one NO₂ and one F₂ react in step 1, matching the rate equation / the orders are 1 and 1","draw a tangent to the curve at t = 0","calculate the gradient of the tangent","no change (2 × ½ = 1)"]}},

{name:"Kc calculations",mins:4,why:"A Kc calculation was on five of the seven Paper 2s from 2017 to 2023, for 7 to 13 marks. The steps are the same as Kp, but with concentrations.",
 seen:["Jun 17 (9)","Jun 18 (13)","2020 (12)","2021 (7)","Jun 22 (9)"],
 blocks:[
 {t:"key",title:"The method",items:[
  "<b>Equilibrium moles:</b> start − change, using the ratio in the equation (an ICE table).",
  "<b>Concentration</b> = moles ÷ volume in dm³ (cm³ ÷ 1000).",
  "<b>Kc</b> = [products] ÷ [reactants], each raised to the power of its number in the equation. Square brackets this time.",
  "<b>Units:</b> cancel mol dm⁻³. Equal powers top and bottom means no units.",
  "<b>When the volume cancels:</b> if there are the same number of moles on each side of the equation, V cancels in the Kc expression, so you can use moles and do not need the volume.",
  "<b>Missing value:</b> rearrange Kc for the unknown concentration. If it is squared, remember to take the square root.",
  "Water is included in Kc if it is a reactant or product in a non-aqueous mixture (such as esterification). It is left out when it is the solvent in large excess.",
  "Only temperature changes Kc. Exothermic forward reaction: higher temperature gives a smaller Kc."],
  trap:"Using the starting moles in the Kc expression instead of the equilibrium moles."},
 {t:"calc",title:"Kc from starting amounts",q:"A(aq) + 2B(aq) ⇌ C(aq)<br>0.80 mol of A and 1.00 mol of B are mixed in a total volume of 500 cm³. At equilibrium there is 0.30 mol of C.",
  steps:[
  {p:"How many moles of A are there at equilibrium?",a:0.5,tol:0.001,u:" mol",show:"0.80 − 0.30 = 0.50 mol"},
  {p:"How many moles of B are there at equilibrium?",a:0.4,tol:0.001,u:" mol",show:"1.00 − (2 × 0.30) = 0.40 mol"},
  {p:"What is the equilibrium concentration of B in mol dm⁻³?",a:0.8,tol:0.002,u:" mol dm⁻³",show:"0.40 ÷ 0.500 = 0.80.   Also [A] = 1.00 and [C] = 0.60 mol dm⁻³"},
  {p:"Kc = [C] ÷ ([A][B]²). Calculate Kc.",a:0.9375,tol:0.006,u:" mol⁻² dm⁶",show:"0.60 ÷ (1.00 × 0.80²) = 0.94 mol⁻² dm⁶"}]}],
 checks:[
 {q:"2A + B ⇌ 3C + D. What are the units of Kc?",opts:["mol dm⁻³","mol⁻¹ dm³","mol² dm⁻⁶","no units"],a:0,why:"(mol dm⁻³)⁴ ÷ (mol dm⁻³)³ = mol dm⁻³"},
 {q:"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. Why is the total volume not needed to calculate Kc?",opts:["The reaction is in a liquid","There are equal numbers of moles on both sides, so volume cancels","Water is not included in Kc","Kc has no meaning for esters"],a:1,why:"V² on the top cancels V² on the bottom."},
 {q:"The forward reaction is endothermic. What happens to Kc when the temperature is increased?",opts:["Increases","Decreases","No change","Becomes negative"],a:0,why:"Equilibrium moves in the endothermic (forward) direction, so more products and a larger Kc."}],
 exam:{q:"CH₃COOH(l) + C₂H₅OH(l) ⇌ CH₃COOC₂H₅(l) + H₂O(l)<br>2.00 mol of ethanoic acid and 1.50 mol of ethanol are mixed with a catalyst. At equilibrium there is 1.00 mol of ester.<br>(a) Calculate Kc. State its units, if any. [4]<br>(b) In a different mixture at the same temperature there is 0.50 mol of ethanoic acid, 2.00 mol of ester and 1.00 mol of water at equilibrium. Calculate the amount of ethanol. [2]",
  ms:["equilibrium moles: acid = 1.00, ethanol = 0.50, water = 1.00","Kc = [CH₃COOC₂H₅][H₂O] ÷ ([CH₃COOH][C₂H₅OH])","Kc = (1.00 × 1.00) ÷ (1.00 × 0.50) = 2.0","no units","mol ethanol = (2.00 × 1.00) ÷ (2.0 × 0.50)","= 2.0 mol"]}},

{name:"Calorimetry and percentage yield",mins:4,why:"Paper 2 also tests Year 1 physical chemistry. An enthalpy of combustion calculation (2018, 2021, 2023) or a percentage yield calculation (2017, 2019, 2020, 2022) has been on every Paper 2.",
 seen:["Jun 17 (3)","Jun 18 (3)","Jun 19 (5)","2020 (5)","2021 (7)","Jun 22 (4)","Jun 23 (12)"],
 blocks:[
 {t:"key",title:"Enthalpy of combustion from an experiment",items:[
  "<b>q = mcΔT</b>. m is the mass of <b>water</b> (not the fuel). c = 4.18 J K⁻¹ g⁻¹. q is in joules.",
  "<b>ΔH = −q ÷ moles of fuel</b>, then ÷ 1000 for kJ mol⁻¹. Combustion is exothermic, so the answer is <b>negative</b>.",
  "Experimental values are <b>less exothermic</b> than data book values because of heat loss to the surroundings, incomplete combustion and evaporation of the fuel.",
  "<b>Bond enthalpies:</b> ΔH = Σ(bonds broken) − Σ(bonds made). Mean bond enthalpies are averages over many compounds, so the answer is only approximate.",
  "<b>Enthalpies of formation:</b> ΔH = ΣΔ<sub>f</sub>H(products) − ΣΔ<sub>f</sub>H(reactants)."],
  trap:"Using the mass of the fuel in q = mcΔT, or leaving off the minus sign."},
 {t:"calc",title:"Enthalpy of combustion",q:"Burning 0.650 g of propan-1-ol (M<sub>r</sub> = 60.0) raises the temperature of 200 g of water by 21.5 °C. (c = 4.18 J K⁻¹ g⁻¹)",
  steps:[
  {p:"Calculate q in joules.",a:17974,tol:60,u:" J",show:"200 × 4.18 × 21.5 = 17 974 J"},
  {p:"Calculate the moles of propan-1-ol burned.",a:0.01083,u:" mol",show:"0.650 ÷ 60.0 = 0.01083 mol"},
  {p:"Calculate the enthalpy of combustion in kJ mol⁻¹. Include the sign.",a:-1659,tol:12,u:" kJ mol⁻¹",show:"17 974 ÷ 0.01083 = 1 659 000 J mol⁻¹, so ΔH = −1660 kJ mol⁻¹"}]},
 {t:"key",title:"Percentage yield",items:[
  "<b>Mass of a liquid</b> = volume × density.",
  "Moles of reactant → moles of product (equation ratio) → <b>theoretical mass</b> = moles × M<sub>r</sub> of product.",
  "<b>% yield = actual mass ÷ theoretical mass × 100</b>",
  "If two amounts are given, find the <b>limiting reagent</b> first (the one that gives fewer moles of product).",
  "<b>% atom economy</b> = M<sub>r</sub> of desired product ÷ sum of M<sub>r</sub> of all reactants × 100. A high atom economy means less waste."]}],
 checks:[
 {q:"In q = mcΔT for a spirit burner experiment, m is the mass of…",opts:["fuel burned","water heated","the calorimeter","fuel plus water"],a:1,why:"It is the water that changes temperature."},
 {q:"0.100 mol of an alcohol should give 8.20 g of an alkene. A student obtains 5.33 g. What is the percentage yield?",opts:["53.3%","65.0%","82.0%","154%"],a:1,why:"5.33 ÷ 8.20 × 100 = 65.0%"},
 {q:"Why is a bond enthalpy calculation only approximate?",opts:["Heat is lost","Mean bond enthalpies are averaged over many different compounds","The reaction is incomplete","Bond enthalpies are for solids"],a:1,why:"The values in the table are not the exact values for the bonds in these particular molecules."}],
 exam:{q:"Cyclohexanol (M<sub>r</sub> = 100.0) is dehydrated to cyclohexene (M<sub>r</sub> = 82.0). A student uses 12.0 cm³ of cyclohexanol (density = 0.962 g cm⁻³) and obtains 6.15 g of cyclohexene.<br>(a) Calculate the percentage yield. Give your answer to 3 significant figures. [4]<br>(b) In a separate experiment the enthalpy of combustion of cyclohexanol is found to be less exothermic than the data book value. Give two reasons. [2]",
  ms:["mass of cyclohexanol = 12.0 × 0.962 = 11.5(4) g","mol = 11.544 ÷ 100.0 = 0.115(4)","theoretical mass of cyclohexene = 0.1154 × 82.0 = 9.47 g","% yield = 6.15 ÷ 9.47 × 100 = 65.0%","heat loss to the surroundings","incomplete combustion / evaporation of the fuel / heat absorbed by the calorimeter is not included"]}}
],
quiz:[
{q:"rate = k[A]². When [A] = 0.20 mol dm⁻³ the rate is 8.0 × 10⁻³ mol dm⁻³ s⁻¹. What is k?",opts:["0.040","0.20","0.40","3.2 × 10⁻⁴"],a:1,why:"8.0 × 10⁻³ ÷ 0.20² = 0.20 mol⁻¹ dm³ s⁻¹"},
{q:"What is the overall order of a reaction with rate = k[X]²[Y]?",opts:["1","2","3","4"],a:2,why:"2 + 1 = 3"},
{q:"In the Arrhenius equation, which units must E<sub>a</sub> be in?",opts:["kJ mol⁻¹","J mol⁻¹","J","kJ"],a:1,why:"R is in J K⁻¹ mol⁻¹, so E<sub>a</sub> must be in J mol⁻¹."},
{q:"A gradient of −8000 K is found from a graph of ln k against 1/T. What is E<sub>a</sub>?",opts:["66.5 kJ mol⁻¹","8.0 kJ mol⁻¹","963 kJ mol⁻¹","−66.5 kJ mol⁻¹"],a:0,why:"8000 × 8.31 = 66 480 J mol⁻¹ = 66.5 kJ mol⁻¹"},
{q:"Which step of a mechanism is the rate-determining step?",opts:["The first","The last","The slowest","The fastest"],a:2,why:"The slowest step limits the overall rate."},
{q:"N₂O₄ ⇌ 2NO₂. At equilibrium [N₂O₄] = 0.50 and [NO₂] = 0.20 mol dm⁻³. What is Kc?",opts:["0.080 mol dm⁻³","0.40 mol dm⁻³","12.5 mol⁻¹ dm³","0.080 (no units)"],a:0,why:"0.20² ÷ 0.50 = 0.080 mol dm⁻³"},
{q:"Which change alters the value of Kc?",opts:["Concentration","Pressure","Catalyst","Temperature"],a:3,why:"Only temperature."},
{q:"The temperature of 100 g of water rises by 10.0 °C. How much energy was transferred? (c = 4.18 J K⁻¹ g⁻¹)",opts:["418 J","4180 J","41.8 J","41 800 J"],a:1,why:"100 × 4.18 × 10.0 = 4180 J"}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
