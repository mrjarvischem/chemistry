{name:"Reflux and distillation",mins:4,why:"An organic preparation was a long question on Paper 3 in 2017, 2018, 2021 and 2023 (13 to 18 marks each) and on Paper 2 in 2019, 2020, 2022 and 2023. Spotting mistakes in the apparatus is a regular.",
 seen:["Jun 17 (18)","Jun 18 (13)","2021 (13)","Jun 23 (17)","P2 Jun 19 (12)","P2 2020 (16)","P2 Jun 22 (12)"],
 blocks:[
 {t:"tbl",title:"Which technique?",head:["","Reflux","Distillation"],rows:[
  ["What it does","Heats the mixture for a long time. Vapour condenses and <b>drips back</b> into the flask, so no reactants or products escape.","Separates a liquid by boiling point. Vapour is condensed and <b>collected</b> in a separate flask."],
  ["Condenser","vertical, on top of the flask","sloping downwards, at the side"],
  ["Used for","complete oxidation of a primary alcohol to a carboxylic acid; hydrolysis of esters; making esters","collecting an aldehyde as it forms (so it is not oxidised further); purifying a liquid product"],
  ["Top of apparatus","<b>open</b> (never a stopper)","thermometer bulb <b>level with the side arm</b> (the outlet to the condenser)"]]},
 {t:"key",title:"Apparatus marks and mistakes",items:[
  "<b>Water goes in at the bottom of the condenser and out at the top</b>, so the condenser fills completely and cools efficiently.",
  "<b>Never seal the apparatus.</b> A stopper in the top of a reflux condenser (or a sealed receiver) lets pressure build up, and the apparatus could explode.",
  "<b>Anti-bumping granules</b> give smaller bubbles and smoother boiling, preventing violent bumping.",
  "Use an <b>electric heater or water bath</b>, not a Bunsen burner, because organic liquids are flammable.",
  "In distillation the <b>thermometer bulb must be opposite the side arm</b>, to measure the boiling point of the vapour going over. Collect only over a narrow temperature range.",
  "The round-bottomed flask and condenser should be <b>clamped</b>, with no gaps at the joints.",
  "<b>To get an aldehyde:</b> add the alcohol dropwise to the oxidising agent and distil the aldehyde off immediately. It has a lower boiling point than the alcohol because it has no hydrogen bonding between its molecules.",
  "<b>Fractional distillation</b> (with a fractionating column) is used when the boiling points are close together."],
  trap:"Drawing the water going in at the top of the condenser, or drawing a bung in the top of a reflux condenser."},
 {t:"model",q:"Explain why propanal can be separated from propan-1-ol and propanoic acid by distillation. [3]",a:[
  "Propanal has (only) <b>permanent dipole–dipole forces</b> (and van der Waals) between its molecules.",
  "Propan-1-ol and propanoic acid have <b>hydrogen bonds</b> between their molecules.",
  "Hydrogen bonds are <b>stronger</b>, so propanal has the <b>lowest boiling point</b> and distils off first."]}],
 checks:[
 {q:"Why is a mixture heated under reflux?",opts:["To separate the products","To allow prolonged heating without loss of volatile reactants or products","To make the reaction slower","To remove water"],a:1,why:"The vapour condenses and returns to the flask."},
 {q:"A student puts a stopper in the top of a reflux condenser. What is the problem?",opts:["The water cannot flow","Vapour escapes","Pressure builds up and the apparatus could explode","The mixture cools down"],a:2,why:"The system is sealed, so gas cannot escape as it expands."},
 {q:"Where should the bulb of the thermometer be during distillation?",opts:["In the liquid in the flask","Level with the side arm leading to the condenser","In the collecting flask","At the top of the condenser"],a:1,why:"So it measures the temperature of the vapour that is about to be condensed."}],

  ms:["stopper: the apparatus is sealed, so pressure builds up (it could explode)","water in at the top: the condenser does not fill with water / cooling is inefficient, so vapour escapes","to make boiling smooth / prevent violent bumping (form small bubbles)","the organic liquids are flammable","orange to green","(fractional) distillation"]}},

{name:"Separating, washing and drying",mins:4,why:"The separating funnel, washing with sodium carbonate and adding a drying agent were tested on Paper 3 in 2018 and 2023 and on Paper 2 in 2019 and 2022. Each step has a one-line reason.",
 seen:["Jun 18 (5)","Jun 23 (5)","P2 Jun 19 (2)","P2 Jun 22 (4)","P3 Jun 19 (MCQ)"],
 blocks:[
 {t:"key",title:"Purifying an organic liquid, step by step",items:[
  "1. <b>Distil</b> the crude product from the reaction mixture.",
  "2. Pour the distillate into a <b>separating funnel</b>. The organic liquid and the aqueous layer are <b>immiscible</b> (the organic liquid is non-polar or cannot hydrogen bond well with water), so two layers form. The <b>less dense</b> liquid is the upper layer.",
  "3. <b>Wash with sodium carbonate</b> (or sodium hydrogencarbonate) solution to <b>neutralise and remove acid</b> impurities. Stopper, shake and <b>open the tap regularly to release the pressure</b> from the CO₂ formed.",
  "4. Let the layers settle. <b>Run off and discard the aqueous layer</b>. (Washing with water or saturated sodium chloride solution removes other water-soluble impurities.)",
  "5. Transfer the organic layer to a flask and add a <b>drying agent</b> (anhydrous calcium chloride or magnesium sulfate) to <b>remove water</b>. The liquid changes from <b>cloudy to clear</b> when it is dry.",
  "6. <b>Filter</b> (or decant) to remove the drying agent.",
  "7. <b>Redistil</b>, collecting the fraction at the boiling point of the product."]},
 {t:"key",title:"Extra detail that gets asked",items:[
  "A drying agent must <b>not react with the product</b> and must be <b>insoluble</b> in it. For an acid such as pentanoic acid do not use a basic drying agent (calcium oxide, potassium hydroxide, potassium carbonate).",
  "A likely organic impurity is unreacted starting material. If its boiling point is close to the product’s it is hard to remove by distillation.",
  "<b>Safety:</b> concentrated acids are corrosive: wear gloves. Flammable liquids: no naked flames. Toxic or irritant vapours: use a fume cupboard."],
  trap:"Saying sodium carbonate is added to “remove water” or the drying agent is added to “remove acid”. They are the other way round."}],
 checks:[
 {q:"Why is the tap of the separating funnel opened from time to time when shaking with sodium carbonate solution?",opts:["To let air in","To release the pressure from the carbon dioxide formed","To run off the product","To cool the mixture"],a:1,why:"The carbonate reacts with acid impurities, producing CO₂ gas."},
 {q:"How can you tell that an organic liquid has been dried by the drying agent?",opts:["It changes colour","It goes from cloudy to clear","It stops bubbling","Its volume doubles"],a:1,why:"Tiny droplets of water make it cloudy."},
 {q:"Cyclohexene (density 0.81 g cm⁻³) is shaken with water in a separating funnel. Where is the cyclohexene?",opts:["The lower layer","The upper layer","Dissolved in the water","Evaporated"],a:1,why:"It is immiscible with water and less dense than water (1.00 g cm⁻³)."}],
 exam:{q:"An ester is distilled from a reaction mixture containing ethanol, ethanoic acid and concentrated sulfuric acid. The distillate is shaken with aqueous sodium carbonate in a separating funnel. The organic layer is then run into a flask and anhydrous calcium chloride is added.<br>(a) State why sodium carbonate is added and explain why pressure builds up in the funnel. [2]<br>(b) Give a reason why two layers form, and suggest why the ester is the upper layer. [2]<br>(c) State why anhydrous calcium chloride is added. [1]<br>(d) Give one property of calcium chloride, other than absorbing water, that makes it suitable. [1]",
  ms:["to neutralise / remove acid (ethanoic acid or sulfuric acid)","carbon dioxide gas is formed","the ester is immiscible with / insoluble in water (it is not polar enough to mix)","the ester is less dense than the aqueous layer","to remove water / to dry the ester","it does not react with the ester / it is insoluble in the ester"]}},

{name:"Recrystallisation and melting point",mins:5,why:"Purifying a solid by recrystallisation was a 6-mark question in 2017 and a 5-mark question in 2021 on Paper 3, and 6 marks on Paper 2 in 2020. Melting point was asked on Paper 3 in 2018 and on Paper 2 in 2020.",
 seen:["Jun 17 (6)","Jun 18 (5)","2021 (5)","P2 2020 (6)","P2 Jun 22 (2)","P3 Jun 19 (MCQ)"],
 blocks:[
 {t:"model",q:"Describe how to purify a solid organic product by recrystallisation. [6]",a:[
  "Dissolve the impure solid in the <b>minimum volume of hot solvent</b>.",
  "<b>Filter hot</b> (through a pre-heated funnel with fluted paper) to remove <b>insoluble impurities</b>.",
  "<b>Cool</b> the filtrate (in an ice bath) so that crystals form. Soluble impurities stay in solution.",
  "<b>Filter under reduced pressure</b> (Büchner funnel) to collect the crystals.",
  "<b>Wash</b> the crystals with a small amount of <b>cold solvent</b>.",
  "<b>Dry</b> the crystals (between filter papers, in a warm oven below the melting point, or in a desiccator)."]},
 {t:"key",title:"The reason for each step",items:[
  "<b>Minimum volume</b> of hot solvent: so the solution is saturated and as much product as possible crystallises on cooling. Too much solvent and product stays dissolved, lowering the yield.",
  "<b>Hot</b> filtration: so the product does not crystallise in the funnel.",
  "<b>Cold</b> solvent for washing: removes soluble impurities from the surface without dissolving the crystals.",
  "<b>Reduced pressure</b> filtration is faster and leaves the crystals drier.",
  "<b>Büchner apparatus:</b> Büchner funnel with filter paper, fitted with a seal into a side-arm (Büchner) flask, which is connected to a vacuum pump.",
  "Yield is lost in recrystallisation: some product stays in solution and some is left on the apparatus.",
  "With a flammable solvent such as ethanol, heat with a water bath or electric heater."]},
 {t:"key",title:"Melting point as a test of purity",items:[
  "Put a small amount of the dry solid in a <b>capillary tube</b>, in a melting point apparatus (or oil bath with a thermometer).",
  "<b>Heat slowly</b> near the melting point and record the temperature range over which it melts.",
  "A <b>pure</b> solid melts <b>sharply</b> at the data book value. An <b>impure</b> solid melts at a <b>lower temperature</b> and <b>over a range</b>.",
  "A solid that is still wet will also give a low, broad melting point."],
  trap:"Writing “dissolve in hot solvent” without “minimum volume”. That phrase is the mark."}],
 checks:[
 {q:"Why is the minimum volume of hot solvent used in recrystallisation?",opts:["To save money","So the solution is saturated and crystals form on cooling","To remove insoluble impurities","To make filtering faster"],a:1,why:"More solvent would keep more of the product in solution, lowering the yield."},
 {q:"How does the melting point of an impure sample compare with the pure compound?",opts:["Higher and sharp","Lower and over a range","The same","Higher and over a range"],a:1,why:"Impurities lower the melting point and broaden the range."},
 {q:"Why are the crystals washed with cold solvent rather than hot solvent?",opts:["Cold solvent evaporates faster","To avoid dissolving the crystals","Hot solvent would melt the funnel","Cold solvent removes insoluble impurities"],a:1,why:"The product is much less soluble in cold solvent."}],
 exam:{q:"Crude aspirin is purified by recrystallisation from hot ethanol (boiling point 78 °C).<br>(a) Describe two precautions needed when heating the ethanol, and state why the minimum volume of hot ethanol is used. [3]<br>(b) After cooling, the crystals are filtered under reduced pressure and a little cold ethanol is poured through them. Explain the purpose of the cold ethanol. [1]<br>(c) Describe how the melting point of the crude aspirin would differ from that of the pure aspirin. [2]",
  ms:["heat with a water bath / electric heater (no naked flame) because ethanol is flammable","do not heat above the boiling point / avoid boiling the ethanol away / work in a well-ventilated area","minimum volume so that a saturated solution forms and (most of) the aspirin crystallises on cooling","to wash away soluble impurities (without dissolving the crystals)","lower melting point","melts over a range of temperatures"]}},

{name:"Percentage yield",mins:4,why:"A percentage yield calculation was on Paper 3 in 2017, 2018, 2021 and 2023 and on Paper 2 in 2017, 2019, 2020 and 2022, usually for 3 to 5 marks. Density and a limiting reagent are the usual twists.",
 seen:["Jun 17 (5)","Jun 18 (3)","2021 (4)","Jun 23 (5)","P2 Jun 19 (5)","P2 2020 (5)","P2 Jun 22 (4)"],
 blocks:[
 {t:"key",title:"The method",items:[
  "<b>Liquid given as a volume:</b> mass = volume × density.",
  "<b>Moles</b> = mass ÷ M<sub>r</sub>, for each reactant given.",
  "<b>Limiting reagent:</b> the reactant with fewer moles (after allowing for the ratio in the equation). The other is in excess.",
  "<b>Theoretical mass of product</b> = moles of limiting reagent × ratio × M<sub>r</sub> of product.",
  "<b>% yield = actual mass ÷ theoretical mass × 100</b>. (You can also do moles of product obtained ÷ theoretical moles.)",
  "<b>Working backwards:</b> expected mass = theoretical mass × (% yield ÷ 100).",
  "<b>Why the yield is not 100%:</b> the reaction is reversible / incomplete; side reactions; product lost during transfers, filtering, recrystallisation or distillation."],
  trap:"Using the mass of the reactant in excess to work out the theoretical yield."},
 {t:"calc",title:"Yield with a limiting reagent",q:"8.00 cm³ of ethanol (density 0.790 g cm⁻³, M<sub>r</sub> = 46.0) reacts with 6.00 g of ethanoic acid (M<sub>r</sub> = 60.0). 5.50 g of ethyl ethanoate (M<sub>r</sub> = 88.0) is obtained.",
  steps:[
  {p:"Calculate the moles of ethanol.",a:0.1374,u:" mol",show:"8.00 × 0.790 = 6.32 g.   6.32 ÷ 46.0 = 0.137 mol"},
  {p:"Calculate the moles of ethanoic acid. (This is the limiting reagent: 1 : 1 ratio and fewer moles.)",a:0.1,tol:0.0006,u:" mol",show:"6.00 ÷ 60.0 = 0.100 mol"},
  {p:"Calculate the theoretical mass of ethyl ethanoate in g.",a:8.8,tol:0.05,u:" g",show:"0.100 × 88.0 = 8.80 g"},
  {p:"Calculate the percentage yield.",a:62.5,tol:0.4,u:" %",show:"5.50 ÷ 8.80 × 100 = 62.5%"}]}],
 checks:[
 {q:"0.040 mol of ethyl benzoate should give benzoic acid (M<sub>r</sub> = 122.0) in a 1 : 1 ratio. A student obtains 3.66 g. What is the percentage yield?",opts:["61.0%","75.0%","82.0%","133%"],a:1,why:"Theoretical = 0.040 × 122.0 = 4.88 g. 3.66 ÷ 4.88 × 100 = 75.0%"},
 {q:"5.0 cm³ of a liquid has a density of 1.05 g cm⁻³ and M<sub>r</sub> = 150. How many moles is this?",opts:["0.0350","0.0333","0.0317","5.25"],a:0,why:"5.0 × 1.05 = 5.25 g. 5.25 ÷ 150 = 0.0350 mol"},
 {q:"A reaction has a theoretical yield of 12.0 g and a percentage yield of 31.0%. What mass of product is obtained?",opts:["3.72 g","8.28 g","38.7 g","0.372 g"],a:0,why:"12.0 × 0.310 = 3.72 g"}],
 exam:{q:"A student oxidises 7.20 g of propan-1-ol (M<sub>r</sub> = 60.0) with an excess of acidified potassium dichromate(VI) and obtains 3.70 g of propanoic acid (M<sub>r</sub> = 74.0).<br>(a) Calculate the percentage yield. [3]<br>(b) Suggest two reasons why the yield is less than 100%. [2]",
  ms:["mol propan-1-ol = 7.20 ÷ 60.0 = 0.120","theoretical mass of propanoic acid = 0.120 × 74.0 = 8.88 g","% yield = 3.70 ÷ 8.88 × 100 = 41.7%","incomplete oxidation / some propanal formed (escaped)","product lost during separation (distillation) or transfer"]}},

{name:"Chromatography",mins:4,why:"Thin-layer chromatography was on Paper 3 in 2021 and 2023 (9 marks), on Paper 2 in 2017 and 2019, and column chromatography was on Paper 3 in 2018.",
 seen:["Jun 23 (9)","2021 (4)","Jun 18 (2)","P2 Jun 17 (7)","P2 Jun 19 (4)"],
 blocks:[
 {t:"model",q:"Describe how to carry out thin-layer chromatography on a mixture of amino acids. [6]",a:[
  "Wearing gloves, draw a <b>pencil line</b> near the bottom of the TLC plate and put a small spot of the mixture on it (using a capillary tube).",
  "Put solvent in a beaker to a depth <b>below the pencil line</b>.",
  "Stand the plate in the solvent and <b>cover the beaker with a lid</b>.",
  "Let the solvent rise up the plate. Remove the plate <b>before the solvent reaches the top</b> and <b>mark the solvent front</b> in pencil.",
  "Dry the plate in a fume cupboard, then spray with <b>ninhydrin</b> (or view under <b>UV light</b>) to make the spots visible.",
  "Measure the distances and calculate <b>R<sub>f</sub> = distance moved by spot ÷ distance moved by solvent front</b>. Compare with known values."]},
 {t:"key",title:"The reason for each step",items:[
  "<b>Pencil</b>, not ink: ink would dissolve in the solvent and move up the plate.",
  "<b>Gloves:</b> amino acids from the skin would contaminate the plate.",
  "Solvent <b>below the line</b>: otherwise the spots would dissolve into the solvent in the beaker.",
  "<b>Lid:</b> to stop the solvent evaporating, so the beaker stays saturated with solvent vapour.",
  "<b>Ninhydrin or UV</b>: amino acids are colourless.",
  "<b>Why substances separate:</b> each has a different balance between its <b>solubility in the mobile phase</b> (solvent) and its <b>attraction (adsorption) to the stationary phase</b>.",
  "A <b>polar</b> stationary phase (silica) holds polar compounds more strongly, so they move less far (smaller R<sub>f</sub>, or longer retention time in a column). A more polar solvent moves polar compounds further.",
  "If two substances have the same R<sub>f</sub> in one solvent, turn the plate through 90° and run it in a <b>second solvent</b> (two-way chromatography).",
  "<b>Gas chromatography–mass spectrometry (GC-MS):</b> GC separates the components; the mass spectrometer identifies each one."],
  trap:"Measuring to the top of the plate instead of to the solvent front when calculating R<sub>f</sub>."},
 {t:"calc",title:"R<sub>f</sub> value",q:"On a TLC plate the solvent front is 8.0 cm from the start line and the centre of a spot is 2.7 cm from the start line.",
  steps:[
  {p:"Calculate the R<sub>f</sub> value of the spot.",a:0.34,tol:0.006,show:"2.7 ÷ 8.0 = 0.34"}]}],
 checks:[
 {q:"Why is a lid placed on the beaker during TLC?",opts:["To keep out light","To stop the solvent evaporating","To keep the plate upright","To stop the spots spreading"],a:1,why:"The atmosphere in the beaker must stay saturated with solvent vapour."},
 {q:"A non-polar solvent is used with a polar stationary phase. Which compound travels furthest?",opts:["The most polar compound","The least polar compound","The compound with the highest M<sub>r</sub>","They all travel the same distance"],a:1,why:"It is least attracted to the polar stationary phase and most soluble in the non-polar solvent."},
 {q:"In column chromatography with silica gel (polar) and hexane, why does cyclohexene have a shorter retention time than cyclohexanol?",opts:["Cyclohexene has a higher boiling point","Cyclohexanol is more polar (has an O–H group), so it is more strongly attracted to the silica","Cyclohexene reacts with the silica","Cyclohexanol is more soluble in hexane"],a:1,why:"Cyclohexanol can hydrogen bond to the polar stationary phase, so it is held back."}],
 exam:{q:"A peptide is hydrolysed and the amino acids are separated by thin-layer chromatography.<br>(a) State a reagent and conditions for the hydrolysis. [2]<br>(b) Explain why the start line is drawn in pencil and why the solvent level must be below it. [2]<br>(c) State why the amino acids separate. [1]<br>(d) Name a developing agent and state why it is needed. [2]",
  ms:["(concentrated / 6 mol dm⁻³) hydrochloric acid","heat (under reflux)","pencil does not dissolve in the solvent (ink would run)","so the amino acids do not dissolve into the solvent in the beaker","they have different solubilities in the solvent (mobile phase) / different attractions to the stationary phase","ninhydrin (or UV light)","the amino acids are colourless"]}}
],
quiz:[
{q:"In a reflux condenser, where should the cooling water enter?",opts:["At the top","At the bottom","Either end","Through the flask"],a:1,why:"In at the bottom so the jacket fills completely."},
{q:"Which technique is used to collect an aldehyde as it is formed from a primary alcohol?",opts:["Reflux","Distillation","Recrystallisation","Filtration"],a:1,why:"The aldehyde is distilled off so it is not oxidised further."},
{q:"What is the purpose of washing an organic liquid with sodium carbonate solution?",opts:["To dry it","To remove acid impurities","To remove the alkene","To increase the yield"],a:1,why:"The carbonate neutralises acids."},
{q:"Which is a suitable drying agent for an organic liquid?",opts:["Sodium carbonate solution","Anhydrous magnesium sulfate","Concentrated sulfuric acid","Distilled water"],a:1,why:"Anhydrous MgSO₄ or CaCl₂."},
{q:"In recrystallisation, which impurities are removed by the hot filtration?",opts:["Soluble impurities","Insoluble impurities","Water","The solvent"],a:1,why:"Soluble impurities stay in the solution when it is cooled."},
{q:"4.00 g of product is obtained. The theoretical yield is 6.40 g. What is the percentage yield?",opts:["160%","62.5%","37.5%","25.6%"],a:1,why:"4.00 ÷ 6.40 × 100 = 62.5%"},
{q:"A spot moves 3.0 cm and the solvent front moves 7.5 cm. What is the R<sub>f</sub> value?",opts:["2.5","0.40","0.25","4.5"],a:1,why:"3.0 ÷ 7.5 = 0.40"},
{q:"A solid melts over the range 128–133 °C. The data book value is 136 °C. What does this show?",opts:["It is pure","It is impure","It is a different compound","The thermometer is broken"],a:1,why:"Lower than the true value and over a range."}
]});</script>
<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
