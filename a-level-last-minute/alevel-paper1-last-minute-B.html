<style>

.score{font-size:1.6rem;font-weight:700;color:var(--brown)}svg{max-width:100%;height:auto;display:block;margin:6px auto}

file:"alevel-paper1-last-minute-B.html",
title:"A-level Paper 1 last-minute walkthrough B",

tabs:[
{name:"Born–Haber and enthalpy of solution",mins:5,why:"Lattice enthalpy questions were on six of the seven Paper 1s from 2017 to 2023, worth up to 16 marks. Expect a cycle calculation plus a short explanation.",
 seen:["Jun 17 (8)","Jun 18 (6)","Jun 19 (5)","2020 (10)","2021 (11)","Jun 23 (16)"],
 blocks:[
 {t:"key",title:"Definitions and rules",items:[
  "<b>Enthalpy of lattice formation:</b> the enthalpy change when one mole of a solid ionic compound is formed from its gaseous ions. (Dissociation is the reverse, so it has the opposite sign.)",
  "<b>Born–Haber:</b> ΔH<sub>f</sub> = atomisation of metal + ionisation energies + atomisation of non-metal + electron affinities + lattice formation.",
  "For MX₂ (such as MgCl₂) use <b>2 × atomisation of Cl</b> and <b>2 × electron affinity of Cl</b>. Atomisation of chlorine is for ½Cl₂ → Cl.",
  "<b>Enthalpy of solution</b> = lattice dissociation + sum of the hydration enthalpies of the ions.",
  "<b>Hydration enthalpy</b> is more exothermic for a smaller ion or a higher charge: the charge density is greater, so the ion attracts the δ− oxygen (or δ+ hydrogen) of water more strongly.",
  "<b>Perfect ionic model:</b> ions are point charges / perfect spheres with only electrostatic attraction. If the Born–Haber value is much bigger than the theoretical value, the bonding has <b>covalent character</b> (the ions are polarised)."],
  trap:"Using the electron affinity or the atomisation of chlorine once instead of twice for MgCl₂ or CaCl₂."},
 {t:"calc",title:"Born–Haber for MgCl₂",q:"Calculate the enthalpy of lattice formation of MgCl₂. <br>ΔH<sub>f</sub> MgCl₂ = −642 · atomisation Mg = +150 · 1st IE Mg = +736 · 2nd IE Mg = +1450 · atomisation Cl = +121 · electron affinity Cl = −364 (all kJ mol⁻¹)",
  steps:[
  {p:"Add up everything needed to make Mg²⁺(g): atomisation + 1st IE + 2nd IE.",a:2336,tol:0,show:"150 + 736 + 1450 = +2336"},
  {p:"Add up everything needed to make 2Cl⁻(g): 2 × atomisation + 2 × electron affinity.",a:-486,tol:0,show:"(2 × 121) + (2 × −364) = −486"},
  {p:"Lattice formation = ΔH<sub>f</sub> − (your two totals). Calculate it.",a:-2492,tol:0,u:" kJ mol⁻¹",show:"−642 − (2336 − 486) = −2492 kJ mol⁻¹"}]}],
 checks:[
 {q:"Lattice dissociation of LiCl = +846, hydration of Li⁺ = −519 and hydration of Cl⁻ = −364 kJ mol⁻¹. What is the enthalpy of solution of LiCl?",opts:["−37 kJ mol⁻¹","+37 kJ mol⁻¹","−1729 kJ mol⁻¹","+1 kJ mol⁻¹"],a:0,why:"846 − 519 − 364 = −37 kJ mol⁻¹"},
 {q:"Why is the enthalpy of hydration of Mg²⁺ more exothermic than that of Ca²⁺?",opts:["Mg²⁺ has more protons","Mg²⁺ is smaller, so it attracts the δ− O of water more strongly","Mg²⁺ has a higher charge","Ca²⁺ has more electrons to repel water"],a:1,why:"Same charge, but Mg²⁺ is smaller, so it has a greater charge density."},
 {q:"Which compound has the most covalent character (biggest difference between Born–Haber and perfect ionic model values)?",opts:["CsF","LiF","CsI","LiI"],a:3,why:"Small, polarising Li⁺ with large, easily polarised I⁻."}],
 exam:{q:"(a) Define enthalpy of lattice formation. [2]<br>(b) Calculate the electron affinity of bromine. [3]<br>ΔH<sub>f</sub> CaBr₂ = −683 · atomisation Ca = +193 · 1st IE Ca = +590 · 2nd IE Ca = +1150 · atomisation Br = +112 · lattice formation CaBr₂ = −2176 (all kJ mol⁻¹)<br>(c) The lattice enthalpy of silver iodide from a Born–Haber cycle is greater than the value from the perfect ionic model. Explain why. [2]",
  ms:["enthalpy change when one mole of a solid ionic compound is formed","from its gaseous ions","−683 = 193 + 590 + 1150 + (2 × 112) + 2EA − 2176","2EA = −664","EA = −332 kJ mol⁻¹","AgI has covalent character / the ions are polarised","so the bonding is stronger than purely ionic / the ions are not perfect spheres (point charges)"]}},

{name:"Entropy and Gibbs free energy",mins:4,why:"A ΔG calculation of 4 to 7 marks was on five Paper 1s in a row (2017 to 2021) and on Paper 3 in 2022. Two unit conversions decide most of the marks.",
 seen:["Jun 17 (6)","Jun 18 (6)","Jun 19 (4)","2020 (11)","2021 (9)","Jun 22 P3 (6)"],
 blocks:[
 {t:"key",title:"The rules",items:[
  "<b>ΔS = ΣS(products) − ΣS(reactants)</b>. Multiply each S by its number in the equation.",
  "<b>ΔG = ΔH − TΔS</b>. T must be in <b>kelvin</b> (°C + 273). ΔS must be in <b>kJ</b> K⁻¹ mol⁻¹ (÷ 1000).",
  "A reaction is <b>feasible when ΔG ≤ 0</b>.",
  "Temperature at which it just becomes feasible: <b>T = ΔH ÷ ΔS</b> (with ΔS in kJ, or ΔH × 1000).",
  "On a graph of ΔG (y) against T (x): <b>gradient = −ΔS</b> and <b>intercept = ΔH</b>.",
  "Gases have much higher entropy than solids: the particles are more disordered. More moles of gas made means ΔS is positive.",
  "The entropy of a perfect crystal is zero at 0 K."],
  trap:"Leaving ΔS in J K⁻¹ mol⁻¹ when ΔH is in kJ mol⁻¹. Divide ΔS by 1000 every time."},
 {t:"calc",title:"ΔG and the feasible temperature",q:"CaCO₃(s) → CaO(s) + CO₂(g)   ΔH = +178 kJ mol⁻¹<br>S / J K⁻¹ mol⁻¹: CaCO₃ = 93, CaO = 40, CO₂ = 214",
  steps:[
  {p:"Calculate ΔS in J K⁻¹ mol⁻¹.",a:161,tol:0,show:"(40 + 214) − 93 = +161 J K⁻¹ mol⁻¹"},
  {p:"Calculate ΔG at 298 K in kJ mol⁻¹.",a:130.0,tol:0.3,u:" kJ mol⁻¹",show:"178 − (298 × 0.161) = +130 kJ mol⁻¹ (positive, so not feasible at 298 K)"},
  {p:"Calculate the temperature, in K, at which the reaction becomes feasible.",a:1106,tol:3,u:" K",show:"T = 178 ÷ 0.161 = 1106 K"}]}],
 checks:[
 {q:"A reaction is exothermic and has a negative entropy change. When is it feasible?",opts:["At all temperatures","At no temperature","Only below a certain temperature","Only above a certain temperature"],a:2,why:"ΔH is negative and −TΔS is positive. ΔG is only negative when T is small."},
 {q:"A graph of ΔG against T is a straight line with gradient +0.20 kJ K⁻¹ mol⁻¹. What is ΔS?",opts:["+200 J K⁻¹ mol⁻¹","−200 J K⁻¹ mol⁻¹","+0.20 J K⁻¹ mol⁻¹","−0.20 J K⁻¹ mol⁻¹"],a:1,why:"Gradient = −ΔS, so ΔS = −0.20 kJ = −200 J K⁻¹ mol⁻¹"},
 {q:"Which reaction has a positive entropy change?",opts:["N₂(g) + 3H₂(g) → 2NH₃(g)","2Mg(s) + O₂(g) → 2MgO(s)","NH₄NO₃(s) → N₂O(g) + 2H₂O(g)","H₂O(g) → H₂O(l)"],a:2,why:"A solid forms three moles of gas, so disorder increases."}],
 exam:{q:"N₂(g) + 3H₂(g) → 2NH₃(g)   ΔH = −92 kJ mol⁻¹<br>S / J K⁻¹ mol⁻¹: N₂ = 192, H₂ = 131, NH₃ = 193<br>(a) Calculate ΔG at 500 K and use it to explain whether the reaction is feasible at this temperature. [5]<br>(b) Calculate the temperature at which ΔG = 0 [1]",
  ms:["ΔS = (2 × 193) − (192 + 3 × 131)","ΔS = −199 J K⁻¹ mol⁻¹","ΔG = −92 − (500 × −0.199)","ΔG = +7.5 kJ mol⁻¹","not feasible because ΔG is positive","T = 92 ÷ 0.199 = 462 K"]}},

{name:"Electrode potentials and cells",mins:4,why:"Electrode potentials were on six of the seven Paper 1s, and commercial cells or fuel cells have been on every paper since 2020.",
 seen:["Jun 17 (9)","Jun 18 (8)","2020 (6)","2021 (15)","Jun 22 (6)","Jun 23 (10)"],
 blocks:[
 {t:"key",title:"Reading a table of E° values",items:[
  "Half-equations are written as reductions. The <b>more positive E°</b> half-cell is <b>reduced</b> (goes forwards). The more negative one is reversed (oxidised).",
  "<b>EMF = E°(right) − E°(left)</b> = E°(reduced) − E°(oxidised). A working cell has a positive EMF.",
  "<b>Strongest oxidising agent:</b> the species on the <b>left</b> of the most positive half-equation. <b>Strongest reducing agent:</b> the species on the <b>right</b> of the most negative one.",
  "<b>Cell representation:</b> oxidation on the left. Reduced form | oxidised form || oxidised form | reduced form. Example: Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s). Use Pt when there is no solid metal, with a comma between ions in the same phase.",
  "<b>Standard hydrogen electrode:</b> H₂ gas at 100 kPa, 1.00 mol dm⁻³ H⁺(aq), 298 K, platinum electrode. E° = 0.00 V.",
  "<b>Salt bridge:</b> allows ions to move to complete the circuit (KNO₃ is used because it does not react).",
  "<b>Hydrogen fuel cell:</b> overall 2H₂ + O₂ → 2H₂O. It does not need recharging because the fuel is supplied continuously.",
  "<b>Lithium cell:</b> positive electrode Li⁺ + CoO₂ + e⁻ → LiCoO₂; negative electrode Li → Li⁺ + e⁻"],
  trap:"Multiplying E° by the numbers used to balance the electrons. E° values are never multiplied."},
 {t:"model",q:"Use E° values to explain why Fe³⁺ ions oxidise I⁻ ions. (Fe³⁺/Fe²⁺ = +0.77 V, I₂/I⁻ = +0.54 V) [2]",a:[
  "E°(Fe³⁺/Fe²⁺) is more positive than E°(I₂/I⁻)  (or EMF = +0.23 V, which is positive).",
  "So Fe³⁺ is reduced and I⁻ is oxidised: 2Fe³⁺ + 2I⁻ → 2Fe²⁺ + I₂"]}],
 checks:[
 {q:"Zn²⁺/Zn = −0.76 V and Ag⁺/Ag = +0.80 V. What is the EMF of the cell Zn | Zn²⁺ || Ag⁺ | Ag?",opts:["+0.04 V","+1.56 V","−1.56 V","+2.36 V"],a:1,why:"0.80 − (−0.76) = +1.56 V. Do not double the silver value."},
 {q:"Cl₂/Cl⁻ = +1.36 V, Fe³⁺/Fe²⁺ = +0.77 V, Zn²⁺/Zn = −0.76 V. Which is the strongest reducing agent?",opts:["Cl₂","Cl⁻","Zn²⁺","Zn"],a:3,why:"The species on the right of the most negative half-equation."},
 {q:"The concentration of Cu²⁺ in a Cu²⁺/Cu half-cell is decreased. What happens to its electrode potential?",opts:["It becomes more positive","It becomes less positive","It does not change","It becomes zero"],a:1,why:"Cu²⁺ + 2e⁻ ⇌ Cu moves to the left, releasing electrons, so E becomes less positive."}],
 exam:{q:"E° / V:   Cl₂ + 2e⁻ → 2Cl⁻  +1.36   ·   Fe³⁺ + e⁻ → Fe²⁺  +0.77   ·   I₂ + 2e⁻ → 2I⁻  +0.54   ·   Zn²⁺ + 2e⁻ → Zn  −0.76<br>(a) Give the conventional representation of the cell made from the Zn²⁺/Zn and Fe³⁺/Fe²⁺ half-cells and calculate its EMF. [3]<br>(b) Explain why Fe³⁺ ions oxidise iodide ions but do not oxidise chloride ions. [2]<br>(c) State the conditions needed for a hydrogen electrode to have E° = 0.00 V [2]",
  ms:["Zn(s) | Zn²⁺(aq) on the left with a double line (salt bridge)","|| Fe³⁺(aq), Fe²⁺(aq) | Pt(s) on the right","EMF = 0.77 − (−0.76) = +1.53 V","E°(Fe³⁺/Fe²⁺) is more positive than E°(I₂/I⁻), so Fe³⁺ can oxidise I⁻","E°(Fe³⁺/Fe²⁺) is less positive than E°(Cl₂/Cl⁻), so Fe³⁺ cannot oxidise Cl⁻","100 kPa (pressure of hydrogen) and 298 K","1.00 mol dm⁻³ H⁺ (HCl)"]}},

  "5. Give the answer to the number of significant figures asked for (usually 3).",

  "<b>2S₂O₃²⁻ + I₂ → 2I⁻ + S₄O₆²⁻</b>   (2 : 1)",

 {t:"calc",title:"Percentage of iron in a wire",q:"1.40 g of iron wire is dissolved in excess sulfuric acid and made up to 250 cm³. 25.0 cm³ of this solution needs 22.50 cm³ of 0.0200 mol dm⁻³ KMnO₄. (A<sub>r</sub> Fe = 55.8) <br><small>Type standard form like this: 4.5e-4</small>",

  {p:"Calculate the moles of Fe²⁺ in the 250 cm³ flask.",a:2.25e-2,u:" mol",show:"2.25 × 10⁻³ × 10 = 2.25 × 10⁻² mol"},

{name:"Shapes and melting points",mins:4,why:"Drawing a shape with its bond angle, or explaining a melting point from structure and bonding, has been on almost every Paper 1. Three of the 6-mark questions since 2018 were on exactly this.",
 seen:["Jun 18 (4 + 6)","Jun 19 (11)","2020 (6)","2021 (4)","Jun 22 (3 + 6)","Jun 23 (2)"],
 blocks:[
 {t:"tbl",title:"Shapes: count the electron pairs around the central atom",head:["Bonding pairs","Lone pairs","Shape","Bond angle","Example"],rows:[
  ["2","0","linear","180°","BeCl₂, CO₂"],
  ["3","0","trigonal planar","120°","BF₃"],
  ["4","0","tetrahedral","109.5°","CH₄, NH₄⁺"],
  ["3","1","pyramidal","107°","NH₃, PF₃"],
  ["2","2","bent (V-shaped)","104.5°","H₂O, NH₂⁻"],

  "Electron pairs repel to get <b>as far apart as possible</b>.",
  "<b>Lone pairs repel more than bonding pairs</b>, so each lone pair reduces the bond angle by about 2.5°."]},
 {t:"model",q:"Explain why silicon dioxide has a much higher melting point than phosphorus(V) oxide. [4]",a:[

  "P₄O₁₀ is <b>simple molecular</b>.",
  "It has weak <b>van der Waals forces between molecules</b>, which need little energy to overcome."]},
 {t:"key",title:"Structure and bonding: name the particles and the force",items:[

  "<b>Simple molecular:</b> compare the intermolecular forces. Hydrogen bonds (N–H, O–H, F–H) > permanent dipole–dipole > van der Waals. Bigger molecules have more electrons, so stronger van der Waals forces."],

 checks:[
 {q:"What is the shape of the ClF₂⁺ ion?",opts:["linear","bent (V-shaped)","trigonal planar","pyramidal"],a:1,why:"Cl: 7 + 2 − 1 = 8 electrons = 4 pairs: 2 bonding and 2 lone. Bent, about 104.5°."},
 {q:"Why does chlorine (Cl₂) have a higher melting point than hydrogen chloride (HCl)?",opts:["Cl₂ has stronger covalent bonds","Cl₂ has hydrogen bonds","Cl₂ has more electrons, so stronger van der Waals forces between molecules","HCl is ionic"],a:2,why:"The stronger van der Waals forces in Cl₂ outweigh the permanent dipole–dipole forces in HCl."},
 {q:"Which molecule has a permanent dipole?",opts:["BF₃","CCl₄","NH₃","CO₂"],a:2,why:"NH₃ is pyramidal, so the bond dipoles do not cancel. The others are symmetrical."}],
 exam:{q:"(a) Draw the shape of a PF₃ molecule and of an XeF₄ molecule, including any lone pairs. Name each shape. [4]<br>(b) Explain why sodium chloride has a much higher melting point than hydrogen chloride. [3]",
  ms:["PF₃ drawn with three bonds and one lone pair on P","PF₃ is pyramidal (trigonal pyramidal)","XeF₄ drawn with four bonds in a plane and two lone pairs (above and below)","XeF₄ is square planar","NaCl is ionic / has a giant ionic lattice with strong electrostatic attraction between oppositely charged ions","HCl is simple molecular with (weak) permanent dipole–dipole forces (and van der Waals forces) between molecules","much more energy is needed to overcome the ionic bonding than the intermolecular forces"]}}
],
quiz:[
{q:"Which equation represents the enthalpy of lattice formation of sodium chloride?",opts:["Na(s) + ½Cl₂(g) → NaCl(s)","Na⁺(g) + Cl⁻(g) → NaCl(s)","NaCl(s) → Na⁺(aq) + Cl⁻(aq)","Na(g) + Cl(g) → NaCl(s)"],a:1,why:"One mole of solid from its gaseous ions."},
{q:"Which equation represents the enthalpy of atomisation of iodine?",opts:["I₂(s) → 2I(g)","½I₂(s) → I(g)","I₂(g) → 2I(g)","½I₂(g) → I(g)"],a:1,why:"One mole of gaseous atoms from the element in its standard state (solid)."},
{q:"ΔH = +50 kJ mol⁻¹ and ΔS = +100 J K⁻¹ mol⁻¹. Above which temperature is the reaction feasible?",opts:["0.5 K","2 K","500 K","5000 K"],a:2,why:"T = 50 ÷ 0.100 = 500 K"},
{q:"In the cell Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s), which way do electrons flow in the external circuit?",opts:["From copper to zinc","From zinc to copper","Through the salt bridge","They do not flow"],a:1,why:"Zinc is oxidised (left-hand electrode), so electrons leave the zinc."},
{q:"In the reaction MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 4H₂O + 5Fe³⁺, 2.0 × 10⁻⁴ mol of MnO₄⁻ reacts with how many moles of Fe²⁺?",opts:["4.0 × 10⁻⁵","2.0 × 10⁻⁴","1.0 × 10⁻³","1.6 × 10⁻³"],a:2,why:"× 5"},
{q:"What is the bond angle in NH₃?",opts:["120°","109.5°","107°","104.5°"],a:2,why:"Three bonding pairs and one lone pair: 109.5 − 2.5 = 107°"},

<script>
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const S={mc:{},ex:{},qz:{},done:{}};let cur=0;const N=WT.tabs.length;
document.getElementById('ttl').innerHTML=WT.title+'<small>'+WT.sub+'</small>';
// timer
let left=1500,tick=null;const clock=document.getElementById('clock'),go=document.getElementById('go');
function draw(){const a=Math.abs(left),m=Math.floor(a/60),s=a%60;clock.textContent=(left<0?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');clock.className=left<0?'over':''}
go.onclick=()=>{if(tick){clearInterval(tick);tick=null;go.textContent='Resume'}else{tick=setInterval(()=>{left--;draw()},1000);go.textContent='Pause'}};
function nav(){const n=document.getElementById('nav');n.innerHTML='';
 const names=WT.tabs.map((t,i)=>(i+1)+'. '+t.name).concat(['Final quiz','My score']);
 names.forEach((nm,i)=>{const b=E('button',(i===cur?'on ':'')+(S.done[i]?'done':''),nm);b.onclick=()=>show(i);n.appendChild(b)})}
function mcq(q,store,id){const c=E('div','card');c.appendChild(E('div',null,'<b>'+q.q+'</b>'));const o=E('div','opts'),fb=E('div','fb hid');
 q.opts.forEach((t,i)=>{const b=E('button',null,t);b.onclick=()=>{if(!(id in store))store[id]=(i===q.a)?1:0;
  if(i===q.a){b.className='right';fb.innerHTML='✔ '+(q.why||'Correct.');fb.className='fb';[...o.children].forEach(x=>x.disabled=true)}
  else{b.className='wrong';b.disabled=true;fb.innerHTML='✘ Not quite – try again.';fb.className='fb'}};o.appendChild(b)});
 c.appendChild(o);c.appendChild(fb);return c}
function calc(b){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Step by step</span>'+b.title));c.appendChild(E('div',null,b.q));
 const steps=b.steps.map((s,i)=>{const d=E('div','step'+(i===0?' show':''));d.appendChild(E('div',null,'<b>Step '+(i+1)+':</b> '+s.p));
  const inp=E('input');inp.inputMode='decimal';inp.setAttribute('aria-label','answer for step '+(i+1));const ck=E('button',null,'Check'),tell=E('button',null,'Show me');
  const row=E('div');row.style.marginTop='6px';row.append(inp,document.createTextNode((s.u||'')+' '),ck,document.createTextNode(' '),tell);d.appendChild(row);
  d.appendChild(E('div','work',s.show));
  const nxt=()=>{if(steps[i+1])steps[i+1].classList.add('show')};
  const chk=()=>{const v=parseFloat(inp.value.replace(/,/g,'').replace('×10^','e'));const tol=s.tol!=null?s.tol:Math.abs(s.a)*0.006;
   if(!isNaN(v)&&Math.abs(v-s.a)<=tol){d.className='step show ok';nxt()}else d.className='step show no'};
  ck.onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};tell.onclick=()=>{d.className='step show told';nxt()};return d});
 steps.forEach(s=>c.appendChild(s));return c}
function graph(g){const W=340,H=230,L=44,B=36,T=10,R=10,pw=W-L-R,ph=H-T-B,X=x=>L+x/g.xmax*pw,Y=y=>T+ph-y/g.ymax*ph;let s='<svg viewBox="0 0 '+W+' '+H+'" width="460" role="img" aria-label="'+(g.cap||'graph')+'">';
 for(let i=0;i<=g.xn;i++){const x=g.xmax*i/g.xn;s+='<line x1="'+X(x)+'" y1="'+T+'" x2="'+X(x)+'" y2="'+(T+ph)+'" stroke="#e2d3b8"/><text x="'+X(x)+'" y="'+(T+ph+13)+'" font-size="10" text-anchor="middle" fill="#5b3a1e">'+x+'</text>'}
 for(let i=0;i<=g.yn;i++){const y=g.ymax*i/g.yn;s+='<line x1="'+L+'" y1="'+Y(y)+'" x2="'+(L+pw)+'" y2="'+Y(y)+'" stroke="#e2d3b8"/><text x="'+(L-5)+'" y="'+(Y(y)+3)+'" font-size="10" text-anchor="end" fill="#5b3a1e">'+y+'</text>'}
 let p='';for(let i=0;i<=80;i++){const x=g.xmax*i/80;p+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(g.f(x)).toFixed(1)}
 s+='<path d="'+p+'" fill="none" stroke="#5b3a1e" stroke-width="2.2"/>';
 if(g.tan){const[a,b]=g.tan;s+='<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#c0392b" stroke-width="1.8"/>'+
  '<path d="M'+X(a[0])+' '+Y(a[1])+'H'+X(b[0])+'V'+Y(b[1])+'" fill="none" stroke="#c0392b" stroke-dasharray="4 3"/>'+
  '<circle cx="'+X(g.at)+'" cy="'+Y(g.f(g.at))+'" r="3.5" fill="#c0392b"/>'}
 s+='<text x="'+(L+pw/2)+'" y="'+(H-4)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.xl+'</text><text transform="rotate(-90 11 '+(T+ph/2)+')" x="11" y="'+(T+ph/2)+'" font-size="11" text-anchor="middle" fill="#2e2218">'+g.yl+'</text></svg>';
 const c=E('div','card',s);if(g.cap)c.appendChild(E('div','why',g.cap));return c}
function exam(x,i){const c=E('div','card');const tot=x.ms.length;c.appendChild(E('h3',null,'<span class="tag">Exam question</span>Answer on paper, then mark it yourself &nbsp;['+tot+' marks]'));
 c.appendChild(E('div',null,x.q));const btn=E('button',null,'Show mark scheme');btn.style.marginTop='10px';const ms=E('div','hid'),out=E('div','fb','Tick each point you got: <b>0 / '+tot+'</b>');
 x.ms.forEach(m=>{const l=E('label','mp');const cb=E('input');cb.type='checkbox';cb.onchange=()=>{const n=ms.querySelectorAll('input:checked').length;S.ex[i]=n;out.innerHTML='Tick each point you got: <b>'+n+' / '+tot+'</b>'};l.append(cb,E('span',null,m));ms.appendChild(l)});
 ms.appendChild(out);btn.onclick=()=>{ms.className='';btn.className='hid';if(!(i in S.ex))S.ex[i]=0};c.append(btn,ms);return c}
function block(b){if(b.t==='calc')return calc(b);if(b.t==='graph')return graph(b);
 if(b.t==='key'){const c=E('div','card key');c.appendChild(E('h3',null,b.title));c.appendChild(E('ul',null,b.items.map(x=>'<li>'+x+'</li>').join('')));if(b.trap)c.appendChild(E('div','trap','⚠ <b>Mark loser:</b> '+b.trap));return c}
 if(b.t==='model'){const c=E('div','card');c.appendChild(E('h3',null,'<span class="tag">Model answer</span>'+b.q));c.appendChild(E('div','why','Say each point out loud first, then tap to reveal.'));const u=E('ul','reveal');b.a.forEach(x=>{const li=E('li',null,x);li.onclick=()=>li.className='on';u.appendChild(li)});c.appendChild(u);return c}
 if(b.t==='tbl'){const c=E('div','card');if(b.title)c.appendChild(E('h3',null,b.title));c.appendChild(E('table',null,'<tr>'+b.head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+b.rows.map(r=>'<tr>'+r.map(d=>'<td>'+d+'</td>').join('')+'</tr>').join('')));return c}
 return E('div','card',(b.title?'<h3>'+b.title+'</h3>':'')+b.h)}
function foot(m,i){const f=E('div','next');const a=E('button',null,'← Back');a.onclick=()=>show(i-1);if(i===0)a.style.visibility='hidden';
 const b=E('button','big',i<N?'Done – next →':'See my score →');b.onclick=()=>{S.done[i]=1;show(i+1)};f.append(a,b);m.appendChild(f)}
function show(i){cur=i;nav();const m=document.getElementById('main');m.innerHTML='';window.scrollTo(0,0);
 if(i<N){const t=WT.tabs[i];m.appendChild(E('h2',null,(i+1)+'. '+t.name+' <span class="pill">about '+t.mins+' min</span>'));m.appendChild(E('p','why',t.why));
  m.appendChild(E('div','pills',t.seen.map(s=>'<span class="pill">'+s+'</span>').join('')));
  t.blocks.forEach(b=>m.appendChild(block(b)));
  if(t.checks.length){m.appendChild(E('h3',null,'Quick checks'));t.checks.forEach((q,j)=>m.appendChild(mcq(q,S.mc,i+'-'+j)))}
  if(t.exam)m.appendChild(exam(t.exam,i));foot(m,i)}
 else if(i===N){m.appendChild(E('h2',null,'Final quiz <span class="pill">about 4 min</span>'));m.appendChild(E('p','why','No notes. Only your first click on each question counts.'));
  WT.quiz.forEach((q,j)=>m.appendChild(mcq(q,S.qz,j)));foot(m,i)}
 else{const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);const mcT=WT.tabs.reduce((a,t)=>a+t.checks.length,0),exT=WT.tabs.reduce((a,t)=>a+(t.exam?t.exam.ms.length:0),0);
  m.appendChild(E('h2',null,'My score'));
  m.appendChild(E('div','card','<table><tr><th>Section</th><th>Score</th></tr><tr><td>Quick checks (first try)</td><td class="score">'+sum(S.mc)+' / '+mcT+'</td></tr><tr><td>Exam questions (self-marked)</td><td class="score">'+sum(S.ex)+' / '+exT+'</td></tr><tr><td>Final quiz (first try)</td><td class="score">'+sum(S.qz)+' / '+WT.quiz.length+'</td></tr></table>'));
  let weak=WT.tabs.map((t,i)=>{let got=0,tot=t.checks.length+(t.exam?t.exam.ms.length:0);t.checks.forEach((q,j)=>got+=S.mc[i+'-'+j]||0);got+=S.ex[i]||0;return{n:t.name,p:tot?got/tot:1}}).filter(x=>x.p<0.7);
  m.appendChild(E('div','card key','<h3>What to do next</h3>'+(weak.length?'<p>Go back over these before the exam:</p><ul>'+weak.map(w=>'<li>'+w.n+' ('+Math.round(w.p*100)+'%)</li>').join('')+'</ul>':'<p>Nothing below 70%. Try the other walkthrough for this paper.</p>')+'<p>Any exam question you dropped marks on: write the question out, leave a space, and answer it again tomorrow without looking.</p>'))}}
show(0);
</script></body></html>
