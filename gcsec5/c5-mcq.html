gy from the surroundings, so they feel cold."}, {"s": "New question", "q": "Why is a polystyrene cup used in temperature change experiments?", "o": [{"t": "It is a good insulator, so it reduces energy transfer to the surroundings.", "c": 1, "f": ""}, {"t": "It is cheap.", "c": 0, "f": "That's not the scientific reason."}, {"t": "It conducts heat well.", "c": 0, "f": "Good conductors lose energy quickly, which is the opposite of what you want."}, {"t": "It does not react with the chemicals.", "c": 0, "f": ""}], "e": " Less energy lost means a more accurate temperature change."}, {"s": "AQA Nov 2020 · 1F", "q": "Hydrogen reacts with oxygen and releases energy. What is the product?", "o": [{"t": "Water", "c": 1, "f": ""}, {"t": "Hydrogen oxide gas", "c": 0, "f": ""}, {"t": "Carbon dioxide", "c": 0, "f": "There is no carbon in the reactants."}, {"t": "Hydrogen peroxide", "c": 0, "f": ""}], "e": " hydrogen + oxygen → water. It is exothermic."}, {"s": "New question", "q": "On a reaction profile for an endothermic reaction, where are the products?", "o": [{"t": "Higher in energy than the reactants", "c": 1, "f": ""}, {"t": "Lower in energy than the reactants", "c": 0, "f": "That's exothermic."}, {"t": "At the same energy as the reactants", "c": 0, "f": ""}], "e": " Energy is taken in, so the products end up with more energy."}, {"s": "AQA Nov 2020 · 1F", "q": "A student adds citric acid to sodium hydrogencarbonate solution and measures the temperature. What is the dependent variable?", "o": [{"t": "Temperature of the solution", "c": 1, "f": ""}, {"t": "Mass of citric acid", "c": 0, "f": "This is changed on purpose, so it's the independent variable."}, {"t": "Volume of solution", "c": 0, "f": "This is kept the same, so it's a control variable."}], "e": " The dependent variable is the one you measure."}, {"s": "AQA Nov 2021 · 1F", "q": "In an investigation of different metals reacting with 50 cm<sup>3</sup> of hydrochloric acid, what type of variable is the volume of acid?", "f": ""}], "e": " The arrow must show direction: upwards from the reactants level to the top of the curve."}, {"s": "New question", "q": "In an endothermic reaction, which is true about bond energies?", "o": [{"t": "The energy needed to break bonds is greater than the energy released making bonds.", "c": 1, "f": ""}, {"t": "The energy released making bonds is greater than the energy needed to break bonds.", "c": 0, "f": "That's exothermic."}, {"t": "No bonds are broken.", "c": 0, "f": ""}, {"t": "Bond energies are always equal.", "c": 0, "f": ""}], "e": " More energy goes in than comes out, so the products are higher in energy."}, {"s": "New question", "q": "On a reaction profile, the reactants are at 100 kJ, the peak at 250 kJ and the products at 40 kJ. What is the activation energy?", "o": [{"t": "150 kJ", "c": 1, "f": ""}, {"t": "250 kJ", "c": 0, "f": "Measure from the reactants level, not from zero."}, {"t": "210 kJ", "c": 0, "f": "That is measured from the products, which is the reverse reaction."}, {"t": "60 kJ", "c": 0, "f": "60 kJ is the energy released."}], "e": " Activation energy = peak − reactants = 250 − 100 = 150 kJ."}, {"s": "New question", "q": "Which is true for an endothermic reaction?", "o": [{"t": "The temperature of the surroundings decreases.", "c": 1, "f": ""}, {"t": "The temperature of the surroundings increases.", "c": 0, "f": ""}, {"t": "The products have less energy than the reactants.", "c": 0, "f": ""}, {"t": "It never needs activation energy.", "c": 0, "f": ""}], "e": " Energy is taken in from the surroundings, so they get colder."}, {"s": "New question", "q": "Why is the solution stirred before the temperature is read?", "o": [{"t": "So the temperature is the same throughout and all the solid reacts or dissolves", "c": 1, "f": ""}, {"t": "To make the reaction exothermic", "c": 0, "f": ""}, {"t": "To add energy", "c": 0, "f": ""}, {"t": "To stop the reaction", "c": 0, "f": ""}], "e": " Stirring mixes the reactants and avoids hot or cold 53. Made: 6x. 6x − 2253 = 93 → 6x = 2346 → x = 391."}, {"s": "New question", "q": "N<sub>2</sub> + O<sub>2</sub> → 2NO. N≡N = 945, O=O = 498, N=O = 607 kJ/mol. Which statement is correct?", "o": [{"t": "It absorbs 229 kJ/mol more energy than it releases (endothermic).", "c": 1, "f": ""}, {"t": "It releases 229 kJ/mol more energy than it absorbs (exothermic).", "c": 0, "f": "Broken (1443) is greater than made (1214)."}, {"t": "It absorbs 836 kJ/mol more energy than it releases.", "c": 0, "f": "2 NO molecules form, so there are 2 N=O bonds."}, {"t": "It releases 2050 kJ/mol.", "c": 0, "f": ""}], "e": " Broken: 945 + 498 = 1443. Made: 2 × 607 = 1214. 1443 − 1214 = 229 absorbed."}, {"s": "New question", "q": "A reaction has an activation energy of 150 kJ/mol and releases 60 kJ/mol overall. What is the activation energy of the reverse reaction?", "o": [{"t": "210 kJ/mol", "c": 1, "f": ""}, {"t": "150 kJ/mol", "c": 0, "f": "The reverse reaction starts from the lower products level."}, {"t": "90 kJ/mol", "c": 0, "f": "Add, don't subtract. The products are below the reactants."}, {"t": "60 kJ/mol", "c": 0, "f": ""}], "e": " From the products up to the same peak = 150 + 60 = 210 kJ/mol."}, {"s": "Adapted from AQA Nov 2020 · 1H", "q": "A car needs 58 MJ to travel 100 km. Reacting 1 mole of hydrogen with oxygen releases 290 kJ. How many moles of hydrogen are needed?", "o": [{"t": "200", "c": 1, "f": ""}, {"t": "0.2", "c": 0, "f": "Convert to the same units: 58 MJ = 58 000 kJ."}, {"t": "5", "c": 0, "f": "Divide the total energy by the energy per mole."}, {"t": "1.68 × 10<sup>7</sup>", "c": 0, "f": "Divide, don't multiply."}], "e": " 58 000 kJ ÷ 290 kJ/mol = 200 mol."}, {"s": "New question", "q": "The same mass of ammonium nitrate is dissolved in twice the volume of water. How does the temperature change compare?", "o": [{"t": "About half as big", "c": 1, "f": ""}, {"t": "The same", "c": 0, "f": ""}, {"t": "About twice as big", "c": 0, "f": "The same energy is spread through twice as much water."}, {"t": "Zero", "c": 0, "f": ""}], "e": " The same energy is taken from twice the mass of water, so the temperature changes by about half as much."}, {"s": "New question", "q": "Equal amounts of metal powder are added to copper sulfate solution. Which gives the greatest temperature rise?", "o": [{"t": "Magnesium + copper sulfate", "c": 1, "f": ""}, {"t": "Zinc + copper sulfate", "c": 0, "f": "Zinc reacts, but it's less reactive than magnesium."}, {"t": "Copper + magnesium sulfate", "c": 0, "f": "Copper is less reactive than magnesium, so there is no reaction."}, {"t": "Magnesium + zinc sulfate", "c": 0, "f": "This reacts, but zinc and magnesium are closer in reactivity than copper and magnesium."}], "e": " The bigger the difference in reactivity, the more energy is released."}, {"s": "New question", "q": "Sodium carbonate is added in portions to hydrochloric acid until the sodium carbonate is in excess. How does the temperature change?", "o": [{"t": "It rises, then stops rising once all the acid has reacted.", "c": 1, "f": ""}, {"t": "It rises steadily the whole time.", "c": 0, "f": "Once the acid is used up, extra sodium carbonate has nothing to react with."}, {"t": "It falls the whole time.", "c": 0, "f": "The reaction is exothermic."}, {"t": "It stays the same.", "c": 0, "f": ""}], "e": " The energy released depends on the amount of acid. Once the acid runs out, the temperature levels off and then slowly falls."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "The lowest temperatures for 8.0 g of ammonium nitrate were 16.2, 16.6, 16.8 and 16.4 °C. The water started at 20.0 °C. What was the mean temperature change?", "o": [{"t": "−3.5 °C", "c": 1, "f": ""}, {"t": "+3.5 °C", "c": 0, "f": "The temperature fell, so the change is negative (endothermic)."}, {"t": "−3.2 °C", "c": 0, "f": "That uses only the highest reading. Use the mean, 16.5 °C."}, {"t": "−16.5 °C", "c": 0, "f": "16.5 °C is the mean final temperature, not the change."}], "e": " Mean = 16.5 °C. Change = 16.5 − 20.0 = −3.5 °C."}]];

let store = {};
try { store = JSON.parse(localStorage.getItem("mcq-"+TOPIC) || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("mcq-"+TOPIC, JSON.stringify(store)); } catch(e) {} }

const orders = DATA.map(set => set.map(q => shuffle(q.o.map((_,i)=>i))));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur = 0;
const tabs = document.getElementById("tabs"), main = document.getElementById("main");

function levelScore(l){
  const ans = store[l] || {}; let s=0, n=0;
  DATA[l].forEach((q,i)=>{ if(ans[i]!==undefined){ n++; if(q.o[ans[i]].c) s++; } });
  return {s,n};
}
function drawTabs(){
  tabs.innerHTML = "";
  LEVELS.forEach((L,l)=>{
    const b = document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", l===cur);
    b.style.setProperty("--c", L.col);
    const {s,n} = levelScore(l);
    b.innerHTML = `<span class="sc">${n? s+"/10":""}</span><span class="lv">${L.name}</span><span class="tier">${L.tier}</span>`;
    b.onclick = ()=>{ cur=l; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
}
function render(){
  const L = LEVELS[cur]; document.body.style.setProperty("--c", L.col);
  drawTabs();
  const ans = store[cur] || {};
  let h = `<div class="intro"><b>${L.name} · ${L.tier}.</b> ${L.intro} Your first click counts.</div>`;
  DATA[cur].forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="src">${q.s}</span></div><div class="stem">${q.q}</div><div class="opts">`;
    orders[cur][i].forEach((oi,k)=>{
      const o = q.o[oi]; let cls="";
      if(ans[i]!==undefined){ if(o.c) cls="right"; else if(ans[i]===oi) cls="wrong"; }
      h += `<button class="opt ${cls}" data-q="${i}" data-o="${oi}" ${ans[i]!==undefined?"disabled":""}><span class="let">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
    });
    h += `</div><div class="fb" id="fb${i}"></div></div>`;
  });
  h += `<div class="done" id="done"></div>`;
  main.innerHTML = h;
  main.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> choose(+b.dataset.q, +b.dataset.o));
  DATA[cur].forEach((q,i)=>{ if(ans[i]!==undefined) showFb(i, ans[i]); });
  update();
}
function choose(i, oi){
  store[cur] = store[cur] || {};
  if(store[cur][i]!==undefined) return;
  store[cur][i] = oi; save();
  const box = document.getElementById("q"+i);
  box.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true; const o = DATA[cur][i].o[+b.dataset.o];
    if(o.c) b.classList.add("right"); else if(+b.dataset.o===oi) b.classList.add("wrong");
  });
  showFb(i, oi); update(); drawTabs();
}
function showFb(i, oi){
  const q = DATA[cur][i], o = q.o[oi], fb = document.getElementById("fb"+i);
  const right = q.o.find(x=>x.c);
  fb.className = "fb show " + (o.c ? "ok" : "no");
  fb.innerHTML = o.c
    ? `<b>Correct.</b>${q.e}`
    : `<b>Not quite – the answer is: ${right.t}</b>${o.f ? o.f+" " : ""}${q.e}`;
}
function update(){
  const {s,n} = levelScore(cur);
  document.getElementById("score").textContent = `${s} / 10`;
  document.getElementById("answered").textContent = `${n} answered`;
  document.getElementById("prog").style.width = (n*10)+"%";
  const done = document.getElementById("done");
  if(n===10){
    const ans = store[cur]; const wrong = DATA[cur].map((q,i)=>({q,i})).filter(x=>!x.q.o[ans[x.i]].c);
    let h = `<h2>${LEVELS[cur].name} done: ${s} / 10</h2>`;
    if(!wrong.length){ h += `<p>Full marks. ${cur<3 ? "Try "+LEVELS[cur+1].name+" next." : "Excellent work."}</p>`; }
    else {
      h += `<p>Copy these into your fix-it table: write the question in column 1, leave column 2 blank to answer next time, and copy the correct answer into column 3.</p>
      <table class="fix"><tr><th>Question</th><th>My answer next time</th><th>Correct answer</th></tr>`;
      wrong.forEach(x=>{ h += `<tr><td>${x.q.q.replace(/<table[\s\S]*?<\/table>/g," [see table] ")}</td><td></td><td>${x.q.o.find(o=>o.c).t}</td></tr>`; });
      h += `</table>`;
    }
    done.innerHTML = h; done.classList.add("show");
  } else done.classList.remove("show");
}
document.getElementById("reset").onclick = ()=>{
  delete store[cur]; save(); orders[cur] = DATA[cur].map(q=>shuffle(q.o.map((_,i)=>i))); render();
};
render();
</script>
