<style>
/* Layout idea: four tabs, each one a single animated process diagram with a particle key above it,

:root{
  color-scheme:light;
  --bg:#eef1f6; --panel:#ffffff; --ink:#131c2b; --muted:#56637a; --line:#d3dae6;
  --accent:#2a4fc9; --accent-soft:#e3e9fb;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
header a{color:var(--accent);font-size:.9rem;text-decoration:none;flex-basis:100%}
header a:hover{text-decoration:underline}
h1{font-size:1.6rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;min-width:150px}
.tabs button b{font-size:1rem}
.tabs button span{font-size:.82rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button[aria-selected="true"] span{color:#fff;opacity:.85}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;margin-bottom:8px}
.head h2{margin:0;font-size:1.3rem;text-wrap:balance}
.head p{margin:0;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 8px;padding:0;list-style:none;font-size:.92rem}
.key li{display:flex;align-items:center;gap:7px}
.key i{width:13px;height:13px;border-radius:50%;flex:none;display:block}
.key i.sq{border-radius:3px}
.scroll{overflow-x:auto}
canvas{display:block;width:100%;min-width:760px;height:auto;aspect-ratio:1200/540;border-radius:10px;background:#f7f9fc}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px}
.seg{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.seg .lab{font-weight:600;margin-right:4px}
.controls button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 13px;min-height:38px}
.controls button:hover{border-color:var(--accent)}
.controls button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.controls button.primary{font-weight:650;min-width:92px}
.controls input[type=range]{width:220px;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0 0}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.stages button{text-align:left;width:100%;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px}
.stages button:hover{border-color:var(--accent)}
.stages button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.stages .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.9rem;flex:none}
.stages .hd{display:flex;align-items:center;gap:8px;font-weight:650;font-size:1.02rem}
.stages .tx{font-size:.93rem}

.el{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;font-size:.85rem;margin-right:4px}
.elN{background:#2a78d6}.elP{background:#eb6834}.elK{background:#6250d6}
h3{margin:0 0 8px;font-size:1.1rem}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}

details{border-bottom:1px solid var(--line);padding:9px 0}

.src{display:inline-block;font-size:.78rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:1px 9px;margin-left:6px;white-space:nowrap}
.mix label{display:flex;align-items:center;gap:6px;font-weight:600}
.mix input{width:110px}

.key img{display:block}
.cond label{display:flex;align-items:center;gap:6px;font-weight:600}
.cond input{width:150px}
.cond output{min-width:4.6em;font-variant-numeric:tabular-nums}

<script>
(function(){
"use strict";
var W=1200,H=540,cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var C={water:"#3d8fd9",solid:"#8a5a2b",micro:"#3aa83a",salt:"#f2a13a",vap:"#a9cdf0",big:"#6f6258",grit:"#3b3632",org:"#9a6a34",
       chem:"#d6339a",gas:"#f5c33b",dig:"#4a3524",wall:"#56637a",pipe:"#d9e8f4",pipeEdge:"#6b7890",ink:"#131c2b",muted:"#56637a",tank:"#dcedf9"};
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}

/* ---------- paths: points are [x,y,halfWidthX,halfWidthY] ---------- */
function mk(pts){
  var P=pts.map(function(a){var wx=a[2]==null?4:a[2];return {x:a[0],y:a[1],wx:wx,wy:a[3]==null?wx:a[3]};}),L=[0],i;
  for(i=1;i<P.length;i++)L.push(L[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));
  return {P:P,L:L,total:L[L.length-1]};
}
function at(p,s){
  var L=p.L,P=p.P,i=1;s=clamp(s,0,p.total);
  while(i<L.length-1&&s>L[i])i++;
  var a=P[i-1],b=P[i],t=(L[i]-L[i-1])?(s-L[i-1])/(L[i]-L[i-1]):0;
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,wx:a.wx+(b.wx-a.wx)*t,wy:a.wy+(b.wy-a.wy)*t};
}
function part(kind,path,v,o){
  var p={kind:kind,path:path,s:0,v:v*R(.85,1.15),ox:R(-1,1),oy:R(-1,1),a:1,ph:R(0,6.28),x:0,y:0};
  if(o)for(var k in o)p[k]=o[k];
  return p;
}
function stepParts(sc,dt){
  var ps=sc.ps,i,p,c;
  for(i=0;i<ps.length;i++){
    p=ps[i];
    if(p.fade){p.a-=dt*(p.fadeRate||1.1);if(p.a<=0)p.dead=true;}
    if(p.stuck)continue;
    c=at(p.path,p.s);
    p.s+=p.v*dt*clamp(9/Math.max(c.wx,c.wy),.2,1);
    if(p.on)p.on(p,sc);
    if(p.s>=p.path.total){if(p.end)p.end(p,sc);else p.dead=true;}
    c=at(p.path,p.s);
    p.x=c.x+p.ox*c.wx+Math.sin(sc.t*2.2+p.ph)*1.2;p.y=c.y+p.oy*c.wy+Math.cos(sc.t*1.9+p.ph)*1.2;
  }
  sc.ps=ps.filter(function(q){return !q.dead;});
}
/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function pipe(pts,w,col){
  w=w||12;ctx.lineJoin="round";ctx.lineCap="butt";
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=C.pipeEdge;ctx.lineWidth=w+4;ctx.stroke();ctx.strokeStyle=col||C.pipe;ctx.lineWidth=w;ctx.stroke();
}
function tank(x,y,w,h,fill,level){
  ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h);
  ctx.fillStyle=fill||C.tank;ctx.fillRect(x,y+(level||10),w,h-(level||10));
  ctx.strokeStyle=C.wall;ctx.lineWidth=5;ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w,y-6);ctx.stroke();
}
function txt(s,x,y,o){
  o=o||{};ctx.font=(o.b?"700 ":"500 ")+(o.size||15)+"px "+getComputedStyle(document.body).fontFamily;
  ctx.textAlign=o.al||"center";ctx.textBaseline="alphabetic";ctx.fillStyle=o.col||C.ink;
  String(s).split("\n").forEach(function(l,i){
    if(o.halo){ctx.strokeStyle=o.halo;ctx.lineWidth=5;ctx.lineJoin="round";ctx.strokeText(l,x,y+i*(o.size||15)*1.2);}
    ctx.fillText(l,x,y+i*(o.size||15)*1.2);});
}
function pin(n,x,y){ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(x,y,14,0,6.3);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();txt(n,x,y+5.5,{b:1,size:15,col:"#fff"});}
function arrow(x1,y1,x2,y2,col,w){
  var a=Math.atan2(y2-y1,x2-x1),h=9;ctx.strokeStyle=col;ctx.lineWidth=w||3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.moveTo(x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5));ctx.lineTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5));ctx.stroke();
}
function ground(y,col){ctx.fillStyle=col||"#dfe6dc";ctx.fillRect(0,y,W,H-y);}
function waves(x0,x1,y,t,col){
  ctx.strokeStyle=col||"#ffffff";ctx.lineWidth=2;ctx.globalAlpha=.7;ctx.beginPath();
  for(var x=x0;x<=x1;x+=6){var yy=y+Math.sin(x*.05+t*1.5)*2.5;if(x===x0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);}ctx.stroke();ctx.globalAlpha=1;
}
function flame(x,y,h,t,ph){
  var k=1+Math.sin(t*9+ph)*.15;
  ctx.fillStyle="#ff8a2e";ctx.beginPath();ctx.moveTo(x-h*.3,y);ctx.quadraticCurveTo(x-h*.35,y-h*.5*k,x,y-h*k);ctx.quadraticCurveTo(x+h*.35,y-h*.5*k,x+h*.3,y);ctx.fill();
  ctx.fillStyle="#ffd27a";ctx.beginPath();ctx.moveTo(x-h*.15,y);ctx.quadraticCurveTo(x-h*.16,y-h*.3*k,x,y-h*.55*k);ctx.quadraticCurveTo(x+h*.16,y-h*.3*k,x+h*.15,y);ctx.fill();
}
function cloud(x,y,s,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,16*s,0,6.3);ctx.arc(x+20*s,y-8*s,20*s,0,6.3);ctx.arc(x+44*s,y,16*s,0,6.3);ctx.fill();rr(x-6*s,y-2*s,56*s,18*s,9*s);ctx.fill();}
function capStuck(sc,kind,max){
  var st=sc.ps.filter(function(q){return q.stuck&&q.kind===kind&&!q.fade;});
  for(var i=0;i<st.length-max;i++)st[i].fade=true;
}

/* ---------- shared model and molecule drawing ---------- */
var COND={T:450,P:200,cat:true};
function yieldAt(T,P){return 100*P/(P+514*Math.exp((T-450)/89));}
function rateK(T,P,cat){return .25*Math.exp((T-450)/60)*Math.sqrt(P/200)*(cat?1:.08);}
var NC="#2a78d6";
function mol(k,x,y,a,s){
  s=s||1;var i;
  if(k==="n2"){ctx.fillStyle=NC;ctx.beginPath();ctx.arc(x+Math.cos(a)*4.2*s,y+Math.sin(a)*4.2*s,5*s,0,6.3);ctx.arc(x-Math.cos(a)*4.2*s,y-Math.sin(a)*4.2*s,5*s,0,6.3);ctx.fill();}
  else if(k==="h2"){ctx.fillStyle="#fff";ctx.strokeStyle="#5f6d85";ctx.lineWidth=1.3;for(i=-1;i<2;i+=2){ctx.beginPath();ctx.arc(x+i*Math.cos(a)*2.7*s,y+i*Math.sin(a)*2.7*s,3*s,0,6.3);ctx.fill();ctx.stroke();}}
  else{ctx.fillStyle="rgba(27,175,122,.3)";ctx.beginPath();ctx.arc(x,y,10.5*s,0,6.3);ctx.fill();
    ctx.fillStyle="#fff";ctx.strokeStyle="#5f6d85";ctx.lineWidth=1.3;for(i=0;i<3;i++){ctx.beginPath();ctx.arc(x+Math.cos(a+i*2.094)*6.2*s,y+Math.sin(a+i*2.094)*6.2*s,2.9*s,0,6.3);ctx.fill();ctx.stroke();}
    ctx.fillStyle=NC;ctx.beginPath();ctx.arc(x,y,5*s,0,6.3);ctx.fill();}
}
function drawPart(p,t){ctx.globalAlpha=clamp(p.a,0,1);mol(p.kind,p.x,p.y,p.ph+t*.6);ctx.globalAlpha=1;}
function vessel(x,y,w,h,fill,stroke){ctx.fillStyle=fill||"#fff";rr(x,y,w,h,10);ctx.fill();ctx.strokeStyle=stroke||C.wall;ctx.lineWidth=3.5;ctx.stroke();}
function line(a){ctx.beginPath();ctx.moveTo(a[0],a[1]);for(var i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.stroke();}
var GASPIPE="#eef2f7";

/* =====================================================================
   1. THE PROCESS
   ===================================================================== */
var S1=(function(){
  var IN=[[290,240,22,22],[330,240],[380,240],[380,70],[480,70],[480,96],[520,125,60,10]];
  var FEEDN=mk([[100,90,50,24],[170,90],[290,90],[290,200]].concat(IN));
  var FEEDH=mk([[100,370,50,24],[170,370],[290,370],[290,280]].concat(IN));
  var LOOP=mk([[520,125,60,10],[520,245,62,58],[520,375,60,10],[520,402],[520,460],[660,460],[660,360],[720,360],[810,350,68,28]]);
  var REC=mk([[810,350,68,28],[810,300,5],[810,50],[560,50],[560,96],[520,125,60,10]]);
  var OUT=mk([[810,385,68,12],[810,420,5],[810,470],[980,470],[1060,470,62,16]]);
  var sMid=LOOP.L[1];
  function toLoop(p){p.path=LOOP;p.s=0;p.done=false;p.on=react;p.end=afterCond;}
  function react(p,sc){
    if(p.done||p.s<sMid)return;p.done=true;
    if(p.kind==="n2"&&Math.random()<.35){p.kind="nh3";var q=part("nh3",LOOP,110,{end:afterCond});q.s=p.s;q.done=true;sc.add.push(q);}
    else if(p.kind==="h2"&&Math.random()<.35)p.dead=true;
  }
  function afterCond(p){
    p.s=0;p.on=null;
    if(p.kind==="nh3"){p.path=OUT;p.end=function(q,sc){q.stuck=true;capStuck(sc,"nh3",34);};}
    else{p.path=REC;p.end=toLoop;}
  }
  return {
    id:"the-process",tab:"The process",tabsub:"raw materials to liquid ammonia",
    title:"The Haber process",sub:"Nitrogen and hydrogen in, liquid ammonia out, unreacted gases round again",
    key:[["n2","Nitrogen, N₂"],["h2","Hydrogen, H₂"],["nh3","Ammonia, NH₃"]],
    hint:"Only some of the nitrogen and hydrogen reacts on each pass through the reactor. Follow the rest round the recycling pipe.",
    stages:[
      {title:"Raw materials",tx:"Nitrogen comes from the air. Hydrogen comes from natural gas (methane). Both are gases, and they are purified before use.",box:[20,36,330,420],pin:[40,56]},
      {title:"Reactor",tx:"The gases are passed over an iron catalyst at a high temperature, about 450 °C, and a high pressure, about 200 atmospheres.",box:[420,82,340,328],pin:[440,146]},
      {title:"Reversible reaction",tx:"Some of the nitrogen and hydrogen reacts to form ammonia. The reaction is reversible, so some of the ammonia breaks down again into nitrogen and hydrogen.",box:[60,470,440,60],pin:[80,500]},
      {title:"Condenser",tx:"The mixture is cooled. Only the ammonia liquefies, so it can be removed. The nitrogen and hydrogen stay as gases.",box:[650,290,540,244],pin:[676,312]},
      {title:"Recycle",tx:"The remaining nitrogen and hydrogen are recycled back to the reactor, so the raw materials are not wasted.",box:[540,24,290,274],pin:[836,170]}
    ],
    ps:[],add:[],t:0,acc:0,
    spawn:function(dt){
      if(this.add.length){this.ps=this.ps.concat(this.add);this.add=[];}
      this.acc+=dt;
      while(this.acc>.3){this.acc-=.3;this.ps.push(Math.random()<.25?part("n2",FEEDN,110,{end:toLoop}):part("h2",FEEDH,110,{end:toLoop}));}
    },
    draw:function(t){
      var i;
      ctx.fillStyle="#f7f9fc";ctx.fillRect(0,0,W,H);
      /* pipes */
      pipe([[170,90],[290,90],[290,200]],14,GASPIPE);pipe([[170,370],[290,370],[290,280]],14,GASPIPE);
      pipe([[330,240],[380,240],[380,70],[480,70],[480,92]],14,GASPIPE);
      pipe([[810,302],[810,50],[560,50],[560,92]],14,"#e9f4ee");
      pipe([[520,398],[520,460],[660,460],[660,360],[722,360]],14,GASPIPE);
      pipe([[810,418],[810,470],[982,470]],14,"#d9f0e6");
      /* sources */
      var g=ctx.createLinearGradient(0,50,0,130);g.addColorStop(0,"#cfe6f8");g.addColorStop(1,"#eef6fc");vessel(30,50,140,80,g);
      txt("Air",100,40,{b:1,size:16});txt("nitrogen from the air",100,152,{size:14,col:C.muted});
      vessel(30,330,140,80,"#f3eee4");txt("Natural gas",100,320,{b:1,size:16});txt("hydrogen from methane",100,432,{size:14,col:C.muted});
      vessel(250,200,80,80,"#eef2f7");txt("Compress",240,232,{al:"right",b:1,size:14});txt("and purify",240,250,{al:"right",size:14,col:C.muted});
      /* reactor */
      g=ctx.createLinearGradient(0,90,0,400);g.addColorStop(0,"#fdeedd");g.addColorStop(.5,"#fbd9b8");g.addColorStop(1,"#fdeedd");
      ctx.fillStyle=g;rr(430,90,180,310,26);ctx.fill();
      for(i=0;i<3;i++){var by=170+i*70;ctx.fillStyle="#8d98a5";ctx.fillRect(434,by,172,16);ctx.fillStyle="#5b6577";for(var j=0;j<21;j++)ctx.fillRect(438+j*8,by+3+(j%2)*5,4,4);}
      ctx.strokeStyle=C.wall;ctx.lineWidth=5;rr(430,90,180,310,26);ctx.stroke();
      txt("Reactor",468,426,{b:1,size:16});
      txt("450 °C",626,150,{al:"left",b:1,size:17,col:"#b4530a"});txt("200 atmospheres",626,176,{al:"left",b:1,size:17,col:"#b4530a"});txt("iron catalyst",626,202,{al:"left",b:1,size:17,col:"#4a5568"});
      /* condenser */
      vessel(720,300,180,120,"#e3f1fc");ctx.fillStyle="#bfe3d2";ctx.fillRect(723,392,174,25);

function frame(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(playing)stepScene(SC[cur],dt*speed);render();requestAnimationFrame(frame);}
function press(id,test){[].forEach.call(el(id).querySelectorAll("button"),function(x,k){x.setAttribute("aria-pressed",test(x,k)?"true":"false");});}
function keyIcon(k){var c=document.createElement("canvas");c.width=56;c.height=40;var o=ctx;ctx=c.getContext("2d");ctx.scale(2,2);mol(k,14,10,.5,1);ctx=o;return '<img alt="" width="28" height="20" src="'+c.toDataURL()+'">';}
function show(i){
  cur=i;hl=-1;var sc=SC[i];
  el("title").textContent=sc.title;el("sub").textContent=sc.sub;el("hint").textContent=sc.hint;
  el("key").innerHTML=sc.key.map(function(k){return '<li>'+keyIcon(k[0])+esc(k[1])+'</li>';}).join("");el("key").hidden=!sc.key.length;
  el("stages").innerHTML=sc.stages.map(function(s,n){return '<li><button type="button" data-n="'+n+'" aria-pressed="false"><span class="hd"><span class="num">'+(n+1)+'</span>'+esc(s.title)+'</span><span class="tx">'+esc(s.tx)+'</span></button></li>';}).join("");
  el("cond").hidden=i===0;el("rst").hidden=i!==1;el("speed").hidden=i===2;el("play").hidden=i===2;
  el("extra").hidden=!sc.extra;el("extra").innerHTML=sc.extra||"";
  el("qs").innerHTML=sc.qs.map(function(q){return '<details><summary>'+esc(q[0])+' <span class="src">'+esc(q[2])+'</span></summary><p>'+esc(q[1])+'</p></details>';}).join("");
  [].forEach.call(el("tabs").children,function(b,n){b.setAttribute("aria-selected",n===i?"true":"false");});
  render();
}
el("tabs").innerHTML=SC.map(function(s,i){return '<button type="button" role="tab" data-i="'+i+'"><b>'+(i+1)+'. '+esc(s.tab)+'</b><span>'+esc(s.tabsub)+'</span></button>';}).join("");
el("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var i=+b.dataset.i;try{history.replaceState(null,"","#"+SC[i].id);}catch(_){}show(i);});
el("stages").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var n=+b.dataset.n;hl=hl===n?-1:n;press("stages",function(x,k){return k===hl;});render();});
el("play").addEventListener("click",function(){playing=!playing;el("play").textContent=playing?"Pause":"Play";});
el("speed").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;press("speed",function(x){return x===b;});speed=+b.dataset.v;});
function syncCond(){el("tS").value=COND.T;el("pS").value=COND.P;el("tV").textContent=COND.T+" °C";el("pV").textContent=COND.P+" atm";el("cat").setAttribute("aria-pressed",COND.cat?"true":"false");el("cat").textContent=COND.cat?"Iron catalyst: on":"Iron catalyst: off";
  var x1=650-(COND.P-50)/350*250;S2.ms.forEach(function(q){if(q.x>x1-10)q.x=x1-10-Math.random()*20;});render();}
el("tS").addEventListener("input",function(){COND.T=+this.value;syncCond();});
el("pS").addEventListener("input",function(){COND.P=+this.value;syncCond();});
el("cat").addEventListener("click",function(){COND.cat=!COND.cat;syncCond();});
el("std").addEventListener("click",function(){COND.T=450;COND.P=200;COND.cat=true;syncCond();});
el("rst").addEventListener("click",function(){S2.reset();render();});
function fromHash(){var h=location.hash.replace("#",""),i=SC.findIndex(function(s){return s.id===h;});show(i<0?0:i);}
addEventListener("hashchange",fromHash);
S2.reset();
for(var k0=0;k0<1500;k0++)stepScene(S1,.04);
for(k0=0;k0<500;k0++)stepScene(S2,.04);
el("play").textContent=playing?"Pause":"Play";
function size(){var d=Math.min(2,window.devicePixelRatio||1),w=Math.max(760,cv.clientWidth||1200);cv.width=Math.round(w*d);cv.height=Math.round(w*d*H/W);render();}
addEventListener("resize",size);
syncCond();fromHash();size();
requestAnimationFrame(frame);
})();

</script>
</body>
</html>
