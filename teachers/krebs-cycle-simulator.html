<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Krebs Cycle Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: the cycle as a large ring on the left, a step card and yield table on the right.
     Same stained-slide palette as the Cell Explorer; each product has its own colour. */
  --bg:#f4f0f6; --panel:#ffffff; --soft:#f1ebf4; --ink:#2b1b3f; --muted:#6c5d7e; --line:#dfd5e6; --accent:#c4317c;
  --co2:#6c5d7e; --nad:#5a48b0; --fad:#1a8f89; --atp:#c97a12; --coa:#5f8a1f; --h2o:#3f7fc4; --ring:#e7dced;
  --display:"Gabarito","Figtree",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#130e1d; --panel:#1c152a; --soft:#251b37; --ink:#f0e9f8; --muted:#ab9bbf; --line:#372a4e; --accent:#ff6fb1;
  --co2:#ab9bbf; --nad:#a898ff; --fad:#3fd6cc; --atp:#ffb347; --coa:#a9d94f; --h2o:#7fb6ee; --ring:#2e2342;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#130e1d; --panel:#1c152a; --soft:#251b37; --ink:#f0e9f8; --muted:#ab9bbf; --line:#372a4e; --accent:#ff6fb1;
  --co2:#ab9bbf; --nad:#a898ff; --fad:#3fd6cc; --atp:#ffb347; --coa:#a9d94f; --h2o:#7fb6ee; --ring:#2e2342;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 22px 10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0}
.brand span{color:var(--muted);font-size:14px;font-weight:500}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.tog{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(350px,1fr);gap:16px;padding:0 22px 18px}
.stage{min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#cyc{width:100%;height:100%;display:block;font-family:var(--body)}
.panel{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.k{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.panel h2{font-family:var(--display);font-size:27px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.eq{background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15.5px;text-wrap:pretty}
.panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.tip{margin:0;border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:15px}
.tip b{color:var(--accent)}
.enz{margin:0;font-size:14px;color:var(--muted)}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#130e1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#130e1d}}
.btn:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
caption{text-align:left;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:15.5px}
th{font-size:13px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
td:first-child{font-weight:600;display:flex;align-items:center;gap:8px}
td i{width:11px;height:11px;border-radius:50%;flex:none}
td.tot{font-weight:700;font-size:17px}
td.hit{animation:hit .9s}
@keyframes hit{0%{background:var(--accent);color:var(--panel)}100%{background:transparent}}
.small{font-size:14px;color:var(--muted);margin:0}

/* svg */
.ring{fill:none;stroke:var(--ring);stroke-width:12}
.arc{fill:none;stroke:var(--ring);stroke-width:12;stroke-linecap:butt;transition:stroke .3s}
.arc.done{stroke:var(--muted)} .arc.now{stroke:var(--accent)}
.lnk{stroke:var(--ring);stroke-width:12;stroke-linecap:round;transition:stroke .3s}
.lnk.done{stroke:var(--muted)} .lnk.now{stroke:var(--accent)}
.ah{fill:var(--muted)} .ah.now{fill:var(--accent)}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:2;transition:stroke .3s}
.node text{font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle}
.node circle{fill:var(--ink)}
.node.here rect{stroke:var(--accent);stroke-width:4}
.node.here{filter:drop-shadow(0 0 8px var(--accent))}
.chip rect{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 5}
.chip text{font-size:15px;font-weight:700;text-anchor:middle;fill:var(--muted)}
.chip .lab{display:none}
.chip.on rect{stroke:none;fill:var(--c)}
.chip.on .q{display:none}
.chip.on .lab{display:inline;fill:var(--panel)}
.chip.pop{animation:pop .45s}
@keyframes pop{0%{opacity:0}60%{opacity:1}}
#tok{fill:var(--accent);stroke:var(--panel);stroke-width:3}
.ctr1{font-family:var(--display);font-size:30px;font-weight:700;fill:var(--ink);text-anchor:middle}
.ctr2{font-size:16px;font-weight:500;fill:var(--muted);text-anchor:middle}
.ctr3{font-size:16px;font-weight:700;fill:var(--accent);text-anchor:middle}
.stg{font-size:13px;font-weight:700;letter-spacing:.08em;fill:var(--muted)}
@media (max-width:900px){
  html,body{height:auto} body{display:block}
  .top{padding:12px 16px 8px;gap:8px} .brand{width:100%} .brand h1{font-size:22px}
  main{display:block;padding:0 16px 20px}
  #cyc{height:auto}
  .panel{overflow:visible;margin-top:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Krebs Cycle Simulator</h1><span>A-level Biology · aerobic respiration</span></div>
  <div class="seg" id="lvl" role="group" aria-label="Level of detail">
    <button type="button" data-m="spec">A-level</button>
    <button type="button" data-m="full">Named intermediates</button>
  </div>
  <button type="button" class="tog" id="all" aria-pressed="false">Show all products</button>
  <button type="button" class="icon" id="theme" aria-label="Switch between light and dark" title="Light or dark">
    <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>
  </button>
</header>
<main>
  <div class="stage"><svg id="cyc" viewBox="0 0 900 880" role="img" aria-label="Diagram of the link reaction and Krebs cycle"></svg></div>
  <aside class="panel" aria-live="polite">
    <div><span class="k" id="kick"></span><h2 id="ttl"></h2></div>
    <div class="eq" id="eq"></div>
    <ul id="pts"></ul>
    <p class="tip" id="tip"></p>
    <p class="enz" id="enz"></p>
    <div class="ctl">
      <button type="button" class="btn" id="back">Back</button>
      <button type="button" class="btn pri" id="next">Next step</button>
      <button type="button" class="btn" id="play">Play</button>
      <button type="button" class="btn" id="reset">Reset</button>
    </div>
    <table>
      <caption>Yield from this glucose so far</caption>
      <thead><tr><th>Product</th><th>Link reaction</th><th>Krebs cycle</th><th>Total</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <p class="small">One glucose gives two pyruvate, so the link reaction and the cycle each happen twice. Both take place in the mitochondrial matrix.</p>
  </aside>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),svg=$('cyc');
const CX=450,CY=505,R=228,D=Math.PI/180;
const P=(a,r=R)=>[CX+r*Math.sin(a*D),CY-r*Math.cos(a*D)];
const KIND={co2:['CO₂','--co2','Carbon dioxide'],nad:['reduced NAD','--nad','Reduced NAD'],fad:['reduced FAD','--fad','Reduced FAD'],atp:['ATP','--atp','ATP'],coa:['CoA','--coa'],h2o:['H₂O in','--h2o']};
const LINK={stage:'link',title:'Link reaction',eq:'pyruvate (3C) + NAD + CoA → acetyl CoA (2C) + CO₂ + reduced NAD',
 pts:['Pyruvate is oxidised to acetate: hydrogen is removed and reduces NAD','One carbon is removed as carbon dioxide (decarboxylation)','Acetate combines with coenzyme A to form acetylcoenzyme A'],
 tip:'No ATP is made in the link reaction.',enz:'pyruvate dehydrogenase',out:['co2','nad']};
const MODES={
spec:{nodes:[['6C compound',6,45],['5C compound',5,135],['4C compound',4,225],['4C acceptor',4,315]],
 steps:[LINK,
 {title:'Acetyl CoA joins the cycle',eq:'acetyl CoA (2C) + 4C → 6C + CoA',
  pts:['The 2C acetyl group combines with a 4C molecule to make a 6C molecule','Coenzyme A is released and returns to the link reaction'],
  tip:'Coenzyme A is a carrier. It is reused, not used up.',out:['coa']},
 {title:'6C to 5C',eq:'6C + NAD → 5C + CO₂ + reduced NAD',
  pts:['Decarboxylation: one carbon is lost as carbon dioxide','Dehydrogenation: hydrogen is removed and reduces NAD'],
  tip:'The molecule is oxidised because it loses hydrogen. The coenzyme that accepts the hydrogen is reduced.',out:['co2','nad']},
 {title:'5C to 4C',eq:'5C + NAD + ADP + Pi → 4C + CO₂ + reduced NAD + ATP',
  pts:['A second carbon is lost as carbon dioxide','More hydrogen is removed, reducing another NAD','One ATP is made directly by substrate-level phosphorylation'],
  tip:'This is the only ATP made directly by the Krebs cycle: one per turn.',out:['co2','nad','atp']},
 {title:'The 4C acceptor is regenerated',eq:'4C + FAD + NAD → 4C acceptor + reduced FAD + reduced NAD',
  pts:['Hydrogen is removed twice more, reducing one FAD and one NAD','The 4C molecule that accepts acetyl CoA is re-formed, so the cycle can turn again'],
  tip:'Per turn: 3 reduced NAD, 1 reduced FAD, 1 ATP and 2 CO₂.',out:['fad','nad']}]},
full:{nodes:[['Citrate',6,30],['Isocitrate',6,75],['α-Ketoglutarate',5,120],['Succinyl CoA',4,165],['Succinate',4,210],['Fumarate',4,255],['Malate',4,300],['Oxaloacetate',4,345]],
 steps:[LINK,
 {title:'Acetyl CoA joins oxaloacetate',eq:'acetyl CoA (2C) + oxaloacetate (4C) → citrate (6C) + CoA',
  pts:['The acetyl group is transferred to oxaloacetate, forming citrate','Coenzyme A is released and returns to the link reaction'],
  tip:'Citrate gives the cycle its other name: the citric acid cycle.',enz:'citrate synthase',out:['coa']},
 {title:'Citrate is rearranged',eq:'citrate (6C) → isocitrate (6C)',
  pts:['An isomerisation: the same atoms are rearranged','Nothing is gained or lost, but the new shape can be oxidised'],
  tip:'No products here, so this step is left out of A-level diagrams.',enz:'aconitase',out:[]},
 {title:'First decarboxylation',eq:'isocitrate (6C) + NAD → α-ketoglutarate (5C) + CO₂ + reduced NAD',
  pts:['Hydrogen is removed and reduces NAD','One carbon is lost as carbon dioxide'],
  tip:'This is the 6C to 5C step of the A-level version.',enz:'isocitrate dehydrogenase',out:['co2','nad']},
 {title:'Second decarboxylation',eq:'α-ketoglutarate (5C) + NAD + CoA → succinyl CoA (4C) + CO₂ + reduced NAD',
  pts:['A second carbon is lost as carbon dioxide','Hydrogen is removed and reduces NAD','Coenzyme A is attached to the 4C product'],
  tip:'Both carbons that entered as acetyl CoA have now been matched by two carbons leaving as CO₂.',enz:'α-ketoglutarate dehydrogenase',out:['co2','nad']},
 {title:'Substrate-level phosphorylation',eq:'succinyl CoA (4C) + ADP + Pi → succinate (4C) + ATP + CoA',
  pts:['Breaking the bond to coenzyme A releases enough energy to make one ATP','Coenzyme A is released'],
  tip:'In many animal tissues GTP is made first and then used to make ATP. Count it as one ATP.',enz:'succinyl CoA synthetase',out:['atp','coa']},
 {title:'FAD is reduced',eq:'succinate (4C) + FAD → fumarate (4C) + reduced FAD',
  pts:['Two hydrogen atoms are removed from succinate','They are accepted by FAD, not NAD'],
  tip:'The only step that reduces FAD: one per turn.',enz:'succinate dehydrogenase',out:['fad']},
 {title:'Water is added',eq:'fumarate (4C) + H₂O → malate (4C)',
  pts:['A hydration reaction across the double bond in fumarate','This sets up the final oxidation'],
  tip:'No reduced coenzyme or ATP is made in this step.',enz:'fumarase',out:['h2o']},
 {title:'Oxaloacetate is regenerated',eq:'malate (4C) + NAD → oxaloacetate (4C) + reduced NAD',
  pts:['Hydrogen is removed and reduces a third NAD','Oxaloacetate is re-formed, ready to accept the next acetyl CoA'],
  tip:'Per turn: 3 reduced NAD, 1 reduced FAD, 1 ATP and 2 CO₂.',enz:'malate dehydrogenase',out:['nad']}]}
};
const S={mode:'spec',turn:1,p:0,all:false,playing:false};
let M,N,K=1,timer=0,anim=0,PYR=[450,56],ACO=[450,172];
const narrow=matchMedia('(max-width:900px)');

const pill=(cls,id,x,y,name,c,w)=>{let d='';for(let i=0;i<c;i++)d+=`<circle cx="${x+(i-(c-1)/2)*15*K}" cy="${y+12*K}" r="${5.2*K}"/>`;
  return `<g class="node" id="${id}"><rect x="${x-w/2}" y="${y-27*K}" width="${w}" height="${54*K}" rx="14"/><text x="${x}" y="${y-5*K}" style="font-size:${16*K}px">${name}</text>${d}</g>`};
const chipW=k=>(26+KIND[k][0].length*8.6)*K;
const chipG=(si,kinds,x,y)=>kinds.map((k,i)=>{const[lab,col]=KIND[k],w=chipW(k),yy=y+(i-(kinds.length-1)/2)*38*K;
  return `<g class="chip" data-s="${si}" style="--c:var(${col})"><rect x="${x-w/2}" y="${yy-16*K}" width="${w}" height="${32*K}" rx="${16*K}"/><text class="q" x="${x}" y="${yy+5.5*K}" style="font-size:${15*K}px">?</text><text class="lab" x="${x}" y="${yy+5.5*K}" style="font-size:${15*K}px">${lab}</text></g>`}).join('');
const arcD=(a0,a1)=>{const d=((a1-a0)%360+360)%360,p0=P(a0),p1=P(a1);return `M${p0[0].toFixed(1)},${p0[1].toFixed(1)}A${R},${R} 0 ${d>180?1:0} 1 ${p1[0].toFixed(1)},${p1[1].toFixed(1)}`};
const mid=(a0,a1)=>a0+(((a1-a0)%360+360)%360)/2;

function build(){
  M=MODES[S.mode];N=M.steps.length;K=narrow.matches&&S.mode==='spec'?1.3:1;svg.setAttribute('viewBox',narrow.matches?'20 10 860 '+(K>1?915:865):'0 0 900 880');
  const nd=M.nodes,n=nd.length,w=(S.mode==='spec'?150:162)*K;
  M.J=mid(nd[n-1][2],nd[0][2]);const jp=P(M.J);
  let h=`<text class="stg" x="24" y="34">LINK REACTION</text><text class="stg" x="24" y="${CY-R-36}">KREBS CYCLE</text>`;
  h+=`<line class="lnk" id="l0" x1="${PYR[0]}" y1="${PYR[1]}" x2="${ACO[0]}" y2="${ACO[1]}"/><line class="lnk" id="l1" x1="${ACO[0]}" y1="${ACO[1]}" x2="${jp[0]}" y2="${jp[1]}"/>`;
  h+=`<circle class="ring" cx="${CX}" cy="${CY}" r="${R}"/>`;
  for(let i=1;i<N;i++){const a0=nd[(i-2+n)%n][2],a1=nd[i-1][2],m=mid(a0,a1),q=P(m);
    h+=`<path class="arc" id="a${i}" d="${arcD(a0,a1)}"/><path class="ah" id="h${i}" d="M-10,-11L11,0L-10,11Z" transform="translate(${q[0].toFixed(1)},${q[1].toFixed(1)}) rotate(${m})"/>`;
    const out=M.steps[i].out;if(out.length){const inner=i===1,c=P(m,inner?R-78:R+(Math.abs(Math.cos(m*D))>.8?30+out.length*19*K:20+Math.max(...out.map(chipW))/2));h+=chipG(i,out,c[0],c[1])}}
  h+=`<path class="ah" id="h0" d="M-10,-11L11,0L-10,11Z" transform="translate(${PYR[0]},${(PYR[1]+ACO[1])/2}) rotate(90)"/>`;
  h+=chipG(0,LINK.out,620+(K-1)*120,(PYR[1]+ACO[1])/2);
  h+=pill('node','n-pyr',PYR[0],PYR[1],'Pyruvate',3,w)+pill('node','n-aco',ACO[0],ACO[1],'Acetyl CoA',2,w);
  nd.forEach((q,i)=>{const p=P(q[2]);h+=pill('node','n'+i,p[0],p[1],q[0],q[1],w)});
  h+=`<text class="ctr1" x="${CX}" y="${CY+34}">Krebs cycle</text><text class="ctr2" x="${CX}" y="${CY+60}">mitochondrial matrix</text><text class="ctr3" id="turn" x="${CX}" y="${CY+90}"></text>`;
  h+=`<circle id="tok" r="11" visibility="hidden"/>`;
  svg.innerHTML=h;
}
// where the carbon skeleton is after p steps
const locId=p=>p===0?'n-pyr':p===1?'n-aco':'n'+(p-2);
function tokPos(step,k){const nd=M.nodes,n=nd.length;
  if(step===0)return[PYR[0],PYR[1]+(ACO[1]-PYR[1])*k];
  const a0=step===1?M.J:nd[(step-2+n)%n][2],a1=nd[step-1][2],d=((a1-a0)%360+360)%360;
  if(step===1){if(k<.45){const j=P(M.J),q=k/.45;return[ACO[0]+(j[0]-ACO[0])*q,ACO[1]+(j[1]-ACO[1])*q]}return P(a0+d*(k-.45)/.55)}
  return P(a0+d*k)}
function tally(){const t={link:{co2:0,nad:0,fad:0,atp:0},krebs:{co2:0,nad:0,fad:0,atp:0}};
  const add=(i)=>M.steps[i].out.forEach(k=>{const g=t[i?'krebs':'link'];if(k in g)g[k]++});
  for(let tu=1;tu<=S.turn;tu++){const lim=tu<S.turn?N:S.p;for(let i=0;i<lim;i++)add(i)}return t}
let prev='';
function render(popStep){
  const done=S.turn===2&&S.p===N;
  document.querySelectorAll('#lvl button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.mode));
  $('all').setAttribute('aria-pressed',S.all);
  svg.querySelectorAll('.node').forEach(g=>g.classList.toggle('here',g.id===locId(S.p)));
  for(let i=0;i<N;i++){const dn=i<S.p,now=i===S.p-1;
    (i?[$('a'+i),$('h'+i)]:[$('l0'),$('h0')]).forEach(e=>{e.classList.toggle('done',dn&&!now);e.classList.toggle('now',now)});
    if(i===1){$('l1').classList.toggle('done',dn&&!now);$('l1').classList.toggle('now',now)}}
  svg.querySelectorAll('.chip').forEach(c=>{const on=S.all||+c.dataset.s<S.p;c.classList.toggle('on',on);c.classList.toggle('pop',+c.dataset.s===popStep)});
  $('turn').textContent='Pyruvate '+S.turn+' of 2';
  // card
  let st;
  if(done)st={kick:'One glucose complete',title:'What the cell has gained',eq:'Per glucose: 6 CO₂, 8 reduced NAD, 2 reduced FAD and 2 ATP from these two stages',
    pts:['All six carbons of glucose have now left as carbon dioxide','Most of the energy is still held by the reduced coenzymes','Reduced NAD and reduced FAD carry electrons to the electron transfer chain on the cristae, where most ATP is made by oxidative phosphorylation'],
    tip:'Glycolysis adds a net 2 ATP and 2 reduced NAD in the cytoplasm.'};
  else if(S.p===0)st=S.turn===1?{kick:'Start',title:'Pyruvate enters the matrix',eq:'glucose (6C) → 2 pyruvate (3C) by glycolysis in the cytoplasm',
    pts:['Each pyruvate is actively transported into the mitochondrial matrix','Predict the products of each step before you reveal them'],tip:'The link reaction and Krebs cycle only happen when oxygen is available.'}
   :{kick:'Second pyruvate',title:'The second pyruvate arrives',eq:'The same reactions happen again',
    pts:['Glycolysis made two pyruvate from one glucose','Every product from the first turn is now doubled'],tip:'Remember to multiply by two when a question asks about one glucose molecule.'};
  else{const s=M.steps[S.p-1];st={...s,kick:(S.p===1?'Link reaction':'Krebs cycle')+' · step '+S.p+' of '+N}}
  $('kick').textContent=st.kick+' · pyruvate '+S.turn+' of 2';$('ttl').textContent=st.title;$('eq').textContent=st.eq;
  $('pts').innerHTML=st.pts.map(x=>`<li>${x}</li>`).join('');$('tip').innerHTML='<b>Exam point.</b> '+st.tip;
  $('enz').textContent=st.enz?'Enzyme (beyond the specification): '+st.enz:'';$('enz').hidden=!st.enz;
  $('back').disabled=S.turn===1&&S.p===0;$('next').disabled=done;$('play').disabled=done;
  $('next').textContent=S.p===N&&S.turn===1?'Second pyruvate':'Next step';$('play').textContent=S.playing?'Pause':'Play';
  // table
  const t=tally(),key=JSON.stringify(t),old=prev?JSON.parse(prev):null;
  $('tb').innerHTML=['co2','nad','fad','atp'].map(k=>{const l=t.link[k],c=t.krebs[k],ch=old&&(old.link[k]+old.krebs[k]!==l+c);
    return `<tr><td><i style="background:var(${KIND[k][1]})"></i>${KIND[k][2]}</td><td>${l}</td><td>${c}</td><td class="tot${ch?' hit':''}">${l+c}</td></tr>`}).join('');
  prev=key;
}
function stop(){S.playing=false;clearTimeout(timer)}
function next(){
  if(anim||(S.turn===2&&S.p===N))return;
  if(S.p===N){S.turn=2;S.p=0;render();queue();return}
  const step=S.p,tok=$('tok'),fin=()=>{anim=0;tok.setAttribute('visibility','hidden');S.p++;render(step);queue()};
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return fin();
  const t0=performance.now(),dur=step===1?1000:750;tok.setAttribute('visibility','visible');
  svg.querySelectorAll('.node').forEach(g=>g.classList.remove('here'));
  const f=ts=>{let k=Math.min(1,(ts-t0)/dur);k=k*k*(3-2*k);const q=tokPos(step,k);tok.setAttribute('cx',q[0]);tok.setAttribute('cy',q[1]);k<1?anim=requestAnimationFrame(f):fin()};
  anim=requestAnimationFrame(f);
}
function queue(){clearTimeout(timer);if(!S.playing)return;if(S.turn===2&&S.p===N){S.playing=false;return render()}timer=setTimeout(next,2600)}
function back(){stop();if(anim){cancelAnimationFrame(anim);anim=0;$('tok').setAttribute('visibility','hidden')}
  if(S.p>0)S.p--;else if(S.turn===2){S.turn=1;S.p=N}render()}
function reset(){stop();if(anim){cancelAnimationFrame(anim);anim=0}S.turn=1;S.p=0;prev='';build();render()}
$('next').onclick=()=>{stop();next();if(!anim)render()};
$('back').onclick=back;$('reset').onclick=reset;
$('play').onclick=()=>{if(S.playing){stop();render()}else{S.playing=true;render();next()}};
$('all').onclick=()=>{S.all=!S.all;render()};
document.querySelectorAll('#lvl button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;reset()});
$('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='ArrowRight'){stop();next()}else if(e.key==='ArrowLeft')back()});
narrow.addEventListener('change',()=>{build();render()});
build();render();
})();
</script>
