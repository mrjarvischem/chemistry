<!doctype html>
<html lang="en-GB">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teacher resources · Mr Jarvis' Chemistry Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#14213d; --ink-soft:#4a5571; --muted:#8a92a8; --bg:#f5f6fa; --card:#fff; --line:#e2e5ee;
    --chem:#b5384a; --chem-soft:#fbecee; --phys:#2c63b8; --phys-soft:#e8effa; --bio:#2f8656; --bio-soft:#e6f4ec;
    --accent:var(--chem); --accent-soft:var(--chem-soft); --radius:14px; }
  [data-subject="chemistry"]{ --accent:var(--chem); --accent-soft:var(--chem-soft); }
  [data-subject="physics"]{ --accent:var(--phys); --accent-soft:var(--phys-soft); }
  [data-subject="biology"]{ --accent:var(--bio); --accent-soft:var(--bio-soft); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header{ background:var(--ink); color:#fff; padding:44px 20px 0; }
  .wrap{ max-width:1100px; margin:0 auto; }
  .eyebrow{ text-transform:uppercase; letter-spacing:.14em; font-size:.78rem; font-weight:600; opacity:.75; margin:0 0 10px; }
  h1{ font-family:Fraunces, Georgia, serif; font-weight:700; font-size:clamp(1.9rem, 5vw, 3rem); line-height:1.1; margin:0 0 12px; }
  .tagline{ opacity:.85; max-width:640px; margin:0 0 30px; }
  .subject-switch{ display:flex; gap:8px; flex-wrap:wrap; }
  .subject-btn{ appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600; font-size:1.05rem; padding:14px 26px;
    border-radius:12px 12px 0 0; color:#fff; background:rgba(255,255,255,.1); display:inline-flex; align-items:center; gap:10px; border-top:5px solid var(--accent); }
  .subject-btn:hover{ background:rgba(255,255,255,.18); }
  .subject-btn[aria-selected="true"]{ background:var(--bg); color:var(--accent); }
  .subject-btn:focus-visible, a.card:focus-visible, .level-btn:focus-visible{ outline:3px solid #f0b34b; outline-offset:2px; }
  .level-switch{ display:inline-flex; gap:4px; padding:4px; border-radius:999px; background:var(--card); border:1.5px solid var(--accent); }
  .level-btn{ appearance:none; border:0; cursor:pointer; font:inherit; font-weight:600; font-size:1rem; padding:9px 24px; border-radius:999px;
    color:var(--accent); background:none; }
  .level-btn:hover{ background:var(--accent-soft); }
  .level-btn[aria-selected="true"]{ background:var(--accent); color:#fff; }
  main{ padding:26px 20px 60px; }
  section.subject{ background:var(--accent-soft); border:1px solid var(--line); border-top:6px solid var(--accent); border-radius:var(--radius);
    padding:22px 22px 6px; margin-bottom:30px; scroll-margin-top:14px; }
  .subject-head{ display:flex; align-items:center; flex-wrap:wrap; gap:12px 18px; margin:0 0 22px; }
  .subject-head h2{ font-family:Fraunces, Georgia, serif; font-weight:700; font-size:clamp(1.6rem, 4vw, 2.1rem); line-height:1.1; margin:0; color:var(--accent); }
  .subject-head .count{ font-size:.85rem; font-weight:600; color:var(--accent); white-space:nowrap; margin-left:auto; }
  section.topic{ margin-bottom:26px; }
  section.topic h3{ font-family:Fraunces, Georgia, serif; font-weight:600; font-size:1.2rem; margin:0 0 12px; padding-left:12px; border-left:4px solid var(--accent); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .card{ display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:var(--radius); padding:16px 18px; position:relative;
    transition:transform .15s, box-shadow .15s; }
  a.card:hover{ transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,33,61,.09); }
  a.card::after{ content:"\2192"; position:absolute; right:16px; top:14px; color:var(--accent); font-weight:700; }
  .card .kind{ font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .card .title{ font-weight:600; padding-right:22px; line-height:1.35; }
  .card .desc{ font-size:.9rem; color:var(--ink-soft); }
  .empty{ color:var(--muted); font-size:.95rem; margin:0; }
  footer{ text-align:center; color:var(--muted); font-size:.85rem; padding:0 20px 40px; }
  @media (max-width:520px){ .subject-btn{ padding:12px 14px; font-size:1rem; } .level-btn{ padding:8px 18px; } section.subject{ padding:18px 14px 2px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="eyebrow">Mr Jarvis' Chemistry Page</p>
    <h1>Teacher resources</h1>
    <p class="tagline">Simulators and classroom tools for teachers. This page is not listed on the main site, so please only pass the link on to colleagues.</p>
    <div class="subject-switch" role="tablist" aria-label="Subject">
      <button class="subject-btn" role="tab" data-subject="biology" aria-selected="false">Biology</button>
      <button class="subject-btn" role="tab" data-subject="chemistry" aria-selected="true">Chemistry</button>
      <button class="subject-btn" role="tab" data-subject="physics" aria-selected="false">Physics</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="content"></div></main>
<footer>Unlisted page · mrjarvischem.co.uk</footer>
<script>
/* ============================================================
   TO ADD A RESOURCE: put the file in this folder, then add one
   line to the right level, subject and topic below, in this form:
   { title:"Name", kind:"Simulator", desc:"One line about it", href:"file-name.html" },
   ============================================================ */
const ATOM = { title:"Atom viewer", kind:"Simulator", desc:"2D and 3D models of the atom: choose protons, neutrons and electrons, click parts to inspect them, with moving electrons for GCSE and probability dots and orbitals to 3d for A-level.", href:"atom-viewer.html" };
const BONDING = { title:"Bonding simulator", kind:"Simulator", desc:"Step-by-step ionic and covalent dot and cross diagrams that build into small molecules or giant structures, with dative bonds, ion sizes and octet exceptions for A-level.", href:"bonding-simulator.html" };
const ENERGY = { title:"Reaction energy simulator", kind:"Simulator", desc:"Bond breaking and bond making with energy moving between the system and the surroundings, a linked energy level diagram and reaction profile, and bond energy calculations for seven reactions.", href:"reaction-energy-simulator.html" };
const TIMELINE = { title:"Atomic model timeline", kind:"Simulator", desc:"Seven runnable experiments from Dalton to Chadwick, including Thomson's cathode rays, alpha scattering, Bohr's line spectrum and Schrödinger's electron cloud, each with the model before and after.", href:"atomic-model-timeline.html" };
const RESOURCES = {
  gcse: {
    chemistry: [
      { topic:"Atomic structure and bonding", items:[
        ATOM,
        TIMELINE,
        BONDING,
      ]},
      { topic:"Quantitative chemistry", items:[
      ]},
      { topic:"Chemical changes and energy", items:[
        ENERGY,
        { title:"Bond energy simulator", kind:"Simulator", desc:"Bond energy calculations in five steps: what the big numbers in front of displayed formulae mean, tables of bonds broken and bonds made, then exothermic or endothermic overall with no negative signs. Fourteen common reactions or build your own, with editable bond energies.", href:"bond-energy-simulator.html" },
      ]},
      { topic:"Rates and equilibrium", items:[
        { title:"Rates of reaction practicals", kind:"Simulator", desc:"Three class practicals with a stopwatch, results table and live graph: the disappearing cross (concentration or temperature), magnesium and acid with a gas syringe, and marble chips and acid by loss in mass. Includes a tangent tool and questions for the class.", href:"rates-practicals.html" },
      ]},
      { topic:"Organic chemistry and analysis", items:[
      ]},
      { topic:"Atmosphere and resources", items:[
        { title:"Evolution of the atmosphere", kind:"Graphic", desc:"One picture of 4.6 billion years: a chart of carbon dioxide, nitrogen and oxygen above a landscape of volcanoes, oceans, algae, limestone and fossil fuels, with six numbered stages and a time cursor.", href:"atmosphere-evolution.html" },
        { title:"The greenhouse effect", kind:"Animation", desc:"Short wavelength radiation in, infrared out, and CO\u2082, CH\u2084 and water vapour absorbing and re-emitting it. Compare no greenhouse gases, the natural effect and human activities: fossil fuels, deforestation, cattle, rice paddy fields and landfill.", href:"greenhouse-effect.html" },
        { title:"Potable water and waste water", kind:"Simulator", desc:"Four animated processes: fresh water through filter beds and sterilisation, desalination by distillation and by reverse osmosis, and waste water from homes, farms and industry through sewage treatment.", href:"potable-water.html" },
        { title:"NPK fertilisers", kind:"Simulator", desc:"Four animations built around past paper questions: what is in an NPK formulation, how the salts are made, phosphate rock with nitric, sulfuric and phosphoric acid, and laboratory against industrial production. Chemistry only.", href:"npk-fertilisers.html" },
        { title:"The Haber process", kind:"Simulator", desc:"Three animations built around past paper questions: the process from raw materials to liquid ammonia with recycling, a particle model of the equilibrium with temperature, pressure and catalyst controls, and yield curves showing why 450 \u00b0C and 200 atmospheres are a compromise. Chemistry only.", href:"haber-process.html" },
      ]},
      { topic:"Required practicals", items:[
        { title:"Titration", kind:"Simulator", desc:"Run acid from a burette into sodium hydroxide, drop by drop near the end point, read a magnified burette scale, record rough and concordant titres, then work through the concentration calculation step by step. Chemistry only.", href:"titration.html" },
      ]}
    ],
    physics: [
      { topic:"Energy and electricity", items:[
      ]},
      { topic:"Particles and atomic structure", items:[
      TIMELINE,
      { title:"Radioactive decay and half-life", kind:"Simulator", desc:"A sample of nuclei decaying at random, with a live decay curve or count rate graph, halving lines, repeat runs to compare, and eight real isotopes with their nuclear equations.", href:"half-life-simulator.html" },
      ]},
      { topic:"Forces and motion", items:[
      ]},
      { topic:"Waves and magnetism", items:[
      ]},
      { topic:"Required practicals", items:[
        { title:"Specific heat capacity", kind:"Simulator", desc:"Required practical 1: a 1 kg metal block heated electrically, with joulemeter and temperature readings, a temperature against energy graph, insulation on or off and four metals to compare.", href:"specific-heat-capacity-simulator.html" },
        { title:"Resistance", kind:"Simulator", desc:"Required practical 3: resistance against length for three thicknesses of wire on a metre rule, plus two resistors measured alone, in series and in parallel.", href:"resistance-simulator.html" },
        { title:"I-V characteristics", kind:"Simulator", desc:"Required practical 4: current against potential difference for resistors, a filament lamp and a diode, with a reversible supply, a four-quadrant graph and a resistance column to reveal.", href:"iv-characteristics-simulator.html" },
        { title:"Acceleration", kind:"Simulator", desc:"Required practical 7: a trolley pulled through two light gates by hanging masses, varying force at constant mass or mass at constant force, with friction on or compensated.", href:"acceleration-simulator.html" },
      ]}
    ],
    biology: [
      { topic:"Cells and organisation", items:[
      ]},
      { topic:"Infection and bioenergetics", items:[
      ]},
      { topic:"Homeostasis, inheritance and ecology", items:[
        { title:"Blood glucose control", kind:"Simulator", desc:"Insulin, glucagon and negative feedback: give a healthy person or someone with Type 1 or Type 2 diabetes a meal, exercise or an insulin injection and watch the body and the blood glucose graph respond. Higher tier toggle for glucagon.", href:"blood-glucose-simulator.html" },
      ]},
      { topic:"Required practicals", items:[
        { title:"Using a light microscope", kind:"Simulator", desc:"Required practical 1: focus onion and cheek cells at three magnifications, estimate cell size with a ruler or scale bar, and practise magnification calculations.", href:"microscopy-simulator.html" },
        { title:"Antiseptics and bacterial growth", kind:"Simulator", desc:"Required practical 2 (biology only): incubate an agar plate, measure the clear zone around each disc and calculate areas, with aseptic technique on or off.", href:"microbiology-simulator.html" },
        { title:"Osmosis in plant tissue", kind:"Simulator", desc:"Required practical 3: change in mass of potato cylinders in sucrose solutions, with blotting and natural variation options.", href:"osmosis-simulator.html" },
        { title:"Food tests", kind:"Simulator", desc:"Required practical 4: Benedict’s, iodine, Biuret and Sudan III tests on eight foods, with a mystery samples mode.", href:"food-tests-simulator.html" },
        { title:"Effect of pH on amylase", kind:"Simulator", desc:"Required practical 5: iodine spotting tile method with a water bath and stop clock, across a range of buffer pH values.", href:"amylase-ph-simulator.html" },
        { title:"Light intensity and photosynthesis", kind:"Simulator", desc:"Required practical 6: count bubbles from pondweed at different lamp distances, with hydrogencarbonate and variation options.", href:"photosynthesis-simulator.html" },
        { title:"Reaction time", kind:"Simulator", desc:"Required practical 7: catch a falling ruler for a real reaction time, or simulate a student, and compare hand, caffeine, distraction or practice.", href:"reaction-time-simulator.html" },
        { title:"Plant responses to light and gravity", kind:"Simulator", desc:"Required practical 8 (biology only): seedlings in full light, one-sided light and dark, or beans in three positions, with daily heights and an auxin overlay.", href:"plant-responses-simulator.html" },
        { title:"Field investigations", kind:"Simulator", desc:"Required practical 9: random quadrats with a population estimate checked against the true value, a sampling bias option, and a transect from under a tree.", href:"field-investigation-simulator.html" },
        { title:"Effect of temperature on decay", kind:"Simulator", desc:"Required practical 10 (biology only): milk and lipase with cresol red in a water bath, timing the colour change from 5 to 60 °C.", href:"decay-simulator.html" },
      ]}
    ]
  },
  alevel: {
    chemistry: [
      { topic:"Whole course", items:[
        { title:"Multiple choice projector quiz", kind:"Quiz", desc:"523 AQA past-paper multiple choice questions (AS Papers 1 and 2 and A-level Paper 3, 2017 to 2025), one per slide for the projector. Choose topics, then run random sets of 6 with click-to-answer buttons and a reveal.", href:"alevel-mcq-projector.html" },
      ]},
      { topic:"Physical chemistry", items:[
        ATOM,
        BONDING,
        ENERGY,
      ]},
      { topic:"Inorganic chemistry", items:[
        { title:"Catalysts in action", kind:"Simulator", desc:"Step-by-step particle animations of iron in the Haber process (with poisoning), V\u2082O\u2085 in the Contact process with vanadium changing oxidation state, and Fe\u00b2\u207a catalysing S\u2082O\u2088\u00b2\u207b with I\u207b, each with a linked energy profile.", href:"catalysts-simulator.html" },
        { title:"Manganate(VII) redox titration", kind:"Simulator", desc:"Purple KMnO\u2084 in the burette run into Fe\u00b2\u207a or C\u2082O\u2084\u00b2\u207b in the flask: the purple fading until the first permanent pale pink, a magnified burette reading, moles in the flask, a titre log and the worked calculation.", href:"redox-titration-simulator.html" },
      ]},
      { topic:"Organic chemistry and analysis", items:[
        { title:"Electrophilic addition mechanism", kind:"Simulator", desc:"3D reaction with the curly arrow mechanism building underneath: ethene and propene with HBr, H\u2082SO\u2084 and Br\u2082, major and minor products, played through or step by step.", href:"electrophilic-addition-simulator.html" },
        { title:"Nucleophilic substitution mechanism", kind:"Simulator", desc:"3D reaction with the curly arrow mechanism building underneath: chloro-, bromo- and iodoethane with hydroxide, cyanide and ammonia, played through or step by step.", href:"nucleophilic-substitution-simulator.html" },
        { title:"Nucleophilic addition mechanism", kind:"Simulator", desc:"3D reaction with the curly arrow mechanism building underneath: ethanal, propanone and butanone with cyanide or hydride, attack from either side, and the enantiomers shown as mirror images with wedge and dash drawings.", href:"nucleophilic-addition-simulator.html" },
        { title:"Electrophilic substitution mechanism", kind:"Simulator", desc:"Benzene in 3D with the curly arrow mechanism building underneath: nitration with the nitronium ion and Friedel-Crafts acylation, including making the electrophile, the broken-ring intermediate and the catalyst re-forming.", href:"electrophilic-substitution-simulator.html" },
        { title:"Addition-elimination mechanism", kind:"Simulator", desc:"3D reaction with the curly arrow mechanism building underneath: ethanoyl chloride and ethanoic anhydride with water, ethanol, ammonia and methylamine, making acids, esters, amides and N-substituted amides.", href:"addition-elimination-simulator.html" },
        { title:"Free radical mechanisms", kind:"Simulator", desc:"3D reactions with the equations building underneath: methane with chlorine or bromine including further substitution, propane and why the 2\u00b0 product is favoured, and ozone depletion by CFCs.", href:"free-radical-simulator.html" },
        { title:"Amino acids to proteins", kind:"Simulator", desc:"Zwitterions and the ions formed at different pH for amino acids, dipeptides and tripeptides, peptide link condensation and hydrolysis, then a 3D chain folding through primary, secondary, tertiary and quaternary structure.", href:"amino-acids-proteins-simulator.html" },
        { title:"Enzymes in action", kind:"Simulator", desc:"Why the active site is stereospecific, shown with a substrate, its mirror image and a drug that blocks the site, then live temperature and pH sliders with denaturing, charged groups in the active site and a rate graph.", href:"enzymes-simulator.html" },
        { title:"DNA simulator", kind:"Simulator", desc:"Build a nucleotide from the data sheet structures by choosing the correct groups to join, rotate and flip bases to form the A\u2013T and G\u2013C hydrogen bonds, then step through how cisplatin bonds to guanine and stops DNA replication.", href:"dna-simulator.html" },
        { title:"NMR and IR spectrum simulator", kind:"Simulator", desc:"Draw a molecule to generate its ¹H NMR, ¹³C NMR and infrared spectra, with zoomable splitting and AQA data sheet values.", href:"nmr-ir-simulator.html" },
      ]},
      { topic:"Required practicals", items:[
      ]},
      { topic:"Extension beyond A-level", items:[
        { title:"Molecular orbital simulator", kind:"Simulator", desc:"Molecular orbital diagrams for H\u2082 to Ne\u2082 built one orbital at a time, with an animation of the atomic orbitals overlapping in or out of phase to form each \u03c3 and \u03c0 orbital, then electron filling, bond order and magnetism.", href:"molecular-orbital-simulator.html" },
        { title:"Orbital wave function explorer", kind:"Simulator", desc:"A rotating 3D dot cloud for hydrogen orbitals 1s to 4f linked to graphs of the wave function R(r), the probability density and the radial probability. Move one shell through all of them, build the cloud dot by dot, see radial nodes in cross-section and compare penetration.", href:"orbital-wave-function-explorer.html" },
        { title:"Point groups and IR spectroscopy", kind:"Simulator", desc:"H\u2082O, NH\u2083, CO\u2082, BF\u2083 and CH\u2084 in 3D: animate each symmetry operation, find the point group, watch every vibration with its changing dipole, and link the character table to the predicted IR and Raman bands, with the full reduction worked through.", href:"point-groups-ir-simulator.html" },
        { title:"Noble gas compounds", kind:"Overview", desc:"Why some noble gases react: ionisation energies against O\u2082, a timeline from Bartlett to HArF, rotating 3D shapes with lone pairs for the xenon fluorides and oxides, KrF\u2082 and HArF, and the routes between the xenon compounds.", href:"noble-gas-compounds.html" },
      ]}
    ],
    physics: [
      { topic:"Particles, quantum and waves", items:[
      ]},
      { topic:"Mechanics and materials", items:[
      ]},
      { topic:"Electricity and fields", items:[
      ]},
      { topic:"Required practicals", items:[
      ]}
    ],
    biology: [
      { topic:"Biological molecules", items:[
        { title:"ATP energy simulator", kind:"Simulator", desc:"ATP hydrolysis and condensation atom by atom: bond breaking takes energy in, and energy is released as new bonds and stronger interactions with water form, with a linked energy profile.", href:"atp-energy-simulator.html" },
      ]},
      { topic:"Cells", items:[
        { title:"Cell explorer", kind:"Simulator", desc:"Animal and plant cell ultrastructure: click any organelle for its structure and function with an animation, follow the protein route, and test yourself.", href:"cell-explorer.html" },
      ]},
      { topic:"Genetic information and protein synthesis", items:[
        { title:"Transcription and translation simulator", kind:"Simulator", desc:"Step through transcription, splicing and translation base by base in a eukaryote or prokaryote, predict codons and anticodons, and mutate the gene to see the effect on the polypeptide.", href:"transcription-translation-simulator.html" },
      ]},
      { topic:"Energy transfers and respiration", items:[
        { title:"Krebs cycle simulator", kind:"Simulator", desc:"Step through the link reaction and Krebs cycle with named intermediates and a running tally of products per glucose.", href:"krebs-cycle-simulator.html" },
      ]},
      { topic:"Required practicals", items:[
      ]}
    ]
  }
};
const SUBJECTS = { biology:"Biology", chemistry:"Chemistry", physics:"Physics" };
const LEVELS = [["gcse","GCSE"],["alevel","A-level"]];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let subject = "chemistry", level = "alevel";
function show(){
  document.querySelectorAll(".subject-btn").forEach(b => b.setAttribute("aria-selected", b.dataset.subject === subject));
  const card = i => '<a class="card" href="' + esc(i.href) + '"><span class="kind">' + esc(i.kind || "Resource") +
    '</span><span class="title">' + esc(i.title) + '</span><span class="desc">' + esc(i.desc || "") + '</span></a>';
  const topic = t => '<section class="topic"><h3>' + esc(t.topic) + '</h3>' + (t.items.length
    ? '<div class="grid">' + t.items.map(card).join("") + '</div>' : '<p class="empty">Nothing here yet.</p>') + '</section>';
  const count = l => RESOURCES[l][subject].reduce((a, t) => a + t.items.length, 0);
  const topics = RESOURCES[level][subject], n = count(level);
  document.getElementById("content").innerHTML =
    '<section class="subject" data-subject="' + subject + '"><div class="subject-head"><h2>' + SUBJECTS[subject] + '</h2>' +
    '<div class="level-switch" role="tablist" aria-label="Level">' + LEVELS.map(([id, name]) =>
      '<button class="level-btn" type="button" role="tab" data-level="' + id + '" aria-selected="' + (id === level) + '">' + name + ' (' + count(id) + ')</button>').join("") + '</div>' +
    '<span class="count">' + n + (n === 1 ? ' resource' : ' resources') + '</span></div>' + topics.map(topic).join("") + '</section>';
  document.querySelectorAll(".level-btn").forEach(b => b.onclick = () => { level = b.dataset.level; show(); });
  try{ history.replaceState(null, "", "#" + subject + "-" + level); }catch(e){}
}
document.querySelectorAll(".subject-btn").forEach(b => b.onclick = () => { subject = b.dataset.subject; show(); });
(() => { const h = location.hash.slice(1).split("-");
  if (SUBJECTS[h[0]]) { subject = h[0]; if (h[1] === "gcse" || h[1] === "alevel") level = h[1]; }
  else if (h[0] === "gcse" || h[0] === "alevel") level = h[0];
  show(); })();
</script>
</body>
</html>
