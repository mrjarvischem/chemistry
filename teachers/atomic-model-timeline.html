<!DOCTYPE html>
<html lang="en-GB">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Model Timeline</title>
<style>
/* Layout idea: a timeline rail on top; below it one experiment "instrument" (dark screen) beside the before/after models, then the three teaching notes. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#131c2b; --muted:#56637a; --line:#d3dae6;
  --accent:#2a4fc9; --accent-soft:#e3e9fb; --on-accent:#ffffff; --screen:#0c1220; --warn:#b4530a;
  --font:"Avenir Next","Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1420;--panel:#182033;--ink:#e8edf7;--muted:#9aa7bf;--line:#2c3750;--accent:#8fa8ff;--accent-soft:#222e4f;--on-accent:#0c1220;--screen:#070b14;--warn:#ffb46b;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1420;--panel:#182033;--ink:#e8edf7;--muted:#9aa7bf;--line:#2c3750;--accent:#8fa8ff;--accent-soft:#222e4f;--on-accent:#0c1220;--screen:#070b14;--warn:#ffb46b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 32px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
h1{font-size:1.55rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.rail{overflow-x:auto;padding-bottom:4px}
.rail ol{list-style:none;margin:0;padding:0;display:flex;gap:6px;min-width:max-content}
.rail button{font:inherit;cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-align:left;display:flex;flex-direction:column;min-width:118px}
.rail button b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.rail button span{font-size:.85rem;color:var(--muted)}
.rail button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rail button[aria-current="true"] span{color:var(--on-accent);opacity:.85}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.head h2{margin:0;font-size:1.35rem;text-wrap:balance}
.head .who{color:var(--muted)}
.pill{font-size:.8rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.beyond{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h3{margin:0 0 8px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
canvas{display:block;width:100%;background:var(--screen);border-radius:10px}
#exp{aspect-ratio:640/400}
.controls{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;margin-top:12px}
.controls button,.controls select,.nav button{font:inherit;font-size:.95rem;cursor:pointer;border-radius:9px;padding:8px 14px;border:1px solid var(--accent);background:var(--panel);color:var(--accent)}
.controls button.go{background:var(--accent);color:var(--on-accent)}
.controls button.tg[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.controls button.tg::before{content:"○ "}
.controls button.tg[aria-pressed="true"]::before{content:"● "}
.controls label{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted);gap:2px;min-width:170px;flex:1 1 170px;max-width:280px}
.controls label output{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.controls input[type=range]{width:100%;accent-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.readout{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-variant-numeric:tabular-nums;min-height:2.9em}
.readout small{display:block;color:var(--muted);margin-top:4px}
.tally{display:flex;flex-wrap:wrap;gap:6px 18px}
.tally b{font-size:1.15rem}
.models{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.models figure{margin:0}
.models canvas{aspect-ratio:1}
.models figcaption{font-size:.88rem;margin-top:6px;text-align:center}
.models figcaption b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.arrow{font-size:1.6rem;color:var(--accent)}
.side{display:flex;flex-direction:column;gap:16px}
.ask{border-left:4px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 10px 10px 0}
.ask b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.notes p{margin:0;max-width:65ch}
.nav{display:flex;justify-content:space-between;gap:12px}
.nav button:disabled{opacity:.4;cursor:default}
@media (max-width:860px){.grid{grid-template-columns:1fr}.notes{grid-template-columns:1fr}body{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Atomic Model Timeline</h1>
    <p>Seven experiments, 1803 to 1932. Run each one and see how it changed the model of the atom.</p>
  </header>

  <nav class="rail" aria-label="Timeline"><ol id="rail"></ol></nav>

  <div class="head">
    <h2 id="title"></h2><span class="who" id="who"></span><span class="pill" id="level"></span>
  </div>

  <div class="grid">
    <section class="card" aria-label="Experiment">
      <h3>The experiment</h3>
      <canvas id="exp"></canvas>
      <div class="controls" id="controls"></div>
      <div class="readout" id="readout" aria-live="off"></div>
    </section>
    <div class="side">
      <section class="card" aria-label="Model change">
        <h3>The model</h3>
        <div class="models">
          <figure><canvas id="mA"></canvas><figcaption><b>Before</b><span id="capA"></span></figcaption></figure>
          <div class="arrow" aria-hidden="true">→</div>
          <figure><canvas id="mB"></canvas><figcaption><b>After</b><span id="capB"></span></figcaption></figure>
        </div>
      </section>
      <div class="ask"><b>Ask the class</b><span id="ask"></span></div>
    </div>
  </div>

  <div class="notes">
    <section class="card"><h3>What was seen</h3><p id="saw"></p></section>
    <section class="card"><h3>What it meant</h3><p id="meant"></p></section>
    <section class="card"><h3>How the model changed</h3><p id="change"></p></section>
  </div>

  <div class="nav"><button id="prev">← Previous</button><button id="next">Next →</button></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a);
const FONT='"Avenir Next","Segoe UI",system-ui,sans-serif';
const INK='#c9d4e6', DIM='#7f8ca6';
function gauss(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(TAU*Math.random())}
function ball(c,x,y,r,col,glow){c.save();if(glow){c.shadowColor=col;c.shadowBlur=glow}c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.restore()}
function sph(c,x,y,r,a,b){const g=c.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function txt(c,s,x,y,o={}){c.font=`${o.w||500} ${o.s||15}px ${FONT}`;c.fillStyle=o.c||INK;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';c.fillText(s,x,y)}
function box(c,x,y,w,h,fill,stroke){c.beginPath();c.rect(x,y,w,h);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke()}}
function wl2rgb(l,a=1){let r=0,g=0,b=0;
  if(l<440){r=(440-l)/60;b=1}else if(l<490){g=(l-440)/50;b=1}else if(l<510){g=1;b=(510-l)/20}else if(l<580){r=(l-510)/70;g=1}else if(l<645){r=1;g=(645-l)/65}else r=1;
  const f=l<420?.3+.7*(l-380)/40:l>700?.3+.7*(750-l)/50:1;
  return `rgba(${r*f*255|0},${g*f*255|0},${b*f*255|0},${a})`}

/* ---------- models (260 x 260) ---------- */
const CL=[[0,0],[9,0],[-9,0],[4.5,8],[-4.5,8],[4.5,-8],[-4.5,-8],[13.5,8],[-13.5,-8],[0,16],[0,-16],[13.5,-8],[-13.5,8]];
const CLOUD=[];for(let i=0;i<1100;i++){const r=Math.random()<.4?-Math.log(Math.random()*Math.random())*13:(()=>{let s=0;for(let k=0;k<6;k++)s-=Math.log(Math.random());return s*13})();if(r<122)CLOUD.push([r,rnd(0,TAU),rnd(0,TAU)])}
const PUD=[[-45,-30],[30,-55],[55,10],[-10,5],[-60,35],[15,50],[-25,-65],[60,-30],[-20,60]];
function nucleus(c,kind){
  if(kind=='plain'){sph(c,130,130,9,'#ffb39b','#d6452f');return}
  CL.forEach((p,i)=>{const n=kind=='pn'&&i%2;sph(c,130+p[0],130+p[1],5.6,n?'#e3e8f0':'#ffb39b',n?'#8792a6':'#d6452f')})}
function shells(c,t){[[46,2],[80,8],[110,1]].forEach(([r,n],k)=>{
  c.strokeStyle='rgba(160,180,220,.45)';c.lineWidth=1.2;c.beginPath();c.arc(130,130,r,0,TAU);c.stroke();
  for(let i=0;i<n;i++){const a=i/n*TAU+t*(.5-k*.13);ball(c,130+r*Math.cos(a),130+r*Math.sin(a),4.2,'#6fb6ff',6)}})}
function model(c,kind,t){
  c.clearRect(0,0,260,260);
  if(kind=='idea'){c.setLineDash([7,7]);c.strokeStyle=DIM;c.lineWidth=2;c.beginPath();c.arc(130,130,88,0,TAU);c.stroke();c.setLineDash([]);txt(c,'?',130,134,{s:96,a:'center',b:'middle',c:DIM,w:300})}
  if(kind=='sphere')sph(c,130,130,96,'#b9c6dc','#3c4a66');
  if(kind=='pudding'){sph(c,130,130,104,'rgba(255,150,140,.75)','rgba(190,60,70,.55)');
    for(let i=0;i<7;i++)txt(c,'+',130+78*Math.cos(i*.9+.4)*(.4+.6*((i*37)%10)/10),134+78*Math.sin(i*.9+.4)*(.4+.6*((i*53)%10)/10),{s:20,a:'center',c:'rgba(255,235,230,.7)'});
    PUD.forEach((p,i)=>ball(c,130+p[0]+2*Math.sin(t*2+i),130+p[1]+2*Math.cos(t*1.7+i*2),6,'#6fb6ff',8))}
  if(kind=='nuclear'){for(let k=0;k<3;k++){c.save();c.translate(130,130);c.rotate(k*TAU/6+.3);c.strokeStyle='rgba(160,180,220,.3)';c.lineWidth=1;c.beginPath();c.ellipse(0,0,108,40,0,0,TAU);c.stroke();
      const a=t*(1.1+k*.3)+k*2;ball(c,108*Math.cos(a),40*Math.sin(a),4.5,'#6fb6ff',8);c.restore()}nucleus(c,'plain')}
  if(kind=='bohr'){shells(c,t);nucleus(c,'plain')}
  if(kind=='bohrP'){shells(c,t);nucleus(c,'p')}
  if(kind=='bohrPN'){shells(c,t);nucleus(c,'pn')}
  if(kind=='cloud'){CLOUD.forEach(p=>{const a=.25+.55*(.5+.5*Math.sin(t*1.6+p[2]));c.fillStyle=`rgba(111,182,255,${a})`;c.fillRect(130+p[0]*Math.cos(p[1]),130+p[0]*Math.sin(p[1]),1.8,1.8)});nucleus(c,'p')}
}

/* ---------- stages ---------- */
const GCSE='GCSE Chemistry and Physics';
const STAGES=[
/* 1 Dalton */
{year:'1803',short:'Dalton',title:'Combining masses',who:'John Dalton, 1803',level:GCSE,
 A:['idea','Ancient Greek idea, no evidence'],B:['sphere','Solid sphere'],
 saw:'Elements always combine in fixed mass ratios. Carbon forms two oxides. For the same mass of carbon, the second oxide contains exactly twice the mass of oxygen.',
 meant:'Matter comes in units that cannot be split and that join in whole numbers: one carbon with one oxygen, or one carbon with two.',
 change:'An untested idea became a scientific model. Atoms are tiny solid spheres that cannot be divided, and all atoms of one element are identical.',
 ask:'If matter could be cut up for ever, why would an exact 2 : 1 ratio be surprising?',
 controls:`<label>Mass of carbon burned <output id="o-m">6 g</output><input type="range" id="m" min="3" max="12" step="3" value="6"></label><button class="tg" id="p" aria-pressed="false">Show Dalton's explanation</button>`,
 init(){this.m=6;this.p=false},
 on(k,v){if(k=='m'){this.m=+v;$('#o-m').textContent=v+' g'}if(k=='p')this.p=!this.p},
 draw(c){const m=this.m;[[20,'Oxide A: limited oxygen',m*16/12,1],[330,'Oxide B: plenty of oxygen',m*32/12,2]].forEach(([x,t,o,k])=>{
   box(c,x,14,290,372,'rgba(255,255,255,.03)','rgba(160,180,220,.2)');txt(c,t,x+145,42,{a:'center',s:17,w:600});
   const by=258,sc=5.6;box(c,x+70,by-m*sc,52,m*sc,'#8d98ad');box(c,x+168,by-o*sc,52,o*sc,'#ff6b6b');
   txt(c,m.toFixed(1)+' g',x+96,by-m*sc-8,{a:'center',s:17,w:600});txt(c,o.toFixed(1)+' g',x+194,by-o*sc-8,{a:'center',s:17,w:600});
   txt(c,'carbon',x+96,by+20,{a:'center',c:DIM});txt(c,'oxygen',x+194,by+20,{a:'center',c:DIM});
   if(this.p){const n=m/3,w=k==1?46:68,x0=x+145-(n*w+(n-1)*8)/2;for(let i=0;i<n;i++){const cx=x0+i*(w+8)+w/2;
     if(k==2)sph(c,cx-22,332,11,'#ff9d9d','#c93838');sph(c,cx+(k==1?-11:0),332,11,'#aab4c6','#4a556b');sph(c,cx+(k==1?11:22),332,11,'#ff9d9d','#c93838')}
     txt(c,k==1?'1 carbon : 1 oxygen':'1 carbon : 2 oxygen',x+145,372,{a:'center',c:DIM})}
   else txt(c,'What is happening to the particles?',x+145,338,{a:'center',c:DIM,s:14})})},
 readout(){const m=this.m;return `<div class="tally"><span>Oxygen in A <b>${(m*16/12).toFixed(1)} g</b></span><span>Oxygen in B <b>${(m*32/12).toFixed(1)} g</b></span><span>B ÷ A <b>2.00</b></span></div><small>Change the mass of carbon. The ratio never changes.</small>`}},

/* 2 Thomson */
{year:'1897',short:'Thomson',title:'Cathode ray tube',who:'J. J. Thomson, 1897',level:GCSE,
 A:['sphere','Solid sphere'],B:['pudding','Plum pudding'],
 saw:'Cathode rays bend towards a positive plate. Their charge-to-mass ratio is the same whatever metal the cathode is made from, and the particles are about 2000 times lighter than a hydrogen atom.',
 meant:'The rays are streams of tiny negative particles, electrons, and they come from inside every kind of atom. Atoms can be divided after all.',
 change:'Atoms are neutral, so the negative electrons must be balanced by positive charge. Plum pudding model: a ball of positive charge with negative electrons embedded in it.',
 ask:'Thomson only found negative particles. How did he know the atom must also contain positive charge?',
 controls:`<label>Voltage across plates <output id="o-v">0 V</output><input type="range" id="v" min="-200" max="200" step="10" value="0"></label><label>Magnetic field <output id="o-b">0 %</output><input type="range" id="b" min="-100" max="100" step="5" value="0"></label><select id="metal" aria-label="Cathode metal"><option>Cathode: aluminium</option><option>Cathode: iron</option><option>Cathode: platinum</option><option>Cathode: copper</option></select>`,
 init(){this.v=0;this.b=0;this.metal='aluminium'},
 on(k,v){if(k=='v'){this.v=+v;$('#o-v').textContent=v+' V'}if(k=='b'){this.b=+v;$('#o-b').textContent=v+' %'}if(k=='metal')this.metal=v.split(': ')[1]},
 draw(c,t){const d=Math.max(-1.25,Math.min(1.25,this.v/200-this.b/100)),a=.00125*d;
   c.beginPath();c.moveTo(40,172);c.lineTo(200,172);c.bezierCurveTo(240,172,240,110,280,110);c.lineTo(560,110);c.quadraticCurveTo(612,200,560,290);c.lineTo(280,290);c.bezierCurveTo(240,290,240,228,200,228);c.lineTo(40,228);c.closePath();
   c.fillStyle='rgba(120,160,220,.07)';c.fill();c.strokeStyle='rgba(170,200,240,.55)';c.lineWidth=2;c.stroke();
   box(c,56,182,8,36,'#aab4c6');txt(c,'cathode −',40,160,{c:DIM,s:14});
   [118,146].forEach(x=>{box(c,x,176,6,20,'#aab4c6');box(c,x,204,6,20,'#aab4c6')});txt(c,'anodes +',104,160,{c:DIM,s:14});
   if(this.b){c.globalAlpha=Math.min(1,Math.abs(this.b)/60+.25);for(let x=312;x<=408;x+=32)for(let y=168;y<=232;y+=32)txt(c,this.b>0?'×':'•',x,y,{a:'center',b:'middle',c:'#b48cff',s:20});c.globalAlpha=1}
   const pc=v=>v>0?'#ff7a7a':v<0?'#6fb6ff':'#aab4c6';box(c,300,146,120,6,pc(this.v));box(c,300,248,120,6,pc(-this.v));
   if(this.v){txt(c,this.v>0?'+':'−',430,156,{s:22,w:700,c:pc(this.v)});txt(c,this.v>0?'−':'+',430,260,{s:22,w:700,c:pc(-this.v)})}
   const yAt=x=>x<300?200:x<420?200-a*(x-300)**2:200-a*14400-2*a*120*(x-420);
   c.save();c.shadowColor='#7dffb0';c.shadowBlur=14;c.strokeStyle='#9dffc4';c.lineWidth=2.5;c.setLineDash([14,7]);c.lineDashOffset=-t*140;
   c.beginPath();c.moveTo(64,200);for(let x=70;x<=588;x+=6)c.lineTo(x,yAt(x));c.stroke();c.restore();
   for(let y=120;y<=280;y+=20){c.strokeStyle='rgba(170,200,240,.35)';c.lineWidth=1;c.beginPath();c.moveTo(588,y);c.lineTo(y==200?574:581,y);c.stroke()}
   ball(c,588,yAt(588),6,'#c8ffd9',22);
   txt(c,'fluorescent screen',600,330,{a:'right',c:DIM,s:14});txt(c,'deflecting plates',360,330,{a:'center',c:DIM,s:14})},
 readout(){const d=this.v/200-this.b/100;let s=this.v==0&&this.b==0?'No fields: the beam travels in a straight line.':Math.abs(d)<.03?'The electric and magnetic forces balance. Thomson used this to find the speed of the particles.':this.v!=0?`The beam bends ${d*Math.sign(this.v)>0?'towards':'away from'} the positive plate${this.b?' (the magnetic field is acting too)':', so the particles are negative'}.`:'A magnetic field bends the beam, so the rays are moving charged particles.';
   return `${s}<small>Cathode: ${this.metal}. Charge-to-mass ratio measured: the same for every metal.</small>`}},

/* 3 Rutherford */
{year:'1909',short:'Rutherford',title:'Alpha particle scattering',who:'Geiger and Marsden, directed by Ernest Rutherford, 1909 (nuclear model 1911)',level:GCSE,
 A:['pudding','Plum pudding'],B:['nuclear','Nuclear model'],
 saw:'Most alpha particles went straight through the gold foil. Some were deflected through small angles. A very few, about 1 in 8000, bounced back.',
 meant:'Most of the atom is empty space. The mass and the positive charge are concentrated in a tiny central nucleus, which repels the positive alpha particles.',
 change:'The plum pudding model was replaced by the nuclear model: a small, dense, positive nucleus with the electrons around it.',
 ask:'Which observation shows the nucleus is tiny? Which shows it is positively charged?',
 controls:`<button class="go" id="one">Fire one</button><button class="tg" id="run" aria-pressed="false">Fire a stream</button><button id="k">Fire 1000</button><button class="tg" id="pud" aria-pressed="false">Test the plum pudding prediction</button><button id="reset">Reset</button>`,
 init(){this.mode='nuclear';this.run=false;this.ps=[];this.dots=[];this.n=[0,0,0];this.f=0},
 on(k){if(k=='one')this.fire(1);if(k=='run')this.run=!this.run;if(k=='k')for(let i=0;i<1000;i++)this.fire(0);
   if(k=='pud'){this.mode=this.mode=='nuclear'?'pudding':'nuclear';this.clear()}if(k=='reset')this.clear()},
 clear(){this.ps=[];this.dots=[];this.n=[0,0,0]},
 fire(anim){const R=175,y0=200+rnd(-88,88);let ny=92;for(let i=0;i<7;i++)if(Math.abs(y0-(92+i*36))<Math.abs(y0-ny))ny=92+i*36;
   const b=y0-ny,th=this.mode=='nuclear'?2*Math.atan(.42/Math.max(Math.abs(b),1e-3)):Math.abs(rnd(-.02,.02)),phi=(b>=0?1:-1)*th;
   const dx=Math.cos(phi),dy=Math.sin(phi),oy=y0-200,B=oy*dy,s=-B+Math.sqrt(B*B-(oy*oy-R*R));
   const p={y0,dx,dy,s,x:92,d:0,ph:0,age:0,ex:360+dx*s,ey:y0+dy*s,cls:th<.1745?0:th<Math.PI/2?1:2};
   if(anim)this.ps.push(p);else this.land(p)},
 land(p){this.n[p.cls]++;this.dots.push(p);if(this.dots.length>1600)this.dots.shift()},
 draw(c,t,dt){const COL=['#9ff0c0','#ffd166','#ff5c7a'];
   if(this.run){this.f+=dt;while(this.f>.07){this.f-=.07;this.fire(1)}}

$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#controls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('tg'))b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!='true');STAGES[cur].on(b.id)});
$('#controls').addEventListener('input',e=>{if(e.target.matches('input,select'))STAGES[cur].on(e.target.id,e.target.value)});
function frame(ms){const t=ms/1000,dt=Math.min(.05,t-last);last=t;const s=STAGES[cur];
  fit(exp,ec,640,400);ec.clearRect(0,0,640,400);ec.save();s.draw(ec,t,dt);ec.restore();
  fit(mA,ca,260,260);model(ca,s.A[0],t);fit(mB,cb,260,260);model(cb,s.B[0],t);
  const ro=s.readout();if(ro!=lastRO){$('#readout').innerHTML=ro;lastRO=ro}
  requestAnimationFrame(frame)}
go(0);requestAnimationFrame(frame);
</script>
</body>
</html>
