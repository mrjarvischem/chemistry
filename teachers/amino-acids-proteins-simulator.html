<!DOCTYPE html>
<html lang="en">
<head>
<script src="gate.js"></script>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino Acids to Proteins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Instrument bench, matching Atom Viewer, Bonding Simulator and Electrophilic Addition:
     step chips across the top, stage over a detail panel on the left, explain rail on the right. */
  --bg:#EDF0F5; --surface:#FFFFFF; --soft:#E6EAF2; --ink:#0D1424; --muted:#566076; --line:#D7DDE8;
  --accent:#2348F5; --accent-ink:#FFFFFF;
  --stage:#FAFBFE; --stage2:#E3E8F2; --stage-line:#93A0B8;
  --dot:#E23B2E; --pair:#F5A700; --bond:#6A7488; --bond-hi:#C3CAD8;
  --hb:#0E9F8E; --ion:#B43BD0; --ss:#D9A400; --zw:#1E8E5A;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#080C15; --surface:#111828; --soft:#1A2337; --ink:#EDF1FA; --muted:#98A3BA; --line:#242E46;
    --accent:#8198FF; --accent-ink:#0A0F1C;
    --stage:#0E1527; --stage2:#05080F; --stage-line:#5A6884;
    --dot:#FF6A5C; --pair:#FFC53D; --bond:#8E99B0; --bond-hi:#DCE2EE;
    --hb:#3FD6C2; --ion:#DB7CF2; --ss:#FFD23D; --zw:#5FD79A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:10px 14px;padding:12px 18px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1}
.pick{display:flex;align-items:center;gap:7px}
.pick>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.18)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-weight:600;font-size:13.5px}

.timeline{display:flex;gap:6px;padding:4px 18px 12px;overflow-x:auto;scrollbar-width:none}
.timeline::-webkit-scrollbar{display:none}
.timeline button{flex:1 0 auto;min-width:128px;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:8px 12px 9px;display:flex;flex-direction:column;gap:1px}
.timeline .yr{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.timeline .nm{font-family:var(--font-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.15}
.timeline button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.timeline button[aria-pressed="true"] .yr{color:inherit;opacity:.7}

.bench{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;padding:0 18px 16px}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.panel{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stagebox{flex:1.6 1 0;min-height:270px;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--stage-line) 22%,transparent) 1px,transparent 1.5px) 0 0/22px 22px,
             radial-gradient(ellipse at 50% 45%,var(--stage),var(--stage2))}
#stage,#mol{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#mol{padding:44px 14px 14px}
.ov{position:absolute;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:2}
.ov>*{pointer-events:auto}
.ov.tl{top:12px;left:12px}.ov.tr{top:12px;right:12px}.ov.bl{bottom:12px;left:12px;right:12px}
.pill{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(8px);
  border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sq{width:34px;height:34px;padding:0;display:grid;place-items:center;font-size:17px;line-height:1}
.pill.big{font-size:15px;padding:6px 14px}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 10px;border-radius:999px;
  background:color-mix(in srgb,var(--surface) 78%,transparent)}
.key{display:flex;gap:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 12px;border-radius:14px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.key i.ln{width:18px;height:0;border-radius:0;border-top:3px solid;vertical-align:3px}
.key i.ln.d{border-top-style:dashed}

.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:40px}
.ctrl>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl .grow{flex:1 1 300px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);justify-content:center}
.ctrl .sp{margin-left:auto}
.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
input[type=range]{accent-color:var(--accent);flex:1 1 160px;min-width:120px;height:28px}
.phval{font-family:var(--font-display);font-weight:700;font-size:22px;min-width:86px;font-variant-numeric:tabular-nums}

.lower{flex:1 1 0;min-height:215px;display:flex}
.lower>*{flex:1;min-width:0}
.lower svg{width:100%;height:100%;display:block}
.lower .ov.tl+*{padding-top:0}
#plot text,#hbsvg text,#mol text,#frag text{font-family:var(--font-body)}
.ax{font-size:17px;font-weight:600;fill:var(--muted)}
.cl{font-size:18px;font-weight:700}
.at{font-weight:600;font-size:24px;fill:var(--ink);dominant-baseline:central;text-anchor:middle}
.at.mut{fill:var(--muted)}
.sd{font-weight:600;font-size:22px;fill:var(--ink);dominant-baseline:central}
.chg{fill:var(--dot)}
.bd{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.cap{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;text-anchor:middle}
.dl{font-size:17px;font-weight:700;fill:var(--dot);dominant-baseline:central;text-anchor:middle}
@keyframes pulse{from{opacity:.55}to{opacity:0}}
.pulse{fill:var(--pair);animation:pulse .8s ease-out both}

.info{padding:44px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.bigeq{font-family:var(--font-display);font-weight:700;font-size:clamp(20px,2.3vw,30px);letter-spacing:-.01em;line-height:1.2}
.bigeq small{display:block;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;background:var(--soft)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;border-top:4px solid var(--c,var(--line))}
.tile b{font-size:15.5px}
.tile .f{font-size:clamp(15px,1.5vw,19px);font-weight:700;white-space:nowrap}
.tile small{font-size:13.5px;color:var(--muted);line-height:1.35}

.rail{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.card h2{font-family:var(--font-display);font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1.1;margin:4px 0 10px;text-wrap:balance}
.card p{font-size:16.5px;line-height:1.5}
.card p+p{margin-top:9px}
.card h3{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.pts{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{font-size:15.5px;line-height:1.4;padding-left:16px;border-left:3px solid var(--dot)}
.badge{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.note{font-size:13px;color:var(--muted)}

@media (max-width:980px){
  html,body{height:auto}
  .bench{grid-template-columns:1fr}
  .stagebox{flex:none;height:380px}
  .lower{flex:none;min-height:240px}
  .lower svg{min-height:240px}
  .tiles{grid-template-columns:1fr}
  .rail{overflow:visible}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 22 L12 10 L20 22 L27 10" fill="none" stroke="var(--bond)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5" cy="22" r="4.2" fill="var(--accent)"/><circle cx="12" cy="10" r="4.2" fill="var(--ink)"/><circle cx="20" cy="22" r="4.2" fill="var(--dot)"/><circle cx="27" cy="10" r="4.2" fill="var(--ink)"/></svg>
    <h1>Amino Acids to Proteins</h1>
  </div>
  <div class="pick" id="pkLen"><span>Molecule</span>
    <div class="seg" id="segLen">
      <button data-v="1">Amino acid</button>
      <button data-v="2">Dipeptide</button>
      <button data-v="3">Tripeptide</button>
    </div>
  </div>
  <div class="pick" id="pkAA"><span>R groups</span>
    <select class="sel" id="aa0" aria-label="First amino acid"></select>
    <select class="sel" id="aa1" aria-label="Second amino acid"></select>
    <select class="sel" id="aa2" aria-label="Third amino acid"></select>
  </div>
  <div class="pick" id="pkSec"><span>Secondary</span>
    <div class="seg" id="segSec">
      <button data-v="helix">α-helix</button>
      <button data-v="sheet">β-pleated sheet</button>
    </div>
  </div>
</div>

<div class="timeline" id="tl"></div>

<div class="bench">
  <div class="col">
    <div class="panel stagebox">
      <svg id="mol" role="img" aria-label="Displayed structure"></svg>
      <canvas id="stage" aria-label="3D model of the polypeptide chain. Drag to rotate."></canvas>
      <div class="ov tl"><span class="tag" id="stTag"></span></div>
      <div class="ov tr" id="ovMol">
        <span class="pill big" id="qPill"></span>
        <button class="pill" id="tgGroups" aria-pressed="true">Highlight groups</button>
      </div>
      <div class="ov tr" id="ov3d">
        <button class="pill sq" id="zOut" aria-label="Zoom out">−</button>
        <button class="pill sq" id="zIn" aria-label="Zoom in">+</button>
        <button class="pill" id="vReset">Reset view</button>
      </div>
      <div class="ov bl"><div class="key" id="key"></div></div>
    </div>

    <div class="ctrl">
      <div id="cPH" class="grow">
        <span class="lab">pH</span>
        <input type="range" id="ph" min="0" max="14" step="0.1" value="7" aria-label="pH">
        <span class="phval" id="phVal"></span>
        <button class="btn" id="phAcid">Acid · pH 1</button>
        <button class="btn" id="phIso">Isoelectric point</button>
        <button class="btn" id="phAlk">Alkali · pH 13</button>
      </div>
      <div id="cPep" class="grow">
        <button class="btn go" id="bCond">Condense ▶</button>
        <button class="btn" id="bHyd">◀ Hydrolyse</button>
        <input type="range" id="scrub" min="0" max="1" step="0.005" value="0" aria-label="Reaction progress">
        <button class="btn" id="bSwap">Swap order</button>
      </div>
      <div id="cProt" class="grow">
        <button class="btn" id="bPrev">◀ Previous level</button>
        <button class="btn go" id="bBuild">Build the protein ▶</button>
        <button class="btn" id="bNext">Next level ▶</button>
      </div>
      <div class="sp" id="cSpeed"><span class="lab">Speed</span>
        <div class="seg" id="segSp">
          <button data-v="0.45">Slow</button>
          <button data-v="1">Normal</button>
          <button data-v="2">Fast</button>
        </div>
      </div>
    </div>

    <div class="panel lower">
      <div class="ov tl"><span class="tag" id="lowTag"></span></div>
      <svg id="plot" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Fraction of each ion against pH"></svg>
      <div class="info" id="info"></div>
    </div>
  </div>

  <aside class="rail">
    <div class="card" id="explain"></div>
    <div class="card" id="points"></div>
    <div class="card" id="extra"></div>
    <p class="note">Keys: ← → move between stages, space to play. AQA A-level Chemistry 3.3.13.</p>
  </aside>
</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const hide=(el,b)=>el.toggleAttribute('hidden',!!b);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmtQ=q=>q===0?'0':(q>0?'+':'−')+Math.abs(q);

/* ---------- amino acid data (pK values: α-COOH, α-NH3+, side chain) ---------- */
const AA={
 Gly:{name:'Glycine',R:'H',cls:'np',pK:[2.34,9.60]},
 Ala:{name:'Alanine',R:'CH₃',cls:'np',pK:[2.34,9.69]},
 Val:{name:'Valine',R:'CH(CH₃)₂',cls:'np',pK:[2.32,9.62]},
 Leu:{name:'Leucine',R:'CH₂CH(CH₃)₂',cls:'np'},
 Phe:{name:'Phenylalanine',R:'CH₂C₆H₅',cls:'np',pK:[1.83,9.13]},
 Met:{name:'Methionine',R:'CH₂CH₂SCH₃',cls:'np'},
 Ser:{name:'Serine',R:'CH₂OH',cls:'po',pK:[2.21,9.15]},
 Thr:{name:'Threonine',R:'CH(OH)CH₃',cls:'po'},
 Asn:{name:'Asparagine',R:'CH₂CONH₂',cls:'po'},
 Tyr:{name:'Tyrosine',R:'CH₂C₆H₄OH',cls:'po'},
 Cys:{name:'Cysteine',cls:'cy',pK:[1.96,10.28],side:{t:'acid',pK:8.18,pKp:8.3,stem:'CH₂',hi:'SH',lo:'S⁻',g:'–SH'}},
 Asp:{name:'Aspartic acid',cls:'ac',pK:[1.88,9.60],side:{t:'acid',pK:3.65,pKp:3.9,stem:'CH₂',hi:'COOH',lo:'COO⁻',g:'R-group –COOH'}},
 Glu:{name:'Glutamic acid',cls:'ac',pK:[2.19,9.67],side:{t:'acid',pK:4.25,pKp:4.2,stem:'CH₂CH₂',hi:'COOH',lo:'COO⁻',g:'R-group –COOH'}},
 Lys:{name:'Lysine',cls:'ba',pK:[2.18,8.95],side:{t:'base',pK:10.53,pKp:10.5,stem:'CH₂(CH₂)₃',hi:'NH₃⁺',lo:'NH₂',g:'R-group –NH₃⁺'}}
};
const PICK=['Gly','Ala','Val','Ser','Cys','Phe','Asp','Glu','Lys'];
const CLS={np:{n:'non-polar R',c:['#D3D9E6','#808BA1','#3A4254']},po:{n:'polar R',c:['#B4ECCB','#2FA866','#14603A']},
 ac:{n:'acidic R',c:['#FFB1A8','#E0392B','#8A180F']},ba:{n:'basic R',c:['#B5C2FF','#3D5BF0','#1A2C99']},cy:{n:'cysteine (–SH)',c:['#FFF2A8','#E9B91C','#8F6E08']}};
const CHAINC=[['#B5C2FF','#3D5BF0','#1A2C99'],['#FFD0AC','#F07B2A','#99430C'],['#A5E3FA','#1F9FD6','#0B5578'],['#FFE9A3','#EDB01C','#8A6205']];

/* ---------- state ---------- */
const S={chip:0,len:1,aa:['Ala','Gly','Ser'],pH:7,t:0,groups:true,sec:'helix',speed:1,sel:11};
let pepAnim=null, pulses={}, lastProt=null;
const res=()=>S.aa.slice(0,S.chip===1?Math.max(2,S.len):S.len);

/* ---------- acid–base model ---------- */
function groupsOf(r){
  const one=r.length===1, g=[];
  g.push({id:'N',t:'base',pK:one?AA[r[0]].pK[1]:8.0,g:'–NH₃⁺'});
  g.push({id:'C',t:'acid',pK:one?AA[r[0]].pK[0]:3.3,g:'–COOH'});
  r.forEach((a,i)=>{const s=AA[a].side;if(s)g.push({id:'S'+i,t:s.t,pK:one?s.pK:s.pKp,g:s.g});});
  return g;
}
const fProt=(pK,pH)=>1/(1+Math.pow(10,pH-pK));
function dist(g,pH){
  let d={0:1};
  g.forEach(x=>{const fp=fProt(x.pK,pH),cp=x.t==='base'?1:0,nd={};
    for(const k in d){const q=+k;nd[q+cp]=(nd[q+cp]||0)+d[k]*fp;nd[q+cp-1]=(nd[q+cp-1]||0)+d[k]*(1-fp);}
    d=nd;});
  return d;
}
function avgQ(g,pH){const d=dist(g,pH);let s=0;for(const k in d)s+=(+k)*d[k];return s;}
function isoPoint(g){let lo=0,hi=14;for(let i=0;i<40;i++){const m=(lo+hi)/2;if(avgQ(g,m)>0)lo=m;else hi=m;}return (lo+hi)/2;}
function protAt(g,pH){const p={};g.forEach(x=>p[x.id]=pH<x.pK);return p;}
function neutralProt(r){const p={N:false,C:true};r.forEach((a,i)=>{const s=AA[a].side;if(s)p['S'+i]=s.t==='acid';});return p;}
function netQ(g,p){let q=0;g.forEach(x=>{q+=x.t==='base'?(p[x.id]?1:0):(p[x.id]?0:-1);});return q;}

/* ---------- displayed-structure renderer ---------- */
const U=58;
function chainSVG(r,o){
  o=o||{};const n=r.length,t=o.t==null?1:o.t,p=o.prot||neutralProt(r);
  const a=ease(clamp(t/.25)),b=ease(clamp((t-.25)/.4)),c=ease(clamp((t-.65)/.35));
  const sep=o.water?(1-c)*2.35*U:0;
  let bg='',bd='',at='',fg='';
  let x1=1e9,x2=-1e9,y1=-U-24,y2=U+24;
  const ext=(xa,xb)=>{x1=Math.min(x1,xa);x2=Math.max(x2,xb);};
  const A=(x,y,s,cls,op)=>{at+=`<text class="at ${cls||''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"${op!=null?` opacity="${op.toFixed(2)}"`:''}>${s}</text>`;ext(x-14,x+14);};
  const B=(xa,ya,xb,yb,k)=>{k=k||{};const op=k.op==null?1:k.op;if(op<=.01)return;
    const dx=xb-xa,dy=yb-ya,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,pa=k.pa==null?15:k.pa,pb=k.pb==null?15:k.pb;
    if(L<pa+pb+2)return;
    const X1=xa+ux*pa,Y1=ya+uy*pa,X2=xb-ux*pb,Y2=yb-uy*pb;
    const ln=(ox,oy)=>`<line class="bd" x1="${(X1+ox).toFixed(1)}" y1="${(Y1+oy).toFixed(1)}" x2="${(X2+ox).toFixed(1)}" y2="${(Y2+oy).toFixed(1)}" opacity="${op.toFixed(2)}"${k.col?` style="stroke:${k.col}"`:''}/>`;
    if(k.dbl)bd+=ln(-uy*3.6,ux*3.6)+ln(uy*3.6,-ux*3.6);else bd+=ln(0,0);};

function railPH(r,g,p,q){

  COL={ink:g('--ink'),muted:g('--muted'),bond:g('--bond'),hb:g('--hb'),ion:g('--ion'),ss:g('--ss'),surface:g('--surface'),accent:g('--accent')};}
function layoutFor(L){return L===0?LAY.primary:L===1?LAY[S.sec]:L===2?LAY.tert:quat(0,1);}
function rot(p,yw,pt){const cy=Math.cos(yw),sy=Math.sin(yw),cp=Math.cos(pt),sp=Math.sin(pt);const x=p[0]*cy+p[2]*sy,z=-p[0]*sy+p[2]*cy;return [x,p[1]*cp-z*sp,p[1]*sp+z*cp];}
function fit(L){const arrs=L===3?[0,1,2,3].map(k=>quat(k,1)):[layoutFor(L)],c=CAMS[L];let hx=.1,hy=.1;
  arrs.forEach(a=>a.forEach(p=>{const q=rot(p,c[0],c[1]);hx=Math.max(hx,Math.abs(q[0]));hy=Math.max(hy,Math.abs(q[1]));}));
  return Math.min(CW/(2*hx+1.3),(CH-56)/(2*hy+.95));}
function setLevel(L,snap){
  V.level=L;V.from=V.P.map(p=>p.slice());V.to=layoutFor(L);V.mt=snap?1:0;
  V.qaF=V.qa;V.qaT=L===3?1:0;
  V.cam={y0:V.yaw,p0:V.pitch,s0:V.sc,y1:CAMS[L][0],p1:CAMS[L][1],s1:fit(L)};V.zoom=1;
  if(snap){V.P=V.to.map(p=>p.slice());V.qa=V.qaT;V.yaw=V.cam.y1;V.pitch=V.cam.p1;V.sc=V.cam.s1;V.cam=null;}
  kick();
}
function kick(){if(!V.run){V.run=true;V.last=performance.now();requestAnimationFrame(frame);}}
function frame(now){
  const dt=Math.min(.05,(now-V.last)/1000);V.last=now;let busy=false;
  if(V.mt<1){V.mt=Math.min(1,V.mt+dt*S.speed/2);const e=ease(V.mt);
    for(let i=0;i<NRES;i++)V.P[i]=lerp3(V.from[i],V.to[i],e);
    V.qa=lerp(V.qaF,V.qaT,e);
    if(V.cam){V.yaw=lerp(V.cam.y0,V.cam.y1,e);V.pitch=lerp(V.cam.p0,V.cam.p1,e);V.sc=lerp(V.cam.s0,V.cam.s1,e);}
    busy=true;if(V.mt>=1){V.cam=null;V.dwell=now+1500/S.speed;}}
  else if(V.build){busy=true;if(now>V.dwell){if(V.level<3)goChip(V.level+3);else{V.build=false;syncBuild();}}}
  draw3d();
  if(busy&&S.chip>=2)requestAnimationFrame(frame);else{V.run=false;if(S.chip<2){V.build=false;syncBuild();}}
}
function draw3d(){
  if(!CW)return;const dpr=window.devicePixelRatio||1;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,CW,CH);
  const sc=V.sc*V.zoom,D=34,cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);
  const pr=p=>{const x=p[0]*cy+p[2]*sy,z0=-p[0]*sy+p[2]*cy,y=p[1]*cp-z0*sp,z=p[1]*sp+z0*cp,f=D/(D-z);return [CW/2+x*sc*f,CH/2+8-y*sc*f,z,f];};
  const items=[],chains=V.qa>.01?4:1,PP=[];
  const cr=(a,b,c,d,t)=>{const t2=t*t,t3=t2*t;return .5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);};
  for(let k=0;k<chains;k++){
    const Wd=k===0?V.P:quat(k,1+1.3*(1-V.qa)),pts=Wd.map(pr);PP.push(pts);
    for(let i=0;i<NRES;i++){items.push({z:pts[i][2],t:0,k,i});
      if(i){const p0=Wd[i-2]||Wd[i-1],p1=Wd[i-1],p2=Wd[i],p3=Wd[i+1]||Wd[i];let prev=pts[i-1];
        for(let j=1;j<=4;j++){const t=j/4,q=j===4?pts[i]:pr([cr(p0[0],p1[0],p2[0],p3[0],t),cr(p0[1],p1[1],p2[1],p3[1],t),cr(p0[2],p1[2],p2[2],p3[2],t)]);
          items.push({z:(prev[2]+q[2])/2-.05,t:1,k,a:prev,b:q});prev=q;}}}
  }
  items.sort((m,n)=>m.z-n.z);
  const byChain=V.qa>.5,lab=(i,p,r)=>{cx.fillStyle=AA[SEQ[i]].cls==='cy'?'#2a2200':'#fff';
      cx.font=`700 ${Math.min(16,r*.78).toFixed(1)}px "Instrument Sans",system-ui,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';
      cx.shadowColor=AA[SEQ[i]].cls==='cy'?'rgba(255,255,255,.5)':'rgba(0,0,0,.45)';cx.shadowBlur=3;cx.fillText(SEQ[i],p[0],p[1]+.5);cx.shadowBlur=0;};
  items.forEach(it=>{
    cx.globalAlpha=it.k?V.qa:1;
    if(it.t){cx.strokeStyle=COL.bond;cx.lineWidth=Math.max(2,sc*.15*it.b[3]);cx.lineCap='round';cx.beginPath();cx.moveTo(it.a[0],it.a[1]);cx.lineTo(it.b[0],it.b[1]);cx.stroke();return;}
    const pts=PP[it.k],p=pts[it.i];
    const r=RAD*sc*p[3],c=byChain?CHAINC[it.k]:CLS[AA[SEQ[it.i]].cls].c;
    const g=cx.createRadialGradient(p[0]-r*.35,p[1]-r*.4,r*.08,p[0],p[1],r*1.05);g.addColorStop(0,c[0]);g.addColorStop(.55,c[1]);g.addColorStop(1,c[2]);
    cx.fillStyle=g;cx.beginPath();cx.arc(p[0],p[1],r,0,6.2832);cx.fill();
    if(it.k===0&&it.i===S.sel&&V.level===0){cx.strokeStyle=COL.ink;cx.lineWidth=3;cx.beginPath();cx.arc(p[0],p[1],r+4,0,6.2832);cx.stroke();}
    if(V.level===0&&V.qa<.01&&r>=12)lab(it.i,p,r);
  });
  cx.globalAlpha=1;
  const pts=PP[0],settle=ease(clamp((V.mt-.75)/.25));
  const dash=(a,b,col,w,d,al)=>{cx.globalAlpha=al;cx.strokeStyle=col;cx.lineWidth=w;cx.setLineDash(d);cx.lineCap='round';cx.beginPath();cx.moveTo(pts[a][0],pts[a][1]);cx.lineTo(pts[b][0],pts[b][1]);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1;};
  const hb=V.level===1?HB[S.sec]:V.level===2?HB.tert:null;
  if(hb&&settle>0)hb.forEach(h=>dash(h[0],h[1],COL.hb,V.level===1?3:2,[5,6],settle*(V.level===1?.95:.55)));
  if(V.level===2&&settle>0)XT.forEach(x=>{
    const col=COL[x.k];dash(x.a,x.b,col,x.k==='ss'?6:4,x.k==='ss'?[]:[7,7],settle);
    cx.globalAlpha=settle;[x.a,x.b].forEach(i=>{const r=RAD*sc*pts[i][3];if(r>=11)lab(i,pts[i],r);});
    const mx=(pts[x.a][0]+pts[x.b][0])/2,my=(pts[x.a][1]+pts[x.b][1])/2;cx.globalAlpha=settle;
    cx.font='700 14px "Instrument Sans",system-ui,sans-serif';const w=cx.measureText(x.lab).width+16;
    cx.fillStyle=COL.surface;cx.strokeStyle=col;cx.lineWidth=2;cx.beginPath();cx.roundRect(mx-w/2,my-12,w,24,12);cx.fill();cx.stroke();
    cx.fillStyle=COL.ink;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(x.lab,mx,my+.5);cx.globalAlpha=1;});
  if(V.level===0&&V.mt>=1){cx.fillStyle=COL.muted;cx.font='700 14px "Instrument Sans",system-ui,sans-serif';cx.textBaseline='middle';
    const a=pts[0],b=pts[NRES-1],r=RAD*sc;cx.textAlign='right';cx.fillText('H₂N–  N-terminus',a[0]-r-8,a[1]);cx.fillText('C-terminus  –COOH',b[0]-r-8,b[1]);}
  V.pts=pts;V.rpx=RAD*sc;
}
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=window.devicePixelRatio||1;CW=r.width;CH=r.height;cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);
  if(S.chip>=2){if(V.mt>=1)V.sc=fit(V.level);else if(V.cam)V.cam.s1=fit(V.level);draw3d();}}
/* pointer: drag rotates, click selects a residue */
(function(){let dn=null;
  cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,mv:0};cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;dn.x=e.clientX;dn.y=e.clientY;dn.mv+=Math.abs(dx)+Math.abs(dy);
    if(dn.mv>4){V.yaw+=dx*.008;V.pitch=clamp(V.pitch+dy*.008,-1.4,1.4);if(V.cam){V.cam.y0=V.cam.y1=V.yaw;V.cam.p0=V.cam.p1=V.pitch;}draw3d();}});
  cv.addEventListener('pointerup',e=>{if(dn&&dn.mv<=4&&V.pts){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=1e9,bi=-1;
      V.pts.forEach((p,i)=>{const d=Math.hypot(p[0]-x,p[1]-y);if(d<best){best=d;bi=i;}});
      if(bi>=0&&best<V.rpx+6){S.sel=bi;if(V.level===0)lower3d();draw3d();}}dn=null;});
  cv.addEventListener('wheel',e=>{e.preventDefault();V.zoom=clamp(V.zoom*(e.deltaY<0?1.08:.926),.4,4);draw3d();},{passive:false});
})();

function hbSVG(){
  const u=50,T=62,Bt=T+3.3*u;let b='',a='';
  const A=(x,y,s,c)=>{a+=`<text class="at ${c||''}" x="${x}" y="${y}">${s}</text>`;};
  const L=(x1,y1,x2,y2,pa,pb,dbl)=>{const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;pa=pa==null?15:pa;pb=pb==null?15:pb;
    const ln=(ox,oy)=>`<line class="bd" x1="${x1+ux*pa+ox}" y1="${y1+uy*pa+oy}" x2="${x2-ux*pb+ox}" y2="${y2-uy*pb+oy}"/>`;b+=dbl?ln(-uy*3.6,ux*3.6)+ln(uy*3.6,-ux*3.6):ln(0,0);};
  const xs=[110,205,285,380,475,555,650];
  const row=(y,labs,ups)=>{A(40,y,'⋯','mut');A(720,y,'⋯','mut');L(40,y,xs[0],y,15,30);L(xs[6],y,720,y,30,15);
    labs.forEach((s,i)=>{A(xs[i],y,s);if(i)L(xs[i-1],y,xs[i],y,labs[i-1]==='CHR'?30:15,s==='CHR'?30:15);
      if(s==='C'){const d=ups[i];A(xs[i],y+d*u,'O');L(xs[i],y,xs[i],y+d*u,15,15,1);}
      if(s==='N'){const d=ups[i];A(xs[i],y+d*u,'H');L(xs[i],y,xs[i],y+d*u);}});};
  row(T,['CHR','C','N','CHR','C','N','CHR'],[0,1,-1,0,-1,1,0]);
  row(Bt,['CHR','N','C','CHR','N','C','CHR'],[0,-1,1,0,1,-1,0]);
  const hbond=(x)=>{b+=`<line x1="${x}" y1="${T+u+17}" x2="${x}" y2="${Bt-u-17}" stroke="var(--hb)" stroke-width="4" stroke-dasharray="3 8" stroke-linecap="round"/>`;};
  hbond(xs[1]);hbond(xs[5]);
  a+=`<text class="dl" x="${xs[1]+27}" y="${T+u}">δ−</text><text class="dl" x="${xs[1]+27}" y="${Bt-u}">δ+</text>`;
  a+=`<text class="dl" x="${xs[5]+27}" y="${T+u}">δ+</text><text class="dl" x="${xs[5]+27}" y="${Bt-u}">δ−</text>`;
  a+=`<circle cx="${xs[1]-13}" cy="${T+u+14}" r="2.6" fill="var(--dot)"/><circle cx="${xs[1]-6}" cy="${T+u+18}" r="2.6" fill="var(--dot)"/>`;
  a+=`<circle cx="${xs[5]-13}" cy="${Bt-u-14}" r="2.6" fill="var(--dot)"/><circle cx="${xs[5]-6}" cy="${Bt-u-18}" r="2.6" fill="var(--dot)"/>`;
  a+=`<text class="cap" x="${(xs[1]+xs[5])/2}" y="${(T+Bt)/2+5}" fill="var(--hb)">hydrogen bonds: N–H ····· O=C</text>`;
  return `<svg id="hbsvg" viewBox="0 ${T-u-22} 760 ${Bt-T+2*u+44}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Hydrogen bonds between two parts of the chain" style="padding-top:26px">${b}${a}</svg>`;
}
function lower3d(){

  }else if(L===1){$('lowTag').textContent=S.sec==='helix'?'Zoom in: C=O bonds to N–H four residues along':'Zoom in: neighbouring strands';
    info.style.padding='0';info.innerHTML=hbSVG();
  }else if(L===2){$('lowTag').textContent='What holds the fold: interactions between R groups';
    info.innerHTML=`<div class="tiles">
      <div class="tile" style="--c:var(--ss)"><b>Disulfide bridge</b><span class="f">–CH₂–S–S–CH₂–</span><small>Covalent bond between two cysteine R groups. The strongest of the three.</small></div>
      <div class="tile" style="--c:var(--hb)"><b>Hydrogen bond</b><span class="f">–O–H ····· O=C–</span><small>Between polar R groups, such as –OH, –NH₂ and C=O.</small></div>
      <div class="tile" style="--c:var(--ion)"><b>Ionic interaction</b><span class="f">–COO⁻ ····· ⁺H₃N–</span><small>Between an acidic and a basic R group. Changes with pH.</small></div></div>`;
  }else{$('lowTag').textContent='Four chains, one protein';
    info.innerHTML=`<div class="tiles">
      <div class="tile" style="--c:#3D5BF0"><b>Each colour is one chain</b><small>Every chain keeps its own primary, secondary and tertiary structure.</small></div>
      <div class="tile" style="--c:#F07B2A"><b>Same interactions</b><small>Hydrogen bonds, ionic interactions and S–S bridges between R groups on different chains hold them together.</small></div>
      <div class="tile" style="--c:var(--muted)"><b>Example</b><small>Haemoglobin: two α chains and two β chains. Insulin: two chains joined by S–S bridges.</small></div></div>`;
  }
}
const RAILS=[
 {eb:'1° structure',h:'Primary: the sequence',p:'The order of amino acids along the chain, joined by peptide links. It is written from the –NH₂ end to the –COOH end.',

 {eb:'2° structure',h:'Secondary: helix or sheet',p:'The chain coils into an α-helix or folds back into a β-pleated sheet. Both are held by hydrogen bonds between the C=O of one peptide link and the N–H of another.',
  pts:['α-helix: each C=O hydrogen bonds to an N–H four amino acids further along the same chain.','β-pleated sheet: hydrogen bonds form between neighbouring stretches of chain lying side by side.','The R groups are not involved; they point outwards.'],
  xh:'Hydrogen bond',x:'The lone pair on the δ− oxygen of C=O is attracted to the δ+ hydrogen of N–H. Use the Secondary switch at the top to compare the two shapes.'},

$('bBuild').onclick=()=>{if(V.build){V.build=false;syncBuild();return;}
  V.build=true;syncBuild();if(V.level===3||S.chip!==2&&V.level===0){goChip(2,true);}V.dwell=performance.now()+900/S.speed;kick();};
$('zIn').onclick=()=>{V.zoom=clamp(V.zoom*1.2,.4,4);draw3d();};$('zOut').onclick=()=>{V.zoom=clamp(V.zoom/1.2,.4,4);draw3d();};
$('vReset').onclick=()=>{V.zoom=1;V.yaw=CAMS[V.level][0];V.pitch=CAMS[V.level][1];V.sc=fit(V.level);draw3d();};
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
  if(e.target.type==='range'&&e.key!==' ')return;
  if(e.key==='ArrowRight'&&S.chip<5){V.build=false;syncBuild();goChip(S.chip+1);}
  else if(e.key==='ArrowLeft'&&S.chip>0){V.build=false;syncBuild();goChip(S.chip-1);}
  else if(e.key===' '){e.preventDefault();if(S.chip===1){if(pepAnim)pepAnim=null;else playPep(S.t>=.999?-1:1);}else if(S.chip>=2)$('bBuild').click();}});
new ResizeObserver(resize).observe(cv.parentElement);
if(window.matchMedia)matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readCols();if(S.chip>=2)draw3d();});
readCols();segSync('segSec',S.sec);segSync('segSp',1);syncBuild();goChip(0);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.chip>=2)draw3d();});
})();
</script>
</body>
</html>
