const DATA = [[{"s": "AQA Jun 2022 · 1F", "q": "Which is a property of diamond?", "o": [{"t": "Very hard", "c": 1, "f": ""}, {"t": "Conducts electricity", "c": 0, "f": "Diamond has no delocalised electrons, so it does not conduct."}, {"t": "Low melting point", "c": 0, "f": "Diamond has a very high melting point because lots of strong covalent bonds must be broken."}], "e": " Each carbon atom forms four strong covalent bonds in a rigid giant structure, so diamond is very hard."}, {"s": "AQA Nov 2021 · 1F", "q": "What is the type of bonding in sodium?", "o": [{"t": "Metallic", "c": 1, "f": ""}, {"t": "Covalent", "c": 0, "f": "Covalent bonding is between non-metal atoms."}, {"t": "Ionic", "c": 0, "f": "Ionic bonding is between a metal and a non-metal."}], "e": " Sodium is a metal element, so the bonding is metallic: positive ions in a sea of delocalised electrons."}, {"s": "Adapted from AQA Nov 2020 · 1F", "q": "A molecule of citric acid contains only carbon, hydrogen and oxygen atoms. What type of bonding holds the atoms together in the molecule?", "o": [{"t": "Covalent", "c": 1, "f": ""}, {"t": "Ionic", "c": 0, "f": "Ionic bonding needs a metal."}, {"t": "Metallic", "c": 0, "f": "Metallic bonding is only in metals."}], "e": " Carbon, hydrogen and oxygen are all non-metals, so they share pairs of electrons: covalent bonds."}, {"s": "New question", "q": "What type of bonding is found in compounds formed between metals and non-metals?", "o": [{"t": "Ionic", "c": 1, "f": ""}, {"t": "Covalent", "c": 0, "f": "Covalent bonding is between non-metals only."}, {"t": "Metallic", "c": 0, "f": "Metallic bonding is in metal elements and alloys."}], "e": " Metal atoms transfer electrons to non-metal atoms, forming oppositely charged ions."}, {"s": "AQA Jun 2022 · 1F", "q": "How many covalent bonds does each carbon atom form in diamond?", "o": [{"t": "4", "c": 1, "f": ""}, {"t": "1", "c": 0, "f": ""}, {"t": "2", "c": 0, "f": ""}, {"t": "3", "c": 0, "f": "3 bonds per carbon is graphite (and graphene)."}], "e": " In diamond every carbon atom is bonded to four other carbon atoms."}, {"s": "AQA Jun 2022 · 1F", "q": "What is the state symbol for molten sodium chloride?", "o": [{"t": "(l)", "c": 1, "f": ""}, {"t": "(aq)", "c": 0, "f": "(aq) means dissolved in water. Molten means melted, with no water."}, {"t": "(g)", "c": 0, "f": ""}, {"t": "(s)", "c": 0, "f": ""}], "e": " Molten = melted = liquid, so the state symbol is (l)."}, {"s": "Adapted from AQA Jun 2022 · 1H", "q": "C<sub>70</sub> is a hollow, ball-shaped molecule made only of carbon atoms. What is the name of this type of molecule?", "o": [{"t": "Fullerene", "c": 1, "f": ""}, {"t": "Graphene", "c": 0, "f": "Graphene is a single flat layer of graphite."}, {"t": "Nanotube", "c": 0, "f": "Nanotubes are cylindrical fullerenes, not balls."}, {"t": "Polymer", "c": 0, "f": "Polymers are long chains made from repeating units."}], "e": " Fullerenes are hollow molecules of carbon. C<sub>60</sub> (Buckminsterfullerene) is spherical."}, {"s": "New question", "q": "What happens to electrons when an ionic bond forms?", "o": [{"t": "Electrons are transferred from the metal atom to the non-metal atom.", "c": 1, "f": ""}, {"t": "Electrons are shared between the two atoms.", "c": 0, "f": "Sharing electrons is covalent bonding."}, {"t": "Electrons are transferred from the non-metal atom to the metal atom.", "c": 0, "f": "Metals lose electrons; non-metals gain them."}, {"t": "Electrons become delocalised.", "c": 0, "f": "Delocalised electrons are found in metallic bonding."}], "e": " The metal loses electrons to become a positive ion and the non-metal gains them to become a negative ion."}, {"s": "New question", "q": "In which state are the particles far apart and moving quickly in random directions?", "o": [{"t": "Gas", "c": 1, "f": ""}, {"t": "Liquid", "c": 0, "f": "In a liquid the particles touch but can move past each other."}, {"t": "Solid", "c": 0, "f": "In a solid the particles are in fixed positions and vibrate."}], "e": " In a gas the particles are far apart and move quickly and randomly, so the forces between them are very weak."}, {"s": "New question", "q": "What is a covalent bond?", "o": [{"t": "A shared pair of electrons between two atoms", "c": 1, "f": ""}, {"t": "The attraction between oppositely charged ions", "c": 0, "f": "That is an ionic bond."}, {"t": "The attraction between positive ions and delocalised electrons", "c": 0, "f": "That is a metallic bond."}, {"t": "A weak force between two molecules", "c": 0, "f": "That is an intermolecular force."}], "e": " A covalent bond is a shared pair of electrons between two non-metal atoms. It is strong."}], [{"s": "AQA Nov 2021 · 1F/1H", "q": "Propanone is a liquid with a low boiling point. Why does propanone have a low boiling point?", "o": [{"t": "The intermolecular forces are weak.", "c": 1, "f": ""}, {"t": "The covalent bonds are weak.", "c": 0, "f": "Covalent bonds are strong and are not broken when a simple molecular substance boils."}, {"t": "The covalent bonds are strong.", "c": 0, "f": ""}, {"t": "The intermolecular forces are strong.", "c": 0, "f": ""}], "e": " Boiling a simple molecular substance only breaks the weak intermolecular forces between molecules. The covalent bonds stay intact."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "Why does graphite conduct electricity?", "o": [{"t": "There are delocalised electrons in graphite.", "c": 1, "f": ""}, {"t": "Graphite has hexagonal rings of carbon atoms.", "c": 0, "f": "This describes the structure but doesn't explain conduction."}, {"t": "The bonds between carbon atoms in the layers are strong.", "c": 0, "f": "Strong bonds explain the high melting point."}, {"t": "Graphite contains ions that can move.", "c": 0, "f": "Graphite is made of carbon atoms, not ions."}], "e": " Each carbon forms 3 bonds, leaving one delocalised electron that can move through the layers and carry charge."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "Why is graphite soft?", "o": [{"t": "There are no covalent bonds between the layers, so the layers can slide over each other.", "c": 1, "f": ""}, {"t": "There are delocalised electrons in graphite.", "c": 0, "f": "Delocalised electrons explain conduction, not softness."}, {"t": "The covalent bonds in the layers are weak.", "c": 0, "f": "The bonds within the layers are strong covalent bonds."}, {"t": "Each carbon atom forms four covalent bonds.", "c": 0, "f": "That is diamond, which is very hard."}], "e": " The layers are only held by weak forces, so they slide easily. This is why graphite is used as a lubricant and in pencils."}, {"s": "AQA Jun 2023 · 1F", "q": "What happens to the atoms in pure tin as the tin melts?", "o": [{"t": "The atoms gain energy and their arrangement becomes less ordered.", "c": 1, "f": ""}, {"t": "The atoms gain energy and their arrangement becomes more ordered.", "c": 0, "f": ""}, {"t": "The atoms lose energy and their arrangement becomes less ordered.", "c": 0, "f": "Melting needs energy put in, so the atoms gain energy."}, {"t": "The atoms lose energy and their arrangement becomes more ordered.", "c": 0, "f": "That describes freezing."}], "e": " Energy is transferred to the atoms. This is enough to overcome some of the attractions so the regular arrangement breaks down."}, {"s": "AQA Jun 2023 · 1F", "q": "Titanium oxide contains Ti<sup>4+</sup> ions and O<sup>2−</sup> ions. What is the formula of titanium oxide?", "o": [{"t": "TiO<sub>2</sub>", "c": 1, "f": ""}, {"t": "TiO<sub>4</sub>", "c": 0, "f": "That would give charges of +4 and −8."}, {"t": "Ti<sub>2</sub>O", "c": 0, "f": "That would give charges of +8 and −2."}, {"t": "Ti<sub>4</sub>O<sub>2</sub>", "c": 0, "f": "The charges must cancel and the formula should be in its simplest ratio."}], "e": " One Ti<sup>4+</sup> (+4) needs two O<sup>2−</sup> (2 × −2 = −4) for the charges to cancel: TiO<sub>2</sub>."}, {"s": "Adapted from AQA Nov 2020 · 1F", "q": "Why does aluminium have a high melting point?", "o": [{"t": "Aluminium has strong metallic bonds.", "c": 1, "f": ""}, {"t": "Aluminium has delocalised electrons.", "c": 0, "f": "Delocalised electrons explain conduction."}, {"t": "Aluminium has layers of atoms which can slide.", "c": 0, "f": "Sliding layers explain why metals can be bent and shaped."}, {"t": "Aluminium has weak intermolecular forces.", "c": 0, "f": "Metals do not have intermolecular forces."}], "e": " There is a strong electrostatic attraction between the positive metal ions and the delocalised electrons. A lot of energy is needed to overcome it."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "Why is an alloy harder than the pure metal?", "o": [{"t": "Different sized atoms distort the layers, so the layers cannot slide over each other easily.", "c": 1, "f": ""}, {"t": "The atoms in an alloy are all the same size, so they pack together more tightly.", "c": 0, "f": ""}, {"t": "Alloys have covalent bonds between the atoms.", "c": 0, "f": "Alloys still have metallic bonding."}, {"t": "Alloys have more delocalised electrons.", "c": 0, "f": "This does not explain hardness."}], "e": " In a pure metal the layers of identical atoms slide easily. Atoms of a different size disrupt the layers, so they can't slide."}, {"s": "AQA Nov 2020 · 1F", "q": "Bromine has a melting point of −7 °C and a boiling point of 59 °C. What is the state of bromine at 100 °C?", "o": [{"t": "Gas", "c": 1, "f": ""}, {"t": "Liquid", "c": 0, "f": "100 °C is above the boiling point."}, {"t": "Solid", "c": 0, "f": "100 °C is far above the melting point."}], "e": " Above its boiling point a substance is a gas. 100 °C > 59 °C."}, {"s": "Adapted from AQA Jun 2022 · 1F", "q": "What happens when a magnesium atom reacts with an oxygen atom to form magnesium oxide?", "o": [{"t": "Magnesium transfers two electrons to oxygen.", "c": 1, "f": ""}, {"t": "Oxygen transfers two electrons to magnesium.", "c": 0, "f": "Metals lose electrons; non-metals gain them."}, {"t": "Magnesium and oxygen share a pair of electrons.", "c": 0, "f": "Sharing is covalent bonding, but this is a metal and a non-metal."}, {"t": "Magnesium transfers one electron to oxygen.", "c": 0, "f": "Magnesium (2,8,2) must lose 2 electrons to get a full outer shell."}], "e": " Mg (2,8,2) → Mg<sup>2+</sup> (2,8). O (2,6) → O<sup>2−</sup> (2,8). The oppositely charged ions attract."}, {"s": "New question", "q": "A sodium atom has the electronic structure 2,8,1. What is the charge on a sodium ion?", "o": [{"t": "1+", "c": 1, "f": ""}, {"t": "1−", "c": 0, "f": "Sodium loses an electron, so the ion has more protons than electrons and is positive."}, {"t": "2+", "c": 0, "f": ""}, {"t": "7−", "c": 0, "f": "It's far easier to lose 1 electron than gain 7."}], "e": " Sodium loses its 1 outer electron to become Na<sup>+</sup> with structure 2,8."}], [{"s": "AQA Nov 2020 · 1F/1H", "q": "Which two substances have intermolecular forces between their particles?", "o": [{"t": "Poly(ethene) and water", "c": 1, "f": ""}, {"t": "Diamond and water", "c": 0, "f": "Diamond is giant covalent: there are no separate molecules, so there are no intermolecular forces."}, {"t": "Magnesium and sodium chloride", "c": 0, "f": "These are metallic and ionic, so they have no molecules."}, {"t": "Diamond and poly(ethene)", "c": 0, "f": ""}], "e": " Only substances made of molecules have intermolecular forces. Water is small molecules and poly(ethene) is a polymer (large molecules)."}, {"s": "AQA Nov 2021 · 1H", "q": "The table shows information about four substances.<table><tr><th>Substance</th><th>Melting point (°C)</th><th>Boiling point (°C)</th><th>Conducts as a solid?</th><th>Conducts as a liquid?</th></tr><tr><td>A</td><td>−117</td><td>79</td><td>No</td><td>No</td></tr><tr><td>B</td><td>801</td><td>1413</td><td>No</td><td>Yes</td></tr><tr><td>C</td><td>1535</td><td>2750</td><td>Yes</td><td>Yes</td></tr><tr><td>D</td><td>1610</td><td>2230</td><td>No</td><td>No</td></tr></table>Which substance could be a metal?", "o": [{"t": "C", "c": 1, "f": ""}, {"t": "A", "c": 0, "f": "A low melting point and no conduction means a simple molecular substance."}, {"t": "B", "c": 0, "f": "B conducts only when liquid, so it is ionic."}, {"t": "D", "c": 0, "f": "D has a high melting point but never conducts, so it is giant covalent."}], "e": " Metals conduct as both solids and liquids, because their delocalised electrons can always move. They also have high melting points."}, {"s": "Adapted from AQA Nov 2021 · 1H", "q": "Use the same table.<table><tr><th>Substance</th><th>Melting point (°C)</th><th>Boiling point (°C)</th><th>Conducts as a solid?</th><th>Conducts as a liquid?</th></tr><tr><td>A</td><td>−117</td><td>79</td><td>No</td><td>No</td></tr><tr><td>B</td><td>801</td><td>1413</td><td>No</td><td>Yes</td></tr><tr><td>C</td><td>1535</td><td>2750</td><td>Yes</td><td>Yes</td></tr><tr><td>D</td><td>1610</td><td>2230</td><td>No</td><td>No</td></tr></table>Which substance is most likely to be an ionic compound?", "o": [{"t": "B", "c": 1, "f": ""}, {"t": "A", "c": 0, "f": "A is simple molecular: low melting point, never conducts."}, {"t": "C", "c": 0, "f": "C conducts as a solid, so it is a metal."}, {"t": "D", "c": 0, "f": "D never conducts. A giant ionic substance conducts when molten."}], "e": " Ionic compounds have high melting points. They conduct only when molten (or dissolved), when their ions are free to move."}, {"s": "AQA Nov 2020 · 1H", "q": "Bromine has a melting point of −7 °C and a boiling point of 59 °C. What is the state of bromine at 0 °C and at 100 °C?", "o": [{"t": "Liquid at 0 °C, gas at 100 °C", "c": 1, "f": ""}, {"t": "Solid at 0 °C, gas at 100 °C", "c": 0, "f": "0 °C is above the melting point of −7 °C, so it has already melted."}, {"t": "Solid at 0 °C, liquid at 100 °C", "c": 0, "f": ""}, {"t": "Liquid at 0 °C, liquid at 100 °C", "c": 0, "f": "100 °C is above the boiling point."}], "e": " Between the melting point and boiling point a substance is liquid. −7 < 0 < 59, so it's liquid at 0 °C. 100 °C is above 59 °C, so it's a gas."}, {"s": "AQA Nov 2020 · 1H", "q": "Why is it not correct to say that the boiling point of a <b>single</b> bromine molecule is 59 °C?", "o": [{"t": "Boiling point is a property of a large number of molecules, because it depends on the forces between molecules.", "c": 1, "f": ""}, {"t": "A single molecule boils at a higher temperature because its covalent bond must be broken.", "c": 0, "f": "Boiling does not break covalent bonds."}, {"t": "A single bromine molecule is a gas, because bromine atoms are small.", "c": 0, "f": ""}, {"t": "The covalent bond in a single molecule is weak, so it boils at a lower temperature.", "c": 0, "f": "The Br–Br covalent bond is strong and isn't broken on boiling."}], "e": " States of matter and boiling points belong to bulk substances. One molecule has no intermolecular forces to overcome."}, {"s": "Adapted from AQA Nov 2020 · 1F", "q": "Why do the melting points of the halogens increase going down Group 7?", "o": [{"t": "The molecules get larger, so the intermolecular forces are stronger and need more energy to overcome.", "c": 1, "f": ""}, {"t": "The covalent bonds get stronger, so more energy is needed to break them.", "c": 0, "f": "Melting a halogen overcomes intermolecular forces. It doesn't break the covalent bonds."}, {"t": "The molecules get larger, so the intermolecular forces are weaker.", "c": 0, "f": "Larger molecules have stronger intermolecular forces."}, {"t": "The halogens form ions that attract each other more strongly.", "c": 0, "f": "Halogen elements are made of molecules, not ions."}], "e": " Intermolecular forces are <b>overcome</b> when melting and <b>broken</b> when boiling. Bigger molecules have stronger intermolecular forces, so more energy is needed."}, {"s": "Adapted from AQA Nov 2021 · 1H", "q": "Sodium oxide has a high melting point. Why?", "o": [{"t": "It has a giant lattice with strong electrostatic forces between oppositely charged ions, which need a lot of energy to overcome.", "c": 1, "f": ""}, {"t": "It has strong covalent bonds between sodium and oxygen atoms.", "c": 0, "f": "Sodium oxide is ionic (metal + non-metal), not covalent."}, {"t": "It has strong intermolecular forces between sodium oxide molecules.", "c": 0, "f": "Ionic compounds don't contain molecules."}, {"t": "It has delocalised electrons that hold the ions together.", "c": 0, "f": "Delocalised electrons are in metals, not ionic compounds."}], "e": " Na<sup>+</sup> and O<sup>2−</sup> ions are held in a giant ionic lattice by strong electrostatic attraction in all directions."}, {"s": "Adapted from AQA Jun 2023 · 1H", "q": "Methane (CH<sub>4</sub>) is a gas at room temperature but poly(ethene) is a solid. Why?", "o": [{"t": "Poly(ethene) molecules are much larger, so the intermolecular forces are stronger.", "c": 1, "f": ""}, {"t": "Poly(ethene) has stronger covalent bonds than methane.", "c": 0, "f": "Changing state doesn't break covalent bonds, so their strength isn't the reason."}, {"t": "Poly(ethene) is a giant covalent structure.", "c": 0, "f": "Poly(ethene) is made of very large molecules, but they are still separate molecules."}, {"t": "Methane molecules are larger, so they move faster.", "c": 0, "f": ""}], "e": " Both are molecular. Poly(ethene) chains are huge, so the intermolecular forces are much stronger and more energy is needed to overcome them."}, {"s": "Adapted from AQA Nov 2020 · 1H", "q": "The particle model shows particles as small solid spheres. Which is a limitation of this model?", "o": [{"t": "It does not show the forces between the particles.", "c": 1, "f": ""}, {"t": "It shows the particles moving.", "c": 0, "f": "Showing movement is part of the model, not a limitation."}, {"t": "It shows that gas particles are far apart.", "c": 0, "f": "This is accurate."}, {"t": "It shows that particles in a solid are in a regular arrangement.", "c": 0, "f": "This is accurate."}], "e": " Limitations: there are no forces shown, the particles are not solid spheres, and it doesn't show the particles' real size or the space between them."}, {"s": "Adapted from AQA Jun 2022 · 1F", "q": "Why do ionic compounds conduct electricity when molten but not when solid?", "o": [{"t": "When molten the ions are free to move and carry charge; in the solid they are held in fixed positions.", "c": 1, "f": ""}, {"t": "When molten the electrons are free to move and carry charge.", "c": 0, "f": "In ionic compounds it is the ions that move, not electrons."}, {"t": "When solid there are no ions present.", "c": 0, "f": "The ions are there in the solid, but they can't move."}, {"t": "Melting breaks the ionic bonds and forms molecules that conduct.", "c": 0, "f": "Molecules don't conduct, and no molecules form."}], "e": " Charge is carried by moving charged particles. In a molten or dissolved ionic compound the ions can move."}], [{"s": "New question", "q": "In a molecule of Buckminsterfullerene (C<sub>60</sub>) each carbon atom is bonded to three other carbon atoms. How many carbon–carbon bonds are there in one C<sub>60</sub> molecule?", "o": [{"t": "90", "c": 1, "f": ""}, {"t": "180", "c": 0, "f": "Each bond joins two atoms, so 60 × 3 counts every bond twice."}, {"t": "60", "c": 0, "f": "That is the number of atoms, not bonds."}, {"t": "240", "c": 0, "f": "Each carbon forms 3 bonds in C<sub>60</sub>, not 4."}], "e": " 60 atoms × 3 bonds each = 180 bond ends. Each bond has two ends, so 180 ÷ 2 = 90 bonds."}, {"s": "New question", "q": "Iron(III) sulfate contains Fe<sup>3+</sup> ions and SO<sub>4</sub><sup>2−</sup> ions. How many atoms in total are in one formula unit?", "o": [{"t": "17", "c": 1, "f": ""}, {"t": "6", "c": 0, "f": "FeSO<sub>4</sub> has unbalanced charges (+3 and −2)."}, {"t": "9", "c": 0, "f": "In Fe<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>, the 3 multiplies everything in the bracket, including the oxygen."}, {"t": "12", "c": 0, "f": "12 is just the number of oxygen atoms."}], "e": " Charges: 2 × (+3) = +6 and 3 × (−2) = −6, so the formula is Fe<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>. Atoms: 2 Fe + 3 S + 12 O = 17."}, {"s": "New question", "q": "Aluminium reacts with oxygen to form aluminium oxide, Al<sub>2</sub>O<sub>3</sub>. How many electrons are transferred in forming one formula unit of Al<sub>2</sub>O<sub>3</sub>?", "o": [{"t": "6", "c": 1, "f": ""}, {"t": "3", "c": 0, "f": "3 is the number lost by one Al atom, but there are two Al atoms."}, {"t": "2", "c": 0, "f": "2 is the number gained by one O atom, but there are three O atoms."}, {"t": "5", "c": 0, "f": "Don't add the charges. Total electrons lost must equal total electrons gained."}], "e": " 2 Al each lose 3 = 6 lost. 3 O each gain 2 = 6 gained. Electrons lost = electrons gained = 6."}, {"s": "New question", "q": "A poly(ethene) chain is made from 5000 ethene molecules (C<sub>2</sub>H<sub>4</sub>). Ignoring the ends of the chain, how many hydrogen atoms does the chain contain?", "o": [{"t": "20 000", "c": 1, "f": ""}, {"t": "10 000", "c": 0, "f": "10 000 is the number of carbon atoms (2 per repeat unit)."}, {"t": "5000", "c": 0, "f": "5000 is the number of repeat units. Each one has 4 hydrogen atoms."}, {"t": "4", "c": 0, "f": "4 is the number of hydrogen atoms in just one repeat unit."}], "e": " Each repeat unit –CH<sub>2</sub>–CH<sub>2</sub>– has 4 H atoms. When ethene polymerises no atoms are lost, so H = 4 × 5000 = 20 000."}, {"s": "New question", "q": "A layer of graphite contains 1000 carbon atoms. Each carbon atom forms three covalent bonds. How many delocalised electrons does the layer contain?", "o": [{"t": "1000", "c": 1, "f": ""}, {"t": "4000", "c": 0, "f": "4000 is the total number of outer electrons. Most are used in bonding."}, {"t": "3000", "c": 0, "f": "Each atom uses 3 electrons in bonding. The question asks for the electrons left over."}, {"t": "1500", "c": 0, "f": "1500 is the number of covalent bonds (1000 × 3 ÷ 2)."}], "e": " Carbon has 4 outer electrons. 3 are used in covalent bonds, leaving 1 delocalised electron per atom: 1000 × 1 = 1000."}, {"s": "New question", "q": "In silicon dioxide (SiO<sub>2</sub>) each silicon atom is bonded to four oxygen atoms and each oxygen atom is bonded to two silicon atoms. A piece contains 100 silicon atoms. How many Si–O bonds does it contain?", "o": [{"t": "400", "c": 1, "f": ""}, {"t": "800", "c": 0, "f": "Counting from both the Si side (400) and the O side (400) counts every bond twice."}, {"t": "200", "c": 0, "f": "200 is the number of oxygen atoms."}, {"t": "300", "c": 0, "f": "300 is the total number of atoms."}], "e": " 100 Si × 4 bonds = 400. Check from the oxygen side: 200 O × 2 bonds = 400 ✓ Each Si–O bond has one Si end, so there is no halving here."}, {"s": "New question", "q": "Nitrogen exists as N<sub>2</sub> molecules, held together by a triple bond. How many electrons are shared between the two nitrogen atoms?", "o": [{"t": "6", "c": 1, "f": ""}, {"t": "3", "c": 0, "f": "There are 3 bonds, but each covalent bond is a shared pair of electrons."}, {"t": "2", "c": 0, "f": "2 electrons would be a single bond."}, {"t": "10", "c": 0, "f": "10 is the total number of outer electrons. Each N also keeps a lone pair."}], "e": " Each nitrogen (2,5) needs 3 more electrons, so it shares 3 pairs: 3 bonds × 2 electrons = 6 shared electrons. Each N keeps one lone pair."}, {"s": "Data from AQA Nov 2021 · 1H", "q": "Substance A has a melting point of −117 °C and a boiling point of 79 °C. Over what temperature range is substance A a liquid?", "o": [{"t": "196 °C", "c": 1, "f": ""}, {"t": "38 °C", "c": 0, "f": "79 − 117 ignores the negative sign. 79 − (−117) = 79 + 117."}, {"t": "79 °C", "c": 0, "f": "That only counts from 0 °C, but A is liquid from −117 °C."}, {"t": "117 °C", "c": 0, "f": ""}], "e": " Range = boiling point − melting point = 79 − (−117) = 196 °C."}, {"s": "New question", "q": "Sodium chloride (Na<sup>+</sup>Cl<sup>−</sup>) melts at 801 °C. Magnesium oxide (Mg<sup>2+</sup>O<sup>2−</sup>) melts at 2852 °C. Which is the best explanation for the difference?", "o": [{"t": "The ions in magnesium oxide have higher charges, so the electrostatic forces between them are stronger.", "c": 1, "f": ""}, {"t": "Magnesium oxide has strong covalent bonds.", "c": 0, "f": "Both compounds are ionic."}, {"t": "Magnesium oxide has more ions in its lattice.", "c": 0, "f": "Both are giant lattices with huge numbers of ions. The number isn't the reason."}, {"t": "Magnesium atoms are heavier than sodium atoms.", "c": 0, "f": "Mass doesn't explain the strength of the attraction (and Mg is only slightly heavier)."}], "e": " 2+ and 2− ions attract much more strongly than 1+ and 1− ions, so more energy is needed to overcome the attraction."}, {"s": "New question", "q": "An ion has the electronic structure 2,8,8 and a charge of 2+. Which element formed this ion?", "o": [{"t": "Calcium", "c": 1, "f": ""}, {"t": "Argon", "c": 0, "f": "Argon atoms have 2,8,8, but argon does not form ions."}, {"t": "Sulfur", "c": 0, "f": "Sulfur forms S<sup>2−</sup> with structure 2,8,8. A 2− ion, not 2+."}, {"t": "Potassium", "c": 0, "f": "Potassium forms K<sup>+</sup> (1+) with structure 2,8,8."}], "e": " The ion has 18 electrons. A 2+ ion has lost 2 electrons, so the atom had 20 electrons, which means 20 protons: calcium (2,8,8,2)."}]];

let store = {};
try { store = JSON.parse(localStorage.getItem("mcq-"+TOPIC) || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("mcq-"+TOPIC, JSON.stringify(store)); } catch(e) {} }

const orders = DATA.map(set => set.map(q => shuffle(q.o.map((_,i)=>i))));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur = 0;
const tabs = document.getElementById("tabs"), main = document.getElementById("main");

function levelScore(l){
  const ans = store[l] || {}; let s=0, n=0;
  DATA[l].forEach((q,i)=>{ if(ans[i]!==undefined){ n++; if(q.o[ans[i]].c) s++; } });
  return {s,n};
}
function drawTabs(){
  tabs.innerHTML = "";
  LEVELS.forEach((L,l)=>{
    const b = document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", l===cur);
    b.style.setProperty("--c", L.col);
    const {s,n} = levelScore(l);
    b.innerHTML = `<span class="sc">${n? s+"/10":""}</span><span class="lv">${L.name}</span><span class="tier">${L.tier}</span>`;
    b.onclick = ()=>{ cur=l; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
}
function render(){
  const L = LEVELS[cur]; document.body.style.setProperty("--c", L.col);
  drawTabs();
  const ans = store[cur] || {};
  let h = `<div class="intro"><b>${L.name} · ${L.tier}.</b> ${L.intro} Your first click counts.</div>`;
  DATA[cur].forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="src">${q.s}</span></div><div class="stem">${q.q}</div><div class="opts">`;
    orders[cur][i].forEach((oi,k)=>{
      const o = q.o[oi]; let cls="";
      if(ans[i]!==undefined){ if(o.c) cls="right"; else if(ans[i]===oi) cls="wrong"; }
      h += `<button class="opt ${cls}" data-q="${i}" data-o="${oi}" ${ans[i]!==undefined?"disabled":""}><span class="let">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
    });
    h += `</div><div class="fb" id="fb${i}"></div></div>`;
  });
  h += `<div class="done" id="done"></div>`;
  main.innerHTML = h;
  main.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> choose(+b.dataset.q, +b.dataset.o));
  DATA[cur].forEach((q,i)=>{ if(ans[i]!==undefined) showFb(i, ans[i]); });
  update();
}
function choose(i, oi){
  store[cur] = store[cur] || {};
  if(store[cur][i]!==undefined) return;
  store[cur][i] = oi; save();
  const box = document.getElementById("q"+i);
  box.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true; const o = DATA[cur][i].o[+b.dataset.o];
    if(o.c) b.classList.add("right"); else if(+b.dataset.o===oi) b.classList.add("wrong");
  });
  showFb(i, oi); update(); drawTabs();
}
function showFb(i, oi){
  const q = DATA[cur][i], o = q.o[oi], fb = document.getElementById("fb"+i);
  const right = q.o.find(x=>x.c);
  fb.className = "fb show " + (o.c ? "ok" : "no");
  fb.innerHTML = o.c
    ? `<b>Correct.</b>${q.e}`
    : `<b>Not quite – the answer is: ${right.t}</b>${o.f ? o.f+" " : ""}${q.e}`;
}
function update(){
  const {s,n} = levelScore(cur);
  document.getElementById("score").textContent = `${s} / 10`;
  document.getElementById("answered").textContent = `${n} answered`;
  document.getElementById("prog").style.width = (n*10)+"%";
  const done = document.getElementById("done");
  if(n===10){
    const ans = store[cur]; const wrong = DATA[cur].map((q,i)=>({q,i})).filter(x=>!x.q.o[ans[x.i]].c);
    let h = `<h2>${LEVELS[cur].name} done: ${s} / 10</h2>`;
    if(!wrong.length){ h += `<p>Full marks. ${cur<3 ? "Try "+LEVELS[cur+1].name+" next." : "Excellent work."}</p>`; }
    else {
      h += `<p>Copy these into your fix-it table: write the question in column 1, leave column 2 blank to answer next time, and copy the correct answer into column 3.</p>
      <table class="fix"><tr><th>Question</th><th>My answer next time</th><th>Correct answer</th></tr>`;
      wrong.forEach(x=>{ h += `<tr><td>${x.q.q.replace(/<table[\s\S]*?<\/table>/g," [see table] ")}</td><td></td><td>${x.q.o.find(o=>o.c).t}</td></tr>`; });
      h += `</table>`;
    }
    done.innerHTML = h; done.classList.add("show");
  } else done.classList.remove("show");
}
document.getElementById("reset").onclick = ()=>{
  delete store[cur]; save(); orders[cur] = DATA[cur].map(q=>shuffle(q.o.map((_,i)=>i))); render();
};
render();
</script>
