 forces between layers. Melting depends on breaking the strong covalent bonds in each layer."}, {"s": "Adapted from AQA Jun 2022 · 1H", "q": "Molecules such as C<sub>70</sub> can be used to move drugs around the body. Suggest why.", "o": [{"t": "They are hollow cages that can carry drug molecules inside.", "c": 1, "f": ""}, {"t": "They conduct electricity.", "c": 0, "f": "Conduction doesn't help to carry a drug."}, {"t": "They have a very high melting point.", "c": 0, "f": ""}, {"t": "They are ionic, so they dissolve in blood.", "c": 0, "f": "Fullerenes are covalent molecules."}], "e": " The hollow structure can hold another molecule. Fullerenes have a large surface area too."}, {"s": "New question", "q": "Magnesium reacts with hydrochloric acid at room temperature. Which equation has the correct state symbols?", "o": [{"t": "Mg(s) + 2HCl(aq) → MgCl<sub>2</sub>(aq) + H<sub>2</sub>(g)", "c": 1, "f": ""}, {"t": "Mg(s) + 2HCl(l) → MgCl<sub>2</sub>(aq) + H<sub>2</sub>(g)", "c": 0, "f": "Hydrochloric acid is HCl dissolved in water: (aq)."}, {"t": "Mg(s) + 2HCl(aq) → MgCl<sub>2</sub>(s) + H<sub>2</sub>(g)", "c": 0, "f": "Magnesium chloride is soluble, so it stays dissolved."}, {"t": "Mg(aq) + 2HCl(aq) → MgCl<sub>2</sub>(aq) + H<sub>2</sub>(g)", "c": 0, "f": "Magnesium is a solid metal."}], "e": " The metal is solid, the acid and soluble salt are aqueous, and the hydrogen is a gas."}, {"s": "New question", "q": "Why does poly(ethene) soften on heating at a much lower temperature than diamond melts?", "o": [{"t": "Poly(ethene) only needs intermolecular forces overcome, but diamond needs covalent bonds broken.", "c": 1, "f": ""}, {"t": "Poly(ethene) has weaker covalent bonds than diamond.", "c": 0, "f": "C–C bonds are strong in both. Heating poly(ethene) doesn't break them."}, {"t": "Diamond has stronger intermolecular forces.", "c": 0, "f": "Diamond has no intermolecular forces because it's a giant structure."}, {"t": "Poly(ethene) is ionic.", "c": 0, "f": ""}], "e": " Poly  as ethane: the two Si atoms are bonded to each other and each Si is bonded to three H atoms. How many electrons are shared in one molecule?", "o": [{"t": "14", "c": 1, "f": ""}, {"t": "7", "c": 0, "f": "7 is the number of covalent bonds. Each bond is 2 shared electrons."}, {"t": "12", "c": 0, "f": "Don't forget the Si–Si bond."}, {"t": "8", "c": 0, "f": "8 is the number of atoms."}], "e": " Bonds: 1 Si–Si + 6 Si–H = 7 bonds. 7 × 2 = 14 shared electrons."}, {"s": "Adapted from AQA Jun 2023 · 1F", "q": "A solder alloy has 6 lead atoms for every 24 tin atoms. What percentage of the atoms are lead atoms?", "o": [{"t": "20%", "c": 1, "f": ""}, {"t": "25%", "c": 0, "f": "6 ÷ 24 compares lead with tin. You need lead ÷ total atoms."}, {"t": "80%", "c": 0, "f": "80% is the percentage of tin atoms."}, {"t": "6%", "c": 0, "f": ""}], "e": " Total atoms = 6 + 24 = 30. 6 ÷ 30 × 100 = 20%."}, {"s": "New question", "q": "One layer of graphene is about 0.34 nm thick. Approximately how many layers are there in a 1 mm thick piece of graphite? (1 nm = 1 × 10<sup>−9</sup> m, 1 mm = 1 × 10<sup>−3</sup> m)", "o": [{"t": "2.9 × 10<sup>6</sup>", "c": 1, "f": ""}, {"t": "2.9 × 10<sup>7</sup>", "c": 0, "f": "1 mm is 1 × 10<sup>−3</sup> m, not 1 × 10<sup>−2</sup> m."}, {"t": "3.4 × 10<sup>−7</sup>", "c": 0, "f": "You divided the wrong way round. The number of layers must be big."}, {"t": "2.9 × 10<sup>3</sup>", "c": 0, "f": "Convert both lengths to the same unit first: 0.34 nm = 3.4 × 10<sup>−10</sup> m."}], "e": " (1 × 10<sup>−3</sup>) ÷ (3.4 × 10<sup>−10</sup>) = 2.94 × 10<sup>6</sup> layers, about 3 million."}, {"s": "New question", "q": "Ammonium sulfate contains NH<sub>4</sub><sup>+</sup> and SO<sub>4</sub><sup>2−</sup> ions. How many atoms are in one formula unit?", "o": [{"t": "15", "c": 1, "f": ""}, {"t": "10", "c": 0, "f": "NH<sub>4</sub>SO<sub>4</sub> has charges that don't balance: +1 and −2."}, {"t": "11", "c": 0, "f": "The 2 after the bracket doubles the H as well as the N."}, {"t": "20", "c": 0, "f": ""}], "e": " Two NH<sub>4</sub><sup>+</sup> balance one SO<sub>4</sub><sup>2−</sup>: (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>. Atoms: 2 N + 8 H + 1 S + 4 O = 15."}, {"s": "New question", "q": "A poly(ethene) molecule has a relative formula mass of 28 000. The repeat unit is –CH<sub>2</sub>–CH<sub>2</sub>–. How many repeat units are in the molecule? (A<sub>r</sub>: C = 12, H = 1)", "o": [{"t": "1000", "c": 1, "f": ""}, {"t": "2000", "c": 0, "f": "2000 is the number of CH<sub>2</sub> groups (or carbon atoms)."}, {"t": "2333", "c": 0, "f": "28 000 ÷ 12 only counts carbon. The repeat unit is C<sub>2</sub>H<sub>4</sub>."}, {"t": "4000", "c": 0, "f": "4000 is the number of hydrogen atoms."}], "e": " M<sub>r</sub> of C<sub>2</sub>H<sub>4</sub> = 2 × 12 + 4 × 1 = 28. 28 000 ÷ 28 = 1000 repeat units."}, {"s": "New question", "q": "Metal X forms X<sup>3+</sup> ions. Non-metal Y forms Y<sup>2−</sup> ions. How many ions are in one formula unit of the compound?", "o": [{"t": "5", "c": 1, "f": ""}, {"t": "2", "c": 0, "f": "XY has charges +3 and −2, which don't cancel."}, {"t": "6", "c": 0, "f": "6 is the total positive charge (2 × +3), not the number of ions."}, {"t": "3", "c": 0, "f": ""}], "e": " X<sub>2</sub>Y<sub>3</sub>: 2 × (+3) = +6 and 3 × (−2) = −6. That is 2 + 3 = 5 ions."}, {"s": "New question", "q": "Which substance is a liquid at −20 °C?<table><tr><th>Substance</th><th>Melting point (°C)</th><th>Boiling point (°C)</th></tr><tr><td>A</td><td>−39</td><td>357</td></tr><tr><td>B</td><td>−101</td><td>−35</td></tr><tr><td>C</td><td>0</td><td>100</td></tr><tr><td>D</td><td>−7</td><td>59</td></tr></table>", "o": [{"t": "A", "c": 1, "f": ""}, {"t": "D", "c": 0, "f": "−20 °C is below D's melting point (−7 °C), so D is still solid."}, {"t": "B", "c": 0, "f": "−20 °C is above B's boiling point (−35 °C), so B is a gas."}, {"t": "C", "c": 0, "f": "C is solid below 0 °C."}], "e": " A substance is liquid between its melting and boiling points. Only A: −39 < −20 < 357."}, {"s": "New question", "q": "A diamond crystal contains 1000 carbon atoms. Each carbon is bonded to four others. Ignoring the atoms on the surface, how many covalent bonds are there?", "o": [{"t": "2000", "c": 1, "f": ""}, {"t": "4000", "c": 0, "f": "Each bond joins two atoms, so 1000 × 4 counts every bond twice."}, {"t": "1000", "c": 0, "f": ""}, {"t": "1500", "c": 0, "f": "1500 would be graphite, with 3 bonds per atom."}], "e": " 1000 × 4 = 4000 bond ends. ÷ 2 = 2000 bonds."}, {"s": "New question", "q": "Carbon dioxide (O=C=O) has two double bonds. How many electrons are shared in one CO<sub>2</sub> molecule?", "o": [{"t": "8", "c": 1, "f": ""}, {"t": "4", "c": 0, "f": "4 is the number of bonding pairs. Each pair is 2 electrons."}, {"t": "2", "c": 0, "f": "2 shared electrons is a single bond."}, {"t": "16", "c": 0, "f": "16 is the total number of outer electrons. The oxygens also keep lone pairs."}], "e": " Each double bond = 2 shared pairs = 4 electrons. Two double bonds = 8 shared electrons."}, {"s": "New question", "q": "Calcium chloride contains Ca<sup>2+</sup> and Cl<sup>−</sup> ions. Which ions have the same electronic structure as an argon atom?", "o": [{"t": "Both Ca<sup>2+</sup> and Cl<sup>−</sup>", "c": 1, "f": ""}, {"t": "Only Cl<sup>−</sup>", "c": 0, "f": "Ca (2,8,8,2) loses 2 electrons → 2,8,8 too."}, {"t": "Only Ca<sup>2+</sup>", "c": 0, "f": "Cl (2,8,7) gains 1 electron → 2,8,8 too."}, {"t": "Neither", "c": 0, "f": ""}], "e": " Ca<sup>2+</sup>: 20 − 2 = 18 electrons. Cl<sup>−</sup>: 17 + 1 = 18 electrons. Both are 2,8,8, like argon."}]];

let store = {};
try { store = JSON.parse(localStorage.getItem("mcq-"+TOPIC) || "{}"); } catch(e) { store = {}; }
function save(){ try { localStorage.setItem("mcq-"+TOPIC, JSON.stringify(store)); } catch(e) {} }

const orders = DATA.map(set => set.map(q => shuffle(q.o.map((_,i)=>i))));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

let cur = 0;
const tabs = document.getElementById("tabs"), main = document.getElementById("main");

function levelScore(l){
  const ans = store[l] || {}; let s=0, n=0;
  DATA[l].forEach((q,i)=>{ if(ans[i]!==undefined){ n++; if(q.o[ans[i]].c) s++; } });
  return {s,n};
}
function drawTabs(){
  tabs.innerHTML = "";
  LEVELS.forEach((L,l)=>{
    const b = document.createElement("button");
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", l===cur);
    b.style.setProperty("--c", L.col);
    const {s,n} = levelScore(l);
    b.innerHTML = `<span class="sc">${n? s+"/10":""}</span><span class="lv">${L.name}</span><span class="tier">${L.tier}</span>`;
    b.onclick = ()=>{ cur=l; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
}
function render(){
  const L = LEVELS[cur]; document.body.style.setProperty("--c", L.col);
  drawTabs();
  const ans = store[cur] || {};
  let h = `<div class="intro"><b>${L.name} · ${L.tier}.</b> ${L.intro} Your first click counts.</div>`;
  DATA[cur].forEach((q,i)=>{
    h += `<div class="q" id="q${i}"><div class="qhead"><span class="qn">Q${i+1}</span><span class="src">${q.s}</span></div><div class="stem">${q.q}</div><div class="opts">`;
    orders[cur][i].forEach((oi,k)=>{
      const o = q.o[oi]; let cls="";
      if(ans[i]!==undefined){ if(o.c) cls="right"; else if(ans[i]===oi) cls="wrong"; }
      h += `<button class="opt ${cls}" data-q="${i}" data-o="${oi}" ${ans[i]!==undefined?"disabled":""}><span class="let">${"ABCD"[k]}</span><span>${o.t}</span></button>`;
    });
    h += `</div><div class="fb" id="fb${i}"></div></div>`;
  });
  h += `<div class="done" id="done"></div>`;
  main.innerHTML = h;
  main.querySelectorAll(".opt").forEach(b=> b.onclick = ()=> choose(+b.dataset.q, +b.dataset.o));
  DATA[cur].forEach((q,i)=>{ if(ans[i]!==undefined) showFb(i, ans[i]); });
  update();
}
function choose(i, oi){
  store[cur] = store[cur] || {};
  if(store[cur][i]!==undefined) return;
  store[cur][i] = oi; save();
  const box = document.getElementById("q"+i);
  box.querySelectorAll(".opt").forEach(b=>{
    b.disabled = true; const o = DATA[cur][i].o[+b.dataset.o];
    if(o.c) b.classList.add("right"); else if(+b.dataset.o===oi) b.classList.add("wrong");
  });
  showFb(i, oi); update(); drawTabs();
}
function showFb(i, oi){
  const q = DATA[cur][i], o = q.o[oi], fb = document.getElementById("fb"+i);
  const right = q.o.find(x=>x.c);
  fb.className = "fb show " + (o.c ? "ok" : "no");
  fb.innerHTML = o.c
    ? `<b>Correct.</b>${q.e}`
    : `<b>Not quite – the answer is: ${right.t}</b>${o.f ? o.f+" " : ""}${q.e}`;
}
function update(){
  const {s,n} = levelScore(cur);
  document.getElementById("score").textContent = `${s} / 10`;
  document.getElementById("answered").textContent = `${n} answered`;
  document.getElementById("prog").style.width = (n*10)+"%";
  const done = document.getElementById("done");
  if(n===10){
    const ans = store[cur]; const wrong = DATA[cur].map((q,i)=>({q,i})).filter(x=>!x.q.o[ans[x.i]].c);
    let h = `<h2>${LEVELS[cur].name} done: ${s} / 10</h2>`;
    if(!wrong.length){ h += `<p>Full marks. ${cur<3 ? "Try "+LEVELS[cur+1].name+" next." : "Excellent work."}</p>`; }
    else {
      h += `<p>Copy these into your fix-it table: write the question in column 1, leave column 2 blank to answer next time, and copy the correct answer into column 3.</p>
      <table class="fix"><tr><th>Question</th><th>My answer next time</th><th>Correct answer</th></tr>`;
      wrong.forEach(x=>{ h += `<tr><td>${x.q.q.replace(/<table[\s\S]*?<\/table>/g," [see table] ")}</td><td></td><td>${x.q.o.find(o=>o.c).t}</td></tr>`; });
      h += `</table>`;
    }
    done.innerHTML = h; done.classList.add("show");
  } else done.classList.remove("show");
}
document.getElementById("reset").onclick = ()=>{
  delete store[cur]; save(); orders[cur] = DATA[cur].map(q=>shuffle(q.o.map((_,i)=>i))); render();
};
render();
</script>
